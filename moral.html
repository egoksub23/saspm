<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPM 2026 · Pendidikan Moral</title>

<style>
html{font-size:17px}
:root{
  --ink:#0B0E13; --panel:#141A25; --panel2:#182030; --line:#242E3E;
  --txt:#E9E7DC; --mut:#96A0AC; --dim:#6B7684;
  --fl:#C6F24E; --am:#FFB454; --vi:#9D8CFF; --okG:#57C76A; --badR:#FF6B6B;
  --onFl:#111; --dot:rgba(233,231,220,.03);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --disp:Georgia,'Times New Roman',serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
[data-theme="light"]{
  --ink:#F4F1E8; --panel:#FFFFFF; --panel2:#F7F5EE; --line:#E2DDCE;
  --txt:#171A21; --mut:#5C6674; --dim:#8A93A0;
  --fl:#5C7A00; --am:#A85F00; --vi:#5B44C7; --okG:#237A33; --badR:#C0292F;
  --onFl:#fff; --dot:rgba(0,0,0,.04);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--ink);color:var(--txt);font-family:var(--body);line-height:1.6;min-height:100vh;
  background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:32px 32px;
  -webkit-font-smoothing:antialiased}
::selection{background:var(--fl);color:var(--onFl)}
button,input,select{font-family:inherit;cursor:pointer;color:inherit}
a{color:var(--fl)}
.wrap{max-width:900px;margin:0 auto;padding:26px 20px 70px}

/* ---- top bar ---- */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:26px;flex-wrap:wrap}
.brand{font-family:var(--disp);font-weight:900;font-size:1.05rem;letter-spacing:-.01em;margin-right:auto;
  display:flex;align-items:center;gap:9px;background:transparent;border:0;padding:0;color:var(--txt);cursor:pointer}
.brand:hover b{filter:brightness(1.15)}
.brand:hover small{border-color:var(--fl);color:var(--fl)}
.brand b{color:var(--fl)}
.brand small{font-family:var(--mono);font-size:.56rem;letter-spacing:.18em;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:3px 7px;font-weight:400}
.home-crumb{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;color:var(--dim);text-decoration:none;white-space:nowrap}
.home-crumb:hover{color:var(--fl)}
.crumb-sep{color:var(--dim);font-size:.7rem;letter-spacing:.05em;user-select:none;padding:0 2px}
#breadSubj{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;color:var(--mut);white-space:nowrap;text-decoration:none}
#breadSubj:hover{color:var(--fl)}
.crumb-cur{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;color:var(--fl);white-space:nowrap}
.ghost{background:transparent;border:1px solid var(--line);color:var(--mut);font-family:var(--mono);
  font-size:.6rem;letter-spacing:.14em;padding:8px 13px;border-radius:100px;transition:.18s}
.ghost:hover{border-color:var(--fl);color:var(--fl)}
.ghost.on{border-color:var(--fl);color:var(--fl);background:color-mix(in srgb,var(--fl) 10%,transparent)}

/* ---- hero ---- */
.kick{font-family:var(--disp);font-size:clamp(1.8rem,5vw,3rem);font-weight:900;letter-spacing:.04em;color:var(--fl);text-align:center;margin-bottom:18px;line-height:1.08}
.sub{text-align:center;color:var(--mut);margin-top:0;font-size:.95rem;max-width:58ch;margin-inline:auto;line-height:1.65}
.sub em{font-style:normal;color:var(--txt);font-weight:600}

/* ---- panels ---- */
.card{border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden}
.sec{padding:18px 20px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.lab{font-family:var(--mono);font-size:.68rem;letter-spacing:.18em;color:var(--dim);margin-bottom:11px;display:flex;gap:10px;align-items:center}
.lab i{font-style:normal;color:var(--fl);cursor:pointer;border-bottom:1px dotted var(--fl)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{background:var(--panel2);border:1px solid var(--line);color:var(--mut);font-family:var(--mono);
  font-size:.73rem;letter-spacing:.08em;padding:8px 14px;border-radius:100px;transition:.16s;white-space:nowrap}
.chip:hover{border-color:var(--fl);color:var(--txt)}
.chip.on{border-color:var(--fl);color:var(--fl);background:color-mix(in srgb,var(--fl) 12%,transparent)}
.chip .n{color:var(--dim);margin-left:6px;font-size:.9em}
.chip.on .n{color:var(--fl);opacity:.75}
.chip.forecast{border-color:#E4499A;color:#E4499A}
.chip.forecast:hover{border-color:#E4499A;color:#E4499A;background:color-mix(in srgb,#E4499A 10%,transparent)}
.chip.forecast.on{border-color:#E4499A;color:#E4499A;background:color-mix(in srgb,#E4499A 18%,transparent)}
.chip.forecast .n{color:#E4499A;opacity:.65}
.chip.forecast.on .n{color:#E4499A;opacity:.8}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}

/* ---- start row ---- */
.startrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:18px 20px;background:var(--panel2)}
.cta{background:var(--fl);border:1px solid var(--fl);color:var(--onFl);font-family:var(--mono);font-weight:700;
  font-size:.72rem;letter-spacing:.16em;padding:14px 26px;border-radius:8px;transition:.18s}
.cta:hover{filter:brightness(1.08);transform:translateY(-1px)}
.cta:disabled{opacity:.35;cursor:not-allowed;transform:none}
.count{font-family:var(--mono);font-size:.68rem;color:var(--mut);margin-right:auto}
.count b{color:var(--fl);font-size:1.4rem;font-family:var(--disp);vertical-align:-2px;margin-right:4px}

/* ---- quiz ---- */
.top{padding:14px 20px;border-bottom:1px solid var(--line)}
.ctr-row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--mono);
  font-size:.66rem;letter-spacing:.14em;color:var(--fl);margin-bottom:10px;flex-wrap:wrap}
.ctr-row .r{display:flex;gap:14px;align-items:center;color:var(--mut)}
.ctr-row .r b{color:var(--fl)}
.ctr-row .r .warn{color:var(--badR)}
.pbar{height:5px;background:var(--line);border-radius:5px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--fl),var(--am));width:0;transition:width .3s}
.qbody{padding:24px 22px 26px}
.meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.tag{display:inline-block;font-family:var(--mono);font-size:.55rem;letter-spacing:.13em;border:1px solid var(--line);
  color:var(--mut);border-radius:5px;padding:4px 8px}
.tag.am{border-color:var(--am);color:var(--am)}
.tag.vi{border-color:var(--vi);color:var(--vi)}
.qq{font-family:var(--disp);font-size:1.16rem;font-weight:700;line-height:1.5;margin-bottom:8px}
.qq sub,.qq sup{font-size:.72em}
.qq table,.opt table{border-collapse:collapse;margin:12px 0;font-family:var(--body);font-size:.85rem;font-weight:400}
.qq th,.qq td,.opt th,.opt td{border:1px solid var(--line);padding:6px 11px;text-align:left}
.qq th{background:var(--panel2);font-family:var(--mono);font-size:.62rem;letter-spacing:.08em}
.qq .fig{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;color:var(--dim);font-weight:400}
.qlist{margin:8px 0 8px 20px;font-family:var(--body);font-size:.9rem;font-weight:400;line-height:1.65}
.stmt{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:14px}
.stmt-lbl{font-family:var(--mono);font-size:.58rem;font-weight:700;letter-spacing:.14em;color:var(--dim);margin-bottom:7px}
.stmt-item{font-family:var(--body);font-size:.93rem;font-weight:400;line-height:1.62;color:var(--body)}
.stmt-item+.stmt-item{margin-top:5px}
img{height:auto}.qq img,.qimg{max-width:100%;border:1px solid var(--line);border-radius:10px;margin:6px 0 16px;background:#fff}
.alt{font-size:.84rem;color:var(--dim);font-style:italic;margin:-2px 0 16px;font-family:var(--body);font-weight:400}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.opt{display:flex;gap:13px;align-items:flex-start;text-align:left;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;padding:12px 15px;color:var(--txt);font-size:.92rem;line-height:1.5;transition:border-color .16s,background .16s;width:100%}
.opt:not(:disabled):hover{border-color:var(--fl)}
.opt .k{font-family:var(--mono);font-size:.64rem;color:var(--dim);border:1px solid var(--line);border-radius:5px;
  padding:3px 8px;flex-shrink:0;margin-top:2px}
.opt.pick{border-color:var(--vi);background:color-mix(in srgb,var(--vi) 12%,transparent)}
.opt.pick .k{color:var(--vi);border-color:var(--vi)}
.opt.right{border-color:var(--okG);background:color-mix(in srgb,var(--okG) 14%,transparent)}
.opt.right .k{color:var(--okG);border-color:var(--okG)}
.opt.wrong{border-color:var(--badR);background:color-mix(in srgb,var(--badR) 12%,transparent);animation:shake .4s}
.opt.dim{opacity:.42}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.why{margin-top:18px;padding:14px 16px;border-left:3px solid var(--fl);
  background:color-mix(in srgb,var(--fl) 7%,transparent);font-size:.87rem;color:var(--mut);border-radius:0 8px 8px 0}
.why b{color:var(--fl);font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;display:block;margin-bottom:5px}
.why.none{border-left-color:var(--dim);background:transparent;color:var(--dim);font-style:italic}
.nav{margin-top:22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nav .sp{margin-left:auto}
.btn{background:transparent;border:1px solid var(--fl);color:var(--fl);font-family:var(--mono);font-size:.68rem;
  letter-spacing:.14em;padding:11px 19px;border-radius:7px;transition:.18s}
.btn:hover{background:var(--fl);color:var(--onFl)}
.btn.mutebtn{border-color:var(--line);color:var(--mut)}
.btn.mutebtn:hover{background:transparent;border-color:var(--mut);color:var(--txt)}
.btn.flag.on{border-color:var(--am);color:var(--am)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.hint{font-family:var(--mono);font-size:.56rem;letter-spacing:.12em;color:var(--dim);margin-top:14px}

/* ---- navigator ---- */
.navg{display:none;padding:16px 20px;border-top:1px solid var(--line);background:var(--panel2)}
.navg.show{display:block}
.navg .cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.cell{aspect-ratio:1;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--dim);
  font-family:var(--mono);font-size:.62rem;display:flex;align-items:center;justify-content:center;transition:.14s;position:relative}
.cell:hover{border-color:var(--fl);color:var(--fl)}
.cell.done{color:var(--txt);border-color:var(--mut)}
.cell.ok{border-color:var(--okG);color:var(--okG)}
.cell.no{border-color:var(--badR);color:var(--badR)}
.cell.cur{outline:2px solid var(--fl);outline-offset:1px}
.cell.flag::after{content:'';position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--am)}

/* ---- report ---- */
.res{text-align:center;padding:26px 20px 8px}
.res .score{font-family:var(--disp);font-weight:900;font-size:4rem;line-height:1}
.res .score span{font-size:1.5rem;color:var(--dim)}
.res .pc{font-family:var(--mono);font-size:.7rem;letter-spacing:.2em;color:var(--fl);margin-top:6px}
.res .msg{font-family:var(--disp);font-style:italic;font-size:1.15rem;margin-top:12px;color:var(--am);max-width:46ch;margin-inline:auto}
.brow{display:grid;grid-template-columns:minmax(96px,1.1fr) 2fr 88px;gap:11px;align-items:center;margin-bottom:9px;
  font-family:var(--mono);font-size:.62rem;color:var(--mut)}
.brow .tr{height:7px;background:var(--line);border-radius:5px;overflow:hidden}
.brow .fl{height:100%;background:var(--fl);border-radius:5px;transition:width .5s}
.brow .fl.mid{background:var(--am)} .brow .fl.low{background:var(--badR)}
.brow .v{text-align:right}
.rev{border-top:1px solid var(--line);padding:16px 20px}
.rq{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:9px;background:var(--panel2)}
.rq .h{font-family:var(--mono);font-size:.58rem;letter-spacing:.12em;color:var(--dim);margin-bottom:7px;display:flex;gap:9px;flex-wrap:wrap}
.rq .h b{color:var(--badR)} .rq .h b.ok{color:var(--okG)}
.rq .t{font-size:.9rem;margin-bottom:8px}
.rq .ans{font-family:var(--mono);font-size:.66rem;color:var(--mut);line-height:1.9}
.rq .ans em{font-style:normal;color:var(--okG)} .rq .ans s{color:var(--badR)}
.rq .w{margin-top:8px;font-size:.82rem;color:var(--mut);padding-left:11px;border-left:2px solid var(--line)}

/* ---- misc ---- */
.empty{text-align:center;padding:44px 24px;color:var(--mut);font-size:.9rem}
.empty code{font-family:var(--mono);font-size:.8rem;color:var(--fl);background:var(--panel2);padding:2px 7px;border-radius:5px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,80px);background:var(--panel);border:1px solid var(--fl);
  color:var(--fl);font-family:var(--mono);font-size:.64rem;letter-spacing:.12em;padding:11px 20px;border-radius:100px;
  transition:transform .3s;z-index:99;box-shadow:0 14px 34px rgba(0,0,0,.45)}
.toast.show{transform:translate(-50%,0)}
footer{text-align:center;padding:32px 20px;font-family:var(--mono);font-size:.58rem;letter-spacing:.18em;color:var(--dim)}
footer span{color:var(--fl)}
@media (max-width:560px){
  .wrap{padding:18px 14px 60px}
  .qbody{padding:20px 16px 22px}
  .brow{grid-template-columns:minmax(76px,1fr) 1.3fr 74px;font-size:.55rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.bar,.nav,.navg,footer,.startrow{display:none}}

/* ============================================================
   PAPER 2 — STRUCTURED QUESTIONS
   ============================================================ */
.p2parts{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.p2part{border:1px solid var(--line);border-radius:10px;background:var(--panel2);overflow:hidden}
.p2part-head{display:flex;gap:10px;align-items:baseline;padding:12px 15px}
.p2part-label{font-family:var(--mono);font-size:.7rem;font-weight:700;color:var(--fl);
  background:color-mix(in srgb,var(--fl) 12%,transparent);border-radius:5px;padding:3px 9px;
  flex-shrink:0;align-self:flex-start;margin-top:2px}
.p2part-q{font-size:.93rem;line-height:1.6;flex:1}
.p2part-m{font-family:var(--mono);font-size:.57rem;color:var(--dim);flex-shrink:0;
  border:1px solid var(--line);border-radius:4px;padding:2px 7px;margin-left:8px;align-self:flex-start;margin-top:4px}
.p2reveal-btn{width:100%;background:transparent;border:0;border-top:1px solid var(--line);
  color:var(--mut);font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;
  padding:9px 15px;text-align:left;display:flex;gap:8px;align-items:center;transition:.15s;cursor:pointer}
.p2reveal-btn:hover{background:color-mix(in srgb,var(--fl) 6%,transparent);color:var(--fl)}
.p2reveal-btn.open{color:var(--okG);border-top-color:color-mix(in srgb,var(--okG) 30%,var(--line))}
.p2reveal-btn .arr{transition:transform .2s}
.p2reveal-btn.open .arr{transform:rotate(180deg)}
.p2ans{padding:13px 15px;border-top:1px solid color-mix(in srgb,var(--okG) 30%,var(--line));
  background:color-mix(in srgb,var(--okG) 6%,transparent)}
.p2ans-lbl{font-family:var(--mono);font-size:.56rem;letter-spacing:.14em;color:var(--okG);margin-bottom:6px}
.p2ans-txt{font-size:.92rem;color:var(--txt);line-height:1.65}
.p2ans-note{font-family:var(--mono);font-size:.58rem;color:var(--am);margin-top:6px;
  padding:5px 10px;border:1px solid color-mix(in srgb,var(--am) 30%,transparent);border-radius:5px;display:inline-block}
.p2ans-img{max-width:100%;border:1px solid var(--line);border-radius:8px;margin-top:10px;background:#fff}
/* Reveal-all button */
.p2revall{background:transparent;border:1px solid var(--line);color:var(--mut);font-family:var(--mono);
  font-size:.6rem;letter-spacing:.12em;padding:8px 15px;border-radius:7px;margin-top:16px;transition:.15s;cursor:pointer}
.p2revall:hover{border-color:var(--fl);color:var(--fl)}
/* Self-mark panel */
.p2score{margin-top:24px;padding:16px 18px;border:1px solid color-mix(in srgb,var(--am) 40%,var(--line));
  border-radius:10px;background:color-mix(in srgb,var(--am) 5%,transparent)}
.p2score-lbl{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;color:var(--am);margin-bottom:10px}
.p2score-btns{display:flex;gap:8px;flex-wrap:wrap}
.p2sb{background:var(--panel2);border:1px solid var(--line);color:var(--mut);font-family:var(--mono);
  font-size:.62rem;letter-spacing:.1em;padding:9px 16px;border-radius:7px;transition:.15s;cursor:pointer}
.p2sb:hover{border-color:var(--fl);color:var(--txt)}
.p2sb.got{border-color:var(--okG)!important;color:var(--okG)!important;background:color-mix(in srgb,var(--okG) 10%,transparent)!important}
.p2sb.partly{border-color:var(--am)!important;color:var(--am)!important;background:color-mix(in srgb,var(--am) 10%,transparent)!important}
.p2sb.missed{border-color:var(--badR)!important;color:var(--badR)!important;background:color-mix(in srgb,var(--badR) 10%,transparent)!important}
/* P2 summary report */
.p2summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:18px 20px}
.p2stat{text-align:center;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.p2stat b{font-family:var(--disp);font-size:2.2rem;font-weight:900;display:block;line-height:1}
.p2stat.ok b{color:var(--okG)} .p2stat.ok{border-color:color-mix(in srgb,var(--okG) 30%,var(--line))}
.p2stat.mid b{color:var(--am)} .p2stat.mid{border-color:color-mix(in srgb,var(--am) 30%,var(--line))}
.p2stat.bad b{color:var(--badR)} .p2stat.bad{border-color:color-mix(in srgb,var(--badR) 30%,var(--line))}
.p2stat small{font-family:var(--mono);font-size:.56rem;letter-spacing:.14em;color:var(--dim);margin-top:4px;display:block}
/* Sejarah-compatible P2 classes */
.stim{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px 15px;font-size:.88rem;color:var(--mut);margin:4px 0 18px;line-height:1.65}
.stim table{border-collapse:collapse;width:100%;margin:8px 0;font-size:.82rem}
.stim th,.stim td{border:1px solid var(--line);padding:4px 8px;text-align:center}
.stim th{background:color-mix(in srgb,var(--line) 50%,var(--panel2));font-weight:600;text-align:center}
.stim svg{display:block;margin:6px auto;max-width:100%}
.kotak-grid{display:grid;gap:3px;margin:10px 0}
.kotak-cell{border:1px solid var(--line);padding:8px 12px;text-align:center;background:var(--panel);font-size:.86rem;font-weight:500;border-radius:4px}
.stim-block{background:color-mix(in srgb,var(--fl) 8%,transparent);border-left:3px solid var(--fl);border-radius:0 6px 6px 0;padding:7px 11px;margin:7px 0;font-size:.83rem;line-height:1.55}
.stim-lbl{font-family:var(--mono);font-size:.58rem;letter-spacing:.14em;color:var(--fl);margin-right:6px;display:inline-block}
.stim-ph{color:var(--dim);font-style:italic;font-size:.82rem;padding:4px 0}
.part{border:1px solid var(--line);border-radius:11px;padding:14px 15px;margin-bottom:11px;background:var(--panel)}
.part.ok{border-color:var(--okG)} .part.no{border-color:var(--badR)}
.pq{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;line-height:1.5}
.pq .pl{font-family:var(--mono);font-size:.7rem;color:var(--fl);flex-shrink:0;margin-top:2px}
.pq .pm{margin-left:auto;flex-shrink:0;font-family:var(--mono);font-size:.56rem;letter-spacing:.1em;color:var(--am);border:1px solid var(--am);border-radius:5px;padding:2px 7px;margin-top:2px;white-space:nowrap}
.reveal{margin-top:11px;padding:8px 14px;font-size:.6rem}
.pa{margin-top:11px;padding:11px 14px;border-left:3px solid var(--fl);background:color-mix(in srgb,var(--fl) 7%,transparent);border-radius:0 8px 8px 0}
.pts{margin:0;padding-left:18px;font-size:.88rem;line-height:1.6}
.pts li{margin:3px 0}
.pts-sub{margin:3px 0 6px;padding-left:16px;list-style:disc;color:var(--mut)}
.selfm{display:flex;gap:8px;align-items:center;margin-top:11px;flex-wrap:wrap;font-family:var(--mono);font-size:.56rem;letter-spacing:.12em;color:var(--dim)}

 — Isu Pelarian","title":"Isu Pelarian","stim":"Gambar berkaitan isu pelarian — pelarian di atas bot (Sumber: BERNAMA). Beratus-ratus pelarian terpaksa meninggalkan negara mereka akibat peperangan, konflik, dan bencana alam.","marks":10,"parts":[{"l":"a","q":"Tanpa bantuan orang ramai, kehidupan pelarian akan menghadapi masalah. Pada pendapat anda, mengapakah kita perlu membantu mangsa pelarian tersebut.","m":4,"a":[{"f":"Menunjukkan sikap prihatin dan kemanusiaan","h":["Mereka kehilangan tempat tinggal dan perlindungan akibat peperangan, konflik, bencana"]},{"f":"Memenuhi keperluan asas mereka","h":["Mereka memerlukan makanan, pakaian, rawatan untuk meneruskan hidup"]},{"f":"Mewujudkan keamanan dan keharmonian sejagat","h":["Mengurangkan penderitaan dan memupuk semangat perpaduan sejagat"]}]},{"l":"b","q":"Isu pelarian sering mendatangkan pelbagai masalah kepada negara kita. Jelaskan masalah yang dibawa oleh pelarian dari aspek-aspek di bawah.\n\nAspek ekonomi:\nAspek sosial:","m":4,"a":[{"f":"Aspek ekonomi","h":["Persaingan dalam perniagaan — menjejaskan perniagaan tempatan","Peluang pekerjaan — berebut peluang pekerjaan dengan rakyat tempatan","Menjejaskan pendapatan negara — hasil pendapatan pelarian dibawa ke luar negara"]},{"f":"Aspek sosial","h":["Penggunaan kemudahan awam — berebut penggunaan pengangkutan awam dengan rakyat tempatan","Peluang pendidikan — terutama dalam pengajian swasta","Mengganggu keselamatan awam — pendatang asing yang ramai menggugat keselamatan negara; sering berlaku pergaduhan dan pembunuhan"]}]},{"l":"c","q":"Pada pendapat anda, mengapakah pelarian melarikan diri dari negara asal mereka untuk mendapatkan perlindungan di negara lain?","m":2,"a":["Mendapat perlindungan — negara asal terlibat perang/bencana alam","Masalah ekonomi — kadar kemiskinan/taraf hidup rendah","(Max 2m)"]}]},{"n":4,"sec":"A","topic":"Kerjasama — Masyarakat Global","title":"Revolusi Pembuatan Kereta","stim":"Gambar di bawah menunjukkan perbezaan antara kereta dahulu dengan kereta sekarang. (Dahulu: kereta lama merah; Sekarang: kereta baru moden) — Sumber: www.google.com","marks":10,"parts":[{"l":"a","q":"Terangkan contoh kerjasama masyarakat global yang dijalankan berdasarkan gambar di atas.","m":2,"a":["Industri automobil / pembuatan kereta","Eksport kereta tempatan ke luar negara","(Terima jawapan di atas sahaja — Max 2m)"]},{"l":"b","q":"Senaraikan kepentingan revolusi pembuatan kereta kepada masyarakat global.","m":4,"a":["Meningkatkan teknologi pembuatan kereta","Meningkatkan ekonomi global","Berkongsi idea pembuatan kereta terkini","Melahirkan tenaga pakar lebih berkualiti","(Mana-mana jawapan munasabah — Max 4m)"]},{"l":"c","q":"Kerjasama masyarakat global banyak memberi manfaat kepada negara. Berikan ulasan anda.","m":4,"a":[{"f":"Negara akan dipandang tinggi / imej negara meningkat","h":["Mereka akan kagum dengan keupayaan negara di peringkat antarabangsa"]},{"f":"Ekonomi negara berkembang pesat","h":["Pendapatan negara meningkat kerana wujud perdagangan antarabangsa"]},{"f":"Mengukuhkan hubungan dalam pelbagai bidang","h":["Dapat berkongsi idea dan kemahiran"]}]}]},{"n":5,"sec":"A","topic":"Semangat Bermasyarakat — Sukan","title":"Atlet Paralimpik Negara","stim":"Pada tahun 2016, Malaysia telah meraih pingat emas pertama dalam pertandingan Sukan Paralimpik Rio de Janeiro. Manakala pada tahun 2020, Malaysia telah memenangi sebanyak 3 pingat emas dalam Sukan Paralimpik Musim Panas Tokyo. Kejayaan-kejayaan atlet paralimpik ini telah membakar semangat atlet kurang upaya untuk meraih kejayaan dalam acara sukan di peringkat antarabangsa. Terkini pada tahun 2023, Malaysia telah meraih 50 pingat emas dalam Sukan Para ASEAN Kemboja. (Sumber: http://www.google.com)","marks":10,"parts":[{"l":"a","q":"Kejayaan atlet kurang upaya di peringkat antarabangsa amat membanggakan. Cadangkan tiga bentuk pengiktirafan yang boleh diberikan kepada mereka.","m":3,"a":["Sijil penghargaan","Sumbangan wang tunai berdasarkan warna pingat","Penganugerahan pangkat/gelaran seperti Datuk","Dijadikan sebagai ikon sukan","Peluang pekerjaan","Rumah","Skim imbuhan kewangan","Kenaikan gaji/pendapatan","(Mana-mana jawapan munasabah — Max 3m)"]},{"l":"b","q":"Nyatakan TIGA cabaran untuk mengharumkan nama negara di persada dunia dalam bidang sukan.","m":3,"a":["Sumber kewangan terhad","Kekurangan jurulatih berpengalaman","Kemudahan infrastruktur sukan yang kurang/terhad","Fizikal yang lebih kecil berbanding peserta luar negara","Faktor cuaca sekiranya sukan berlangsung di luar negara","Sikap individualistik","(Mana-mana jawapan munasabah — Max 3m)"]},{"l":"c","q":"Rakyat Malaysia berlumba-lumba untuk memenangi pertandingan di peringkat antarabangsa dalam pelbagai bidang. Jelaskan kepentingan mengharumkan nama negara di persada dunia.","m":4,"a":[{"f":"Negara akan dipandang tinggi / imej negara meningkat","h":["Mereka akan kagum dengan keupayaan negara di peringkat antarabangsa"]},{"f":"Memperkenalkan negara kepada negara luar","h":["Menarik minat orang luar untuk mengenali negara dengan lebih dekat"]},{"f":"Mengukuhkan hubungan dalam pelbagai bidang","h":["Jurulatih luar berminat untuk melatih atlet negara kerana berbakat"]}]}]},{"n":6,"sec":"B","topic":"Kerjasama Antarabangsa — PBB","title":"Kerjasama Malaysia dengan PBB","note":"Bahagian B — Jawab SATU soalan sahaja (Soalan 6 atau Soalan 7)","stim":"Pertubuhan Bangsa-Bangsa Bersatu (PBB) ialah sebuah pertubuhan antarabangsa yang ditubuhkan pada 24 Oktober 1945. Matlamat utamanya adalah untuk memelihara keamanan dan keselamatan sejagat, mempromosikan hak asasi manusia, serta mengeratkan kerjasama antarabangsa. PBB beribu pejabat di New York, Amerika Syarikat, dan mempunyai 193 negara anggota. Malaysia secara rasmi menyertai pertubuhan ini sebagai negara anggota ke-92 pada tahun 1957. (Sumber: https://ms.wikipedia.org/wiki/Pertubuhan_Bangsa-Bangsa_Bersatu)","marks":10,"parts":[{"l":"a","q":"Senaraikan contoh agensi di bawah PBB.","m":2,"a":["FAO (Pertubuhan Makanan dan Pertanian)","ICAO (Pertubuhan Penerbangan Awam Antarabangsa)","IFAD (Tabung Antarabangsa bagi Pembangunan Pertanian)","ILO (Pertubuhan Buruh Antarabangsa)","IMF (Tabung Kewangan Antarabangsa)","IMO (Pertubuhan Maritim Antarabangsa)","ITU (Kesatuan Telekomunikasi Antarabangsa)","UNESCO (Pertubuhan Pendidikan, Sains dan Kebudayaan PBB)","UNIDO / WHO / WIPO / WMO / UN Tourism","(Max 2m — nyatakan mana-mana 2)"]},{"l":"b","q":"Malaysia sentiasa bekerjasama dengan PBB dalam pelbagai misi kemanusiaan dan keamanan antarabangsa. Huraikan kepentingan kerjasama Malaysia dengan PBB demi kesejahteraan masyarakat sejagat.","m":8,"kbat":true,"a":["Mengekalkan keamanan dan keselamatan sejagat","Memperjuangkan hak asasi manusia","Menyalurkan bantuan kemanusiaan kepada mangsa","Meningkatkan imej negara di peringkat antarabangsa","Mengeratkan hubungan diplomatik dengan negara lain","Membuktikan komitmen Malaysia terhadap tanggungjawab global","(Aras 4: 7-8m; Aras 3: 5-6m; Aras 2: 3-4m; Aras 1: 1-2m)"]}]},{"n":7,"sec":"B","topic":"Integriti — Amanah","title":"Dilema Lalissa — Integriti Individu","note":"Bahagian B — Jawab SATU soalan sahaja (Soalan 6 atau Soalan 7)","stim":"Lalissa memegang jawatan sebagai Bendahari Kelab Kebudayaan di sekolahnya. Dia merupakan seorang yang amanah dalam mengutip dan menyimpan yuran kelab. Suatu hari, ibu Lalissa terlibat dalam kemalangan. Keluarga Lalissa tidak mampu untuk membiayai kos rawatan ibunya.\n\nDisebabkan keadaan yang terdesak, Lalissa menggunakan duit kelabnya untuk membayar kos rawatan ibunya. Setelah mendapat wang daripada insurans perlindungan ibunya, Lalissa memulangkan sebahagian wang tersebut.","marks":10,"parts":[{"l":"a","q":"Wajarkah tindakan Lalissa tersebut? Berikan justifikasi anda berdasarkan penaakulan moral.","m":2,"a":["Tidak wajar","Hilang kepercayaan guru dan rakan terhadapnya","Tindakan tersebut salah di sisi undang-undang","Menjejaskan imej diri dan keluarga","(Max 2m)"]},{"l":"b","q":"Integriti harus dipupuk dalam diri setiap individu bagi melahirkan insan yang amanah dan jujur dalam setiap perlakuan. Huraikan kepentingan integriti individu dalam kehidupan harian.","m":8,"kbat":true,"a":[{"f":"Dipecat daripada jawatannya / masa hadapan terjejas","h":["Dijauhi oleh rakan-rakan","Dipersenda atau dihina oleh rakan","Mengalami trauma"]},{"f":"Menjejaskan imej diri dan keluarga","h":["Hidup dalam keadaan tertekan","Menjejaskan institusi kekeluargaan","Berlaku pergaduhan anggota-anggota keluarga","Maruah diri dan keluarga tercalar"]}]}]},{"n":8,"sec":"C","topic":"Patriotisme — Kedaulatan Negara","title":"Mempertahankan Kedaulatan Negara","stim":"Langkah mempertahankan kedaulatan negara menjadi tanggungjawab setiap warganegara. Kedaulatan negara diperoleh daripada hasil perjuangan dan pengorbanan generasi dahulu. Generasi sekarang haruslah memahami kepentingan mempertahankan kedaulatan negara yang dinikmati.","marks":20,"parts":[{"l":"a","q":"Senaraikan ciri negara berdaulat.","m":4,"a":["Merdeka","Beridentiti nasional","Bermaruah dan berwibawa","Berstruktur pemerintahan sendiri","Bebas daripada pengaruh luar","(Max 4m)"]},{"l":"b","q":"Sebagai rakyat Malaysia yang berjiwa merdeka, huraikan tindakan yang patut diambil bagi menangani isu-isu yang menggugat kedaulatan negara. Jawapan anda perlu disokong dengan nilai-nilai universal.","m":8,"kbat":true,"a":[{"f":"Meningkatkan semangat cinta akan negara [Nilai: Patriotisme]","h":["Rakyat harus memuliakan lambang-lambang negara","Taat setia kepada raja dan negara dan tidak mengkhianati negara","Penekanan Pendidikan Sivik dan Sejarah","Penguatkuasaan undang-undang seperti Akta Hasutan","Bersedia berkorban demi kedaulatan negara"]},{"f":"Tingkatkan perpaduan dalam negara [Nilai: Toleransi, Betanggungjawab, Rasional]","h":["Rakyat harus menerima dan menghargai agama dan kepercayaan semua kaum","Rakyat haruslah belajar hidup bertolak ansur untuk mengelakkan pertelingkahan demi kesejahteraan negara","Perpaduan antara kaum penting bagi membentuk semangat nasionalisme agar rakyat Malaysia dapat bersatu-padu","Perpaduan membawa kepada pembangunan dan kemajuan negara"]}]},{"l":"c","q":"Terangkan cabaran yang boleh menggugat usaha untuk mengekalkan kedaulatan negara.","m":8,"kbat":true,"a":[{"f":"Generasi muda kurang semangat cinta akan negara","h":["Generasi muda tidak pernah merasai kesusahan hidup semasa zaman penjajahan dulu","Mereka dilimpahi dengan nikmat dan kesenangan sehingga tidak lagi menitikberatkan semangat nasionalisme","Contohnya, golongan muda kini hanya pentingkan kerjaya dan lebih mudah berhijrah ke negara asing jika mendapat tawaran gaji yang lebih lumayan"]},{"f":"Taraf ekonomi dan sosial yang tidak seimbang rakyat Malaysia","h":["Jurang sosioekonomi antara kaum di Malaysia agak ketara","Jurang sosioekonomi antara penduduk bandar dan luar bandar","Wujud ketidakpuasan dalam kalangan masyarakat dalam pelbagai bidang seperti peluang Pendidikan dan pekerjaan"]}]}]},{"n":9,"sec":"C","topic":"Semangat Bermasyarakat — Program Komuniti","title":"Program Komuniti dan Kesejahteraan Bersama","stim":"Teliti maklumat di bawah dan jawab soalan yang diberikan.\n\nProgram Khidmat Bantu Di Rumah (KBDR) — 'Sentuhan Kasih, Membawa Sinar Harapan'\nAnjuran: Jabatan Kebajikan Masyarakat (JKM) dengan kerjasama Kementerian Pembangunan Wanita, Keluarga dan Masyarakat (KPWKM)\n\nSasaran: Warga emas yang tinggal bersendirian; Orang Kurang Upaya (OKU) yang memerlukan sokongan; Keluarga yang memerlukan bantuan penjagaan ahli keluarga.\n\nObjektif Program: Aktiviti Sosial & Sokongan Emosi (Menemani dan bersembang untuk menceriakan hari mereka); Bantuan Fizikal Ringan (Membantu mengemas rumah dan pengurusan diri mereka); Urusan Kesihatan (Membantu mengiringi klien ke klinik atau hospital untuk rawatan).","marks":20,"parts":[{"l":"a","q":"Selain program di atas, berikan contoh aktiviti komuniti yang boleh dilaksanakan demi kesejahteraan bersama.","m":4,"a":["Aktiviti gotong royong Perdana / Program Kitar Semula","Aktiviti Bank Makanan","Aktiviti Kunjungan Kasih / Program Sukarelawan","Program Rukun Tetangga","Aktiviti Sukaneka / Aktiviti Senaman","Aktiviti Saringan Kesihatan Percuma / Program Derma Darah","(Mana-mana jawapan yang munasabah — Max 4m)"]},{"l":"b","q":"Ramalkan kesan jika kurangnya penglibatan masyarakat dalam program seperti di atas.","m":8,"kbat":true,"a":[{"f":"Kesihatan mental dan emosi terjejas [Watak: warga tua/golongan tua]","h":["Golongan tua akan berasa terpinggir","Mengalami sindrom pengasingan diri/kemurungan kritikal","Menarik diri daripada komuniti/tidak mahu berinteraksi","Hidup dalam ketakutan dan kebimbangan"]},{"f":"Boleh menjejaskan pembangunan negara","h":["Beban kerajaan bertambah untuk membantu golongan tersebut","Menyalurkan banyak dana untuk rawatan perubatan","Pusat jagaan kerajaan dan swasta mengalami lambakan permohonan kemasukan"]},{"f":"Kesihatan fizikal dan keselamatan terancam/terjejas","h":["Tidak mendapat rawatan berkala/tiada pemantauan khusus","Gagal ikuti temujanji susulan/pengambilan ubat-ubatan tidak disambung","Kecederaan akibat pingsan atau terjatuh","Masalah malnutrisi akibat pemakanan tidak seimbang"]}]},{"l":"c","q":"Bersetujukah anda bahawa penglibatan diri dalam program komuniti sangat penting untuk mengatasi masalah yang dihadapi oleh negara kita? Justifikasikan jawapan anda berdasarkan nilai-nilai universal yang telah dipelajari.","m":8,"kbat":true,"a":[{"f":"Mengurangkan kes gejala sosial dan jenayah [Nilai: Kerjasama, Bertanggungjawab, Kasih Sayang] — Setuju","h":["Membantu memantau kes negatif/pengawasan kejiranan","Ambil berat situasi sekeliling","Kes dilaporkan lebih awal","Mengurangkan niat negatif/cubaan melakukan kes jenayah"]},{"f":"Mengukuhkan perpaduan","h":["Memupuk sikap tolong menolong","Interaksi antara satu sama lain membina rasa cinta/tolak ansur","Membina jaringan keselamatan sosial/rasa percaya antara satu sama lain"]},{"f":"Mengurangkan beban kerajaan","h":["Memupuk sikap sukarelawan/membantu mangsa bencana","Bantuan dapat disalurkan lebih awal/cepat","Kebajikan mangsa lebih terjamin","Agihan bantuan lebih banyak dan pelbagai"]}]}]}]});

{n:1,sec:"A",topic:"Norma dan Adat Resam — Warisan Budaya Generasi Muda",title:"Remaja Melupakan Adat Resam Kaum",stim:"Era modenisasi dan kemajuan teknologi telah mengubah cara hidup manusia. Walau bagaimanapun, kebelakangan ini, ramai remaja dilihat semakin melupakan adat resam dan tradisi kaum masing-masing. Ada dalam kalangan mereka yang berasa malu dan menganggap amalan seperti memakai pakaian tradisional, makan menggunakan tangan, atau menunduk hormat apabila berselisih dengan orang tua sebagai 'ketinggalan zaman' (kolot). Sebaliknya, mereka lebih selesa mengagungkan gaya hidup dan budaya Barat dalam kehidupan seharian.",marks:10,parts:[
  {l:"(a)",q:"Wajarkah remaja menganggap adat resam dan tradisi kaum sebagai sesuatu yang 'ketinggalan zaman'? Berikan alasan anda.",m:2,a:["TIDAK WAJAR. Adat resam merupakan identiti dan kebanggaan sesuatu kaum.","Alasan lain diterima: Adat resam ialah warisan berharga nenek moyang kita."],kbat:false},
  {l:"(b)",q:"Jelaskan perasaan anda apabila melihat warisan adat resam bangsa semakin dilupakan oleh generasi muda.",m:3,a:["Emosi: Saya berasa sangat sedih dan kecewa. [1m]","Alasan 1: Warisan budaya yang dijaga oleh nenek moyang kita selama ini akan hilang begitu sahaja. [1m]","Alasan 2: Generasi akan datang tidak lagi kenal akan asal usul keturunan mereka sendiri. [1m]"],kbat:false},
  {l:"(c)",q:"Sebagai seorang remaja yang menghargai warisan bangsa, terangkan cara anda mengekalkan adat resam dan tradisi kaum anda supaya tidak pupus ditelan zaman.",m:3,a:["Memakai pakaian tradisional dengan rasa bangga terutamanya pada musim perayaan. [1m]","Belajar cara-cara memasak makanan tradisional bangsa saya daripada ibu bapa di rumah. [1m]","Menggunakan media sosial seperti TikTok untuk mempromosikan keunikan budaya kaum saya kepada rakan-rakan yang lain. [1m]","(Pilih mana-mana 3)"],kbat:true},
  {l:"(d)",q:"Nyatakan dua nilai universal yang patut diamalkan oleh remaja masa kini terhadap adat resam masyarakat majmuk.",m:2,a:["Nilai Hormat [1m]","Nilai Rasional [1m]","(Boleh juga: Nilai Harga Diri / Nilai Bertanggungjawab)"],kbat:false}
]},
{n:2,sec:"A",topic:"Pengurusan Masa — Ketidakpatuhan Masa Farid",title:"Farid Leka Bermain Permainan Video",stim:"Rakan sekelas anda, Farid, sering datang lewat ke sekolah. Selain itu, dia juga kerap kali gagal menyiapkan kerja sekolah dan kerja kursus pada tarikh yang ditetapkan oleh guru. Apabila ditanya, Farid memberikan alasan bahawa dia terlalu leka bermain permainan video (game) di telefon pintarnya sehingga lewat malam. Akibat sikapnya yang suka membuang masa ini, prestasi akademiknya merosot teruk dan dia sering dipanggil oleh guru disiplin.",marks:10,parts:[
  {l:"(a)",q:"Berdasarkan petikan, nyatakan dua kesan buruk sikap ketidakpatuhan masa tersebut terhadap Farid.",m:2,a:["Prestasi pelajarannya akan semakin merosot. [1m]","Akan dikenakan tindakan disiplin oleh pihak sekolah kerana sering datang lewat. [1m]"],kbat:false},
  {l:"(b)",q:"Wajarkah sikap yang ditunjukkan oleh Farid sebagai seorang murid? Berikan alasan anda.",m:2,a:["TIDAK WAJAR. Masa itu emas dan perbuatan membuang masa hanya akan menyusahkan dirinya sendiri pada masa hadapan. [2m]"],kbat:false},
  {l:"(c)",q:"Jelaskan perasaan anda apabila melihat rakan anda mensia-siakan masa mudanya dengan perkara yang tidak berfaedah.",m:3,a:["Emosi: Saya berasa sangat sedih dan kecewa melihat sikap Farid. [1m]","Alasan 1: Dia mensia-siakan peluang remajanya untuk menuntut ilmu. [1m]","Alasan 2: Saya juga bimbang dia akan keciciran dalam pelajaran dan sukar mendapat pekerjaan kelak. [1m]"],kbat:false},
  {l:"(d)",q:"Sebagai rakan yang prihatin, terangkan cara-cara yang boleh anda lakukan untuk membantu Farid menguruskan masanya dengan lebih baik.",m:3,a:["Menasihatinya secara peribadi supaya mengurangkan masa bermain permainan video pada waktu malam. [1m]","Membantu Farid membuat satu jadual waktu harian yang teratur. [1m]","Mengajaknya mengulang kaji pelajaran bersama-sama di perpustakaan agar masanya terisi dengan aktiviti berfaedah. [1m]","(Pilih mana-mana 3)"],kbat:true}
]},
{n:3,sec:"A",topic:"Semangat Bermasyarakat — Kesukarelawanan Remaja",title:"Remaja Kurang Melibatkan Diri dalam Kerja Amal",stim:"Pada masa kini, penglibatan remaja dalam aktiviti kerja amal dan bakti di dalam masyarakat dilihat semakin merosot. Kebanyakan remaja lebih gemar menghabiskan masa lapang mereka dengan aktiviti yang bersifat peribadi seperti bermain permainan video atau melayari media sosial. Mereka sering memberi alasan bahawa aktiviti kemasyarakatan adalah sesuatu yang membosankan dan membuang masa. Tanpa kesedaran tentang kepentingan berbakti, nilai perikemanusiaan dan semangat kerjasama dalam diri remaja akan semakin pudar.",marks:10,parts:[
  {l:"(a)",q:"Jelaskan dua kesan sekiranya remaja terus kurang melibatkan diri dalam aktiviti kerja amal.",m:2,a:["Semangat kerjasama dalam diri remaja akan semakin pudar. [1m]","Remaja menjadi bersikap individualistik (mementingkan diri sendiri). [1m]","Nilai perikemanusiaan tidak dapat dipupuk dalam diri remaja. [1m]","(Pilih mana-mana 2)"],kbat:false},
  {l:"(b)",q:"Mengapakah ramai remaja pada masa kini kurang berminat untuk menyertai aktiviti kesukarelawanan?",m:2,a:["Mereka lebih suka menghabiskan masa dengan gajet atau media sosial. [1m]","Mereka menganggap aktiviti tersebut membosankan dan membuang masa. [1m]","Kurang pendedahan dan galakan daripada ibu bapa atau pihak sekolah. [1m]","(Pilih mana-mana 2)"],kbat:false},
  {l:"(c)",q:"Jelaskan perasaan anda apabila melihat segelintir rakan sebaya anda langsung tidak mahu membantu masyarakat yang dalam kesusahan.",m:3,a:["Emosi: Saya berasa sangat sedih dan kecewa. [1m]","Alasan 1: Perasaan ini timbul kerana mereka tidak mempunyai sikap perikemanusiaan terhadap orang lain. [1m]","Alasan 2: Saya juga bimbang mereka akan membesar menjadi insan yang sombong dan tidak peduli tentang masyarakat. [1m]"],kbat:false},
  {l:"(d)",q:"Sebagai seorang remaja yang berhemah, cadangkan langkah-langkah yang boleh dilakukan oleh pihak sekolah untuk menarik minat murid menyertai aktiviti kerja amal.",m:3,a:["Pihak sekolah perlu memberikan markah kokurikulum yang lebih tinggi kepada murid yang aktif dalam kerja amal. [1m]","Pihak sekolah boleh menganjurkan program khidmat masyarakat yang lebih menarik dan menyeronokkan. [1m]","Pihak sekolah perlu memberikan sijil penghargaan atau hadiah kepada murid yang menyertai aktiviti amal. [1m]","Guru boleh membawa murid menyertai lawatan sambil belajar ke rumah orang tua atau anak yatim untuk membuka mata mereka. [1m]","(Pilih mana-mana 3)"],kbat:true}
]},
{n:4,sec:"A",topic:"Patriotisme — Keselamatan Kawasan Sempadan Negara",title:"Ancaman Keselamatan di Kawasan Sempadan",stim:"Sempadan negara yang luas, baik di daratan mahupun di perairan, sering kali menjadi titik panas bagi aktiviti jenayah rentas sempadan. Pencerobohan oleh pendatang asing tanpa izin (PATI), aktiviti penyeludupan barangan terlarang, serta ancaman daripada kumpulan pengganas yang cuba menyusup masuk adalah antara isu utama yang menggugat kedaulatan negara. Pihak berkuasa seperti Polis Diraja Malaysia (PDRM) dan Agensi Kawalan Sempadan Malaysia (AKSEM) sering mengadakan rondaan, namun cabaran geografi yang mencabar menjadikan tugas memantau setiap inci sempadan negara bukanlah satu tugas yang mudah.",marks:10,parts:[
  {l:"(a)",q:"Berdasarkan petikan, nyatakan dua aktiviti jenayah yang mengancam keselamatan negara di kawasan sempadan.",m:2,a:["Pencerobohan oleh pendatang asing tanpa izin (PATI). [1m]","Aktiviti penyeludupan barangan terlarang. [1m]","Ancaman daripada kumpulan pengganas. [1m]","(Pilih mana-mana 2)"],kbat:false},
  {l:"(b)",q:"Pada pendapat anda, mengapakah aktiviti penyeludupan di kawasan sempadan sukar dibanteras sepenuhnya? Berikan dua alasan.",m:2,a:["Kawasan sempadan negara yang terlalu luas untuk dipantau sepenuhnya. [1m]","Kawasan geografi yang mencabar seperti hutan tebal dan laut yang luas. [1m]","Adanya bantuan daripada penduduk tempatan yang bersubahat dengan penyeludup. [1m]","(Pilih mana-mana 2)"],kbat:true},
  {l:"(c)",q:"Jelaskan perasaan anda apabila mengetahui terdapat segelintir rakyat tempatan yang bersubahat dengan sindiket penyeludupan demi keuntungan peribadi.",m:3,a:["Emosi: Saya berasa sangat marah dan kecewa. [1m]","Alasan 1: Tindakan mereka telah mengkhianati amanah dan sanggup menggadaikan keselamatan negara demi duit. [1m]","Alasan 2: Perbuatan mereka sangat tidak bertanggungjawab kerana memudahkan penjenayah masuk ke dalam negara kita. [1m]"],kbat:false},
  {l:"(d)",q:"Sebagai rakyat yang patriotik, cadangkan tindakan yang boleh anda lakukan bagi membantu pihak berkuasa membendung ancaman keselamatan di kawasan sempadan.",m:3,a:["Segera melaporkan kepada pihak polis jika melihat orang asing yang mencurigai di kawasan tempat tinggal saya. [1m]","Sentiasa menyokong usaha kerajaan dengan tidak menyebarkan maklumat palsu tentang keselamatan negara di media sosial. [1m]","Menyertai program kesedaran keselamatan negara atau ceramah patriotisme untuk menambah ilmu tentang ancaman semasa. [1m]","Menasihati rakan-rakan agar tidak membeli barangan seludup kerana itu menyokong aktiviti haram tersebut. [1m]","(Pilih mana-mana 3)"],kbat:true}
]},
{n:5,sec:"A",topic:"Prihatin — Golongan Gelandangan dan OKU",title:"Golongan Gelandangan dan Orang Kurang Upaya (OKU)",stim:"Golongan gelandangan dan Orang Kurang Upaya (OKU) merupakan kelompok masyarakat yang sering terpinggir daripada arus perdana. Kebanyakan daripada mereka hidup dalam serba kekurangan dan sangat memerlukan bantuan serta sokongan daripada masyarakat sekeliling. Namun, segelintir masyarakat masih memandang serong dan mengabaikan kebajikan golongan ini. Sikap tidak peduli ini menyebabkan nasib mereka terus terabai.",marks:10,parts:[
  {l:"(a)",q:"Berikan dua contoh bantuan yang boleh diberikan oleh masyarakat kepada golongan gelandangan.",m:2,a:["Menyumbang makanan dan minuman yang bersih. [1m]","Memberi pakaian terpakai yang masih elok. [1m]"],kbat:false},
  {l:"(b)",q:"Apakah cabaran yang dihadapi oleh golongan OKU untuk menjalani kehidupan harian yang normal?",m:2,a:["Mempunyai pergerakan yang terhad atau sukar bergerak. [1m]","Sukar untuk mendapat pekerjaan kerana dipandang rendah oleh majikan. [1m]"],kbat:false},
  {l:"(c)",q:"Jelaskan kepentingan sikap prihatin masyarakat terhadap golongan gelandangan dan OKU.",m:3,a:["Dapat meringankan beban hidup yang ditanggung oleh mereka. [1m]","Dapat mengelakkan golongan ini daripada berasa disisihkan oleh masyarakat. [1m]","(Cadangan jawapan munasabah lain diterima — Pilih 3 isi/penjelasan)"],kbat:false},
  {l:"(d)",q:"Jelaskan nilai universal yang patut diamalkan oleh masyarakat untuk membantu meningkatkan kualiti hidup golongan gelandangan dan OKU.",m:3,a:["Fakta: Nilai Baik Hati bermaksud sikap peka terhadap keperluan dan kebajikan orang lain dengan memberi bantuan secara ikhlas. [1m]","Huraian: Masyarakat yang mengamalkan nilai ini akan sentiasa menghulurkan bantuan sokongan moral seperti melayan golongan gelandangan dan OKU dengan penuh sopan santun. [1m]","Huraian: Selain itu, kita akan lebih prihatin dengan menyediakan keperluan asas seperti makanan dan tempat perlindungan kepada gelandangan tanpa mengharapkan sebarang balasan. [1m]","Kesimpulan/Kesan: Sikap ini sangat penting supaya golongan gelandangan dan OKU berasa dihargai, seterusnya membantu meningkatkan kualiti hidup mereka agar lebih terbela. [1m]","(Pilih mana-mana 3)"],kbat:true}
]},
{n:6,sec:"B",topic:"Perikemanusiaan — Bantuan Mangsa Bencana Alam",title:"Bencana Alam — Mangsa Banjir",stim:"[Gambar 1 — banjir melanda kawasan perumahan] Bencana alam seperti banjir dan kebakaran sering kali menyebabkan mangsa kehilangan tempat tinggal dan harta benda dalam sekelip mata. Masyarakat perlu bangkit untuk menghulurkan bantuan bagi memastikan kelangsungan hidup mereka terjaga.",marks:10,note:"Bahagian B — Jawab SATU soalan sahaja (Soalan 6 atau Soalan 7)",parts:[
  {l:"(a)",q:"Huraikan kepentingan amalan memberi bantuan kepada mangsa bencana alam.",m:5,a:["Membantu mangsa untuk mendapatkan keperluan asas seperti makanan, minuman, dan pakaian dengan segera. [1m]","Dapat mengurangkan beban kewangan yang ditanggung oleh mangsa akibat kehilangan harta benda. [1m]","Membantu menenangkan emosi dan memberi sokongan moral kepada mangsa agar mereka tidak terlalu berasa sedih. [1m]","Dapat memupuk semangat perpaduan dan kerjasama antara masyarakat tanpa mengira kaum. [1m]","Menunjukkan sifat perikemanusiaan dan keprihatinan masyarakat terhadap kesusahan orang lain. [1m]"],kbat:false},
  {l:"(b)",q:"Berdasarkan nilai universal yang dipelajari, bagaimanakah anda boleh mengajak rakan-rakan untuk menyertai misi bantuan kemanusiaan tersebut?",m:5,a:["Nilai: Bertanggungjawab / Kasih Sayang / Kerjasama [1m]","Berkongsi maklumat tentang misi bantuan tersebut di media sosial untuk menarik minat rakan-rakan. [1m]","Mengajak rakan-rakan untuk menderma barang keperluan harian seperti makanan kering atau pakaian terpakai. [1m]","Menerangkan kepada rakan tentang kesusahan yang dihadapi mangsa supaya mereka berasa simpati. [1m]","Mendaftar sebagai sukarelawan bersama-sama dengan rakan agar kita boleh bergerak dalam kumpulan yang lebih besar. [1m]"],kbat:true}
]},
{n:7,sec:"B",topic:"Pengurusan Kewangan — Kesederhanaan dan Tanggungjawab",title:"Puan Maria dan Masalah Kad Kredit",stim:"[Gambar 2 — wanita duduk tertekan di depan komputer dengan banyak penyata bank dan kad kredit] Puan Maria sering menggunakan kad kredit secara tidak terkawal untuk membeli-belah barangan berjenama mewah serta barangan kelengkapan rumah secara dalam talian demi mengekalkan imejnya di media sosial. Akibatnya, beliau kini hanya mampu membuat bayaran minimum bulanan bagi kad kreditnya dan mula dikejar oleh pihak bank kerana tunggakan yang semakin meningkat.",marks:10,note:"Bahagian B — Jawab SATU soalan sahaja (Soalan 6 atau Soalan 7)",parts:[
  {l:"(a)",q:"Wajarkah tindakan Puan Maria? Berikan hujah anda berdasarkan nilai universal yang telah dipelajari.",m:5,a:["Pendirian: TIDAK WAJAR. [1m]","Nilai Universal: Nilai Kesederhanaan / Nilai Bertanggungjawab (pilih satu). [1m]","Fakta: Puan Maria berbelanja melebihi kemampuan kewangan diri sendiri. [1m]","Huraian: Beliau terlalu mementingkan imej mewah di media sosial berbanding keperluan hidup sebenar. [1m]","Kesan: Akibatnya, beliau kini terpaksa menanggung hutang yang banyak dan mengalami tekanan perasaan yang teruk apabila sering dikejar oleh pihak bank. [1m]"],kbat:true},
  {l:"(b)",q:"Sebagai rakan yang prihatin, terangkan tindakan yang boleh anda syorkan kepada Puan Maria untuk menyelesaikan masalah kewangan yang dihadapinya.",m:5,a:["Mencadangkan Puan Maria supaya berhenti menggunakan kad kredit untuk membeli barang yang tidak perlu — langkah ini penting untuk mengelakkan tunggakan hutang daripada terus meningkat. [1m+1m]","Menyarankan beliau berjumpa dengan pihak bank untuk berbincang mengenai penyusunan semula jadual pembayaran hutang — ini membolehkan beliau membayar hutang secara ansuran yang lebih kecil mengikut kemampuan kewangan semasa. [1m+1m]","Menyarankan beliau untuk membuat bajet bulanan yang lebih ketat dengan mendahulukan keperluan asas sebelum kehendak. [1m]","(2 tindakan × 2m + 1 tindakan = 5m — Fakta tindakan [1m] + Huraian/alasan [1m])"],kbat:true}
]},
{n:8,sec:"C",topic:"Warisan Budaya — Permainan Tradisional Masyarakat Majmuk",title:"Kepentingan Mengekalkan Permainan Tradisional",stim:"[Gambar — kanak-kanak bermain permainan tradisional (congkak, batu seremban, sepak raga)] Permainan tradisional seperti congkak, batu seremban, sepak raga, tarian naga, dan kabaddi merupakan khazanah warisan yang melambangkan keunikan identity masyarakat majmuk di Malaysia. Namun begitu, dalam meniti arus pemodenan, permainan ini didapati semakin dipinggirkan oleh generasi muda. Lambakan teknologi dan kegilaan terhadap gajet menyebabkan ramai remaja masa kini menganggap permainan tradisional sebagai sesuatu yang membosankan dan 'ketinggalan zaman'. Sekiranya keadaan ini dibiarkan, keunikan budaya silang kaum yang menjadi ejen perpaduan di Malaysia akan lenyap ditelan zaman.",marks:20,parts:[
  {l:"(a)",q:"Jelaskan kepentingan mengekalkan permainan tradisional yang bercirikan pelbagai budaya kepada keharmonian masyarakat majmuk.",m:5,a:["Merapatkan hubungan silaturahim antara kaum di Malaysia (permainan dimainkan secara berkumpulan yang memerlukan interaksi sosial). [1m]","Memupuk semangat perpaduan dan kerjasama yang erat apabila pemain yang berbeza latar belakang bekerjasama untuk memenangi sesuatu permainan. [1m]","Mengekalkan identiti budaya bangsa agar keunikan masyarakat majmuk di Malaysia sentiasa dihormati. [1m]","Mengelakkan konflik perkauman kerana masyarakat saling menghargai warisan budaya kaum lain. [1m]","(Pilih 5 isi/penjelasan)"],kbat:false},
  {l:"(b)",q:"Huraikan perasaan anda apabila melihat generasi muda masa kini lebih mengagungkan gajet berbanding permainan warisan tradisi kaum mereka sendiri. Berikan alasan anda.",m:5,a:["Emosi: Saya berasa sangat sedih dan bimbang melihat situasi ini. [1m]","Alasan 1: Gajet telah menyebabkan remaja menjadi bersikap individualistik dan kurang bergaul dengan orang sekeliling. [1m]","Alasan 2: Warisan nenek moyang yang melambangkan identiti bangsa kita akan pupus ditelan zaman jika tidak dipertahankan oleh generasi muda. [1m]","Alasan 3: Keadaan ini amat merisaukan kerana kekurangan interaksi fizikal silang budaya boleh menyebabkan semangat perpaduan kaum dalam kalangan generasi baru menjadi semakin longgar. [1m]","(1 emosi + pilih 4 alasan = 5m)"],kbat:false},
  {l:"(c)",q:"Sebagai seorang remaja yang prihatin, terangkan tindakan yang boleh anda lakukan untuk menarik minat rakan sebaya yang berbilang kaum agar bersama-sama memelihara permainan tradisional.",m:5,a:["Mengajak rakan-rakan berbilang kaum untuk bermain bersama-sama pada waktu petang seperti bermain galah panjang atau batu seremban. [1m]","Menggunakan media sosial untuk memuat naik video tutorial cara bermain permainan tradisional yang menarik bagi membuka mata rakan-rakan. [1m]","Mengajar teknik permainan yang betul kepada rakan yang tidak tahu supaya mereka berasa seronok untuk mencuba. [1m]","Menjadikan set permainan tradisional yang comel sebagai hadiah hari jadi untuk rakan-rakan bagi memupuk minat mereka secara halus. [1m]","(Pilih mana-mana 5)"],kbat:true},
  {l:"(d)",q:"Nyatakan peranan yang wajar dimainkan oleh pihak sekolah dengan sokongan agensi kerajaan bagi menyemarakkan semula permainan tradisional di peringkat sekolah.",m:5,a:["Menubuhkan Kelab Permainan Tradisional sebagai salah satu aktiviti kokurikulum yang wajib di sekolah. [1m]","Bekerjasama dengan Jabatan Kebudayaan dan Kesenian Negara untuk menganjurkan Karnival Permainan Tradisional di peringkat sekolah. [1m]","Menyediakan fasiliti atau gelanggang khas di kawasan sekolah supaya murid-murid dapat bermain dengan selamat pada waktu rehat atau selepas sesi persekolahan. [1m]","(Pilih mana-mana 5)"],kbat:true}
]},
{n:9,sec:"C",topic:"Cinta Negara — Trend Pembelian Barangan Berjenama Luar Negara",title:"Sikap Rakyat Mengagungkan Barangan Luar Negara",stim:"[Gambar — mall dengan 'Kedai Produk Tempatan Malaysia' (lengang) berbanding queue panjang di depan 'International Brands & Luxury Goods'] Pada masa kini, terdapat segelintir rakyat Malaysia yang mempunyai sikap terlalu mengagungkan barangan berjenama dari luar negara seperti pakaian, kasut, telefon pintar, dan juga makanan. Mereka sanggup berbelanja besar dan beratur panjang semata-mata untuk mendapatkan produk luar negara kerana menganggap ia melambangkan status yang tinggi. Sebaliknya, barangan buatan tempatan sering dipandang rendah, dianggap kurang berkualiti, dan dipinggirkan walaupun harga yang ditawarkan jauh lebih murah.",marks:20,parts:[
  {l:"(a)",q:"Jelaskan kesan negatif sekiranya masyarakat terus bersikap mengagungkan barangan jenama luar terhadap pembangunan negara kita.",m:5,a:["Mata wang negara mengalir ke luar negara. [1m]","Ekonomi / pendapatan negara merosot. [1m]","Pengeluar / industri tempatan gulung tikar / bangkrap. [1m]","Menyebabkan peningkatan kadar pengangguran / hilang pekerjaan. [1m]","Imej negara tercemar kerana rakyat tidak menyokong produk sendiri. [1m]"],kbat:true},

{"n":1,"sec":"A","topic":"Keperibadian Mulia","title":"Remaja Jujur Pulangkan Wang RM5,000","stim":"REMAJA CONTOH: SIKAP JUJUR PULANGKAN WANG RM5,000 DIPUJI\n\nKUALA LUMPUR, 19 Julai 2026 — Seorang remaja tingkatan lima memulangkan beg berisi wang tunai RM5,000 milik seorang warga emas mendapat pujian meluas daripada masyarakat netizen hari ini.\n\nRemaja berkenaan, Muhammad Ammar Zainal, 17, menemui beg tersebut di atas bangku sebuah perhentian bas ketika dalam perjalanan pulang dari sekolah petang semalam. Tanpa berfikir panjang, dia terus membawa beg berkenaan ke Balai Polis berhampiran untuk tindakan lanjut.","marks":10,"parts":[
{"l":"a","q":"Senaraikan ciri individu berkeperibadian mulia yang ada pada remaja tersebut.","m":2,"a":["Jujur / Ikhlas","Amanah","Bertanggungjawab","Berintegriti","Amal nilai moral","Bersikap sederhana dalam pemikiran / pertuturan / perlakuan","Melakukan kebaikan tanpa mengharapkan balasan","Berusaha melakukan kebaikan"]},
{"l":"b","q":"Jelaskan kepentingan mengamalkan keperibadian mulia dalam kehidupan apabila berhadapan dengan situasi tersebut?","m":3,"a":["Disenangi ramai — individu yang berbudi pekerti mulia mudah diterima dan disukai oleh masyarakat sekeliling; sifat ini dapat mengelakkan diri daripada dibenci atau disisihkan oleh rakan-rakan.","Sentiasa melakukan perkara positif — amalan murni ini mendorong seseorang untuk sentiasa berbuat baik dalam kehidupan harian; sifat ini membantu remaja menjauhi kegiatan negatif atau perbuatan yang melanggar undang-undang.","Menjamin kebahagiaan — kehidupan individu yang berakhlak mulia akan menjadi lebih aman, tenteram, dan gembira; individu juga akan terhindar daripada perasaan bersalah, gelisah, atau konflik dengan orang lain.","Menjadi suri teladan — perbuatan baik yang ditunjukkan akan dicontohi oleh orang lain, terutamanya generasi muda; keadaan ini dapat melahirkan lebih ramai masyarakat yang berakhlak tinggi dan prihatin.","Dihormati / dipandang mulia oleh orang lain — akhlak yang terpuji akan mengangkat maruah diri seseorang di mata masyarakat; orang ramai akan menaruh kepercayaan penuh dan memberikan pandangan yang positif terhadap diri kita.","Mencapai matlamat hidup — disiplin diri dan nilai murni yang diamalkan membantu seseorang untuk berjaya dengan mudah; individu yang berkeperibadian mulia lebih berfokus kepada masa depan yang cemerlang tanpa mudah terpesong."]},
{"l":"c","q":"Sebagai remaja, bagaimanakah anda mengamalkan keperibadian mulia dalam kehidupan seharian?","m":3,"a":["Memulangkan barang / wang yang dijumpai kepada pemilik / pihak berkuasa / polis.","Bercakap dengan sopan dan beradab ketika berkomunikasi dengan orang lain.","Menyiapkan kerja sekolah yang diamanahkan mengikut masa yang ditetapkan.","Membantu rakan yang dalam kesusahan tanpa mengharapkan sebarang balasan.","Menghormati orang yang lebih tua seperti ibu bapa, guru, dan warga emas.","Bergaul mesra dan bekerjasama dengan semua rakan tanpa membezakan bangsa atau agama.","Menjaga etika di media sosial dengan tidak menyebarkan maklumat palsu atau komen negatif.","Menepati masa dan hadir ke sekolah atau perjumpaan dengan awal.","Mengakui kesalahan diri dengan berani dan meminta maaf apabila melakukan silap.","Menjaga kebersihan kawasan persekitaran sekolah dan tempat awam secara sukarela."]},
{"l":"d","q":"Ramalkan kesan yang akan berlaku kepada masyarakat sekiranya sikap seperti yang ditunjukkan oleh remaja tersebut semakin pudar dalam kalangan generasi masa kini.","m":2,"a":["Kes jenayah kecurian dan pecah amanah dalam masyarakat akan meningkat.","Hubungan sesama ahli masyarakat menjadi semakin renggang.","Masyarakat akan hilang kepercayaan antara satu sama lain.","Amalan saling membantu dan tolong-menolong semakin pupus.","Individu cenderung bersikap individualistik (mementingkan diri sendiri).","Tahap keselamatan penduduk di sesuatu kawasan terjejas.","Nilai akhlak dan integriti dalam kalangan generasi muda terhakis.","Suasana kehidupan masyarakat menjadi kurang harmoni dan tidak tenteram.","Gejala sosial yang melanggar norma masyarakat berleluasa.","Pandangan serong atau imej negatif masyarakat terhadap generasi muda meningkat."]}
]},
{"n":2,"sec":"A","topic":"Disiplin & Keselamatan","title":"Buli di Sekolah","stim":"[Gambar 1] Poster anti-buli: \"BANTULAH HENTIKAN BULI DI SEKOLAH\" — Buli Bukan Keberanian, Tapi Kelemahan. Jadilah Rakan, Bukan Pembuli. #BERSAMAHENTIKANBULI","marks":10,"parts":[
{"l":"a","q":"Nyatakan faktor yang mendorong gejala buli di sekolah.","m":3,"a":["Pengaruh rakan sebaya yang negatif","Kurang didikan agama dan nilai moral","Kurang perhatian dan kasih sayang daripada ibu bapa","Pengaruh media massa dan teknologi (paparan unsur keganasan / media sosial)","Ingin menunjuk-nunjuk kuasa atau kekuatan fizikal (perasaan ingin megah)","Masalah tekanan emosi (stres) atau masalah peribadi di rumah","Sikap mementingkan diri sendiri tanpa mengambil kira perasaan orang lain","Kurangnya pengawasan dan pemantauan daripada pihak sekolah di kawasan terpencil","Sikap benci atau prasangka buruk terhadap perbezaan individu (seperti rupa fizikal atau latar belakang)","Pernah menjadi mangsa buli pada masa lalu (dendam atau kitaran buli)"]},
{"l":"b","q":"Terangkan kesan yang akan berlaku kepada mangsa buli sekiranya gejala buli ini tidak ditangani.","m":3,"a":["Mangsa mengalami tekanan emosi dan kemurungan yang teruk — Mangsa sentiasa berasa takut, resah, dan hilang keyakinan diri akibat sering diugut; keadaan ini boleh mendorong mangsa mencederakan diri sendiri atau cuba membunuh diri.","Masalah kesihatan fizikal mangsa terjejas — Mangsa mengalami kecederaan fizikal seperti lebam, luka, atau sakit badan akibat dipukul; tekanan perasaan yang berpanjangan menyebabkan mangsa susah tidur malam dan hilang selera makan.","Pencapaian akademik mangsa merosot — Mangsa sentiasa ketakutan dan hilang tumpuan semasa guru sedang mengajar di dalam kelas; hal ini menyebabkan mangsa hilang minat ke sekolah atau kerap ponteng kelas.","Mangsa hilang keyakinan diri dan mengasingkan diri — Mangsa berasa rendah diri, malu, serta menganggap diri mereka lemah dan tidak berguna; mangsa menjadi pendiam, takut berkawan, dan tidak mahu bergaul dengan orang lain.","Mangsa mengalami trauma psikologi yang berpanjangan — Kenangan pahit dibuli meninggalkan kesan mendalam dalam ingatan mangsa hingga ke peringkat dewasa; mangsa mudah cemas, curiga dengan orang sekeliling, dan susah mempercayai orang lain.","Semangat dan motivasi mangsa untuk hidup musnah — Mangsa kehilangan harapan serta tidak mempunyai semangat untuk meneruskan aktiviti harian; mangsa merasakan diri mereka sentiasa terancam dan tidak selamat di mana-mana sahaja.","Mangsa menjadi seorang yang pendendam — Perasaan sakit hati yang terbuku akibat ditindas menyebabkan mangsa ingin membalas dendam terhadap pembuli; situasi ini boleh mencetuskan kitaran buli yang berterusan di sekolah.","Masa depan mangsa terjejas dan menjadi malap — Kegagalan dalam pelajaran dan keciciran sekolah menyukarkan mangsa melanjutkan pelajaran ke peringkat tinggi; mangsa akan menghadapi kesukaran untuk mendapatkan kerjaya yang stabil pada masa hadapan."]},
{"l":"c","q":"Jelaskan tindakan yang boleh dilakukan oleh pihak sekolah untuk menangani gejala buli dalam kalangan murid sekolah.","m":4,"a":["Mengadakan kempen anti-buli — supaya murid tahu tentang kesan buruk perbuatan membuli.","Mengenakan hukuman tegas kepada pembuli — agar pelaku gerun dan tidak mengulangi kesalahan tersebut.","Memperkasakan Unit Bimbingan dan Kaunseling (UBK) — guru kaunseling boleh memberi khidmat nasihat kepada pembuli dan sokongan kepada mangsa.","Meningkatkan kawalan di tempat terpencil sekolah — guru boleh kerap meronda di kawasan sunyi seperti tandas atau tangga.","Bekerjasama dengan pihak berkuasa / polis / PDRM — Pegawai Perhubungan Sekolah (PPS) boleh memberi ceramah pencegahan disiplin.","Memasang kamera litar tertutup (CCTV) — membolehkan pihak sekolah mengesan salah laku buli dengan cepat.","Mengaktifkan Pembimbing Rakan Sebaya (PRS) — rakan sebaya boleh membantu melaporkan kes buli secara senyap.","Menganjurkan aktiviti kokurikulum berunsur nilai murni — dapat memupuk sikap saling menghormati antara rakan sekolah."]}
]},
{"n":3,"sec":"A","topic":"Jati Diri & Patriotisme","title":"Individu Glokal — Produk Tempatan vs Jenama Luar","stim":"Mengejar Jenama Luar, Melupakan Identiti Sendiri: Cabaran Individu Glokal\n\nPada era globalisasi kini, pasaran tempatan dibanjiri dengan pelbagai produk berjenama antarabangsa yang canggih dan bergaya. Hal ini telah mengubah cita rasa segelintir masyarakat, terutamanya golongan remaja yang lebih cenderung mengagungkan jenama luar berbanding jenama tempatan.\n\nSikap ini menyebabkan barangan kraf tangan dan produk buatan Malaysia semakin dipinggirkan. Sebagai seorang individu glokal, kita seharusnya berfikiran kritis dan bertindak rasional dalam memilih barangan bagi menyokong ekonomi negara sambil mengekalkan identiti jati diri nasional.","marks":10,"parts":[
{"l":"a","q":"Nyatakan nilai universal yang patut diamalkan oleh seseorang individu glokal untuk menyokong barangan tempatan.","m":2,"a":["Patriotisme","Kerajinan","Berdikari","Rasional"]},
{"l":"b","q":"Mengapakah segelintir masyarakat lebih gemar memilih barangan berjenama antarabangsa?","m":2,"a":["Menganggap mutu barangan antarabangsa lebih tinggi.","Ingin menunjukkan status sosial yang mewah.","Terpengaruh dengan iklan dan media sosial.","Mengikut gaya hidup pempengaruh (influencer).","Mengikuti trend fesyen global terkini.","Dipengaruhi oleh tekanan rakan sebaya.","Beranggapan barangan tempatan kurang bergaya.","Yakin dengan jaminan kualiti jenama luar.","Kurang kesedaran jati diri dan semangat patriotisme.","Mencari kepuasan diri menggayakan jenama terkenal."]},
{"l":"c","q":"Terangkan kesan terhadap ekonomi negara jika masyarakat terus meminggirkan barangan buatan Malaysia.","m":3,"a":["Pendapatan industri tempatan merosot — pengusaha kehilangan sumber jualan kerana rakyat pilih barangan luar; perniagaan terpaksa ditutup dan menjejaskan punca pendapatan peniaga kecil.","Kadar pengangguran pekerja tempatan meningkat — kilang atau syarikat tempatan mengalami kerugian besar akibat tiada sambutan; majikan terpaksa menghentikan pekerja atau menutup operasi perniagaan.","Pengaliran wang negara ke luar negara meningkat — rakyat terus membeli produk berjenama antarabangsa secara berterusan; wang Malaysia banyak berpindah kepada syarikat asing dan merugikan negara.","Pertumbuhan Keluaran Dalam Negara Kasar (KDNK) merosot — sektor pembuatan dan perindustrian gagal mencatat nilai jualan tinggi; ekonomi negara menjadi lemah akibat terlalu bergantung pada produk import.","Industri kraf tangan dan warisan negara terjejas — produk tradisional tidak mendapat permintaan kerana dipinggirkan generasi muda; industri seni warisan tempatan akhirnya pupus akibat ketiadaan pembeli.","Peluang kerjaya golongan muda berkurangan — perniagaan tempatan yang tidak berkembang maju mengehadkan peluang pekerjaan; belia tempatan menghadapi kesukaran untuk mendapatkan pekerjaan stabil.","Nilai mata wang tempatan (Ringgit Malaysia) terjejas — permintaan produk import lebih tinggi berbanding produk tempatan; imbangan dagangan negara menjadi tidak stabil di peringkat global."],"kbat":true},
{"l":"d","q":"Cadangkan langkah yang boleh diambil oleh pengusaha tempatan untuk menarik minat golongan muda membeli produk mereka.","m":3,"a":["Mengadakan promosi jualan murah atau potongan harga.","Memperbaiki kualiti dan reka bentuk produk agar lebih moden.","Memasarkan produk secara meluas menerusi platform media sosial.","Menggunakan khidmat pempengaruh (influencer) untuk mengiklankan produk.","Menyediakan reka bentuk pembungkusan yang lebih menarik dan eksklusif.","Mengadakan jualan kilat secara atas talian (online).","Memberikan hadiah percuma atau cenderahati kepada pembeli.","Menyediakan kemudahan perkhidmatan penghantaran terus ke rumah.","Menawarkan mata ganjaran atau rebat tunai (cashback) kepada pelanggan setia.","Menyertai pameran usahawan atau karnival belia di peringkat tempatan."]}
]},
{"n":4,"sec":"A","topic":"Pengurusan Kewangan","title":"Menabung — Strategi Bijak Pengurusan Kewangan","stim":"Menabung: Strategi Bijak Pengurusan Kewangan Masa Hadapan\n\nAmalan menabung merupakan satu langkah bijak dan beretika dalam menguruskan kewangan peribadi. Setiap individu, terutamanya golongan remaja, perlu mempunyai perancangan kewangan yang efisien sejak awal lagi bagi memastikan kelangsungan hidup pada masa hadapan lebih terjamin. Tabungan yang konsisten bukanlah sekadar simpanan wang, malah ia berfungsi sebagai \"jaring keselamatan\" untuk menghadapi sebarang kecemasan.","marks":10,"parts":[
{"l":"a","q":"Sebagai remaja, bagaimanakah anda mengamalkan tabiat menabung?","m":2,"a":["Membuat perancangan perbelanjaan (bajet) harian atau mingguan.","Menyimpan sekurang-kurangnya 10% daripada wang saku atau pendapatan setiap bulan.","Mengutamakan barangan keperluan asas berbanding kehendak mewah.","Membuka akaun simpanan khas di institusi kewangan yang sah.","Membawa bekal makanan dan minuman dari rumah ke sekolah.","Mengumpul baki wang syiling ke dalam tabung khas.","Mengelakkan diri daripada berhutang atau meminjam wang untuk perbelanjaan tidak penting.","Membeli barangan mengikut kemampuan diri sendiri.","Membuat catatan aliran wang keluar dan masuk setiap hari.","Mengelakkan diri daripada terpedaya dengan skim cepat kaya atau perbelanjaan boros."]},
{"l":"b","q":"Terangkan kepentingan amalan menabung dan menyimpan wang.","m":3,"a":["Wang simpanan boleh digunakan pada waktu kecemasan — untuk bayar kos rawatan ketika sakit atau baiki kerosakan; mengelakkan diri daripada terpaksa meminjam duit orang lain.","Menjadi sumber kewangan untuk sambung belajar — boleh digunakan untuk membayar yuran pendaftaran universiti; meringankan beban kewangan ibu bapa.","Mendidik diri supaya tidak bersikap boros — mengutamakan barang yang wajib berbanding barang mewah; wang tidak dihabiskan pada perkara yang tidak berfaedah.","Membantu mengelakkan diri daripada terjerat dalam hutang — ada duit sendiri yang cukup tanpa perlu boros guna kad kredit; menyelamatkan diri daripada risiko muflis.","Memupuk sikap berdisiplin dalam menguruskan wang — lebih pandai merancang duit keluar dan masuk setiap bulan; menjadi lebih matang apabila membuat keputusan masa depan.","Menjamin kestabilan kewangan untuk masa hadapan — simpanan sejak muda menjadi asas kukuh apabila mula bekerja; lebih tenang kerana bersedia menghadapi turun naik ekonomi.","Membina amalan berjimat cermat dalam kehidupan — tidak mudah terpengaruh dengan trend gaya hidup mewah; menjadikan kita lebih menghargai setiap sen wang yang dimiliki.","Memastikan kelangsungan hidup yang lebih terjamin — mempunyai jaminan perlindungan jika hilang punca pendapatan; kehidupan tidak terjejas teruk apabila menghadapi kesusahan.","Membantu mencapai matlamat atau impian hidup — wang simpanan boleh dijadikan modal membeli aset seperti rumah; tidak perlu bergantung kepada pinjaman bank berfaedah tinggi.","Mengurangkan tekanan emosi dan mental — fikiran lebih tenteram kerana mempunyai simpanan tunai; tidak perlu hidup dalam kebimbangan masalah ketiadaan wang."]},
{"l":"c","q":"Ramalkan kesan sekiranya seseorang remaja terlalu mengikut gaya hidup mewah dan tidak mempunyai sebarang tabungan.","m":3,"a":["Terbeban dengan hutang yang tinggi.","Mengalami tekanan emosi dan mental.","Risiko diisytiharkan muflis pada usia muda.","Masa depan menjadi gelap dan terjejas.","Keharmonian hubungan keluarga terjejas.","Terdedah kepada sindiket pinjaman tidak berlesen (Along).","Harta benda atau aset dirampas.","Hilang keyakinan dan imej diri.","Menjejaskan produktiviti diri.","Terjerumus dalam kancah jenayah."]},
{"l":"d","q":"Jelaskan perasaan anda apabila berjaya menguruskan perbelanjaan dan menabung secara konsisten setiap bulan.","m":2,"a":["Gembira / Bangga / Tenang / Bersyukur kerana dapat mengawal perbelanjaan harian dengan bijak tanpa berlaku pembaziran.","Gembira kerana mempunyai simpanan wang yang mencukupi untuk menghadapi masa kecemasan.","Bangga kerana kedudukan kewangan peribadi berada dalam keadaan yang stabil dan kukuh.","Lega kerana berjaya melatih diri menjadi seorang remaja yang berdisiplin serta matang.","Tenang kerana tidak perlu terbeban atau terjerat dengan masalah hutang yang melampau.","Bersyukur kerana dapat menyediakan sumber kewangan awal untuk menyambung pelajaran ke peringkat tinggi."]}
]},
