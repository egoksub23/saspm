{"l":"a","q":"Sebagai seorang pengguna, apakah tindakan anda apabila berhadapan situasi di atas?","m":2,"a":["Membuat aduan rasmi kepada pihak KPDN / agensi penguatkuasaan / pihak berkuasa.","Memboikot premis perniagaan yang tidak jujur dan menindas pengguna.","Menegur perbuatan peniaga tersebut secara berhemah di tempat kejadian.","Meneliti tanda harga barangan dan memeriksa alat penimbang sebelum membuat pembayaran.","Melaporkan salah laku peniaga di media sosial sebagai langkah amaran kepada masyarakat.","Memilih untuk membeli barangan di kedai lain yang lebih telus dan berintegriti.","Mendapatkan resit pembelian yang lengkap sebagai bukti transaksi yang sah.","Menasihati peniaga supaya berniaga dengan jujur demi memelihara hak pengguna."]},
{"l":"b","q":"Huraikan kesan terhadap negara jika amalan perniagaan seperti dalam gambar dibiarkan berleluasa.","m":3,"a":["Menjejaskan kestabilan ekonomi negara.","Mencemarkan imej dan reputasi negara di mata dunia.","Menjejaskan keyakinan pelabur asing untuk melabur.","Menyebabkan negara kehilangan sumber pendapatan penting.","Meningkatkan kadar inflasi dan kos sara hidup.","Menyekat peluang pekerjaan kepada rakyat tempatan.","Melahirkan masyarakat yang hilang nilai kejujuran dan integriti.","Menimbulkan ketidakpuasan hati dan pergolakan sosial dalam kalangan rakyat.","Menjejaskan daya saing sektor perniagaan tempatan di peringkat global.","Memaksa kerajaan menanggung perbelanjaan penguatkuasaan yang tinggi."]},
{"l":"c","q":"Mengapakah integriti penting sebagai seorang peniaga?","m":2,"a":["Mengekalkan kepercayaan dan keyakinan pelanggan terhadap perniagaan.","Meningkatkan imej serta maruah diri dan perniagaan di mata masyarakat.","Mengelakkan diri daripada dikenakan tindakan undang-undang atau denda.","Memastikan rezeki dan keuntungan perniagaan sentiasa halal dan berkat.","Mewujudkan persaingan perniagaan yang sihat dan adil dalam pasaran.","Menjamin kelangsungan perniagaan dalam jangka masa yang panjang.","Mengelakkan perniagaan daripada diboikot oleh orang ramai.","Menjaga hak pengguna daripada ditindas atau dianiaya.","Membantu menyumbang kepada kestabilan ekonomi negara yang telus.","Menjadi teladan yang baik kepada peniaga lain untuk berniaga dengan jujur."]},
{"l":"d","q":"Sebagai warganegara, bagaimanakah anda melaksanakan tanggungjawab dengan berintegriti kepada negara?","m":3,"a":["Mematuhi undang-undang dan perlembagaan negara.","Membayar cukai pendapatan dengan jujur dan tepat pada masanya.","Menjalankan tugas atau pekerjaan dengan amanah dan telus.","Menolak sebarang amalan rasuah dan penyelewengan.","Menjaga nama baik serta imej negara di persada antarabangsa.","Mengundi semasa pilihan raya sebagai tanggungjawab warganegara.","Memelihara kemudahan awam dan harta benda negara.","Mengamalkan perpaduan serta menghormati kepelbagaian kaum.","Menyokong dasar-dasar pembangunan yang diperkenalkan oleh kerajaan.","Tidak menyebarkan berita palsu yang boleh menggugat keamanan negara."]}
]},
{"n":6,"sec":"B","topic":"Tanggungjawab Sosial","title":"Penglibatan Remaja dalam Program Komuniti","note":"Bahagian B — Jawab SATU soalan sahaja (Soalan 6 atau Soalan 7).","stim":"Dialog antara Maniam dan Wei Ming:\n\nManiam: \"Wei Ming, jom ikut saya gotong-royong di rumah orang tua esok. Kita boleh bantu mereka dan belajar untuk lebih prihatin.\"\n\nWei Ming: \"Saya agak sibuk, tapi adakah bantuan kita nanti benar-benar berkesan untuk mereka?\"\n\nManiam: \"Penting, Wei Ming. Apabila kita tolong mereka, kita akan lebih faham perasaan mereka dan belajar untuk menjadi orang yang lebih penyayang dan bertanggungjawab.\"\n\nWei Ming: \"Betul juga kata kamu, mereka pun perlukan sokongan kita. Baiklah, saya setuju untuk sertai dan mari kita mula aktif dengan kerja amal begini.\"","marks":10,"parts":[
{"l":"a","q":"Selain daripada gotong royong, senaraikan contoh program komuniti yang boleh disertai oleh remaja.","m":5,"a":["Kempen derma darah peringkat komuniti.","Aktiviti khidmat sukarelawan di rumah orang tua.","Program lawatan dan sumbangan ke rumah anak yatim.","Kempen pembersihan pantai atau taman awam (beach / park cleanup).","Program kitar semula barangan terpakai bersama penduduk taman.","Misi pengumpulan dan pengagihan bantuan mangsa bencana alam.","Program tuisyen percuma untuk kanak-kanak kurang berkemampuan.","Karnival sukaneka atau sukan rakyat perpaduan pelbagai kaum.","Kempen kesedaran kesihatan dan saringan kesihatan percuma.","Program gotong-royong membersihkan kawasan perumahan."]},
{"l":"b","q":"Jelaskan kepentingan penglibatan remaja dalam program komuniti.","m":5,"a":["Memupuk nilai empati — supaya remaja lebih prihatin dan bimbang terhadap kesusahan hidup golongan yang kurang bernasib baik seperti warga emas, orang kurang upaya (OKU), dan anak yatim.","Membina keyakinan diri — agar remaja berani berinteraksi dan berkomunikasi dengan masyarakat daripada pelbagai lapisan tanpa rasa malu atau gentar.","Mengelakkan gejala sosial — kerana masa lapang remaja diisi dengan aktiviti berfaedah dan dapat menjauhkan diri daripada perbuatan negatif seperti melepak atau lumba haram.","Mengeratkan perpaduan kaum — kerana aktiviti kemasyarakatan menyatukan remaja pelbagai bangsa untuk bekerjasama dan saling mengenali.","Melatih kemahiran kepimpinan — supaya remaja belajar cara menguruskan sesuatu program dengan teratur, berkesan, dan memikul tanggungjawab sebagai pemimpin masa depan.","Meningkatkan kesedaran sivik — agar remaja lebih peka terhadap kebersihan persekitaran, penjagaan alam sekitar, dan kepentingan memelihara kemudahan awam setempat.","Menambah kenalan baharu — supaya remaja dapat meluaskan rangkaian sosial dan mengenali rakan-rakan baharu yang mempunyai sikap positif serta minat yang sama.","Mengharumkan nama baik diri dan keluarga — kerana masyarakat akan memuji sahsiah mulia serta kerajinan remaja yang aktif berbakti dan membantu orang lain.","Memupuk semangat patriotisme — kerana penglibatan dalam kerja amal menanam rasa cinta yang mendalam terhadap tanah air, bangsa, dan kesejahteraan masyarakat tempatan.","Menimba pengalaman hidup yang matang — agar remaja mendapat pendedahan dunia luar yang sebenar untuk membentuk peribadi yang berdisiplin, berintegriti, dan matang sebelum melangkah ke alam dewasa."]}
]},
{"n":7,"sec":"B","topic":"Tanggungjawab Digital","title":"Penularan Berita Palsu di Media Sosial","note":"Bahagian B — Jawab SATU soalan sahaja (Soalan 6 atau Soalan 7).","stim":"[Gambar 3] Dua remaja duduk di sofa memegang tablet yang memaparkan berita palsu:\n\"KEPALA AYAM TERBANG DILIHAT DI PASAR RAYA!\"\n\nRemaja 1: \"Wah, berita ini disahkan tidak benar! Tetapi mari kita kongsikannya dan membuat rakan-rakan mempercayainya. Pasti seronok!\"\n\nRemaja 2: \"Saya sudah bersedia untuk menekan 'Kongsi'. Pengikut kita pasti akan meningkat dengan sangat banyak!\"","marks":10,"parts":[
{"l":"a","q":"Berdasarkan situasi berikut, tindakan remaja tersebut menularkan berita palsu adalah tidak wajar. Jelaskan.","m":5,"a":["Maklumat tersebut tidak dipastikan kesahihannya / belum terbukti benar — perbuatan ini akan mengelirukan minda orang ramai yang membacanya.","Boleh mencetuskan suasana panik / ketakutan melampau — kesannya, ketenteraman dan keharmonian hidup masyarakat awam akan terganggu.","Penyebaran berita palsu boleh menimbulkan unsur fitnah — hal ini akan menjatuhkan maruah, imej, atau reputasi pihak yang terlibat.","Menyalahi undang-undang komunikasi negara — remaja tersebut boleh dikenakan tindakan / hukuman di bawah Akta Komunikasi dan Multimedia 1998.","Menjejaskan imej diri remaja itu sendiri — masyarakat dan rakan-rakan akan hilang kepercayaan terhadap dirinya pada masa hadapan.","Menggugat perpaduan kaum dan agama — penyebaran isu sensitif secara tidak tepat boleh mencetuskan pergaduhan dalam masyarakat majmuk.","Merosakkan hubungan silaturahim — individu mungkin bergaduh atau bermusuh dengan keluarga dan rakan-rakan akibat salah faham daripada maklumat palsu.","Mendorong kepada perlakuan jenayah — maklumat palsu tentang peluang pelaburan atau perniagaan mudah menarik mangsa untuk ditipu oleh scammer.","Menjejaskan keselamatan negara — maklumat tidak sahih tentang dasar kerajaan atau ancaman luar boleh melemahkan sistem pertahanan negara.","Membazirkan masa dan sumber tenaga — pihak berkuasa terpaksa bertungkus-lumus menyiasat dan membetulkan kesilapan yang berpunca daripada berita palsu tersebut."],"kbat":true},
{"l":"b","q":"Penggunaan media sosial dalam kalangan remaja semakin meluas pada masa kini. Sebagai seorang remaja, senaraikan tatacara yang perlu dipatuhi apabila menggunakan sumber dan menyebarkan maklumat di internet.","m":5,"a":["Menyemak kesahihan maklumat terlebih dahulu.","Merujuk maklumat daripada sumber yang rasmi atau berautoriti.","Tidak menekan butang kongsi (share / forward) secara melulu.","Memberikan kredit / menyatakan sumber asal maklumat yang diambil.","Mengelakkan daripada menyentuh isu-isu yang sensitif.","Tidak mengubah suai atau memanipulasi gambar dan fakta.","Membaca keseluruhan artikel, bukan hanya membaca tajuk utama (headline).","Menasihati rakan-rakan agar berhenti menyebarkan mesej berantai.","Bertindak melaporkan hantaran (post) yang menyebarkan maklumat palsu.","Melindungi maklumat peribadi diri sendiri dan juga orang lain."]}
]},
{"n":8,"sec":"C","topic":"Integriti & Persahabatan","title":"Integriti Ketika Peperiksaan — Dilema James","stim":"[Gambar 4] Suasana bilik peperiksaan — James berada dalam dilema apabila ternampak rakan karibnya, David, meniru semasa peperiksaan. Dia tersepit antara melaporkan kesalahan tersebut yang boleh memusnahkan persahabatan mereka atau mendiamkan diri yang bermakna dia bersubahat dan menggadaikan prinsip integriti dirinya.","marks":20,"parts":[
{"l":"a","q":"Berdasarkan situasi tersebut, wajarkah James mendiamkan diri demi menjaga persahabatannya dengan David? Huraikan jawapan berdasarkan nilai universal yang telah anda pelajari.","m":5,"a":["TIDAK WAJAR (Nilai: Kejujuran, Rasional, Bertanggungjawab, Keberanian) — Menyembunyikan kesalahan rakan bermaksud James secara tidak langsung telah bersubahat melanggar peraturan peperiksaan.","TIDAK WAJAR — Jika James mendiamkan diri, David tidak akan insaf dan akan berterusan mengulangi perbuatan meniru pada masa hadapan.","TIDAK WAJAR — Sahabat yang sejati sepatutnya berani menegur kesilapan rakannya ke arah kebaikan, bukannya melindungi perbuatan yang salah.","TIDAK WAJAR — Tindakan mendiamkan diri ini akan mencemarkan integriti dan maruah diri James sendiri sebagai seorang murid.","TIDAK WAJAR — Sikap David yang suka mengambil jalan mudah ini boleh merosakkan masa depannya sendiri, terutamanya apabila dia memasuki alam pekerjaan kelak.","TIDAK WAJAR — Perbuatan ini sangat tidak adil terhadap murid-murid lain yang telah bertungkus-lumus dan jujur mengulang kaji pelajaran untuk lulus peperiksaan.","(JUGA DITERIMA — WAJAR, Nilai: Kasih Sayang, Baik Hati, Toleransi) — James sangat menyayangi dan ingin menyelamatkan hubungan persahabatannya; James berniat baik untuk memberi peluang kedua kepada David untuk membetulkan kesilapannya tanpa perlu campur tangan guru disiplin; James berazam untuk mengajak David belajar bersama-sama selepas ini supaya David lebih yakin dan tidak perlu meniru lagi."],"kbat":true},
{"l":"b","q":"Terangkan implikasi terhadap David sekiranya dia berterusan menjadikan amalan tidak berintegriti ini sebagai satu kebiasaan.","m":5,"a":["Imej dan maruah diri akan tercalar — David akan dipandang serong, dihina, dan dilabel sebagai seorang penipu oleh rakan-rakan serta guru-gurunya.","Kehilangan kepercayaan daripada orang sekeliling — segala kata-kata, janji, dan kejayaan yang dicapai oleh David pada masa hadapan tidak lagi akan dipercayai atau diyakini oleh orang lain.","Dikenakan tindakan disiplin yang berat — David berisiko untuk digantung persekolahan atau dibuang sekolah sekiranya kegiatan penipuannya ditangkap oleh pihak pengawas peperiksaan.","Masa depannya menjadi gelap dan terjejas — rekod disiplin yang buruk akan menyukarkan David untuk menyambung pelajaran ke peringkat universiti atau memohon sebarang biasiswa.","Membawa sikap buruk tersebut ke alam pekerjaan — David akan cenderung menjadi pekerja yang tidak amanah, suka mengambil jalan mudah, serta berpotensi terlibat dalam kes rasuah dan pecah amanah.","Hidup dalam keadaan tidak tenang / tertekan — jiwa dan emosi David akan sentiasa berada dalam ketakutan kerana bimbang rahsia penipuannya akan terbongkar pada bila-bila masa.","Gagal mengetahui kebolehan dan potensi diri yang sebenar — David hidup dalam kepalsuan kerana asyik bergantung kepada nota tipu dan bukannya berpandukan usaha serta titik peluhnya sendiri.","Mencemarkan nama baik dan maruah keluarga — ibu bapa David pasti akan berasa amat malu, sedih, dan kecewa dengan sikap ketidakjujuran anak mereka yang melanggar peraturan.","Kehilangan rakan yang baik / dipulaukan — rakan-rakan yang berintegriti akan mula menjauhkan diri daripadanya kerana tidak mahu terpengaruh atau dianggap bersubahat dengan perbuatan negatifnya.","Terjerumus ke dalam kancah jenayah yang lebih besar — amalan ketidakjujuran yang dipupuk sejak sekolah ini boleh mendorong David melakukan jenayah kolar putih berskala besar demi mendapatkan kekayaan dan pangkat kelak."]},
{"l":"c","q":"Andaikan anda ialah James, jelaskan perasaan anda ketika berhadapan situasi tersebut apabila terpaksa mengutamakan amalan integriti berbanding persahabatan.","m":5,"a":["SEDIH / KECEWA (Fokus kepada kesan persahabatan) — Kerana tindakan ini mungkin akan memutuskan hubungan persahabatan kami.","SEDIH — Kerana rakan karib saya pasti akan dikenakan hukuman disiplin yang berat.","SEDIH — Kerana saya terpaksa membuat pilihan yang amat sukar antara kawan atau peraturan.","SEDIH — Kerana saya bersimpati memikirkan masa depannya jika dia digantung sekolah.","SEDIH — Kerana saya mungkin akan kehilangan seorang sahabat yang telah lama terjalin.","GEMBIRA / LEGA / BANGGA (Fokus kepada kepentingan integriti) — Kerana saya berjaya mempertahankan nilai integriti dan kejujuran dalam diri saya.","GEMBIRA — Kerana saya tidak bersubahat menyembunyikan kesalahan yang melanggar peraturan.","GEMBIRA — Kerana tindakan tegas saya ini dapat memberi pengajaran supaya dia sedar kesilapannya.","BANGGA — Kerana saya sebenarnya menyelamatkan masa depannya daripada terus menjadi penipu.","LEGA — Kerana hati dan emosi saya menjadi lebih tenang tanpa perlu menyimpan rahsia penipuan."]},
{"l":"d","q":"Sebagai seorang rakan, bagaimanakah anda dapat membantu David agar tidak mengulangi kesalahan tersebut.","m":5,"a":["Mengajak David mengulang kaji pelajaran bersama-sama.","Menasihati David tentang kepentingan sikap jujur.","Membantu David menyusun jadual waktu belajar.","Menggalakkan David berjumpa guru mata pelajaran.","Memberikan kata-kata semangat kepada David.","Mengingatkan David tentang kesan buruk meniru.","Berkongsi nota ringkas dan tips belajar dengan David.","Menegur David secara peribadi jika dia berniat meniru lagi.","Menasihati David supaya tidak mengambil jalan mudah.","Membawa David menyertai kelas tambahan sekolah."]}
]},
{"n":9,"sec":"C","topic":"Perpaduan Kaum","title":"Perpaduan Masyarakat di Taman Muhibah","stim":"[Gambar 5] Kawasan perumahan Taman Muhibah didiami oleh penduduk yang terdiri daripada kaum Melayu, Cina, India dan pelbagai etnik lain. Walaupun mereka mempunyai latar belakang agama, budaya dan bahasa yang berbeza, mereka sentiasa hidup dalam keadaan aman dan harmoni.","marks":20,"parts":[
{"l":"a","q":"Berdasarkan situasi tersebut, nyatakan contoh amalan perpaduan yang boleh dilakukan oleh penduduk di taman tersebut untuk mengekalkan keharmonian.","m":5,"a":["Mengadakan gotong-royong membersihkan kawasan taman.","Menganjurkan rumah terbuka berbilang kaum semasa musim perayaan.","Menyertai rondaan keselamatan seperti skim Rukun Tetangga (RT).","Saling bertegur sapa dan senyum apabila berselisih dengan jiran.","Bertukar-tukar juadah atau makanan tradisional dengan jiran tetangga.","Menziarahi jiran yang sedang sakit atau ditimpa musibah.","Mengadakan Hari Keluarga atau acara sukaneka peringkat taman.","Menghulurkan bantuan tenaga semasa jiran mengadakan kenduri atau majlis.","Menghormati amalan peribadat atau pantang larang agama kaum lain (contoh: tidak membuat bising).","Tolong pantau rumah jiran apabila mereka pulang ke kampung."]},
{"l":"b","q":"Mengapakah amalan perpaduan sangat penting untuk terus dikekalkan dalam kalangan masyarakat Malaysia yang berbeza agama, bangsa, budaya dan bahasa? Jawapan anda hendaklah disokong dengan nilai universal yang dipelajari.","m":5,"a":["Toleransi — mengekalkan keharmonian dan keamanan negara.","Kerjasama — mengelakkan perselisihan faham atau pergaduhan antara kaum.","Hormat — memajukan ekonomi negara dengan menarik pelabur asing.","Rasional — menjamin kedaulatan dan keselamatan negara daripada ancaman luar.","Meningkatkan imej negara di mata dunia / persada antarabangsa.","Merapatkan hubungan silaturahim (jurang sosial) antara masyarakat pelbagai kaum.","Menarik kedatangan pelancong asing untuk melihat keunikan budaya Malaysia.","Meningkatkan taraf hidup rakyat menerusi pembahagian ekonomi yang adil.","Mewujudkan pentadbiran negara yang lebih stabil, telus, dan dihormati.","Melahirkan generasi muda yang mempunyai jati diri dan semangat patriotik yang tinggi."]},
{"l":"c","q":"Huraikan cabaran yang dihadapi dalam membentuk amalan perpaduan dalam kalangan masyarakat di Malaysia.","m":5,"a":["Kelemahan penguasaan bahasa kebangsaan yang mewujudkan jurang komunikasi.","Penyebaran berita palsu dan isu berbaur perkauman di media sosial.","Sikap prejudis dan prasangka buruk terhadap agama atau budaya kaum lain.","Sikap individualistik (mementingkan diri sendiri) dan sibuk dengan urusan peribadi.","Pengasingan sistem pendidikan sejak kecil (kewujudan sekolah vernakular).","Pengaruh kempen dan sentimen politik yang berasaskan perkauman.","Jurang ekonomi dan ketidakseimbangan taraf hidup antara kaum.","Kurang penglibatan dalam aktiviti kemasyarakatan seperti gotong-royong atau Rukun Tetangga.","Sikap tidak menjaga sensitiviti dan pantang larang agama kaum lain.","Pengaruh budaya luar (Barat) yang menghakis jati diri dan budaya tempatan.","Pengasingan petempatan atau kawasan perumahan yang terpusat mengikut kaum tertentu.","Pemikiran etnosentrisme (menganggap bangsa atau budaya sendiri paling hebat).","Sikap suka memilih kawan dan hanya bergaul dengan kelompok sebangsa sahaja.","Pemisahan bentuk muka bumi (geografi) yang menyukarkan integrasi antara Semenanjung dengan Sabah dan Sarawak.","Kelunturan semangat patriotisme dan cintakan negara dalam kalangan generasi muda."],"kbat":true},
{"l":"d","q":"Sebagai seorang murid, bagaimanakah anda mengamalkan kehidupan bersatu padu bersama rakan-rakan yang berbeza agama, bangsa, dan budaya di sekolah?","m":5,"a":["Makan bersama-sama rakan pelbagai kaum di kantin sekolah.","Bermain dan bersukan dalam satu pasukan yang sama tanpa mengira bangsa.","Bekerjasama membersihkan kelas mengikut jadual bertugas harian.","Membantu rakan berlainan kaum yang lemah dalam pelajaran.","Mengucapkan selamat menyambut hari perayaan kepada rakan.","Saling bertegur sapa dan senyum apabila berjumpa di kawasan sekolah.","Menjaga tutur kata dan tidak mengejek amalan budaya kaum lain.","Berkongsi rezeki dengan bertukar-tukar bekal makanan pada waktu rehat.","Menyertai unit beruniform atau kelab secara bersama-sama (contoh: Kelab Rukun Negara).","Menziarahi rakan berbilang kaum sekiranya mereka jatuh sakit.","Meminjamkan alat tulis atau buku kepada rakan yang memerlukan.","Menghormati rakan yang sedang berpuasa atau melakukan ibadat.","Mengadakan perbincangan atau belajar secara berkumpulan dengan rakan pelbagai bangsa.","Meraikan sambutan hari lahir rakan sekelas bersama-sama.","Menyokong dan menonton persembahan kebudayaan rakan semasa acara sekolah."]}
]}
]});

    {f:"Memberikan pendidikan kewangan dan kesedaran kepada masyarakat",h:["Meningkatkan pendidikan kewangan dalam kalangan masyarakat. Membantu rakyat merancang perbelanjaan dan mengurus kewangan secara bijak. Sebagai contoh: kempen berjimat-cermat. Oleh itu, hal ini akan menyebabkan masyarakat lebih bijak mengurus kewangan dan dapat menghadapi peningkatan kos sara hidup."]},

{"l":"b","q":"Mengapakah penting untuk seseorang individu mematuhi masa dalam kehidupan seharian?","m":3,"a":[{"f":"Membentuk disiplin diri","h":["Individu yang menepati masa akan sentiasa berusaha menyiapkan tugas tepat pada waktunya."]},{"f":"Mengelakkan kelewatan yang menjejaskan prestasi","h":["Sikap tidak menepati masa boleh menyebabkan individu tertinggal maklumat penting seperti dalam kelas atau mesyuarat."]},{"f":"Menepati janji dan membina kepercayaan","h":["Individu yang menepati masa akan lebih dipercayai kerana dianggap menepati janji dan bersikap profesional."]},{"f":"Mengelakkan tekanan dan kekeliruan","h":["Individu yang mematuhi masa akan lebih tenang, tidak terburu-buru dan dapat mengurus emosinya dengan baik."]},{"f":"Memanfaatkan masa secara optimum","h":["Individu akan dapat membahagikan masa untuk kerja, rehat, keluarga dan aktiviti sosial dengan lebih seimbang."]},{"f":"Meningkatkan kualiti kerja dan pembelajaran","h":["Individu yang mengurus masa dengan baik dapat memberi fokus penuh dan menghasilkan kerja yang lebih berkualiti."]}],"kbat":false},
{"l":"c","q":"Jelaskan kesan jika seseorang pelajar tidak mematuhi masa dalam kehidupan seharian.","m":4,"a":[{"f":"Prestasi akademik merosot","h":["Pelajar yang sering lewat ke sekolah atau kelas akan kerap tertinggal pelajaran penting dan sukar mengikuti pengajaran guru."]},{"f":"Dimarahi/dikenakan tindakan disiplin","h":["Ketidakpatuhan terhadap masa boleh menyebabkan pelajar mendapat surat amaran atau dipanggil oleh guru disiplin."]},{"f":"Menjejaskan imej diri","h":["Pelajar yang tidak menepati masa akan dipandang negatif dan dianggap tidak berdisiplin oleh guru serta rakan."]},{"f":"Hilang kepercayaan guru dan rakan","h":["Apabila pelajar gagal mematuhi masa secara berterusan, guru dan rakan tidak lagi mempercayai komitmennya."]},{"f":"Menimbulkan tekanan dan kebimbangan diri","h":["Pelajar akan berasa tertekan apabila terpaksa tergesa-gesa menyiapkan kerja atau menjawab ujian tanpa persediaan."]},{"f":"Tercicir daripada peluang penting","h":["Pelajar mungkin terlepas ujian, pendaftaran, temu duga biasiswa atau penyertaan pertandingan."]},{"f":"Membentuk tabiat negatif dalam kehidupan dewasa","h":["Sikap tidak menghargai masa jika tidak dibendung dari awal boleh terbawa ke alam pekerjaan dan menjejaskan kerjaya."]}],"kbat":false}
]},
{"n":2,"sec":"A","topic":"Kasih Sayang","title":"Isu penderaan kanak-kanak","stim":"Gambar 1: seorang kanak-kanak melindungi wajahnya daripada ancaman tali pinggang.","marks":10,"parts":[
{"l":"a","q":"Nyatakan tiga faktor yang mendorong penderaan kanak-kanak.","m":3,"a":["Masalah kewangan/pendapatan rendah menyebabkan tekanan hidup.","Tekanan emosi/ibu bapa membawa pulang tekanan kerja ke rumah.","Kurang kemahiran keibubapaan/tidak tahu cara mendidik anak secara berhemah.","Pengaruh dadah atau alkohol/penyalahgunaan boleh menyebabkan hilang pertimbangan.","Konflik rumah tangga/pergaduhan suami isteri menyebabkan anak menjadi mangsa.","Pengaruh media sosial/mendedahkan kepada gaya hidup tidak sihat atau ganas.","Masalah psikologi/individu tidak sihat mental mudah melakukan penderaan.","Didikan zaman silam/pernah didera dan menganggap ia cara mendidik yang betul.","Anak dianggap beban/anak dilihat menyusahkan kehidupan ibu bapa."],"kbat":false},
{"l":"b","q":"Cadangkan cara meningkatkan kesedaran masyarakat untuk mengatasi penderaan kanak-kanak daripada terus berlaku.","m":3,"a":["Kempen kesedaran/jalankan kempen media massa seperti TV, radio dan media sosial.","Ceramah pendidikan keibubapaan/anjur ceramah di sekolah dan komuniti.","Poster dan risalah/edarkan maklumat tentang bahaya penderaan.","Kelas keibubapaan/sediakan latihan kemahiran mendidik anak.","Program intervensi awal/kenal pasti keluarga berisiko dan bantu lebih awal.","Peranan NGO dan JKM/perkukuh pemantauan dan saluran aduan.","Pendidikan moral/agama di sekolah/tanamkan nilai kemanusiaan sejak kecil.","Talian bantuan dan aduan/promosi nombor kecemasan seperti Talian Kasih 15999.","Penguatkuasaan undang-undang/kenakan hukuman berat ke atas pesalah."],"kbat":false},
{"l":"c","q":"Jelaskan tindakan yang boleh dilakukan oleh pihak sekolah untuk membantu murid yang mengalami penderaan di rumah.","m":4,"a":[{"f":"Memberi bimbingan kaunseling secara berterusan","h":["Kaunselor sekolah membantu murid meluahkan perasaan, membina keyakinan diri dan mengatasi trauma penderaan."]},{"f":"Melaporkan kepada pihak berkuasa","h":["Guru atau pentadbir sekolah perlu melaporkan kes kepada pihak JKM atau polis untuk siasatan dan tindakan lanjut."]},{"f":"Merujuk kepada unit kesihatan sekolah","h":["Sekolah boleh membantu mendapatkan pemeriksaan kesihatan atau rawatan kecederaan yang dialami murid."]},{"f":"Mengadakan perjumpaan dengan ibu bapa","h":["Guru boleh memanggil penjaga untuk berbincang bagi menyelesaikan masalah secara harmoni, jika selamat dilakukan."]},{"f":"Memberi sokongan akademik dan moral","h":["Guru membantu murid dari segi pembelajaran dan sokongan emosi agar murid tidak ketinggalan dalam pelajaran."]},{"f":"Menyediakan program kesedaran penderaan kanak-kanak","h":["Aktiviti seperti ceramah atau pameran boleh mendidik murid dan guru untuk mengenal pasti tanda-tanda penderaan."]},{"f":"Menyediakan tempat selamat dan mesra murid","h":["Sekolah harus menjadi ruang yang kondusif dan bebas daripada tekanan bagi memberi ketenangan kepada murid."]}],"kbat":false}
]},
{"n":3,"sec":"A","topic":"Hak Asasi Manusia","title":"Remaja tempatan tanpa dokumen pengenalan diri","stim":"JASIN: Seorang remaja lelaki berusia 13 tahun didapati tidak memiliki dokumen pengenalan diri semasa pemeriksaan polis. Ibunya, warga tempatan, tidak mengetahui prosedur pendaftaran kelahiran kerana anaknya dilahirkan di rumah. Remaja tersebut kini membantu keluarganya berniaga di pasar dan menurut JPN, ketiadaan dokumen sah menyebabkan kanak-kanak berisiko dinafikan hak asas.","marks":10,"parts":[
{"l":"a","q":"Nyatakan dua contoh dokumen pengenalan diri sebagai warganegara Malaysia.","m":2,"a":["Sijil Kelahiran Malaysia — dikeluarkan oleh Jabatan Pendaftaran Negara (JPN) sebagai bukti kelahiran sah di Malaysia.","Kad Pengenalan/MyKad/IC — kad rasmi pengenalan diri bagi warganegara Malaysia berumur 12 tahun ke atas.","Pasport Malaysia — dokumen perjalanan antarabangsa yang hanya dikeluarkan kepada warganegara Malaysia.","Kad Pengenalan Kanak-kanak/MyKid — dikeluarkan kepada kanak-kanak bawah umur 12 tahun."],"kbat":false},
{"l":"b","q":"Jelaskan kesan yang mungkin berlaku sekiranya seseorang individu tidak memiliki dokumen pengenalan diri yang sah sebagai warganegara.","m":4,"a":[{"f":"Tidak dapat mengakses pendidikan formal","h":["Individu tanpa dokumen tidak dapat mendaftar ke sekolah kerajaan kerana sistem memerlukan nombor kad pengenalan atau sijil kelahiran."]},{"f":"Sukar mendapat rawatan di hospital kerajaan","h":["Tanpa pengenalan diri sah, individu mungkin perlu membayar kos rawatan sebagai bukan warganegara yang jauh lebih tinggi."]},{"f":"Tidak layak menerima bantuan kebajikan","h":["Agensi seperti JKM memerlukan bukti kewarganegaraan untuk menyalurkan bantuan kewangan dan makanan."]},{"f":"Sukar memperoleh pekerjaan formal","h":["Majikan tidak dapat menggaji individu tanpa kad pengenalan kerana akan melanggar undang-undang buruh dan imigresen."]},{"f":"Berisiko ditahan oleh pihak berkuasa","h":["Individu tanpa dokumen boleh disyaki sebagai pendatang asing tanpa izin dan mungkin dikenakan tindakan undang-undang."]},{"f":"Tidak layak mengundi semasa pilihan raya","h":["Ketiadaan MyKad menghalang individu daripada menunaikan tanggungjawab sebagai pengundi yang sah."]},{"f":"Tidak boleh memiliki harta secara sah","h":["Pendaftaran harta seperti tanah atau rumah memerlukan dokumen sah untuk membuktikan status warganegara."]},{"f":"Terpinggir daripada pembangunan negara","h":["Mereka tidak terlibat dalam sistem rasmi negara, sekaligus menjadikan mereka tidak berpeluang meningkatkan taraf hidup."]}],"kbat":false},
{"l":"c","q":"Andaikan anda terjumpa seorang remaja warga tempatan yang tidak mempunyai dokumen pengenalan diri. Huraikan tindakan yang boleh anda lakukan untuk membantu individu tersebut.","m":4,"a":[{"f":"Memberi kesedaran tentang pentingnya dokumen pengenalan diri","h":["Supaya remaja tersebut memahami bahawa dokumen seperti sijil kelahiran dan kad pengenalan penting untuk menikmati hak sebagai warganegara."]},{"f":"Menasihati remaja tersebut agar berbincang dengan ibu bapa atau penjaga","h":["Perbincangan ini boleh membuka jalan untuk membuat permohonan rasmi di Jabatan Pendaftaran Negara (JPN)."]},{"f":"Membantu mereka mendapatkan maklumat prosedur pendaftaran","h":["Saya boleh menyemak laman web rasmi JPN/bertanya kepada guru untuk mendapatkan langkah yang betul."]},{"f":"Mendapatkan bantuan daripada guru kaunseling atau pihak sekolah","h":["Guru boleh membantu mengeluarkan surat sokongan/menghubungkan keluarga dengan pihak JPN/NGO."]},{"f":"Mencadangkan kepada keluarga untuk membuat laporan di balai polis sekiranya perlu","h":["Sesetengah permohonan dokumen memerlukan pengesahan/laporan kehilangan/kelewatan pendaftaran."]},{"f":"Menghubungi NGO atau badan kebajikan yang boleh membantu","h":["NGO boleh membantu dari segi nasihat guaman/proses dokumentasi."]},{"f":"Menawarkan sokongan moral kepada remaja tersebut","h":["Ini penting agar dia tidak berasa terpinggir/malu, seterusnya lebih bersemangat untuk menyelesaikan isu ini."]}],"kbat":true}
]},
{"n":4,"sec":"A","topic":"Semangat Bermasyarakat","title":"Penyertaan remaja dalam program komuniti","stim":"Raju: Hai James, awak ada rancangan hujung minggu ni?\nJames: Tak ada lagi. Kenapa?\nRaju: Jom sertai program komuniti di padang sekolah kita.\nJames: Baiklah, saya ikut. Lagi pun, elok juga buat aktiviti yang bermanfaat.","marks":10,"parts":[
{"l":"a","q":"Nyatakan contoh program komuniti yang boleh disertai oleh golongan remaja.","m":3,"a":["Gotong-royong kebersihan kawasan sekolah/taman perumahan.","Program kitar semula dan pengasingan sisa pepejal.","Kempen derma darah/organ.","Program khidmat masyarakat ke rumah orang tua/anak yatim/OKU.","Aktiviti penanaman pokok/landskap komuniti.","Program bimbingan akademik untuk adik angkat/murid sekolah rendah.","Kelas digital atau ICT asas untuk warga emas/komuniti setempat.","Pameran kesihatan/senamrobik komuniti.","Larian amal/sukaneka komuniti.","Kempen antibuli/keselamatan jalan raya."],"kbat":false},
{"l":"b","q":"Huraikan kepentingan penglibatan golongan remaja dalam aktiviti komuniti.","m":3,"a":[{"f":"Meningkatkan kemahiran komunikasi","h":["Remaja belajar/berinteraksi dengan pelbagai pihak dalam komuniti."]},{"f":"Melatih kepimpinan dan pengurusan","h":["Remaja yang mengurus aktiviti seperti sukaneka/ceramah komuniti mendapat peluang memimpin dan membuat keputusan."]},{"f":"Mengisi masa lapang dengan aktiviti bermanfaat","h":["Masa yang digunakan untuk aktiviti komuniti menghindarkan remaja daripada membuang masa dengan perkara tidak berfaedah seperti melepak atau bermain telefon sepanjang hari."]},{"f":"Membentuk sikap tanggungjawab sosial","h":["Remaja yang terlibat dalam aktiviti membantu orang susah atau membersih kawasan awam akan menyedari peranan mereka terhadap masyarakat."]},{"f":"Memupuk semangat kerja berpasukan","h":["Remaja belajar bekerja dalam pasukan dengan individu berlainan bangsa, agama dan latar belakang, yang menyemai perpaduan."]},{"f":"Menanam nilai keprihatinan dan empati","h":["Apabila membantu golongan kurang bernasib baik seperti gelandangan atau warga emas, remaja belajar memahami dan menyantuni keperluan orang lain."]}],"kbat":false},
{"l":"c","q":"Jelaskan kesan sekiranya masyarakat kurang melibatkan diri dalam aktiviti komuniti.","m":4,"a":[{"f":"Hubungan kejiranan menjadi longgar","h":["Masyarakat tidak saling mengenali dan sukar membantu ketika kecemasan atau aktiviti bersama."]},{"f":"Nilai murni semakin terhakis","h":["Nilai murni tidak berkembang tanpa interaksi sosial yang konsisten."]},{"f":"Gejala sosial meningkat","h":["Remaja lebih mudah terlibat dalam vandalisme, buli atau penyalahgunaan dadah kerana tiada aktiviti positif mengisi masa lapang."]},{"f":"Masyarakat jadi tidak prihatin","h":["Keperluan golongan seperti OKU, warga emas dan keluarga miskin diabaikan kerana tiada rasa tanggungjawab sosial."]},{"f":"Kualiti hidup terjejas","h":["Kawasan perumahan menjadi kotor dan tidak selamat kerana tiada gotong-royong atau penjagaan bersama."]},{"f":"Perpaduan kaum rapuh","h":["Kurangnya aktiviti bersama menyebabkan jurang perkauman semakin luas dan wujud salah faham antara kaum."]},{"f":"Program komuniti gagal capai objektif","h":["Kempen seperti derma darah, kebersihan atau ceramah kesihatan tidak berjaya kerana kekurangan penyertaan."]}],"kbat":false}
]},

{"l":"b","q":"Malaysia sering bekerjasama dengan negara-negara ASEAN. Apakah bentuk kerjasama yang sering dilakukan oleh Malaysia dengan negara-negara ASEAN?","m":3,"a":[{"f":"Kerjasama dalam bidang ekonomi","h":["Malaysia menyertai Perjanjian Perdagangan Bebas ASEAN (AFTA) untuk memperluas pasaran dan meningkatkan pelaburan serantau."]},{"f":"Kerjasama dalam bidang pendidikan","h":["Malaysia menyertai program pertukaran pelajar, penyelidikan dan latihan guru melalui ASEAN University Network (AUN)."]},{"f":"Kerjasama dalam bidang keselamatan","h":["Malaysia menjalankan operasi ketenteraan bersama dan berkongsi maklumat keselamatan untuk membanteras keganasan dan penyeludupan."]},{"f":"Kerjasama dalam bidang alam sekitar","h":["Malaysia bekerjasama dalam menangani isu jerebu rentas sempadan, pemanasan global dan pemeliharaan biodiversiti serantau."]},{"f":"Kerjasama dalam bidang kesihatan","h":["Malaysia bersama negara ASEAN berkongsi data kesihatan awam dan melaksanakan pelan tindak balas terhadap wabak seperti COVID-19."]},{"f":"Kerjasama dalam bidang pelancongan","h":["Malaysia menyertai ASEAN Tourism Forum untuk memperkenalkan pakej pelancongan serantau dan meningkatkan kemasukan pelancong."]}],"kbat":false},
{"l":"c","q":"Terangkan kepentingan hubungan Malaysia dengan negara luar.","m":4,"a":[{"f":"Meningkatkan perdagangan antarabangsa","h":["Hubungan diplomatik memudahkan eksport dan import barangan serta perkhidmatan antara negara."]},{"f":"Meningkatkan pelaburan asing","h":["Kerjasama yang baik menarik minat pelabur luar untuk menanam modal di Malaysia."]},{"f":"Memperkukuh keselamatan dan pertahanan","h":["Malaysia dapat bekerjasama dalam latihan ketenteraan dan perkongsian maklumat keselamatan."]},{"f":"Perkongsian kepakaran dan teknologi","h":["Hubungan dengan negara maju membolehkan Malaysia mempelajari teknologi baharu dan inovasi."]},{"f":"Pengukuhan sektor pelancongan","h":["Promosi pelancongan dua hala meningkatkan kehadiran pelancong asing ke Malaysia."]},{"f":"Meningkatkan imej dan pengaruh Malaysia di peringkat antarabangsa","h":["Kerjasama diplomatik yang aktif menjadikan Malaysia dihormati dan diberi peranan penting dalam badan antarabangsa seperti PBB dan ASEAN."]}],"kbat":false}
]},
{"n":6,"sec":"B","topic":"Perpaduan","title":"Perpaduan mengekalkan keharmonian","note":"Bahagian B — Jawab SATU soalan sahaja (Soalan 6 atau Soalan 7)","stim":"Gambar 2: Rakyat Malaysia pelbagai kaum berpakaian tradisional sambil mengibarkan Jalur Gemilang dengan slogan 'PERPADUAN MENGEKALKAN KEHARMONIAN'. (Sumber: fb Kementerian Perpaduan Malaysia)","marks":10,"parts":[
{"l":"a","q":"Nyatakan contoh amalan perpaduan dikalangan rakyat Malaysia.","m":2,"a":["Membuat rondaan keselamatan kawasan bersama.","Berkomunikasi antara jiran melalui aplikasi media sosial.","Menyertai sambutan Hari Kebangsaan secara bersama.","Mengibarkan Jalur Gemilang oleh semua kaum.","Menyokong pasukan negara tanpa mengira kaum.","Menyertai acara sukan bersama pelbagai kaum.","Menghadiri rumah terbuka pelbagai kaum.","Membantu mangsa bencana tanpa mengira kaum.","Menjalankan khidmat komuniti secara bersama."],"kbat":false},
{"l":"b","q":"Huraikan kepentingan amalan perpaduan dalam kalangan masyarakat Malaysia.","m":8,"a":[{"f":"Menjamin keamanan negara","h":["Rakyat hidup dalam keadaan aman tanpa ancaman rusuhan kaum.","Tiada perbalahan atau pergaduhan antara kaum.","Rakyat bebas bergerak dan berinteraksi tanpa rasa takut."]},{"f":"Memupuk semangat kekitaan","h":["Rakyat berasa mereka sebahagian daripada satu bangsa.","Setiap individu berperanan menjaga keharmonian negara.","Perpaduan mencetuskan semangat nasionalisme."]},{"f":"Meningkatkan keharmonian hidup masyarakat","h":["Rakyat menghormati adat dan budaya kaum lain.","Kehidupan masyarakat menjadi lebih tenteram dan bahagia.","Tiada diskriminasi antara kaum dalam kehidupan seharian."]},{"f":"Menggalakkan kerjasama antara kaum","h":["Semua kaum dapat berganding bahu dalam aktiviti masyarakat.","Perbezaan kaum tidak menjadi halangan dalam kerja berpasukan."]},{"f":"Meningkatkan imej negara di mata dunia","h":["Malaysia dikenali sebagai negara aman dan bersatu padu.","Rakyat Malaysia dipandang tinggi oleh masyarakat antarabangsa.","Pelancong lebih tertarik untuk melawat negara yang bersatu."]},{"f":"Menarik pelaburan asing","h":["Pelabur yakin dengan kestabilan dan keamanan negara.","Kemasukan pelabur membantu menjana ekonomi negara."]},{"f":"Menjamin kestabilan politik dan ekonomi","h":["Negara mampu membina sistem politik yang kukuh.","Ekonomi berkembang hasil daripada keamanan dalaman.","Peluang pekerjaan dan perniagaan berkembang."]},{"f":"Mengelakkan perpecahan masyarakat","h":["Sikap bersatu padu mengurangkan jurang perkauman.","Keharmonian memelihara struktur sosial yang sihat."]}],"kbat":false}
]},

{"n":8,"sec":"C","topic":"Pengurusan Kewangan","title":"Pengurusan perbelanjaan secara beretika","stim":"Dalam kehidupan, setiap individu membelanjakan sejumlah wang untuk memenuhi keperluan harian. Perbelanjaan ini perlu diuruskan secara beretika bagi menjamin kewangan yang stabil. Pengurusan perbelanjaan secara beretika bermaksud cara wang dibelanjakan dan diuruskan dengan berhemah untuk mendapatkan sesuatu barangan dan perkhidmatan.","marks":20,"parts":[
{"l":"a","q":"Senaraikan cara pengurusan perbelanjaan secara beretika yang perlu diamalkan oleh golongan muda.","m":4,"a":[{"f":"Merancang perbelanjaan secara bijak","h":["Menyediakan bajet bulanan untuk membezakan antara keperluan dan kehendak."]},{"f":"Membuat simpanan secara konsisten","h":["Menyimpan sekurang-kurangnya 10% daripada pendapatan atau elaun setiap bulan."]},{"f":"Mengutamakan keperluan berbanding kehendak","h":["Membeli barangan asas sebelum barangan kehendak seperti gajet baharu."]},{"f":"Mengelakkan pembaziran dan pembelian tergesa-gesa","h":["Berfikir dahulu sebelum membeli dan elakkan tawaran palsu dalam talian."]},{"f":"Membuat perbandingan harga sebelum membeli","h":["Membeli dari tempat yang menawarkan harga terbaik dengan kualiti yang sama."]},{"f":"Membayar hutang atau pinjaman mengikut masa","h":["Mengelakkan dikenakan faedah tambahan dan rekod kredit buruk."]},{"f":"Menggunakan kad kredit dengan berhemah atau mengelakkannya","h":["Hanya gunakan kad kredit untuk kecemasan dan membayar balik sepenuhnya."]},{"f":"Menyimpan rekod perbelanjaan harian","h":["Mengetahui aliran keluar wang dan menilai semula tabiat berbelanja."]}],"kbat":false},
{"l":"b","q":"Huraikan kepentingan pengurusan perbelanjaan secara beretika.","m":8,"a":[{"f":"Membantu menstabilkan kewangan diri","h":["Individu dapat mengurus pendapatan dan perbelanjaan mengikut keutamaan.","Tidak mengalami kekurangan wang sebelum hujung bulan.","Dapat menyusun jadual pembayaran dan simpanan secara tetap."]},{"f":"Menjamin masa depan yang lebih terancang","h":["Perancangan awal membolehkan tabungan jangka panjang dibuat.","Boleh melanjutkan pelajaran atau membeli aset masa hadapan.","Masa depan kewangan lebih terjamin dan stabil."]},{"f":"Mewujudkan disiplin diri","h":["Membentuk tabiat menyimpan dan berbelanja secara berhemah.","Tahu membezakan antara keperluan dan kehendak.","Menjadi individu yang boleh dipercayai dalam pengurusan wang."]},{"f":"Mengelakkan beban hutang","h":["Individu dapat mengelakkan pinjaman tidak perlu.","Mengelakkan bayaran faedah tinggi akibat tunggakan.","Tidak terjerat dalam masalah muflis."]},{"f":"Memupuk nilai kesederhanaan dalam kehidupan","h":["Menghindari pembaziran dalam kehidupan seharian.","Berbelanja berpada-pada mengikut kemampuan.","Menjadi contoh kepada rakan-rakan dalam mengurus wang."]},{"f":"Membantu membuat keputusan kewangan yang bijak","h":["Keputusan perbelanjaan berdasarkan keperluan dan nilai wang.","Tidak mudah terpengaruh dengan iklan atau promosi palsu."]},{"f":"Memberi ketenangan emosi dan mental","h":["Perbelanjaan terkawal mengurangkan tekanan kewangan.","Kurang tekanan akibat tiada masalah kewangan.","Menjalani hidup dengan lebih tenang dan sejahtera."]},{"f":"Menyediakan simpanan untuk kecemasan","h":["Wang simpanan boleh digunakan semasa sakit atau kemalangan.","Tidak perlu bergantung kepada pinjaman orang lain.","Mempunyai perlindungan kewangan dalam keadaan terdesak."]}],"kbat":false},
{"l":"c","q":"Terangkan kesan pengurusan perbelanjaan tidak beretika. Justifikasikan jawapan anda berdasarkan nilai-nilai universal yang dipelajari.","m":8,"a":["Nilai yang boleh dijustifikasikan: Rasional, Kesederhanaan, Bertanggungjawab, Kejujuran, Berdikari.",{"f":"Menyebabkan masalah kewangan yang berterusan","h":["Individu sering kehabisan wang sebelum hujung bulan.","Tidak dapat memenuhi keperluan asas seperti makanan dan tempat tinggal.","Terpaksa bergantung kepada orang lain untuk menyara hidup. (Nilai: Bertanggungjawab — individu gagal mengurus kewangan secara bertanggungjawab)"]},{"f":"Menjejaskan kesihatan mental dan emosi","h":["Hidup dalam tekanan akibat beban kewangan.","Mudah berasa murung atau hilang keyakinan diri.","Boleh menjejaskan hubungan sosial dan keluarga. (Nilai: Kesederhanaan — kurang amalan berjimat cermat menyebabkan tekanan hidup)"]},{"f":"Mendorong kepada amalan pembaziran","h":["Membeli barangan yang tidak diperlukan secara berlebihan.","Tidak menilai harga atau kualiti sebelum membeli.","Sumber digunakan tanpa pertimbangan bijak. (Nilai: Rasional — kekurangan pemikiran rasional dalam membuat keputusan membeli)"]},{"f":"Terjebak dalam hutang yang membebankan","h":["Terpaksa membuat pinjaman untuk menampung gaya hidup.","Tidak mampu membayar hutang tepat pada masanya.","Akhirnya disenarai hitam oleh institusi kewangan. (Nilai: Berdikari — gagal mengurus kewangan sendiri sehingga bergantung pada pinjaman)"]},{"f":"Menghalang pencapaian matlamat jangka panjang","h":["Tidak dapat menyimpan wang untuk masa depan.","Matlamat seperti menyambung pengajian atau melancong terbantut.","Hidup hanya tertumpu kepada keperluan jangka pendek. (Nilai: Bertanggungjawab — gagal merancang masa depan secara bertanggungjawab)"]},{"f":"Menjejaskan imej dan reputasi diri","h":["Individu dilihat sebagai boros dan tidak dipercayai.","Sukar dipercayai untuk mengendalikan urusan kewangan.","Menjejaskan peluang pekerjaan atau pinjaman. (Nilai: Kejujuran — kegagalan mengurus wang menggambarkan kurang jujur terhadap tanggungjawab sendiri)"]}],"kbat":true}
]},
{"n":9,"sec":"C","topic":"Kebebasan dan Tanggungjawab","title":"Dilema James — program pertukaran pelajar antarabangsa","stim":"James terpilih menyertai program pertukaran pelajar ke Amerika Syarikat selama enam bulan. Walaupun hatinya teruja, fikirannya bercelaru. Ibunya kurang sihat dan tidak mahu berjauhan dengannya. Pada masa yang sama, peluang ini amat berharga untuk masa depannya. James sering meminta pendapat guru dan rakan, tetapi masih belum membuat keputusan. Dia duduk termenung setiap hari, memikirkan apa yang terbaik untuk dirinya dan keluarganya.","marks":20,"parts":[
{"l":"a","q":"Andaikan anda ialah James, apakah pilihan anda apabila berhadapan situasi di atas? Huraikan pilihan anda.","m":4,"a":["--- PILIHAN 1: Menyertai program pertukaran pelajar ke Amerika Syarikat ---","Saya memilih untuk menyertai program pertukaran pelajar ke Amerika Syarikat.","Peluang ini amat berharga untuk menimba ilmu dan pengalaman antarabangsa yang sukar diperoleh di tempat lain.","Saya akan memperoleh pendedahan budaya baharu serta meningkatkan kemahiran komunikasi dan berdikari.","Pengalaman ini juga akan memberi kelebihan untuk masa depan akademik dan kerjaya saya.","--- ATAU ---","--- PILIHAN 2: Menolak tawaran demi menjaga ibu yang kurang sihat ---","Saya memilih untuk tidak menyertai program pertukaran pelajar dan kekal bersama ibu.","Perhatian terhadap keluarga lebih utama kerana ibu memerlukan perhatian saya dalam keadaan kesihatannya yang tidak menentu.","Saya boleh terus belajar di sekolah sedia ada dan mencari peluang lain yang tidak memerlukan saya berjauhan lama.","Keputusan ini dapat memberikan ketenangan jiwa kerana saya dapat menjaga ibu."],"kbat":true},
{"l":"b","q":"Terangkan dua kepentingan menyertai program pertukaran pelajar kepada pelajar. Jawapan anda hendaklah disokong dengan nilai-nilai universal yang dipelajari.","m":8,"a":["Nilai yang boleh dijustifikasikan: Kerjasama, Baik hati, Toleransi, Harga diri, Keberanian.",{"f":"Meningkatkan kemahiran komunikasi antarabangsa","h":["Pelajar berpeluang berkomunikasi dalam bahasa asing dengan lebih yakin.","Membantu menguasai bahasa dengan lebih fasih melalui situasi sebenar.","Dapat menyesuaikan diri dalam pelbagai situasi komunikasi global. (Nilai: Harga diri — pelajar meningkatkan keyakinan diri melalui pengalaman antarabangsa)"]},{"f":"Meneroka budaya baharu","h":["Memberikan pengalaman langsung tentang adat, nilai dan cara hidup masyarakat asing.","Membentuk sikap terbuka dan menghormati perbezaan budaya.","Membantu pelajar menjadi lebih bertoleransi dan memahami masyarakat global. (Nilai: Toleransi — pelajar belajar menghormati perbezaan budaya)"]},{"f":"Memperluas pengetahuan akademik dan global","h":["Pelajar didedahkan kepada sistem pendidikan yang berbeza.","Mempelajari pendekatan pembelajaran inovatif dan berorientasikan global.","Membina pemikiran kritis dan kreatif melalui pendedahan pelbagai perspektif."]},{"f":"Meningkatkan keyakinan dan kematangan diri","h":["Pelajar belajar berdikari jauh dari keluarga.","Membentuk jati diri dan kemahiran mengurus masa serta emosi.","Menjadi lebih yakin membuat keputusan dan bergaul dengan masyarakat. (Nilai: Keberanian — berani menghadapi cabaran baru di luar zon selesa)"]},{"f":"Mewujudkan rangkaian persahabatan antarabangsa","h":["Membina hubungan dengan rakan dari pelbagai latar belakang negara.","Membuka peluang untuk kolaborasi pada masa depan dalam akademik dan kerjaya.","Memperkukuh nilai perpaduan dan kerjasama antara budaya. (Nilai: Kerjasama — membina hubungan dan bekerjasama merentasi sempadan negara)"]},{"f":"Memberi kelebihan dalam permohonan universiti dan kerjaya","h":["Pengalaman global menjadi nilai tambah dalam resume pelajar.","Universiti dan majikan menghargai calon yang memiliki pengalaman antarabangsa."]}],"kbat":true},
{"l":"c","q":"Huraikan cabaran yang mungkin dihadapi oleh pelajar semasa menyertai program pertukaran pelajar.","m":8,"a":[{"f":"Perbezaan bahasa dan komunikasi","h":["Sukar memahami arahan dan berkomunikasi dengan jelas dalam bahasa asing.","Boleh menyebabkan kekeliruan dan salah faham dalam perbualan harian.","Pelajar mungkin berasa malu atau takut untuk bertutur dalam bahasa bukan ibunda."]},{"f":"Perbezaan budaya dan cara hidup","h":["Menghadapi kejutan budaya apabila berdepan norma yang berbeza.","Pelajar mungkin tidak biasa dengan makanan, pakaian atau rutin negara tuan rumah.","Rasa kekok atau sukar menyesuaikan diri dengan persekitaran baru."]},{"f":"Rindu kepada keluarga dan tanah air","h":["Perpisahan dalam tempoh lama boleh menyebabkan rasa sedih dan sunyi.","Menjejaskan emosi dan tumpuan dalam pembelajaran.","Pelajar kurang semangat kerana tiada sokongan keluarga secara fizikal."]},{"f":"Perbezaan sistem pendidikan dan pembelajaran","h":["Pelajar mungkin keliru dengan struktur jadual dan kaedah pengajaran.","Sukar mengikuti mata pelajaran tertentu yang lebih kompleks.","Menjejaskan prestasi akademik jika tidak segera menyesuaikan diri."]},{"f":"Keterbatasan makanan halal atau keperluan agama","h":["Sukar mendapatkan makanan halal di sesetengah negara.","Kekangan untuk menunaikan ibadah dalam persekitaran baharu.","Boleh menjejaskan keselesaan dan ketenangan diri."]},{"f":"Perbelanjaan tinggi sepanjang program","h":["Kos sara hidup di negara maju boleh membebankan pelajar.","Tidak semua aktiviti ditanggung oleh penganjur program.","Pelajar perlu bijak mengurus wang untuk bertahan sepanjang tempoh program."]},{"f":"Tekanan untuk menyesuaikan diri dalam kalangan rakan baharu","h":["Pelajar rasa terasing jika tiada sokongan sosial yang baik.","Sukar membina persahabatan kerana latar belakang yang berbeza.","Boleh menyebabkan rasa rendah diri atau tidak yakin."]},{"f":"Isu diskriminasi atau stereotaip budaya","h":["Berdepan dengan prejudis terhadap asal usul const TRACK_URL = 'https://track.vircle.tech/hit';
function track(e, extra){
  try {
    fetch(TRACK_URL, {
      method:'POST', keepalive:true,

const $$ = (s,r=document)=>[...r.querySelectorAll(s)];

/* field may be a plain string or {bm,en} */
function T(v){
  if(v==null) return '';
  if(typeof v === 'string') return v;
  return v[LANG] || v.en || v.bm || '';
}
/* Render text: pipe-tables, bullet lists, newlines → HTML */
function mdT(v){
  let s = T(v);
  if(!s) return s;
  s = s.replace(/((?:[^\n]*\|[^\n]*(?:\n|$)){2,})/g, block => {
    const rows = block.split('\n').map(r=>r.trim()).filter(Boolean);
    if(rows.length < 2) return block;
    const toRow = (r, tag) =>
      '<tr>'+r.split('|').map(c=>`<${tag}>${c.trim()}</${tag}>`).join('')+'</tr>';
    const [h,...body] = rows;
    return '<table><thead>'+toRow(h,'th')+'</thead><tbody>'+body.map(r=>toRow(r,'td')).join('')+'</tbody></table>';
  });
  s = s.replace(/((?:[ \t]*•[^\n]*(?:\n|$))+)/g, block => {
    const items = block.split('\n')
      .map(l=>l.replace(/^[ \t]*•\s*/,'').trim()).filter(Boolean)
      .map(l=>'<li>'+l+'</li>').join('');
    return '<ul class="qlist">'+items+'</ul>';
  });
  s = s.replace(/\n/g,'<br>');
  return s;
}
function pad(n){ n=n|0; return n<10 ? '0'+n : ''+n; }
function mmss(s){ s=Math.max(0,s|0); return pad(s/60)+':'+pad(s%60); }
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200);
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function attr(s){ return String(s).replace(/"/g,'&quot;'); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function nl(s){ return esc(s||'').replace(/\n/g,'<br>'); }

function stimFmt(raw){
  if(!raw) return '';
  let s = esc(raw);
  // [Kotak: A; B; C; D] → CSS grid of boxes
  s = s.replace(/\[Kotak:\s*([^\]]+)\]/gi, (_, items)=>{
    const cells = items.split(';').map(c=>c.trim()).filter(Boolean);
    const cols = cells.length<=3 ? cells.length : 2;
    return '<div class="kotak-grid" style="grid-template-columns:repeat('+cols+',1fr)">'
      +cells.map(c=>'<div class="kotak-cell">'+c+'</div>').join('')+'</div>';
  });
  s = s.replace(/\[Kotak\]/gi,'<div class="stim-ph">[Rajah — rujuk kertas asal]</div>');
  // [Jadual...] → table callout
  s = s.replace(/\[Jadual(?:\s+[^\]:]*)?\]/gi,'<div class="stim-block"><span class="stim-lbl">JADUAL</span> rujuk kertas asal</div>');
  s = s.replace(/\[Jadual:\s*([^\]]+)\]/gi,(_,d)=>'<div class="stim-block"><span class="stim-lbl">JADUAL</span> '+d+'</div>');
  // [Rajah...: ...] → diagram description
  s = s.replace(/\[Rajah[^:\]]*:\s*([^\]]+)\]/gi,(_,d)=>
    '<div class="stim-block"><span class="stim-lbl">RAJAH</span> '+d.replace(/->/g,'→')+'</div>');
  // [Carta...: ...] → chart description
  s = s.replace(/\[Carta[^:\]]*:\s*([^\]]+)\]/gi,(_,d)=>
    '<div class="stim-block"><span class="stim-lbl">CARTA</span> '+d+'</div>');
  // [Label N(x): text] → labelled callout (Petikan, Maklumat, Poster, Pantun, etc.)
  s = s.replace(/\[([A-Za-z][^:\]]{0,30}):\s*([^\]]+)\]/g,(_,lbl,txt)=>
    '<div class="stim-block"><span class="stim-lbl">'+lbl+'</span> '+txt+'</div>');
  return s.replace(/\n/g,'<br>');
}

function topicInfo(subject,code){
  const t=(TOPICS[subject]||{})[code];
  return t ? {name:T(t), form:t.form} : {name:code||'UNTAGGED', form:''};
}

/* ---------- flatten packs into one bank ---------- */
const BANK=[];
(window.SPM.packs||[]).forEach(pack=>{
  const m=pack.meta||{};

    const isPaper2 = m.paper===2 || (q.parts && q.parts.length>0);
    const ti=topicInfo(m.subject,q.topic);
    BANK.push({
      uid: (m.id||'pack')+'#'+(q.n!=null?q.n:i+1),
      packId:m.id, subject:m.subject||'?', state:m.state||'?', year:m.year||'',
      paper:m.paper||1, kind:m.kind||'trial', ans:m.answers||'skema',

      // P2 fields (Sejarah-compatible naming)
      sec: q.sec || q.section || 'A',
      title: q.title || '',
      stim: q.stim || '', stimHtml: q.stimHtml || null, bm: q.bm || null,
      marks: (q.parts||[]).reduce((t,p)=>t+(+p.m||0),0) || q.marks || 0,

function tname(q){ return q.topicRaw ? T(q.topicRaw) : topicInfo(q.subject,q.topic).name; }

/* ---------- filters ---------- */
const F={ subject:null, states:new Set(), forms:new Set(), topics:new Set(), years:new Set(),
          mode:'practice', count:'all', shuffle:true, source:'all', paper:1 };

function subjects(){ return [...new Set(BANK.map(q=>q.subject))].sort(); }
function pool(ignore){
  return BANK.filter(q=>{
    if(F.subject && q.subject!==F.subject) return false;
    if(q.paper !== F.paper) return false;
    if(ignore!=='states' && F.states.size && !F.states.has(q.state)) return false;
    if(ignore!=='forms'  && F.forms.size  && !F.forms.has(q.form))   return false;
    if(ignore!=='topics' && F.topics.size && !F.topics.has(q.topic)) return false;
    if(ignore!=='years'  && F.years.size  && !F.years.has(q.year))   return false;
    const p=DB.d.progress[q.uid];
    if(F.source==='wrong'  && !(p && p.lastOk===false)) return false;
    if(F.source==='unseen' &&  (p && p.seen))           return false;
    if(F.source==='weak'   && !(p && p.box<3))          return false;
    return true;
  });
}

/* =========================================================================

   ========================================================================= */
let S=null, timerId=null;

function leaveDrill(then){
  if(timerId) clearInterval(timerId);
  S=null;
  then();
}

function startSession(list){
  let items = list ? list.slice() : pool();
  if(F.shuffle) shuffle(items);
  else items.sort((a,b)=> a.packId===b.packId ? a.n-b.n : String(a.packId).localeCompare(String(b.packId)));
  if(!list && F.count!=='all') items = items.slice(0, Math.min(+F.count, items.length));
  if(!items.length){ toast('NOTHING MATCHES THAT FILTER'); return; }

  const isP2 = items[0].type === 'structured';
  S={ items, idx:0, picks:{}, flags:new Set(), mode: isP2 ? 'p2' : F.mode,
      startedAt:Date.now(), limit: (!isP2 && F.mode==='exam') ? items.length*75 : 0, done:false,
      open:{}, marks:{}, lang:'en' };
  if(timerId) clearInterval(timerId);
  if(S.limit) timerId=setInterval(tick,1000);

  if(isP2) renderP2Quiz();
  else renderQuiz();
  window.scrollTo({top:0});
}

function tick(){
  if(!S||S.done) return;
  const left = S.limit - ((Date.now()-S.startedAt)/1000|0);
  const el=$('#clock');
  if(el){ el.textContent=mmss(left); el.classList.toggle('warn',left<300); }
  if(left<=0){ clearInterval(timerId); toast('TIME UP'); finish(); }
}

                       : '<button class="btn mutebtn" id="skip">SKIP</button>'))+
       '</div>'+
       '<p class="hint">KEYS: A&ndash;'+LTR[Math.max(0,q.o.length-1)]+' OR 1&ndash;'+q.o.length+' TO ANSWER &middot; ENTER = NEXT &middot; F = FLAG &middot; G = GRID &middot; ESC = EXIT</p>'+
     '</div>'+

     '<div class="navg" id="grid"><div class="cells">'+
       S.items.map((x,i)=>{
         let c='cell'+(i===S.idx?' cur':'');
         const p=S.picks[x.uid];
         if(p!=null) c += S.mode==='practice' ? (p===x.a?' ok':' no') : ' done';
         if(S.flags.has(x.uid)) c+=' flag';
         return '<button class="'+c+'" data-j="'+i+'">'+(i+1)+'</button>';
       }).join('')+
     '</div></div>'+
   '</div>';

  $$('.opt',app).forEach(b=>b.addEventListener('click',()=>choose(+b.dataset.i)));
  const on=(id,fn)=>{const e=$('#'+id); if(e) e.addEventListener('click',fn);};
  on('next',go1); on('skip',go1);
  on('prev',()=>{ S.idx--; renderQuiz(); });
  on('flag',()=>{ S.flags.has(q.uid)?S.flags.delete(q.uid):S.flags.add(q.uid); renderQuiz(); });
  on('quit',()=>{ if(confirm('Submit the paper now?')) finish(); });
  on('exit',()=>leaveDrill(renderSetup));
  on('btnGrid',()=>$('#grid').classList.toggle('show'));
  $$('.cell',app).forEach(b=>b.addEventListener('click',()=>{ S.idx=+b.dataset.j; renderQuiz(); }));
  renderMath();
}

function choose(i){
  const q=S.items[S.idx];
  if(S.mode==='practice' && S.picks[q.uid]!=null) return;
  S.picks[q.uid]=i;
  if(S.mode==='practice'){
    DB.record(q.uid, i===q.a); DB.save();
    track('answer',{subject:F.subject, pack:q.pack, correct:i===q.a?1:0});
  }
  renderQuiz();
}
function go1(){ if(S.idx<S.items.length-1){ S.idx++; renderQuiz(); } else finish(); }

/* =========================================================================
   P2 STRUCTURED QUIZ  (Sejarah-compatible: per-part DAPAT/BELUM marks)
   ========================================================================= */

function pts2(arr){
  if(!arr||!arr.length) return '';
  return '<ol class="pts">'+arr.map(s=>{
    if(typeof s==='string') return '<li>'+esc(s)+'</li>';
    // structured object: {f: "Feature heading", h: ["hint1","hint2",...]}
    const feat = s.f ? '<b>'+esc(s.f)+'</b>' : '';
    const hints = (s.h||[]).map(h=>'<li>'+esc(h)+'</li>').join('');
    return '<li>'+feat+(hints?'<ul class="pts-sub">'+hints+'</ul>':'')+'</li>';
  }).join('')+'</ol>';
}

function L(en, bm){ return (LANG==='bm' && bm) ? bm : (en||''); }

function renderP2Quiz(){
  const q=S.items[S.idx];
  const got=q.parts.reduce((t,p)=>t+(S.marks[q.uid+p.l]===true?(+p.m||0):0),0);
  const allMarked=q.parts.every(p=>S.marks[q.uid+p.l]!=null);

  const partHTML=p=>{
    const id=q.uid+p.l, open=S.open[id], mk=S.marks[id];
    const bp=q.bm&&q.bm.parts ? q.bm.parts.find(x=>x.l===p.l) : null;
    return '<div class="part'+(mk===true?' ok':mk===false?' no':'')+'">'+
      '<div class="pq">'+
        '<span class="pl">('+esc(p.l)+')</span>'+
        '<span>'+mdT(L(p.q, bp&&bp.q))+'</span>'+
        '<span class="pm">'+p.m+'m'+(p.kbat?' &middot; KBAT':'')+'</span>'+
      '</div>'+
      (p.img?'<img class="qimg" src="'+attr(p.img)+'" alt="Rajah">':'')+
      (open ?
        '<div class="pa">'+pts2(LANG==='bm'&&bp&&bp.a&&bp.a.length ? bp.a : p.a)+'</div>'+
        '<div class="selfm"><span>DID YOU GET IT?</span>'+
          '<button class="btn sm'+(mk===true?' on':'')+'" data-mk="1" data-id="'+attr(id)+'">&#10003; DAPAT</button>'+
          '<button class="btn sm bad'+(mk===false?' on':'')+'" data-mk="0" data-id="'+attr(id)+'">&#10007; BELUM</button>'+
        '</div>'
      : '<button class="btn mutebtn reveal" data-open="'+attr(id)+'">TUNJUK JAWAPAN &darr;</button>')+
    '</div>';
  };

  app.innerHTML=
   '<div class="card">'+
    '<div class="top"><div class="ctr-row"><span>SOALAN '+(S.idx+1)+' / '+S.items.length+'</span>'+
      '<span class="r">'+
        (q.bm ? '<button class="ghost" id="btnLangP2" style="padding:4px 8px;font-size:.72rem">'+(LANG==='bm'?'BM ✓':'EN/BM')+'</button>' : '')+
        '<span>SEKSYEN <b>'+q.sec+'</b></span><span>THIS Q <b>'+got+'/'+q.marks+'</b>m</span>'+
      '</span></div>'+
      '<div class="pbar"><i style="width:'+(S.idx/S.items.length*100)+'%"></i></div></div>'+
    '<div class="qbody">'+
      '<div class="meta">'+
        '<span class="tag am">'+q.form+'</span>'+
        '<span class="tag vi">'+tname(q)+'</span>'+
        '<span class="tag">'+esc(q.state)+(q.year?' '+q.year:'')+' &middot; Q'+q.n+'</span>'+
        '<span class="tag am">SEK '+q.sec+' &middot; '+q.marks+'m</span>'+
        (q.ans==='cadangan'?'<span class="tag" style="border-color:var(--badR);color:var(--badR)">CADANGAN</span>':'')+
      '</div>'+
      (q.title?'<div class="qq">'+esc(L(q.title, q.bm&&q.bm.title))+'</div>':
               (q.q?'<div class="qq">'+mdT(q.q)+'</div>':''))+
      (q.img?'<img class="qimg" loading="lazy" decoding="async"'+imgDim(q.img)+' src="'+attr(q.img)+'" alt="'+attr(T(q.alt)||'Rajah')+'">':'')+
      (q.alt&&!q.img?'<p class="alt">'+T(q.alt)+'</p>':'')+
      (LANG==='bm'&&q.bm&&q.bm.stim?'<div class="stim">'+stimFmt(q.bm.stim)+'</div>':
       q.stim?'<div class="stim">'+stimFmt(T(q.stim))+'</div>':'')+
      (q.stimHtml?'<div class="stim">'+q.stimHtml+'</div>':'')+
      q.parts.map(partHTML).join('')+
      (q.note?'<p class="alt">Nota: '+esc(L(q.note, q.bm&&q.bm.note))+'</p>':'')+
      '<div class="nav">'+
        '<button class="btn mutebtn" id="prev"'+(S.idx?'':' disabled')+'>&larr; BACK</button>'+
        '<button class="btn mutebtn" id="openall">REVEAL ALL</button>'+
        '<button class="btn mutebtn" id="exit">&#10005; EXIT</button>'+
        '<span class="sp"></span>'+
        '<button class="btn" id="next">'+(S.idx<S.items.length-1?(allMarked?'NEXT &rarr;':'SKIP &rarr;'):'SEE REPORT &rarr;')+'</button>'+
      '</div>'+
      '<p class="hint">SPACE = REVEAL NEXT &middot; 1 = DAPAT &middot; 0 = BELUM &middot; ENTER = NEXT &middot; ESC = EXIT</p>'+
    '</div></div>';

  $$('[data-open]',app).forEach(b=>b.addEventListener('click',()=>{S.open[b.dataset.open]=1; renderP2Quiz();}));
  $$('[data-mk]',app).forEach(b=>b.addEventListener('click',()=>mark2(b.dataset.id,b.dataset.mk==='1')));
  const on=(id,fn)=>{const e=$('#'+id); if(e) e.addEventListener('click',fn);};
  on('prev',()=>{S.idx--; renderP2Quiz();});
  on('next',go2);
  on('exit',()=>leaveDrill(renderSetup));
  on('openall',()=>{q.parts.forEach(p=>S.open[q.uid+p.l]=1); renderP2Quiz();});
  on('btnLangP2',()=>{LANG=LANG==='bm'?'en':'bm'; DB.d.settings.lang=LANG; DB.save(); renderP2Quiz();});
  renderMath();
  window.scrollTo({top:0});
}

function mark2(id,ok){ S.marks[id]=ok; DB.record(id,ok); DB.save(); renderP2Quiz(); }
function go2(){ if(S.idx<S.items.length-1){S.idx++; renderP2Quiz(); window.scrollTo({top:0});} else finishP2(); }

/* =========================================================================
   P2 SUMMARY  (marks-based, aligned with Sejarah K2)
   ========================================================================= */
function finishP2(){
  if(timerId) clearInterval(timerId);
  S.done=true;
  let got=0, tot=0;
  const byTopic=new Map();
  const missed=[];
  S.items.forEach(q=>{
    let g=0, t=0;
    q.parts.forEach(p=>{
      const mk=S.marks[q.uid+p.l];
      if(mk==null) return;
      t+=(+p.m||0); if(mk) g+=(+p.m||0);
    });
    got+=g; tot+=t;
    if(t){
      const r=byTopic.get(q.topic)||{name:tname(q),ok:0,tot:0};
      r.ok+=g; r.tot+=t; byTopic.set(q.topic,r);
    }
    if(q.parts.some(p=>S.marks[q.uid+p.l]===false)) missed.push(q);
  });

  DB.d.history.push(Object.assign({at:Date.now(),mode:'p2',score:got,total:tot||1,subject:F.subject},
    sessionInfo(S.items,S.items.filter(q=>q.parts.some(p=>S.marks[q.uid+p.l]!=null)).length)));
  if(DB.d.history.length>400) DB.d.history=DB.d.history.slice(-400);
  DB.save();

  const pct=tot?got/tot:0;
  const msg = pct>=.9 ? 'Excellent — cemerlang dalam kertas berstruktur!'
            : pct>=.7 ? 'Bagus! Ulang kaji mata yang salah dan cuba semula.'
            : pct>=.5 ? 'Boleh tahan. Fokus pada topik lemah di bawah.'
            : tot===0  ? 'Tiada bahagian ditanda — tandakan DAPAT/BELUM pada setiap bahagian.'
            : 'Perlu latihan lagi — baca skema jawapan dengan teliti dan cuba lagi.';

  const rows=[...byTopic.values()].sort((a,b)=>a.ok/a.tot-b.ok/b.tot)
    .map(r=>[r.name,r.ok,r.tot]);

  app.innerHTML=
   '<div class="card">'+
    '<div class="res">'+
      '<div class="score">'+got+'<span>/'+tot+'</span></div>'+
      '<div class="pc">MARKS SELF-ASSESSED &middot; KERTAS 2</div>'+
      '<p class="msg">'+msg+'</p>'+
    '</div>'+
    (rows.length?
      '<div class="sec" style="border-top:1px solid var(--line)"><div class="lab">BY TOPIC &mdash; weakest first (marks)</div>'+
        bars(rows)+'</div>':'')+
    '<div class="startrow">'+
      (missed.length?'<button class="cta" id="redo">RETAKE '+missed.length+' MISSED &rarr;</button>':'')+
      '<button class="btn mutebtn" id="again">&#8634; SAME FILTERS AGAIN</button>'+
      '<button class="btn mutebtn" id="home">&larr; TUKAR PILIHAN</button>'+
    '</div>'+
   '</div>';

  const on=(id,fn)=>{const e=$('#'+id); if(e) e.addEventListener('click',fn);};
  on('redo',()=>startSession(missed));
  on('again',()=>startSession());
  on('home',renderSetup);
  window.scrollTo({top:0});
}

/* =========================================================================
   P1 REPORT
   ========================================================================= */
function finish(){
  if(timerId) clearInterval(timerId);
  S.done=true;
  if(S.mode==='exam'){
    S.items.forEach(q=>{
      const p=S.picks[q.uid];
      if(p!=null){
        DB.record(q.uid,p===q.a);
        track('answer',{subject:F.subject, pack:q.pack, correct:p===q.a?1:0});
      }
    });
  }
  const score=S.items.filter(q=>S.picks[q.uid]===q.a).length;
  DB.d.history.push(Object.assign({at:Date.now(),mode:S.mode,score,total:S.items.length,subject:F.subject},
    sessionInfo(S.items,S.items.filter(q=>S.picks[q.uid]!=null).length)));
  if(DB.d.history.length>400) DB.d.history=DB.d.history.slice(-400);
  DB.save();
  renderReport(score);
}

function bars(rows){
  return rows.map(([label,ok,tot])=>{
    const pc = tot?Math.round(ok/tot*100):0;
    const cls = pc>=75?'':pc>=50?'mid':'low';
    return '<div class="brow"><span>'+label+'</span>'+
           '<span class="tr"><span class="fl '+cls+'" style="width:'+pc+'%"></span></span>'+
           '<span class="v">'+ok+'/'+tot+' &middot; '+pc+'%</span></div>';
  }).join('');
}

function renderReport(score){
  const tot=S.items.length, pct=score/tot;
  const msg = pct===1  ? 'Perfect. Pick a harder state next.'
            : pct>=.85 ? 'Strong. Read the huraian for the misses and move on.'
            : pct>=.7  ? 'Good pass. The red topics below are tomorrow\'s revision.'
            : pct>=.5  ? 'Halfway. Re-drill the weakest topic alone before mixing states again.'
                       : 'Rough round — that is data, not a verdict. Read every huraian below slowly, then retake just the mistakes.';

  const group=(keyFn,nameFn)=>{
    const m=new Map();
    S.items.forEach(q=>{ const k=keyFn(q); const r=m.get(k)||{ok:0,tot:0,name:nameFn(q)};
                         r.tot++; if(S.picks[q.uid]===q.a) r.ok++; m.set(k,r); });
    return [...m.values()].sort((a,b)=>a.ok/a.tot-b.ok/b.tot).map(r=>[r.name,r.ok,r.tot]);
  };
  const wrong = S.items.filter(q=>S.picks[q.uid]!==q.a);

  app.innerHTML =
   '<div class="card">'+
     '<div class="res">'+
       '<div class="score">'+score+'<span>/'+tot+'</span></div>'+
       '<div class="pc">'+Math.round(pct*100)+'% &middot; '+(S.mode==='exam'?'EXAM':'PRACTICE')+'</div>'+
       '<p class="msg">'+msg+'</p>'+
     '</div>'+
     '<div class="sec" style="border-top:1px solid var(--line)"><div class="lab">BY TOPIC &mdash; weakest first</div>'+
        bars(group(q=>q.topic,tname))+'</div>'+
     '<div class="sec"><div class="lab">BY FORM</div>'+bars(group(q=>q.form,q=>q.form==='F4'?'FORM 4':'FORM 5'))+'</div>'+
     '<div class="sec"><div class="lab">BY STATE</div>'+bars(group(q=>q.state+q.year,q=>q.state+(q.year?' '+q.year:'')))+'</div>'+

     (wrong.length ?
     '<div class="rev"><div class="lab">REVIEW &mdash; '+wrong.length+' TO FIX</div>'+
       wrong.map(q=>{
         const p=S.picks[q.uid];
         return '<div class="rq">'+
           '<div class="h"><span>'+q.state+(q.year?' '+q.year:'')+' &middot; Q'+q.n+'</span>'+
             '<span>'+q.form+' &middot; '+tname(q)+'</span>'+
             (p==null?'<b>NOT ANSWERED</b>':'<b>WRONG</b>')+'</div>'+
           '<div class="t">'+T(q.q)+'</div>'+
           (q.img?'<img class="qimg" loading="lazy" decoding="async"'+imgDim(q.img)+' src="'+attr(q.img)+'" alt="figure">':'')+
           '<div class="ans">'+(p!=null?'YOU: <s>'+LTR[p]+' &middot; '+T(q.o[p])+'</s><br>':'')+
             'ANSWER: <em>'+LTR[q.a]+' &middot; '+T(q.o[q.a])+'</em></div>'+
           (T(q.w)?'<div class="w">'+T(q.w)+'</div>':'')+
         '</div>';
       }).join('')+
     '</div>' : '')+

     '<div class="startrow">'+
       (wrong.length?'<button class="cta" id="redo">RETAKE THE '+wrong.length+' I MISSED &rarr;</button>':'')+
       '<button class="btn mutebtn" id="again">&#8634; SAME FILTERS AGAIN</button>'+
       '<button class="btn mutebtn" id="home">&larr; CHANGE FILTERS</button>'+
     '</div>'+
   '</div>';

  const on=(id,fn)=>{const e=$('#'+id); if(e) e.addEventListener('click',fn);};
  on('redo',()=>startSession(wrong));
  on('again',()=>startSession());
  on('home',renderSetup);
  window.scrollTo({top:0});
}

/* =========================================================================
   STATS
   ========================================================================= */
function histPapers(h){
  if(!h.packs||!h.packs.length) return '';
  const lbl=id=>{ const q=BANK.find(x=>x.packId===id); return q ? (q.kind==='actual'?q.year:q.state+' '+q.year)+' K'+q.paper : id; };
  const l=h.packs.map(lbl);
  return '<br><small>'+(l.length>2?l.slice(0,2).join(', ')+' +'+(l.length-2):l.join(', '))+'</small>';
}
function renderStats(){
  S=null;
  const seen=BANK.filter(q=>DB.d.progress[q.uid]&&DB.d.progress[q.uid].seen);
  const mastered=seen.filter(q=>DB.d.progress[q.uid].box>=3);
  const hist=DB.d.history.slice(-12).reverse();

  const byTopic=new Map();
  seen.forEach(q=>{ const p=DB.d.progress[q.uid];
    const r=byTopic.get(q.topic)||{name:tname(q),ok:0,tot:0};
    r.ok+=p.right; r.tot+=p.right+p.wrong; byTopic.set(q.topic,r); });
  const rows=[...byTopic.values()].filter(r=>r.tot).sort((a,b)=>a.ok/a.tot-b.ok/b.tot).map(r=>[r.name,r.ok,r.tot]);

  app.innerHTML =
   '<p class="kick">CUMULATIVE &middot; SAVED ON THIS DEVICE</p>'+
   '<h1>What you actually <em>know</em> so far</h1>'+
   '<div class="card" style="margin-top:24px">'+
     '<div class="sec"><div class="grid2">'+
       '<div class="count"><b>'+seen.length+'</b>of '+BANK.length+' questions attempted</div>'+
       '<div class="count"><b>'+mastered.length+'</b>mastered (3 in a row)</div>'+
       '<div class="count"><b>'+DB.d.history.length+'</b>drills completed</div>'+
     '</div></div>'+
     (rows.length?'<div class="sec"><div class="lab">ACCURACY BY TOPIC &mdash; weakest first</div>'+bars(rows)+'</div>'
                 :'<div class="empty">No attempts recorded yet. Run a drill first.</div>')+
     (hist.length?'<div class="sec"><div class="lab">RECENT DRILLS</div>'+
        hist.map(h=>'<div class="brow"><span>'+new Date(h.at).toLocaleDateString()+histPapers(h)+'</span>'+
          '<span class="tr"><span class="fl '+(h.score/h.total>=.75?'':h.score/h.total>=.5?'mid':'low')+
          '" style="width:'+Math.round(h.score/h.total*100)+'%"></span></span>'+
          '<span class="v">'+h.score+'/'+h.total+(h.mode==='p2'?' P2':'')+(h.att!=null?'<br><small>'+h.att+'/'+h.nq+' tried</small>':'')+'</span></div>').join('')+'</div>':'')+
     '<div class="startrow">'+
       '<button class="btn mutebtn" id="home">&larr; BACK</button>'+
       '<button class="btn mutebtn" id="exp">EXPORT PROGRESS</button>'+
       '<button class="btn mutebtn" id="wipe" style="border-color:var(--badR);color:var(--badR)">RESET ALL</button>'+
     '</div>'+
   '</div>';

  $('#home').addEventListener('click',renderSetup);
  $('#exp').addEventListener('click',()=>{
    const blob=new Blob([JSON.stringify(DB.d,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='spm2026-progress.json'; a.click(); toast('EXPORTED');
  });
  $('#wipe').addEventListener('click',()=>{
    if(confirm('Erase all saved progress on this device?')){ DB.d.progress={}; DB.d.history=[]; DB.save(); renderStats(); }
  });
}

/* =========================================================================
   MATH / CHROME
   ========================================================================= */
window.__renderMath=renderMath;
function renderMath(){
  if(window.__katexReady && window.renderMathInElement){
    renderMathInElement(app,{
      delimiters:[
        {left:'$$',right:'$$',display:true},
        {left:'\\[',right:'\\]',display:true},
        {left:'$',right:'$',display:false},
        {left:'\\(',right:'\\)',display:false}
      ],
      throwOnError:false
    });
  }
}

function setTheme(t){ document.documentElement.dataset.theme=t; DB.d.settings.theme=t; DB.save(); }
setTheme(DB.d.settings.theme||'dark');

$('#btnTheme').addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));
$('#btnHome').addEventListener('click',()=>leaveDrill(renderSetup));
$('#btnStats').addEventListener('click',()=>leaveDrill(renderStats));
$('#btnLang').addEventListener('click',()=>{
  LANG = LANG==='en' ? 'bm' : 'en';
  DB.d.settings.lang=LANG; DB.save(); toast(LANG==='bm'?'BAHASA MELAYU':'ENGLISH');
  if(S && !S.done){
    if(S.mode==='p2') renderP2Quiz(); else renderQuiz();
  } else renderSetup();
});

document.addEventListener('keydown',e=>{
  if(!S||S.done||e.metaKey||e.ctrlKey||e.altKey) return;
  if(S.mode==='p2'){
    // P2 keyboard: SPACE=reveal next, 1=DAPAT, 0=BELUM, ENTER=next, ESC=exit
    const q=S.items[S.idx];
    const nextClosed=q.parts.find(p=>!S.open[q.uid+p.l]);
    const lastOpenUnmarked=q.parts.find(p=>S.open[q.uid+p.l]&&S.marks[q.uid+p.l]==null);
    if(e.key===' '){ e.preventDefault(); if(nextClosed){S.open[q.uid+nextClosed.l]=1; renderP2Quiz();} }
    else if(e.key==='1'&&lastOpenUnmarked){ mark2(q.uid+lastOpenUnmarked.l,true); }
    else if(e.key==='0'&&lastOpenUnmarked){ mark2(q.uid+lastOpenUnmarked.l,false); }
    else if(e.key==='Enter'){ e.preventDefault(); go2(); }
    else if(e.key==='Escape'){ leaveDrill(renderSetup); }
    else if(e.key==='ArrowRight'){ e.preventDefault(); go2(); }
    else if(e.key==='ArrowLeft'&&S.idx){ e.preventDefault(); S.idx--; renderP2Quiz(); }
    return;
  }
  // P1 keyboard
  const q=S.items[S.idx], k=e.key.toUpperCase();
  const li=LTR.indexOf(k), ni='12345'.indexOf(k);
  if(li>-1&&li<q.o.length){ e.preventDefault(); choose(li); }
  else if(ni>-1&&ni<q.o.length){ e.preventDefault(); choose(ni); }
  else if(e.key==='Enter'){ e.preventDefault(); go1(); }
  else if(k==='F'){ S.flags.has(q.uid)?S.flags.delete(q.uid):S.flags.add(q.uid); renderQuiz(); }
  else if(k==='G'){ const g=$('#grid'); if(g) g.classList.toggle('show'); }
  else if(e.key==='Escape'){ leaveDrill(renderSetup); }
  else if(e.key==='ArrowRight'){ go1(); }
  else if(e.key==='ArrowLeft'&&S.idx){ S.idx--; renderQuiz(); }
});

renderSetup();
};
</script>
