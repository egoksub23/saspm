<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Halaman tidak dijumpai / Page not found</title>
<style>
:root{--bg:#FFFFFF;--fg:#0D1D40;--mut:#657186;--border:#E2E6F0;--brand:#E4499A;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0A0F1E;--fg:#E8EEFF;--mut:#7A89AA;--border:#252F48;color-scheme:dark}}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,sans-serif;
min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;text-align:center}
.wrap{max-width:400px}h1{font:700 2rem/1.2 Georgia,serif;margin-bottom:12px}
p{color:var(--mut);margin-bottom:24px}
.btn{display:inline-block;background:var(--brand);color:#fff;font-weight:700;
padding:12px 24px;border-radius:10px;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>404</h1>
  <p>Halaman tidak dijumpai / Page not found.</p>
  <a class="btn" href="/">← Kembali ke laman utama</a>
</div>
</body>
</html>
