{n:1,uid:'sej-sbp-26-01',form:'F4',topic:'F4 · Bab 1: Warisan Negara Bangsa',
 q:'Apakah tugas pembesar peringkat jajahan dalam sistem pentadbiran Kesultanan Melayu Melaka?',
 o:['Menasihati sultan','Menjaga keamanan','Menjaga keselamatan kota','Menguruskan perbendaharaan'],
 a:1,w:'Pembesar peringkat jajahan (seperti Penghulu dan Syahbandar jajahan) bertanggungjawab menjaga keamanan dan mentadbir daerah masing-masing. Menasihati sultan ialah tugas Bendahara, manakala menjaga kota dan perbendaharaan ialah tugas pembesar lain (Laksamana dan Temenggung/Bendahara).'},

{n:2,uid:'sej-sbp-26-02',form:'F4',topic:'F4 · Bab 1: Warisan Negara Bangsa',
 q:'Terdapat kesalahan yang akan dikenakan hukuman bunuh dalam undang-undang yang diamalkan di Melaka.<br>Apakah kesalahan tersebut?<br><br>I&nbsp;&nbsp;&nbsp; Mengenakan cukai tinggi<br>II&nbsp;&nbsp; Menipu dalam timbangan<br>III&nbsp; Mengingkari arahan sultan<br>IV&nbsp; Memberontak di atas kapal',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:3,w:'Dalam Undang-undang Laut Melaka dan Hukum Kanun Melaka, mengingkari titah sultan (menderhaka) dan memberontak di atas kapal dihukum bunuh. Menipu dalam timbangan dan mengenakan cukai tinggi dikenakan hukuman yang lebih ringan seperti denda.'},

{n:3,uid:'sej-sbp-26-03',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Mengapakah John Locke menghasilkan karya <em>Two Treatises of Government</em> yang mempopularkan prinsip raja berperlembagaan?',
 o:['Mengabaikan hak rakyat','Menolak raja berkuasa mutlak','Menentang pembinaan negara bangsa','Menghalang pembentukan negara demokrasi'],
 a:1,w:'John Locke menulis karya tersebut untuk menolak pemerintahan raja berkuasa mutlak dan menegaskan bahawa kuasa raja dihadkan oleh perlembagaan serta hak rakyat. Idea ini menyokong pembentukan negara demokrasi, bukan menghalangnya.'},

{n:4,uid:'sej-sbp-26-04',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Pertubuhan Ikatan Semenanjung Borneo telah melahirkan persatuan',
 o:['sederhana','setempat','radikal','revolusi'],
 a:2,w:'Mengikut skema, jawapan ialah persatuan radikal. Pertubuhan ini dikaitkan dengan gerakan nasionalis yang lebih lantang dan bercorak radikal berbanding persatuan yang bersifat sederhana atau setempat.',
 note:'Soalan ini dan kunci jawapannya (C) tidak dapat disahkan secara bebas; nama pertubuhan dan istilah \'radikal\' mungkin bergantung pada rujukan buku teks (m.s. 37 mengikut skema). Jawapan skema dikekalkan.'},

{n:5,uid:'sej-sbp-26-05',form:'F4',topic:'F4 · Bab 3: Konflik Dunia dan Pendudukan Jepun',
 q:'Jerman melancarkan Operasi Barbarossa bagi menawan Rusia.<br>Bagaimanakah operasi tersebut dilakukan?',
 o:['Gerakan gerila','Operasi secara kilat','Tindakan secara rahsia','Serangan besar-besaran'],
 a:3,w:'Operasi Barbarossa (Jun 1941) ialah serangan besar-besaran Jerman ke atas Kesatuan Soviet dengan jutaan tentera di sepanjang sempadan. Operasi kilat (Blitzkrieg) ialah taktik umum Jerman, tetapi ciri utama Barbarossa ialah skala serangannya yang besar.'},

{n:6,uid:'sej-sbp-26-06',form:'F4',topic:'F4 · Bab 3: Konflik Dunia dan Pendudukan Jepun',
 q:'Gangguan Bintang Tiga dalam urusan keagamaan di surau dan masjid telah menimbulkan kemarahan orang Melayu.<br>Bagaimanakah orang Melayu bertindak mengatasi gangguan tersebut?',
 o:['Membentuk Gerakan Fi-Sabilillah','Memperkenalkan Giyu Gun','Melancarkan Gerakan Islah','Menyertai Pan-Islamisme'],
 a:0,w:'Orang Melayu, terutamanya di Batu Pahat, Johor, membentuk Gerakan Fi-Sabilillah (Perang Sabil) yang dipimpin oleh ulama bagi menentang gangguan Bintang Tiga terhadap agama. Giyu Gun ialah pasukan sukarelawan yang ditubuhkan oleh Jepun.'},

{n:7,uid:'sej-sbp-26-07',form:'F4',topic:'F4 · Bab 4: Era Peralihan Kuasa British',
 q:'Mengapakah British Military Administration (BMA) diperkenalkan di Tanah Melayu?',
 o:['Mengembalikan kestabilan','Memberi latihan ketenteraan','Menentang pendudukan Jepun','Menyokong kepulangan British'],
 a:0,w:'BMA ditubuhkan pada September 1945 untuk memulihkan keamanan dan kestabilan serta menyusun semula pentadbiran selepas Jepun menyerah kalah. Pendudukan Jepun telah pun tamat, jadi BMA bukan untuk menentangnya.'},

{n:8,uid:'sej-sbp-26-08',form:'F4',topic:'F4 · Bab 4: Era Peralihan Kuasa British',
 q:'Mengapakah rakyat tempatan menyokong penyerahan Sarawak kepada British?<br><br>I&nbsp;&nbsp;&nbsp; Menubuhkan parti politik<br>II&nbsp;&nbsp; Menuntut kenaikan pangkat<br>III&nbsp; Meningkatkan taraf hidup<br>IV&nbsp; Memajukan negeri',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:3,w:'Golongan yang menyokong penyerahan Sarawak berharap pemerintahan British dapat meningkatkan taraf hidup rakyat dan memajukan negeri yang kurang membangun di bawah pentadbiran Brooke. Penubuhan parti politik dan tuntutan kenaikan pangkat bukan sebab sokongan tersebut.'},

{n:9,uid:'sej-sbp-26-09',form:'F4',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
 q:'Maklumat berikut berkaitan dengan cadangan PUTERA dan AMCJA.<br><div style="border:1px solid #888;padding:8px 12px;margin:8px 0;display:inline-block">Perlembagaan Rakyat</div><br>Apakah kandungan perlembagaan tersebut?',
 o:['Majlis Raja-Raja dibentuk','Warganegara dinamakan Melayu','Kedudukan istimewa orang Melayu','Penubuhan Dewan Undangan Negeri'],
 a:1,w:'Perlembagaan Rakyat PUTERA-AMCJA mencadangkan semua warganegara dinamakan \'Melayu\' serta kerakyatan yang terbuka. Majlis Raja-Raja dan kedudukan istimewa orang Melayu terdapat dalam cadangan Jawatankuasa Kerja Pusat (UMNO dan raja-raja Melayu).'},

{n:10,uid:'sej-sbp-26-10',form:'F4',topic:'F4 · Bab 4: Era Peralihan Kuasa British',
 q:'Pesuruhjaya Tinggi British perlu memastikan raja dirujuk dalam perkara berkaitan kuasa kerajaan Persekutuan.<br>Mengapakah perkara tersebut perlu dilakukan?',
 o:['Kerjasama antara pemimpin','Melakukan pembahagian kuasa','Kedudukan raja dikembalikan','Mengiktiraf hak penduduk'],
 a:2,w:'Dalam Persekutuan Tanah Melayu 1948, raja-raja Melayu dirujuk dan kedaulatan mereka dikembalikan, berbeza dengan Malayan Union yang menghapuskan kuasa raja. Syarat ini menunjukkan kedudukan raja telah dipulihkan.'},

{n:11,uid:'sej-sbp-26-11',form:'F4',topic:'F4 · Bab 6: Ancaman Komunis dan Darurat',
 q:'Keratan akhbar berikut menunjukkan keganasan yang dilakukan oleh komunis di Tanah Melayu.<br><p style="font-size:.82rem;color:var(--dim);margin:8px 0;font-style:italic">[Gambar: Keratan muka depan akhbar Utusan Malaysia dengan tajuk besar &quot;PENGGANAS SERANG KAMPUNG&quot;]</p>Mengapakah mereka bertindak sedemikian?',
 img:'img/sejarah/875e2edd48c8.webp',
 alt:'Muka depan akhbar Utusan Malaysia dengan tajuk besar PENGGANAS SERANG KAMPUNG dan peta Semenanjung',
 o:['Menyekat hubungan luar','Memimpin gerakan radikal','Menubuhkan negara demokrasi','Mengancam keselamatan rakyat'],
 a:3,w:'Serangan komunis ke atas kampung dilakukan untuk mengancam keselamatan rakyat dan menimbulkan ketakutan agar mereka tidak menyokong kerajaan. Matlamat akhir komunis ialah menubuhkan Republik Komunis, bukan negara demokrasi.'},

{n:12,uid:'sej-sbp-26-12',form:'F4',topic:'F4 · Bab 6: Ancaman Komunis dan Darurat',
 q:'Maklumat berikut berkaitan dengan usaha menangani ancaman komunis.<br><div style="border:1px solid #888;padding:8px 12px;margin:8px 0;display:inline-block">Rundingan Baling</div><br>Apakah tuntutan Tunku Abdul Rahman dalam rundingan tersebut?',
 o:['Meletakkan senjata','Membayar pampasan','Mengukuhkan pertahanan','Mempercepatkan kemerdekaan'],
 a:0,w:'Dalam Rundingan Baling (Disember 1955), Tunku Abdul Rahman menuntut Chin Peng dan pihak komunis meletakkan senjata dan menyerah diri. Chin Peng enggan kerana Parti Komunis Malaya mahu diiktiraf sebagai parti politik yang sah.'},

{n:13,uid:'sej-sbp-26-13',form:'F4',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
 q:'Bagaimanakah Jawatankuasa Hubungan Antara Kaum (CLC) menyelesaikan masalah ketegangan kaum di Tanah Melayu?',
 o:['Menuntut kemerdekaan','Mengadakan perjanjian','Menjalankan rundingan','Menguatkuasa undang-undang'],
 a:2,w:'CLC yang ditubuhkan oleh Dato\' Onn Jaafar (1949) menjalankan rundingan antara wakil pelbagai kaum untuk mencapai persefahaman mengenai isu kerakyatan, ekonomi dan pendidikan. CLC tidak mempunyai kuasa menguatkuasakan undang-undang.'},

{n:14,uid:'sej-sbp-26-14',form:'F4',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
 q:'Tokoh berikut merupakan ahli Hal Ehwal Dalam Negeri Persekutuan Tanah Melayu.<br><p style="font-size:.82rem;color:var(--dim);margin:8px 0;font-style:italic">[Gambar: Potret hitam putih seorang lelaki berkaca mata bulat dan berkot]</p>Apakah tanggungjawab beliau?',
 img:'img/sejarah/c7b9b6cbfcd5.webp',
 alt:'Potret hitam putih seorang lelaki berkaca mata bulat, berkot dan berseluar sut',
 o:['Pembinaan hospital','Pendaftaran kerakyatan','Pembangunan pendidikan','Perancangan bandar'],
 a:1,w:'Ahli Hal Ehwal Dalam Negeri dalam Sistem Ahli bertanggungjawab antara lain atas pendaftaran kerakyatan, imigresen dan pentadbiran dalam negeri. Pendidikan, kesihatan dan perancangan bandar diletakkan di bawah portfolio ahli lain.'},

{n:15,uid:'sej-sbp-26-15',form:'F4',topic:'F4 · Bab 8: Pilihan Raya',
 q:'Parti politik yang bertanding dalam pilihan raya awal di Sabah ialah',
 o:['USNO','UMNO','PANAS','SUPP'],
 a:0,w:'USNO (United Sabah National Organisation) ditubuhkan pada 1961 dan bertanding dalam pilihan raya awal di Sabah. UMNO belum bertanding di Sabah ketika itu, manakala PANAS dan SUPP ialah parti di Sarawak.'},

{n:16,uid:'sej-sbp-26-16',form:'F4',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
 q:'Apakah tanggungjawab Tunku Abdul Rahman selaku Ketua Menteri?',
 o:['Mencapai kemerdekaan','Membina bangsa bersatu','Meningkatkan mutu kesihatan','Menguruskan perbendaharaan negara'],
 a:0,w:'Sebagai Ketua Menteri (1955-1957), tanggungjawab utama Tunku Abdul Rahman ialah memimpin rundingan dan usaha mencapai kemerdekaan Tanah Melayu. Pembinaan bangsa bersatu menjadi tugas selepas merdeka.'},

{n:17,uid:'sej-sbp-26-17',form:'F4',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Raja-raja Melayu telah mengemukakan memorandum bertulis kepada Suruhanjaya Reid.<br>Apakah kandungan memorandum tersebut?',
 o:['Menubuhkan Majlis Raja-Raja','Menentang kewarganegaraan terbuka','Melindungi hak istimewa orang Melayu','Mencadangkan sekolah kebangsaan'],
 a:2,w:'Memorandum raja-raja Melayu menegaskan perlindungan hak istimewa orang Melayu serta kedudukan raja sebagai ketua negeri. Majlis Raja-Raja dan kerakyatan dibincangkan dalam cadangan lain, bukan fokus utama memorandum tersebut.'},

{n:18,uid:'sej-sbp-26-18',form:'F4',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Rajah berikut berkaitan Perjanjian Persekutuan Tanah Melayu 1957.<br><table style="border-collapse:collapse;margin:8px 0;width:auto"><tr><th style="border:1px solid #888;padding:4px 12px">Jenis Kerakyatan</th></tr><tr><td style="border:1px solid #888;padding:4px 12px">&bull; Penguatkuasaan undang-undang<br>&bull; Permohonan<br>&bull; X</td></tr></table>Apakah X?',
 o:['Jus soli','Naturalisasi','Perkahwinan','Penduduk asal'],
 a:1,w:'Perlembagaan 1957 menyediakan kerakyatan melalui penguatkuasaan undang-undang, pendaftaran dan naturalisasi. Antara pilihan yang diberikan, naturalisasi ialah satu jenis kerakyatan yang dikenali dalam perlembagaan.',
 note:'Soalan kurang tepat: dalam buku teks, naturalisasi dilakukan melalui permohonan, sehingga \'Permohonan\' dan \'X\' bertindih. Jawapan skema (B) dikekalkan.'},

{n:19,uid:'sej-sbp-26-19',form:'F4',topic:'F5 · Bab 8: Membina Kemakmuran Negara',
 q:'Apakah kepentingan rancangan Buku Merah kepada negara?',
 o:['Merekod catuan makanan','Mencatat pengeluaran petani','Menggalakkan rakyat menabung','Melaksanakan projek pembangunan'],
 a:3,w:'Buku Merah ialah buku rancangan pembangunan luar bandar yang dilancarkan oleh Tun Abdul Razak untuk merekod dan melaksanakan projek pembangunan di peringkat kampung, daerah dan negeri. Ia bukan buku catuan makanan atau buku simpanan.'},

{n:20,uid:'sej-sbp-26-20',form:'F4',topic:'F5 · Bab 1: Kedaulatan Negara',
 q:'Negara yang merdeka adalah negara yang mempunyai kedaulatan.<br>Apakah maksud daulat?',
 o:['Kekuasaan tertinggi','Keselamatan negara','Kecemerlangan hidup','Keunggulan pendidikan'],
 a:0,w:'Daulat bermaksud kekuasaan atau kuasa tertinggi untuk memerintah dan membuat keputusan tanpa campur tangan pihak luar. Keselamatan, kecemerlangan dan pendidikan ialah hasil atau aspek lain, bukan maksud istilah daulat.'},

/* ── TINGKATAN 5 ─────────────────────────────────────── */

{n:21,uid:'sej-sbp-26-21',form:'F5',topic:'F5 · Bab 1: Kedaulatan Negara',
 q:'Maklumat berikut berkaitan jenis kedaulatan.<br><table style="border-collapse:collapse;margin:8px 0;width:auto"><tr><td style="border:1px solid #888;padding:4px 12px;text-align:center">Undang-undang</td><td style="border:1px solid #888;padding:4px 12px">&bull; Menjamin keadilan<br>&bull; Mewujudkan keamanan<br>&bull; X</td></tr></table>Apakah X?',
 o:['Memperkukuhkan jati diri','Meningkatkan kerjasama luar','Membina masyarakat progresif','Memastikan kestabilan negara'],
 a:3,w:'Kedaulatan undang-undang menjamin keadilan, keamanan dan seterusnya memastikan kestabilan negara. Jati diri, kerjasama luar dan masyarakat progresif tidak terkait secara langsung dengan fungsi undang-undang.'},

{n:22,uid:'sej-sbp-26-22',form:'F5',topic:'F5 · Bab 1: Kedaulatan Negara',
 q:'Gambar menunjukkan pasukan bola sepak negara yang berjaya melayakkan diri ke Sukan Olimpik 1972.<br><p style="font-size:.82rem;color:var(--dim);margin:8px 0;font-style:italic">[Gambar: Gambar kumpulan pasukan bola sepak negara berpakaian sut sukan]</p>Apakah faktor kejayaan tersebut?',
 img:'img/sejarah/e91f0d0e757a.webp',
 alt:'Gambar kumpulan pasukan bola sepak negara berpakaian sut sukan dengan sebiji bola di tengah',
 o:['Prasarana sukan','Bayaran insentif tinggi','Semangat perpaduan bangsa','Mengukuhkan kedudukan negara'],
 a:2,w:'Kejayaan pasukan bola sepak ke Sukan Olimpik 1972 dicapai hasil semangat perpaduan antara pemain pelbagai kaum yang bermain sebagai satu pasukan. Ini menunjukkan sukan menyumbang kepada perpaduan dan kebanggaan negara.'},

{n:23,uid:'sej-sbp-26-23',form:'F5',topic:'F5 · Bab 1: Kedaulatan Negara',
 q:'Maklumat berikut berkaitan undang-undang yang diperkenalkan oleh British di Negeri-negeri Selat.<br><div style="border:1px solid #888;padding:8px 12px;margin:8px 0;display:inline-block"><em>Charter of Justice</em></div><br>Mengapakah undang-undang tersebut diperkenalkan?',
 o:['Menjimatkan kos','Melindungi penduduk','Melicinkan pentadbiran','Memajukan perdagangan'],
 a:1,w:'<em>Charter of Justice</em> diperkenalkan untuk melindungi penduduk dengan menyediakan sistem keadilan dan undang-undang bertulis yang seragam di Negeri-negeri Selat. Pemajuan perdagangan dan pentadbiran hanyalah kesan sampingan.'},

{n:24,uid:'sej-sbp-26-24',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Perlembagaan negara telah dipinda semasa pembentukan Malaysia pada tahun 1963.<br>Apakah kesan pindaan tersebut?',
 o:['Pemisahan Singapura','Penggabungan wilayah','Pembukaan pasaran bersama','Pengurangan kerusi parlimen'],
 a:1,w:'Pindaan perlembagaan pada 1963 membolehkan Sabah, Sarawak dan Singapura bergabung dengan Persekutuan Tanah Melayu untuk membentuk Malaysia, iaitu penggabungan wilayah. Pemisahan Singapura berlaku pada tahun 1965 dan bukan kesan pindaan 1963.'},

{n:25,uid:'sej-sbp-26-25',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Antara yang berikut, yang manakah fungsi Majlis Raja-Raja?<br><br>I&nbsp;&nbsp;&nbsp;&nbsp; Mengisytiharkan darurat<br>II&nbsp;&nbsp;&nbsp; Melantik diplomat Malaysia<br>III&nbsp;&nbsp; Memilih Yang di-Pertuan Agong<br>IV&nbsp;&nbsp; Menjadi Lembaga Pengampunan',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:3,w:'Fungsi utama Majlis Raja-Raja ialah memilih Yang di-Pertuan Agong dan Timbalannya serta mengambil bahagian dalam hal berkaitan pengampunan. Pengisytiharan darurat dan pelantikan diplomat ialah kuasa Yang di-Pertuan Agong atas nasihat kerajaan.',
 note:'Pilihan IV (Lembaga Pengampunan) kurang tepat kerana Lembaga Pengampunan dipengerusikan oleh Yang di-Pertuan Agong dan bukan Majlis Raja-Raja; walau bagaimanapun III memang betul dan hanya D memuatkan III. Jawapan skema (D) dikekalkan.'},

{n:26,uid:'sej-sbp-26-26',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Maklumat berikut berkaitan amalan kebebasan asasi berdasarkan Perlembagaan Persekutuan.<br><div style="border:1px solid #888;padding:8px 12px;margin:8px 0;text-align:center">Kebebasan asasi masih tertakluk kepada sekatan undang-undang yang digubal oleh Parlimen</div>Apakah tujuan sekatan tersebut?',
 o:['Menjamin kesejahteraan','Menyesuaikan situasi semasa','Memajukan sistem perundangan','Memantapkan pentadbiran negara'],
 a:0,w:'Kebebasan asasi dihadkan supaya penggunaannya tidak menjejaskan keselamatan, ketenteraman awam dan hak orang lain, demi menjamin kesejahteraan rakyat dan negara. Kebebasan tanpa had boleh menimbulkan kekacauan.'},

{n:27,uid:'sej-sbp-26-27',form:'F5',topic:'F5 · Bab 3: Raja Berperlembagaan dan Demokrasi Berparlimen',
 q:'Mengapakah pembahagian kuasa antara Kerajaan Persekutuan dengan Kerajaan Negeri dilaksanakan di negara kita?<br><br>I&nbsp;&nbsp;&nbsp; Memajukan negara<br>II&nbsp;&nbsp; Menjamin kestabilan<br>III&nbsp; Menjayakan integrasi nasional<br>IV&nbsp; Memperkukuhkan pakatan politik',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:0,w:'Pembahagian kuasa antara Persekutuan dan negeri bertujuan memajukan negara melalui pengurusan yang cekap dan menjamin kestabilan pentadbiran. Integrasi nasional dan pakatan politik bukan tujuan langsung pembahagian kuasa.'},

{n:28,uid:'sej-sbp-26-28',form:'F5',topic:'F5 · Bab 8: Membina Kemakmuran Negara',
 q:'Senarai berikut berkaitan rancangan pembangunan sosioekonomi di negara kita.<div style="border:1px solid #888;padding:8px 12px;margin:8px 0;display:inline-block">&bull; Wilayah Ekonomi Koridor Utara (NCER)<br>&bull; Wilayah Ekonomi Pantai Timur (ECER)</div><br>Apakah matlamat rancangan tersebut?',
 o:['Pembukaan tanah baharu','Pembangunan ekonomi segi tiga','Pelaksanaan projek pembangunan','Pemulihan tanah terbiar'],
 a:2,w:'NCER dan ECER ialah koridor pembangunan wilayah untuk melaksanakan projek pembangunan ekonomi dan infrastruktur bagi mengurangkan jurang antara wilayah. Pembangunan ekonomi segi tiga ialah kerjasama serantau yang berbeza.'},

{n:29,uid:'sej-sbp-26-29',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
 q:'Konsep Melayu Raya telah diperjuangkan oleh nasionalis di Tanah Melayu sehingga Perang Dunia Kedua.<br>Mengapakah konsep tersebut gagal dilaksanakan?',
 o:['Pelaksanaan Malayan Union','Penentangan Parti Komunis Malaya','Penubuhan Institut Latihan Pemimpin','Pengisytiharan kemerdekaan Indonesia'],
 a:3,w:'Cita-cita Melayu Raya (KMM) bergantung pada penyatuan dengan Indonesia, tetapi Indonesia mengisytiharkan kemerdekaannya secara berasingan pada 17 Ogos 1945 dan British kembali ke Tanah Melayu. Perkara ini menggagalkan konsep tersebut.'},

{n:30,uid:'sej-sbp-26-30',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
 q:'Pembentukan Malaysia telah mendapat tentangan daripada Indonesia.<br>Bagaimanakah tentangan tersebut dilakukan?',
 o:['Melancarkan serangan gerila','Menutup pintu sempadan','Menghantar bantahan rasmi','Menolak perjanjian normalisasi'],
 a:0,w:'Indonesia melancarkan Konfrontasi (1963-1966) dengan menghantar sukarelawan dan tentera menyerang secara gerila ke Semenanjung, Sabah dan Sarawak. Penutupan sempadan dan bantahan rasmi bukan bentuk utama tentangan bersenjata tersebut.'},

{n:31,uid:'sej-sbp-26-31',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
 q:'Bagaimanakah sistem pendidikan di Sarawak dan Sabah dimajukan selepas pembentukan Malaysia?',
 o:['Memberi latihan perguruan','Memperkenalkan biasiswa','Menubuhkan tabung pelajaran','Mewujudkan pembiayaan pendidikan'],
 a:0,w:'Selepas 1963, kerajaan memajukan pendidikan di Sabah dan Sarawak dengan menambah bilangan guru terlatih melalui latihan perguruan di maktab-maktab perguruan. Guru yang mencukupi menjadi asas kepada peningkatan mutu pendidikan.'},

{n:32,uid:'sej-sbp-26-32',form:'F5',topic:'F4 · Bab 6: Ancaman Komunis dan Darurat',
 q:'Bagi melindungi rakyat daripada ancaman komunis, kerajaan telah melaksanakan strategi <em>Counterinsurgency</em> (COIN) melalui usaha',
 o:['memenangi hati rakyat','menawarkan pengampunan','melaksanakan catuan makanan','menempatkan semula penduduk'],
 a:0,w:'Strategi COIN menekankan usaha memenangi hati dan minda rakyat (hearts and minds) supaya mereka menolak komunis dan menyokong kerajaan. Pengampunan, catuan makanan dan penempatan semula ialah tindakan khusus dalam kempen Darurat, bukan intipati COIN.'},

{n:33,uid:'sej-sbp-26-33',form:'F5',topic:'F5 · Bab 6: Cabaran Selepas Pembentukan Malaysia',
 q:'Konsep negara bangsa Malaysia diperkukuhkan melalui<br><br>I&nbsp;&nbsp;&nbsp;&nbsp; asimilasi bangsa<br>II&nbsp;&nbsp;&nbsp; perpaduan kaum<br>III&nbsp;&nbsp; integrasi nasional<br>IV&nbsp;&nbsp; penyatuan agama',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:2,w:'Negara bangsa Malaysia diperkukuhkan melalui perpaduan kaum dan integrasi nasional yang menghormati kepelbagaian. Asimilasi bangsa dan penyatuan agama tidak diamalkan kerana setiap kaum bebas mengekalkan budaya dan agama masing-masing.'},

{n:34,uid:'sej-sbp-26-34',form:'F5',topic:'F5 · Bab 6: Cabaran Selepas Pembentukan Malaysia',
 q:'Maklumat berikut berkaitan dengan matlamat Rukun Negara.<br><div style="border:1px solid #888;padding:8px 12px;margin:8px 0;display:inline-block">Melahirkan masyarakat yang progresif</div><br>Bagaimanakah matlamat tersebut dapat dilaksanakan?',
 o:['Membentuk masyarakat bersatu padu','Memelihara cara hidup demokratik','Mewujudkan peluang yang sama','Meneroka sains dan teknologi'],
 a:3,w:'Masyarakat yang progresif dilahirkan melalui penerokaan sains dan teknologi yang menjadikan rakyat maju dan berfikiran moden. Matlamat lain Rukun Negara seperti perpaduan, demokrasi dan keadilan sosial dicapai melalui cara berbeza.'},

{n:35,uid:'sej-sbp-26-35',form:'F5',topic:'F5 · Bab 8: Membina Kemakmuran Negara',
 q:'Rancangan Buku Hijau dilaksanakan dalam rancangan Dasar Ekonomi Baru (DEB).<br>Mengapakah rancangan tersebut diperkenalkan?',
 o:['Melahirkan golongan pertengahan','Membangunkan kemudahan asas','Meningkatkan pendapatan rakyat','Menyusun semula masyarakat'],
 a:2,w:'Gerakan Buku Hijau menggalakkan penduduk mengeluarkan makanan sendiri, sekali gus meningkatkan pengeluaran dan pendapatan rakyat serta mengurangkan kemiskinan.',
 note:'Dalam buku teks, Gerakan Buku Hijau terutamanya untuk meningkatkan pengeluaran makanan; \'meningkatkan pendapatan rakyat\' ialah pilihan paling hampir. Jawapan skema (C) dikekalkan.'},

{n:36,uid:'sej-sbp-26-36',form:'F5',topic:'F5 · Bab 8: Membina Kemakmuran Negara',
 q:'Pelaksanaan Dasar Pembangunan Negara (DPN) telah memperkenalkan taman teknologi perindustrian.<br>Apakah peranan taman teknologi tersebut?',
 o:['Mengeluarkan kereta tempatan','Membangunkan pusat penyelidikan','Melaksanakan projek membaiki kapal','Memajukan industri kecil dan sederhana'],
 a:1,w:'Taman teknologi seperti Technology Park Malaysia berperanan membangunkan pusat penyelidikan dan pembangunan (R&D) bagi menggalakkan inovasi dan industri berteknologi tinggi. Pengeluaran kereta tempatan (Proton) dan projek kapal ialah industri berat yang berlainan.'},

{n:37,uid:'sej-sbp-26-37',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',
 q:'Apakah usaha yang dilakukan oleh anggota Komanwel dalam menangani masalah kemiskinan?',
 o:['Menyertai Pertubuhan Kesihatan Sedunia','Melaksanakan Rancangan Colombo','Menubuhkan tabung kemanusiaan','Menyertai sidang kemuncak dunia'],
 a:1,w:'Anggota Komanwel melaksanakan Rancangan Colombo untuk memberikan bantuan teknikal dan ekonomi bagi membasmi kemiskinan di negara membangun. Pertubuhan Kesihatan Sedunia ialah agensi PBB dan bukan usaha khusus Komanwel.'},

{n:38,uid:'sej-sbp-26-38',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',
 q:'Jadual berikut berkaitan penglibatan Malaysia dalam Pergerakan Negara-negara Tanpa Pihak (NAM).<br><table style="border-collapse:collapse;margin:8px 0;width:auto"><tr><th style="border:1px solid #888;padding:4px 12px">Tahun</th><th style="border:1px solid #888;padding:4px 12px">Perjanjian</th></tr><tr><td style="border:1px solid #888;padding:4px 12px;text-align:center">1970</td><td style="border:1px solid #888;padding:4px 12px">Perisytiharan Lusaka</td></tr></table>Apakah kepentingan perisytiharan tersebut?',
 o:['Menamatkan perang saudara','Mengharamkan senjata nuklear','Melaksanakan gencatan senjata','Memindahkan mangsa perang'],
 a:1,w:'Perisytiharan Lusaka 1970 menekankan aspirasi NAM untuk keamanan dunia, termasuk pelucutan senjata dan pengharaman senjata nuklear. Malaysia menyokong usaha ini selaras dengan dasar kenegaraan yang mementingkan keamanan.',
 note:'Kandungan Perisytiharan Lusaka (pelucutan senjata, hidup aman bersama, anti-kolonialisme) lebih luas daripada pilihan yang diberi; jawapan skema (B) dikekalkan.'},

{n:39,uid:'sej-sbp-26-39',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',
 q:'Peta berikut menunjukkan kawasan yang terlibat dalam kerjasama Pembangunan Ekonomi Segi Tiga.<br><p style="font-size:.82rem;color:var(--dim);margin:8px 0;font-style:italic">[Gambar: Peta bertajuk &quot;Lingkungan kawasan SIJORI-GT&quot; menunjukkan segi tiga meliputi Johor, Singapura dan Kepulauan Riau (Indonesia)]</p>Apakah manfaat yang diperoleh Malaysia melalui kerjasama tersebut?',
 img:'img/sejarah/62e9e04dfff5.webp',
 alt:'Peta Lingkungan kawasan SIJORI-GT: segi tiga yang meliputi Johor (Malaysia), Singapura dan Kepulauan Riau (Indonesia)',
 o:['Mengawal laluan perdagangan','Menjamin kadar cukai yang rendah','Menurunkan harga barangan tempatan','Mengurangkan monopoli negara maju'],
 a:3,w:'Melalui kerjasama SIJORI-GT, Malaysia, Singapura dan Indonesia membentuk blok ekonomi serantau yang memperkukuh daya saing dan mengurangkan kebergantungan serta monopoli negara maju. Pilihan lain bukan manfaat langsung kerjasama ini.',
 note:'Pilihan jawapan kurang jelas dan boleh dipertikaikan; jawapan skema (D) dikekalkan.'},

{n:40,uid:'sej-sbp-26-40',form:'F5',topic:'F5 · Bab 10: Kecemerlangan Malaysia di Persada Dunia',

{n:1,uid:'sej-smka-26-01',form:'F4',topic:'F4 · Bab 1: Warisan Negara Bangsa',
 q:'Rajah 1 menunjukkan ciri-ciri negara bangsa kerajaan Alam Melayu.<br>Apakah X?',

 alt:'Carta bertajuk “Ciri-ciri negara bangsa kerajaan Alam Melayu” bercabang kepada empat kotak: Raja, Wilayah Pengaruh, Rakyat dan X',
 o:['Kedaulatan','Perlembagaan','Undang-undang','Lambang kebesaran'],
 a:2,
 w:'Ciri negara bangsa kerajaan Alam Melayu ialah raja, wilayah pengaruh, rakyat dan undang-undang (contohnya Hukum Kanun Melaka). Perlembagaan bertulis tidak wujud pada zaman itu, manakala lambang kebesaran ialah lambang kedaulatan raja, bukan ciri asas negara bangsa.',
 note:'Rajah dihuraikan dalam teks. Pilihan A (Kedaulatan) dan D (Lambang kebesaran) juga berkait dengan kerajaan Alam Melayu; skema memilih Undang-undang.'},

{n:2,uid:'sej-smka-26-02',form:'F4',topic:'F4 · Bab 1: Warisan Negara Bangsa',
 q:'Sebagai rakyat Melaka, Pak Abu mematuhi semua arahan pemerintah dan tidak berani menderhaka.<br><br>Mengapakah Pak Abu berbuat demikian?',
 o:['Takut ditimpa tulah','Khuatir diusir dari Melaka','Seorang yang bertimbang rasa','Berhajat menjadi pembesar istana'],
 a:0,
 w:'Rakyat Melaka percaya raja berdaulat dan menderhaka akan menyebabkan tulah atau pembalasan buruk. Kepercayaan terhadap daulat ini menjadi asas ketaatan mutlak kepada pemerintah.'},

{n:3,uid:'sej-smka-26-03',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Jadual berikut berkaitan dengan langkah pemodenan pentadbiran di Thailand.<table style="border-collapse:collapse;margin:8px 0;width:auto"><tr><td style="border:1px solid #888;padding:6px 12px">&bull; Raja Mongkut<br>&bull; Raja Chulalongkorn</td><td style="padding:6px 12px">&rarr;</td><td style="border:1px solid #888;padding:6px 12px">Birokrasi Barat</td></tr></table>Mengapakah pemerintah di atas melaksanakan tindakan tersebut?',
 o:['Persaingan kuasa besar','Mengekalkan kedaulatan negara','Memantapkan sistem pentadbiran','Penguasaan ekonomi oleh pembesar'],
 a:2,
 w:'Raja Mongkut dan Raja Chulalongkorn memperkenalkan birokrasi Barat untuk memantapkan sistem pentadbiran yang lebih cekap dan berpusat. Pengekalan kedaulatan merupakan hasil pembaharuan itu, bukan tujuan langsung pengenalan birokrasi.'},

{n:4,uid:'sej-smka-26-04',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Maklumat berikut berkaitan sistem pendidikan yang terdapat di Tanah Melayu pada awal abad ke-20.<div style="border:1px solid #888;padding:8px 12px;margin:8px 0">&bull; Maktab Melayu Kuala Kangsar (MCKK)<br>&bull; Maktab Perguruan Sultan Idris (SITC)</div>Bagaimanakah institusi pendidikan ini berfungsi menyemarakkan nasionalisme?',
 o:['Mewujudkan sistem pendidikan madrasah','Melahirkan golongan yang memimpin rakyat','Mendedahkan pelajar dengan pemodenan Islam','Menerima kunjungan ulama dari Sumatera Barat'],
 a:1,
 w:'MCKK dan SITC melahirkan golongan terpelajar Melayu seperti guru, penulis dan pegawai yang kemudiannya memimpin pergerakan nasionalisme. Pemodenan Islam dan madrasah lebih berkait dengan gerakan Kaum Muda dan sekolah agama.'},

{n:5,uid:'sej-smka-26-05',form:'F4',topic:'F4 · Bab 3: Konflik Dunia dan Pendudukan Jepun',
 q:'Bagaimanakah Jerman melanggar syarat-syarat Perjanjian Versailles 1919?',
 o:['Memperkuat angkatan tentera','Menamatkan hubungan diplomatik','Mengeksport senjata ke luar negara','Menjalinkan kerjasama dengan komunis'],
 a:0,
 w:'Perjanjian Versailles menghadkan saiz tentera Jerman, tetapi Hitler memperkenalkan kerahan tenaga tentera dan membina semula angkatan tentera. Tindakan ini melanggar syarat perlucutan senjata dalam perjanjian itu.'},

{n:6,uid:'sej-smka-26-06',form:'F4',topic:'F4 · Bab 3: Konflik Dunia dan Pendudukan Jepun',
 q:'Mengapakah Jepun melancarkan serangan ke atas Pearl Harbour, Amerika Syarikat dalam Perang Dunia Kedua?',
 o:['Meluaskan kuasa','Sebagai serangan balas','Desakan pemimpin atasan','Memenuhi keperluan industri'],
 a:0,
 w:'Jepun menyerang Pearl Harbour pada 7 Disember 1941 untuk melumpuhkan armada Pasifik Amerika Syarikat supaya dapat meluaskan kuasa dan menguasai Asia Tenggara tanpa gangguan. Jepun yang memulakan serangan, maka ia bukan serangan balas.'},

{n:7,uid:'sej-smka-26-07',form:'F4',topic:'F4 · Bab 3: Konflik Dunia dan Pendudukan Jepun',
 q:'Apakah peranan British Military Administration (BMA) di Tanah Melayu?',
 o:['Melatih penduduk tempatan','Memulihkan kepercayaan rakyat','Menangani demonstrasi penduduk','Menghalang desakan orang dagang'],
 a:1,
 w:'BMA (September 1945 – Mac 1946) berperanan memulihkan keamanan, ekonomi dan kepercayaan rakyat terhadap British selepas Jepun menyerah kalah. Ia ialah pentadbiran tentera sementara sebelum pemerintahan awam dipulihkan.'},

{n:8,uid:'sej-smka-26-08',form:'F4',topic:'F4 · Bab 4: Era Peralihan Kuasa British',
 q:'Maklumat berikut berkaitan dengan unit politik yang telah disatukan di Tanah Melayu sewaktu pentadbiran British.<div style="border:1px solid #888;padding:8px 12px;margin:8px 0">&bull; Negeri-negeri Selat<br>&bull; Negeri-negeri Melayu Bersekutu<br>&bull; Negeri-negeri Melayu Tidak Bersekutu</div>Mengapakah British bertindak demikian?',
 o:['Kos pentadbiran dapat dikurangkan','Melemahkan golongan penentang','Hak kaum peribumi terpelihara','Sistem monarki diperkukuhkan'],
 a:0,
 w:'Penyatuan Negeri-negeri Selat, NNMB dan NNMTB (Malayan Union) membolehkan British menyeragamkan pentadbiran di bawah satu pusat dan mengurangkan kos pentadbiran. Hak orang Melayu dan sistem monarki sebenarnya terjejas, bukan terpelihara.'},

{n:9,uid:'sej-smka-26-09',form:'F4',topic:'F4 · Bab 4: Era Peralihan Kuasa British',
 q:'Apakah faktor penubuhan Persekutuan Tanah Melayu 1948?',
 o:['Mewujudkan kewarganegaraan yang sama','Memenuhi tuntutan penduduk tempatan','Menyeimbangkan komposisi kaum','Membendung ancaman komunis'],
 a:1,
 w:'Persekutuan Tanah Melayu 1948 menggantikan Malayan Union kerana bantahan hebat orang Melayu dan raja-raja Melayu, jadi British memenuhi tuntutan penduduk tempatan. Kewarganegaraan yang sama ialah ciri Malayan Union yang ditentang.'},

{n:10,uid:'sej-smka-26-10',form:'F4',topic:'F4 · Bab 4: Era Peralihan Kuasa British',
 q:'Apakah kesan Perjanjian Persekutuan Tanah Melayu 1948 terhadap Tanah Melayu?',
 o:['Komposisi kaum seimbang','Kuasa kerajaan negeri berkurangan','Undang-undang tradisional musnah','Peluang ke arah berkerajaan sendiri'],
 a:3,
 w:'Perjanjian Persekutuan 1948 mengekalkan kedaulatan raja-raja Melayu dan memberi ruang penglibatan penduduk tempatan dalam Majlis Perundangan, membuka peluang ke arah berkerajaan sendiri. Kedaulatan negeri dan undang-undang tradisional dikekalkan, bukan dimusnahkan.'},

{n:11,uid:'sej-smka-26-11',form:'F4',topic:'F4 · Bab 6: Ancaman Komunis dan Darurat',
 q:'Berikut adalah tindakan yang dilakukan oleh pengganas komunis di Tanah Melayu.<div style="border:1px solid #888;padding:8px 12px;margin:8px 0">&bull; Merosakkan ladang getah<br>&bull; Mengganggu kerja di lombong<br>&bull; Merosakkan landasan kereta api</div>Mengapakah tindakan tersebut dilakukan?',
 o:['Memiliknegarakan sektor perusahaan','Menyusun semula sistem pemilikan','Menentang amalan buruh paksa','Melumpuhkan ekonomi British'],
 a:3,
 w:'Ladang getah, lombong bijih timah dan kereta api ialah sumber ekonomi utama British di Tanah Melayu. Pengganas komunis menyerangnya untuk melumpuhkan ekonomi British dan melemahkan pentadbiran kolonial.'},

{n:12,uid:'sej-smka-26-12',form:'F4',topic:'F4 · Bab 6: Ancaman Komunis dan Darurat',
 q:'Sistem pendaftaran kebangsaan dan kad pengenalan telah diperkenalkan pada tahun 1948.<br><br>Bagaimanakah langkah tersebut dapat membantu British melemahkan komunis?',
 o:['Menambah anggota keselamatan kerajaan','Meningkatkan kesetiaan rakyat terhadap kerajaan','Memudahkan pengiraan jumlah penduduk tempatan','Memudahkan pihak berkuasa mengenal pasti orang awam'],
 a:3,
 w:'Kad pengenalan memudahkan pihak berkuasa membezakan orang awam daripada pengganas komunis serta memantau pergerakan penduduk. Dengan itu, bekalan makanan dan maklumat kepada komunis dapat disekat.'},

{n:13,uid:'sej-smka-26-13',form:'F4',topic:'F5 · Bab 6: Cabaran Selepas Pembentukan Malaysia',
 q:'Orang Melayu tidak mendapat peluang yang sama seperti kaum bukan Melayu dalam sektor perniagaan dan perusahaan.<br><br>Apakah langkah yang dilakukan oleh Jawatankuasa Hubungan Antara Kaum (CLC) untuk menangani isu tersebut?',
 o:['Menubuhkan RIDA','Memperkenalkan Sistem Ahli','Menghapuskan sistem sekolah vernakular','Membendung ancaman Parti Komunis Malaya'],
 a:0,
 w:'CLC mengesyorkan peningkatan taraf ekonomi orang Melayu dan tindakan ini membawa kepada penubuhan Lembaga Pembangunan Anak Negeri (RIDA) pada tahun 1950 untuk membantu perniagaan dan perusahaan Melayu. Sistem Ahli pula berkait dengan pentadbiran kerajaan, bukan ekonomi.'},

{n:14,uid:'sej-smka-26-14',form:'F4',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
 q:'Ilustrasi berikut menunjukkan logo Parti Perikatan.<br><br>Mengapakah Parti Perikatan memilih logo di atas?',
 img:'img/sejarah/a0b9abba8f63.webp',
 alt:'Logo Parti Perikatan: sebuah perahu layar belayar di atas air',
 o:['Konsep keadilan semua kaum','Kesediaan menempuh cabaran','Konsep kedaulatan undang-undang','Berpeluang ke arah berkerajaan sendiri'],
 a:1,
 w:'Logo Parti Perikatan ialah sebuah perahu layar yang belayar di lautan. Ia melambangkan kesediaan Perikatan menempuh cabaran dan gelombang dalam perjuangan mencapai kemerdekaan.'},

{n:15,uid:'sej-smka-26-15',form:'F4',topic:'F4 · Bab 8: Pilihan Raya',
 q:'Gambar berikut menunjukkan rakyat Tanah Melayu mengundi dalam Pilihan Raya Umum pertama pada 27 Julai 1955.<br><br>Apakah nilai yang ditunjukkan berdasarkan gambar di atas?',
 img:'img/sejarah/8b1fc4db6a66.webp',
 alt:'Tiga gambar rakyat Tanah Melayu memasukkan kertas undi ke dalam peti undi pada 27 Julai 1955: seorang lelaki tua, seorang ibu mendukung bayi dan seorang wanita',
 o:['Adil','Toleransi','Berdisiplin','Bertanggungjawab'],
 a:3,
 w:'Rakyat dari pelbagai lapisan, termasuk lelaki tua dan ibu yang mendukung anak, tampil mengundi pada pilihan raya pertama. Tindakan ini menunjukkan nilai bertanggungjawab dalam menentukan pemimpin dan masa depan negara.'},

{n:16,uid:'sej-smka-26-16',form:'F4',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
 q:'Apakah peranan kabinet pertama yang dibentuk selepas Pilihan Raya Umum 1955?',
 o:['Memperkenalkan sistem demokrasi','Menghantar pulang imigran ke negara asal','Membincangkan isu keselamatan dalam negeri','Meminta kuasa veto Pesuruhjaya Tinggi dikekalkan'],
 a:3,
 w:'Kerajaan Perikatan di bawah Tunku Abdul Rahman menggunakan kuasa kabinet pertama untuk menuntut pemindahan kuasa lebih besar kepada kerajaan tempatan, termasuk menyentuh kuasa veto Pesuruhjaya Tinggi. Sistem demokrasi telah pun bermula melalui pilihan raya itu sendiri.',
 note:'Pilihan D tercetak “dikekalkan”; sejarahnya, kabinet pertama menuntut kuasa veto Pesuruhjaya Tinggi DIHAPUSKAN/dikurangkan. Skema memberi D; dikekalkan seperti dalam skema (mungkin kesilapan taip dalam soalan).'},

{n:17,uid:'sej-smka-26-17',form:'F4',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Apakah memorandum yang dikemukakan oleh Raja-raja Melayu kepada Suruhanjaya Perlembagaan Persekutuan Tanah Melayu?',
 o:['Yang di-Pertuan Agong sebagai ketua negara','Ketua Menteri sebagai pentadbiran kerajaan','Undang-undang tempatan dikuatkuasakan','Syarat kewarganegaraan dikaji semula'],
 a:0,
 w:'Raja-raja Melayu memohon supaya seorang Yang di-Pertuan Besar (Yang di-Pertuan Agong) dilantik sebagai ketua negara dan simbol kedaulatan. Ketua Menteri dan syarat kewarganegaraan dibincangkan oleh pihak lain, bukan dalam memorandum Raja-raja.'},

{n:18,uid:'sej-smka-26-18',form:'F4',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
 q:'Pada 9 Mei 1957, Tunku Abdul Rahman bersama pemimpin Parti Perikatan sekali lagi ke London untuk berbincang dengan British.<br><br>Apakah perkara yang dibincangkan tersebut?',
 o:['Mengisytiharkan kemerdekaan','Menetapkan tarikh kemerdekaan','Melakukan pindaan draf perlembagaan','Mengemukakan bantahan isu kewarganegaraan'],
 a:3,
 w:'Dalam lawatan ke London pada Mei 1957, Tunku membawa bantahan terhadap pindaan isu kewarganegaraan yang dibuat oleh pihak British selepas laporan Suruhanjaya Reid. Tarikh kemerdekaan telah pun dipersetujui dalam rundingan 1956.'},

{n:19,uid:'sej-smka-26-19',form:'F4',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
 q:'Maklumat berikut berkaitan jawatankuasa yang telah dibentuk bagi menyambut pemasyhuran kemerdekaan negara.<div style="border:1px solid #888;padding:8px 12px;margin:8px 0">&bull; Jawatankuasa Persediaan Fizikal<br>&bull; Jawatankuasa X</div>Apakah Jawatankuasa X?',
 o:['Protokol','Sambutan','Jemputan','Perlembagaan'],
 a:1,
 w:'Jawatankuasa Persediaan Fizikal dan Jawatankuasa Sambutan dibentuk untuk menyediakan tapak dan mengatur sambutan hari kemerdekaan 31 Ogos 1957. Jawatankuasa Perlembagaan tidak berkait dengan persiapan majlis.'},

{n:20,uid:'sej-smka-26-20',form:'F4',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
 q:'Apakah fungsi Jabatan Penerangan yang ditubuhkan oleh kerajaan selepas mencapai kemerdekaan?',
 o:['Menyiarkan filem-filem tempatan','Menerangkan dasar dan wawasan negara','Merakamkan peristiwa kemerdekaan negara','Mendokumentasikan pemasyhuran kemerdekaan'],
 a:1,
 w:'Jabatan Penerangan berfungsi menyampaikan dasar, wawasan dan program kerajaan kepada rakyat supaya difahami dan disokong. Merakam peristiwa kemerdekaan ialah tugas khusus pasukan dokumentasi, bukan fungsi utama jabatan.'},

{n:21,uid:'sej-smka-26-21',form:'F5',topic:'F5 · Bab 1: Kedaulatan Negara',

function topicInfo(subject,code){
  const t=(TOPICS[subject]||{})[code];

}

/* ---------- flatten packs into one bank ---------- */
const BANK=[];
(window.SPM.packs||[]).forEach(pack=>{
  const m=pack.meta||{};

    const isPaper2 = m.paper===2 || (q.parts && q.parts.length>0);
    const ti=topicInfo(m.subject,q.topic);
    BANK.push({
      uid: (m.id||'pack')+'#'+(q.n!=null?q.n:i+1),
      packId:m.id, subject:m.subject||'?', state:m.state||'?', year:m.year||'',
      paper:m.paper||1, kind:m.kind||'trial', ans:m.answers||'skema',

      form: q.form || ti.form || '?',
      topic: q.topic || '', topicRaw: q.topicName || null,
      // P2 fields (Sejarah-compatible naming)
      sec: q.sec || q.section || 'A',
      title: q.title || '',
      stim: q.stim || '', stimHtml: q.stimHtml || null, bm: q.bm || null,
      marks: (q.parts||[]).reduce((t,p)=>t+(+p.m||0),0) || q.marks || 0,
      parts: q.parts || [],
      note: q.note || '',
      // P1 fields

function tname(q){ return q.topicRaw ? T(q.topicRaw) : topicInfo(q.subject,q.topic).name; }

/* ---------- filters ---------- */
const F={ subject:null, states:new Set(), forms:new Set(), topics:new Set(), years:new Set(),
          mode:'practice', count:'all', shuffle:true, source:'all', paper:1 };

function subjects(){ return [...new Set(BANK.map(q=>q.subject))].sort(); }
function pool(ignore){
  return BANK.filter(q=>{
    if(F.subject && q.subject!==F.subject) return false;
    if(q.paper !== F.paper) return false;
    if(ignore!=='states' && F.states.size && !F.states.has(q.state)) return false;
    if(ignore!=='forms'  && F.forms.size  && !F.forms.has(q.form))   return false;
    if(ignore!=='topics' && F.topics.size && !F.topics.has(q.topic)) return false;
    if(ignore!=='years'  && F.years.size  && !F.years.has(q.year))   return false;
    const p=DB.d.progress[q.uid];
    if(F.source==='wrong'  && !(p && p.lastOk===false)) return false;
    if(F.source==='unseen' &&  (p && p.seen))           return false;
    if(F.source==='weak'   && !(p && p.box<3))          return false;
    return true;
  });
}

/* =========================================================================
   SESSION
   ========================================================================= */
let S=null, timerId=null;

function leaveDrill(then){
  if(timerId) clearInterval(timerId);
  S=null;
  then();
}

function startSession(list){
  let items = list ? list.slice() : pool();
  if(F.shuffle) shuffle(items);
  else items.sort((a,b)=> a.packId===b.packId ? a.n-b.n : String(a.packId).localeCompare(String(b.packId)));
  if(!list && F.count!=='all') items = items.slice(0, Math.min(+F.count, items.length));
  if(!items.length){ toast('NOTHING MATCHES THAT FILTER'); return; }

  const isP2 = items[0].type === 'structured';
  S={ items, idx:0, picks:{}, flags:new Set(), mode: isP2 ? 'p2' : F.mode,
      startedAt:Date.now(), limit: (!isP2 && F.mode==='exam') ? items.length*75 : 0, done:false,
      open:{}, marks:{}, lang:'en' };
  if(timerId) clearInterval(timerId);
  if(S.limit) timerId=setInterval(tick,1000);

  if(isP2) renderP2Quiz();
  else renderQuiz();
  window.scrollTo({top:0});
}

function tick(){
  if(!S||S.done) return;
  const left = S.limit - ((Date.now()-S.startedAt)/1000|0);
  const el=$('#clock');
  if(el){ el.textContent=mmss(left); el.classList.toggle('warn',left<300); }
  if(left<=0){ clearInterval(timerId); toast('TIME UP'); finish(); }
}

        '<button class="btn mutebtn" id="openall">REVEAL ALL</button>'+
        '<button class="btn mutebtn" id="exit">&#10005; EXIT</button>'+
        '<span class="sp"></span>'+
        '<button class="btn" id="next">'+(S.idx<S.items.length-1?(allMarked?'NEXT &rarr;':'SKIP &rarr;'):'SEE REPORT &rarr;')+'</button>'+
      '</div>'+
      '<p class="hint">SPACE = REVEAL NEXT &middot; 1 = DAPAT &middot; 0 = BELUM &middot; ENTER = NEXT &middot; ESC = EXIT</p>'+
    '</div></div>';

  $$('[data-open]',app).forEach(b=>b.addEventListener('click',()=>{S.open[b.dataset.open]=1; renderP2Quiz();}));
  $$('[data-mk]',app).forEach(b=>b.addEventListener('click',()=>mark2(b.dataset.id,b.dataset.mk==='1')));
  const on=(id,fn)=>{const e=$('#'+id); if(e) e.addEventListener('click',fn);};
  on('prev',()=>{S.idx--; renderP2Quiz();});
  on('next',go2);
  on('exit',()=>leaveDrill(renderSetup));
  on('openall',()=>{q.parts.forEach(p=>S.open[q.uid+p.l]=1); renderP2Quiz();});
  on('btnLang',()=>{S.lang=S.lang==='bm'?'en':'bm'; renderP2Quiz();});
  renderMath();
  window.scrollTo({top:0});
}

function mark2(id,ok){ S.marks[id]=ok; DB.record(id,ok); DB.save(); renderP2Quiz(); }
function go2(){ if(S.idx<S.items.length-1){S.idx++; renderP2Quiz(); window.scrollTo({top:0});} else finishP2(); }

/* =========================================================================
   P2 SUMMARY  (marks-based, aligned with Sejarah K2)
   ========================================================================= */
function finishP2(){
  if(timerId) clearInterval(timerId);
  S.done=true;
  let got=0, tot=0;
  const byTopic=new Map();
  const missed=[];
  S.items.forEach(q=>{
    let g=0, t=0;
    q.parts.forEach(p=>{
      const mk=S.marks[q.uid+p.l];
      if(mk==null) return;
      t+=(+p.m||0); if(mk) g+=(+p.m||0);
    });
    got+=g; tot+=t;
    if(t){
      const r=byTopic.get(q.topic)||{name:tname(q),ok:0,tot:0};
      r.ok+=g; r.tot+=t; byTopic.set(q.topic,r);
    }
    if(q.parts.some(p=>S.marks[q.uid+p.l]===false)) missed.push(q);
  });

  DB.d.history.push({at:Date.now(),mode:'p2',score:got,total:tot||1,subject:F.subject});
  if(DB.d.history.length>400) DB.d.history=DB.d.history.slice(-400);
  DB.save();

  const pct=tot?got/tot:0;
  const msg = pct>=.9 ? 'Excellent — cemerlang dalam kertas berstruktur!'
            : pct>=.7 ? 'Bagus! Ulang kaji mata yang salah dan cuba semula.'
            : pct>=.5 ? 'Boleh tahan. Fokus pada topik lemah di bawah.'
            : tot===0  ? 'Tiada bahagian ditanda — tandakan DAPAT/BELUM pada setiap bahagian.'
            : 'Perlu latihan lagi — baca skema jawapan dengan teliti dan cuba lagi.';

  const rows=[...byTopic.values()].sort((a,b)=>a.ok/a.tot-b.ok/b.tot)
    .map(r=>[r.name,r.ok,r.tot]);

  app.innerHTML=
   '<div class="card">'+
    '<div class="res">'+
      '<div class="score">'+got+'<span>/'+tot+'</span></div>'+
      '<div class="pc">MARKS SELF-ASSESSED &middot; KERTAS 2</div>'+
      '<p class="msg">'+msg+'</p>'+
    '</div>'+
    (rows.length?
      '<div class="sec" style="border-top:1px solid var(--line)"><div class="lab">BY TOPIC &mdash; weakest first (marks)</div>'+
        bars(rows)+'</div>':'')+
    '<div class="startrow">'+
      (missed.length?'<button class="cta" id="redo">RETAKE '+missed.length+' MISSED &rarr;</button>':'')+
      '<button class="btn mutebtn" id="again">&#8634; SAME FILTERS AGAIN</button>'+
      '<button class="btn mutebtn" id="home">&larr; TUKAR PILIHAN</button>'+
    '</div>'+
   '</div>';

  const on=(id,fn)=>{const e=$('#'+id); if(e) e.addEventListener('click',fn);};
  on('redo',()=>startSession(missed));
  on('again',()=>startSession());
  on('home',renderSetup);
  window.scrollTo({top:0});
}

/* =========================================================================
   P1 REPORT
   ========================================================================= */
function finish(){
  if(timerId) clearInterval(timerId);
  S.done=true;
  if(S.mode==='exam'){ S.items.forEach(q=>{ const p=S.picks[q.uid]; if(p!=null) DB.record(q.uid,p===q.a); }); }
  const score=S.items.filter(q=>S.picks[q.uid]===q.a).length;
  DB.d.history.push({at:Date.now(),mode:S.mode,score,total:S.items.length,subject:F.subject});
  if(DB.d.history.length>400) DB.d.history=DB.d.history.slice(-400);
  DB.save();
  renderReport(score);
}

function bars(rows){
  return rows.map(([label,ok,tot])=>{
    const pc = tot?Math.round(ok/tot*100):0;
    const cls = pc>=75?'':pc>=50?'mid':'low';
    return '<div class="brow"><span>'+label+'</span>'+
           '<span class="tr"><span class="fl '+cls+'" style="width:'+pc+'%"></span></span>'+
           '<span class="v">'+ok+'/'+tot+' &middot; '+pc+'%</span></div>';
  }).join('');
}

function renderReport(score){
  const tot=S.items.length, pct=score/tot;
  const msg = pct===1  ? 'Perfect. Pick a harder state next.'
            : pct>=.85 ? 'Strong. Read the huraian for the misses and move on.'
            : pct>=.7  ? 'Good pass. The red topics below are tomorrow\'s revision.'
            : pct>=.5  ? 'Halfway. Re-drill the weakest topic alone before mixing states again.'
                       : 'Rough round — that is data, not a verdict. Read every huraian below slowly, then retake just the mistakes.';

  const group=(keyFn,nameFn)=>{
    const m=new Map();
    S.items.forEach(q=>{ const k=keyFn(q); const r=m.get(k)||{ok:0,tot:0,name:nameFn(q)};
                         r.tot++; if(S.picks[q.uid]===q.a) r.ok++; m.set(k,r); });
    return [...m.values()].sort((a,b)=>a.ok/a.tot-b.ok/b.tot).map(r=>[r.name,r.ok,r.tot]);
  };
  const wrong = S.items.filter(q=>S.picks[q.uid]!==q.a);

  app.innerHTML =
   '<div class="card">'+
     '<div class="res">'+
       '<div class="score">'+score+'<span>/'+tot+'</span></div>'+
       '<div class="pc">'+Math.round(pct*100)+'% &middot; '+(S.mode==='exam'?'EXAM':'PRACTICE')+'</div>'+
       '<p class="msg">'+msg+'</p>'+
     '</div>'+
     '<div class="sec" style="border-top:1px solid var(--line)"><div class="lab">BY TOPIC &mdash; weakest first</div>'+
        bars(group(q=>q.topic,tname))+'</div>'+
     '<div class="sec"><div class="lab">BY FORM</div>'+bars(group(q=>q.form,q=>q.form==='F4'?'FORM 4':'FORM 5'))+'</div>'+
     '<div class="sec"><div class="lab">BY STATE</div>'+bars(group(q=>q.state+q.year,q=>q.state+(q.year?' '+q.year:'')))+'</div>'+

     (wrong.length ?
     '<div class="rev"><div class="lab">REVIEW &mdash; '+wrong.length+' TO FIX</div>'+
       wrong.map(q=>{
         const p=S.picks[q.uid];
         return '<div class="rq">'+
           '<div class="h"><span>'+q.state+(q.year?' '+q.year:'')+' &middot; Q'+q.n+'</span>'+
             '<span>'+q.form+' &middot; '+tname(q)+'</span>'+
             (p==null?'<b>NOT ANSWERED</b>':'<b>WRONG</b>')+'</div>'+
           '<div class="t">'+T(q.q)+'</div>'+
           (q.img?'<img class="qimg" loading="lazy" decoding="async"'+imgDim(q.img)+' src="'+attr(q.img)+'" alt="figure">':'')+
           '<div class="ans">'+(p!=null?'YOU: <s>'+LTR[p]+' &middot; '+T(q.o[p])+'</s><br>':'')+
             'ANSWER: <em>'+LTR[q.a]+' &middot; '+T(q.o[q.a])+'</em></div>'+
           (T(q.w)?'<div class="w">'+T(q.w)+'</div>':'')+
         '</div>';
       }).join('')+
     '</div>' : '')+

     '<div class="startrow">'+
       (wrong.length?'<button class="cta" id="redo">RETAKE THE '+wrong.length+' I MISSED &rarr;</button>':'')+
       '<button class="btn mutebtn" id="again">&#8634; SAME FILTERS AGAIN</button>'+
       '<button class="btn mutebtn" id="home">&larr; CHANGE FILTERS</button>'+
     '</div>'+
   '</div>';

  const on=(id,fn)=>{const e=$('#'+id); if(e) e.addEventListener('click',fn);};
  on('redo',()=>startSession(wrong));
  on('again',()=>startSession());
  on('home',renderSetup);
  window.scrollTo({top:0});
}

/* =========================================================================
   STATS
   ========================================================================= */
function renderStats(){
  S=null;
  const seen=BANK.filter(q=>DB.d.progress[q.uid]&&DB.d.progress[q.uid].seen);
  const mastered=seen.filter(q=>DB.d.progress[q.uid].box>=3);
  const hist=DB.d.history.slice(-12).reverse();

  const byTopic=new Map();
  seen.forEach(q=>{ const p=DB.d.progress[q.uid];
    const r=byTopic.get(q.topic)||{name:tname(q),ok:0,tot:0};
    r.ok+=p.right; r.tot+=p.right+p.wrong; byTopic.set(q.topic,r); });
  const rows=[...byTopic.values()].filter(r=>r.tot).sort((a,b)=>a.ok/a.tot-b.ok/b.tot).map(r=>[r.name,r.ok,r.tot]);

  app.innerHTML =
   '<p class="kick">CUMULATIVE &middot; SAVED ON THIS DEVICE</p>'+
   '<h1>What you actually <em>know</em> so far</h1>'+
   '<div class="card" style="margin-top:24px">'+
     '<div class="sec"><div class="grid2">'+
       '<div class="count"><b>'+seen.length+'</b>of '+BANK.length+' questions attempted</div>'+
       '<div class="count"><b>'+mastered.length+'</b>mastered (3 in a row)</div>'+
       '<div class="count"><b>'+DB.d.history.length+'</b>drills completed</div>'+
     '</div></div>'+
     (rows.length?'<div class="sec"><div class="lab">ACCURACY BY TOPIC &mdash; weakest first</div>'+bars(rows)+'</div>'
                 :'<div class="empty">No attempts recorded yet. Run a drill first.</div>')+
     (hist.length?'<div class="sec"><div class="lab">RECENT DRILLS</div>'+
        hist.map(h=>'<div class="brow"><span>'+new Date(h.at).toLocaleDateString()+'</span>'+
          '<span class="tr"><span class="fl '+(h.score/h.total>=.75?'':h.score/h.total>=.5?'mid':'low')+
          '" style="width:'+Math.round(h.score/h.total*100)+'%"></span></span>'+
          '<span class="v">'+h.score+'/'+h.total+(h.mode==='p2'?' P2':'')+'</span></div>').join('')+'</div>':'')+
     '<div class="startrow">'+
       '<button class="btn mutebtn" id="home">&larr; BACK</button>'+
       '<button class="btn mutebtn" id="exp">EXPORT PROGRESS</button>'+
       '<button class="btn mutebtn" id="wipe" style="border-color:var(--badR);color:var(--badR)">RESET ALL</button>'+
     '</div>'+
   '</div>';

  $('#home').addEventListener('click',renderSetup);
  $('#exp').addEventListener('click',()=>{
    const blob=new Blob([JSON.stringify(DB.d,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='spm2026-progress.json'; a.click(); toast('EXPORTED');
  });
  $('#wipe').addEventListener('click',()=>{
    if(confirm('Erase all saved progress on this device?')){ DB.d.progress={}; DB.d.history=[]; DB.save(); renderStats(); }
  });
}

/* =========================================================================
   MATH / CHROME
   ========================================================================= */
window.__renderMath=renderMath;
function renderMath(){
  if(window.__katexReady && window.renderMathInElement){
    renderMathInElement(app,{
      delimiters:[
        {left:'$$',right:'$$',display:true},
        {left:'\\[',right:'\\]',display:true},
        {left:'$',right:'$',display:false},
        {left:'\\(',right:'\\)',display:false}
      ],
      throwOnError:false
    });
  }
}

function setTheme(t){ document.documentElement.dataset.theme=t; DB.d.settings.theme=t; DB.save(); }
setTheme(DB.d.settings.theme||'dark');

$('#btnTheme').addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));
$('#btnHome').addEventListener('click',()=>leaveDrill(renderSetup));
$('#btnStats').addEventListener('click',()=>leaveDrill(renderStats));
$('#btnLang').addEventListener('click',()=>{
  LANG = LANG==='en' ? 'bm' : 'en';
  DB.d.settings.lang=LANG; DB.save(); toast(LANG==='bm'?'BAHASA MELAYU':'ENGLISH');
  if(S && !S.done){
    if(S.mode==='p2') renderP2Quiz(); else renderQuiz();
  } else renderSetup();
});

document.addEventListener('keydown',e=>{
  if(!S||S.done||e.metaKey||e.ctrlKey||e.altKey) return;
  if(S.mode==='p2'){
    // P2 keyboard: SPACE=reveal next, 1=DAPAT, 0=BELUM, ENTER=next, ESC=exit
    const q=S.items[S.idx];
    const nextClosed=q.parts.find(p=>!S.open[q.uid+p.l]);
    const lastOpenUnmarked=q.parts.find(p=>S.open[q.uid+p.l]&&S.marks[q.uid+p.l]==null);
    if(e.key===' '){ e.preventDefault(); if(nextClosed){S.open[q.uid+nextClosed.l]=1; renderP2Quiz();} }
    else if(e.key==='1'&&lastOpenUnmarked){ mark2(q.uid+lastOpenUnmarked.l,true); }
    else if(e.key==='0'&&lastOpenUnmarked){ mark2(q.uid+lastOpenUnmarked.l,false); }
    else if(e.key==='Enter'){ e.preventDefault(); go2(); }
    else if(e.key==='Escape'){ leaveDrill(renderSetup); }
    else if(e.key==='ArrowRight'){ e.preventDefault(); go2(); }
    else if(e.key==='ArrowLeft'&&S.idx){ e.preventDefault(); S.idx--; renderP2Quiz(); }
    return;
  }
  // P1 keyboard
  const q=S.items[S.idx], k=e.key.toUpperCase();
  const li=LTR.indexOf(k), ni='12345'.indexOf(k);
  if(li>-1&&li<q.o.length){ e.preventDefault(); choose(li); }
  else if(ni>-1&&ni<q.o.length){ e.preventDefault(); choose(ni); }
  else if(e.key==='Enter'){ e.preventDefault(); go1(); }
  else if(k==='F'){ S.flags.has(q.uid)?S.flags.delete(q.uid):S.flags.add(q.uid); renderQuiz(); }
  else if(k==='G'){ const g=$('#grid'); if(g) g.classList.toggle('show'); }
  else if(e.key==='Escape'){ leaveDrill(renderSetup); }
  else if(e.key==='ArrowRight'){ go1(); }
  else if(e.key==='ArrowLeft'&&S.idx){ S.idx--; renderQuiz(); }
});

renderSetup();
};
</script>

<script>window.__SPM_START();</script>
</body>
