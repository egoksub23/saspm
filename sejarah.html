{n:4,uid:'mlk-sej-26-04',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'<p>Akhbar berikut diterbitkan pada tahun 1884 untuk menyebarkan idea Pan-Islamisme ke seluruh dunia.</p><img src="img/sejarah/a5a86bef7158.webp" alt="Al-Urwah Al-Wuthqa" loading="lazy" decoding="async" width="596" height="796"><p>Apakah seruan yang dimuatkan dalam akhbar tersebut?</p>',
 o:['Pembaharuan dalam kehidupan','Pemeliharaan budaya tempatan','Penyebaran dakwah agama','Penentangan kuasa barat'],
 a:3,
 w:'Al-Urwah Al-Wuthqa yang diterbitkan oleh Jamaluddin Al-Afghani dan Muhammad Abduh menyeru umat Islam menentang penjajahan dan dominasi kuasa Barat. Akhbar ini merupakan medium penting dalam penyebaran gerakan Pan-Islamisme.'},

{n:5,uid:'mlk-sej-26-05',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'<p>Revolusi Thai telah berlaku pada tahun 1932. Apakah kesan revolusi tersebut terhadap pentadbiran Thailand?</p>',
 o:['Gabungan wilayah baharu dibentuk','Raja berkuasa mutlak ditamatkan','Birokrasi barat diperkenalkan','Hak bangsawan dikembalikan'],
 a:1,
 w:'Revolusi Thai 1932 menggulingkan sistem monarki mutlak dan menggantikannya dengan monarki berperlembagaan. Kuasa mutlak raja ditamatkan dan kerajaan bercorak demokrasi diperkenalkan.'},

{n:6,uid:'mlk-sej-26-06',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'<p>Kesatuan Melayu Muda (KMM) telah ditubuhkan oleh Ibrahim Hj. Yaakob pada tahun 1937. Mengapakah British menganggap pertubuhan ini bersifat radikal?</p>',
 o:['Menganjurkan mogok Hartal','Membentuk pakatan dengan Jepun','Mengancam pasukan keselamatan negara','Menyuarakan penentangan kepada kerajaan'],
 a:3,
 w:'British menganggap KMM bersifat radikal kerana pertubuhan ini secara terbuka menyuarakan penentangan terhadap pemerintahan British di Tanah Melayu. KMM memperjuangkan kemerdekaan Melayu dan menentang dasar penjajahan British.'},

{n:7,uid:'mlk-sej-26-07',form:'F4',topic:'F4 · Bab 3: Konflik Dunia dan Pendudukan Jepun',
 q:'<p>Rajah berikut berkaitan pakatan ketenteraan yang wujud pada Perang Dunia Pertama.</p><table class="spm-table"><thead><tr><th>Kuasa Tengah</th></tr></thead><tbody><tr><td>Austria-Hungary</td></tr><tr><td>Uthmaniyyah</td></tr><tr><td><strong>X</strong></td></tr></tbody></table><p>Apakah X?</p>',
 o:['Britain','Belanda','Jerman','Perancis'],
 a:2,
 w:'Pakatan Kuasa Tengah dalam Perang Dunia Pertama terdiri daripada Jerman, Austria-Hungary, Empayar Uthmaniyyah dan Bulgaria. Jerman merupakan kuasa utama dalam pakatan ini.'},

{n:8,uid:'mlk-sej-26-08',form:'F4',topic:'F4 · Bab 3: Konflik Dunia dan Pendudukan Jepun',
 q:'<p>Perang Dunia Pertama berakhir secara rasmi pada 11 November 1918. Apakah kesan perang tersebut terhadap negara Eropah?</p><p>I&nbsp;&nbsp; Perebutan takhta kerajaan<br>II&nbsp; Pemerintahan beraja runtuh<br>III Pembentukan negara baharu<br>IV Penggabungan kawasan sempadan</p>',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:2,
 w:'Kesan Perang Dunia Pertama terhadap Eropah ialah keruntuhan empayar-empayar besar seperti empayar Austro-Hungary, Uthmaniyyah dan Rusia, serta pembentukan negara-negara baharu seperti Poland, Czechoslovakia dan Yugoslavia.'},

{n:9,uid:'mlk-sej-26-09',form:'F4',topic:'F4 · Bab 3: Konflik Dunia dan Pendudukan Jepun',
 q:'<div class="spm-box"><p>• Keperluan ekonomi</p><p>• Kepentingan strategik ketenteraan</p></div><p>Bagaimanakah Jepun dapat memastikan tujuan tersebut dapat dicapai?</p>',
 o:['Mengembalikan kuasa sultan','Melantik pegawai tempatan','Mencipta teknologi moden','Menggunakan propaganda'],
 a:3,
 w:'Jepun menggunakan propaganda untuk memastikan matlamat ekonomi dan strategik ketenteraannya tercapai. Melalui propaganda, Jepun menanamkan semangat Asia untuk Asia bagi mendapat sokongan penduduk tempatan.'},

{n:10,uid:'mlk-sej-26-10',form:'F4',topic:'F4 · Bab 3: Konflik Dunia dan Pendudukan Jepun',
 q:'<p>Pentadbiran Tentera British (BMA) dilaksanakan di Tanah Melayu bermula 12 September 1945. Mengapakah British melaksanakan pentadbiran tersebut?</p><p>I&nbsp;&nbsp; Mengembalikan kestabilan<br>II&nbsp; Memperkukuhkan pertahanan<br>III Meneruskan dasar peluasan kuasa<br>IV Memulihkan kepercayaan rakyat</p>',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:1,
 w:'BMA dilaksanakan untuk mengembalikan kestabilan setelah tamatnya Perang Dunia Kedua dan memulihkan kepercayaan rakyat terhadap pemerintahan British selepas kekalahan kepada Jepun.'},

{n:11,uid:'mlk-sej-26-11',form:'F4',topic:'F4 · Bab 4: Era Peralihan Kuasa British',
 q:'<p>Pengisytiharan Malayan Union pada 1 April 1946 menimbulkan reaksi penentangan daripada rakyat Tanah Melayu. Bagaimanakah rakyat menentang Malayan Union?</p><p>I&nbsp;&nbsp; Menghantar surat bantahan<br>II&nbsp; Menganjurkan kongres<br>III Melakukan perarakan<br>IV Meletakkan jawatan</p>',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:2,
 w:'Rakyat Tanah Melayu menentang Malayan Union dengan menganjurkan kongres dan melakukan perarakan bantahan. UMNO yang ditubuhkan pada Mac 1946 memimpin penentangan ini secara teratur.'},

{n:12,uid:'mlk-sej-26-12',form:'F4',topic:'F4 · Bab 4: Era Peralihan Kuasa British',
 q:'<div class="spm-box">Penyerahan Sarawak kepada British</div><p>Mengapakah penyerahan tersebut berlaku?</p>',
 o:['Kekurangan pelabur asing','Ketiadaan pewaris takhta','Kehilangan sokongan pembesar','Kemerosotan kegiatan perdagangan'],
 a:1,
 w:'Sarawak diserahkan kepada British oleh Rajah Charles Vyner Brooke pada tahun 1946 kerana beliau tidak mempunyai pewaris takhta yang sesuai. Beliau berpendapat British lebih mampu memerintah Sarawak selepas kekacauan Perang Dunia Kedua.'},

{n:13,uid:'mlk-sej-26-13',form:'F4',topic:'F4 · Bab 4: Era Peralihan Kuasa British',
 q:'<p>Gambar berikut berkaitan upacara menandatangani Perjanjian Persekutuan Tanah Melayu 1948 oleh Raja-raja Melayu bersama pihak British.</p><img src="img/sejarah/deeadb7950c8.webp" alt="Upacara menandatangani Perjanjian PTM 1948" loading="lazy" decoding="async" width="1000" height="730"><p>Apakah perkara yang terkandung dalam perjanjian tersebut?</p>',
 img:'img/sejarah/deeadb7950c8.webp',
 o:['British mengawal belanjawan','Majlis Raja-raja ditubuhkan','Gabenor mengetuai pentadbiran','Kewarganegaraan secara Jus Soli'],
 a:1,
 w:'Perjanjian Persekutuan Tanah Melayu 1948 menubuhkan Majlis Raja-Raja sebagai badan penting dalam perlembagaan. Perjanjian ini juga memulihkan kedaulatan raja-raja Melayu yang telah dirampas oleh Malayan Union.'},

{n:14,uid:'mlk-sej-26-14',form:'F4',topic:'F4 · Bab 6: Ancaman Komunis dan Darurat',
 q:'<table class="spm-table"><thead><tr><th>Bulan</th><th>Persidangan</th></tr></thead><tbody><tr><td>Februari 1948</td><td>Kongres Belia Asia</td></tr><tr><td>Mac 1948</td><td>Persidangan Parti Komunis India</td></tr></tbody></table><p>Apakah tindakan Parti Komunis Malaya selepas menghadiri persidangan tersebut?</p>',
 o:['Menubuhkan unit sukarelawan','Mendaftar sebagai pertubuhan politik','Menjalankan kerjasama dengan barat','Melancarkan perjuangan bersenjata'],
 a:3,
 w:'Selepas menghadiri persidangan komunis antarabangsa, PKM melancarkan perjuangan bersenjata untuk mengulingkan kerajaan British. Ini menyebabkan British mengisytiharkan Darurat pada Jun 1948.'},

{n:15,uid:'mlk-sej-26-15',form:'F4',topic:'F4 · Bab 6: Ancaman Komunis dan Darurat',
 q:'<div class="spm-box">Senoi Praaq</div><p>Apakah tugas pasukan tersebut?</p>',
 o:['Menjalankan aktiviti propaganda','Mengawal keselamatan kampung','Memindahkan penduduk pinggir hutan','Mengesan tempat persembunyian musuh'],
 a:3,

{n:16,uid:'mlk-sej-26-16',form:'F4',topic:'F4 · Bab 4: Era Peralihan Kuasa British',
 q:'<p>Mengapakah Dato\' Onn Jaafar menubuhkan Pertubuhan Kebangsaan Melayu Bersatu (UMNO) pada tahun 1946?</p>',
 o:['Menjayakan konsep Melayu Raya','Membasmi ancaman komunis','Menentang Malayan Union','Memupuk perpaduan kaum'],
 a:2,
 w:'UMNO ditubuhkan oleh Dato\' Onn Jaafar pada 11 Mei 1946 khusus untuk menentang cadangan Malayan Union yang dianggap mengancam hak dan kedaulatan orang Melayu serta raja-raja Melayu.'},

{n:17,uid:'mlk-sej-26-17',form:'F4',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
 q:'<div class="spm-box"><p>• Vernakular Cina</p><p>• Vernakular Tamil</p><p>• Sekolah Inggeris</p></div><p>Apakah kesan pengenalan sistem tersebut kepada penduduk Tanah Melayu?</p>',
 o:['Menyebabkan jurang sosial','Melahirkan golongan intelektual','Mewujudkan satu identiti bangsa','Membentuk parti politik berasaskan kaum'],

{n:18,uid:'mlk-sej-26-18',form:'F4',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
 q:'<p>Pilihanraya Umum Pertama Tanah Melayu 1955. Apakah syarat-syarat untuk menjadi calon?</p><p>I&nbsp;&nbsp; Berpengetahuan Bahasa Inggeris<br>II&nbsp; Sumber kewangan mencukupi<br>III Tiada sebarang rekod jenayah<br>IV Berumur 21 tahun ke atas</p>',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:1,
 w:'Syarat untuk menjadi calon dalam Pilihanraya Umum Pertama 1955 ialah calon mestilah berpengetahuan dalam Bahasa Inggeris dan berumur 21 tahun ke atas. Syarat-syarat ini bertujuan memastikan calon yang bertanding berkelayakan.'},

{n:19,uid:'mlk-sej-26-19',form:'F4',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
 q:'<div class="spm-box">Rundingan kemerdekaan di London pada tahun 1956</div><p>Apakah keputusan yang telah dipersetujui?</p>',
 o:['Pembentukan suruhanjaya pilihanraya','Perjanjian pertahanan dimeterai','Pemilihan ketua utama negara','Perubahan sempadan negeri'],
 a:1,
 w:'Dalam rundingan kemerdekaan London 1956, keputusan penting yang dipersetujui ialah perjanjian pertahanan antara Tanah Melayu dengan Britain untuk menjamin keselamatan negara selepas merdeka.'},

{n:20,uid:'mlk-sej-26-20',form:'F4',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
 q:'<p>Antara berikut yang manakah berkaitan tugas Jawatankuasa Sambutan bagi persediaan menyambut pemasyhuruan kemerdekaan negara?</p><p>I&nbsp;&nbsp; Membina sebuah stadium<br>II&nbsp; Mencipta bendera kebangsaan<br>III Menghias bandar dengan lampu<br>IV Menganjurkan kursus protokol</p>',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:3,
 w:'Jawatankuasa Sambutan Kemerdekaan bertanggungjawab menghias bandar dengan lampu dan menganjurkan kursus protokol bagi memastikan upacara pemasyhuruan kemerdekaan berjalan dengan sempurna dan teratur.'},

{n:21,uid:'mlk-sej-26-21',form:'F5',topic:'F5 · Bab 1: Kedaulatan Negara',
 q:'<p>Mengapakah kedaulatan penting bagi sesebuah negara?</p><p>I&nbsp;&nbsp; Mewujudkan kesejahteraan rakyat<br>II&nbsp; Menunjukkan kekuatan angkatan tentera<br>III Menjadi kuasa politik yang unggul di dunia<br>IV Mendapat pengiktirafan daripada negara lain</p>',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:1,
 w:'Kedaulatan penting kerana ia mewujudkan kesejahteraan rakyat melalui pentadbiran yang bebas dan juga mendapat pengiktirafan daripada negara lain. Pengiktirafan antarabangsa membolehkan negara menjalin hubungan diplomatik dan ekonomi.'},

{n:22,uid:'mlk-sej-26-22',form:'F5',topic:'F5 · Bab 1: Kedaulatan Negara',
 q:'<div class="spm-box"><p>• Mempunyai rakyat</p><p>• Mempunyai sempadan</p></div><p>Apakah kepentingan ciri tersebut terhadap negara kita?</p>',
 o:['Melindungi tradisi rakyat','Memperkuat pasukan tentera','Mempunyai identiti tersendiri','Mengukuhkan kuasa mutlak raja'],
 a:2,
 w:'Ciri mempunyai rakyat dan sempadan memberikan negara identiti tersendiri yang membezakannya daripada negara lain. Identiti ini penting untuk mendapat pengiktirafan antarabangsa sebagai sebuah negara yang berdaulat.'},

{n:23,uid:'mlk-sej-26-23',form:'F5',topic:'F4 · Bab 1: Warisan Negara Bangsa',
 q:'<div class="spm-box"><p>Charter of Justice I – 1807</p><p>Charter of Justice II – 1826</p><p>Charter of Justice III – 1855</p></div><p>Apakah kesan daripada pengenalan undang-undang tersebut?</p>',
 o:['Kemasukan imigran','Pengenalan mata wang','Penubuhan mahkamah','Kemunculan bandar baharu'],
 a:2,
 w:'Charter of Justice memperkenalkan sistem undang-undang British ke Negeri-Negeri Selat yang membawa kepada penubuhan mahkamah mengikut sistem perundangan British. Ini menggantikan undang-undang adat tempatan secara beransur-ansur.'},

{n:24,uid:'mlk-sej-26-24',form:'F5',topic:'F5 · Bab 1: Kedaulatan Negara',
 q:'<p>Perlembagaan Persekutuan mempunyai ciri tradisional dan ciri moden. Apakah ciri moden dalam perlembagaan tersebut?</p>',
 o:['Pemerintahan beraja','Kewarganegaraan','Bahasa Melayu','Agama Islam'],
 a:1,
 w:'Kewarganegaraan merupakan ciri moden dalam Perlembagaan Persekutuan yang diadaptasi daripada sistem demokrasi barat. Ciri tradisional pula ialah pemerintahan beraja, bahasa Melayu dan agama Islam.'},

{n:25,uid:'mlk-sej-26-25',form:'F5',topic:'F5 · Bab 1: Kedaulatan Negara',
 q:'<p>Apakah bidang kuasa Majlis Raja-Raja dalam Perlembagaan Persekutuan?</p>',
 o:['Mengisytiharkan darurat','Menguruskan pilihan raya umum','Meluluskan belanjawan tahunan negara','Memperkenankan perubahan sempadan negeri'],
 a:3,
 w:'Majlis Raja-Raja mempunyai bidang kuasa untuk memperkenankan perubahan sempadan negeri. Majlis ini juga memberi perkenan kepada rang undang-undang yang berkaitan dengan kedudukan Raja-Raja Melayu dan hak istimewa orang Melayu.'},

{n:26,uid:'mlk-sej-26-26',form:'F5',topic:'F5 · Bab 1: Kedaulatan Negara',
 q:'<p>Rajah berikut berkaitan pengasingan kuasa dalam sistem pemerintahan di Malaysia.</p><table class="spm-table"><thead><tr><th colspan="3">Yang di-Pertuan Agung</th></tr></thead><tbody><tr><td>Badan Perundangan</td><td>Badan Eksekutif</td><td>Badan Kehakiman</td></tr></tbody></table><p>Apakah peranan badan eksekutif dalam sistem tersebut?</p>',
 o:['Mentafsir undang-undang','Menggubal undang-undang','Meluluskan sistem cukai baharu','Melaksanakan dasar-dasar negara'],
 a:3,
 w:'Badan Eksekutif yang diketuai oleh Perdana Menteri berperanan melaksanakan dasar-dasar negara. Badan Perundangan pula menggubal undang-undang manakala Badan Kehakiman mentafsir undang-undang.'},

{n:27,uid:'mlk-sej-26-27',form:'F5',topic:'F4 · Bab 1: Warisan Negara Bangsa',
 q:'<p>Jadual berikut berkaitan perkembangan sistem pentadbiran Persekutuan di negara kita.</p><table class="spm-table"><thead><tr><th>Tahun</th><th>Sistem Pentadbiran</th></tr></thead><tbody><tr><td>1896</td><td>Pembentukan Negeri-negeri Melayu Bersekutu</td></tr><tr><td>1927</td><td>Pembentukan Majlis Perundangan Persekutuan</td></tr><tr><td>1946</td><td>Penubuhan Malayan Union</td></tr></tbody></table><p>Apakah kepentingan pembentukan sistem tersebut?</p>',
 o:['Menjamin kepentingan British','Menjalankan dasar dekolonisasi','Melaksanakan pengasingan kuasa','Mengukuhkan kedudukan Raja-raja Melayu'],
 a:0,
 w:'Pembentukan sistem pentadbiran Persekutuan dari NMB (1896) hingga Malayan Union (1946) bertujuan menjamin dan mengukuhkan kepentingan British di Tanah Melayu melalui kawalan berpusat ke atas politik dan ekonomi.'},

{n:28,uid:'mlk-sej-26-28',form:'F5',topic:'F5 · Bab 10: Kecemerlangan Malaysia di Persada Dunia',
 q:'<p>Senarai berikut merupakan agensi persekutuan yang ditubuhkan di negara kita.</p><div class="spm-box"><p>• Lembaga Kemajuan Kelantan Selatan (KESEDAR)</p><p>• Lembaga Kemajuan Pahang Tenggara (DARA)</p><p>• Lembaga Kemajuan Johor Tenggara (KEJORA)</p></div><p>Mengapakah agensi tersebut ditubuhkan?</p>',
 o:['Memajukan industri desa','Memulihkan tanah terbiar','Menyediakan perumahan awam','Membangunkan wilayah baharu'],
 a:3,
 w:'KESEDAR, DARA dan KEJORA ditubuhkan untuk membangunkan wilayah-wilayah terpencil dan kurang maju di Malaysia. Agensi-agensi ini membuka tanah baharu dan membangunkan infrastruktur bagi meningkatkan taraf hidup penduduk.'},

{n:29,uid:'mlk-sej-26-29',form:'F5',topic:'F5 · Bab 10: Kecemerlangan Malaysia di Persada Dunia',
 q:'<table class="spm-table"><thead><tr><th>Tokoh</th><th>Pandangan</th></tr></thead><tbody><tr><td>Malcolm McDonald</td><td>Penggabungan tanah jajahan British di Asia Tenggara</td></tr><tr><td>Gerald Templer</td><td>Penggabungan wilayah disegerakan</td></tr></tbody></table><p>Mengapakah cadangan tersebut penting kepada British?</p><p>I&nbsp;&nbsp; Menjayakan dekolonisasi<br>II&nbsp; Mengukuhkan keselamatan<br>III Menyebarkan kebudayaan<br>IV Memajukan potensi ekonomi</p>',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:0,
 w:'Cadangan penggabungan wilayah British di Asia Tenggara penting untuk menjayakan proses dekolonisasi secara teratur dan mengukuhkan keselamatan rantau ini daripada ancaman komunis semasa Perang Dingin.'},

{n:30,uid:'mlk-sej-26-30',form:'F5',topic:'F5 · Bab 10: Kecemerlangan Malaysia di Persada Dunia',
 q:'<p>Pada 30 Januari 1963, Dr Subandrio mengumumkan dasar konfrontasi terhadap Malaysia. Mengapakah Indonesia mengambil tindakan tersebut?</p>',
 o:['Menunjukkan kekuatan tentera','Mendapatkan referendum rakyat','Mengancam kedudukan negara','Menerima desakan antarabangsa'],
 a:2,
 w:'Indonesia melancarkan konfrontasi untuk mengancam kedudukan Malaysia yang baru dibentuk. Indonesia menganggap pembentukan Malaysia sebagai "neokolonialisme" British yang mengancam kepentingan dan keselamatan Indonesia.'},

{n:31,uid:'mlk-sej-26-31',form:'F5',topic:'F5 · Bab 10: Kecemerlangan Malaysia di Persada Dunia',
 q:'<p>Cabaran politik di Sarawak menjadi cabaran yang dihadapi oleh Malaysia. Apakah faktor berlakunya cabaran tersebut?</p><p>I&nbsp;&nbsp; Hak sama rata<br>II&nbsp; Konflik perkauman<br>III Krisis perlembagaan<br>IV Ancaman keselamatan</p>',

{n:32,uid:'mlk-sej-26-32',form:'F5',topic:'F5 · Bab 10: Kecemerlangan Malaysia di Persada Dunia',
 q:'<p>Apakah langkah kerajaan dalam menangani isu taraf hidup yang berbeza dalam Rancangan Malaysia Pertama?</p>',

{n:33,uid:'mlk-sej-26-33',form:'F5',topic:'F5 · Bab 10: Kecemerlangan Malaysia di Persada Dunia',

{n:34,uid:'mlk-sej-26-34',form:'F5',topic:'F5 · Bab 10: Kecemerlangan Malaysia di Persada Dunia',

{n:35,uid:'mlk-sej-26-35',form:'F5',topic:'F5 · Bab 10: Kecemerlangan Malaysia di Persada Dunia',

{n:36,uid:'mlk-sej-26-36',form:'F5',topic:'F5 · Bab 10: Kecemerlangan Malaysia di Persada Dunia',

{n:37,uid:'mlk-sej-26-37',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',

{n:38,uid:'mlk-sej-26-38',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',

{n:39,uid:'mlk-sej-26-39',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',

w:'Bendahara ialah jawatan tertinggi dalam Sistem Pembesar Empat Lipatan yang berperanan sebagai penasihat utama dan menjalankan tugas yang menyamai Perdana Menteri dalam kerajaan Melayu tradisional.'},
{n:2,uid:'sej-prk-26-02',form:'F4',topic:'F4 · Bab 1: Warisan Negara Bangsa',
q:'Dalam masyarakat Melayu tradisional, konsep <i>tulah</i> dipegang teguh oleh rakyat sebagai pengajaran terhadap mereka yang menderhaka kepada raja. Apakah nilai yang ingin diterapkan melalui konsep ini?',
o:['Menjaga kebajikan kerajaan','Mematuhi arahan pemerintah','Memelihara kemakmuran negara','Mewujudkan persefahaman rakyat'],
a:1,
w:'Konsep tulah bertujuan mendidik rakyat supaya mematuhi arahan pemerintah dan tidak menderhaka terhadap raja, bagi mengekalkan keharmonian dalam sistem pemerintahan Melayu tradisional.'},
{n:3,uid:'sej-prk-26-03',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
q:'<table style="border-collapse:collapse;margin:.5em 0"><tr><th style="border:1px solid #888;padding:4px 8px">Tahun</th><th style="border:1px solid #888;padding:4px 8px">Peristiwa</th></tr><tr><td style="border:1px solid #888;padding:4px 8px">1688</td><td style="border:1px solid #888;padding:4px 8px">Revolusi Keagungan di England</td></tr></table>Apakah kepentingan peristiwa di atas kepada perkembangan sistem pemerintahan?',
o:['Melindungi golongan bangsawan','Menegakkan kedaulatan parlimen','Membentuk negara bangsa moden','Mempertahankan sistem demokrasi'],
a:1,
w:'Revolusi Keagungan 1688 di England menegakkan kedaulatan parlimen di mana kuasa raja dihadkan dan parlimen menjadi badan perundangan tertinggi, menjadi asas sistem pemerintahan berparlimen moden.'},
{n:4,uid:'sej-prk-26-04',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
q:'<div style="border:1px solid #888;padding:6px 10px;display:inline-block;margin:.5em 0">Abdul Rahim Kajai &nbsp;|&nbsp; Za\'ba</div><br>Sumbangan tokoh-tokoh di atas telah mencetuskan kesedaran nasionalisme dalam kalangan masyarakat Melayu. Apakah bentuk sumbangan tersebut?',
o:['Menghasilkan karya kreatif','Membentuk parti politik','Mewujudkan persatuan','Mengasaskan gerakan revolusi'],
a:0,
w:'Abdul Rahim Kajai dan Za\'ba menyumbang kepada kesedaran nasionalisme melalui penulisan dan penghasilan karya kreatif dalam bahasa Melayu yang membangkitkan semangat cinta akan bangsa dan tanah air.'},
{n:5,uid:'sej-prk-26-05',form:'F4',topic:'F4 · Bab 3: Konflik Dunia dan Pendudukan Jepun',
q:'Serangan Jepun ke atas Pearl Harbour pada tahun 1941 telah mengubah pendirian pelbagai pihak terhadap Perang Dunia Kedua. Apakah tujuan Jepun melancarkan serangan tersebut?',
o:['Memperjuangkan hak penduduk asal','Mengekalkan kemerdekaan tanah air','Menghalang kemaraan kuasa Barat','Menyekat kebangkitan anti-penjajah'],
a:2,
w:'Jepun menyerang Pearl Harbour bertujuan menghalang kemaraan kuasa Barat, khususnya Amerika Syarikat, daripada mengancam peluasan empayar Jepun di rantau Asia Pasifik.'},
{n:6,uid:'sej-prk-26-06',form:'F4',topic:'F4 · Bab 3: Konflik Dunia dan Pendudukan Jepun',
q:'Kekejaman tentera Jepun semasa pendudukan di Tanah Melayu telah mendorong penduduk tempatan untuk melancarkan penentangan. Apakah tindakan yang diambil oleh penduduk Melayu?',
o:['Membentuk Gerakan Fi-Sabilillah','Meminta bantuan tentera Komanwel','Membantu pasukan Pengawal Kampung','Menubuhkan Rejimen Askar Melayu'],
a:3,
w:'Penduduk Melayu menubuhkan Rejimen Askar Melayu sebagai bentuk penentangan terhadap kekejaman Jepun dan untuk mempertahankan tanah air mereka semasa pendudukan Jepun.'},
{n:7,uid:'sej-prk-26-07',form:'F4',topic:'F4 · Bab 3: Konflik Dunia dan Pendudukan Jepun',
q:'<div style="border:1px solid #888;padding:6px 10px;margin:.5em 0"><strong>X</strong><ul style="margin:.3em 0;padding-left:1.4em"><li>Diketuai oleh seorang Gabenor</li><li>Kerakyatan berasaskan prinsip <i>jus soli</i></li></ul></div>Apakah X?',
o:['Majlis Perundangan Persekutuan','Persekutuan Tanah Melayu','Pentadbiran Tentera British','Malayan Union'],
a:3,
w:'Malayan Union yang diperkenalkan pada tahun 1946 diketuai oleh seorang Gabenor British dan mengamalkan kerakyatan berasaskan prinsip jus soli yang memberikan kerakyatan kepada semua yang lahir di Tanah Melayu.'},
{n:8,uid:'sej-prk-26-08',form:'F4',topic:'F4 · Bab 3: Konflik Dunia dan Pendudukan Jepun',
q:'Tokoh-tokoh berikut merupakan antara pemimpin yang menandatangani Rukun 13 bagi mewakili masyarakat Sarawak:<br><br>Morshidi Sidek &nbsp;&nbsp; Bujang Suntong &nbsp;&nbsp; Awang Rambli<br><br>Apakah matlamat Rukun 13 tersebut?',
o:['Menghapuskan pegawai tinggi British','Menolak Perlembagaan Rakyat','Memelihara hak peribumi','Menuntut kemerdekaan'],
a:0,
w:'Rukun 13 yang ditandatangani oleh pemimpin-pemimpin Sarawak bertujuan menghapuskan pegawai tinggi British yang menguasai pentadbiran Sarawak dan menuntut hak rakyat tempatan untuk mentadbir negeri sendiri.'},
{n:9,uid:'sej-prk-26-09',form:'F4',topic:'F4 · Bab 5: Persekutuan Tanah Melayu 1948',
q:'Gabungan PUTERA-AMCJA menolak cadangan Persekutuan Tanah Melayu 1948. Apakah sebab penolakan tersebut?',
o:['Ketiadaan wakil dalam jawatankuasa','Menghakis kuasa pembesar tempatan','Kekuatan desakan golongan anti-penjajah','Menafikan hak istimewa penduduk peribumi'],
a:0,
w:'PUTERA-AMCJA menolak PTM 1948 kerana tiada wakil mereka dalam jawatankuasa yang menggubal perjanjian tersebut, menyebabkan kepentingan mereka tidak terwakili dalam perundingan.'},
{n:10,uid:'sej-prk-26-10',form:'F4',topic:'F4 · Bab 5: Persekutuan Tanah Melayu 1948',
q:'Maklumat berikut merujuk kepada ciri-ciri sebuah perjanjian:<br><br>&#9632;&nbsp; Pesuruhjaya Tinggi British mengetuai pentadbiran<br>&#9632;&nbsp; Sultan-sultan mengesahkan rang undang-undang<br><br>Apakah perjanjian yang dimaksudkan?',
o:['Gagasan Malayan Union 1946','Persekutuan Tanah Melayu 1948','Persekutuan Tanah Melayu 1957','Pembentukan Malaysia 1963'],
a:1,
w:'Ciri-ciri tersebut merujuk kepada Persekutuan Tanah Melayu 1948 di mana Pesuruhjaya Tinggi British mengetuai pentadbiran manakala Sultan-sultan mempunyai peranan mengesahkan undang-undang dalam wilayah masing-masing.'},
{n:11,uid:'sej-prk-26-11',form:'F4',topic:'F4 · Bab 6: Ancaman Komunis dan Darurat',
q:'Komunis telah melancarkan pelbagai serangan yang merosakkan sektor ekonomi seperti ladang getah, lombong bijih timah dan landasan kereta api. Apakah tujuan serangan tersebut?',
o:['Miliknegarakan sektor perusahaan','Menyusun semula sistem pemilikan','Menentang amalan buruh paksa','Melemahkan imej kerajaan'],
a:3,
w:'Komunis merosakkan ladang getah, lombong dan kereta api bertujuan melemahkan imej kerajaan British di mata rakyat serta menggugat kepercayaan rakyat terhadap keupayaan British melindungi negara.'},
{n:12,uid:'sej-prk-26-12',form:'F4',topic:'F4 · Bab 6: Ancaman Komunis dan Darurat',
q:'Undang-Undang Darurat 1948 mengandungi pelbagai peruntukan untuk menangani ancaman komunis. Antara yang berikut, manakah yang benar?<br><br>I&nbsp;&nbsp;&nbsp; Menahan komunis tanpa perbicaraan<br>II&nbsp;&nbsp; Hukuman mati bagi membawa senjata api<br>III&nbsp; Mewajibkan penanaman makanan<br>IV&nbsp; Menghantar pulang imigran',
o:['I dan II','I dan IV','II dan III','III dan IV'],
a:0,
w:'Undang-Undang Darurat 1948 memperuntukkan kuasa menahan komunis tanpa perbicaraan (I) dan hukuman mati bagi sesiapa yang membawa senjata api secara haram (II) sebagai langkah membendung ancaman komunis.'},
{n:13,uid:'sej-prk-26-13',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
q:'<table style="border-collapse:collapse;margin:.5em 0"><tr><th style="border:1px solid #888;padding:4px 8px">Tahun</th><th style="border:1px solid #888;padding:4px 8px">Pertubuhan</th></tr><tr><td style="border:1px solid #888;padding:4px 8px">1938</td><td style="border:1px solid #888;padding:4px 8px">KMM</td></tr><tr><td style="border:1px solid #888;padding:4px 8px">1945</td><td style="border:1px solid #888;padding:4px 8px">PKMM</td></tr></table>Apakah persamaan matlamat antara kedua-dua pertubuhan di atas?',
o:['Memperjuangkan "Merdeka dengan Darah"','Merdeka melalui konsep Melayu Raya','Mengutamakan slogan Hidup Melayu','Menekankan idea "Tanah Melayu untuk Malayan"'],
a:1,
w:'KMM (1938) dan PKMM (1945) berkongsi matlamat yang sama iaitu memperjuangkan kemerdekaan melalui konsep Melayu Raya yang bertujuan menyatukan Tanah Melayu dengan Indonesia di bawah satu entiti politik.'},
{n:14,uid:'sej-prk-26-14',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
q:'Jawatan Kuasa Hubungan Antara Kaum yang ditubuhkan pada Januari 1948 berperanan penting dalam mengeratkan hubungan kaum. Antara yang berikut, manakah fungsinya?<br><br>I&nbsp;&nbsp;&nbsp; Mengukuhkan ekonomi negara<br>II&nbsp;&nbsp; Mewujudkan keharmonian kaum<br>III&nbsp; Mengkaji hubungan antara kaum<br>IV&nbsp; Menyelesaikan pergaduhan kaum',
o:['I dan II','I dan IV','II dan III','III dan IV'],
a:2,
w:'Jawatan Kuasa Hubungan Antara Kaum berfungsi untuk mewujudkan keharmonian kaum (II) dan mengkaji hubungan antara kaum (III) bagi mencapai perpaduan dalam kalangan masyarakat majmuk di Tanah Melayu.'},
{n:15,uid:'sej-prk-26-15',form:'F4',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
q:'Pilihan raya umum pertama Tanah Melayu pada tahun 1955 memberi impak besar terhadap perkembangan politik negara. Antara yang berikut, manakah kepentingannya?<br><br>I&nbsp;&nbsp;&nbsp; Mengawal kerakyatan orang asing<br>II&nbsp;&nbsp; Memperkukuh kerjasama rakyat<br>III&nbsp; Mempercepatkan proses kemerdekaan<br>IV&nbsp; Menghalang kemasukan imigran',
o:['I dan II','I dan IV','II dan III','III dan IV'],
a:2,
w:'PRU pertama 1955 berjaya memperkukuh kerjasama rakyat pelbagai kaum (II) dan mempercepatkan proses kemerdekaan (III) kerana keputusan Perikatan menunjukkan rakyat bersedia memerintah negara sendiri.'},
{n:16,uid:'sej-prk-26-16',form:'F4',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
q:'Apakah kepentingan pembentukan kabinet pertama Tanah Melayu selepas Pilihan Raya Umum 1955?',
o:['Menyekat pengaruh komunis','Memperkukuh kesetiaan rakyat','Membuktikan penyatuan parti politik','Memperjuangkan pentadbiran tempatan'],
a:3,
w:'Pembentukan kabinet pertama selepas PRU 1955 penting kerana ia membuktikan bahawa rakyat tempatan mampu menguruskan pentadbiran sendiri dan memperjuangkan pentadbiran tempatan sebelum mencapai kemerdekaan penuh.'},
{n:17,uid:'sej-prk-26-17',form:'F4',topic:'F4 · Bab 7: Usaha Ke Arah Kemerdekaan',
q:'Suruhanjaya Reid ditubuhkan untuk menggubal perlembagaan bagi Tanah Melayu yang merdeka. Apakah terma rujukan utama suruhanjaya ini?',
o:['Mengadakan satu bentuk kewarganegaraan','Mewujudkan sebuah kerajaan negeri yang kuat','Mengekalkan pemerintahan raja berkuasa mutlak','Mengukuhkan kedudukan rakyat pelbagai kaum'],
a:0,
w:'Suruhanjaya Reid diberi mandat untuk mengadakan satu bentuk kewarganegaraan bagi semua rakyat Tanah Melayu yang akan merdeka, bagi memastikan perpaduan dalam negara berbilang kaum.'},
{n:18,uid:'sej-prk-26-18',form:'F4',topic:'F4 · Bab 7: Usaha Ke Arah Kemerdekaan',
q:'Antara yang berikut, manakah isi kandungan Perjanjian Persekutuan Tanah Melayu 1957?<br><br>I&nbsp;&nbsp;&nbsp; Pegawai British menasihati raja dalam semua perkara<br>II&nbsp;&nbsp; Kedudukan istimewa orang Melayu diiktiraf<br>III&nbsp; Islam dijadikan agama Persekutuan<br>IV&nbsp; Sultan-sultan menjadi ahli majlis persekutuan',
o:['I dan II','I dan IV','II dan III','III dan IV'],
a:2,
w:'Perjanjian Persekutuan Tanah Melayu 1957 mengiktiraf kedudukan istimewa orang Melayu (II) dan menetapkan Islam sebagai agama Persekutuan (III) sebagai dua daripada peruntukan utamanya.'},
{n:19,uid:'sej-prk-26-19',form:'F4',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
q:'Antara yang berikut, manakah prinsip kedaulatan yang dipegang oleh Persekutuan Tanah Melayu apabila mencapai kemerdekaan?<br><br>I&nbsp;&nbsp;&nbsp; Mengamalkan sistem monarki<br>II&nbsp;&nbsp; Memiliki wilayah pengaruh<br>III&nbsp; Mempunyai lambang kebangsaan<br>IV&nbsp; Menjalin hubungan diplomatik',
o:['I dan II','I dan IV','II dan III','III dan IV'],
a:2,
w:'Prinsip kedaulatan PTM yang merdeka ialah memiliki wilayah pengaruh (II) dan mempunyai lambang kebangsaan (III) yang tersendiri sebagai tanda pengiktirafan negara yang berdaulat.'},
{n:20,uid:'sej-prk-26-20',form:'F4',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
q:'Kemerdekaan Tanah Melayu pada tahun 1957 dikagumi oleh dunia kerana diperoleh dengan cara yang unik. Antara yang berikut, manakah yang menerangkan keunikan tersebut?<br><br>I&nbsp;&nbsp;&nbsp; Tiada pertumpahan darah<br>II&nbsp;&nbsp; Melalui permuafakatan dan rundingan<br>III&nbsp; Perkembangan ekonomi berasaskan kerohanian<br>IV&nbsp; Penamatan dasar konfrontasi',
o:['I dan II','I dan IV','II dan III','III dan IV'],
a:0,
w:'Kemerdekaan Tanah Melayu dikagumi kerana diperoleh tanpa pertumpahan darah (I) melalui permuafakatan dan rundingan (II) antara pemimpin tempatan dengan pihak British, berbeza dengan kebanyakan negara lain yang merdeka melalui perjuangan bersenjata.'},
{n:21,uid:'sej-prk-26-21',form:'F5',topic:'F5 · Bab 1: Kedaulatan Negara',
q:'Apakah konsep kedaulatan dalam sistem pemerintahan tradisional?',
o:['Raja memiliki kuasa tertinggi','Perkongsian kuasa pemerintahan','Pengiktirafan oleh badan antarabangsa','Rakyat berhak menentukan pentadbiran'],
a:0,
w:'Dalam sistem pemerintahan tradisional, konsep kedaulatan bermakna raja memiliki kuasa tertinggi dan mutlak dalam semua aspek pemerintahan negara tanpa sebarang sekatan.'},
{n:22,uid:'sej-prk-26-22',form:'F5',topic:'F5 · Bab 1: Kedaulatan Negara',
q:'Rajah berikut menunjukkan elemen-elemen sebuah negara berdaulat:<br><table style="border-collapse:collapse;margin:.5em 0"><tr><td style="border:1px solid #888;padding:4px 10px">Pemerintah</td></tr><tr><td style="border:1px solid #888;padding:4px 10px">Rakyat</td></tr><tr><td style="border:1px solid #888;padding:4px 10px">Sempadan</td></tr><tr><td style="border:1px solid #888;padding:4px 10px">Negara Berdaulat</td></tr><tr><td style="border:1px solid #888;padding:4px 10px"><strong>X</strong></td></tr></table>Apakah X?',
o:['Keagamaan','Perundangan','Warisan budaya','Hubungan diplomatik'],
a:1,
w:'Elemen X yang melengkapkan konsep negara berdaulat ialah Perundangan kerana setiap negara berdaulat mesti mempunyai sistem undang-undang tersendiri untuk mengawal selia rakyat dan pentadbiran negara.'},
{n:23,uid:'sej-prk-26-23',form:'F5',topic:'F5 · Bab 2: Perlembagaan Persekutuan',
q:'Apakah tujuan penguatkuasaan Charter of Justice di Negeri-negeri Selat oleh pihak British?',
o:['Melicinkan pentadbiran','Mewujudkan kerjasama','Melindungi penduduk','Menjimatkan kewangan'],
a:2,
w:'Charter of Justice dikuatkuasakan di Negeri-negeri Selat bertujuan melindungi penduduk daripada kezaliman dan memastikan keadilan ditegakkan melalui sistem mahkamah yang teratur.'},
{n:24,uid:'sej-prk-26-24',form:'F5',topic:'F5 · Bab 2: Perlembagaan Persekutuan',
q:'Perlembagaan Persekutuan Tanah Melayu 1957 telah dipinda selepas pembentukan Malaysia pada tahun 1963. Apakah tujuan pindaan tersebut?',
o:['Memasukkan klausa baharu','Mengelakkan ancaman komunis','Membahagikan kerusi Parlimen','Mengukuhkan kuasa YDPA'],
a:0,
w:'Perlembagaan PTM 1957 dipinda selepas pembentukan Malaysia 1963 untuk memasukkan klausa baharu bagi mengambil kira kepentingan dan hak Sabah, Sarawak serta Singapura sebagai entiti baharu dalam persekutuan.'},
{n:25,uid:'sej-prk-26-25',form:'F5',topic:'F5 · Bab 3: Raja Berperlembagaan dan Demokrasi Berparlimen',
q:'Antara yang berikut, manakah merupakan kuasa eksekutif Yang di-Pertuan Agong?',
o:['Meminda perlembagaan','Melantik diplomat negara','Menentukan tarikh pilihan raya','Meluluskan undang-undang negeri'],
a:1,
w:'Kuasa eksekutif Yang di-Pertuan Agong termasuk melantik diplomat negara sebagai ketua negara yang mewakili Malaysia dalam perhubungan luar negara.'},
{n:26,uid:'sej-prk-26-26',form:'F5',topic:'F5 · Bab 3: Raja Berperlembagaan dan Demokrasi Berparlimen',
q:'Antara yang berikut, manakah perkara yang berkaitan dengan Sistem Demokrasi Berparlimen yang diamalkan di Malaysia?',
o:['Monarki berkuasa mutlak mengetuai pentadbiran','Rakyat terlibat dalam pemerintahan negara','Majlis Raja-Raja menggubal perlembagaan','Badan kehakiman meluluskan undang-undang'],
a:1,
w:'Dalam Sistem Demokrasi Berparlimen, rakyat terlibat dalam pemerintahan negara melalui penyertaan dalam pilihan raya untuk memilih wakil-wakil mereka di Parlimen.'},
{n:27,uid:'sej-prk-26-27',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
q:'Antara yang berikut, manakah kuasa tambahan dalam Senarai Negeri yang diberikan kepada Sarawak dan Sabah apabila menyertai Malaysia?',
o:['Pertahanan','Hak kewarganegaraan','Undang-undang Islam','Mahkamah Anak Negeri'],
a:3,
w:'Sabah dan Sarawak diberikan kuasa tambahan dalam Senarai Negeri termasuk Mahkamah Anak Negeri sebagai pengiktirafan terhadap sistem perundangan adat dan kepentingan peribumi yang unik di kedua-dua negeri tersebut.'},
{n:28,uid:'sej-prk-26-28',form:'F5',topic:'F5 · Bab 8: Membina Kemakmuran Negara',
q:'Apakah langkah yang diambil oleh kerajaan untuk memastikan golongan pertengahan dapat memiliki rumah sendiri?',
o:['Memperbanyak pembinaan rumah mampu milik','Menyekat pembinaan kawasan perumahan mewah','Menyediakan pinjaman perumahan tanpa faedah','Melarang warga asing membeli rumah di Malaysia'],
a:0,
w:'Kerajaan memperbanyak pembinaan rumah mampu milik untuk memastikan golongan berpendapatan sederhana dapat memiliki rumah sendiri dengan harga yang berpatutan.'},
{n:29,uid:'sej-prk-26-29',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
q:'Apakah idea yang dicadangkan sebelum pembentukan Malaysia bagi menggabungkan bekas tanah jajahan British di rantau ini?',
o:['Asia Timur Raya','Asia untuk Asia','Melayu Raya','Malai Baru'],
a:2,
w:'Gagasan Melayu Raya dicadangkan sebelum pembentukan Malaysia sebagai idea untuk menggabungkan bekas tanah jajahan British termasuk Tanah Melayu, Singapura, Sabah, Sarawak dan Brunei.'},
{n:30,uid:'sej-prk-26-30',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
q:'Antara pegawai British yang mencadangkan pembentukan Malaysia ialah Lord Brassey, Malcolm MacDonald dan Geofroy Tory. Antara yang berikut, manakah sebab cadangan mereka?<br><br>I&nbsp;&nbsp;&nbsp; Meredakan tekanan rakyat<br>II&nbsp;&nbsp; Memperkukuh kuasa British<br>III&nbsp; Memanfaatkan potensi ekonomi<br>IV&nbsp; Memperkasa keselamatan wilayah',
o:['I dan II','I dan IV','II dan III','III dan IV'],
a:3,
w:'Pegawai-pegawai British mencadangkan pembentukan Malaysia untuk memanfaatkan potensi ekonomi (III) wilayah-wilayah tersebut dan memperkasa keselamatan wilayah (IV) daripada ancaman komunis.'},
{n:31,uid:'sej-prk-26-31',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
q:'<table style="border-collapse:collapse;margin:.5em 0"><tr><th style="border:1px solid #888;padding:4px 8px">Tarikh</th><th style="border:1px solid #888;padding:4px 8px">Peristiwa</th></tr><tr><td style="border:1px solid #888;padding:4px 8px">30 September 1965</td><td style="border:1px solid #888;padding:4px 8px">Peralihan kuasa kepada Jeneral Suharto di Indonesia</td></tr></table>Apakah kesan peristiwa di atas terhadap Malaysia?',
o:['Perubahan sempadan negara','Pengaruh komunis meluas','Dasar konfrontasi tamat','Sistem beraja berakhir'],
a:2,
w:'Peralihan kuasa kepada Jeneral Suharto pada 30 September 1965 menyebabkan dasar konfrontasi Indonesia terhadap Malaysia tamat kerana Suharto tidak meneruskan dasar agresif Sukarno terhadap Malaysia.'},
{n:32,uid:'sej-prk-26-32',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
q:'Antara yang berikut, manakah cabaran dalaman yang dihadapi Malaysia sejurus selepas pembentukannya pada tahun 1963?<br><br>I&nbsp;&nbsp;&nbsp; Perpaduan kaum<br>II&nbsp;&nbsp; Pembangunan ekonomi<br>III&nbsp; Pemerintahan parti politik<br>IV&nbsp; Pemupukan semangat kenegerian',
o:['I dan II','I dan IV','II dan III','III dan IV'],

{n:7,uid:'sej-mrsm-26-07',form:'F4',topic:'F4 · Bab 4: Era Peralihan Kuasa British',

{n:8,uid:'sej-mrsm-26-08',form:'F4',topic:'F4 · Bab 4: Era Peralihan Kuasa British',

{n:9,uid:'sej-mrsm-26-09',form:'F4',topic:'F4 · Bab 4: Era Peralihan Kuasa British',

{n:19,uid:'sej-mrsm-26-19',form:'F4',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',

 q:'Maklumat berikut berkaitan hak asasi yang diamalkan dalam negara kita.<div style="border:1px solid #888;padding:8px 12px;margin:8px 0">Kebebasan asasi yang diperuntukkan dalam perlembagaan tidak bersifat mutlak, tetapi tertakluk kepada sekatan undang-undang.</div>Mengapakah kebebasan tersebut tidak bersifat mutlak?',

 a:1,w:'Kebebasan asasi dihadkan oleh undang-undang bagi menjamin ketenteraman awam, keselamatan negara dan hak orang lain, supaya kebebasan seseorang tidak menjejaskan kesejahteraan masyarakat.'},

{n:27,uid:'sej-mrsm-26-27',form:'F5',topic:'F5 · Bab 3: Raja Berperlembagaan dan Demokrasi Berparlimen',
 q:'Apakah fungsi Kerajaan Tempatan berdasarkan Akta Kerajaan Tempatan 1976?<br><br>I&nbsp;&nbsp;&nbsp; Menetapkan cuti umum<br>II&nbsp;&nbsp; Menguruskan dana awam<br>III&nbsp; Mengeluarkan lesen penjaja<br>IV&nbsp; Menyelenggara sistem saliran',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:3,w:'Kerajaan Tempatan di bawah Akta 171 (1976) berfungsi antara lain mengeluarkan lesen penjaja dan menyelenggara sistem saliran. Cuti umum ditetapkan oleh kerajaan Persekutuan/negeri, dan dana awam diurus pada peringkat kerajaan lebih tinggi.'},

{n:28,uid:'sej-mrsm-26-28',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Apakah faktor yang mengukuhkan sistem Persekutuan di negara kita?',
 o:['Komposisi penduduk','Kuasa budi bicara raja','Keluhuran perlembagaan','Konsep pengasingan kuasa'],
 a:2,w:'Keluhuran perlembagaan menetapkan pembahagian kuasa antara kerajaan Persekutuan dan negeri dalam undang-undang tertinggi negara, sekali gus mengukuhkan sistem Persekutuan. Pengasingan kuasa pula berkaitan eksekutif, perundangan dan kehakiman.'},

{n:29,uid:'sej-mrsm-26-29',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
 q:'Mengapakah Parti Rakyat Brunei pimpinan A.M. Azahari menentang cadangan pembentukan Malaysia?',
 o:['Mengekalkan keunikan etnik','Memperjuangkan tradisi budaya','Mengukuhkan pertahanan negara','Mempertahankan sumber kekayaan'],
 a:3,w:'Parti Rakyat Brunei menentang Malaysia kerana bimbang kekayaan hasil minyak Brunei akan dikongsi dengan negara lain dan mahukan Brunei bersatu dengan Sarawak dan Sabah di bawah Sultan Brunei.'},

{n:30,uid:'sej-mrsm-26-30',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
 q:'Apakah peranan Suruhanjaya Cobbold yang ditubuhkan pada tahun 1962?',
 o:['Menyediakan rangka perlembagaan','Menetapkan syarat kerakyatan','Meninjau reaksi penduduk','Memupuk aktiviti hebahan'],
 a:2,w:'Suruhanjaya Cobbold ditubuhkan untuk meninjau pandangan penduduk Sabah dan Sarawak terhadap cadangan pembentukan Malaysia. Penyediaan rangka perlembagaan ialah tugas Jawatankuasa Antara Kerajaan (IGC).'},

{n:31,uid:'sej-mrsm-26-31',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',
 q:'Maklumat berkaitan perjanjian yang ditandatangani antara Malaysia dan Thailand.<div style="border:1px solid #888;padding:8px 12px;margin:8px 0;display:inline-block">• Perjanjian Kerjasama Sempadan 1976<br>• Perjanjian Hat Yai 1989</div>Mengapakah perjanjian tersebut ditandatangani?',
 o:['Menjalankan misi kemanusiaan','Mengadakan latihan ketenteraan','Menghapuskan ancaman komunis','Membanteras pemerdagangan orang'],
 a:2,w:'Perjanjian Kerjasama Sempadan 1976 dan Perjanjian Hat Yai 1989 membolehkan Malaysia dan Thailand bekerjasama menghapuskan ancaman komunis di kawasan sempadan, sehingga Parti Komunis Malaya menamatkan perjuangan bersenjata pada 1989.'},

{n:32,uid:'sej-mrsm-26-32',form:'F5',topic:'F5 · Bab 8: Membina Kemakmuran Negara',
 q:'Maklumat berikut berkaitan isu pembangunan ekonomi dalam Rancangan Malaysia Pertama.<div style="border:1px solid #888;padding:8px 12px;margin:8px 0">• Kebergantungan kepada eksport getah dan bijih timah<br>• Kejatuhan harga bahan mentah</div>Apakah tindakan kerajaan bagi mengatasi isu tersebut?',
 o:['Mencari pasaran baharu','Memperkasa peranan koperasi','Memperkenalkan teknologi dron','Menetapkan kuota pengeluaran'],
 a:0,w:'Untuk mengurangkan kebergantungan kepada getah dan bijih timah serta kesan kejatuhan harga, kerajaan mencari pasaran baharu dan mempelbagaikan ekonomi. Teknologi dron tidak wujud dalam era Rancangan Malaysia Pertama.'},

{n:33,uid:'sej-mrsm-26-33',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Akta 32 digubal dibawah perkara 152 Perlembagaan Persekutuan Malaysia.<br>Apakah kepentingan akta tersebut?',
 o:['Melindungi kedudukan istimewa Bumiputera','Memartabat penggunaan bahasa Melayu','Memelihara ideologi Rukun Negara','Menjamin kuasa Mahkamah Atasan'],
 a:1,w:'Perkara 152 menetapkan Bahasa Melayu sebagai bahasa kebangsaan, dan Akta Bahasa Kebangsaan 1963/67 (Akta 32) memartabatkan penggunaannya dalam urusan rasmi. Kedudukan istimewa Bumiputera terletak di bawah Perkara 153.'},

{n:34,uid:'sej-mrsm-26-34',form:'F5',topic:'F5 · Bab 6: Cabaran Selepas Pembentukan Malaysia',
 q:'Maklumat berikut berkaitan penganjuran sukan di Malaysia.<div style="border:1px solid #888;padding:8px 12px;margin:8px 0;display:inline-block">• Majlis Sukan Universiti Malaysia (MASUM)<br>• Sukan Malaysia (SUKMA)</div>Mengapakah penganjuran sukan tersebut diadakan?',
 o:['Mengukuhkan perpaduan nasional','Membina kemudahan infrastruktur','Menggalakkan semangat kenegerian','Memperoleh penghormatan antarabangsa'],
 a:0,w:'Penganjuran sukan seperti MASUM dan SUKMA menghimpunkan atlet pelbagai kaum dan negeri, sekali gus mengukuhkan perpaduan nasional.'},

{n:35,uid:'sej-mrsm-26-35',form:'F5',topic:'F5 · Bab 8: Membina Kemakmuran Negara',
 q:'Tun Abdul Razak Hussein telah melancarkan Rancangan Buku Hijau pada 20 Disember 1974.<br><br>Mengapakah rancangan tersebut dilancarkan?',
 o:['Mengeluarkan bahan makanan','Menggalakkan pelaburan asing','Membangunkan industri kecil','Menyediakan prasarana desa'],
 a:0,w:'Rancangan Buku Hijau (Gerakan Buku Hijau) dilancarkan untuk meningkatkan pengeluaran bahan makanan negara, iaitu dengan menggalakkan rakyat bercucuk tanam dan mencapai sara diri makanan. Ia bukan program pembangunan prasarana desa seperti Rancangan Pembangunan Luar Bandar.'},

{n:36,uid:'sej-mrsm-26-36',form:'F5',topic:'F5 · Bab 8: Membina Kemakmuran Negara',
 q:'Graf berikut menunjukkan penurunan kadar kemiskinan di negara kita.<br>Sumber: Jabatan Perangkaan Negara<br><br>Apakah faktor penurunan tersebut?',
 img:'img/sejarah/e00a81a94179.webp',
 alt:'Carta bar dan garis Kadar Kemiskinan di Malaysia (1970-2000): 49.3% pada 1970, 17.1% pada 1990 dan 7.2% pada 2000.',
 o:['Peningkatan kadar kelahiran','Pertambahan peluang pekerjaan','Pergantungan kepada tenaga buruh asing','Pengasingan kaum mengikut fungsi ekonomi'],
 a:1,w:'Kadar kemiskinan turun daripada 49.3% (1970) kepada 7.2% (2000) terutamanya kerana pertambahan peluang pekerjaan hasil pembangunan ekonomi di bawah Dasar Ekonomi Baru dan dasar seterusnya. Pengasingan kaum mengikut fungsi ekonomi ialah masalah yang cuba dihapuskan.'},

{n:37,uid:'sej-mrsm-26-37',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',
 q:'Negara kita menjalinkan hubungan luar dengan pelbagai kerajaan sejak zaman Kesultanan Melayu Melaka.<br><br>Mengapakah hubungan luar tersebut perlu dipertahankan?',
 o:['Meluaskan wilayah pengaruh','Menjaga kepentingan peribumi','Memperkukuh kerjasama diplomatik','Memperjuangkan hak persamaan taraf'],
 a:2,w:'Hubungan luar perlu dipertahankan untuk memperkukuh kerjasama diplomatik dengan negara lain bagi manfaat politik, ekonomi dan keselamatan. Malaysia tidak bertujuan meluaskan wilayah pengaruh.'},

{n:38,uid:'sej-mrsm-26-38',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',
 q:'Gambar berikut berkaitan pertemuan Tun Abdul Razak Hussein dan pemimpin China pada tahun 1974.<br>Mengapakah pertemuan tersebut penting?',
 img:'img/sejarah/89283a35e4bf.webp',
 alt:'Foto hitam putih Tun Abdul Razak Hussein (kiri) duduk berbual dengan seorang pemimpin China (kanan) di atas kerusi sofa, dengan seorang wanita berdiri di belakang mereka',
 o:['Pelaksanaan misi pengaman','Pengamalan dasar berkecuali','Pengukuhan hubungan serantau','Pemeteraian perjanjian pertahanan'],
 a:1,w:'Lawatan Tun Razak ke China pada 1974 dan penubuhan hubungan diplomatik menunjukkan Malaysia mengamalkan dasar berkecuali, iaitu berhubung dengan negara dari blok yang berbeza tanpa memihak kepada mana-mana kuasa besar.'},

{n:39,uid:'sej-mrsm-26-39',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',
 q:'Peta berikut berkaitan dengan kerjasama pembangunan ekonomi segi tiga yang melibatkan negara anggota Persatuan Negara-negara Asia Tenggara (ASEAN).<br>Apakah kesan kerjasama tersebut terhadap negara terlibat?<br><br>I&nbsp;&nbsp;&nbsp; Memperoleh tarif cukai yang rendah<br>II&nbsp;&nbsp; Menetapkan harga pasaran komoditi<br>III&nbsp; Meningkatkan keuntungan bersama<br>IV&nbsp; Membendung campur tangan negara maju',
 img:'img/sejarah/980e5d50e420.webp',
 alt:'Segi tiga merangkumi Johor (Malaysia), Singapura dan Kepulauan Riau (Indonesia). Tajuk: Lingkungan kawasan SIJORI – GT',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:3,w:'Kerjasama segi tiga pertumbuhan SIJORI meningkatkan keuntungan bersama melalui perkongsian sumber dan pasaran, serta mengurangkan kebergantungan dan campur tangan negara maju. Penetapan harga komoditi dan tarif rendah tidak menjadi ciri utamanya.',

{n:40,uid:'sej-mrsm-26-40',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',
 q:'Maklumat berikut berkaitan tindakan Malaysia selepas menandatangani Perjanjian Zon Bebas Senjata Nuklear Asia Tenggara (SEANWFZ) pada tahun 1995.<div style="border:1px solid #888;padding:8px 12px;margin:8px 0">Malaysia tidak membenarkan kapal yang membawa senjata nuklear berlabuh atau mengadakan latihan di perairan negara kita.</div>Mengapakah tindakan tersebut diambil?',
 o:['Mengelakkan berlakunya konflik','Membasmi jenayah rentas sempadan','Mengatasi masalah pencemaran laut','Menerima desakan kuasa besar'],

{n:1,uid:'sej-sabk-26-01',form:'F4',topic:'F4 · Bab 1: Warisan Negara Bangsa',
 q:'Apakah kepentingan meminum air sumpah dalam kalangan rakyat kerajaan Srivijaya?',
 o:['Menjamin adat warisan','Menunjukkan taat setia','Mempertahankan pembesar','Mengawal undang-undang'],
 a:1,w:'Upacara meminum air sumpah di Srivijaya ialah ikrar taat setia rakyat dan pembesar kepada Maharaja; sesiapa yang menderhaka dipercayai akan ditimpa kutukan. Ia bukan untuk menjamin adat atau mengawal undang-undang.'},

{n:2,uid:'sej-sabk-26-02',form:'F4',topic:'F4 · Bab 1: Warisan Negara Bangsa',
 q:'Mengapakah waadat antara Sang Sapurba dengan Demang Lebar Daun dilakukan?',
 o:['Peristiwa Sungkit Berdarah','Perluasan kawasan taklukan','Pendirian golongan pemerintah','Perjanjian hubungan timbal balik'],
 a:3,w:'Waadat Sang Sapurba–Demang Lebar Daun ialah perjanjian hubungan timbal balik: rakyat taat setia kepada raja dan raja tidak boleh mengaibkan atau menghina rakyat. Ia mengikat kedua-dua pihak, bukan sekadar menubuhkan golongan pemerintah.'},

{n:3,uid:'sej-sabk-26-03',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Berikut adalah cukai yang dikenakan oleh British di Amerika pada abad ke-18.<div style="border:1px solid #888;padding:8px 12px;margin:8px 0">• Akta Pelayaran<br>• Akta Gula<br>• Akta Setem</div>Bagaimanakah tindakan rakyat Amerika terhadap British?',
 o:['Menentang cukai tanpa perwakilan','Menolak konsep raja berkuasa mutlak','Menggubal undang-undang baharu','Menggulingkan Raja Louis XVI'],
 a:0,w:'Rakyat di 13 buah tanah jajahan Amerika membantah cukai yang dikenakan tanpa perwakilan mereka dalam Parlimen British (&ldquo;no taxation without representation&rdquo;). Raja Louis XVI ialah raja Perancis, bukan British.'},

{n:4,uid:'sej-sabk-26-04',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Gerakan nasionalisme telah membuatkan rakyat menghasilkan novel, cerpen dan puisi. Apakah impak penulisan tersebut?',
 o:['Memperkuat angkatan tentera','Mengawal keamanan dalam negeri','Membangkitkan kesedaran kebangsaan','Menghapuskan sistem pemerintahan tradisional'],
 a:2,w:'Novel, cerpen dan puisi pada zaman nasionalisme menyedarkan masyarakat tentang nasib bangsa dan menyuburkan semangat kebangsaan. Karya sastera tidak memperkuat tentera atau menghapuskan sistem pemerintahan.'},

{n:5,uid:'sej-sabk-26-05',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Bagaimanakah golongan &ldquo;<em>the Strait born people</em>&rdquo; berusaha membentuk identiti tersendiri di Tanah Melayu?',
 o:['Mementingkan perpaduan kaum','Menamatkan hubungan diplomatik','Menggalakkan rakyat berniaga','Mengajar Bahasa Inggeris'],
 a:0,w:'Golongan <em>Straits-born</em> (kelahiran Negeri-negeri Selat) menekankan perpaduan dalam kalangan penduduk tempatan bagi membezakan diri daripada pendatang dan membentuk identiti sendiri mereka. Menurut skema, jawapannya ialah A.',
 note:'Soalan ini agak kabur; pilihan D (mengajar Bahasa Inggeris) juga boleh dipertimbangkan. Jawapan A diambil seperti dalam skema rasmi.'},

{n:6,uid:'sej-sabk-26-06',form:'F4',topic:'F4 · Bab 3: Konflik Dunia dan Pendudukan Jepun',
 q:'Jadual berikut berkaitan dengan pihak yang terlibat dalam Perang Dunia Pertama.<table style="border-collapse:collapse;margin:8px 0;width:auto"><tr><th style="border:1px solid #888;padding:4px 12px">Pakatan</th><th style="border:1px solid #888;padding:4px 12px">Negara Anggota</th></tr><tr><td style="border:1px solid #888;padding:4px 12px">Kuasa Tengah</td><td style="border:1px solid #888;padding:4px 12px">Jerman, Austria-Hungary, Uthmaniyah</td></tr><tr><td style="border:1px solid #888;padding:4px 12px">Pakatan Bertiga</td><td style="border:1px solid #888;padding:4px 12px">Britain, Perancis, Rusia, Serbia dan Portugal</td></tr></table>Apakah kesan tertubuhnya pakatan ketenteraan tersebut?',
 o:['Pengasingan kuasa pemerintah','Penghasilan senjata moden','Kemunculan negara baharu','Kegagalan Liga Bangsa-bangsa'],
 a:1,w:'Pembentukan pakatan ketenteraan mencetuskan perlumbaan senjata antara kuasa-kuasa Eropah sehingga pelbagai senjata moden dihasilkan. Kemunculan negara baharu dan kegagalan Liga Bangsa-bangsa berlaku selepas perang, bukan kesan terus pakatan.'},

{n:7,uid:'sej-sabk-26-07',form:'F4',topic:'F4 · Bab 3: Konflik Dunia dan Pendudukan Jepun',
 q:'Gambar menunjukkan akhbar Semangat Asia yang diterbitkan oleh Jepun di Tanah Melayu.<br>Apakah tujuan Jepun menerbitkan akhbar tersebut?',
 img:'img/sejarah/3102e607e91f.webp',
 alt:'Muka depan akhbar Semangat Asia — lukisan beberapa orang tentera dan penduduk tempatan berdiri memandang ke arah gunung dengan bendera berkibar di puncak',
 o:['Menyokong gerakan komunis','Mengukuhkan kuasa bangsawan','Menyekat akhbar penulis tempatan','Menyebar semangat antipenjajah Barat'],
 a:3,w:'Jepun menerbitkan akhbar seperti <em>Semangat Asia</em> untuk menyebarkan propaganda &ldquo;Asia untuk orang Asia&rdquo; dan semangat antipenjajah Barat bagi mendapatkan sokongan penduduk tempatan.'},

{n:8,uid:'sej-sabk-26-08',form:'F4',topic:'F4 · Bab 4: Era Peralihan Kuasa British',
 q:'Maklumat berikut berkaitan tugas Pentadbiran Tentera British di Tanah Melayu.<div style="border:1px solid #888;padding:8px 12px;margin:8px 0">• Mengembalikan kestabilan dan keamanan<br>• Memulihkan kepercayaan rakyat</div>Apakah cabaran dalam melaksanakan tugas tersebut?',
 o:['Kesukaran membawa masuk jentera','Kenaikan harga barangan mentah','Kemaraan tentera Jepun di utara','Kawalan Pesuruhjaya Tinggi British'],
 a:0,w:'Selepas perang, BMA menghadapi kesukaran memulihkan infrastruktur, perkhidmatan dan ekonomi kerana kekurangan dan kesukaran membawa masuk jentera dan peralatan. Tentera Jepun sudah menyerah kalah dan Pesuruhjaya Tinggi belum wujud pada masa itu.',
 note:'Pilihan B (kenaikan harga barangan mentah) juga kelihatan munasabah; jawapan A diambil seperti dalam skema rasmi.'},

{n:9,uid:'sej-sabk-26-09',form:'F4',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Gabungan PUTERA dan AMCJA membantah keputusan Jawatankuasa Kerja dalam memperkenalkan Perlembagaan Persekutuan pada tahun 1948.<br>Mengapakah mereka membantah perlembagaan tersebut?',
 o:['Kebebasan bersuara disekat','Perlembagaan tidak demokratik','Perhimpunan hartal tidak diluluskan','Fahaman politik yang berbeza'],
 a:1,w:'PUTERA-AMCJA menganggap Perlembagaan Persekutuan 1948 tidak demokratik kerana digubal tanpa melibatkan rakyat pelbagai kaum dan hanya berunding dengan British, UMNO dan raja-raja Melayu. Mereka kemudian mengemukakan Perlembagaan Rakyat sebagai tandingan.'},

{n:10,uid:'sej-sabk-26-10',form:'F4',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Maklumat berikut berkaitan permohonan kewarganegaraan dalam Perjanjian Persekutuan Tanah Melayu 1948.<div style="border:1px solid #888;padding:8px 12px;margin:8px 0">• Rakyat Raja<br>• Rakyat British</div>Bagaimanakah seseorang boleh menjadi warganegara tersebut?',
 o:['Secara pendaftaran','Kuat kuasa undang-undang','Bermastautin selama 20 tahun','Diperkenan oleh Majlis Raja-raja'],
 a:1,w:'Dalam Perjanjian Persekutuan 1948, Rakyat Raja dan Rakyat British menjadi warganegara secara kuat kuasa undang-undang (automatik). Orang lain perlu memohon melalui pendaftaran atau pemastautinan.'},

{n:11,uid:'sej-sabk-26-11',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Ideologi komunis dibawa masuk ke negara kita pada tahun 1920-an melalui China. Apakah pertubuhan yang membawa masuk ideologi tersebut?',
 o:['Parti Kuomintang','Parti Komunis Indonesia','The Communist International','Persatuan Orang Cina Peranakan'],
 a:0,w:'Menurut skema, ideologi komunis dari China dibawa ke Tanah Melayu melalui Parti Kuomintang yang berpengaruh dalam kalangan masyarakat Cina di sini pada tahun 1920-an. Parti Komunis Indonesia dan Comintern tidak datang melalui China.',
 note:'Soalan ini boleh dipertikaikan: Comintern (C) ialah badan antarabangsa yang menaja gerakan komunis, dan Parti Komunis China juga berperanan. Jawapan A diambil seperti dalam skema rasmi.'},

{n:12,uid:'sej-sabk-26-12',form:'F4',topic:'F4 · Bab 6: Ancaman Komunis dan Darurat',
 q:'Undang-undang Darurat telah dikuatkuasakan ke seluruh Tanah Melayu pada 18 Jun 1948. Mengapakah undang-undang tersebut dikuatkuasakan?',
 o:['Melakukan penjajahan baharu','Membanteras ancaman komunis','Menangkap kumpulan anti-British','Menghapuskan pengaruh Jepun'],
 a:1,w:'Undang-undang Darurat dikuatkuasakan selepas pembunuhan tiga pengurus ladang Eropah di Sungai Siput untuk membanteras keganasan dan ancaman Parti Komunis Malaya.'},

{n:13,uid:'sej-sabk-26-13',form:'F4',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
 q:'Maklumat berikut berkaitan langkah yang diambil dalam mencapai status berkerajaan sendiri pada Januari 1949.<div style="border:1px solid #888;padding:8px 12px;margin:8px 0;text-align:center">Menghimpunkan pemimpin utama<br>pelbagai kaum di Tanah Melayu.</div>Apakah peristiwa yang berkaitan dengan penyataan tersebut?',
 o:['Penubuhan Parti Kaum Malaya','Penubuhan Persatuan Tanah Melayu','Penubuhan Persatuan Hubungan Antara Kaum','Penubuhan Jawatankuasa Hubungan Antara Kaum'],
 a:3,w:'Jawatankuasa Hubungan Antara Kaum (CLC) ditubuhkan pada Januari 1949 atas usaha Dato\' Onn Jaafar untuk menghimpunkan pemimpin pelbagai kaum berunding bagi mencapai berkerajaan sendiri. Pilihan C hampir serupa tetapi nama yang betul ialah <em>Jawatankuasa</em>, bukan <em>Persatuan</em>.'},

{n:14,uid:'sej-sabk-26-14',form:'F4',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
 q:'Setiap ahli yang dilantik mendapat persetujuan Majlis Raja-Raja. Siapakah yang melantik &lsquo;Ahli&rsquo; dalam Sistem Ahli?',
 o:['Ketua Menteri','Gabenor Jeneral','Pesuruhjaya Tinggi British','Majlis Perundangan Persekutuan'],
 a:2,w:'Dalam Sistem Ahli (1951), Pesuruhjaya Tinggi British melantik ahli daripada pemimpin tempatan untuk mengetuai jabatan tertentu dengan persetujuan Majlis Raja-Raja. Ketua Menteri belum wujud pada masa itu.'},

{n:15,uid:'sej-sabk-26-15',form:'F4',topic:'F4 · Bab 8: Pilihan Raya',
 q:'Mengapakah Suruhanjaya Penentuan Sempadan Kawasan ditubuhkan?',
 o:['Meluluskan lambang parti calon','Mengendalikan kempen pilihan raya','Menjalankan pendaftaran parti politik','Menentukan kawasan pilihan raya'],
 a:3,w:'Suruhanjaya Penentuan Sempadan Kawasan ditubuhkan untuk menentukan sempadan kawasan pilihan raya (bilangan dan pembahagian kawasan) bagi pilihan raya. Kempen dan pendaftaran parti bukan tugasnya.'},

{n:16,uid:'sej-sabk-26-16',form:'F4',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
 q:'Bagaimanakah kuasa Pesuruhjaya Tinggi dikurangkan selepas terbentuknya kabinet pertama di Persekutuan Tanah Melayu 1955?',
 o:['Mengembalikan kuasa Raja-raja Melayu','Menguatkuasakan Parlimen Malaya','Membatalkan hak dan kuasa veto','Menggunakan model Westminster'],
 a:2,w:'Selepas kabinet pertama dibentuk pada 1955 di bawah Tunku Abdul Rahman, Pesuruhjaya Tinggi tidak lagi mempunyai hak dan kuasa veto ke atas keputusan Majlis Mesyuarat Perundangan, lalu kuasanya berkurang.'},

{n:17,uid:'sej-sabk-26-17',form:'F4',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Gambar berikut menunjukkan tokoh yang mengetuai Suruhanjaya Reid yang dibentuk pada 8 Mac 1956.<br>Apakah peranan beliau?',
 img:'img/sejarah/234796a2424a.webp',
 alt:'Potret hitam putih seorang lelaki tua berkaca mata bulat, berkot dan bertali leher; kapsyen: Lord Reid',
 o:['Mencadangkan tarikh kemerdekaan','Melantik pegawai pentadbiran baharu','Menganjurkan kongres kebangsaan','Merangka sebuah perlembagaan'],
 a:3,w:'Lord Reid mengetuai Suruhanjaya Reid yang ditugaskan merangka draf Perlembagaan Persekutuan Tanah Melayu merdeka. Tarikh kemerdekaan dipersetujui melalui rundingan di London pada 1956.'},

{n:18,uid:'sej-sabk-26-18',form:'F4',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Antara berikut, yang manakah kandungan Perjanjian Persekutuan Tanah Melayu 1957?<br><br>I&nbsp;&nbsp;&nbsp; Kedudukan Bahasa Melayu<br>II&nbsp;&nbsp; Pengamalan Raja Berperlembagaan<br>III&nbsp; Penguatkuasaan Mahkamah Atasan<br>IV&nbsp; Kedudukan adat istiadat orang Melayu',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:0,w:'Kandungan Perjanjian/Perlembagaan 1957 termasuk Bahasa Melayu sebagai bahasa kebangsaan dan sistem Raja Berperlembagaan. Pilihan III dan IV tidak dipilih dalam skema.',
 note:'Kenyataan IV (kedudukan adat istiadat orang Melayu) dan III juga berkaitan perlembagaan; soalan agak kabur. Jawapan A diambil seperti dalam skema rasmi.'},

{n:19,uid:'sej-sabk-26-19',form:'F4',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
 q:'Antara berikut, yang manakah peranan Jawatankuasa Persediaan Fizikal untuk menyambut pemasyhuran kemerdekaan negara?<br><br>I&nbsp;&nbsp;&nbsp; Menyediakan baju muskat<br>II&nbsp;&nbsp; Membina stadium<br>III&nbsp; Mencipta bendera<br>IV&nbsp; Menganjurkan kursus',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:2,w:'Jawatankuasa Persediaan Fizikal bertanggungjawab ke atas persiapan fizikal seperti membina Stadium Merdeka dan mencipta bendera kebangsaan. Baju muskat dan kursus bukan tugas jawatankuasa ini.'},

{n:20,uid:'sej-sabk-26-20',form:'F4',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
 q:'Maklumat berikut menunjukkan lambang kebangsaan yang dibentuk dalam menuju sebuah negara yang merdeka.<div style="border:1px solid #888;padding:8px 12px;margin:8px 0">• Jata negara<br>• Lagu Negaraku<br>• Bendera kebangsaan</div>Apakah kesan daripada wujudnya lambang tersebut?',
 o:['Memajukan ekonomi','Mempunyai kerajaan','Menjadi simbol perpaduan','Mempunyai wilayah pengaruh'],
 a:2,w:'Jata negara, Lagu Negaraku dan bendera kebangsaan ialah lambang kedaulatan yang menjadi simbol perpaduan dan identiti seluruh rakyat. Lambang tidak secara langsung memajukan ekonomi atau memberi wilayah pengaruh.'},

/* ── TINGKATAN 5 ─────────────────────────────────────── */

{n:21,uid:'sej-sabk-26-21',form:'F5',topic:'F5 · Bab 1: Kedaulatan Negara',
 q:'Kedaulatan sesebuah negara berkait rapat dengan kebebasan dan kemerdekaan. Apakah ciri-ciri yang menunjukkan sesebuah negara itu berdaulat?<br><br>I&nbsp;&nbsp;&nbsp; Mempunyai sempadan<br>II&nbsp;&nbsp; Mempunyai kebebasan<br>III&nbsp; Mempunyai pembangunan<br>IV&nbsp; Mempunyai pemerintahan',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:1,w:'Ciri asas negara berdaulat ialah mempunyai sempadan (wilayah), rakyat, pemerintahan dan kedaulatan. Pembangunan ialah matlamat negara, bukan ciri kedaulatan.'},

{n:22,uid:'sej-sabk-26-22',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',
 q:'Penggubalan dasar luar Malaysia membawa pelbagai kepentingan kepada negara. Apakah kepentingan tersebut?<br><br>I&nbsp;&nbsp;&nbsp; Meningkatkan taraf hidup<br>II&nbsp;&nbsp; Memupuk semangat perpaduan<br>III&nbsp; Menjalinkan hubungan diplomatik<br>IV&nbsp; Mempertahankan kedaulatan negara',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:3,w:'Dasar luar Malaysia penting untuk menjalinkan hubungan diplomatik dengan negara lain dan mempertahankan kedaulatan serta kepentingan negara. Meningkatkan taraf hidup dan memupuk perpaduan ialah matlamat dasar dalam negeri.'},

{n:23,uid:'sej-sabk-26-23',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Mengapakah Yang di-Pertuan Agong bertanggungjawab melindungi kedudukan istimewa orang Melayu, bumiputera Sabah dan Sarawak serta menjaga kepentingan sah kaum lain?',
 o:['Menjamin kestabilan politik','Meningkatkan ekonomi setempat','Melicinkan urusan pentadbiran negara','Mengukuhkan perpaduan antara kaum'],
 a:3,w:'Di bawah Perkara 153, Yang di-Pertuan Agong menjaga kedudukan istimewa orang Melayu dan bumiputera sambil melindungi kepentingan sah kaum lain bagi mewujudkan keseimbangan dan mengukuhkan perpaduan antara kaum.'},

{n:24,uid:'sej-sabk-26-24',form:'F5',topic:'F5 · Bab 3: Raja Berperlembagaan dan Demokrasi Berparlimen',
 q:'Bagaimanakah peranan Yang di-Pertua Negeri Sabah menjalankan tanggungjawabnya dalam pentadbiran negeri?',
 o:['Menjadi ketua agama Islam','Merangka perbelanjaan negeri','Mengikut nasihat Kabinet Negeri','Meringankan hukuman kes tertentu'],
 a:2,w:'Yang di-Pertua Negeri bertindak mengikut nasihat Kabinet (Majlis Mesyuarat) Negeri dalam pentadbiran negeri. Ketua agama Islam di Sabah ialah Yang di-Pertuan Agong, dan perbelanjaan negeri dirangka oleh kerajaan negeri.'},

{n:25,uid:'sej-sabk-26-25',form:'F5',topic:'F5 · Bab 1: Kedaulatan Negara',
 q:'Gambar berikut ialah cap Mohor Besar Raja-Raja.<br>Apakah kepentingan cap mohor tersebut?',
 img:'img/sejarah/a1d21bc9edde.webp',
 alt:'Cap Mohor Besar Raja-Raja — bulatan dengan tulisan Jawi di tengah dikelilingi lambang negeri-negeri Melayu',
 o:['Simbol ketua agama Islam','Rakyat terlibat dalam pemerintahan','Mengesahkan kerajaan pilihan rakyat','Lambang kedaulatan Raja-raja Melayu'],
 a:3,w:'Mohor Besar Raja-Raja dipegang oleh Penyimpan Mohor Besar Raja-Raja dan digunakan pada dokumen rasmi Majlis Raja-Raja sebagai lambang kedaulatan Raja-raja Melayu.'},

{n:26,uid:'sej-sabk-26-26',form:'F5',topic:'F5 · Bab 3: Raja Berperlembagaan dan Demokrasi Berparlimen',
 q:'Maklumat berikut menunjukkan peranan Yang di-Pertuan Agong dalam bidang kuasa perundangan.<table style="border-collapse:collapse;margin:8px 0;width:auto"><tr><th style="border:1px solid #888;padding:4px 12px">Peranan</th><th style="border:1px solid #888;padding:4px 12px">Negeri</th></tr><tr><td style="border:1px solid #888;padding:4px 12px;text-align:center"><strong>X</strong></td><td style="border:1px solid #888;padding:4px 12px">Pulau Pinang, Melaka, Sarawak, Sabah dan Wilayah Persekutuan</td></tr></table>Apakah <strong>X</strong>?',
 o:['Ketua Agama Islam','Ketua pasukan polis','Melantik jawatan penting','Mengawal perbelanjaan kerajaan'],
 a:0,w:'Bagi negeri tanpa Raja (Pulau Pinang, Melaka, Sabah, Sarawak) dan Wilayah Persekutuan, Yang di-Pertuan Agong ialah Ketua Agama Islam.'},

{n:27,uid:'sej-sabk-26-27',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Maklumat berikut berkaitan Senarai Persekutuan.<div style="border:1px solid #888;padding:8px 12px;margin:8px 0">• Pertahanan<br>• Kewarganegaraan<br>• X<br>• Y</div>Apakah X dan Y?<br><br>I&nbsp;&nbsp;&nbsp; Kerajaan tempatan<br>II&nbsp;&nbsp; Hal ehwal luar negeri<br>III&nbsp; Pentadbiran keadilan<br>IV&nbsp; Undang-undang adat',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:2,w:'Senarai Persekutuan meliputi hal ehwal luar negeri, pertahanan, kewarganegaraan dan pentadbiran keadilan. Kerajaan tempatan dan undang-undang adat termasuk dalam Senarai Negeri.'},

{n:28,uid:'sej-sabk-26-28',form:'F5',topic:'F5 · Bab 8: Membina Kemakmuran Negara',
 q:'Maklumat berikut berkaitan kerjasama pembangunan sosioekonomi antara Kerajaan Persekutuan dengan Kerajaan Negeri.<div style="border:1px solid #888;padding:8px 12px;margin:8px 0">• FELDA<br>• FELCRA</div>Apakah ciri persamaan bagi kedua-dua agensi tersebut?',
 o:['Membangunkan tanah','Meluaskan wilayah','Membuat perumahan','Menggalakkan perniagaan'],
 a:0,w:'FELDA dan FELCRA sama-sama membangunkan tanah (pertanian) untuk meningkatkan taraf hidup penduduk luar bandar. Meluaskan wilayah dan menggalakkan perniagaan bukan fungsi utama kedua-duanya.'},

{n:29,uid:'sej-sabk-26-29',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
 q:'Mengapakah British merancang penyatuan wilayah jajahannya di kawasan Asia Tenggara?<br><br>I&nbsp;&nbsp;&nbsp; Perpaduan kaum diwujudkan<br>II&nbsp;&nbsp; Penguasaan dalam ekonomi<br>III&nbsp; Melicinkan pentadbiran negara<br>IV&nbsp; Mendapatkan kemerdekaan wilayah',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:2,w:'British ingin menyatukan wilayah jajahannya (Tanah Melayu, Singapura, Borneo Utara, Sarawak, Brunei) untuk mengukuhkan penguasaan ekonomi dan melicinkan pentadbiran. Kemerdekaan wilayah bukan matlamat British.'},

{n:30,uid:'sej-sabk-26-30',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
 q:'Apakah kelebihan kuasa yang diberi kepada Sarawak dan Sabah mengikut peruntukan Perlembagaan Malaysia?',
 o:['Membina pusat pertahanan','Menetapkan hubungan luar','Menubuhkan kabinet negeri','Meluluskan belanjawan negeri'],
 a:2,w:'Menurut skema, Sabah dan Sarawak diberi kuasa menubuhkan kabinet negeri mereka sendiri. Pertahanan dan hubungan luar ialah bidang kuasa Persekutuan.',
 note:'Soalan ini boleh dipertikaikan: semua negeri mempunyai kabinet (exco) negeri dan belanjawan negeri; kelebihan khas Sabah/Sarawak ialah kawalan imigresen dan lain-lain. Jawapan C diambil seperti dalam skema rasmi.'},

{n:31,uid:'sej-sabk-26-31',form:'F5',topic:'F5 · Bab 7: Membina Kesejahteraan Negara',
 q:'Mengapakah negara kita berdepan dengan pelbagai cabaran dari dalam negara selepas Malaysia dibentuk?',
 o:['Campur tangan kuasa barat','Ancaman peperangan luar negara','Kepelbagaian latar belakang kaum','Sistem perundangan negara lemah'],
 a:2,w:'Kepelbagaian latar belakang kaum, agama dan budaya menimbulkan cabaran perpaduan dan perselisihan dalam negara selepas pembentukan Malaysia. Cabaran ini datang dari dalam negara, bukan dari luar.'},

{n:32,uid:'sej-sabk-26-32',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
 q:'Senarai berikut berkaitan dengan pertubuhan-pertubuhan yang terdapat di Sarawak yang menentang gagasan Malaysia.<div style="border:1px solid #888;padding:8px 12px;margin:8px 0">• Pasukan Gerila Rakyat Sarawak (PGRS)<br>• Parti Komunis Kalimantan Utara (PKKU)<br>• Pasukan Rakyat Kalimantan Utara (PARAKU)</div>Apakah persamaan perjuangan pertubuhan tersebut?',
 o:['Menubuhkan Barisan Bersatu','Membentuk republik komunis','Menaikkan semangat rakyat','Menangani krisis politik'],
 a:1,w:'PGRS, PKKU dan PARAKU ialah pertubuhan berhaluan komunis yang menentang gagasan Malaysia dan bercita-cita menubuhkan sebuah republik komunis di Borneo.'},

{n:33,uid:'sej-sabk-26-33',form:'F5',topic:'F5 · Bab 6: Cabaran Selepas Pembentukan Malaysia',
 q:'Bagaimanakah kerajaan memupuk semangat perpaduan dalam kalangan masyarakat pelbagai kaum?',
 o:['Mengutamakan sentimen perkauman','Menggalakkan penglibatan dalam sukan','Meningkatkan tahap keselamatan negara','Mewujudkan pembangunan ekonomi sahaja'],
 a:1,w:'Sukan menyatukan rakyat pelbagai kaum untuk berinteraksi dan menyokong pasukan negara, justeru memupuk perpaduan. Sentimen perkauman melemahkan perpaduan, dan pembangunan ekonomi sahaja tidak mencukupi.'},

{n:34,uid:'sej-sabk-26-34',form:'F5',topic:'F5 · Bab 6: Cabaran Selepas Pembentukan Malaysia',
 q:'Matlamat pembentukan Rukun Negara adalah melahirkan masyarakat yang liberal. Apakah ciri-ciri masyarakat tersebut?',
 o:['Bebas mengamalkan adat resam','Undang-undang negara dipatuhi','Penciptaan inovasi dan produk','Menjamin gaya hidup bebas'],
 a:0,w:'Matlamat &ldquo;sikap liberal terhadap kepelbagaian budaya&rdquo; dalam Rukun Negara bermaksud rakyat bebas mengamalkan adat resam dan budaya masing-masing. Pilihan D (gaya hidup bebas) tidak sama dengan liberal yang dimaksudkan di sini.'},

{n:35,uid:'sej-sabk-26-35',form:'F5',topic:'F5 · Bab 8: Membina Kemakmuran Negara',
 q:'Strategi serampang dua mata digunakan dalam Dasar Ekonomi Baru (DEB). Apakah matlamat strategi tersebut?',
 o:['Mewujudkan perlembagaan Persekutuan','Mengembangkan sistem persekolahan','Melicinkan pentadbiran negara','Mencapai kesejahteraan kaum'],
 a:3,w:'Serampang dua mata DEB ialah membasmi kemiskinan tanpa mengira kaum dan menyusun semula masyarakat bagi menghapuskan pengenalan kaum mengikut fungsi ekonomi, demi mencapai perpaduan dan kesejahteraan semua kaum.'},

{n:36,uid:'sej-sabk-26-36',form:'F5',topic:'F5 · Bab 10: Kecemerlangan Malaysia di Persada Dunia',
 q:'Mengapakah universiti awam dan swasta memberi penekanan kepada bidang sains, teknologi dan teknikal sejak abad ke-21?',
 o:['Perkembangan bidang perindustrian','Pembentukan kelas pertengahan','Peningkatan jumlah penduduk','Pengukuhan perpaduan kaum'],
 a:0,w:'Perkembangan bidang perindustrian dan ekonomi berasaskan teknologi memerlukan tenaga kerja mahir dalam sains, teknologi dan teknikal; sebab itu institusi pengajian tinggi memberi penekanan kepada bidang tersebut.'},

{n:37,uid:'sej-sabk-26-37',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',
 q:'Maklumat berikut berkaitan dengan faktor yang mempengaruhi asas penggubalan dasar luar Malaysia.<div style="border:1px solid #888;padding:8px 12px;margin:8px 0">• Ikatan Sejarah<br>• Kepimpinan<br>• Persekitaran Luar<br>• X</div>Apakah X?',
 o:['Kepentingan kedaulatan negara','Keperluan barisan ketenteraan','Pendirian pertubuhan serantau','Pengaruh kuasa-kuasa besar'],
 a:0,w:'Faktor yang mempengaruhi asas dasar luar Malaysia ialah ikatan sejarah, kepimpinan, persekitaran luar dan kepentingan kedaulatan negara. Pilihan lain ialah kesan atau pertimbangan sampingan, bukan faktor asas.'},

{n:38,uid:'sej-sabk-26-38',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',
 q:'Maklumat berikut merupakan komitmen Malaysia dalam pertubuhan antarabangsa.<div style="border:1px solid #888;padding:8px 12px;margin:8px 0;text-align:center">Mendukung Piagam PBB</div>Mengapakah Malaysia memberi komitmen tersebut?',
 o:['Menegakkan hak asasi manusia','Membezakan kaum dan jantina','Menarik golongan pendatang','Membenarkan serangan bersenjata'],
 a:0,w:'Piagam PBB menekankan keamanan, keadilan dan hak asasi manusia; Malaysia mendukungnya untuk menegakkan hak asasi manusia. Piagam itu menolak diskriminasi dan serangan bersenjata.'},

{n:39,uid:'sej-sabk-26-39',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',
 q:'Gambar menunjukkan NGO yang terlibat dalam misi kemanusiaan.<br>Apakah bantuan yang diberikan oleh pertubuhan tersebut?',
 img:'img/sejarah/f181c718f046.webp',
 alt:'Logo bunga raya bersama tulisan “mercy MALAYSIA”',
 o:['Membangunkan rumah anak yatim Babun Najah','Membina pusat kesihatan dan perubatan di Aceh','Melancarkan kempen pendidikan pelarian Syria','Menyalurkan sumbangan orang ramai kepada Palestin'],
 a:1,w:'MERCY Malaysia ialah NGO perubatan dan kemanusiaan yang antara lainnya membina pusat kesihatan dan perubatan di Aceh selepas tsunami 2004. Pilihan lain dikaitkan dengan pertubuhan kemanusiaan lain.'},

{n:40,uid:'sej-sabk-26-40',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',
 q:'Mengapakah Malaysia berpendapat bahawa penerokaan di Antartika dijalankan secara tidak adil?',
 o:['Diterokai secara bebas dan haram','Dijalankan penyelidikan tanpa sekatan','Dikunjungi tanpa mengikut garis panduan','Didominasi oleh sebahagian kecil negara'],
 a:3,w:'Malaysia berpendapat Antartika, sebagai warisan sejagat manusia, tidak adil jika penerokaannya didominasi oleh sebilangan kecil negara maju; ia patut dimanfaatkan secara saksama oleh semua negara.'}
