{n:1,uid:'spmu2023-sej-01',form:'F4',topic:'F4 · Bab 1: Warisan Negara Bangsa',
 q:'Antara yang berikut, kerajaan manakah mengamalkan Sistem Empat Lipatan dalam pentadbiran?',
 o:['Funan','Srivijaya','Majapahit','Melaka'],
 a:3,
 w:'Sistem Pembesar Empat Lipatan (Bendahara, Penghulu Bendahari, Temenggung, Laksamana) diamalkan oleh Kerajaan Kesultanan Melayu Melaka. Sistem ini membahagikan tanggungjawab pentadbiran kepada empat pembesar utama yang membantu sultan memerintah.'},

{n:2,uid:'spmu2023-sej-02',form:'F4',topic:'F4 · Bab 1: Warisan Negara Bangsa',
 q:'Undang-undang berikut diamalkan di Negeri-negeri Melayu sebelum kedatangan British.<ul style="margin:8px 0 0 18px"><li>Hukum Kanun Pahang</li><li>Undang-undang 99 Perak</li></ul>Apakah persamaan undang-undang tersebut?<br>I Undang-undang bertulis<br>II Melindungi pembesar<br>III Diwarisi secara lisan<br>IV Dipengaruhi Undang-undang Adat',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:1,
 w:'Persamaan Hukum Kanun Pahang dan Undang-undang 99 Perak ialah kedua-duanya merupakan undang-undang bertulis (I) dan dipengaruhi oleh Undang-undang Adat Melayu (IV). Kedua-duanya juga dipengaruhi oleh unsur Islam dan adat Melayu tempatan.'},

{n:3,uid:'spmu2023-sej-03',form:'F4',topic:'F4 · Bab 1: Warisan Negara Bangsa',
 q:'Pernyataan berikut merujuk kepada maksud tulah.<br><div style="border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:10px 0;background:var(--panel2);font-size:.9rem">Kecelakaan yang menimpa seseorang</div>Apakah sebab seseorang ditimpa tulah?',
 o:['Menipu dalam perniagaan','Melakukan pembunuhan','Menderhaka kepada raja','Melanggar arahan pembesar'],
 a:2,
 w:'Seseorang ditimpa tulah kerana menderhaka kepada raja. Dalam kepercayaan Melayu tradisional, raja mempunyai daulat yang sakti dan sesiapa yang menderhaka atau melanggar pantang larang berkaitan raja akan ditimpa kecelakaan atau tulah.'},

{n:4,uid:'spmu2023-sej-04',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Apakah faktor yang mencetuskan Perang Dunia Pertama di Eropah pada tahun 1914 hingga tahun 1918?',
 o:['Kegagalan Liga Bangsa-Bangsa mengekalkan keamanan','Jerman memperbesarkan angkatan tentera','Kemunculan ideologi baharu','Persaingan kuasa imperialis'],
 a:3,
 w:'Faktor utama yang mencetuskan Perang Dunia Pertama ialah persaingan antara kuasa-kuasa imperialis Eropah untuk mendapatkan tanah jajahan dan kawasan pengaruh. Persaingan ini menimbulkan ketegangan yang akhirnya menyebabkan pecahnya perang.'},

{n:5,uid:'spmu2023-sej-05',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Antara yang berikut, faktor manakah telah menyemarakkan kemunculan pergerakan nasionalisme di negara kita?',
 o:['Bantuan negara luar','Kegiatan ekonomi pelbagai','Galakan daripada kerajaan','Kemunculan golongan intelek'],
 a:3,
 w:'Kemunculan golongan intelektual (berpendidikan tinggi) menjadi faktor utama menyemarakkan nasionalisme di Tanah Melayu. Golongan ini terdedah kepada idea-idea kebebasan dan nasionalisme, lalu menjadi pemangkin kesedaran politik dalam kalangan rakyat.'},

{n:6,uid:'spmu2023-sej-06',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Apakah syarat Perjanjian Versailles 1919 yang diingkari oleh Jerman?',
 o:['Memperkuatkan angkatan tentera','Menjalin kerjasama dengan Rusia','Menamatkan hubungan diplomatik','Mengeksport senjata ke luar negara'],
 a:0,
 w:'Jerman mengingkari syarat Perjanjian Versailles 1919 dengan memperkuatkan angkatan tenteranya. Perjanjian itu menghadkan kekuatan tentera Jerman, tetapi Hitler secara terang-terangan melanggar syarat ini dengan membina semula kekuatan ketenteraan Jerman.'},

{n:7,uid:'spmu2023-sej-07',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Pakatan kuasa berikut ditubuhkan di Eropah pada awal abad ke-20.<ul style="margin:8px 0 0 18px"><li>Pakatan Bertiga</li><li>Kuasa Tengah</li></ul>Apakah faktor pencetus peperangan antara pakatan kuasa tersebut?<br>I Perjuangan untuk mengekalkan kemerdekaan<br>II Perlumbaan untuk memperluaskan kawasan pengaruh<br>III Persaingan untuk menguasai sumber bahan mentah<br>IV Percubaan untuk mewujudkan pertubuhan antarabangsa',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:2,
 w:'Faktor pencetus peperangan ialah perlumbaan memperluaskan kawasan pengaruh (imperialisme) (II) dan persaingan untuk menguasai sumber bahan mentah yang diperlukan untuk memajukan ekonomi dan ketenteraan masing-masing (III).'},

{n:8,uid:'spmu2023-sej-08',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Berikut adalah kesan Perang Dunia Pertama ke atas Jerman.<ul style="margin:8px 0 0 18px"><li>Kehilangan tanah jajahan</li><li>Bayaran pampasan yang tinggi</li></ul>Apakah tindakan Jerman untuk mengatasi kesan tersebut?',
 o:['Mendapatkan sokongan rakyat','Memperbesarkan angkatan tentera','Mengukuhkan kedudukan ekonomi','Menggabungkan wilayah-wilayah kecil'],
 a:1,
 w:'Jerman mengatasi kesan memalukan Perjanjian Versailles dengan memperbesarkan angkatan tentera di bawah pimpinan Hitler. Penguatan semula tentera Jerman bertujuan mendapatkan semula tanah jajahan yang hilang dan memulihkan maruah negara.'},

{n:9,uid:'spmu2023-sej-09',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Mengapakah Jepun menyerang Pearl Harbour pada tahun 1941?',
 o:['Memperjuangkan hak penduduk asal','Menghalang kemaraan kuasa Barat','Mengekalkan kemerdekaan tanah air','Menyekat kebangkitan anti-penjajah'],
 a:1,
 w:'Jepun menyerang Pearl Harbour pada 7 Disember 1941 untuk menghalang kemaraan kuasa Barat, khususnya Amerika Syarikat, yang mengancam peluasan kuasa Jepun di Asia Pasifik melalui sekatan ekonomi dan embargo minyak.'},

{n:10,uid:'spmu2023-sej-10',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Antara yang berikut, manakah kezaliman yang dilakukan oleh Jepun terhadap penduduk negara kita?<br>I Membina landasan Keretapi Maut<br>II Merosakkan bangunan sekolah<br>III Memusnahkan kawasan hutan<br>IV Melaksanakan catuan makanan',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:1,
 w:'Kezaliman Jepun terhadap penduduk Tanah Melayu termasuk memaksa mereka membina landasan Keretapi Maut (Death Railway) dalam keadaan menyeksakan (I) dan melaksanakan sistem catuan makanan yang menyebabkan kebuluran (IV).'},

{n:11,uid:'spmu2023-sej-11',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Persidangan Raja-raja Melayu pada bulan April 1946 telah membantah Malayan Union melalui Mahkamah Tinggi di England. Apakah kandungan Malayan Union sehingga Raja-raja Melayu bertindak demikian?',
 o:['Menghalang pemerintahan tentera','Mempertahankan sistem kesatuan','Mempertahankan pemerintahan penjajah','Menghalang perkongsian kuasa'],
 a:3,
 w:'Raja-Raja Melayu membantah Malayan Union kerana ia menghalang perkongsian kuasa antara raja dengan kerajaan. Malayan Union melucutkan hampir semua kuasa Raja-Raja Melayu dan menyerahkannya kepada Gabenor British, menjadikan raja hanya lambang.'},

{n:12,uid:'spmu2023-sej-12',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Maklumat berikut berkaitan dengan pemimpin Rukun 13 di Sarawak.<ul style="margin:8px 0 0 18px"><li>Morshidi Sidek</li><li>Bujang Suntong</li><li>Awang Rambli</li></ul>Apakah matlamat kumpulan tersebut?',
 o:['Menghapuskan pegawai tinggi British','Menolak Perlembagaan Rakyat','Memelihara hak peribumi','Menuntut kemerdekaan'],
 a:3,
 w:'Rukun 13 di Sarawak yang diketuai Morshidi Sidek dan rakan-rakannya bertujuan menuntut kemerdekaan Sarawak. Kumpulan nasionalis ini menentang penyerahan Sarawak kepada British dan mahukan Sarawak merdeka daripada sebarang bentuk penjajahan.'},

{n:13,uid:'spmu2023-sej-13',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Mengapakah British mengambil alih Sabah daripada Syarikat Borneo Utara British?<br>I Mendapatkan bahan mentah<br>II Memenuhi tuntutan rakyat<br>III Melaksanakan dasar dekolonisasi<br>IV Menggantikan tanah jajahan',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:2,
 w:'British mengambil alih Sabah daripada SBUB kerana ingin memenuhi tuntutan rakyat Sabah untuk mendapat pemerintahan yang lebih baik (II) dan melaksanakan dasar dekolonisasi yang merancang memberi pemerintahan sendiri kepada wilayah-wilayah jajahan (III).'},

{n:14,uid:'spmu2023-sej-14',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Bandar Sandakan musnah teruk selepas dibom tentera Jepun pada tahun 1945. Apakah yang berlaku ke atas Sabah ekoran peristiwa tersebut?',
 o:['Pentadbiran SBUB kekal','Sabah menuntut kemerdekaan mutlak','SBUB menguasai sumber ekonomi Sabah','Sabah diserahkan kepada British'],
 a:3,
 w:'Selepas kemusnahan Sandakan akibat pengeboman Jepun, SBUB yang kehabisan dana tidak mampu membangunkan semula Sabah. Akibatnya, SBUB menyerahkan Sabah kepada kerajaan British pada tahun 1946 atas sebab kewangan dan pentadbiran.'},

{n:15,uid:'spmu2023-sej-15',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Berikut adalah petikan daripada Piagam Atlantik.<br><div style="border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:10px 0;background:var(--panel2);font-size:.9rem">…menghormati hak setiap manusia untuk memilih bentuk kerajaan sendiri dan mahukan hak kedaulatan dan kerajaan sendiri dipulihkan kepada mereka…</div>Apakah yang dimaksudkan oleh petikan tersebut?',
 o:['Melaksanakan sistem pengagihan kuasa','Melonggarkan syarat memohon kerakyatan','Mengurangkan bidang kuasa Majlis Raja-raja','Memerdekakan negara yang dijajah'],
 a:3,
 w:'Petikan Piagam Atlantik ini bermaksud bahawa setiap negara yang dijajah berhak mendapat kemerdekaan. Piagam 1941 ini menjadi asas semangat kemerdekaan bagi negara-negara yang masih dijajah, termasuk Tanah Melayu, selepas Perang Dunia Kedua.'},

{n:16,uid:'spmu2023-sej-16',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Maklumat berikut berkaitan dengan pentadbiran British di Tanah Melayu.<br><table style="margin:10px 0;border-collapse:collapse;font-size:.85rem"><tr><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Pentadbiran</th><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Jawatan</th></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">Malayan Union</td><td style="border:1px solid var(--line);padding:6px 10px">X</td></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">Persekutuan Tanah Melayu 1948</td><td style="border:1px solid var(--line);padding:6px 10px">Pesuruhjaya Tinggi</td></tr></table>Apakah X?',
 o:['Residen','Gabenor','Ketua Menteri','Penasihat British'],
 a:1,
 w:'X ialah Gabenor. Ketua pentadbiran Malayan Union ialah Gabenor yang mempunyai kuasa luas, berbeza dengan PTM 1948 yang menggantikannya dengan jawatan Pesuruhjaya Tinggi yang kuasanya lebih terhad berbanding Gabenor.'},

{n:17,uid:'spmu2023-sej-17',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Maklumat berikut adalah ciri-ciri pentadbiran yang diperkenalkan oleh British di Tanah Melayu.<ul style="margin:8px 0 0 18px"><li>Pesuruhjaya Tinggi British mengetuai kerajaan persekutuan</li><li>Sultan bertanggungjawab mengesahkan rang undang-undang dalam Dewan Perundangan Negeri</li></ul>Apakah pentadbiran tersebut?',
 o:['Gagasan Malayan Union','Persekutuan Tanah Melayu 1948','Persekutuan Tanah Melayu 1957','Pembentukan Malaysia 1963'],
 a:1,
 w:'Ciri-ciri ini merujuk kepada Persekutuan Tanah Melayu 1948 — di mana Pesuruhjaya Tinggi British mengetuai kerajaan persekutuan manakala Sultan masih mengetuai kerajaan negeri dengan kuasa mengesahkan rang undang-undang negeri.'},

{n:18,uid:'spmu2023-sej-18',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Maklumat berikut adalah usaha-usaha untuk menyatukan kaum di Tanah Melayu.<ul style="margin:8px 0 0 18px"><li>Jawatankuasa Hubungan Antara Kaum (CLC)</li><li>Pembukaan keahlian UMNO kepada bukan Melayu</li></ul>Mengapakah usaha tersebut penting?',
 o:['Merangka Perlembagaan Persekutuan','Mempercepatkan kemerdekaan negara','Menetapkan syarat kerakyatan','Memantapkan Sistem Ahli'],
 a:1,
 w:'Usaha perpaduan kaum melalui CLC dan pembukaan keahlian UMNO kepada bukan Melayu penting kerana ia mempercepatkan proses kemerdekaan negara. Perpaduan antara kaum membuktikan kepada British bahawa rakyat bersedia untuk memerintah diri sendiri.'},

{n:19,uid:'spmu2023-sej-19',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'British memperkenalkan Sistem Ahli pada tahun 1951. Mengapakah Sistem Ahli diperkenalkan?',
 o:['Memantapkan sistem pertahanan','Mengurangkan tekanan kuasa Barat','Mematuhi titah Raja-raja Melayu','Melaksanakan dasar dekolonisasi'],
 a:3,
 w:'Sistem Ahli diperkenalkan sebagai sebahagian daripada dasar dekolonisasi British yang merancang memberi pemerintahan sendiri secara berperingkat kepada Tanah Melayu. Ia melatih pemimpin tempatan mengurus portfolio kementerian sebelum kemerdekaan penuh.'},

{n:20,uid:'spmu2023-sej-20',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Kabinet pertama Persekutuan Tanah Melayu telah dirasmikan oleh Pesuruhjaya Tinggi British pada tahun 1955. Apakah peranan kabinet tersebut?<br>I Menjamin keselamatan dalam negeri<br>II Mengadakan perkhidmatan awam bercorak tempatan<br>III Memansuhkan penguasaan British sepenuhnya<br>IV Mewujudkan sistem politik dwiparti',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:0,
 w:'Peranan kabinet pertama 1955 ialah menjamin keselamatan dalam negeri (I) dan mengadakan perkhidmatan awam bercorak tempatan (II) — mewujudkan perkhidmatan awam yang diterajui oleh pegawai tempatan bagi menggantikan pegawai British secara berperingkat.'},

{n:21,uid:'spmu2023-sej-21',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Suruhanjaya Reid telah dibentuk untuk merangka Perlembagaan Tanah Melayu yang merdeka. Apakah perkara asas yang dipertimbangkan dalam perlembagaan tersebut?',
 o:['Kedudukan British','Jawatan tradisional','Bantahan negara jiran','Kuasa autonomi negeri'],
 a:2,
 w:'Perkara asas yang dipertimbangkan Suruhanjaya Reid ialah kuasa autonomi negeri dalam persekutuan. Perlembagaan perlu mengimbangi kuasa antara Kerajaan Persekutuan dengan kerajaan-kerajaan negeri yang ingin mengekalkan autonomi mereka.'},

{n:22,uid:'spmu2023-sej-22',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Mengapakah isu kewarganegaraan jus soli menjadi perhatian utama semua pihak semasa penggubalan perlembagaan?',
 o:['Menjamin kedudukan ekonomi','Mengelakkan pertumpahan darah','Mempengaruhi kerakyatan penduduk','Mempertahankan pentadbiran British'],
 a:2,
 w:'Isu kerakyatan jus soli menjadi tumpuan utama kerana ia mempengaruhi kerakyatan sebilangan besar penduduk bukan Melayu. Penentuan syarat kerakyatan menentukan siapa yang layak menjadi warganegara dan mendapat hak-hak berkaitan.'},

{n:23,uid:'spmu2023-sej-23',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Apakah prinsip kedaulatan Persekutuan Tanah Melayu yang merdeka?<br>I Sistem monarki<br>II Pengagihan kuasa<br>III Perlembagaan negara<br>IV Lambang kebangsaan',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:0,
 w:'Prinsip kedaulatan PTM yang merdeka ialah sistem monarki (I) — mengekalkan institusi Raja-Raja Melayu sebagai ketua negeri — dan pengagihan kuasa (II) antara Kerajaan Persekutuan dan kerajaan-kerajaan negeri mengikut sistem persekutuan.'},

{n:24,uid:'spmu2023-sej-24',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Apakah kepentingan kedaulatan kepada sebuah negara yang merdeka?',
 o:['Bebas mendapat kemasukan modal luar','Boleh membuat keputusan pentadbiran','Bantuan kerajaan jiran mudah diperoleh','Berupaya memperkukuh pemerintahan monarki'],
 a:1,
 w:'Kepentingan kedaulatan kepada negara merdeka ialah ia boleh membuat keputusan pentadbiran sendiri tanpa campur tangan pihak luar. Negara berdaulat bebas menentukan dasar dalam dan luar negerinya berdasarkan kepentingan rakyat sendiri.'},

{n:25,uid:'spmu2023-sej-25',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Mengapakah negara memerlukan perlembagaan?',
 o:['Mengekalkan kuasa penuh kerajaan negeri','Memberi kebebasan penuh kepada rakyat','Mengekalkan kuasa mutlak raja-raja','Menetapkan hala tuju pemerintahan negara'],
 a:3,
 w:'Negara memerlukan perlembagaan kerana ia menetapkan hala tuju pemerintahan negara. Perlembagaan menjadi undang-undang tertinggi yang menggariskan struktur kerajaan, hak rakyat dan prinsip-prinsip asas pentadbiran negara.'},

{n:26,uid:'spmu2023-sej-26',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
 q:'Mengapakah Perlembagaan Persekutuan Tanah Melayu dipinda pada tahun 1963?',
 o:['Pelaksanaan pilihan raya','Pembentukan Malaysia','Pembubaran Parlimen','Pemansuhan Darurat'],
 a:1,
 w:'Perlembagaan Persekutuan Tanah Melayu dipinda pada tahun 1963 untuk mengambil kira pembentukan Malaysia. Pindaan diperlukan bagi memasukkan peruntukan baharu berkaitan kemasukan Sabah, Sarawak dan Singapura ke dalam Persekutuan Malaysia.'},

{n:27,uid:'spmu2023-sej-27',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Siapakah yang berkuasa terhadap kedudukan agama Islam bagi negeri-negeri yang tidak beraja mengikut Perlembagaan Persekutuan?',
 o:['Yang di-Pertuan Agong','Yang di-Pertua Negeri','Perdana Menteri','Ketua Menteri'],
 a:0,
 w:'Yang di-Pertuan Agong berkuasa terhadap kedudukan agama Islam bagi negeri-negeri yang tidak beraja (Pulau Pinang, Melaka, Sabah dan Sarawak). Ini kerana negeri-negeri tersebut tidak mempunyai raja sendiri untuk mengetuai hal ehwal agama Islam.'},

{n:28,uid:'spmu2023-sej-28',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Pernyataan yang manakah benar berkaitan kuasa eksekutif Yang di-Pertuan Agong?',
 o:['Meminda Perlembagaan','Melantik Perdana Menteri','Menentukan tarikh pilihan raya','Meluluskan undang-undang negeri'],
 a:1,
 w:'Kuasa eksekutif Yang di-Pertuan Agong termasuk melantik Perdana Menteri daripada kalangan ahli Dewan Rakyat yang mendapat kepercayaan majoriti. Pelantikan ini merupakan kuasa prerogatif Baginda dalam sistem Raja Berperlembagaan.'},

{n:29,uid:'spmu2023-sej-29',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Apakah bidang kuasa Badan Kehakiman dalam Perlembagaan Persekutuan?<br>I Melantik Jemaah Menteri<br>II Menentukan kesahihan undang-undang<br>III Membatalkan akta yang bercanggah dengan Perlembagaan<br>IV Menentukan bidang kuasa Yang di-Pertuan Agong',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:2,
 w:'Badan Kehakiman berkuasa menentukan kesahihan undang-undang (II) dan membatalkan sebarang akta yang bercanggah dengan Perlembagaan Persekutuan (III). Kedua-dua kuasa ini menjadikan badan kehakiman sebagai penjaga perlembagaan negara.'},

{n:30,uid:'spmu2023-sej-30',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Kerajaan Persekutuan dan Kerajaan Negeri bekerjasama dalam memelihara khazanah negara. Pasangan pernyataan yang manakah betul?<br><table style="margin:10px 0;border-collapse:collapse;font-size:.85rem"><tr><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Kerajaan Persekutuan</th><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Kerajaan Negeri</th></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">A — Membentuk dasar berkaitan Taman Laut</td><td style="border:1px solid var(--line);padding:6px 10px">Menyediakan pelan pembangunan Taman Laut</td></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">B — Menyediakan pelan pembangunan Taman Laut</td><td style="border:1px solid var(--line);padding:6px 10px">Membentuk dasar berkaitan Taman Laut</td></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">C — Menyelaras pentadbiran Taman Laut</td><td style="border:1px solid var(--line);padding:6px 10px">Membentuk dasar berkaitan Taman Laut</td></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">D — Menyediakan pelan pembangunan Taman Laut</td><td style="border:1px solid var(--line);padding:6px 10px">Menyelaras pentadbiran Taman Laut</td></tr></table>',
 o:['A','B','C','D'],
 a:0,
 w:'Pasangan yang betul ialah A — Kerajaan Persekutuan membentuk dasar berkaitan Taman Laut (kerana laut di bawah bidang kuasa persekutuan) manakala Kerajaan Negeri menyediakan pelan pembangunan Taman Laut di dalam wilayah negeri masing-masing.'},

{n:31,uid:'spmu2023-sej-31',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
 q:'Malaysia Agreement (MA63) ditandatangani pada Julai 1963 di London. Wilayah manakah yang telah menandatangani perjanjian tersebut?<br>I Brunei&nbsp;&nbsp;II Filipina&nbsp;&nbsp;III Sarawak&nbsp;&nbsp;IV Singapura',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:3,
 w:'MA63 ditandatangani oleh Sarawak (III) dan Singapura (IV) bersama-sama Tanah Melayu, Sabah dan United Kingdom. Brunei menolak untuk menyertai Malaysia pada saat akhir, manakala Filipina bukan pihak dalam perjanjian tersebut.'},

{n:32,uid:'spmu2023-sej-32',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
 q:'Maklumat berikut merupakan peristiwa yang berlaku di Indonesia.<br><table style="margin:10px 0;border-collapse:collapse;font-size:.85rem"><tr><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Tahun</th><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Peristiwa</th></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">1965</td><td style="border:1px solid var(--line);padding:6px 10px">Peralihan kepimpinan di Indonesia</td></tr></table>Apakah kesan daripada peristiwa tersebut terhadap pembentukan Malaysia?',
 o:['Sistem beraja pulih','Perang Dingin bermula','Pakatan tentera dibentuk','Dasar konfrontasi berakhir'],
 a:3,
 w:'Peralihan kepimpinan Indonesia daripada Sukarno kepada Jeneral Suharto pada 1965 membawa kepada berakhirnya Dasar Konfrontasi terhadap Malaysia. Suharto yang lebih pragmatik memeterai Perjanjian Bangkok (1966) yang menamatkan konfrontasi.'},

{n:33,uid:'spmu2023-sej-33',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
 q:'Lee Kuan Yew menggunakan alasan berikut untuk membawa masuk Singapura dalam Persekutuan Malaysia pada tahun 1963.<ul style="margin:8px 0 0 18px"><li>Mempercepatkan proses kemerdekaan</li><li>Melemahkan ancaman komunis</li></ul>Mengapakah Singapura dipisahkan daripada Persekutuan Malaysia pada tahun 1965?',
 o:['Menghormati hak kaum bumiputera','Enggan mematuhi dasar kerajaan','Memohon naungan pihak British','Tidak mengiktiraf parti berhaluan kiri'],
 a:1,
 w:'Singapura dipisahkan kerana enggan mematuhi dasar kerajaan Malaysia, terutamanya berkaitan hak istimewa bumiputera dan konsep "Malaysia untuk Orang Malaysia" yang diwar-warkan PAP, menimbulkan ketegangan kaum yang serius.'},

{n:34,uid:'spmu2023-sej-34',form:'F5',topic:'F5 · Bab 6: Cabaran Selepas Pembentukan Malaysia',
 q:'Dasar Pendidikan Kebangsaan dilaksanakan melalui Penyata Razak 1956 yang dimaktubkan dalam Ordinan Pelajaran Kebangsaan 1957. Apakah matlamat Dasar Pelajaran Kebangsaan?<br>I Melahirkan tenaga mahir<br>II Memperkukuhkan identiti kaum<br>III Mempelbagaikan bahasa pengantar<br>IV Memupuk semangat perpaduan',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:0,
 w:'Matlamat Dasar Pelajaran Kebangsaan ialah melahirkan tenaga mahir (I) untuk keperluan pembangunan negara dan memupuk semangat perpaduan (IV) dalam kalangan murid pelbagai kaum melalui sistem pendidikan yang seragam.'},

{n:35,uid:'spmu2023-sej-35',form:'F5',topic:'F5 · Bab 6: Cabaran Selepas Pembentukan Malaysia',
 q:'Maklumat berikut berkaitan dengan usaha kerajaan selepas negara mencapai kemerdekaan.<br><div style="border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:10px 0;background:var(--panel2);font-size:.9rem">Memperkasakan penggunaan Bahasa Melayu</div>Bagaimanakah penggunaan bahasa mampu memupuk integrasi nasional?<br>I Menjadikan Bahasa Melayu sebagai bahasa pengantar<br>II Menggunakan Bahasa Melayu dalam majlis keramaian<br>III Menggunakan Bahasa Melayu dalam perjanjian kerajaan<br>IV Menjadikan Bahasa Melayu sebagai bahasa kebangsaan',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:3,
 w:'Bahasa Melayu memupuk integrasi nasional melalui penggunaannya dalam majlis keramaian yang menyatukan semua kaum (II) dan melalui penggunaannya dalam perjanjian kerajaan yang mengikat semua pihak tanpa mengira kaum (III).'},

{n:36,uid:'spmu2023-sej-36',form:'F5',topic:'F5 · Bab 6: Cabaran Selepas Pembentukan Malaysia',
 q:'Dasar Kebudayaan memperkenalkan Program Citrawarna pada tahun 1999. Apakah tujuan program Citrawarna Malaysia diperkenalkan?',
 o:['Mencungkil bakat baharu','Menarik kehadiran pelancong','Menggalakkan gaya hidup sihat','Menyuburkan kebudayaan asing'],
 a:1,
 w:'Program Citrawarna Malaysia 1999 diperkenalkan untuk menarik kehadiran pelancong ke Malaysia. Persembahan kebudayaan pelbagai kaum yang meriah memperlihatkan kepelbagaian budaya Malaysia sebagai daya tarikan pelancongan kepada pelancong domestik dan antarabangsa.'},

{n:37,uid:'spmu2023-sej-37',form:'F5',topic:'F5 · Bab 8: Membina Kemakmuran Negara',
 q:'Berikut adalah senarai bantuan yang disediakan oleh agensi kerajaan.<ul style="margin:8px 0 0 18px"><li>Biji benih</li><li>Peralatan pertanian</li><li>Pinjaman kewangan</li></ul>Apakah agensi yang dikaitkan dengan maklumat tersebut?<br>I Lembaga Beras dan Padi Negara (LPN)<br>II Lembaga Pertubuhan Peladang (LPP)<br>III Lembaga Kemajuan Tanah Persekutuan (FELDA)<br>IV Lembaga Kemajuan Johor Tenggara (KEJORA)',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:2,
 w:'Agensi yang menyediakan bantuan biji benih, peralatan pertanian dan pinjaman kewangan kepada petani ialah Lembaga Pertubuhan Peladang (LPP) (II) dan FELDA (III) yang membantu petani meningkatkan produktiviti pertanian melalui bantuan sumber dan kewangan.'},

{n:38,uid:'spmu2023-sej-38',form:'F5',topic:'F5 · Bab 8: Membina Kemakmuran Negara',
 q:'Berikut adalah tokoh-tokoh yang terlibat dalam membina kemakmuran negara.<br><table style="margin:10px 0;border-collapse:collapse;font-size:.85rem"><tr><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Tokoh</th><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Negara</th></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">Dr. Rais Saniman</td><td style="border:1px solid var(--line);padding:6px 10px">Malaysia</td></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">Dr. Just Faaland</td><td style="border:1px solid var(--line);padding:6px 10px">Norway</td></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">Dr. Jack R. Parkinson</td><td style="border:1px solid var(--line);padding:6px 10px">Britain</td></tr></table>Apakah sumbangan tokoh tersebut?',
 o:['Mewujudkan Dasar Perindustrian Berat','Mengemaskinikan sistem pentadbiran','Memantapkan sistem pendidikan','Merangka Dasar Ekonomi Baru'],
 a:3,
 w:'Dr. Rais Saniman, Dr. Just Faaland dan Dr. Jack R. Parkinson merupakan ahli pakar dalam pasukan yang merangka Dasar Ekonomi Baru (DEB) pada awal 1970-an. Sumbangan mereka dalam menyusun dasar ekonomi ini membentuk hala tuju pembangunan Malaysia.'},

{n:39,uid:'spmu2023-sej-39',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',
 q:'Perjanjian berkaitan Kawasan Perdagangan Bebas ASEAN (AFTA) ditandatangani pada sidang Kemuncak ASEAN 1992 di Singapura. Apakah kepentingan perjanjian tersebut terhadap Malaysia?',
 o:['Mempertingkatkan ekonomi negara','Memajukan kualiti perkhidmatan','Menggalakkan perindustrian kecil','Meluaskan kawasan perindustrian'],
 a:0,
 w:'AFTA penting kepada Malaysia kerana ia mempertingkatkan ekonomi negara melalui pengurangan tarif perdagangan dalam kalangan negara-negara ASEAN. Ini membuka pasaran yang lebih luas kepada barangan Malaysia dan menarik lebih banyak pelaburan asing.'},

{n:40,uid:'spmu2023-sej-40',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',
 q:'Semasa Deklarasi Langkawi pada tahun 1991, Malaysia telah memperkenalkan Anugerah Langkawi. Apakah tujuan anugerah tersebut diperkenalkan?',
 o:['Menghargai sumbangan dalam bidang keamanan','Menghargai sumbangan dalam bidang alam sekitar','Menggalakkan penglibatan dalam bidang teknologi','Mengiktiraf penglibatan dalam bidang kemanusiaan'],
 a:1,
 w:'Anugerah Langkawi diperkenalkan untuk menghargai sumbangan individu atau organisasi dalam bidang alam sekitar. Anugerah ini sejajar dengan Deklarasi Langkawi 1989 yang menekankan kepentingan perlindungan alam sekitar dan pembangunan mampan.'}

{n:1,uid:'spmu2025-sej-01',form:'F4',topic:'F4 · Bab 1: Warisan Negara Bangsa',
 q:'Bagaimana undang-undang membentuk ciri negara bangsa Kerajaan Alam Melayu?',
 o:['Meluaskan wilayah pengaruh','Mengukuhkan kedaulatan raja','Menjadi panduan pemerintahan','Membuktikan kesetiaan rakyat'],
 a:2,
 w:'Undang-undang dalam kerajaan Alam Melayu berfungsi menjadi panduan pemerintahan — mengatur hubungan antara pemerintah dan rakyat, menetapkan hak dan tanggungjawab, serta memastikan pentadbiran berjalan secara teratur dan adil.'},

{n:2,uid:'spmu2025-sej-02',form:'F4',topic:'F4 · Bab 1: Warisan Negara Bangsa',
 q:'Rajah berikut berkaitan hubungan timbal balik semasa Kesultanan Melayu Melaka.<br><div style="border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:10px 0;background:var(--panel2);font-size:.9rem;text-align:center">Golongan pemerintah ↕ Golongan diperintah</div>Apakah kepentingan hubungan tersebut?<br>I Keunggulan pentadbiran diwarisi<br>II Kesejahteraan rakyat terjamin<br>III Kedaulatan raja terpelihara<br>IV Kemajuan negara tercapai',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:2,
 w:'Hubungan timbal balik antara golongan pemerintah dan diperintah penting kerana ia menjamin kesejahteraan rakyat (II) dan memelihara kedaulatan raja (III) — rakyat memberi kesetiaan, raja memberi perlindungan dan keadilan.'},

{n:3,uid:'spmu2025-sej-03',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Maklumat berikut adalah judul karya nasionalis Indonesia, Raden Adjeng Kartini.<br><div style="border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:10px 0;background:var(--panel2);font-size:.9rem;text-align:center">Habis Gelap Terbitlah Terang</div>Apakah pendedahan yang diketengahkan melalui karya tersebut?',
 o:['Peranan rakyat dalam pemerintahan','Sekatan ekonomi pihak penjajah','Kemajuan bangsa Indonesia','Dasar diskriminasi Belanda'],
 a:3,
 w:'Karya Raden Adjeng Kartini mendedahkan dasar diskriminasi Belanda terhadap rakyat Indonesia, khususnya wanita. Beliau mempertikaikan dasar penjajah yang menyekat kemajuan wanita peribumi dan mendedahkan ketidakadilan penjajahan Belanda.'},

{n:4,uid:'spmu2025-sej-04',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Perkembangan nasionalisme di Thailand berbeza berbanding negara-negara Asia Tenggara yang lain. Bagaimanakah nasionalisme di Thailand berkembang?',
 o:['Mengubah nasib rakyat','Manifestasi perjuangan sami','Mengekalkan kedaulatan negara','Menghapuskan penjajahan asing'],
 a:2,
 w:'Nasionalisme di Thailand berkembang melalui usaha mengekalkan kedaulatan negara daripada ancaman penjajahan Barat. Berbeza dengan negara lain yang dijajah, Thailand memperjuangkan pengekalannya sebagai negara merdeka melalui pemodenan dan diplomasi.'},

{n:5,uid:'spmu2025-sej-05',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Maklumat berikut adalah judul karya yang disiarkan dalam akhbar di Tanah Melayu sebelum Perang Dunia Kedua.<br><div style="border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:10px 0;background:var(--panel2);font-size:.9rem;text-align:center">Cerita Terkukur</div>Apakah mesej karya tersebut?',
 o:['Kesedaran nasib bangsa','Pergolakan politik dunia','Kebangkitan tokoh tempatan','Penentangan sistem penjajah'],
 a:0,
 w:'"Cerita Terkukur" membawa mesej kesedaran nasib bangsa — menyedarkan orang Melayu tentang nasib mereka yang dijajah dan perlunya bersatu untuk memperjuangkan nasib dan masa depan bangsa sendiri.'},

{n:6,uid:'spmu2025-sej-06',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Apakah faktor yang mencetuskan Perang Dunia Pertama?',
 o:['Kemunculan golongan intelektual','Kegagalan Liga Bangsa','Kebangkitan tokoh tempatan','Persaingan kuasa imperialis'],
 a:3,
 w:'Faktor utama yang mencetuskan Perang Dunia Pertama ialah persaingan antara kuasa-kuasa imperialis Eropah. Setiap kuasa berebut tanah jajahan dan kawasan pengaruh, mewujudkan ketegangan yang akhirnya meletup menjadi peperangan berskala dunia.'},

{n:7,uid:'spmu2025-sej-07',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Perang Dunia Pertama memberikan kesan besar terhadap Eropah. Apakah kesan tersebut?',
 o:['Kejatuhan sistem beraja','Kepupusan ideologi komunis','Kemerosotan empayar British','Kelemahan Liga Bangsa-Bangsa'],
 a:0,
 w:'Kesan utama Perang Dunia Pertama terhadap Eropah ialah kejatuhan sistem beraja — empayar-empayar besar seperti Austro-Hungary, Rusia (Tsar), Jerman (Kaiser) dan Turki Uthmaniyyah runtuh, menamatkan pemerintahan monarki mutlak di Eropah.'},

{n:8,uid:'spmu2025-sej-08',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Apakah prinsip asas pembinaan nasionalisme semasa era Pemulihan Meiji di Jepun?',
 o:['Bushido','Kokokai','Syonan-to','Koa Kunrenjo'],
 a:0,
 w:'Bushido (Jalan Pahlawan) merupakan prinsip asas pembinaan nasionalisme semasa Pemulihan Meiji di Jepun. Kod etika Bushido menekankan kesetiaan, kehormatan dan pengorbanan diri untuk negara, menjadi tunjang semangat nasionalisme Jepun.'},

{n:9,uid:'spmu2025-sej-09',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Kejayaan dalam perang di Eropah memberi keyakinan kepada Pihak Bersekutu untuk menghadapi dasar peluasan kuasa Jepun. Apakah tindakan Pihak Bersekutu terhadap Jepun?',
 o:['Mewujudkan Orde Baharu Asia','Menyertai Pakatan Ketenteraan','Menguasai wilayah di selatan','Mengenakan sekatan ekonomi'],
 a:3,
 w:'Pihak Bersekutu (terutama Amerika Syarikat) mengenakan sekatan ekonomi ke atas Jepun sebagai tindak balas kepada peluasan kuasa Jepun di Asia. Embargo minyak dan bahan mentah menekan Jepun untuk mengambil tindakan drastik, akhirnya menyerang Pearl Harbour.'},

{n:10,uid:'spmu2025-sej-10',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Serangan Jepun di Tanah Melayu bermula dengan pendaratan tentera Jepun di Kelantan pada 8 Disember 1941. Apakah faktor kedatangan Jepun ke Tanah Melayu?<br>I Kemunculan ideologi baharu<br>II Kegagalan Liga Bangsa-Bangsa<br>III Eksploitasi sumber bahan mentah<br>IV Kepentingan strategik ketenteraan',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:3,
 w:'Jepun menyerang Tanah Melayu kerana kepentingan strategik ketenteraan — Tanah Melayu merupakan laluan strategik ke seluruh Asia Tenggara (IV) — dan untuk mengeksploitasi sumber bahan mentah seperti getah dan bijih timah yang sangat diperlukan untuk industri perang Jepun (III).'},

{n:11,uid:'spmu2025-sej-11',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Dalam persidangan Raja-raja Tanah Melayu dan Sumatera di Singapura, pentadbiran Jepun telah mengiktiraf Raja-raja Melayu. Apakah bentuk pengiktirafan tersebut?',
 o:['Menentukan kutipan cukai','Membantu kuasa mentadbir','Menjadi ketua agama Islam','Memberikan kuasa perundangan'],
 a:2,
 w:'Pentadbiran Jepun mengiktiraf Raja-Raja Melayu sebagai ketua agama Islam di negeri masing-masing. Pengiktirafan ini adalah strategi Jepun untuk mendapatkan sokongan dan kerjasama Raja-Raja Melayu dalam memastikan rakyat patuh kepada pentadbiran Jepun.'},

{n:12,uid:'spmu2025-sej-12',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Selepas Jepun menyerah kalah, Bintang Tiga mengambil kesempatan menguasai pemerintahan di Tanah Melayu selama 14 hari. Apakah kesan penguasaan Bintang Tiga terhadap orang Melayu?',
 o:['Orang Melayu menentang gerakan Fi-Sabilillah','Orang Melayu sedar tentang kepentingan perdamaian','Raja-raja Melayu menyokong penguasaan Bintang Tiga','Pemimpin Melayu melaksanakan undang-undang tentera'],
 a:2,
 w:'Penguasaan Bintang Tiga (MPAJA) selama 14 hari selepas Jepun menyerah kalah menyedari orang Melayu tentang kepentingan perdamaian dan perpaduan. Konflik yang berlaku semasa tempoh ini mendedahkan bahaya perpecahan kaum kepada semua pihak.'},

{n:13,uid:'spmu2025-sej-13',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'British Military Administration (BMA) diperkenalkan pada tahun 1945 bertujuan untuk mengembalikan kestabilan dan keamanan di Tanah Melayu. Mengapakah BMA tidak berjaya melaksanakan tugas tersebut?',
 o:['Penentangan pemimpin tempatan','Pelaksanaan perintah berkurung','Peningkatan kegiatan jenayah','Penularan wabak penyakit'],
 a:2,
 w:'BMA gagal mengembalikan kestabilan kerana berlaku peningkatan kegiatan jenayah yang berleluasa selepas Perang Dunia Kedua. Kelemahan kuasa penguatkuasaan, kekurangan pegawai dan keadaan huru-hara selepas perang menyebabkan kadar jenayah melonjak tinggi.'},

{n:14,uid:'spmu2025-sej-14',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Mengapakah orang Melayu menerima Persekutuan Tanah Melayu 1948 tetapi menolak Malayan Union 1946?',
 o:['Raja berkuasa mutlak','Hak istimewa terjamin','Syarat kerakyatan longgar','Pengagihan kuasa ditamatkan'],
 a:1,
 w:'Orang Melayu menerima PTM 1948 kerana ia menjamin hak istimewa orang Melayu dan memulihkan kedaulatan Raja-Raja Melayu. Berbeza dengan Malayan Union yang menghapuskan hak istimewa Melayu, PTM 1948 memelihara kepentingan orang Melayu.'},

{n:15,uid:'spmu2025-sej-15',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Mengapakah Parti Komunis Malaya (PKM) dipaksa menerima syarat Rundingan Baling pada tahun 1955?<br>I Enggan menyerah diri<br>II Tidak mahu meletakkan senjata<br>III Saranan komunis antarabangsa<br>IV Pampasan tidak setimpal',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:0,
 w:'PKM terpaksa menghadiri Rundingan Baling kerana enggan menyerah diri sepenuhnya (I) dan tidak mahu meletakkan senjata tanpa jaminan (II). PKM ingin berunding bagi mendapatkan pengiktirafan dan syarat yang lebih baik daripada kerajaan.'},

{n:16,uid:'spmu2025-sej-16',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Pada 1 Julai 1946, Vyner Brooke menyerahkan Sarawak kepada British. Apakah faktor penyerahan tersebut?',
 o:['Sokongan rakyat','Tuntutan peribumi','Desakan pembesar','Masalah kewangan'],
 a:3,
 w:'Vyner Brooke menyerahkan Sarawak kepada British atas faktor masalah kewangan. Selepas kemusnahan akibat Perang Dunia Kedua, Sarawak memerlukan dana besar untuk pembangunan semula yang tidak mampu ditanggung oleh Brooke White Rajahs.'},

{n:17,uid:'spmu2025-sej-17',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Peristiwa Sungkit Berdarah membawa kepada pembunuhan Gabenor Duncan Steward oleh Rukun 13. Apakah kesan peristiwa tersebut terhadap penduduk Sarawak?',
 o:['Mewujudkan kestabilan politik','Mewujudkan perpecahan kaum','Mengurangkan penentangan rakyat','Membangkitkan semangat nasionalisme'],
 a:3,
 w:'Pembunuhan Gabenor Duncan Steward oleh Rukun 13 membangkitkan semangat nasionalisme dalam kalangan penduduk Sarawak. Peristiwa berani ini menyedarkan rakyat tentang pentingnya perjuangan menentang penjajahan demi mencapai kemerdekaan.'},

{n:18,uid:'spmu2025-sej-18',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Maklumat berikut berkaitan keahlian Jawatankuasa Kerja yang merangka Perjanjian Persekutuan Tanah Melayu 1948.<ul style="margin:8px 0 0 18px"><li>Wakil Raja-Raja Melayu</li><li>Wakil kerajaan British</li><li>Wakil UMNO</li></ul>Mengapakah golongan nasionalis Melayu radikal menolak penubuhan jawatankuasa tersebut?',
 o:['Tiada wakil dalam perundingan','Perlembagaan Rakyat ditolak','Kedaulatan negara terancam','Hak peribumi terjejas'],
 a:0,
 w:'Golongan nasionalis Melayu radikal menolak jawatankuasa tersebut kerana mereka tiada wakil dalam perundingan. Jawatankuasa hanya melibatkan Raja-Raja Melayu, British dan UMNO, mengabaikan suara golongan nasionalis yang mahu penglibatan lebih luas.'},

{n:19,uid:'spmu2025-sej-19',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Ahmad Boestamam merupakan pemimpin pertubuhan Angkatan Pemuda Insaf (API) yang ditubuhkan pada tahun 1946. Apakah matlamat pertubuhan tersebut?',
 o:['Menuntut hak peribumi','Menyatupadukan penduduk','Memperjuangkan kemerdekaan','Memelihara kepentingan bahasa'],
 a:2,
 w:'API (Angkatan Pemuda Insaf) yang diketuai Ahmad Boestamam ditubuhkan dengan matlamat memperjuangkan kemerdekaan Tanah Melayu. API merupakan salah satu pertubuhan nasionalis Melayu radikal yang aktif menyebarkan semangat anti-penjajahan.'},

{n:20,uid:'spmu2025-sej-20',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Maklumat berikut berkaitan pilihan raya peringkat negeri 1954.<br><table style="margin:10px 0;border-collapse:collapse;font-size:.85rem"><tr><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Parti</th><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Bilangan kerusi dimenangi</th></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">Perikatan UMNO-MCA</td><td style="border:1px solid var(--line);padding:6px 10px">226 daripada 268</td></tr></table>Mengapakah parti tersebut memperoleh kejayaan besar?',
 o:['Persediaan ke arah kemerdekaan','Pemilihan kawasan pilihan raya','Ketokohan calon bertanding','Kerjasama antara kaum'],
 a:3,
 w:'Perikatan UMNO-MCA menang besar kerana kerjasama antara kaum — gabungan parti Melayu dan Cina membuktikan model kerjasama berbilang kaum berkesan, menarik undi daripada pelbagai kaum dan mewujudkan kepercayaan dalam kalangan pengundi.'},

{n:21,uid:'spmu2025-sej-21',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Mengapakah Malaysia mengadakan pilihan raya umum setiap lima tahun sekali?',
 o:['Menggalakkan persaingan parti politik','Memilih kerajaan yang mantap','Meneruskan warisan bangsa','Menjamin kesejahteraan awam'],
 a:1,
 w:'Malaysia mengadakan pilihan raya umum setiap lima tahun bagi memilih kerajaan yang mantap untuk mentadbir negara. Tempoh lima tahun memberi kerajaan masa yang mencukupi untuk melaksanakan dasar dan program pembangunan secara berkesan.'},

{n:22,uid:'spmu2025-sej-22',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Apakah terma rujukan utama yang terkandung dalam Perjanjian Persekutuan 1957?',
 o:['Kerajaan Negeri yang kukuh','Memelihara kedaulatan negara','Kewarganegaraan berasaskan tempat lahir','Menjamin kedudukan istimewa orang Melayu'],
 a:3,
 w:'Terma rujukan utama Suruhanjaya Reid dalam merangka Perjanjian Persekutuan 1957 ialah menjamin kedudukan istimewa orang Melayu. Ini merupakan perkara asas yang perlu dimasukkan dalam perlembagaan bagi menjamin hak dan keistimewaan bumiputera.'},

{n:23,uid:'spmu2025-sej-23',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Tokoh berikut berperanan besar dalam kemerdekaan negara.<ul style="margin:8px 0 0 18px"><li>Tunku Abdul Rahman</li><li>Ong Yoke Lin</li><li>V.T. Sambanthan</li></ul>Apakah nilai yang boleh dicontohi daripada tokoh tersebut?<br>I Bersopan santun<br>II Berjimat cermat<br>III Muafakat<br>IV Keterbukaan',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:3,
 w:'Nilai yang boleh dicontohi daripada Tunku, Ong Yoke Lin dan V.T. Sambanthan ialah muafakat (III) — keupayaan bermesyuarat dan mencapai persetujuan bersama — dan keterbukaan (IV) dalam menerima pandangan kaum lain demi kepentingan negara.'},

{n:24,uid:'spmu2025-sej-24',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Bendera Union Jack diturunkan pada malam ambang kemerdekaan. Apakah kesan peristiwa tersebut kepada Tanah Melayu?',
 o:['Kemasukan imigran berakhir','Wujudnya negara yang berdaulat','Mengembalikan raja berkuasa mutlak','Ancaman komunis berjaya dibanteras'],
 a:1,
 w:'Penurunan bendera Union Jack pada 31 Ogos 1957 menandakan wujudnya negara Tanah Melayu yang berdaulat. Kemerdekaan bermakna Tanah Melayu bebas menentukan nasibnya sendiri tanpa campur tangan British dalam hal ehwal pentadbirannya.'},

{n:25,uid:'spmu2025-sej-25',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Antara berikut, yang manakah berkaitan dengan kedaulatan undang-undang?',
 o:['Pembentukan negara bangsa','Raja pemerintah kuasa tertinggi','Dipatuhi oleh kerajaan dan rakyat','Sistem pemerintah berkuasa mutlak'],
 a:2,
 w:'Kedaulatan undang-undang bermaksud undang-undang itu tertinggi dan wajib dipatuhi oleh semua pihak termasuk kerajaan dan rakyat. Tiada sesiapa yang berada di atas undang-undang, dan semua orang tertakluk kepada peruntukan undang-undang yang sama.'},

{n:26,uid:'spmu2025-sej-26',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
 q:'Perlembagaan Persekutuan Tanah Melayu 1957 telah dipinda selepas pembentukan Malaysia. Apakah tujuan pindaan tersebut?',
 o:['Memasukkan klausa baharu','Membahagikan kerusi Parlimen','Mengelakkan ancaman komunis','Mengukuhkan kuasa Yang di-Pertuan Agong'],
 a:0,
 w:'Perlembagaan Persekutuan 1957 dipinda selepas pembentukan Malaysia bagi memasukkan klausa-klausa baharu yang berkaitan dengan kemasukan Sabah, Sarawak dan Singapura ke dalam persekutuan, termasuk peruntukan hak istimewa dan autonomi wilayah baharu.'},

{n:27,uid:'spmu2025-sej-27',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Parlimen adalah badan perundangan tertinggi Malaysia. Apakah peranan Parlimen?',
 o:['Mentafsir Perlembagaan Persekutuan','Melaksanakan pembangunan negara','Membuat pindaan undang-undang','Mengadili pertikaian antara rakyat'],
 a:2,
 w:'Peranan utama Parlimen sebagai badan perundangan tertinggi ialah membuat pindaan undang-undang sedia ada dan menggubal undang-undang baharu. Parlimen bertanggungjawab memastikan undang-undang negara sentiasa relevan dengan keperluan semasa.'},

{n:28,uid:'spmu2025-sej-28',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Senarai Bersama membolehkan Parlimen dan Dewan Undangan Negeri (DUN) menggubal undang-undang untuk perkara yang sama. Perkara yang terkandung dalam Senarai Bersama ialah<br>I kebajikan awam<br>II kewarganegaraan<br>III kerajaan tempatan<br>IV perlindungan hidupan liar',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:3,
 w:'Senarai Bersama mengandungi kerajaan tempatan (III) dan perlindungan hidupan liar (IV) — kedua-dua perkara ini boleh diperundangkan oleh Parlimen mahupun DUN. Senarai ini membolehkan kedua-dua peringkat kerajaan merangka undang-undang berkaitan keperluan setempat.'},

{n:29,uid:'spmu2025-sej-29',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
 q:'Idea gagasan Malaysia ialah menggabungkan bekas tanah jajahan British di Asia Tenggara. Apakah tujuan gagasan tersebut?',
 o:['Melicinkan sistem pentadbiran','Meningkatkan peluang pentadbiran','Menggalakkan kemasukan pelabur','Mengukuhkan hubungan diplomatik'],
 a:0,
 w:'Tujuan gagasan Malaysia ialah melicinkan sistem pentadbiran bekas tanah jajahan British di Asia Tenggara. Penggabungan wilayah-wilayah ini membolehkan pentadbiran dijalankan secara lebih teratur, cekap dan menyeluruh di bawah satu kerangka persekutuan.'},

{n:30,uid:'spmu2025-sej-30',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
 q:'Maklumat berikut berkaitan perubahan politik di Indonesia.<br><table style="margin:10px 0;border-collapse:collapse;font-size:.85rem"><tr><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Tarikh</th><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Peristiwa</th></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">30 September 1965</td><td style="border:1px solid var(--line);padding:6px 10px">Peralihan kuasa kepada Jeneral Suharto</td></tr></table>Apakah kesan peristiwa tersebut terhadap Malaysia?',
 o:['Perubahan sempadan negara','Pengaruh komunis meluas','Dasar konfrontasi tamat','Sistem beraja berakhir'],
 a:2,
 w:'Peralihan kuasa kepada Jeneral Suharto di Indonesia pada 1965 membawa kepada tamatnya Dasar Konfrontasi terhadap Malaysia. Suharto yang anti-komunis memilih pendekatan lebih pragmatik dan menormalisasi hubungan dengan Malaysia melalui Perjanjian Bangkok 1966.'},

{n:31,uid:'spmu2025-sej-31',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
 q:'Mengapakah pengisytiharan pembentukan Malaysia yang dirancang pada 31 Ogos 1963 ditangguhkan?',
 o:['Ancaman komunis Asia Tenggara','Pemulauan penduduk tempatan','Bantahan pemimpin Indonesia','Permintaan Raja-raja Melayu'],
 a:2,
 w:'Pengisytiharan pembentukan Malaysia ditangguhkan daripada 31 Ogos ke 16 September 1963 kerana bantahan pemimpin Indonesia (Sukarno) dan Filipina. Penundaan diperlukan untuk menunggu siasatan PBB mengesahkan sokongan penduduk Sabah dan Sarawak.'},

{n:32,uid:'spmu2025-sej-32',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
 q:'Mengapakah Perlembagaan Persekutuan Tanah Melayu dipinda pada tahun 1963?',
 o:['Pelaksanaan pilihan raya','Pembentukan Malaysia','Pembubaran Parlimen','Pemansuhan darurat'],
 a:1,
 w:'Perlembagaan Persekutuan Tanah Melayu dipinda pada tahun 1963 bagi mengambil kira pembentukan Malaysia. Pindaan perlu dilakukan untuk memasukkan peruntukan baharu berkaitan kemasukan Sabah, Sarawak dan Singapura serta hak-hak khusus wilayah baharu tersebut.'},

{n:33,uid:'spmu2025-sej-33',form:'F5',topic:'F5 · Bab 6: Cabaran Selepas Pembentukan Malaysia',
 q:'Apakah tindakan serta-merta yang diambil oleh kerajaan untuk menghentikan peristiwa rusuhan kaum pada 13 Mei 1969?',
 o:['Penapisan berita palsu','Pengisytiharan perintah darurat','Penempatan semula masyarakat','Pemerkasaan pasukan keselamatan'],
 a:1,
 w:'Tindakan serta-merta kerajaan untuk menghentikan rusuhan 13 Mei 1969 ialah pengisytiharan perintah darurat. Darurat membolehkan kerajaan menggubal peraturan kecemasan, mengenakan berkurung dan memberi kuasa luas kepada pihak berkuasa menangani situasi krisis.'},

{n:34,uid:'spmu2025-sej-34',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
 q:'Maklumat berikut berkaitan cabaran pemisahan Singapura daripada Malaysia.<ul style="margin:8px 0 0 18px"><li>Tuntutan pasaran bersama</li><li>Cukai tambahan terhadap Singapura</li><li>Faedah pinjaman RM150 juta</li></ul>Mengapakah cabaran tersebut terjadi?',
 o:['Hasutan kuasa asing','Provokasi parti komunis','Kemunculan golongan radikal','Kegagalan rundingan'],
 a:3,
 w:'Cabaran-cabaran pemisahan Singapura terjadi akibat kegagalan rundingan antara kerajaan Malaysia dengan kerajaan Singapura dalam pelbagai isu ekonomi dan kewangan. Ketidakupayaan mencapai kata sepakat menjadi penyumbang utama kepada pemisahan Singapura.'},

{n:35,uid:'spmu2025-sej-35',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
 q:'Apakah faktor pemisahan Singapura daripada Malaysia pada tahun 1965?',
 o:['Ancaman komunis','Keputusan pilihan raya','Bantahan Majlis Negeri','Konflik antara pemimpin'],
 a:3,
 w:'Faktor utama pemisahan Singapura daripada Malaysia ialah konflik antara pemimpin — perselisihan serius antara Tunku Abdul Rahman dengan Lee Kuan Yew atas isu kaum, ekonomi dan politik yang tidak dapat diselesaikan, mendorong keputusan pemisahan.'},

{n:36,uid:'spmu2025-sej-36',form:'F5',topic:'F5 · Bab 6: Cabaran Selepas Pembentukan Malaysia',
 q:'Maklumat berikut berkaitan prinsip Dasar Kebudayaan Kebangsaan.<ul style="margin:8px 0 0 18px"><li>Kebudayaan lain yang sesuai</li><li>Islam sebagai unsur penting</li><li>Kebudayaan rakyat asal</li></ul>Bagaimanakah prinsip tersebut membentuk identiti negara?',
 o:['Memartabat warisan bangsa','Memupuk keperibadian unggul','Meningkatkan kualiti kehidupan','Melahirkan masyarakat berilmu'],
 a:1,
 w:'Prinsip Dasar Kebudayaan Kebangsaan yang menggabungkan unsur kebudayaan asal, Islam dan elemen lain yang sesuai membentuk identiti negara dengan memupuk keperibadian unggul rakyat Malaysia — warganegara yang beridentiti jelas, berakhlak mulia dan bermaruah.'},

{n:37,uid:'spmu2025-sej-37',form:'F5',topic:'F5 · Bab 8: Membina Kemakmuran Negara',
 q:'Bagaimanakah Dasar Ekonomi Baru 1970 hingga 1990 dapat memberi keadilan kepada semua kaum?',
 o:['Menamatkan buta huruf','Menjayakan pembangunan','Menyusun semula masyarakat','Meningkatkan jumlah penduduk'],
 a:2,
 w:'DEB memberi keadilan kepada semua kaum melalui strategi menyusun semula masyarakat — mengurangkan pengenalan kaum dengan fungsi ekonomi, membantu bumiputera menceburi pelbagai sektor ekonomi dan mengimbangi pemilikan ekonomi antara kaum.'},

{n:38,uid:'spmu2025-sej-38',form:'F5',topic:'F5 · Bab 8: Membina Kemakmuran Negara',
 q:'Apakah matlamat kerjasama Lembaga Kemajuan Tanah Persekutuan (FELDA) dan Yayasan Sabah?',
 o:['Melaksanakan penyelidikan dan pembangunan','Menambah pemilikan saham bumiputera','Memperkasakan pasaran tempatan','Membuka tanah pertanian baharu'],
 a:3,
 w:'Matlamat kerjasama FELDA dan Yayasan Sabah ialah membuka tanah pertanian baharu di Sabah bagi menetap dan meningkatkan taraf hidup peneroka. Kerjasama ini membolehkan pembukaan kawasan ladang baharu yang bermanfaat kepada masyarakat luar bandar.'},

{n:39,uid:'spmu2025-sej-39',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',
 q:'Mengapakah Malaysia menentang Dasar Apartheid yang diamalkan di Afrika Selatan?',
 o:['Menghalang kebebasan beragama','Menghapus sistem beraja','Mencabuli hak asasi','Menyekat eksport negara'],
 a:2,
 w:'Malaysia menentang Dasar Apartheid kerana ia mencabuli hak asasi manusia — pengasingan kaum secara paksa dan penafian hak-hak asas kepada penduduk kulit hitam merupakan pelanggaran terang terhadap prinsip kesaksamaan dan maruah manusia.'},

{n:40,uid:'spmu2025-sej-40',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',
 q:'Apakah alasan negara maju melancarkan gerakan antiminyak kelapa sawit keluaran Malaysia?',
 o:['Mengandungi bahan berbahaya','Mencemarkan alam sekitar','Menjejaskan tahap kesihatan','Menyebabkan kenaikan cukai'],
 a:1,
 w:'Negara-negara maju melancarkan gerakan antiminyak sawit Malaysia dengan alasan ia mencemarkan alam sekitar — dakwaan bahawa penanaman kelapa sawit menyebabkan penebangan hutan dan kemusnahan habitat. Malaysia menolak dakwaan ini sebagai tidak adil dan berniat menyekat perdagangan.'}

{n:3,uid:'spm2025-sej-03',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',

 o:['Kuasa raja terlalu terhad dalam pemerintahan','Pemerintah tidak mendapat sokongan daripada pihak gereja','Ekonomi rakyat tidak berkembang di bawah pemerintahan raja','Kebebasan rakyat terjejas di bawah pemerintahan beraja mutlak'],
 a:3,
 w:'Pemerintahan beraja mutlak menghadkan kebebasan asasi rakyat dan tidak memberi ruang kepada rakyat untuk terlibat dalam pentadbiran, justeru menimbulkan penentangan hebat.'},
{n:4,uid:'spm2025-sej-04',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Apakah kesan utama Revolusi Amerika pada tahun 1776?',
 o:['Negara-negara Amerika bersatu di bawah satu kerajaan pusat','Perang saudara meletus di antara negeri-negeri Amerika','Sistem demokrasi dilaksanakan di Amerika Syarikat','Empayar British mengambil alih pentadbiran Amerika'],
 a:2,
 w:'Revolusi Amerika 1776 membawa kepada pengisytiharan kemerdekaan Amerika Syarikat daripada Britain dan pelaksanaan sistem demokrasi yang menjamin kebebasan dan hak asasi rakyat.'},
{n:5,uid:'spm2025-sej-05',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Jerman dikenakan hukuman berat dalam Perjanjian Versailles 1919. Mengapakah pihak Berikat mengenakan hukuman tersebut kepada Jerman?',
 o:['Jerman enggan menghadiri rundingan damai','Jerman mengkhianati perjanjian sebelum Perang Dunia Pertama','Jerman cuba menjajah negara-negara Asia','Jerman menyebabkan banyak kemusnahan dalam Perang Dunia Pertama'],
 a:3,
 w:'Pihak Berikat mengenakan hukuman berat kepada Jerman melalui Perjanjian Versailles kerana Jerman dianggap bertanggungjawab memulakan konflik dan menyebabkan kemusnahan besar dalam Perang Dunia Pertama.'},
{n:6,uid:'spm2025-sej-06',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Apakah kesan dasar pemerintahan Jepun ke atas rakyat di Tanah Melayu semasa Perang Dunia Kedua?',
 o:['Ekonomi Tanah Melayu berkembang dengan pesat','Perpaduan antara kaum semakin terbentuk','Semangat kebangsaan Melayu meningkat dengan mendadak','Pengukuhan semangat antipenjajah dalam kalangan rakyat'],
 a:3,
 w:'Keganasan dan penindasan Jepun menyedarkan rakyat tentang penderitaan hidup di bawah penjajahan asing, seterusnya mengukuhkan semangat menentang penjajah.'},
{n:7,uid:'spm2025-sej-07',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Raja-raja Melayu telah menentang penubuhan Malayan Union (MU) pada tahun 1946. Antara berikut, apakah cara yang digunakan oleh Raja-raja Melayu untuk menentang MU?<br>I&#160;&#160; Mengadakan perhimpunan rasmi<br>II&#160; Melancarkan demonstrasi di jalanan<br>III Menghantar surat bantahan ke London<br>IV Memfailkan kes di Mahkamah Tinggi',
 o:['I dan II','I dan III','II dan IV','III dan IV'],
 a:0,

{n:8,uid:'spm2025-sej-08',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',

{n:10,uid:'spm2025-sej-10',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',

{n:11,uid:'spm2025-sej-11',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',

{n:12,uid:'spm2025-sej-12',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',

{n:13,uid:'spm2025-sej-13',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',

{n:14,uid:'spm2025-sej-14',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',

{n:15,uid:'spm2025-sej-15',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',

{n:16,uid:'spm2025-sej-16',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',

{n:17,uid:'spm2025-sej-17',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',

{n:18,uid:'spm2025-sej-18',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',

{n:19,uid:'spm2025-sej-19',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',

{n:20,uid:'spm2025-sej-20',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',

{n:21,uid:'spm2025-sej-21',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',

{n:22,uid:'spm2025-sej-22',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',

{n:23,uid:'spm2025-sej-23',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',

{n:29,uid:'spm2025-sej-29',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',

{n:30,uid:'spm2025-sej-30',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',

{n:32,uid:'spm2025-sej-32',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',

{n:33,uid:'spm2025-sej-33',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',

{n:34,uid:'spm2025-sej-34',form:'F5',topic:'F5 · Bab 6: Cabaran Selepas Pembentukan Malaysia',

{n:35,uid:'spm2025-sej-35',form:'F5',topic:'F5 · Bab 8: Membina Kemakmuran Negara',

{n:36,uid:'spm2025-sej-36',form:'F5',topic:'F5 · Bab 8: Membina Kemakmuran Negara',

{n:37,uid:'spm2025-sej-37',form:'F5',topic:'F5 · Bab 8: Membina Kemakmuran Negara',

{n:38,uid:'spm2025-sej-38',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',

{n:39,uid:'spm2025-sej-39',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',

{n:40,uid:'spm2025-sej-40',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',

{n:2,uid:'jhr-sej-26-02',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Jadual yang berikut berkaitan dengan tindakan pemerintah Thailand.<br><table style="margin:10px 0;border-collapse:collapse;font-size:.85rem"><tr><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Pemerintah Thailand</th><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Tindakan</th></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">Raja Mongkut</td><td style="border:1px solid var(--line);padding:6px 10px">Memperkenalkan sistem birokrasi Barat</td></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">Raja Chulalongkorn</td><td style="border:1px solid var(--line);padding:6px 10px"></td></tr></table>Apakah kesan tindakan tersebut terhadap negara?',

{n:3,uid:'jhr-sej-26-03',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Mengapakah Sultan Kedah, Sultan Abdullah Mukarram Shah menentang Syarikat Hindia Timur Inggeris (SHTI) pada abad ke-18?',
