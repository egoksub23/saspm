<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPM 2026 · Sejarah</title>

<style>
html{font-size:17px}
:root{
  --ink:#0B0E13; --panel:#141A25; --panel2:#182030; --line:#242E3E;
  --txt:#E9E7DC; --mut:#96A0AC; --dim:#6B7684;
  --fl:#C6F24E; --am:#FFB454; --vi:#9D8CFF; --okG:#57C76A; --badR:#FF6B6B;
  --onFl:#111; --dot:rgba(233,231,220,.03);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --disp:Georgia,'Times New Roman',serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
[data-theme="light"]{
  --ink:#F4F1E8; --panel:#FFFFFF; --panel2:#F7F5EE; --line:#E2DDCE;
  --txt:#171A21; --mut:#5C6674; --dim:#8A93A0;
  --fl:#5C7A00; --am:#A85F00; --vi:#5B44C7; --okG:#237A33; --badR:#C0292F;
  --onFl:#fff; --dot:rgba(0,0,0,.04);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--ink);color:var(--txt);font-family:var(--body);line-height:1.6;min-height:100vh;
  background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:32px 32px;
  -webkit-font-smoothing:antialiased}
::selection{background:var(--fl);color:var(--onFl)}
button,input,select{font-family:inherit;cursor:pointer;color:inherit}
a{color:var(--fl)}
.wrap{max-width:900px;margin:0 auto;padding:26px 20px 70px}

/* ---- top bar ---- */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:26px;flex-wrap:wrap}
.brand{font-family:var(--disp);font-weight:900;font-size:1.05rem;letter-spacing:-.01em;margin-right:auto;
  display:flex;align-items:center;gap:9px;background:transparent;border:0;padding:0;color:var(--txt);cursor:pointer}
.brand:hover b{filter:brightness(1.15)}
.brand:hover small{border-color:var(--fl);color:var(--fl)}
.brand b{color:var(--fl)}
.brand small{font-family:var(--mono);font-size:.56rem;letter-spacing:.18em;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:3px 7px;font-weight:400}
.home-crumb{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;color:var(--dim);text-decoration:none;white-space:nowrap}
.home-crumb:hover{color:var(--fl)}
.crumb-sep{color:var(--dim);font-size:.7rem;letter-spacing:.05em;user-select:none;padding:0 2px}
#breadSubj{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;color:var(--mut);white-space:nowrap;text-decoration:none}
#breadSubj:hover{color:var(--fl)}
.crumb-cur{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;color:var(--fl);white-space:nowrap}
.ghost{background:transparent;border:1px solid var(--line);color:var(--mut);font-family:var(--mono);
  font-size:.6rem;letter-spacing:.14em;padding:8px 13px;border-radius:100px;transition:.18s}
.ghost:hover{border-color:var(--fl);color:var(--fl)}
.ghost.on{border-color:var(--fl);color:var(--fl);background:color-mix(in srgb,var(--fl) 10%,transparent)}

/* ---- hero ---- */
.kick{font-family:var(--disp);font-size:clamp(1.8rem,5vw,3rem);font-weight:900;letter-spacing:.04em;color:var(--fl);text-align:center;margin-bottom:18px;line-height:1.08}
.sub{text-align:center;color:var(--mut);margin-top:0;font-size:.95rem;max-width:58ch;margin-inline:auto;line-height:1.65}
.sub em{font-style:normal;color:var(--txt);font-weight:600}

/* ---- panels ---- */
.card{border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden}
.sec{padding:18px 20px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.lab{font-family:var(--mono);font-size:.58rem;letter-spacing:.18em;color:var(--dim);margin-bottom:11px;display:flex;gap:10px;align-items:center}
.lab i{font-style:normal;color:var(--fl);cursor:pointer;border-bottom:1px dotted var(--fl)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{background:var(--panel2);border:1px solid var(--line);color:var(--mut);font-family:var(--mono);
  font-size:.62rem;letter-spacing:.08em;padding:7px 13px;border-radius:100px;transition:.16s;white-space:nowrap}
.chip:hover{border-color:var(--fl);color:var(--txt)}
.chip.on{border-color:var(--fl);color:var(--fl);background:color-mix(in srgb,var(--fl) 12%,transparent)}
.chip .n{color:var(--dim);margin-left:6px;font-size:.9em}
.chip.on .n{color:var(--fl);opacity:.75}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}

/* ---- start row ---- */
.startrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:18px 20px;background:var(--panel2)}
.cta{background:var(--fl);border:1px solid var(--fl);color:var(--onFl);font-family:var(--mono);font-weight:700;
  font-size:.72rem;letter-spacing:.16em;padding:14px 26px;border-radius:8px;transition:.18s}
.cta:hover{filter:brightness(1.08);transform:translateY(-1px)}
.cta:disabled{opacity:.35;cursor:not-allowed;transform:none}
.count{font-family:var(--mono);font-size:.68rem;color:var(--mut);margin-right:auto}
.count b{color:var(--fl);font-size:1.4rem;font-family:var(--disp);vertical-align:-2px;margin-right:4px}

/* ---- quiz ---- */
.top{padding:14px 20px;border-bottom:1px solid var(--line)}
.ctr-row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--mono);
  font-size:.66rem;letter-spacing:.14em;color:var(--fl);margin-bottom:10px;flex-wrap:wrap}
.ctr-row .r{display:flex;gap:14px;align-items:center;color:var(--mut)}
.ctr-row .r b{color:var(--fl)}
.ctr-row .r .warn{color:var(--badR)}
.pbar{height:5px;background:var(--line);border-radius:5px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--fl),var(--am));width:0;transition:width .3s}
.qbody{padding:24px 22px 26px}
.meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.tag{display:inline-block;font-family:var(--mono);font-size:.55rem;letter-spacing:.13em;border:1px solid var(--line);
  color:var(--mut);border-radius:5px;padding:4px 8px}
.tag.am{border-color:var(--am);color:var(--am)}
.tag.vi{border-color:var(--vi);color:var(--vi)}
.qq{font-family:var(--disp);font-size:1.16rem;font-weight:700;line-height:1.5;margin-bottom:8px}
.qq sub,.qq sup{font-size:.72em}
.qq table,.opt table{border-collapse:collapse;margin:12px 0;font-family:var(--body);font-size:.85rem;font-weight:400}
.qq th,.qq td,.opt th,.opt td{border:1px solid var(--line);padding:6px 11px;text-align:left}
.qq th{background:var(--panel2);font-family:var(--mono);font-size:.62rem;letter-spacing:.08em}
.qq .fig{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;color:var(--dim);font-weight:400}
.qlist{margin:8px 0 8px 20px;font-family:var(--body);font-size:.9rem;font-weight:400;line-height:1.65}
.stmt{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:14px}
.stmt-lbl{font-family:var(--mono);font-size:.58rem;font-weight:700;letter-spacing:.14em;color:var(--dim);margin-bottom:7px}
.stmt-item{font-family:var(--body);font-size:.93rem;font-weight:400;line-height:1.62;color:var(--body)}
.stmt-item+.stmt-item{margin-top:5px}
img{height:auto}.qq img,.qimg{max-width:100%;border:1px solid var(--line);border-radius:10px;margin:6px 0 16px;background:#fff}
.alt{font-size:.84rem;color:var(--dim);font-style:italic;margin:-2px 0 16px;font-family:var(--body);font-weight:400}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.opt{display:flex;gap:13px;align-items:flex-start;text-align:left;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;padding:12px 15px;color:var(--txt);font-size:.92rem;line-height:1.5;transition:border-color .16s,background .16s;width:100%}
.opt:not(:disabled):hover{border-color:var(--fl)}
.opt .k{font-family:var(--mono);font-size:.64rem;color:var(--dim);border:1px solid var(--line);border-radius:5px;
  padding:3px 8px;flex-shrink:0;margin-top:2px}
.opt.pick{border-color:var(--vi);background:color-mix(in srgb,var(--vi) 12%,transparent)}
.opt.pick .k{color:var(--vi);border-color:var(--vi)}
.opt.right{border-color:var(--okG);background:color-mix(in srgb,var(--okG) 14%,transparent)}
.opt.right .k{color:var(--okG);border-color:var(--okG)}
.opt.wrong{border-color:var(--badR);background:color-mix(in srgb,var(--badR) 12%,transparent);animation:shake .4s}
.opt.dim{opacity:.42}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.why{margin-top:18px;padding:14px 16px;border-left:3px solid var(--fl);
  background:color-mix(in srgb,var(--fl) 7%,transparent);font-size:.87rem;color:var(--mut);border-radius:0 8px 8px 0}
.why b{color:var(--fl);font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;display:block;margin-bottom:5px}
.why.none{border-left-color:var(--dim);background:transparent;color:var(--dim);font-style:italic}
.nav{margin-top:22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nav .sp{margin-left:auto}
.btn{background:transparent;border:1px solid var(--fl);color:var(--fl);font-family:var(--mono);font-size:.68rem;
  letter-spacing:.14em;padding:11px 19px;border-radius:7px;transition:.18s}
.btn:hover{background:var(--fl);color:var(--onFl)}
.btn.mutebtn{border-color:var(--line);color:var(--mut)}
.btn.mutebtn:hover{background:transparent;border-color:var(--mut);color:var(--txt)}
.btn.flag.on{border-color:var(--am);color:var(--am)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.hint{font-family:var(--mono);font-size:.56rem;letter-spacing:.12em;color:var(--dim);margin-top:14px}

/* ---- navigator ---- */
.navg{display:none;padding:16px 20px;border-top:1px solid var(--line);background:var(--panel2)}
.navg.show{display:block}
.navg .cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.cell{aspect-ratio:1;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--dim);
  font-family:var(--mono);font-size:.62rem;display:flex;align-items:center;justify-content:center;transition:.14s;position:relative}
.cell:hover{border-color:var(--fl);color:var(--fl)}
.cell.done{color:var(--txt);border-color:var(--mut)}
.cell.ok{border-color:var(--okG);color:var(--okG)}
.cell.no{border-color:var(--badR);color:var(--badR)}
.cell.cur{outline:2px solid var(--fl);outline-offset:1px}
.cell.flag::after{content:'';position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--am)}

/* ---- report ---- */
.res{text-align:center;padding:26px 20px 8px}
.res .score{font-family:var(--disp);font-weight:900;font-size:4rem;line-height:1}
.res .score span{font-size:1.5rem;color:var(--dim)}
.res .pc{font-family:var(--mono);font-size:.7rem;letter-spacing:.2em;color:var(--fl);margin-top:6px}
.res .msg{font-family:var(--disp);font-style:italic;font-size:1.15rem;margin-top:12px;color:var(--am);max-width:46ch;margin-inline:auto}
.brow{display:grid;grid-template-columns:minmax(96px,1.1fr) 2fr 88px;gap:11px;align-items:center;margin-bottom:9px;
  font-family:var(--mono);font-size:.62rem;color:var(--mut)}
.brow .tr{height:7px;background:var(--line);border-radius:5px;overflow:hidden}
.brow .fl{height:100%;background:var(--fl);border-radius:5px;transition:width .5s}
.brow .fl.mid{background:var(--am)} .brow .fl.low{background:var(--badR)}
.brow .v{text-align:right}
.rev{border-top:1px solid var(--line);padding:16px 20px}
.rq{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:9px;background:var(--panel2)}
.rq .h{font-family:var(--mono);font-size:.58rem;letter-spacing:.12em;color:var(--dim);margin-bottom:7px;display:flex;gap:9px;flex-wrap:wrap}
.rq .h b{color:var(--badR)} .rq .h b.ok{color:var(--okG)}
.rq .t{font-size:.9rem;margin-bottom:8px}
.rq .ans{font-family:var(--mono);font-size:.66rem;color:var(--mut);line-height:1.9}
.rq .ans em{font-style:normal;color:var(--okG)} .rq .ans s{color:var(--badR)}
.rq .w{margin-top:8px;font-size:.82rem;color:var(--mut);padding-left:11px;border-left:2px solid var(--line)}

/* ---- misc ---- */
.empty{text-align:center;padding:44px 24px;color:var(--mut);font-size:.9rem}
.empty code{font-family:var(--mono);font-size:.8rem;color:var(--fl);background:var(--panel2);padding:2px 7px;border-radius:5px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,80px);background:var(--panel);border:1px solid var(--fl);
  color:var(--fl);font-family:var(--mono);font-size:.64rem;letter-spacing:.12em;padding:11px 20px;border-radius:100px;
  transition:transform .3s;z-index:99;box-shadow:0 14px 34px rgba(0,0,0,.45)}
.toast.show{transform:translate(-50%,0)}
footer{text-align:center;padding:32px 20px;font-family:var(--mono);font-size:.58rem;letter-spacing:.18em;color:var(--dim)}
footer span{color:var(--fl)}
@media (max-width:560px){
  .wrap{padding:18px 14px 60px}
  .qbody{padding:20px 16px 22px}
  .brow{grid-template-columns:minmax(76px,1fr) 1.3fr 74px;font-size:.55rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.bar,.nav,.navg,footer,.startrow{display:none}}

/* ============================================================
   PAPER 2 — STRUCTURED QUESTIONS
   ============================================================ */
.p2parts{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.p2part{border:1px solid var(--line);border-radius:10px;background:var(--panel2);overflow:hidden}
.p2part-head{display:flex;gap:10px;align-items:baseline;padding:12px 15px}
.p2part-label{font-family:var(--mono);font-size:.7rem;font-weight:700;color:var(--fl);
  background:color-mix(in srgb,var(--fl) 12%,transparent);border-radius:5px;padding:3px 9px;
  flex-shrink:0;align-self:flex-start;margin-top:2px}
.p2part-q{font-size:.93rem;line-height:1.6;flex:1}
.p2part-m{font-family:var(--mono);font-size:.57rem;color:var(--dim);flex-shrink:0;
  border:1px solid var(--line);border-radius:4px;padding:2px 7px;margin-left:8px;align-self:flex-start;margin-top:4px}
.p2reveal-btn{width:100%;background:transparent;border:0;border-top:1px solid var(--line);
  color:var(--mut);font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;
  padding:9px 15px;text-align:left;display:flex;gap:8px;align-items:center;transition:.15s;cursor:pointer}
.p2reveal-btn:hover{background:color-mix(in srgb,var(--fl) 6%,transparent);color:var(--fl)}
.p2reveal-btn.open{color:var(--okG);border-top-color:color-mix(in srgb,var(--okG) 30%,var(--line))}
.p2reveal-btn .arr{transition:transform .2s}
.p2reveal-btn.open .arr{transform:rotate(180deg)}
.p2ans{padding:13px 15px;border-top:1px solid color-mix(in srgb,var(--okG) 30%,var(--line));
  background:color-mix(in srgb,var(--okG) 6%,transparent)}
.p2ans-lbl{font-family:var(--mono);font-size:.56rem;letter-spacing:.14em;color:var(--okG);margin-bottom:6px}
.p2ans-txt{font-size:.92rem;color:var(--txt);line-height:1.65}
.p2ans-note{font-family:var(--mono);font-size:.58rem;color:var(--am);margin-top:6px;
  padding:5px 10px;border:1px solid color-mix(in srgb,var(--am) 30%,transparent);border-radius:5px;display:inline-block}
.p2ans-img{max-width:100%;border:1px solid var(--line);border-radius:8px;margin-top:10px;background:#fff}
/* Reveal-all button */
.p2revall{background:transparent;border:1px solid var(--line);color:var(--mut);font-family:var(--mono);
  font-size:.6rem;letter-spacing:.12em;padding:8px 15px;border-radius:7px;margin-top:16px;transition:.15s;cursor:pointer}
.p2revall:hover{border-color:var(--fl);color:var(--fl)}
/* Self-mark panel */
.p2score{margin-top:24px;padding:16px 18px;border:1px solid color-mix(in srgb,var(--am) 40%,var(--line));
  border-radius:10px;background:color-mix(in srgb,var(--am) 5%,transparent)}
.p2score-lbl{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;color:var(--am);margin-bottom:10px}
.p2score-btns{display:flex;gap:8px;flex-wrap:wrap}
.p2sb{background:var(--panel2);border:1px solid var(--line);color:var(--mut);font-family:var(--mono);
  font-size:.62rem;letter-spacing:.1em;padding:9px 16px;border-radius:7px;transition:.15s;cursor:pointer}
.p2sb:hover{border-color:var(--fl);color:var(--txt)}
.p2sb.got{border-color:var(--okG)!important;color:var(--okG)!important;background:color-mix(in srgb,var(--okG) 10%,transparent)!important}
.p2sb.partly{border-color:var(--am)!important;color:var(--am)!important;background:color-mix(in srgb,var(--am) 10%,transparent)!important}
.p2sb.missed{border-color:var(--badR)!important;color:var(--badR)!important;background:color-mix(in srgb,var(--badR) 10%,transparent)!important}
/* P2 summary report */
.p2summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:18px 20px}
.p2stat{text-align:center;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.p2stat b{font-family:var(--disp);font-size:2.2rem;font-weight:900;display:block;line-height:1}
.p2stat.ok b{color:var(--okG)} .p2stat.ok{border-color:color-mix(in srgb,var(--okG) 30%,var(--line))}
.p2stat.mid b{color:var(--am)} .p2stat.mid{border-color:color-mix(in srgb,var(--am) 30%,var(--line))}
.p2stat.bad b{color:var(--badR)} .p2stat.bad{border-color:color-mix(in srgb,var(--badR) 30%,var(--line))}
.p2stat small{font-family:var(--mono);font-size:.56rem;letter-spacing:.14em;color:var(--dim);margin-top:4px;display:block}
/* Sejarah-compatible P2 classes */
.stim{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px 15px;font-size:.88rem;color:var(--mut);margin:4px 0 18px;line-height:1.65}
.stim table{border-collapse:collapse;width:100%;margin:8px 0;font-size:.82rem}
.stim th,.stim td{border:1px solid var(--line);padding:4px 8px;text-align:center}
.stim th{background:color-mix(in srgb,var(--line) 50%,var(--panel2));font-weight:600;text-align:center}
.stim svg{display:block;margin:6px auto;max-width:100%}
.part{border:1px solid var(--line);border-radius:11px;padding:14px 15px;margin-bottom:11px;background:var(--panel)}
.part.ok{border-color:var(--okG)} .part.no{border-color:var(--badR)}
.pq{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;line-height:1.5}
.pq .pl{font-family:var(--mono);font-size:.7rem;color:var(--fl);flex-shrink:0;margin-top:2px}
.pq .pm{margin-left:auto;flex-shrink:0;font-family:var(--mono);font-size:.56rem;letter-spacing:.1em;color:var(--am);border:1px solid var(--am);border-radius:5px;padding:2px 7px;margin-top:2px;white-space:nowrap}
.reveal{margin-top:11px;padding:8px 14px;font-size:.6rem}
.pa{margin-top:11px;padding:11px 14px;border-left:3px solid var(--fl);background:color-mix(in srgb,var(--fl) 7%,transparent);border-radius:0 8px 8px 0}
.pts{margin:0;padding-left:18px;font-size:.88rem;line-height:1.6}
.pts li{margin:3px 0}
.selfm{display:flex;gap:8px;align-items:center;margin-top:11px;flex-wrap:wrap;font-family:var(--mono);font-size:.56rem;letter-spacing:.12em;color:var(--dim)}
.selfm span{margin-right:auto}
.btn.sm{padding:7px 13px;font-size:.6rem;border-color:var(--okG);color:var(--okG)}
.btn.sm:hover,.btn.sm.on{background:var(--okG);color:var(--onFl)}
.btn.sm.bad{border-color:var(--badR);color:var(--badR)}
.btn.sm.bad:hover,.btn.sm.bad.on{background:var(--badR);color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a href="https://saspm.vircle.tech/" class="home-crumb" title="Back to home">HOME</a>
    <span class="crumb-sep">&rsaquo;&rsaquo;</span>
    <a id="breadSubj" href="https://saspm.vircle.tech/" class="home-crumb">SEJARAH</a>
    <span class="crumb-sep">&rsaquo;&rsaquo;</span>
    <span class="crumb-cur">DRILL NOW</span>
    <button class="brand" id="btnHome" title="Back to the filters"><b>SPM 2026</b> Trial Drill <small id="bankTag">BANK 0</small></button>
    <button class="ghost" id="btnLang">BM / EN</button>
    <button class="ghost" id="btnStats">MY STATS</button>
    <button class="ghost" id="btnTheme">THEME</button>
  </div>

{n:1,uid:'spm2023-sej-01',form:'F4',topic:'F4 · Bab 1: Warisan Negara Bangsa',
 q:'Apakah kepentingan Sistem Pembesar Empat Lipatan dalam pemerintahan Kesultanan Melayu Melaka?',
 o:['Memastikan adat istiadat dipatuhi','Menjamin keutuhan pemerintahan','Mempertahan sistem perundangan','Memastikan sistem warisan terpelihara'],
 a:1,
 w:'Sistem Pembesar Empat Lipatan (Bendahara, Penghulu Bendahari, Temenggung, Laksamana) bertujuan menjamin keutuhan pemerintahan dengan membahagikan tanggungjawab pentadbiran negeri secara teratur dan sistematik.'},

{n:2,uid:'spm2023-sej-02',form:'F4',topic:'F4 · Bab 1: Warisan Negara Bangsa',
 q:'Mengapakah Kerajaan Kesultanan Melayu Melaka mewujudkan jawatan Syahbandar?',
 o:['Melaksanakan protokol istana','Mengetuai rombongan diplomatik','Mengawal keamanan dalam negeri','Melicinkan kutipan cukai di pelabuhan'],
 a:3,
 w:'Jawatan Syahbandar diwujudkan untuk melicinkan kutipan cukai di pelabuhan. Syahbandar bertanggungjawab mengurus hal ehwal pedagang asing, memastikan cukai dibayar dan perdagangan berjalan dengan lancar di Pelabuhan Melaka.'},

{n:3,uid:'spm2023-sej-03',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Berikut adalah tokoh nasionalis Tanah Melayu sebelum Perang Dunia Kedua.<ul style="margin:8px 0 0 18px"><li>Ibrahim Haji Yaakob</li><li>Ishak Haji Muhammad</li><li>Ahmad Boestamam</li></ul>Bagaimanakah British bertindak untuk melemahkan perjuangan mereka?',
 o:['Mengenakan hukuman penjara','Menyekat sumber kewangan yang diperoleh','Menjalin kerjasama dengan golongan radikal','Menggunakan perintah sultan untuk bertindak'],
 a:0,
 w:'British melemahkan perjuangan tokoh nasionalis radikal seperti Ibrahim Haji Yaakob dan Ahmad Boestamam dengan mengenakan hukuman penjara ke atas mereka atas tuduhan mengancam keselamatan negara dan menyebarkan idea nasionalisme.'},

{n:4,uid:'spm2023-sej-04',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Gerakan nasionalisme di Thailand disasarkan terhadap pemerintahan raja mereka sendiri. Apakah tindakan raja Thailand yang menyebabkan keadaan tersebut berlaku?',
 o:['Melaksanakan sistem percukaian yang membebankan','Menghapuskan sistem perundangan tradisional','Meletakkan kerabat diraja dalam urusan politik','Menyerahkan pentadbiran kepada kuasa Barat'],
 a:3,
 w:'Gerakan nasionalisme Thailand ditujukan kepada raja sendiri kerana raja menyerahkan pentadbiran kepada kuasa Barat. Tindakan ini dianggap menggadaikan kedaulatan negara dan merugikan kepentingan rakyat Thailand.'},

{n:5,uid:'spm2023-sej-05',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Bagaimanakah Jerman melanggar syarat-syarat Perjanjian Versailles 1919?',
 o:['Memperkuat angkatan tentera','Menamatkan hubungan diplomatik','Mengeksport senjata ke luar negara','Menjalin kerjasama dengan komunis'],
 a:0,
 w:'Jerman melanggar Perjanjian Versailles 1919 dengan memperkuat angkatan tenteranya. Perjanjian itu mengehadkan saiz tentera Jerman, tetapi Hitler secara terbuka melanggar syarat tersebut dengan membina semula kekuatan tentera Jerman menjelang 1930-an.'},

{n:6,uid:'spm2023-sej-06',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Jadual berikut berkaitan dengan kejayaan Jepun dalam bidang ketenteraan.<br><table style="margin:10px 0;border-collapse:collapse;font-size:.85rem"><tr><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Tahun</th><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Kejayaan</th></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">1895</td><td style="border:1px solid var(--line);padding:6px 10px">Menewaskan China</td></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">1905</td><td style="border:1px solid var(--line);padding:6px 10px">Menewaskan Rusia</td></tr></table>Apakah kesan kejayaan tersebut terhadap Asia Tenggara?',
 o:['Pengukuhan sistem pertahanan','Peluasan kawasan pemerintahan','Kemunculan semangat nasionalisme','Kemantapan kuasa pemerintahan tempatan'],
 a:2,
 w:'Kejayaan Jepun menewaskan China (1895) dan Rusia (1905) membuktikan bangsa Asia mampu mengalahkan kuasa Barat, justeru mencetuskan semangat nasionalisme dalam kalangan penduduk Asia Tenggara untuk menentang penjajahan.'},

{n:7,uid:'spm2023-sej-07',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Gambar berikut menunjukkan peristiwa kekejaman penjajahan Jepun di Tanah Melayu.<p style="font-size:.82rem;color:var(--dim);font-style:italic">[Gambar tidak tersedia — rujuk kertas asal]</p>Apakah tindakan penduduk tempatan dalam menghadapi kekejaman tersebut?',
 o:['Menyokong gerakan Islah','Mengadakan tunjuk perasaan','Melibatkan diri dalam persatuan','Memberi kerjasama dengan British'],
 a:3,
 w:'Menghadapi kekejaman Jepun, penduduk tempatan memberi kerjasama kepada British. Gerakan Anti-Jepun Rakyat Malaya (MPAJA) yang disokong British menjadi saluran perlawanan terhadap kekejaman tentera Jepun di Tanah Melayu.'},

{n:8,uid:'spm2023-sej-08',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Maklumat berikut berkaitan dengan unit politik yang disatukan di Tanah Melayu sewaktu pentadbiran British.<ul style="margin:8px 0 0 18px"><li>Negeri-Negeri Selat</li><li>Negeri-Negeri Melayu Bersekutu</li><li>Negeri-Negeri Melayu Tidak Bersekutu</li></ul>Mengapakah British bertindak demikian?',
 o:['Kos pengurusan dapat dikurangkan','Melemahkan golongan penentang','Hak kaum peribumi terpelihara','Sistem monarki diperkukuh'],
 a:0,
 w:'British menyatukan semua unit politik di Tanah Melayu ke dalam Malayan Union bagi mengurangkan kos pengurusan. Penyatuan membolehkan pentadbiran dijalankan secara berpusat dengan lebih cekap dan menjimatkan.'},

{n:9,uid:'spm2023-sej-09',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Akhbar Suara Rakyat diterbitkan oleh golongan Melayu radikal pada tahun 1940-an. Mengapakah akhbar tersebut diterbitkan?',
 o:['Menyekat penularan pengaruh media asing','Memperluas idea kemerdekaan daripada penjajah','Meningkatkan mutu hasil kesusasteraan tempatan','Menyokong pemodenan sistem pentadbiran kerajaan'],
 a:1,
 w:'Akhbar Suara Rakyat diterbitkan untuk memperluas idea kemerdekaan daripada penjajah. Melalui penulisan dalam akhbar, golongan nasionalis Melayu radikal menyebarkan kesedaran tentang pentingnya kemerdekaan dan menentang penjajahan.'},

{n:10,uid:'spm2023-sej-10',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Petikan berikut berkaitan golongan nasionalis Melayu radikal sebelum merdeka. Bagaimanakah golongan tersebut memainkan peranan mereka untuk menyatukan semua kaum?',
 o:['Membentuk kerajaan yang kuat dan adil','Menekankan kebebasan bersuara','Berkompromi dengan penjajah','Berhimpun secara aman'],
 a:0,
 w:'Golongan nasionalis Melayu radikal berusaha menyatukan semua kaum dengan membentuk kerajaan yang kuat dan adil — sebuah negara yang bebas dari penjajahan di mana semua kaum diperlakukan secara saksama tanpa diskriminasi.'},

{n:11,uid:'spm2023-sej-11',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Maklumat berikut berkaitan dengan perkembangan di Tanah Melayu sebelum merdeka.<br><table style="margin:10px 0;border-collapse:collapse;font-size:.85rem"><tr><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Tahun</th><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Peristiwa</th></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">1948</td><td style="border:1px solid var(--line);padding:6px 10px">Perjanjian Persekutuan Tanah Melayu ditandatangani</td></tr></table>Apakah kesan peristiwa tersebut kepada orang Melayu?',
 o:['Diiktiraf sebagai penduduk asal','Berkuasa mengawal pentadbiran','Parti-parti politik digabungkan','Syarat kerakyatan dipermudah'],
 a:0,
 w:'PTM 1948 mengiktiraf orang Melayu sebagai penduduk asal Tanah Melayu. Berbeza dengan Malayan Union yang mengabaikan hak istimewa Melayu, PTM 1948 memulihkan kedudukan dan hak istimewa orang Melayu serta Raja-Raja Melayu.'},

{n:12,uid:'spm2023-sej-12',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Rundingan Baling diadakan antara wakil Persekutuan Tanah Melayu dengan Parti Komunis Malaya (PKM) pada bulan Disember 1955. Mengapakah rundingan tersebut gagal mendesak PKM meletakkan senjata?',
 o:['Perkongsian kuasa gagal dicapai','PKM tidak diiktiraf oleh kerajaan','PKM enggan menamatkan keganasan','Pengampunan oleh kerajaan gagal diperoleh'],
 a:2,
 w:'Rundingan Baling gagal kerana PKM enggan menamatkan keganasan. PKM menuntut syarat yang tidak boleh diterima kerajaan — PKM mahu diiktiraf sebagai parti sah dan tidak mahu menyerahkan senjata sepenuhnya.'},

{n:13,uid:'spm2023-sej-13',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Pada tahun 1946, Parti Kebangsaan Melayu Bersatu (UMNO) telah ditubuhkan. Apakah tujuan penubuhan parti tersebut?',
 o:['Mengurangkan kemasukan imigran','Menuntut kemerdekaan Tanah Melayu','Mengeratkan perpaduan pelbagai kaum','Menghalang pelaksanaan Malayan Union'],
 a:3,
 w:'UMNO ditubuhkan pada tahun 1946 dengan tujuan utama menghalang pelaksanaan Malayan Union yang mengancam kedaulatan Raja-Raja Melayu dan menghapuskan hak istimewa orang Melayu. UMNO berjaya menyatukan orang Melayu menolak Malayan Union.'},

{n:14,uid:'spm2023-sej-14',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Sebelum merdeka, sistem pendidikan tidak dapat memupuk perpaduan di Tanah Melayu. Mengapakah keadaan tersebut berlaku?',
 o:['Kemudahan asas terhad','Tenaga pengajar kurang','Kurikulum pelajaran berbeza','Peruntukan kewangan dikurangkan'],
 a:2,
 w:'Sistem pendidikan gagal memupuk perpaduan kerana setiap sekolah vernakular (Melayu, Cina, Tamil) menggunakan kurikulum pelajaran yang berbeza. Perbezaan kurikulum, bahasa pengantar dan sukatan pelajaran menghalang integrasi antara kaum.'},

{n:15,uid:'spm2023-sej-15',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Mengapakah tanggungjawab untuk mengundi dalam pilihanraya penting?',
 o:['Memilih ketua parti','Mengekalkan tradisi bangsa','Memperkukuh sistem beraja','Membentuk sebuah kerajaan'],
 a:3,
 w:'Mengundi dalam pilihan raya penting kerana melalui proses itulah rakyat membentuk sebuah kerajaan yang akan mentadbir negara. Undian rakyat menentukan parti atau calon yang mendapat mandat untuk memerintah.'},

{n:16,uid:'spm2023-sej-16',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Maklumat berikut berkaitan dengan rundingan yang dilakukan sebelum kemerdekaan Persekutuan Tanah Melayu.<br><table style="margin:10px 0;border-collapse:collapse;font-size:.85rem"><tr><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Tarikh</th><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Peristiwa</th></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">18 Januari – 8 Februari 1956</td><td style="border:1px solid var(--line);padding:6px 10px">Rundingan London</td></tr></table>Apakah persetujuan yang dicapai dalam rundingan tersebut?',
 o:['Penubuhan Jawatankuasa Antara Kaum','Penetapan syarat mendapatkan kerakyatan','Pembentukan Suruhanjaya untuk merangka perlembagaan','Pelaksanaan pilihan raya Majlis Perundangan Persekutuan'],
 a:2,
 w:'Rundingan London 1956 mempersetujui pembentukan Suruhanjaya Reid untuk merangka perlembagaan bagi Tanah Melayu yang merdeka. Suruhanjaya ini dipengerusikan oleh Lord William Reid dan menghasilkan draf Perlembagaan Persekutuan.'},

{n:17,uid:'spm2023-sej-17',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Apakah yang berkaitan dengan Perjanjian Persekutuan Tanah Melayu 1957?',
 o:['Pengekalan jawatan Pesuruhjaya Tinggi','Kepentingan sah kaum lain dikurangkan','Kewangan negara masih dikawal oleh British','Pengiktirafan BM bahasa pengantar'],
 a:3,
 w:'Perjanjian PTM 1957 memperuntukkan pengiktirafan Bahasa Melayu sebagai bahasa pengantar dan bahasa kebangsaan. Ini merupakan salah satu syarat penting yang dipersetujui dalam proses menuju kemerdekaan Tanah Melayu.'},

{n:18,uid:'spm2023-sej-18',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Apakah jenis kerakyatan yang telah diterima dalam Perjanjian Persekutuan Tanah Melayu 1957?<br>I Permohonan sebagai rakyat<br>II Penguatkuasaan undang-undang<br>III Perkenan Majlis Raja-Raja Melayu<br>IV Persetujuan Dewan Undangan Negeri',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:2,
 w:'PTM 1957 menerima dua jenis kerakyatan: melalui penguatkuasaan undang-undang (kerakyatan automatik bagi yang memenuhi syarat) dan dengan perkenan Majlis Raja-Raja Melayu. Kedua-dua kaedah ini memastikan proses pewarganegaraan berjalan teratur.'},

{n:19,uid:'spm2023-sej-19',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Mengapa peristiwa kemerdekaan negara kita dianggap unik dan dikagumi oleh pemimpin dunia?<br>I Perkembangan ekonomi berasaskan kerohanian<br>II Permuafakatan dan rundingan dilaksanakan<br>III Pertumpahan darah tidak berlaku<br>IV Penamatan dasar konfrontasi',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:2,
 w:'Kemerdekaan Tanah Melayu dianggap unik kerana dicapai melalui permuafakatan dan rundingan aman antara pemimpin pelbagai kaum dengan British (II), dan tanpa pertumpahan darah (III) — berbeza dengan negara lain yang merdeka melalui revolusi atau peperangan.'},

{n:20,uid:'spm2023-sej-20',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Bagaimanakah kedaulatan dapat memelihara hak rakyat?',
 o:['Mengamalkan sistem satu parti','Mengutamakan keadilan individu','Membenarkan kebebasan bersuara','Menggalakkan semangat kenegerian'],
 a:1,
 w:'Kedaulatan memelihara hak rakyat dengan mengutamakan keadilan individu — memastikan setiap warganegara mendapat layanan yang adil di bawah undang-undang negara tanpa diskriminasi, selaras dengan prinsip negara berdaulat yang menjamin hak asasi.'},

{n:21,uid:'spm2023-sej-21',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Apakah kepentingan konsep Daulat dalam politik Melayu tradisional?<br>I Memperkukuh kedudukan raja<br>II Memperluas peranan pembesar<br>III Menyekat pengaruh kuasa asing<br>IV Mengikat taat setia rakyat terhadap raja',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:1,
 w:'Konsep Daulat penting kerana ia memperkukuh kedudukan raja sebagai pemerintah yang mempunyai kuasa sakti (I) dan mengikat taat setia rakyat terhadap raja (IV) — sesiapa yang menderhaka akan ditimpa tulah, justeru memastikan kesetiaan rakyat.'},

{n:22,uid:'spm2023-sej-22',form:'F5',topic:'F5 · Bab 6: Cabaran Selepas Pembentukan Malaysia',
 q:'Gambar berikut berkaitan dengan perpaduan kaum di Malaysia.<p style="font-size:.82rem;color:var(--dim);font-style:italic">[Gambar tidak tersedia — rujuk kertas asal]</p>Apakah peranan rakyat dalam memastikan perpaduan tercapai?<br>I Menggubal undang-undang<br>II Menjalinkan hubungan diplomatik<br>III Menggunakan bahasa kebangsaan<br>IV Menghormati agama lain',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:3,
 w:'Peranan rakyat dalam memastikan perpaduan ialah menggunakan bahasa kebangsaan (Bahasa Melayu) sebagai bahasa pertuturan bersama (III) dan menghormati agama yang dianuti oleh kaum lain (IV) — dua amalan harian yang secara langsung membina keharmonian.'},

{n:23,uid:'spm2023-sej-23',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Mengapakah perlembagaan penting terhadap sesebuah negara?',
 o:['Mengekalkan kuasa mutlak raja-raja','Memberikan kebebasan penuh kepada rakyat','Mengekalkan kuasa penuh Kerajaan negeri','Menetapkan hala tuju pemerintahan negara'],
 a:3,
 w:'Perlembagaan penting kerana ia menetapkan hala tuju pemerintahan negara — menjadi undang-undang tertinggi yang menggariskan struktur kerajaan, hak rakyat, dan batas-batas kuasa setiap badan pemerintah demi menjamin kestabilan negara.'},

{n:24,uid:'spm2023-sej-24',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Maklumat berikut berkaitan undang-undang yang diperkenalkan oleh British di Negeri-Negeri Selat.<ul style="margin:8px 0 0 18px"><li>Charter of Justice I</li><li>Charter of Justice II</li><li>Charter of Justice III</li></ul>Mengapakah undang-undang tersebut diperkenalkan?',
 o:['Mengehadkan kuasa raja','Menentang penyebaran agama','Menghalang berlaku penindasan','Mengurangkan peranan pembesar'],
 a:2,
 w:'Charter of Justice diperkenalkan di Negeri-Negeri Selat untuk menghalang berlakunya penindasan terhadap penduduk. Undang-undang ini memperluaskan sistem perundangan Inggeris bagi melindungi rakyat daripada kezaliman dan ketidakadilan.'},

{n:25,uid:'spm2023-sej-25',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Malaysia telah mengamalkan sistem Demokrasi Berparlimen sejak merdeka. Apakah perkara yang berkaitan dengan sistem tersebut?',
 o:['Monarki berkuasa mutlak mengetuai pentadbiran','Badan kehakiman meluluskan undang-undang','Majlis Raja-Raja menggubal undang-undang','Rakyat terlibat dalam pemerintahan negara'],
 a:3,
 w:'Dalam sistem Demokrasi Berparlimen, rakyat terlibat dalam pemerintahan negara melalui pilihan raya. Rakyat memilih wakil mereka ke Parlimen yang kemudiannya menggubal undang-undang dan membentuk kerajaan bagi pihak rakyat.'},

{n:26,uid:'spm2023-sej-26',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Maklumat berikut berkaitan dengan ketua utama Negara dan Negeri.<br><table style="margin:10px 0;border-collapse:collapse;font-size:.85rem"><tr><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Persekutuan</th><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Negeri</th></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">Yang Dipertuan Agong</td><td style="border:1px solid var(--line);padding:6px 10px">X</td></tr></table>Apakah X?',
 o:['Sultan','Menteri Besar','Perdana Menteri','EXCO Kerajaan'],
 a:0,
 w:'X ialah Sultan — ketua utama bagi setiap negeri di Malaysia yang mempunyai raja ialah Sultan (atau Raja). Sultan menjalankan kuasa eksekutif negeri dan merupakan Ketua Negeri dalam sistem Raja Berperlembagaan Malaysia.'},

{n:27,uid:'spm2023-sej-27',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
 q:'Tunku Abdul Rahman mencadangkan wilayah berikut digabungkan dalam satu Persekutuan.<ul style="margin:8px 0 0 18px"><li>Tanah Melayu</li><li>Sabah</li><li>X</li><li>Y</li></ul>Apakah X dan Y?<br>I Indonesia&nbsp;&nbsp;II Singapura&nbsp;&nbsp;III Brunei&nbsp;&nbsp;IV Filipina',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:2,
 w:'X dan Y ialah Singapura (II) dan Brunei (III). Tunku Abdul Rahman dalam ucapannya pada 27 Mei 1961 mencadangkan penggabungan Tanah Melayu, Singapura, Sabah, Sarawak dan Brunei untuk membentuk Malaysia, walaupun Brunei akhirnya tidak menyertai.'},

{n:28,uid:'spm2023-sej-28',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Maklumat berikut berkaitan dengan bidang kuasa Kerajaan Persekutuan.<ul style="margin:8px 0 0 18px"><li>Hal Ehwal Luar Negeri</li><li>Keselamatan Dalam Negeri</li><li>X</li></ul>Apakah X?',
 o:['Pelajaran','Perhutanan','Hiburan Awam','Perancangan bandar'],
 a:0,
 w:'X ialah Pelajaran — ia berada di bawah Senarai Persekutuan dalam Perlembagaan Malaysia. Hal Ehwal Luar Negeri, Keselamatan Dalam Negeri dan Pelajaran semuanya termasuk dalam bidang kuasa eksklusif Kerajaan Persekutuan.'},

{n:29,uid:'spm2023-sej-29',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
 q:'Persekutuan Malaysia dibentuk pada 16 September 1963. Apakah kesan pembentukan tersebut?<br>I Tekanan antarabangsa berkurangan<br>II Bahan mentah dikongsi bersama<br>III Kemerdekaan wilayah terlibat<br>IV Pengaruh British meningkat',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:2,
 w:'Kesan pembentukan Malaysia ialah bahan mentah daripada Sabah, Sarawak dan Semenanjung dapat dikongsi bersama untuk pembangunan negara (II) dan wilayah-wilayah yang bergabung mencapai kemerdekaan penuh daripada British (III).'},

{n:30,uid:'spm2023-sej-30',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
 q:'Singapura menunjukkan minat untuk bergabung dengan Persekutuan Tanah Melayu sejak tahun 1950-an lagi. Mengapakah Singapura berminat dengan penggabungan tersebut?',
 o:['Memberi kerakyatan kepada orang dagang','Mengurangkan perasaan perkauman','Mempercepat proses kemerdekaan','Mempertahan sistem monarki'],
 a:2,
 w:'Singapura berminat bergabung dengan Persekutuan Tanah Melayu kerana penggabungan itu dapat mempercepat proses kemerdekaan Singapura daripada British, memandangkan Singapura belum merdeka sepenuhnya pada masa itu.'},

{n:31,uid:'spm2023-sej-31',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
 q:'Mengapakah British menyokong pembentukan Persekutuan Malaysia?<br>I Dapat menghalang kemasukan imigran<br>II Mampu membendung pengaruh komunis<br>III Berupaya memperkukuh sistem pertahanan<br>IV Boleh mengekalkan sistem pemerintahan beraja',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:2,
 w:'British menyokong pembentukan Malaysia kerana Malaysia mampu membendung pengaruh komunis yang mengancam rantau ini (II) dan berupaya memperkukuh sistem pertahanan bagi menghadapi ancaman keselamatan dengan lebih efektif (III).'},

{n:32,uid:'spm2023-sej-32',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
 q:'Mengapakah Singapura dipisahkan daripada Persekutuan Malaysia pada tahun 1965?',
 o:['Memohon naungan pihak British','Enggan mematuhi dasar kerajaan','Tidak mengiktiraf parti berhaluan kiri','Menurut kehendak kaum bumiputera di negeri lain'],
 a:1,
 w:'Singapura dipisahkan daripada Malaysia pada 9 Ogos 1965 kerana kerajaan Singapura di bawah Lee Kuan Yew enggan mematuhi dasar kerajaan Malaysia, khususnya berkaitan "Malaysia untuk Orang Malaysia" yang menimbulkan ketegangan kaum.'},

{n:33,uid:'spm2023-sej-33',form:'F5',topic:'F5 · Bab 6: Cabaran Selepas Pembentukan Malaysia',
 q:'Berikut adalah prinsip keempat Rukun Negara.<ul style="margin:8px 0 0 18px"><li>Kedaulatan undang-undang</li></ul>Apakah sikap warganegara Malaysia yang menepati prinsip tersebut?',
 o:['Menghormati lagu Negaraku','Mematuhi peraturan jalan raya','Menghormati sesama jiran tetangga','Mematuhi ajaran agama yang dianuti'],
 a:1,
 w:'Prinsip Kedaulatan Undang-Undang Rukun Negara bermaksud semua orang tunduk kepada undang-undang. Mematuhi peraturan jalan raya adalah contoh konkrit seseorang warga negara menghormati undang-undang negara dalam kehidupan seharian.'},

{n:34,uid:'spm2023-sej-34',form:'F5',topic:'F5 · Bab 6: Cabaran Selepas Pembentukan Malaysia',
 q:'Gambar berikut menunjukkan logo Sukan Malaysia (SUKMA) 2022.<p style="font-size:.82rem;color:var(--dim);font-style:italic">[Gambar tidak tersedia — rujuk kertas asal]</p>Apakah tujuan sukan tersebut diadakan?',
 o:['Memantapkan ekonomi negara','Memperkukuh perpaduan rakyat','Memajukan industri pelancongan','Mengimbangi ekonomi antara kaum'],
 a:1,
 w:'SUKMA (Sukan Malaysia) diadakan bertujuan memperkukuh perpaduan rakyat Malaysia. Melalui pertandingan sukan antara negeri, atlet daripada pelbagai kaum dan negeri berinteraksi, membina semangat kerjasama dan meningkatkan integrasi nasional.'},

{n:35,uid:'spm2023-sej-35',form:'F5',topic:'F5 · Bab 8: Membina Kemakmuran Negara',
 q:'Pernyataan berikut matlamat Dasar Ekonomi Baru (DEB) yang dilancarkan pada tahun 1971.<ul style="margin:8px 0 0 18px"><li>Membina perpaduan dan keharmonian dalam kalangan masyarakat</li></ul>Bagaimanakah matlamat tersebut boleh dicapai?',
 o:['Memiliknegarakan industri','Mengurangkan hak milik asing','Sistem kewangan disusun semula','Kekayaan negara dikongsi bersama'],
 a:3,
 w:'Matlamat DEB membina perpaduan dapat dicapai dengan mengongsi kekayaan negara secara adil antara semua kaum. Apabila tiada jurang ekonomi ketara antara kaum, perasaan tidak puas hati akan berkurangan dan perpaduan dapat dipupuk.'},

{n:36,uid:'spm2023-sej-36',form:'F5',topic:'F5 · Bab 8: Membina Kemakmuran Negara',
 q:'Mengapakah Dasar Penswastaan dilaksanakan?',
 o:['Meningkatkan kualiti perkhidmatan','Memperluas pembukaan tanah baharu','Menambah pemilikan modal kaum bumiputera','Memperbanyak syarikat milik pengusaha asing'],
 a:0,
 w:'Dasar Penswastaan dilaksanakan untuk meningkatkan kualiti perkhidmatan dengan memindahkan perkhidmatan awam tertentu kepada swasta. Sektor swasta dianggap lebih cekap dan berkesan dalam mengurus perkhidmatan berbanding birokrasi kerajaan.'},

{n:37,uid:'spm2023-sej-37',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',
 q:'Rajah berikut berkaitan dengan keahlian Persatuan Negara-Negara Asia Tenggara (ASA).<p style="font-size:.82rem;color:var(--dim);font-style:italic">[Rajah tidak tersedia — rujuk kertas asal]</p>Mengapakah negara-negara tersebut menubuhkan ASA?',
 o:['Mengatasi ancaman komunis','Menetapkan kawasan sempadan','Menyelaraskan struktur pentadbiran','Menyeragamkan sistem perundangan'],
 a:0,
 w:'ASA (Association of Southeast Asia) ditubuhkan pada tahun 1961 oleh Malaya, Filipina dan Thailand terutamanya untuk mengatasi ancaman komunis yang semakin meluas di Asia Tenggara, di samping memupuk kerjasama ekonomi dan sosial.'},

{n:38,uid:'spm2023-sej-38',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',
 q:'Malaysia telah menentang Dasar Apartheid yang diamalkan di Afrika Selatan melalui Pertubuhan Bangsa-Bangsa Bersatu (PBB). Mengapakah Malaysia menentang dasar tersebut?',
 o:['Mempertahankan hak penduduk asal','Menghalang program senjata kimia','Memiliknegarakan pelaburan asing','Menghapuskan sekatan perdagangan'],
 a:0,
 w:'Malaysia menentang Dasar Apartheid kerana dasar itu mendiskriminasi penduduk asal Afrika Selatan (kulit hitam) dan melanggar hak asasi manusia. Malaysia berpendirian kukuh bahawa hak penduduk asal mesti dipertahankan tanpa mengira warna kulit.'},

{n:39,uid:'spm2023-sej-39',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',
 q:'Apakah faktor yang mempengaruhi penggubalan dasar luar Malaysia?',
 o:['Pendirian pertubuhan serantau','Kepentingan ekonomi negara','Keperluan ketenteraan','Pengaruh kuasa besar'],
 a:1,
 w:'Faktor utama yang mempengaruhi dasar luar Malaysia ialah kepentingan ekonomi negara. Dasar luar Malaysia digubal bagi memastikan hubungan antarabangsa yang terjalin memberi manfaat ekonomi kepada negara melalui perdagangan dan pelaburan.'},

{n:40,uid:'spm2023-sej-40',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',
 q:'Maklumat berikut berkaitan dengan isu kemanusiaan yang melibatkan rakyat Malaysia.<ul style="margin:8px 0 0 18px"><li>Isu Palestin</li><li>Isu Syria</li><li>Isu Tsunami di Acheh</li></ul>Apakah nilai daripada pelibatan rakyat Malaysia dalam isu tersebut?',
 o:['Bertanggungjawab','Menghargai','Kegigihan','Prihatin'],
 a:3,
 w:'Penglibatan rakyat Malaysia dalam isu kemanusiaan Palestin, Syria dan Tsunami Acheh mencerminkan nilai prihatin — sifat peka dan ambil berat terhadap penderitaan orang lain walaupun berlainan bangsa, agama atau negara.'}

{n:1,uid:'spm2024-sej-01',form:'F4',topic:'F4 · Bab 1: Warisan Negara Bangsa',
 q:'Apakah yang menentukan kuasa dan pengaruh seorang raja terhadap sesebuah wilayah dalam sistem politik Melayu tradisional?',
 o:['Persamaan budaya','Kesetiaan rakyat','Kegiatan ekonomi','Konsep kepercayaan'],
 a:1,
 w:'Dalam sistem politik Melayu tradisional, kuasa dan pengaruh raja ditentukan oleh kesetiaan rakyat. Semakin ramai rakyat yang setia dan patuh kepada raja, semakin luas kawasan pengaruh dan kuasa raja tersebut.'},

{n:2,uid:'spm2024-sej-02',form:'F4',topic:'F4 · Bab 1: Warisan Negara Bangsa',
 q:'Mengapakah Kesultanan Melayu Melaka menjadi kerajaan Melayu yang terkenal?<br>I Pemerintah mempunyai wawasan<br>II Berada di laluan yang strategik<br>III Mendapat bantuan dari luar<br>IV Dinaungi kuasa besar',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:0,
 w:'Kesultanan Melayu Melaka terkenal kerana pemerintahnya mempunyai wawasan dalam membangunkan kerajaan (I) dan letaknya yang strategik di Selat Melaka menjadikannya pusat perdagangan utama di antara timur dan barat (II).'},

{n:3,uid:'spm2024-sej-03',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Novel berikut dihasilkan pada abad ke-20 di Asia Tenggara.<ul style="margin:8px 0 0 18px"><li>Habis Gelap Terbitlah Terang</li><li>Melor Kuala Lumpur</li></ul>Bagaimanakah novel tersebut dapat menyemarakkan semangat nasionalisme di Asia Tenggara?',
 o:['Memuatkan kegiatan ekonomi penjajah','Mendedahkan penindasan terhadap rakyat','Mengulas kemajuan penduduk negara luar','Mengkritik kelemahan pemimpin tempatan'],
 a:1,
 w:'Novel-novel nasionalis ini menyemarakkan semangat nasionalisme dengan mendedahkan penindasan dan kezaliman penjajah terhadap rakyat tempatan, membangkitkan kesedaran rakyat tentang penderitaan yang dialami dan keperluan untuk merdeka.'},

{n:4,uid:'spm2024-sej-04',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Pasangan pernyataan yang manakah betul tentang tujuan gerakan nasionalisme di Thailand dengan gerakan nasionalisme di negara lain di Asia Tenggara?<br><table style="margin:10px 0;border-collapse:collapse;font-size:.85rem"><tr><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Gerakan Nasionalisme di Thailand</th><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Gerakan Nasionalisme di Negara Lain</th></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">A Menentang kuasa asing</td><td style="border:1px solid var(--line);padding:6px 10px">Menentang sistem beraja</td></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">B Menentang raja berkuasa mutlak</td><td style="border:1px solid var(--line);padding:6px 10px">Menentang penjajahan oleh kuasa asing</td></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">C Mengembalikan kuasa bangsawan</td><td style="border:1px solid var(--line);padding:6px 10px">Mengembalikan kuasa golongan agama</td></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">D Membela nasib kaum imigran</td><td style="border:1px solid var(--line);padding:6px 10px">Mengurangkan bilangan kaum imigran</td></tr></table>',
 o:['A','B','C','D'],
 a:1,
 w:'Pasangan yang betul ialah B — nasionalisme Thailand menentang raja berkuasa mutlak (bukan penjajah asing kerana Thailand tidak dijajah), manakala nasionalisme negara lain di Asia Tenggara menentang penjajahan oleh kuasa asing seperti British, Belanda dan Perancis.'},

{n:5,uid:'spm2024-sej-05',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Perang Dunia Pertama tercetus pada tahun 1914 memberi kesan besar terhadap penduduk dunia. Mengapakah perang tersebut tercetus?',
 o:['Pembunuhan pewaris takhta Austria-Hungary','Pencerobohan terhadap wilayah Jerman','Persengketaan Rusia dengan Britain','Pengeboman Pearl Harbour'],
 a:0,
 w:'Perang Dunia Pertama tercetus akibat pembunuhan Archduke Franz Ferdinand, pewaris takhta Austria-Hungary, di Sarajevo pada 28 Jun 1914. Pembunuhan ini mencetuskan reaksi berantai di kalangan kuasa-kuasa Eropah yang terikat dengan pakatan tentera.'},

{n:6,uid:'spm2024-sej-06',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Pakatan kuasa berikut ditubuhkan di Eropah pada awal abad ke-20.<ul style="margin:8px 0 0 18px"><li>Kuasa Tengah</li><li>Pakatan Bertiga</li></ul>Antara berikut, yang manakah faktor pencetus peperangan antara kedua-dua pakatan kuasa tersebut?<br>I Perjuangan untuk mengekalkan kemerdekaan<br>II Perlumbaan untuk memperluas kawasan pengaruh<br>III Persaingan untuk menguasai sumber bahan mentah<br>IV Percubaan untuk mewujudkan pertubuhan antarabangsa',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:2,
 w:'Faktor pencetus peperangan antara Kuasa Tengah dan Pakatan Bertiga ialah perlumbaan memperluas kawasan pengaruh (imperialisme) (II) dan persaingan untuk menguasai sumber bahan mentah yang diperlukan bagi pembangunan ekonomi dan tentera (III).'},

{n:7,uid:'spm2024-sej-07',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Maklumat berikut berkaitan dengan fahaman ideologi politik.<br><div style="border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:10px 0;background:var(--panel2);font-size:.9rem">X — Sesuatu fahaman politik yang menjadikan ekonomi dan barang pengguna sebagai milik negara.</div>Apakah X?',
 o:['Feudalisme','Sosialisme','Kapitalisme','Komunisme'],
 a:3,
 w:'X ialah Komunisme — ideologi yang menjadikan ekonomi dan barang pengeluaran/pengguna sebagai milik negara (harta awam). Dalam sistem komunis, kerajaan mengawal semua aspek ekonomi dan tiada pemilikan persendirian yang bermakna.'},

{n:8,uid:'spm2024-sej-08',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Mengapakah Raja-raja Melayu dari Kedah, Perak dan Johor menghantar surat bantahan kepada George Henry Hall di London pada tahun 1946?',
 o:['Mengkritik undang-undang Barat','Memaklumkan keputusan mesyuarat','Menghalang British melanggar perjanjian','Mendakwa diperdaya wakil kerajaan British'],
 a:2,
 w:'Raja-Raja Melayu menghantar surat bantahan kerana mahu menghalang British melanggar perjanjian yang telah dimeterai antara Raja-Raja Melayu dengan British sebelum ini. Malayan Union dianggap melanggar perjanjian tersebut kerana mengurangkan kuasa raja.'},

{n:9,uid:'spm2024-sej-09',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Perkara berikut merupakan satu daripada syarat Malayan Union yang dilaksanakan oleh British pada tahun 1946.<br><div style="border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:10px 0;background:var(--panel2);font-size:.9rem">Kerakyatan jus soli</div>Mengapakah orang Melayu menentang syarat tersebut?',
 o:['Persaingan dengan orang asing','Taraf negeri naungan dikekalkan','Kuasa golongan pembesar meluas','Fahaman komunis mudah bertapak'],
 a:0,
 w:'Orang Melayu menentang kerakyatan jus soli kerana syarat ini memberi kerakyatan automatik kepada semua yang lahir di Tanah Melayu, bermakna kaum pendatang (Cina dan India) mendapat taraf setara, menimbulkan persaingan dengan orang Melayu.'},

{n:10,uid:'spm2024-sej-10',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Pada 1 Julai 1946, Vyner Brooke menyerahkan Sarawak kepada kerajaan British. Apakah kesan tindakan Vyner Brooke tersebut terhadap Sarawak?',
 o:['Mendapat taraf pemerintahan sendiri','Menjadi tanah jajahan kuasa asing','Kaum imigran semakin berkurang','Wilayah-wilayah kecil bersatu'],
 a:1,
 w:'Akibat penyerahan Vyner Brooke, Sarawak menjadi tanah jajahan British secara rasmi. Sebelum itu, Sarawak di bawah pemerintahan Brooke White Rajahs — jadi penyerahan ini menukar status Sarawak kepada tanah jajahan kerajaan British.'},

{n:11,uid:'spm2024-sej-11',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Perjanjian Persekutuan Tanah Melayu 1948 telah ditandatangani oleh Raja-raja Melayu pada 1 Februari 1948. Apakah kesan perjanjian tersebut terhadap Tanah Melayu?',
 o:['Komposisi kaum seimbang','Berpeluang berkerajaan sendiri','Kuasa kerajaan negeri berkurang','Undang-undang tradisional mansuh'],
 a:1,
 w:'PTM 1948 memberi peluang kepada Tanah Melayu berkerajaan sendiri. Perjanjian ini memulihkan kedaulatan Raja-Raja Melayu dan mewujudkan rangka pentadbiran yang membuka laluan ke arah pemerintahan sendiri sebelum mencapai kemerdekaan.'},

{n:12,uid:'spm2024-sej-12',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Mengapakah British bersetuju menerima cadangan pembentukan Persekutuan Tanah Melayu 1948?',
 o:['Memudahkan pelaksanaan pilihan raya umum','Melambatkan proses kemerdekaan tanah air','Mengurangkan pengaruh golongan radikal','Memulihkan kuasa golongan bangsawan'],
 a:2,
 w:'British bersetuju membentuk PTM 1948 kerana ia dapat mengurangkan pengaruh golongan nasionalis radikal yang menuntut kemerdekaan dengan lebih agresif. PTM 1948 memberikan orang Melayu hak yang dijanjikan, mengurangkan sokongan kepada golongan radikal.'},

{n:13,uid:'spm2024-sej-13',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Sistem pendaftaran kebangsaan dan kad pengenalan diperkenalkan pada tahun 1948. Bagaimanakah langkah tersebut dapat membantu British melemahkan komunis?',
 o:['Menambah anggota keselamatan kerajaan','Meningkatkan kesetiaan rakyat terhadap kerajaan','Memudahkan pengiraan jumlah penduduk tempatan','Memudahkan pihak berkuasa mengenal pasti orang awam'],
 a:3,
 w:'Sistem kad pengenalan memudahkan pihak berkuasa mengenal pasti orang awam daripada anggota komunis. Dengan kad pengenalan, pihak keselamatan dapat membezakan penduduk berdaftar daripada penyokong komunis yang menyamar sebagai orang awam.'},

{n:14,uid:'spm2024-sej-14',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Maklumat berikut berkaitan dengan pertubuhan politik di Tanah Melayu.<br><table style="margin:10px 0;border-collapse:collapse;font-size:.85rem"><tr><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Tahun</th><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Pertubuhan</th></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">1938</td><td style="border:1px solid var(--line);padding:6px 10px">Kesatuan Melayu Muda</td></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">1945</td><td style="border:1px solid var(--line);padding:6px 10px">Parti Kebangsaan Melayu Malaya</td></tr></table>Apakah persamaan matlamat perjuangan pertubuhan tersebut?',
 o:['Konsep "Merdeka dengan Darah"','Merdeka melalui konsep Melayu Raya','Mengutamakan slogan Malaya untuk Melayu','Penubuhan sebuah parti politik pelbagai kaum'],
 a:1,
 w:'Persamaan matlamat KMM dan PKMM ialah memperjuangkan kemerdekaan melalui konsep Melayu Raya — gagasan menyatukan Tanah Melayu dengan Indonesia di bawah satu entiti Melayu yang besar, bebas dari penjajahan Barat.'},

{n:15,uid:'spm2024-sej-15',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Sistem Ahli diperkenalkan di Tanah Melayu pada tahun 1951. Bagaimanakah sistem tersebut dapat memperkukuh perpaduan rakyat?',
 o:['Ahli dipantau oleh suruhanjaya bebas','Undang-undang anti perkauman digubal','Ahli dilantik dalam kalangan pelbagai kaum','Mewajibkan penggunaan bahasa kebangsaan'],
 a:2,
 w:'Sistem Ahli memperkukuh perpaduan dengan melantik Ahli daripada pelbagai kaum (Melayu, Cina dan India) untuk memegang portfolio kementerian. Lantikan berbilang kaum ini mendorong kerjasama dan persefahaman dalam pentadbiran negara.'},

{n:16,uid:'spm2024-sej-16',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Maklumat berikut merujuk kepada keanggotaan Sistem Ahli.<br><table style="margin:10px 0;border-collapse:collapse;font-size:.85rem"><tr><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Nama Ahli</th><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Portfolio</th></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">Dato Onn Jaafar</td><td style="border:1px solid var(--line);padding:6px 10px">Ahli Dalam Negeri</td></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">Dr. Lee Tiang Keng</td><td style="border:1px solid var(--line);padding:6px 10px">Ahli Kesihatan</td></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">Dato EEC Thuraisingam</td><td style="border:1px solid var(--line);padding:6px 10px">Ahli Pelajaran</td></tr></table>Apakah peranan ahli tersebut?<br>I Mengetuai portfolio<br>II Meluluskan undang-undang<br>III Membuat dasar tertinggi negara<br>IV Menguruskan pentadbiran harian jabatan',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:1,
 w:'Peranan Ahli dalam Sistem Ahli ialah mengetuai portfolio masing-masing (I) dan menguruskan pentadbiran harian jabatan tersebut (IV). Mereka bertanggungjawab atas pentadbiran jabatan tetapi kuasa meluluskan undang-undang kekal pada British.'},

{n:17,uid:'spm2024-sej-17',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Mengapakah pilihan raya umum pertama Tanah Melayu pada tahun 1955 diadakan?<br>I Mengawal pemberian kerakyatan kepada orang asing<br>II Memperkukuh kerjasama rakyat dalam politik<br>III Mempercepat proses kemerdekaan tanah air<br>IV Menghalang kemasukan kaum imigran',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:2,
 w:'PRU pertama Tanah Melayu 1955 diadakan untuk memperkukuh kerjasama rakyat dalam politik melalui penyertaan demokratik (II) dan untuk mempercepat proses kemerdekaan dengan menunjukkan kematangan politik rakyat kepada British (III).'},

{n:18,uid:'spm2024-sej-18',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Kabinet pertama dibentuk selepas pilihan raya umum di Tanah Melayu pada tahun 1955. Mengapakah pembentukan kabinet tersebut penting?',
 o:['Menyekat pengaruh komunis','Memperkukuh kesetiaan rakyat','Membuktikan penyatuan parti politik','Memperjuangkan pentadbiran tempatan'],
 a:0,
 w:'Pembentukan kabinet pertama selepas PRU 1955 penting kerana ia menyekat pengaruh komunis. Kerajaan terpilih menunjukkan bahawa rakyat menyokong sistem demokrasi, mengurangkan tarikan ideologi komunis dalam kalangan penduduk.'},

{n:19,uid:'spm2024-sej-19',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Apakah isu yang menjadi perhatian terma rujukan Suruhanjaya Perlembagaan dalam merangka Perlembagaan Persekutuan Tanah Melayu 1957?',
 o:['Mengekalkan raja berkuasa mutlak','Mewujudkan kerajaan negeri yang kuat','Menyediakan satu bentuk kewarganegaraan','Mengukuhkan kedudukan rakyat pelbagai kaum'],
 a:2,
 w:'Isu utama dalam terma rujukan Suruhanjaya Reid ialah menyediakan satu bentuk kewarganegaraan yang merangkumi semua kaum di Tanah Melayu, bagi mewujudkan rakyat yang bersatu dan memiliki identiti bersama sebagai warganegara Tanah Melayu.'},

{n:20,uid:'spm2024-sej-20',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Apakah yang perlu dilakukan sebagai rakyat dalam sebuah negara yang merdeka?',
 o:['Membebaskan diri daripada pengaruh asing yang negatif','Meningkatkan usaha demi kepentingan peribadi','Meninggalkan norma-norma tradisional bangsa','Menyumbang dana untuk pemimpin'],
 a:0,
 w:'Sebagai rakyat negara merdeka, kita perlu membebaskan diri daripada pengaruh asing yang negatif supaya nilai dan jati diri bangsa terpelihara. Negara merdeka sepatutnya menentukan hala tujunya sendiri tanpa terpengaruh dengan agenda kuasa luar yang memudaratkan.'},

{n:21,uid:'spm2024-sej-21',form:'F5',topic:'F5 · Bab 6: Cabaran Selepas Pembentukan Malaysia',
 q:'Maklumat berikut berkaitan pengisytiharan darurat di negara kita.<ul style="margin:8px 0 0 18px"><li>Peristiwa berdarah 13 Mei 1969</li><li>Jerebu 1997, 2005, 2013</li><li>Wabak Covid-19, 2021</li></ul>Mengapakah kerajaan melaksanakan tindakan tersebut?',
 o:['Menyekat campur tangan negara asing','Keharmonian hidup rakyat dipelihara','Kesetiaan rakyat dapat ditingkatkan','Melicinkan pemindahan penduduk'],
 a:1,
 w:'Kerajaan mengisytiharkan darurat dalam situasi krisis (tragedi kaum, jerebu, wabak) kerana tindakan tersebut diperlukan untuk memelihara keharmonian hidup rakyat dengan memberi kuasa kepada kerajaan bertindak pantas mengatasi keadaan kecemasan.'},

{n:22,uid:'spm2024-sej-22',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Apakah maksud negara yang berdaulat?',
 o:['Memiliki pemerintahan sendiri','Mempunyai wilayah yang luas','Mendapat naungan kuasa besar','Mengamalkan sistem demokrasi'],
 a:0,
 w:'Negara berdaulat bermaksud negara yang memiliki pemerintahan sendiri tanpa campur tangan pihak luar. Ia bebas menentukan dasar dalam dan luar negeri, mempunyai wilayah, rakyat dan kerajaan yang diiktiraf oleh komuniti antarabangsa.'},

{n:23,uid:'spm2024-sej-23',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Mengapakah British memperkenalkan Charter of Justice di Negeri-Negeri Selat pada abad ke-19?',
 o:['Membendung keganasan komunis','Mempelbagaikan kegiatan ekonomi','Menghalang campur tangan kuasa asing','Mengelakkan penindasan terhadap penduduk'],
 a:3,
 w:'Charter of Justice diperkenalkan di Negeri-Negeri Selat untuk mengelakkan penindasan terhadap penduduk. Undang-undang ini memperluaskan sistem perundangan British bagi melindungi rakyat daripada kezaliman dan memastikan keadilan ditegakkan.'},

{n:24,uid:'spm2024-sej-24',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
 q:'Pada tahun 1963, Perlembagaan Persekutuan Tanah Melayu telah dipinda. Mengapakah pindaan tersebut dilakukan?',
 o:['Pemansuhan darurat','Pemisahan Singapura','Pembubaran Parlimen','Pembentukan Malaysia'],
 a:3,
 w:'Perlembagaan Persekutuan Tanah Melayu dipinda pada tahun 1963 untuk mengambil kira pembentukan Malaysia. Pindaan diperlukan bagi memasukkan peruntukan baharu berkaitan kemasukan Sabah, Sarawak dan Singapura ke dalam Persekutuan.'},

{n:25,uid:'spm2024-sej-25',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Apakah perkara yang berkaitan dengan sistem Demokrasi Berparlimen yang diamalkan oleh Malaysia sejak merdeka?',
 o:['Perlembagaan ditetapkan oleh Yang di-Pertuan Agong','Pentadbiran dikuasai monarki berkuasa mutlak','Badan kehakiman menggubal undang-undang','Rakyat terlibat dalam pemerintahan negara'],
 a:3,
 w:'Dalam sistem Demokrasi Berparlimen Malaysia, rakyat terlibat dalam pemerintahan negara melalui pilihan raya yang bebas dan adil. Rakyat memilih wakil mereka ke Parlimen, dan kerajaan dibentuk oleh parti atau gabungan yang mendapat majoriti.'},

{n:26,uid:'spm2024-sej-26',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Maklumat berikut berkaitan dengan ketua utama Persekutuan dan Negeri.<ul style="margin:8px 0 0 18px"><li>Selangor</li><li>Pahang</li><li>Perak</li><li>Negeri Sembilan</li></ul>Mengapakah British menyatukan negeri-negeri tersebut dalam sebuah Persekutuan?',
 o:['Meningkatkan kutipan cukai','Memperkukuh kuasa sultan','Memudahkan pentadbiran','Mengawal kaum dagang'],
 a:2,
 w:'British menyatukan Selangor, Pahang, Perak dan Negeri Sembilan dalam Negeri-Negeri Melayu Bersekutu (1896) bertujuan memudahkan pentadbiran. Penyatuan membolehkan British mentadbir secara berpusat dengan lebih cekap dan menjimatkan kos.'},

{n:27,uid:'spm2024-sej-27',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
 q:'Perlembagaan Persekutuan memberikan kuasa tambahan di bawah Senarai Negeri kepada Sarawak dan Sabah. Apakah kuasa tambahan tersebut?',
 o:['Pertahanan','Hak kewarganegaraan','Undang-undang Islam','Mahkamah Anak Negeri'],
 a:3,
 w:'Sabah dan Sarawak mendapat kuasa tambahan termasuk Mahkamah Anak Negeri yang mengendali kes melibatkan adat resam dan undang-undang pribumi Sabah dan Sarawak. Ini merupakan hak istimewa yang dipersetujui semasa perundingan pembentukan Malaysia.'},

{n:28,uid:'spm2024-sej-28',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Jadual berikut berkaitan kuasa Yang di-Pertuan Agong dalam Persekutuan.<br><table style="margin:10px 0;border-collapse:collapse;font-size:.85rem"><tr><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Yang di-Pertuan Agong</th></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">Eksekutif &nbsp;&nbsp;&nbsp; X &nbsp;&nbsp;&nbsp; Kehakiman</td></tr></table>Apakah bidang kuasa X?',
 o:['Membuat pengisytiharan darurat','Mempunyai kuasa pengampunan','Memperkenan perubahan sempadan','Melantik menteri dalam pentadbiran'],
 a:3,
 w:'X ialah kuasa Perundangan (Legislatif) — Yang di-Pertuan Agong mempunyai kuasa melantik menteri dalam pentadbiran, yang merupakan sebahagian daripada kuasa eksekutif. Baginda merupakan ketua tiga cabang kerajaan: Eksekutif, Perundangan dan Kehakiman.'},

{n:29,uid:'spm2024-sej-29',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
 q:'Mengapakah pembentukan Malaysia ditunda dari 31 Ogos 1963 ke 16 September 1963?',
 o:['Tentangan daripada negara jiran','Sekatan perdagangan oleh negara lain','Serangan Tentera Nasional Kalimantan Utara','Halangan Pertubuhan Bangsa-Bangsa Bersatu'],
 a:0,
 w:'Pembentukan Malaysia ditunda kerana tentangan daripada negara jiran — Indonesia di bawah Sukarno melancarkan Dasar Konfrontasi manakala Filipina menuntut Sabah. Penundaan dilakukan menunggu siasatan PBB (Suruhanjaya Cobbold) mengesahkan sokongan rakyat.'},

{n:30,uid:'spm2024-sej-30',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
 q:'Apakah faktor yang menjayakan kemerdekaan dan pembentukan Malaysia?',
 o:['Penduduk terdiri daripada pelbagai bangsa','Desakan daripada kumpulan radikal','Semangat toleransi menjadi amalan','Pemimpin menjaga kepentingan kaum masing-masing'],
 a:2,
 w:'Faktor utama yang menjayakan kemerdekaan dan pembentukan Malaysia ialah semangat toleransi yang menjadi amalan dalam kalangan pelbagai kaum. Toleransi membolehkan pemimpin berbilang kaum berunding dan mencapai persetujuan bagi mewujudkan negara yang aman.'},

{n:31,uid:'spm2024-sej-31',form:'F5',topic:'F5 · Bab 6: Cabaran Selepas Pembentukan Malaysia',
 q:'Mengapakah Pilihan Raya Umum Ketiga menjadi pencetus berlakunya peristiwa rusuhan kaum pada 13 Mei 1969?',
 o:['Kewibawaan calon pilihan raya dipertikai','Kempen melibatkan isu sensitiviti kaum','Keputusan pemilihan tidak adil','Keadaan politik negara asing'],
 a:1,
 w:'PRU Ketiga 1969 mencetuskan rusuhan 13 Mei kerana kempen pilihan raya melibatkan isu sensitiviti kaum. Parti pembangkang menggunakan isu sensitif berkaitan hak kaum semasa berkempen, mencetuskan ketegangan yang meledak menjadi rusuhan selepas pengumuman keputusan.'},

{n:32,uid:'spm2024-sej-32',form:'F5',topic:'F5 · Bab 6: Cabaran Selepas Pembentukan Malaysia',
 q:'Penyebaran berita palsu telah menyukarkan usaha Majlis Gerakan Negara (MAGERAN) menyelesaikan konflik peristiwa 13 Mei 1969. Bagaimanakah kerajaan berusaha mengatasi penyebaran berita palsu tersebut?<br>I Menggantung penerbitan akhbar tempatan<br>II Mengawal penulisan oleh wartawan tempatan<br>III Merombak semula struktur Jabatan Penerangan<br>IV Menguatkuasa Akta Hasutan 1948',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:1,
 w:'Kerajaan mengatasi berita palsu dengan menggantung penerbitan akhbar tempatan sementara waktu (I) dan menguatkuasakan Akta Hasutan 1948 terhadap mereka yang menyebarkan berita yang boleh mencetuskan permusuhan kaum (IV).'},

{n:33,uid:'spm2024-sej-33',form:'F5',topic:'F5 · Bab 6: Cabaran Selepas Pembentukan Malaysia',
 q:'Maklumat berikut berkaitan matlamat pembentukan Dasar Kebudayaan Kebangsaan.<ul style="margin:8px 0 0 18px"><li>Mengukuhkan perpaduan bangsa</li><li>Memelihara keperibadian kebangsaan</li><li>Mempertingkatkan kualiti kehidupan</li></ul>Bagaimanakah matlamat tersebut dicapai?',
 o:['Menggalakkan perkahwinan campur','Menubuhkan kongres kepelbagaian kaum','Memperkasakan penggunaan bahasa asing','Memperkenalkan Program Citrawarna Kebangsaan'],
 a:3,
 w:'Matlamat Dasar Kebudayaan Kebangsaan dicapai melalui pengenalan Program Citrawarna Kebangsaan yang mempamerkan kekayaan budaya pelbagai kaum Malaysia. Program ini memperkukuh perpaduan dengan meraikan kepelbagaian budaya di bawah satu identiti kebangsaan.'},

{n:34,uid:'spm2024-sej-34',form:'F5',topic:'F5 · Bab 6: Cabaran Selepas Pembentukan Malaysia',
 q:'Maklumat berikut berkaitan dengan perkembangan kurikulum pendidikan di Malaysia.<br><table style="margin:10px 0;border-collapse:collapse;font-size:.85rem"><tr><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Tahun</th><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Kurikulum</th></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">1982</td><td style="border:1px solid var(--line);padding:6px 10px">Kurikulum Baru Sekolah Rendah (KBSR)</td></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">1988</td><td style="border:1px solid var(--line);padding:6px 10px">Kurikulum Bersepadu Sekolah Menengah (KBSM)</td></tr></table>Apakah persamaan kandungan kurikulum tersebut?',
 o:['Kenaikan darjah dan tingkatan secara automatik','Menekankan aktiviti berkaitan kursus kemahiran','Menggalakkan penggunaan bahasa Inggeris dan asing','Kemahiran aliran vokasional dan teknikal diperkenalkan'],
 a:3,
 w:'Persamaan KBSR dan KBSM ialah kedua-duanya memperkenalkan kemahiran aliran vokasional dan teknikal dalam kurikulum. Kedua-dua kurikulum ini menekankan pendidikan bersepadu yang menggabungkan pengetahuan akademik dengan kemahiran amali.'},

{n:35,uid:'spm2024-sej-35',form:'F5',topic:'F5 · Bab 8: Membina Kemakmuran Negara',
 q:'Senarai berikut berkaitan rancangan pembangunan di bawah Dasar Ekonomi Baru.<ul style="margin:8px 0 0 18px"><li>Rancangan Malaysia Kedua (1971–1975)</li><li>Rancangan Malaysia Ketiga (1976–1980)</li></ul>Mengapakah rancangan tersebut diperkenalkan?',
 o:['Mengimbangi sosioekonomi rakyat','Mengukuhkan keamanan serantau','Memanfaatkan sumber tempatan','Melancarkan pentadbiran negara'],
 a:0,
 w:'Rancangan Malaysia Kedua dan Ketiga diperkenalkan untuk mengimbangi sosioekonomi rakyat melalui pelaksanaan DEB. Objektifnya ialah membasmi kemiskinan tanpa mengira kaum dan menyusun semula masyarakat bagi mengurangkan ketidakseimbangan ekonomi antara kaum.'},

{n:36,uid:'spm2024-sej-36',form:'F5',topic:'F5 · Bab 8: Membina Kemakmuran Negara',
 q:'Apakah matlamat Dasar Penswastaan yang dilancarkan dalam Rancangan Malaysia Keempat pada bulan Mac 1983?',
 o:['Memperhebat pembukaan tanah','Meningkatkan kemudahan fizikal','Meningkatkan kualiti perkhidmatan','Mengimbangi pemilikan harta antara kaum'],
 a:2,
 w:'Matlamat utama Dasar Penswastaan 1983 ialah meningkatkan kualiti perkhidmatan dengan memindahkan pengurusan perkhidmatan awam tertentu kepada swasta yang lebih cekap dan berorientasikan keuntungan bagi kepentingan pengguna.'},

{n:37,uid:'spm2024-sej-37',form:'F5',topic:'F5 · Bab 8: Membina Kemakmuran Negara',
 q:'Maklumat berikut berkaitan agensi yang ditubuhkan untuk meningkatkan pencapaian ekonomi masyarakat luar bandar.<ul style="margin:8px 0 0 18px"><li>Lembaga Kemajuan Johor Tenggara (KEJORA)</li><li>Lembaga Kemajuan Terengganu Tengah (KETENGAH)</li><li>Lembaga Kemajuan Pahang Tenggara (DARA)</li></ul>Bagaimanakah agensi tersebut berperanan?',
 o:['Membaikpulih penempatan tersusun','Memperluas tanaman komersial','Menubuhkan institusi kewangan','Memberi bantuan dana'],
 a:1,
 w:'KEJORA, KETENGAH dan DARA berperanan memperluas tanaman komersial di kawasan pembangunan masing-masing. Agensi-agensi ini membuka tanah baharu untuk penanaman kelapa sawit dan getah bagi meningkatkan pendapatan dan taraf hidup petani luar bandar.'},

{n:38,uid:'spm2024-sej-38',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',
 q:'Apakah kesan tindakan berikut terhadap negara kita?<br><table style="margin:10px 0;border-collapse:collapse;font-size:.85rem"><tr><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Isu</th><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Tindakan Malaysia</th></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">Pencerobohan kuasa asing di Palestin dan Iraq</td><td style="border:1px solid var(--line);padding:6px 10px">Menyuarakan pandangan tentang isu pencerobohan luar</td></tr></table>',
 o:['Menaikkan imej negara','Mendapat bantuan pertahanan','Mengelakkan persaingan kuasa','Mempertahankan keselamatan negara'],
 a:0,
 w:'Tindakan Malaysia menyuarakan pendirian terhadap isu Palestin dan Iraq secara berani di pentas antarabangsa telah menaikkan imej negara. Malaysia dilihat sebagai negara kecil yang berani bercakap benar dan membela negara yang dizalimi.'},

{n:39,uid:'spm2024-sej-39',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',
 q:'Malaysia menjalin hubungan serantau dengan beberapa buah negara. Apakah kesan hubungan tersebut?',
 o:['Kemasukan imigran bertambah','Hasil bumi dikongsi bersama','Wilayah pentadbiran meluas','Kedaulatan negara terjamin'],
 a:3,
 w:'Kesan utama hubungan serantau Malaysia ialah kedaulatan negara terjamin. Melalui kerjasama ASEAN dan pertubuhan serantau lain, Malaysia mendapat sokongan negara-negara jiran dalam mempertahankan kedaulatan dan integriti wilayahnya.'},

{n:40,uid:'spm2024-sej-40',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',
 q:'Apakah isu yang dibincangkan dalam persidangan berikut?<br><div style="border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:10px 0;background:var(--panel2);font-size:.9rem">Sidang Kemuncak Bumi di Rio de Janeiro, Brazil pada 3 hingga 14 Jun 1992.</div>',
 o:['Polarisasi kaum','Kepadatan penduduk','Kekurangan bekalan air','Pencemaran alam sekitar'],
 a:3,
 w:'Sidang Kemuncak Bumi (Earth Summit) di Rio de Janeiro 1992 membincangkan isu pencemaran alam sekitar dan pembangunan mampan. Persidangan ini menghasilkan Agenda 21 dan Deklarasi Rio berkaitan perlindungan alam sekitar untuk generasi akan datang.'}
