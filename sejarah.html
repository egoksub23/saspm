{n:4,uid:'jhr-sej-26-04',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Novel berikut dihasilkan bagi meningkatkan nasionalisme dalam kalangan penduduk tempatan.<br><ul style="margin:8px 0 0 18px"><li>Angan-angan dalam Gurindam</li><li>Serunai Pujangga</li></ul><br>Apakah tema penulisan novel tersebut?',
 o:['Anti imperialisme','Kemajuan ekonomi','Semangat cinta negara','Perjuangan pendidikan'],
 a:2,
 w:'"Angan-angan dalam Gurindam" dan "Serunai Pujangga" mengandungi tema semangat cinta negara bagi menyemai perasaan cintakan tanah air dan membangkitkan kesedaran nasionalisme dalam kalangan penduduk tempatan.'},

{n:5,uid:'jhr-sej-26-05',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Pernyataan berikut menerangkan kesan Perang Dunia Kedua.<br><div style="border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:10px 0;background:var(--panel2);font-size:.9rem">Perang di Eropah dan di Asia Pasifik telah mengorbankan hampir 75 juta nyawa dan membawa kemusnahan harta benda</div>Apakah iktibar yang boleh diambil daripada peristiwa tersebut?',
 o:['Menghargai nikmat keamanan','Kesepakatan membawa berkat','Kekuatan tentera harus diutamakan','Pemimpin berwibawa asas kejayaan'],
 a:0,
 w:'Kemusnahan besar Perang Dunia Kedua yang mengorbankan 75 juta nyawa mengajar kita untuk sentiasa menghargai nikmat keamanan yang ada dan berusaha mengelakkan peperangan pada masa hadapan.'},

{n:6,uid:'jhr-sej-26-06',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Gambar berikut menunjukkan peristiwa kekejaman penjajahan Jepun di Tanah Melayu.<br><p style="font-size:.82rem;color:var(--dim);margin:8px 0;font-style:italic">[Gambar: Kekejaman tentera Jepun terhadap penduduk tempatan di Tanah Melayu semasa Perang Dunia Kedua]</p>Apakah tindakan penduduk tempatan dalam menghadapi kekejaman tersebut?',
 o:['Menyokong gerakan Islah','Mengadakan tunjuk perasaan','Melibatkan diri dalam persatuan','Memberi kerjasama dengan British'],
 a:3,
 w:'Menghadapi kekejaman Jepun, penduduk tempatan memilih memberi kerjasama kepada British. Gerakan Anti-Jepun Rakyat Malaya (MPAJA) yang disokong British menjadi saluran perlawanan terhadap kekejaman penjajahan Jepun.'},

{n:7,uid:'jhr-sej-26-07',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Mengapakah terdapat penduduk yang menyokong proses penyerahan Sarawak kepada British?<br><br>I&nbsp;&nbsp;&nbsp;&nbsp;Memberikan peluang pekerjaan<br>II&nbsp;&nbsp;&nbsp;Memperjuangkan hak penduduk<br>III&nbsp;&nbsp;Mengatasi masalah kewangan<br>IV&nbsp;&nbsp;Memajukan penduduk tempatan',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:1,
 w:'Penduduk menyokong penyerahan Sarawak kepada British kerana British dapat memberikan peluang pekerjaan yang lebih baik (I) dan memajukan taraf hidup penduduk tempatan (IV) berbanding pemerintahan Brooke yang terhad sumber dan pembangunannya.'},

{n:8,uid:'jhr-sej-26-08',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Pada tahun 1946, Syarikat Borneo Utara British (SBUB) menandatangani perjanjian penyerahan Sabah dengan kerajaan British. Mengapakah SBUB bertindak demikian?',
 o:['Desakan kerajaan British','Perebutan kuasa pemerintahan','Masalah pewarisan takhta','Kekurangan dana'],
 a:3,
 w:'SBUB menyerahkan Sabah kepada British kerana menghadapi masalah kekurangan dana untuk mentadbir Sabah selepas kemusnahan akibat Perang Dunia Kedua. Kos pentadbiran dan pembinaan semula yang tinggi tidak mampu ditanggung oleh SBUB.'},

{n:9,uid:'jhr-sej-26-09',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Persekutuan Tanah Melayu telah ditubuhkan secara rasmi pada 1 Februari 1948 setelah berjaya menolak Malayan Union. Bagaimanakah kejayaan tersebut dapat dicapai?',
 o:['Membentuk jawatankuasa perundingan','Mengukuhkan pertahanan negeri','Memajukan ekonomi peribumi','Mengadakan bantahan'],
 a:3,
 w:'Kejayaan menolak Malayan Union dicapai melalui bantahan kuat oleh rakyat dan pemimpin Melayu yang disatukan oleh UMNO. Bantahan besar-besaran termasuk tidak menghadiri majlis angkat sumpah Gabenor memaksa British mengubah polisi mereka.'},

{n:10,uid:'jhr-sej-26-10',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Apakah kesan perjanjian Persekutuan Tanah Melayu 1948 terhadap Tanah Melayu?',
 o:['Komposisi kaum seimbang','Kuasa kerajaan negeri berkurang','Berpeluang berkerajaan sendiri','Pemansuhan undang-undang tradisional'],
 a:2,
 w:'Kesan utama PTM 1948 ialah rakyat Tanah Melayu berpeluang berkerajaan sendiri. PTM memulihkan kedaulatan Raja-Raja Melayu dan membuka laluan ke arah pemerintahan sendiri dan kemerdekaan daripada British.'},

{n:11,uid:'jhr-sej-26-11',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Di bawah Undang-Undang Darurat yang dikuatkuasakan pada tahun 1948, kerajaan berkuasa<br><br>I&nbsp;&nbsp;&nbsp;&nbsp;Menahan sesiapa yang disyaki terlibat dengan pergerakan komunis<br>II&nbsp;&nbsp;&nbsp;Menghantar pulang kaum imigran bagi mengelakkan sifat perkauman<br>III&nbsp;&nbsp;Mempelbagaikan tanaman makanan untuk menjamin makanan mencukupi<br>IV&nbsp;&nbsp;Mengenakan hukuman mati terhadap sesiapa yang membawa senjata api',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:1,
 w:'Di bawah Undang-Undang Darurat 1948, kerajaan diberi kuasa menahan sesiapa yang disyaki bersama komunis tanpa perlu bicara mahkamah (I) dan mengenakan hukuman mati kepada sesiapa yang membawa senjata api tanpa lesen (IV).'},

{n:12,uid:'jhr-sej-26-12',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Mengapakah rancangan penempatan semula Kampung Baru merenggangkan hubungan antara kaum?',
 o:['Penguasaan komunis terhadap Kampung Baru','Ramai orang Cina menyertai komunis','Penempatan berasaskan kaum','Peranan Min Yuen'],
 a:2,
 w:'Kampung Baru merenggangkan hubungan antara kaum kerana penempatan penduduk dilakukan secara berasingan mengikut kaum. Pemisahan fizikal ini mewujudkan jurang sosial dan ekonomi yang menjejaskan persefahaman antara masyarakat.'},

{n:13,uid:'jhr-sej-26-13',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Apakah kesan dasar pentadbiran British terhadap bidang pendidikan di negara kita?',
 o:['Mewujudkan sekolah vernakular','Memperkasakan sekolah antarabangsa','Memantapkan kurikulum persekolahan','Melaksanakan pembelajaran bahasa asing'],
 a:0,
 w:'Kesan utama dasar pendidikan British ialah wujudnya sekolah vernakular — sekolah Melayu, Cina dan Tamil diasaskan secara berasingan mengikut kaum, mewujudkan sistem pendidikan pelbagai aliran yang masih wujud sehingga kini.'},

{n:14,uid:'jhr-sej-26-14',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Pada tahun 1946, Parti Kebangsaan Melayu Bersatu (UMNO) telah ditubuhkan. Apakah tujuan penubuhan parti tersebut?',
 o:['Mengukuhkan patriotisme','Menuntut kemerdekaan','Mengeratkan perpaduan','Menentang Malayan Union'],
 a:3,
 w:'UMNO ditubuhkan pada tahun 1946 dengan tujuan utama menentang Malayan Union yang mengancam kedaulatan Raja-Raja Melayu dan menghapuskan hak istimewa orang Melayu. UMNO berjaya menyatukan orang Melayu untuk menolak Malayan Union.'},

{n:15,uid:'jhr-sej-26-15',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Maklumat berikut berkaitan dengan pilihan raya peringkat negeri yang diadakan di Tanah Melayu.<br><table style="margin:10px 0;border-collapse:collapse;font-size:.85rem"><tr><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Tahun</th><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Pilihan Raya</th></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">1954</td><td style="border:1px solid var(--line);padding:6px 10px">Perikatan UMNO-MCA memenangi 226 kerusi daripada 228 kerusi negeri.</td></tr></table>Apakah kesimpulan yang dapat dibuat berdasarkan maklumat tersebut?',
 o:['Menekankan konsep persamaan taraf','Memantapkan pentadbiran kerajaan tempatan','Melindungi kepentingan ekonomi antara kaum','Membuktikan kerjasama kaum diterima'],
 a:3,
 w:'Kemenangan besar Perikatan UMNO-MCA (226 daripada 228 kerusi) membuktikan bahawa model kerjasama antara kaum diterima oleh rakyat. Ini membuka jalan bagi corak kepimpinan berbilang kaum yang terus menjadi asas politik Malaysia.'},

{n:16,uid:'jhr-sej-26-16',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Selepas Pilihan Raya Majlis Perundangan Persekutuan 1955, beberapa perubahan berlaku secara berperingkat di negara kita. Apakah kesan pilihan raya tersebut?<br><br>I&nbsp;&nbsp;&nbsp;&nbsp;Pentadbiran demokrasi diamalkan<br>II&nbsp;&nbsp;&nbsp;Pilihan Raya Perbandaran dijalankan<br>III&nbsp;&nbsp;Suruhanjaya Cobbold ditubuhkan<br>IV&nbsp;&nbsp;Tunku Abdul Rahman mengetuai kerajaan',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:1,
 w:'Kesan PRU MLP 1955 ialah pentadbiran demokrasi mula diamalkan secara penuh (I) dan Tunku Abdul Rahman mengetuai kerajaan sebagai Ketua Menteri pertama (IV). Suruhanjaya Cobbold (III) berkaitan pembentukan Malaysia, bukan kesan PRU 1955.'},

{n:17,uid:'jhr-sej-26-17',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Apakah isu yang menjadi terma rujukan Suruhanjaya Perlembagaan dalam merangka Perlembagaan Persekutuan Tanah Melayu 1957?',
 o:['Mengekalkan raja berkuasa mutlak','Mewujudkan kerajaan negeri yang kuat','Menyediakan satu bentuk kewarganegaraan','Mengukuhkan kedudukan rakyat pelbagai kaum'],
 a:2,
 w:'Suruhanjaya Reid ditugaskan merangka perlembagaan dengan isu utama menyediakan satu bentuk kewarganegaraan yang merangkumi semua kaum yang menetap di Tanah Melayu bagi mewujudkan warganegara yang bersatu padu.'},

{n:18,uid:'jhr-sej-26-18',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Maklumat berikut berkaitan dengan langkah penggubalan perlembagaan Persekutuan Tanah Melayu.<br><div style="border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:10px 0;background:var(--panel2);font-size:.9rem"><b>Penggubalan Perlembagaan Persekutuan Tanah Melayu</b><br>• Menerima memorandum pelbagai pihak<br>• Penghasilan draf perlembagaan<br>• Reaksi terhadap draf perlembagaan<br>• Perbincangan dengan kerajaan British</div>Langkah-langkah tersebut menggambarkan bahawa proses penggubalan perlembagaan menekankan nilai',
 o:['Integriti','Keberanian','Keterbukaan','Akauntabiliti'],
 a:2,
 w:'Proses penggubalan yang melibatkan memorandum pelbagai pihak, penghasilan draf, reaksi awam dan perbincangan mencerminkan nilai keterbukaan — semua pihak diberi peluang menyuarakan pandangan sebelum perlembagaan dimuktamadkan.'},

{n:19,uid:'jhr-sej-26-19',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Jawatankuasa berikut ditubuhkan sebagai persediaan menyambut pemasyhuran kemerdekaan Tanah Melayu.<br><div style="border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:10px 0;background:var(--panel2);font-size:.9rem;text-align:center">Jawatankuasa Persediaan Fizikal</div>Mengapakah penubuhan jawatankuasa tersebut penting?',
 o:['Menonjolkan identiti negara','Mematuhi prinsip kenegaraan','Mempertahankan warisan bangsa','Mendukung perlembagaan negara'],
 a:0,
 w:'Jawatankuasa Persediaan Fizikal penting kerana ia bertujuan menonjolkan identiti negara Malaysia yang baru merdeka melalui persediaan upacara proklamasi kemerdekaan yang bermaruah, tersusun dan bermakna.'},

{n:20,uid:'jhr-sej-26-20',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Gambar berikut merupakan lambang kebangsaan negara.<br><p style="font-size:.82rem;color:var(--dim);margin:8px 0;font-style:italic">[Jata Negara Malaysia — dua ekor harimau menyokong perisai dengan bulan bintang, bunga raya dan jalur, motto &ldquo;Bersekutu Bertambah Mutu&rdquo;]</p>Apakah kepentingan lambang tersebut?',
 o:['Sikap keterbukaan','Jati diri rakyat','Kebebasan bersuara','Kewibawaan pemerintah'],
 a:1,
 w:'Jata Negara sebagai lambang kebangsaan melambangkan jati diri rakyat Malaysia — menggambarkan identiti, kebanggaan dan semangat perpaduan seluruh warga negara Malaysia daripada pelbagai kaum dan agama.'},

/* ── TINGKATAN 5 ─────────────────────────────────────── */

{n:21,uid:'jhr-sej-26-21',form:'F5',topic:'F5 · Bab 7: Membina Kesejahteraan Negara',
 q:'Maklumat berikut merujuk kepada ciri-ciri negara yang berdaulat.<br><table style="margin:10px 0;border-collapse:collapse;font-size:.85rem;width:100%"><tr><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2);width:56px"><b>X</b></th><td style="border:1px solid var(--line);padding:6px 10px">Disatukan melalui satu bahasa dan kebudayaan, Rukun Negara serta mempunyai identiti yang sama</td></tr></table>Apakah <b>X</b> ?',
 o:['Rakyat','Kerajaan','Perundangan','Pemerintahan'],
 a:0,
 w:'X ialah rakyat kerana ciri-ciri seperti perpaduan melalui bahasa, kebudayaan, Rukun Negara dan identiti bersama merujuk kepada elemen rakyat sesebuah negara berdaulat. Rakyat yang bersatu adalah tunjang kekuatan negara.'},

{n:22,uid:'jhr-sej-26-22',form:'F5',topic:'F5 · Bab 7: Membina Kesejahteraan Negara',
 q:'Rajah di bawah menunjukkan lambang negara.<br><p style="font-size:.82rem;color:var(--dim);margin:8px 0;font-style:italic">[Jalur Gemilang — bendera Malaysia dengan 14 jalur merah putih berselang-seli, bulan sabit dan bintang 14 penjuru pada latar biru di sudut kiri atas]</p><em>Jalur Gemilang</em><br><br>Mengapakah rakyat perlu menghormati lambang tersebut?',
 o:['Mewujudkan perpaduan','Memupuk patriotisme','Membuktikan kesetiaan','Menikmati kemakmuran'],
 a:1,
 w:'Rakyat perlu menghormati Jalur Gemilang kerana ia adalah lambang negara yang memupuk semangat patriotisme dan rasa kebanggaan sebagai warganegara Malaysia. Menghormati bendera adalah tanda kecintaan kepada tanah air.'},

{n:23,uid:'jhr-sej-26-23',form:'F5',topic:'F5 · Bab 3: Raja Berperlembagaan dan Demokrasi Berparlimen',
 q:'Apakah ciri tradisional dalam Perlembagaan Persekutuan?',
 o:['Agama Islam','Pilihan Raya','Kewarganegaraan','Kerajaan Persekutuan'],
 a:0,
 w:'Agama Islam adalah ciri tradisional dalam Perlembagaan Persekutuan yang diwarisi daripada sistem kerajaan Melayu tradisional (Kesultanan Melayu). Pilihan raya, kewarganegaraan dan kerajaan persekutuan adalah ciri moden yang dimasukkan semasa penggubalan perlembagaan baru.'},

{n:24,uid:'jhr-sej-26-24',form:'F5',topic:'F5 · Bab 3: Raja Berperlembagaan dan Demokrasi Berparlimen',
 q:'Pindaan Perlembagaan 1963 dilakukan dengan memasukkan beberapa klausa baharu pada bahagian tertentu. Mengapakah pindaan tersebut dilakukan?',
 o:['Keperluan semasa','Pemisahan Singapura','Pengisytiharan merdeka','Pengasingan kuasa'],
 a:0,
 w:'Pindaan Perlembagaan 1963 dilakukan atas keperluan semasa untuk mengambil kira kemasukan Sabah, Sarawak dan Singapura ke dalam persekutuan — klausa baharu diperlukan bagi mentadbir negara yang lebih besar dan pelbagai.'},

{n:25,uid:'jhr-sej-26-25',form:'F5',topic:'F5 · Bab 3: Raja Berperlembagaan dan Demokrasi Berparlimen',
 q:'Mengapakah Penyimpan Mohor Besar Raja-Raja perlu menyertai persidangan Majlis Raja-Raja?',
 o:['Mengukuhkan kedaulatan raja','Memeterai keputusan persidangan','Mengekalkan kedudukan pembesar','Meluluskan rang undang-undang'],
 a:1,
 w:'Penyimpan Mohor Besar Raja-Raja perlu menyertai persidangan Majlis Raja-Raja bagi memeterai keputusan persidangan tersebut dengan mohor rasmi supaya keputusan itu sah dan berkuat kuasa dari segi undang-undang dan perlembagaan.'},

{n:26,uid:'jhr-sej-26-26',form:'F5',topic:'F5 · Bab 3: Raja Berperlembagaan dan Demokrasi Berparlimen',
 q:'Bagaimanakah sistem Raja Berperlembagaan dan Demokrasi Berparlimen dapat mewujudkan mekanisme semak dan imbang?',
 o:['Memilih anggota kabinet','Meredakan perselisihan kaum','Mengekalkan <em>status quo</em> orang Melayu','Memudahkan rang undang-undang diluluskan'],
 a:1,
 w:'Sistem Raja Berperlembagaan dan Demokrasi Berparlimen mewujudkan mekanisme semak dan imbang melalui kerangka perlembagaan yang menyediakan saluran penyelesaian konflik secara aman bagi meredakan perselisihan antara kaum dalam negara majmuk.'},

{n:27,uid:'jhr-sej-26-27',form:'F5',topic:'F5 · Bab 3: Raja Berperlembagaan dan Demokrasi Berparlimen',
 q:'Apakah yang dimaksudkan dengan sistem Persekutuan?',
 o:['Wilayah merdeka','Pengukuhan kerajaan','Gabungan ideologi','Penyatuan beberapa negeri'],
 a:3,
 w:'Sistem Persekutuan bermaksud penyatuan beberapa negeri di bawah satu kerajaan pusat (Kerajaan Persekutuan) di mana kuasa dibahagikan antara Kerajaan Persekutuan dengan kerajaan negeri mengikut Jadual Kesembilan Perlembagaan.'},

{n:28,uid:'jhr-sej-26-28',form:'F5',topic:'F5 · Bab 3: Raja Berperlembagaan dan Demokrasi Berparlimen',
 q:'Apakah tindakan yang perlu dilaksanakan jika berlaku ketidakselarasan antara undang-undang Persekutuan dengan undang-undang Negeri?',
 o:['Mengadakan pilihan raya','Budi bicara Perdana Menteri','Yang Di-Pertuan Agong membuat keputusan','Perlembagaan Persekutuan menjadi rujukan utama'],
 a:3,
 w:'Jika berlaku ketidakselarasan antara undang-undang Persekutuan dengan undang-undang Negeri, Perlembagaan Persekutuan menjadi rujukan utama dan undang-undang Persekutuan akan mengatasi undang-undang Negeri yang bercanggah.'},

{n:29,uid:'jhr-sej-26-29',form:'F5',topic:'F4 · Bab 7: Usaha Ke Arah Kemerdekaan',
 q:'Maklumat berikut berkaitan cadangan pembentukan Malaysia oleh seorang tokoh.<br><div style="border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:10px 0;background:var(--panel2);font-size:.9rem"><b>Tokoh X</b><br>Langkah ini bertujuan menyesuaikannya dengan rancangan dekolonisasi</div>Siapakah tokoh X?',
 o:['Lord Brassey','Dato Onn Jaafar','Sir Gerald Templer','Sir Malcolm MacDonald'],
 a:3,
 w:'Tokoh X ialah Sir Malcolm MacDonald, Pesuruhjaya Tinggi British di Asia Tenggara. Beliau mencadangkan pembentukan Malaysia sebagai langkah untuk menyesuaikannya dengan dasar dekolonisasi British yang sedang dilaksanakan di rantau ini.'},

{n:30,uid:'jhr-sej-26-30',form:'F5',topic:'F4 · Bab 7: Usaha Ke Arah Kemerdekaan',
 q:'Perjanjian Malaysia telah ditandatangani pada 9 Julai 1963 di London. Apakah intipati perjanjian tersebut?<br><br>I&nbsp;&nbsp;&nbsp;&nbsp;Pentadbiran diketuai oleh sultan<br>II&nbsp;&nbsp;&nbsp;Sarawak dan Sabah menubuhkan kabinet negeri<br>III&nbsp;&nbsp;Tarikh pembentukan Malaysia adalah pada 31 Ogos 1963<br>IV&nbsp;&nbsp;Ancaman komunis di Semenanjung Malaysia berjaya ditamatkan',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:2,
 w:'Intipati Perjanjian Malaysia 1963: Sarawak dan Sabah menubuhkan kabinet negeri masing-masing (II) dan tarikh pembentukan ditetapkan 31 Ogos 1963 dalam perjanjian asal (III), walaupun kemudiannya ditukar kepada 16 September 1963 atas sebab teknikal.',
 note:'Tarikh dalam perjanjian asal (31 Ogos) berbeza dengan tarikh sebenar pembentukan Malaysia (16 September 1963). Skema menerima II dan III sebagai intipati perjanjian yang ditandatangani.'},

{n:31,uid:'jhr-sej-26-31',form:'F5',topic:'F4 · Bab 7: Usaha Ke Arah Kemerdekaan',
 q:'Apakah usaha kerajaan dalam meningkatkan kegiatan ekonomi khususnya kepada masyarakat Sabah dan Sarawak selepas pembentukan Malaysia?',
 o:['Melatih tenaga guru','Membina lebih banyak sekolah','Meningkatkan sistem pengangkutan','Mempelbagaikan pertanian komersial'],
 a:3,
 w:'Kerajaan meningkatkan ekonomi Sabah dan Sarawak selepas pembentukan Malaysia dengan mempelbagaikan pertanian komersial seperti kelapa sawit, koko dan lada hitam bagi meningkatkan pendapatan dan taraf hidup penduduk kedua-dua negeri.'},

{n:32,uid:'jhr-sej-26-32',form:'F5',topic:'F5 · Bab 7: Membina Kesejahteraan Negara',
 q:'Apakah faktor berlakunya peristiwa 13 Mei 1969?<br><br>I&nbsp;&nbsp;&nbsp;&nbsp;Ketidakseimbangan ekonomi<br>II&nbsp;&nbsp;&nbsp;Kegagalan kempen pilihan raya<br>III&nbsp;&nbsp;Perebutan kuasa pemerintahan<br>IV&nbsp;&nbsp;Keputusan pilihan raya',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:1,
 w:'Peristiwa 13 Mei 1969 berlaku akibat ketidakseimbangan ekonomi antara kaum yang menimbulkan ketegangan lama (I) serta keputusan pilihan raya 1969 yang mencetuskan perarakan kemenangan yang memprovokasi kaum lain (IV).'},

{n:33,uid:'jhr-sej-26-33',form:'F5',topic:'F5 · Bab 7: Membina Kesejahteraan Negara',
 q:'Rajah di bawah menunjukkan langkah untuk mengukuhkan Dasar Pendidikan Kebangsaan.<br><div style="border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:10px 0;background:var(--panel2);font-size:.9rem"><b>X</b><br>• Memperkenalkan sekolah aneka jurusan.<br>• Bertujuan melahirkan tenaga kerja mahir.</div>Apakah <b>X</b>?',
 o:['Jawatankuasa Kabinet','Penyata Rahman Talib','Kajian Aminudin Baki','Kurikulum Baru Sekolah Rendah'],
 a:2,
 w:'X ialah Kajian Aminudin Baki yang mencadangkan penubuhan sekolah aneka jurusan (komprehensif) bertujuan melahirkan tenaga kerja mahir dalam pelbagai bidang teknikal dan vokasional bagi memenuhi keperluan pembangunan negara.'},

{n:34,uid:'jhr-sej-26-34',form:'F5',topic:'F5 · Bab 7: Membina Kesejahteraan Negara',
 q:'Logo di bawah menunjukkan logo Majlis Sukan Universiti Malaysia (MASUM).<br><p style="font-size:.82rem;color:var(--dim);margin:8px 0;font-style:italic">[Logo MASUM — lambang sukan universiti Malaysia dengan Jalur Gemilang dan cincin sukan]</p>Apakah kepentingan penganjuran sukan tersebut?<br><br>I&nbsp;&nbsp;&nbsp;&nbsp;Melahirkan tenaga kerja mahir<br>II&nbsp;&nbsp;&nbsp;Menggalakkan integrasi antara negeri<br>III&nbsp;&nbsp;Menunjukkan kebolehan dalam sukan<br>IV&nbsp;&nbsp;Memudahkan perkongsian kepakaran',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:2,
 w:'Penganjuran sukan MASUM penting kerana ia menggalakkan integrasi antara pelajar daripada pelbagai negeri dan universiti (II) serta memberi platform kepada pelajar menunjukkan kebolehan dan bakat dalam sukan (III).'},

{n:35,uid:'jhr-sej-26-35',form:'F5',topic:'F5 · Bab 8: Membina Kemakmuran Negara',
 q:'Maklumat berikut berkaitan strategi Dasar Ekonomi Baru (DEB).<br><div style="border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:10px 0;background:var(--panel2);font-size:.9rem">• Membasmi kemiskinan<br>• Menyusun semula masyarakat</div>Apakah matlamat pelaksanaan kedua-dua strategi tersebut?',
 o:['Mewujudkan perpaduan kaum','Meningkatan pelaburan negara','Pengagihan kekayaan sama rata','Pembinaan negara maju'],
 a:0,
 w:'Matlamat utama DEB (1971–1990) melalui strategi membasmi kemiskinan dan menyusun semula masyarakat ialah mewujudkan perpaduan kaum dengan mengurangkan jurang ekonomi antara kaum hingga menghapuskan pengenalan kaum mengikut fungsi ekonomi.'},

{n:36,uid:'jhr-sej-26-36',form:'F5',topic:'F5 · Bab 8: Membina Kemakmuran Negara',
 q:'Strategi yang digunakan dalam Dasar Pembangunan Negara (DPN) bagi meneruskan usaha membasmi kemiskinan dan menyusun semula masyarakat ialah',
 o:['Memastikan bekalan buruh mencukupi','Melaksanakan program penanaman semula','Mengurangkan pegangan saham pelabur asing','Melaksanakan Rancangan Buku Hijau'],
 a:1,
 w:'DPN (1991–2000) meneruskan matlamat DEB dengan melaksanakan program penanaman semula tanaman komersial (contoh: tukar getah kepada kelapa sawit) bagi meningkatkan produktiviti dan pendapatan petani untuk membasmi kemiskinan.'},

{n:37,uid:'jhr-sej-26-37',form:'F5',topic:'F5 · Bab 10: Kecemerlangan Malaysia di Persada Dunia',
 q:'Pelibatan aktif Malaysia dalam agensi Pertubuhan Bangsa-bangsa Bersatu (PBB) membolehkan beberapa tapak di negara kita seperti Lembah Lenggong diiktiraf sebagai Tapak Warisan Dunia. Apakah agensi PBB yang dimaksudkan?',
 o:['FAO','WHO','UNHCR','UNESCO'],
 a:3,
 w:'UNESCO (United Nations Educational, Scientific and Cultural Organization) adalah agensi PBB yang mengiktiraf Tapak Warisan Dunia. Lembah Lenggong di Perak diiktiraf sebagai Tapak Warisan Dunia UNESCO pada tahun 2012.'},

{n:38,uid:'jhr-sej-26-38',form:'F5',topic:'F5 · Bab 10: Kecemerlangan Malaysia di Persada Dunia',
 q:'Sebagai Pengerusi OIC pada tahun 2003, bagaimanakah Malaysia menghadapi tohmahan yang mengaitkan masyarakat Islam dengan isu 3K iaitu keganasan, kemiskinan dan kemunduran?',
 o:['Memperjuangkan hak asasi manusia','Menyelesaikan jenayah antarabangsa','Mengetengahkan nilai kesederhanaan','Mengamalkan dasar tidak berpihak'],
 a:2,
 w:'Malaysia menghadapi tohmahan 3K dengan mengetengahkan nilai kesederhanaan Islam — menegaskan bahawa Islam bukan agama yang memupuk keganasan, kemiskinan atau kemunduran. Malaysia mempromosikan Islam Hadhari (Islam bertamadun) sebagai pendekatan.'},

{n:39,uid:'jhr-sej-26-39',form:'F5',topic:'F5 · Bab 10: Kecemerlangan Malaysia di Persada Dunia',
 q:'Pada tahun 1997–1998, kebanyakan negara Asia termasuk Malaysia menghadapi kemelesetan ekonomi. Bagaimanakah Kerajaan Malaysia memulihkan masalah tersebut?',
 o:['Menubuhkan INCEIF','Menggunakan mata wang ASEAN','Menambat kadar mata wang ringgit','Menubuhkan AFTA'],
 a:2,
 w:'Kerajaan Malaysia memulihkan kemelesetan ekonomi 1997–1998 dengan menambat (mematok) kadar mata wang ringgit pada nilai tetap RM3.80 kepada USD1 mulai September 1998. Langkah ini mengekang spekulasi mata wang dan menstabilkan ekonomi negara.'},

{n:40,uid:'jhr-sej-26-40',form:'F5',topic:'F5 · Bab 10: Kecemerlangan Malaysia di Persada Dunia',
 q:'Maklumat berikut berkaitan dengan usaha Malaysia mengekalkan kelestarian global.<br><div style="border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:10px 0;background:var(--panel2);font-size:.9rem;text-align:center">Pengisytiharan Deklarasi Langkawi</div>Apakah isu alam sekitar yang dikaitkan dengan deklarasi tersebut?',
 o:['Kesan rumah hijau','Penerokaan Antartika','Kajian perubahan iklim','Kemerosotan ekosistem'],

{n:1,uid:'kdk-sej-26-01',form:'F4',topic:'F4 · Bab 1: Warisan Negara Bangsa',
 q:'Maklumat berikut berkaitan ciri-ciri negara bangsa kerajaan Alam Melayu.<br><div style="border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:10px 0;background:var(--panel2)"><ul style="margin:0;padding-left:18px"><li>Raja</li><li>Rakyat</li><li><strong>X</strong></li><li>Wilayah pengaruh</li></ul></div>Apakah X?',

 a:2,

{n:2,uid:'kdk-sej-26-02',form:'F4',topic:'F4 · Bab 1: Warisan Negara Bangsa',
 q:'Antara yang berikut, yang manakah terkandung dalam Hukum Kanun Melaka?<br><br>I&nbsp;&nbsp;&nbsp;&nbsp;Penetapan cukai<br>II&nbsp;&nbsp;&nbsp;Kesalahan jenayah<br>III&nbsp;&nbsp;Peranan pemerintah<br>IV&nbsp;&nbsp;Hubungan luar negara',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:2,
 w:'Hukum Kanun Melaka mengandungi peruntukan berkaitan kesalahan jenayah (II) seperti hukuman bagi pencuri dan pembunuh, serta peranan pemerintah (III) termasuk tugas pembesar dan pentadbiran. Penetapan cukai dan hubungan luar negara tidak diperincikan secara khusus dalam kanun tersebut.'},

{n:3,uid:'kdk-sej-26-03',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Maklumat berikut berkaitan dengan perjuangan nasionalisme peringkat awal di Indonesia melalui penulisan karya.<br><table style="margin:10px 0;border-collapse:collapse;font-size:.85rem"><tr><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Tokoh Nasionalis</th><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Hasil Karya</th></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">Raden Adjeng Kartini</td><td style="border:1px solid var(--line);padding:6px 10px"><ul style="margin:0;padding-left:16px"><li>Habis Gelap Terbitlah Terang</li><li>Penulisan Seorang Puteri Jawa</li></ul></td></tr></table>Apakah mesej yang terkandung dalam karya tersebut?',
 o:['Kemelesetan ekonomi negara','Kelemahan bidang perundangan','Ketidakadilan sistem pemerintahan','Kemunduran penduduk peribumi'],
 a:3,
 w:'Karya Raden Adjeng Kartini, terutama "Habis Gelap Terbitlah Terang", menyuarakan kemunduran penduduk peribumi Indonesia akibat penjajahan Belanda. Beliau memperjuangkan hak pendidikan wanita pribumi dan mendedahkan betapa mundurnya taraf hidup kaum peribumi berbanding penjajah.'},

{n:4,uid:'kdk-sej-26-04',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Jepun telah berjaya menewaskan Rusia pada tahun 1905.<br><br>Bagaimanakah kejayaan tersebut mempengaruhi sentimen penduduk di Asia Tenggara?',
 o:['Pembentukan gerakan radikal','Menyemarakkan semangat nasionalisme','Memantapkan sistem pemerintahan','Pengukuhan sistem pertahanan'],
 a:1,
 w:'Kemenangan Jepun ke atas Rusia (1905) dalam Perang Rusia-Jepun membangkitkan semangat nasionalisme di Asia Tenggara kerana membuktikan bahawa bangsa Asia mampu menewaskan kuasa Barat. Hal ini memberi keyakinan kepada penduduk Asia Tenggara bahawa penjajah Eropah boleh dikalahkan.'},

{n:5,uid:'kdk-sej-26-05',form:'F4',topic:'F4 · Bab 3: Konflik Dunia dan Pendudukan Jepun',
 q:'Mengapakah Perang Dunia Pertama tercetus pada tahun 1914?',
 o:['Pengeboman Pearl Harbour','Persengketaan Rusia dengan Britain','Pencerobohan terhadap wilayah Jerman','Pembunuhan pewaris takhta Austria-Hungary'],
 a:3,
 w:'Perang Dunia Pertama tercetus pada tahun 1914 akibat pembunuhan Archduke Franz Ferdinand, pewaris takhta Austria-Hungary, di Sarajevo pada 28 Jun 1914. Peristiwa ini mencetuskan siri perisytiharan perang antara kuasa-kuasa besar Eropah yang telah lama bersaing dan bersekutu.'},

{n:6,uid:'kdk-sej-26-06',form:'F4',topic:'F4 · Bab 3: Konflik Dunia dan Pendudukan Jepun',
 q:'Ilustrasi berikut berkaitan kesengsaraan penduduk di Tanah Melayu semasa pendudukan Tentera Jepun pada tahun 1941 – 1945.<br><p style="font-size:.82rem;color:var(--dim);margin:8px 0;font-style:italic">[Gambar: Ilustrasi kesengsaraan dan kekejaman tentera Jepun terhadap penduduk Tanah Melayu semasa pendudukan 1941–1945]</p>Apakah kesan keadaan tersebut terhadap penduduk Tanah Melayu?',
 img:'img/sejarah/d19c44bb6f80.webp',
 o:['Mendapatkan bantuan luar','Menyerahkan nasib kepada penjajah','Membentuk tentera selempang merah','Memulakan kerjasama dengan tentera British'],
 a:3,
 w:'Kekejaman tentera Jepun mendorong penduduk Tanah Melayu memulakan kerjasama dengan tentera British melalui Gerakan Anti-Jepun Rakyat Malaya (MPAJA). British yang beroperasi secara sulit menyediakan latihan dan senjata, manakala penduduk tempatan menjadi rangkaian perisikan dan sokongan logistik.'},

{n:7,uid:'kdk-sej-26-07',form:'F5',topic:'F4 · Bab 4: Era Peralihan Kuasa British',
 q:'Jadual berikut berkaitan perkembangan politik di Tanah Melayu dan Sarawak.<br><table style="margin:10px 0;border-collapse:collapse;font-size:.85rem"><tr><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Tarikh</th><th style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2)">Peristiwa</th></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">1 April 1946</td><td style="border:1px solid var(--line);padding:6px 10px">Pengisytiharaan Malayan Union</td></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">1 Julai 1946</td><td style="border:1px solid var(--line);padding:6px 10px">Penyerahan Sarawak kepada British</td></tr></table>Mengapakah kedua-dua peristiwa tersebut menghadapi tentangan?',
 o:['Kuasa raja berkurangan','Sempadan negeri diubah','Hak penduduk asal terjejas','Adat istiadat tempatan diganggu'],
 a:2,
 w:'Malayan Union ditentang kerana menghapuskan kedaulatan raja-raja Melayu dan hak istimewa orang Melayu. Penyerahan Sarawak kepada British pula ditentang oleh kaum Dayak dan beberapa pemimpin tempatan kerana bimbang hak dan kepentingan penduduk asal Sarawak akan terjejas di bawah pemerintahan terus British.'},

{n:8,uid:'kdk-sej-26-08',form:'F5',topic:'F4 · Bab 4: Era Peralihan Kuasa British',
 q:'Mengapakah penyerahan Sabah kepada British tidak mendapat bantahan daripada penduduk tempatan?<br><br>I&nbsp;&nbsp;&nbsp;&nbsp;Dijanjikan hak mentadbir sendiri<br>II&nbsp;&nbsp;&nbsp;Penduduk Sabah bimbang ditangkap<br>III&nbsp;&nbsp;Tidak memahami tujuan penyerahan<br>IV&nbsp;&nbsp;Menganggap peluang memajukan perniagaan',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:3,
 w:'Penduduk Sabah tidak membantah penyerahan kepada British kerana kebanyakan mereka tidak memahami implikasi sebenar penyerahan tersebut (III), dan ada yang menganggap ia membuka peluang untuk memajukan perniagaan dan taraf hidup mereka (IV) berbanding pemerintahan Syarikat Borneo Utara British (SBUB) sebelumnya.'},

{n:9,uid:'kdk-sej-26-09',form:'F5',topic:'F4 · Bab 5: Persekutuan Tanah Melayu 1948',
 q:'Apakah kandungan perjanjian Persekutuan Tanah Melayu 1948?',
 o:['Pilihan raya','Perkongsian kuasa','Kemerdekaan Tanah Melayu','Pembentukan Majlis Raja-Raja'],
 a:3,
 w:'Perjanjian Persekutuan Tanah Melayu 1948 antara kandungan utamanya ialah pembentukan Majlis Raja-Raja (Conference of Rulers) yang memulihkan kedudukan dan kuasa raja-raja Melayu yang telah dihapuskan di bawah Malayan Union. Ini merupakan salah satu tuntutan utama UMNO dan kaum Melayu.'},

{n:10,uid:'kdk-sej-26-10',form:'F5',topic:'F4 · Bab 5: Persekutuan Tanah Melayu 1948',
 q:'Mengapakah orang Melayu bersetuju dengan pembentukan Persekutuan Tanah Melayu 1948?',
 o:['Penamatan penjajahan British','Kedudukan raja Melayu terpelihara','Bahasa Melayu sebagai Bahasa kebangsaan','Raja turut terlibat menggubal undang-undang'],
 a:1,
 w:'Orang Melayu bersetuju dengan Persekutuan Tanah Melayu 1948 kerana perjanjian ini memulihkan kedudukan dan kedaulatan raja-raja Melayu yang telah dihapuskan secara sewenang-wenangnya melalui Malayan Union. Pemulihan kuasa raja memastikan hak istimewa dan kedudukan orang Melayu terjamin.'},

{n:11,uid:'kdk-sej-26-11',form:'F5',topic:'F4 · Bab 6: Ancaman Komunis dan Darurat',
 q:'Mengapakah Sir Edward Gent mengisytiharkan darurat di Tanah Melayu pada Jun 1948?',
 o:['Balai polis dibakar','Kemudahan asas disabotaj','Ancaman terhadap keselamatan rakyat','Pembunuhan pengurus ladang Eropah'],
 a:3,
 w:'Darurat diisytiharkan pada Jun 1948 selepas komunis Parti Komunis Malaya (PKM) membunuh beberapa pengurus ladang berbangsa Eropah di Perak. Pembunuhan tersebut merupakan sebahagian daripada strategi PKM untuk menakutkan kapitalis dan mencetuskan revolusi komunis di Tanah Melayu.'},

{n:12,uid:'kdk-sej-26-12',form:'F5',topic:'F4 · Bab 6: Ancaman Komunis dan Darurat',
 q:'Gambar berikut berkaitan penguatkuasaan undang-undang darurat di Tanah Melayu.<br><p style="font-size:.82rem;color:var(--dim);margin:8px 0;font-style:italic">[Gambar: Kad Pengenalan Persekutuan Tanah Melayu — Federation of Malaya Registration of Residents Identity Card]</p>Bagaimanakah kad pengenalan tersebut membantu menangani ancaman komunis?',
 img:'img/sejarah/121c70c5a468.webp',
 o:['Membentuk kesetiaan rakyat','Mengenal pasti orang awam','Mempercepatkan proses bancian penduduk','Meningkatkan jumlah warga negara Tanah Melayu'],
 a:1,
 w:'Kad pengenalan yang diperkenalkan semasa Darurat membantu pihak berkuasa mengenal pasti orang awam yang sah dan membezakan mereka daripada ahli atau penyokong komunis. Ini memudahkan kawalan pergerakan penduduk dan membantu mencegah Min Yuen (rangkaian bekalan komunis) daripada mendapat sokongan bahan makanan dan logistik.'},

{n:13,uid:'kdk-sej-26-13',form:'F5',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
 q:'Mengapakah penubuhan Jawatankuasa Hubungan Antara Kaum penting kepada negara?',
 o:['Mempercepat kemerdekaan','Pemantapan sistem kabinet','Penetapan syarat kerakyatan','Merangka perlembagaan Persekutuan'],
 a:0,
 w:'Jawatankuasa Hubungan Antara Kaum (Communities Liaison Committee, CLC) yang ditubuhkan pada 1949 penting kerana berjaya mempercepatkan proses kemerdekaan melalui kerjasama antara kaum. Perbincangan antara pemimpin pelbagai kaum menghasilkan formula perkongsian kuasa yang menjadi asas kepada perjuangan kemerdekaan bersama.'},

{n:14,uid:'kdk-sej-26-14',form:'F5',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
 q:'Penyata Jawatankuasa Pelajaran 1956 mengutamakan dua perkara penting untuk membentuk perpaduan kaum.<br><br>Apakah perkara tersebut?<br><br>I&nbsp;&nbsp;&nbsp;&nbsp;Kemahiran teknikal<br>II&nbsp;&nbsp;&nbsp;Kurikulum seragam<br>III&nbsp;&nbsp;Sukatan pelajaran yang sama<br>IV&nbsp;&nbsp;Penekanan kepada mata pelajaran Sejarah',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:2,
 w:'Penyata Razak 1956 mengutamakan kurikulum seragam (II) bagi semua sekolah tanpa mengira aliran dan sukatan pelajaran yang sama (III) sebagai asas membentuk perpaduan kaum. Kedua-dua elemen ini bertujuan mewujudkan identiti kebangsaan yang kukuh melalui sistem pendidikan yang seragam.'},

{n:15,uid:'kdk-sej-26-15',form:'F5',topic:'F4 · Bab 8: Pilihan Raya',
 q:'Petikan berikut berkaitan tarikh pilihanraya umum negara.<br><div style="border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:10px 0;background:var(--panel2);font-size:.9rem">Suruhanjaya Pilihan Raya (SPR) menetapkan 19 November 2022 sebagai tarikh pengundian untuk pengundi Malaysia melaksanakan tanggungjawab pada pilihanraya umum ke-15 (PRU15).<br><span style="color:var(--dim);font-size:.82rem">Sumber: Bernama, Oktober 2022</span></div>Apakah syarat menjadi pengundi dalam pilihanraya tersebut?<br><br>I&nbsp;&nbsp;&nbsp;&nbsp;Berumur 21 tahun<br>II&nbsp;&nbsp;&nbsp;Mendaftar sebagai pengundi<br>III&nbsp;&nbsp;Ahli parti politik yang bertanding<br>IV&nbsp;&nbsp;Tidak muflis',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:0,
 note:'⚠️ Soalan ini mengikut skema jawapan rasmi (A: I dan II). Namun secara faktual, Undi18 (2021) telah menurunkan had umur mengundi daripada 21 tahun kepada 18 tahun dan memperkenalkan pendaftaran pemilih automatik — menjadikan pernyataan I ("Berumur 21 tahun") tidak tepat untuk PRU15 (2022). Ikut jawapan skema untuk peperiksaan.',
 w:'Mengikut skema rasmi, syarat pengundi ialah berumur 21 tahun (I) dan mendaftar sebagai pengundi (II). Syarat III (ahli parti) tidak diperlukan — pengundi bukan calon, dan IV (tidak muflis) adalah syarat untuk menjadi CALON bukan pengundi. [Nota: Undi18 (2021) telah menukar umur mengundi kepada 18 tahun untuk PRU15, namun soalan ini mengikut sukatan lama — ikut jawapan skema dalam peperiksaan.]'},

{n:16,uid:'kdk-sej-26-16',form:'F5',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
 q:'Majlis Perundangan Persekutuan (MPP) telah bersidang buat pertama kalinya pada 31 Ogos 1955.<br><br>Mengapakah peristiwa itu penting kepada Tanah Melayu?',
 o:['Langkah ke arah berkerajaan sendiri','British bersetuju memberikan kemerdekaan','Tiada lagi pelibatan pegawai British dalam kerajaan','Hala tuju negara ditentukan oleh kepimpinan tempatan'],
 a:0,
 w:'Persidangan pertama Majlis Perundangan Persekutuan (MPP) pada 31 Ogos 1955 penting kerana ia merupakan langkah nyata ke arah berkerajaan sendiri. Sebelum ini, majlis perundangan didominasi oleh pegawai British. Kini, ahli yang dipilih melalui pilihan raya mendominasi MPP, menandakan rakyat mula memerintah diri sendiri.'},

{n:17,uid:'kdk-sej-26-17',form:'F5',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
 q:'Gambar berikut berkaitan Rundingan London yang diadakan pada tahun 1956.<br><p style="font-size:.82rem;color:var(--dim);margin:8px 0;font-style:italic">[Gambar: Foto delegasi Tanah Melayu dalam Rundingan London 1956]</p>Apakah keputusan yang dipersetujui dalam rundingan tersebut?',
 img:'img/sejarah/c12e789e03c0.webp',
 o:['Mengagihkan kuasa Persekutuan','Menubuhkan suruhanjaya merangka perlembagaan','Melaksana pilihan raya Majlis Perundangan Persekutuan','Membentuk Jawatankuasa Antara Kaum'],
 a:1,
 w:'Rundingan London 1956 antara delegasi Tanah Melayu (pimpinan Tunku Abdul Rahman) dengan kerajaan British mempersetujui penubuhan Suruhanjaya Reid untuk merangka perlembagaan bagi Tanah Melayu yang merdeka. Ini merupakan langkah penting ke arah kemerdekaan yang dicapai pada 31 Ogos 1957.'},

{n:18,uid:'kdk-sej-26-18',form:'F5',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
 q:'Apakah tindakan anda sebagai pemimpin Tanah Melayu pada tahun 1950-an untuk mempercepatkan kemerdekaan Persekutuan Tanah Melayu?',
 o:['Mengadakan demonstrasi','Berunding dengan komunis','Memperkukuh perpaduan kaum','Mendapatkan sokongan negara luar'],
 a:2,
 w:'Strategi terbaik pemimpin Tanah Melayu pada 1950-an ialah memperkukuh perpaduan kaum. Kerjasama antara UMNO, MCA dan MIC dalam Perikatan menunjukkan kepada British bahawa rakyat pelbagai kaum mampu bersatu dan memerintah sendiri — ini menjadi hujah kukuh untuk mendapatkan kemerdekaan melalui rundingan.'},

{n:19,uid:'kdk-sej-26-19',form:'F5',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
 q:'Pasangan gambar manakah yang betul berkaitan persediaan menyambut pemasyhuran kemerdekaan negara 1957 oleh kedua-dua jawatankuasa berikut?<br><p style="font-size:.82rem;color:var(--dim);margin:8px 0;font-style:italic">[Gambar: 4 pasangan (A–D) — lajur kiri: Jawatankuasa Persediaan Fizikal, lajur kanan: Jawatankuasa Sambutan. Jawapan B menunjukkan padang/tempat upacara (persediaan fizikal) dan teks Lagu Negaraku (sambutan)]</p>',
 img:'img/sejarah/285b3ee95b4b.webp',
 o:['Persediaan Fizikal: topi diraja; Sambutan: Istana Negara','Persediaan Fizikal: padang upacara; Sambutan: Lagu Negaraku','Persediaan Fizikal: Lagu Negaraku; Sambutan: hiasan bunga','Persediaan Fizikal: Bendera Persekutuan; Sambutan: Istana Negara'],
 a:1,
 w:'Jawatankuasa Persediaan Fizikal bertanggungjawab menyediakan tempat upacara (padang/stadium) untuk majlis pengisytiharan kemerdekaan, manakala Jawatankuasa Sambutan bertanggungjawab mengurus program sambutan termasuk persembahan Lagu Negaraku. Pasangan B mewakili tanggungjawab masing-masing dengan tepat.'},

{n:20,uid:'kdk-sej-26-20',form:'F5',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
 q:'Maklumat berikut berkaitan ciri Persekutuan Tanah Melayu 1957 yang berdaulat.<br><div style="border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:10px 0;background:var(--panel2)"><ul style="margin:0;padding-left:18px"><li>Rakyat</li><li>Kerajaan</li><li>Lambang</li><li>Undang-undang</li><li><strong>X</strong></li></ul></div>Apakah X?',
 o:['Raja','Pemerintahan','Sempadan negara','Wilayah pengaruh'],
 a:3,
 w:'Ciri-ciri negara berdaulat termasuk Rakyat, Kerajaan, Lambang, Undang-undang, dan Wilayah pengaruh. Wilayah pengaruh (kawasan di bawah bidang kuasa negara) melengkapkan elemen-elemen kenegaraan yang menjadikan Persekutuan Tanah Melayu sebuah negara merdeka dan berdaulat pada 31 Ogos 1957.'},

{n:21,uid:'kdk-sej-26-21',form:'F4',topic:'F4 · Bab 1: Warisan Negara Bangsa',
 q:'Mengapa konsep daulat penting kepada raja Melayu sebelum kedatangan British?<br><br>I&nbsp;&nbsp;&nbsp;&nbsp;Memperkukuh kedudukan<br>II&nbsp;&nbsp;&nbsp;Mengikat kesetiaan rakyat tempatan<br>III&nbsp;&nbsp;Memperluaskan peranan pembesar Melayu<br>IV&nbsp;&nbsp;Menghalang peluasan pengaruh kerajaan Siam',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:0,
 w:'Konsep daulat (kesakralan raja) penting kerana ia memperkukuh kedudukan dan legitimasi raja (I) sebagai pemerintah yang diberkati dan tidak boleh dicabar. Ia juga mengikat kesetiaan rakyat tempatan (II) melalui kepercayaan bahawa menderhaka kepada raja bermakna melanggar norma alam dan akan mendapat padah.'},

{n:22,uid:'kdk-sej-26-22',form:'F5',topic:'F5 · Bab 1: Kedaulatan Negara',
 q:'Serangan Israel dan Amerika Syarikat terhadap Iran pada 28 Februari 2026 adalah satu pencabulan kedaulatan negara.<br><br>Apakah tindakan anda seandainya menjadi rakyat negara tersebut?',
 o:['Berlindung di tempat selamat','Berusaha keluar daripada negara','Menyertai pasukan sukarelawan','Mengutuk tindakan serangan tersebut'],
 a:2,
 note:'Soalan aplikasi nilai sivik — menguji semangat patriotisme dan tanggungjawab rakyat mempertahankan kedaulatan negara.',
 w:'Sebagai rakyat yang patriotik, tindakan terbaik ialah menyertai pasukan sukarelawan untuk mempertahankan kedaulatan negara. Ini mencerminkan semangat cinta negara dan kesanggupan berkorban demi mempertahankan maruah serta kedaulatan tanah air daripada pencerobohan asing.'},

{n:23,uid:'kdk-sej-26-23',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Mengapakah Perlembagaan Persekutuan Malaysia dianggap unik?',
 o:['Digubal oleh barisan hakim terkenal','Gabungan unsur tradisional dan moden','Boleh dipinda berdasarkan situasi semasa','Disesuaikan berdasarkan model Westminster'],
 a:1,
 w:'Perlembagaan Malaysia unik kerana menggabungkan unsur tradisional (seperti sistem beraja, hak istimewa Melayu, Islam sebagai agama rasmi) dengan unsur moden (demokrasi berparlimen, hak asasi, sistem kehakiman bebas). Gabungan unik ini mencerminkan konteks sejarah, budaya dan keperluan masyarakat majmuk Malaysia.'},

{n:24,uid:'kdk-sej-26-24',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Perlembagaan Malaysia telah dipinda beberapa kali.<br><br>Mengapakah parlimen terpaksa melakukan pindaan tersebut?',
 o:['Pengekalan kesejahteraan','Perubahan ekonomi dunia','Mengurangkan tekanan serantau','Mematuhi kehendak Yang di-Pertuan Agong'],
 a:0,
 w:'Parlimen meminda perlembagaan bagi mengekalan kesejahteraan negara — memastikan perlembagaan kekal relevan dan mampu menjamin kestabilan serta kemakmuran rakyat dalam menghadapi cabaran-cabaran baru. Pindaan dilakukan untuk menyesuaikan undang-undang asas negara dengan keperluan semasa demi kepentingan rakyat.'},

{n:25,uid:'kdk-sej-26-25',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Maklumat berikut berkaitan kuasa Yang di-Pertuan Agong.<br><div style="border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:10px 0;background:var(--panel2)"><ul style="margin:0;padding-left:18px"><li>Membubarkan Parlimen</li><li>Mengisytihar darurat</li></ul></div>Apakah bidang kuasa tersebut?',
 o:['Perundangan','Kehakiman','Eksekutif','Berkanun'],
 a:2,
 w:'Kuasa membubarkan Parlimen dan mengisytihar darurat merupakan kuasa eksekutif Yang di-Pertuan Agong. Walaupun dijalankan atas nasihat Perdana Menteri, kuasa-kuasa ini terletak dalam bidang kuasa eksekutif (cabang pemerintahan) yang diperuntukkan kepada Yang di-Pertuan Agong di bawah Perlembagaan.'},

{n:26,uid:'kdk-sej-26-26',form:'F5',topic:'F4 · Bab 8: Pilihan Raya',
 q:'Pilihan raya di Malaysia dikendalikan oleh Suruhanjaya Pilihan Raya (SPR).<br><br>Bagaimanakah suruhanjaya tersebut melaksanakan tugas mereka?<br><br>I&nbsp;&nbsp;&nbsp;&nbsp;Menyediakan daftar pemilih<br>II&nbsp;&nbsp;&nbsp;Menerbitkan manifesto parti bertanding<br>III&nbsp;&nbsp;Melaksanakan kempen sebelum pilihanraya<br>IV&nbsp;&nbsp;Mengisytihar parti yang menang bertanding',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:1,
 w:'SPR bertugas menyediakan daftar pemilih (I) yang mengandungi maklumat pengundi berdaftar, dan mengisytiharkan keputusan parti atau calon yang menang (IV) selepas pengiraan undi. Menerbitkan manifesto parti (II) adalah tugas parti politik, bukan SPR, dan kempen (III) dijalankan oleh calon/parti, bukan SPR.'},

{n:27,uid:'kdk-sej-26-27',form:'F5',topic:'F4 · Bab 9: Perlembagaan Persekutuan Tanah Melayu 1957',
 q:'Maklumat berikut berkaitan dengan Senarai Negeri di negara ini.<br><div style="border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:10px 0;background:var(--panel2)"><ul style="margin:0;padding-left:18px"><li>Pertahanan</li><li>Pelajaran</li><li><strong>X</strong></li></ul></div>Apakah X?',
 o:['Pertahanan','Kewarganegaraan','Pertanian dan perhutanan','Perhubungan dan pengangkutan'],
 a:2,
 w:'Senarai Negeri dalam Perlembagaan Malaysia mengandungi perkara-perkara di bawah bidang kuasa kerajaan negeri. Pertanian dan perhutanan (C) merupakan salah satu bidang dalam Senarai Negeri, bersama tanah, perkhidmatan awam negeri, dan undang-undang Islam. Pertahanan dan pelajaran (sekolah kebangsaan) adalah dalam Senarai Persekutuan.'},

{n:28,uid:'kdk-sej-26-28',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
 q:'Mengapakah Bahagian Ketiga Sarawak disytiharkan sebagai "Pemerintahan Keselamatan Kawasan Rajang (RASCOM)"?',
 o:['Serangan lanun','Ancaman komunis','Pendaratan tentera Indonesia','Pencerobohan pengganas Kepulauan Sulu'],
 a:1,
 w:'RASCOM (Rajang Area Security Command) diwujudkan di Bahagian Ketiga Sarawak untuk menangani ancaman komunis dari Clandestine Communist Organisation (CCO) yang aktif di kawasan pedalaman Sarawak, terutamanya di sepanjang Sungai Rajang selepas pembentukan Malaysia pada 1963.'},

{n:29,uid:'kdk-sej-26-29',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
 q:'Maklumat berikut berkaitan garis masa proses pembentukan Persekutuan Malaysia.<br><table style="margin:10px 0;border-collapse:collapse;font-size:.85rem"><tr><td style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2);font-weight:bold">Januari 1962</td><td style="border:1px solid var(--line);padding:6px 10px">Pembentukan Suruhanjaya Cobbold</td></tr><tr><td style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2);font-weight:bold">November 1961</td><td style="border:1px solid var(--line);padding:6px 10px">Rundingan London</td></tr><tr><td style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2);font-weight:bold">Julai 1961</td><td style="border:1px solid var(--line);padding:6px 10px">Penubuhan Jawatankuasa Setiakawan Malaysia (JSKM)</td></tr><tr><td style="border:1px solid var(--line);padding:6px 10px;background:var(--panel2);font-weight:bold">Julai 1961</td><td style="border:1px solid var(--line);padding:6px 10px"><strong>X</strong></td></tr></table>Apakah X?',
 o:['Siri lawatan','Suruhanjaya Reid','Rundingan London','Referendum Singapura'],
 a:0,
 w:'Pada Julai 1961, selain penubuhan JSKM, siri lawatan juga diadakan oleh pemimpin ke Borneo Utara (Sabah) dan Sarawak untuk menerangkan konsep Malaysia kepada penduduk tempatan. Lawatan ini penting untuk mendapatkan sokongan akar umbi bagi pembentukan Persekutuan Malaysia.'},

{n:30,uid:'kdk-sej-26-30',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
 q:'Dialog berikut mungkin berlaku pada tahun 1963 antara penduduk Sabah dengan penduduk Sarawak.<br><table style="margin:10px 0;border-collapse:collapse;font-size:.85rem"><tr><td style="border:1px solid var(--line);padding:8px 12px;background:var(--panel2);font-weight:bold">Encik X</td><td style="border:1px solid var(--line);padding:8px 12px">Kita ada keistimewaan walaupun telah menyertai Persekutuan Malaysia.</td></tr><tr><td style="border:1px solid var(--line);padding:8px 12px;background:var(--panel2);font-weight:bold">Encik Y</td><td style="border:1px solid var(--line);padding:8px 12px">Betul, kita beruntung kerana turut menjadi keluarga Malaysia.</td></tr></table>Keistimewaan tersebut adalah kuasa mengawal dan menguruskan',
 o:['kewangan','pertahanan','dasar luar negeri','hal ehwal imigresen'],
 a:3,
 w:'Sabah dan Sarawak mendapat keistimewaan kawalan ke atas hal ehwal imigresen dalam Malaysia Agreement 1963. Ini bermakna kerajaan negeri Sabah dan Sarawak berhak mengawal kemasukan rakyat dari Semenanjung Malaysia — hak yang tidak dimiliki oleh mana-mana negeri Semenanjung — sebagai syarat penyertaan mereka.'},

{n:31,uid:'kdk-sej-26-31',form:'F5',topic:'F5 · Bab 5: Pembentukan Malaysia',
 q:'Penduduk di Sabah dan Sarawak masih bergantung kepada pertanian sara diri selepas pembentukan Malaysia.<br><br>Bagaimanakah kerajaan mengatasi isu tersebut?',
 o:['Melancarkan kempen berniaga','Memberi pendidikan pemasaran','Membuka ladang pertanian swasta','Menggalakkan penanaman kelapa sawit'],
 a:3,
 w:'Kerajaan menggalakkan penanaman kelapa sawit secara komersial di Sabah dan Sarawak untuk menggantikan pertanian sara diri. Penanaman kelapa sawit menawarkan pendapatan yang lebih tinggi dan stabil kepada petani, selain menjadi komoditi eksport penting yang menyumbang kepada pembangunan ekonomi negeri-negeri Borneo.'},

{n:32,uid:'kdk-sej-26-32',form:'F5',topic:'F4 · Bab 6: Ancaman Komunis dan Darurat',
 q:'Tugu Negara telah dibom oleh komunis pada pagi 26 Ogos 1975.<br><br>Apakah tindakan kerajaan selepas peristiwa tersebut?',
 o:['Membuka Kampung Baru','Melaksanakan perang saraf','Memulakan Operasi Hammer','Menandatangani Perjanjian Kerjasama Sempadan'],
 a:3,
 w:'Selepas serangan bom ke atas Tugu Negara pada 1975, kerajaan Malaysia menandatangani Perjanjian Kerjasama Sempadan dengan Thailand untuk menangani ancaman komunis PKM yang beroperasi di kawasan sempadan Thailand-Malaysia. Kerjasama sempadan ini membolehkan operasi ketenteraan bersama menghapuskan sarang PKM.'},

{n:33,uid:'kdk-sej-26-33',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',
 q:'Maklumat berikut berkaitan dasar pembangunan sosial negara.<br><div style="border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:10px 0;background:var(--panel2)"><ul style="margin:0;padding-left:18px"><li>Dasar Pendidikan Kebangsaan</li><li>Dasar Kebudayaan Kebangsaan</li><li>Dasar Bahasa Kebangsaan</li></ul></div>Mengapakah dasar-dasar tersebut dilaksanakan?',
 o:['Mewujudkan perpaduan kaum','Meningkatkan taraf hidup rakyat','Menjamin kecemerlangan negara','Mempertingkatkan sahsiah masyarakat'],
 a:0,
 w:'Dasar Pendidikan Kebangsaan, Dasar Kebudayaan Kebangsaan, dan Dasar Bahasa Kebangsaan dilaksanakan dengan matlamat utama mewujudkan perpaduan kaum. Bahasa Melayu sebagai bahasa pengantar bersama, kurikulum seragam, dan budaya kebangsaan yang inklusif bertujuan membina identiti Malaysia yang bersatu padu merentas sempadan kaum.'},

{n:34,uid:'kdk-sej-26-34',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',
 q:'Mengapakah Rukun Negara dibentuk?<br><br>I&nbsp;&nbsp;&nbsp;&nbsp;Mengekalkan keadilan<br>II&nbsp;&nbsp;&nbsp;Menyatukan rakyat<br>III&nbsp;&nbsp;Menanamkan taat setia<br>IV&nbsp;&nbsp;Menjamin kebebasan bersuara',
 o:['I dan II','I dan IV','II dan III','III dan IV'],
 a:2,
 w:'Rukun Negara yang digubal selepas 13 Mei 1969 bertujuan menyatukan rakyat berbilang kaum (II) yang terpecah-belah akibat rusuhan kaum, dan menanamkan taat setia kepada negara (III) sebagai asas perpaduan. Prinsip-prinsip Rukun Negara menjadi panduan hidup bersama yang merentasi sempadan kaum, agama dan budaya.'},

{n:35,uid:'kdk-sej-26-35',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',
 q:'Gambar berikut berkaitan Rancangan Buku Hijau yang telah dilancarkan pada tahun 1974.<br><p style="font-size:.82rem;color:var(--dim);margin:8px 0;font-style:italic">[Gambar: Kulit buku "Rancangan Buku Hijau — Panduan Tindakan Daerah", terbitan kerajaan Malaysia 1974]</p>Apakah aktiviti ekonomi yang disarankan dalam rancangan tersebut?',
 img:'img/sejarah/f5f8bceea766.webp',
 o:['Perniagaan','Pertukangan','Penternakan','Perindustrian'],
 a:2,
 w:'Rancangan Buku Hijau (1974) yang dilancarkan oleh Tun Abdul Razak menggalakkan penternakan sebagai aktiviti ekonomi sampingan untuk meningkatkan pendapatan rakyat luar bandar dan membangunkan sumber makanan tempatan. Rakyat digalakkan memelihara ayam, itik, kambing dan ternakan lain di peringkat daerah.'},

{n:36,uid:'kdk-sej-26-36',form:'F5',topic:'F5 · Bab 8: Membina Kemakmuran Negara',
 q:'Encik Ali telah menemui pegawai daripada agensi X untuk mengusahakan tanaman padi dengan menggunakan teknologi moden.<br><br>Apakah X?',

{n:2,uid:'kl-sej-26-02',form:'F4',topic:'F4 · Bab 1: Warisan Negara Bangsa',
 q:'Mengapakah Kesultanan Melayu Melaka (KMM) mewujudkan jawatan Syahbandar?',

 w:'Jawatan Syahbandar diwujudkan oleh KMM untuk melicinkan kutipan cukai di pelabuhan bagi memastikan perdagangan berjalan lancar dan hasil cukai dikutip dengan teratur.'},

{n:3,uid:'kl-sej-26-03',form:'F4',topic:'F4 · Bab 1: Warisan Negara Bangsa',
 q:'Mengapakah raja-raja Thailand menjalinkan hubungan yang baik dengan Barat?',
 o:['Menghalang kebangkitan rakyat','Mempertahankan kedaulatan','Melindungi keluarga diraja','Menguasai negara jiran'],a:1,
 w:'Raja-raja Thailand menjalinkan hubungan baik dengan Barat bertujuan mempertahankan kedaulatan Thailand daripada dijajah. Melalui diplomasi dan perjanjian, Thailand berjaya mengelakkan penjajahan terus oleh kuasa Barat.'},

{n:4,uid:'kl-sej-26-04',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Bagaimanakah golongan intelektual berpendidikan agama menyalurkan idea perjuangan mereka?',
 o:['Menggunakan akhbar','Membawa bahan bacaan dari luar','Menggalakkan penubuhan persatuan','Melibatkan kerjasama dengan penjajah'],a:0,
 w:'Golongan intelektual berpendidikan agama menyalurkan idea perjuangan melalui akhbar seperti Al-Imam bagi menyebarkan semangat kebangsaan dan memupuk kesedaran tentang hak orang Melayu.'},

{n:5,uid:'kl-sej-26-05',form:'F4',topic:'F4 · Bab 3: Konflik Dunia dan Pendudukan Jepun',
 q:'Apakah punca tercetusnya Perang Dunia Pertama pada tahun 1914?',
 o:['Pencerobohan wilayah Jerman','Kegagalan Perjanjian Versailles','Kejatuhan Empayar Uthmaniyah','Pembunuhan pewaris takhta Austria-Hungary'],a:3,
 w:'Perang Dunia Pertama tercetus pada tahun 1914 berikutan pembunuhan Archduke Franz Ferdinand, pewaris takhta Austria-Hungary, di Sarajevo oleh Gavrilo Princip. Peristiwa ini mencetuskan konflik yang berkembang menjadi peperangan besar-besaran di Eropah.'},

{n:6,uid:'kl-sej-26-06',form:'F4',topic:'F4 · Bab 3: Konflik Dunia dan Pendudukan Jepun',
 q:'<div class="q-box"><ul><li>Leftenan Adnan Saidi</li><li>Leftenan Ibrahim Alla Ditta MC</li></ul></div>Mengapakah tokoh tersebut perlu dihargai oleh generasi muda?',
 o:['Menjalin hubungan negara luar','Memajukan sistem ketenteraan','Memperjuangkan kedaulatan negara','Mempertahankan institusi beraja'],a:2,
 w:'Leftenan Adnan Saidi dan Leftenan Ibrahim Alla Ditta telah berjuang mempertahankan Tanah Melayu daripada pencerobohan Jepun. Mereka sanggup mengorbankan jiwa demi memperjuangkan kedaulatan negara dan perlu dihargai oleh generasi kini.'},

{n:7,uid:'kl-sej-26-07',form:'F4',topic:'F4 · Bab 4: Era Peralihan Kuasa British',
 q:'Raja-raja Melayu menghantar surat bantahan terhadap Malayan Union (MU) kepada George Henry Hall di London pada tahun 1946. Mengapakah?',
 o:['Mengkritik undang-undang Barat','Memaklumkan keputusan mesyuarat','Menghalang British melanggar perjanjian','Mendakwa diperdaya wakil kerajaan British'],a:3,
 w:'Raja-raja Melayu menghantar surat bantahan kepada George Henry Hall kerana mendakwa telah diperdaya oleh wakil British, Harold MacMichael, yang memaksa raja-raja menandatangani perjanjian penyerahan hak kedaulatan tanpa penjelasan yang jelas.'},

{n:8,uid:'kl-sej-26-08',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'Tokoh berikut merupakan pejuangan kemerdekaan Sarawak.<figure><img src="img/sejarah/ec25cd73eb2a.webp" alt="Rosli Dhoby" loading="lazy" decoding="async" width="497" height="702"><figcaption>Rosli Dhoby</figcaption></figure>Apakah kesan perjuangan tokoh terhadap Sarawak?<br>I&nbsp;&nbsp;Membangkitkan nasionalisme<br>II&nbsp;&nbsp;Membawa penubuhan parti politik<br>III&nbsp;&nbsp;Memperoleh hak berkerajaan sendiri<br>IV&nbsp;&nbsp;Memajukan pendidikan anak tempatan',
 o:['I dan II','I dan IV','II dan III','III dan IV'],a:0,
 w:'Perjuangan Rosli Dhoby telah membangkitkan semangat nasionalisme dalam kalangan rakyat Sarawak dan mencetuskan penubuhan parti-parti politik di Sarawak sebagai medium perjuangan menentang penjajahan British.',
 img:'img/sejarah/ec25cd73eb2a.webp'},

{n:9,uid:'kl-sej-26-09',form:'F4',topic:'F4 · Bab 4: Era Peralihan Kuasa British',
 q:'Maklumat berikut berkaitan pihak yang terlibat dalam Jawatankuasa Kerja yang ditubuhkan pada tahun 1946.<div class="q-box"><ul><li>Pegawai British</li><li>Pemimpin UMNO</li><li>Wakil Raja-raja Melayu</li></ul></div>Apakah matlamat penubuhan jawatankuasa tersebut?',
 o:['Membincangkan bidang kuasa raja','Menentukan tarikh pilihan raya','Merangka asas Perjanjian Persekutuan','Mengawal pergerakan golongan radikal'],a:2,
 w:'Jawatankuasa Kerja 1946 yang dianggotai pegawai British, pemimpin UMNO dan wakil Raja-raja Melayu bermatlamat merangka asas bagi Perjanjian Persekutuan Tanah Melayu 1948 yang menggantikan Malayan Union.'},

{n:10,uid:'kl-sej-26-10',form:'F4',topic:'F4 · Bab 4: Era Peralihan Kuasa British',
 q:'<table class="q-table"><tr><th>Tarikh</th><th>Peristiwa</th></tr><tr><td>1 Februari 1948</td><td>Penubuhan Persekutuan Tanah Melayu</td></tr></table>Apakah kesan peristiwa tersebut terhadap orang Melayu?',
 o:['Berkuasa mengawal pentadbiran','Menggabungkan parti-parti politik','Mempermudah syarat kewarganegaraan','Diiktiraf sebagai penduduk asal'],a:3,
 w:'Penubuhan Persekutuan Tanah Melayu pada 1 Februari 1948 memberi kesan positif kepada orang Melayu kerana mereka diiktiraf sebagai penduduk asal Tanah Melayu, sekali gus memulihkan kedudukan orang Melayu yang tergugat semasa Malayan Union.'},

{n:11,uid:'kl-sej-26-11',form:'F4',topic:'F4 · Bab 6: Ancaman Komunis dan Darurat',
 q:'Bagaimanakah Parti Komunis Malaya (PKM) mengukuhkan pengaruh pada peringkat awal penubuhannya?<br>I&nbsp;&nbsp;Menerbitkan akhbar<br>II&nbsp;&nbsp;Menyalurkan bantuan kewangan<br>III&nbsp;&nbsp;Menjalin kerjasama dengan penduduk<br>IV&nbsp;&nbsp;Menyusup masuk ke dalam kesatuan sekerja',
 o:['I dan II','I dan IV','II dan III','III dan IV'],a:1,
 w:'PKM mengukuhkan pengaruh dengan menerbitkan akhbar sebagai alat propaganda dan menyusup masuk ke dalam kesatuan sekerja bagi mendapatkan sokongan pekerja serta mempengaruhi pergerakan buruh.'},

{n:12,uid:'kl-sej-26-12',form:'F4',topic:'F4 · Bab 6: Ancaman Komunis dan Darurat',
 q:'<div class="q-box"><p><strong>Pegawai British:</strong> Kita memerlukan sokongan penduduk untuk mengalahkan komunis.</p><p><strong>Pemimpin Tempatan:</strong> Kami bersedia bekerjasama asalkan hasrat kami untuk mentadbir sendiri dipertimbangkan.</p></div>Apakah kesan Darurat terhadap politik?',
 o:['Mewujudkan perpaduan','Menjimatkan kos pentadbiran','Mempercepatkan kemerdekaan','Mewujudkan kestabilan politik'],a:2,
 w:'Darurat mempercepatkan kemerdekaan Tanah Melayu kerana British terpaksa berunding dengan pemimpin tempatan bagi mendapat kerjasama menentang komunis, membuka peluang kepada pemimpin tempatan untuk menuntut hak mentadbir sendiri.'},

{n:13,uid:'kl-sej-26-13',form:'F5',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
 q:'<div class="q-box"><ul><li>Satu sistem kabinet bayangan</li><li>Keahlian daripada pegawai tadbir dan tokoh masyarakat</li></ul></div>Sistem Ahli 1951. Bagaimanakah sistem ini membantu penduduk tempatan berkerajaan sendiri?',
 o:['Melicinkan pentadbiran','Menggalakkan perpaduan','Mengenal pasti pemimpin berkaliber','Melatih penduduk tempatan menerajui pentadbiran'],a:3,
 w:'Sistem Ahli 1951 membantu penduduk tempatan berkerajaan sendiri dengan melatih mereka menerajui pentadbiran negara. Pemimpin tempatan dilantik memegang portfolio kementerian tertentu dan mendapat pendedahan dalam pengurusan kerajaan.'},

{n:14,uid:'kl-sej-26-14',form:'F5',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
 q:'Sistem pendidikan tidak dapat memupuk perpaduan kaum. Mengapakah?',
 o:['Kemudahan asas terhad','Tenaga pengajar kurang','Kurikulum pelajaran berbeza','Peruntukan kewangan dikurangkan'],a:2,
 w:'Sistem pendidikan pada zaman penjajahan tidak dapat memupuk perpaduan kaum kerana wujud kurikulum pelajaran yang berbeza antara sekolah vernakular (Melayu, Cina, Tamil) dengan sekolah Inggeris, menyebabkan pelajar diasingkan mengikut kaum.'},

{n:15,uid:'kl-sej-26-15',form:'F5',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
 q:'Pilihan raya Majlis Perundangan Persekutuan 1955 telah diadakan. Parti yang menang ialah',
 o:['Parti Buruh','Parti Negara','Parti Progresif','Parti Perikatan'],a:3,
 w:'Dalam pilihan raya Majlis Perundangan Persekutuan 1955, Parti Perikatan (gabungan UMNO, MCA dan MIC) telah mencapai kemenangan besar dengan memenangi 51 daripada 52 kerusi yang dipertandingkan.'},

{n:16,uid:'kl-sej-26-16',form:'F5',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
 q:'Kabinet pertama telah dibentuk selepas pilihan raya Majlis Perundangan Persekutuan 1955. Mengapakah perkara ini penting?',
 o:['Memperjuangkan pentadbiran tempatan','Membanteras pengaruh komunis','Menyekat campur tangan asing','Memperkukuh kesetiaan rakyat'],a:0,
 w:'Pembentukan kabinet pertama selepas pilihan raya 1955 adalah penting kerana ia menandakan peralihan kuasa pentadbiran kepada pemimpin tempatan. Ini merupakan langkah awal ke arah pemerintahan sendiri dan kemerdekaan penuh.'},

{n:17,uid:'kl-sej-26-17',form:'F5',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
 q:'Apakah isu terma rujukan Suruhanjaya Perlembagaan yang ditubuhkan untuk merangka Perlembagaan 1957?',
 o:['Mengekalkan raja berkuasa mutlak','Mewujudkan kerajaan negeri yang kuat','Menyediakan satu bentuk kewarganegaraan','Mengukuhkan kedudukan rakyat pelbagai kaum'],a:2,
 w:'Antara isu terma rujukan Suruhanjaya Perlembagaan ialah menyediakan satu bentuk kewarganegaraan yang seragam bagi semua penduduk Persekutuan Tanah Melayu tanpa mengira kaum, bagi membentuk identiti kebangsaan yang bersatu.'},

{n:18,uid:'kl-sej-26-18',form:'F5',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
 q:'<table class="q-table"><tr><th>Pertubuhan</th><th>Cadangan</th></tr><tr><td>Dewan Perniagaan Melayu</td><td>Mengetatkan syarat kewarganegaraan</td></tr><tr><td>Persatuan Dewan Perniagaan Cina</td><td>X</td></tr></table>Apakah X?',
 o:['Kewarganegaraan naturalisasi','Kewarganegaraan melalui kelahiran','Kewarganegaraan melalui pendaftaran','Kewarganegaraan melalui permohonan'],a:1,
 w:'Persatuan Dewan Perniagaan Cina mencadangkan kewarganegaraan melalui kelahiran (jus soli) supaya semua yang dilahirkan di Tanah Melayu secara automatik menjadi warganegara, berbeza dengan Dewan Perniagaan Melayu yang ingin mengetatkan syarat kewarganegaraan.'},

{n:19,uid:'kl-sej-26-19',form:'F5',topic:'F4 · Bab 10: Pemasyhuran Kemerdekaan',
 q:'<div class="q-box"><ul><li>Laungan merdeka sebanyak tujuh kali</li><li>101 das tembakan dilepaskan</li></ul></div>Apakah peristiwa ini simbolik kepada Malaysia?',
 o:['Penghormatan kepada British','Pembentukan negara berdaulat','Pengakhiran campur tangan Barat','Penamatan pentadbiran tradisional'],a:1,
 w:'Laungan merdeka tujuh kali dan 101 das tembakan pada 31 Ogos 1957 adalah simbolik kepada pembentukan negara berdaulat yang bebas dan merdeka, menandakan Tanah Melayu telah menjadi sebuah negara yang mempunyai kedaulatan penuh.'},

{n:20,uid:'kl-sej-26-20',form:'F5',topic:'F5 · Bab 1: Kedaulatan Negara',
 q:'Mengapakah kedaulatan undang-undang penting?<br>I&nbsp;&nbsp;Mengukuhkan perpaduan<br>II&nbsp;&nbsp;Memastikan kesejahteraan<br>III&nbsp;&nbsp;Mengekalkan keamanan<br>IV&nbsp;&nbsp;Melahirkan kesetiaan',
 o:['I dan II','I dan IV','II dan III','III dan IV'],a:2,
 w:'Kedaulatan undang-undang penting kerana ia memastikan kesejahteraan rakyat terjamin melalui perlindungan hak asasi dan mengekalkan keamanan dengan memastikan semua pihak tunduk kepada peruntukan undang-undang yang sama.'},

{n:21,uid:'kl-sej-26-21',form:'F5',topic:'F5 · Bab 1: Kedaulatan Negara',
 q:'<div class="q-box"><p><em>sovereignty</em></p></div>Apakah maksud perkataan tersebut?',
 o:['Keagungan','Kesejahteraan','Kekuatan kerajaan','Kuasa penuh pemerintahan'],a:3,
 w:'Perkataan "sovereignty" bermaksud kuasa penuh pemerintahan. Kedaulatan merujuk kepada kuasa tertinggi yang dimiliki oleh sesebuah negara dalam mengurus dan mentadbir hal ehwal dalam dan luar negara tanpa campur tangan pihak luar.'},

{n:22,uid:'kl-sej-26-22',form:'F5',topic:'F5 · Bab 1: Kedaulatan Negara',
 q:'Sambutan Hari Pahlawan diadakan setiap tahun. Apakah kepentingannya kepada generasi kini?',
 o:['Menarik pelancong','Meningkatkan imej','Memupuk patriotisme','Membantu pejuang'],a:2,
 w:'Sambutan Hari Pahlawan setiap tahun bertujuan memupuk semangat patriotisme dalam kalangan generasi kini agar mereka menghargai pengorbanan para pejuang kemerdekaan dan seterusnya mencintai serta mempertahankan negara.'},

{n:23,uid:'kl-sej-26-23',form:'F5',topic:'F4 · Bab 1: Warisan Negara Bangsa',
 q:'Mengapakah British memperkenalkan Charter of Justice di Negeri-Negeri Selat (NNS) pada abad ke-19?',
 o:['Membendung keganasan komunis','Mempelbagaikan kegiatan ekonomi','Menghalang campur tangan kuasa asing','Mengelakkan penindasan terhadap penduduk'],a:3,
 w:'British memperkenalkan Charter of Justice di NNS bagi mengelakkan penindasan terhadap penduduk tempatan. Ia mewujudkan sistem kehakiman yang lebih sistematik dan memastikan keadilan dapat dilaksanakan dengan lebih berkesan.'},

{n:24,uid:'kl-sej-26-24',form:'F5',topic:'F4 · Bab 1: Warisan Negara Bangsa',
 q:'Mengapakah Raja Muda Yusuf menubuhkan Majlis Negeri Perak?',
 o:['Melantik pembesar negeri','Melindungi kebajikan rakyat','Menentukan hala tuju negeri','Menggubal undang-undang'],a:3,
 w:'Raja Muda Yusuf menubuhkan Majlis Negeri Perak bertujuan menggubal undang-undang bagi Perak. Majlis ini merupakan badan perundangan yang berfungsi membuat peraturan dan undang-undang untuk mentadbir negeri.'},

{n:25,uid:'kl-sej-26-25',form:'F5',topic:'F4 · Bab 1: Warisan Negara Bangsa',
 q:'<div class="q-box"><p><em>Durbar</em></p></div>Mengapakah majlis ini dibentuk selepas Negeri-Negeri Melayu Bersekutu (NMB) 1897?',
 o:['Membincangkan hal agama dan adat','Membincangkan hal ehwal pentadbiran','Menggubal undang-undang Persekutuan','Melantik ahli Jemaah Menteri Persekutuan'],a:1,
 w:'Durbar dibentuk selepas penubuhan NMB 1897 bagi membincangkan hal ehwal pentadbiran keempat-empat negeri Melayu yang bersekutu. Ia menjadi platform untuk sultan-sultan dan Residen Jeneral membincangkan dasar dan pentadbiran persekutuan.'},

{n:26,uid:'kl-sej-26-26',form:'F5',topic:'F5 · Bab 1: Kedaulatan Negara',
 q:'Gambar berikut menunjukkan Istana Kehakiman di negara kita.<figure><img src="img/sejarah/6cf29d4008cb.webp" alt="Istana Kehakiman" loading="lazy" decoding="async" width="976" height="703"></figure>Apakah fungsi badan kehakiman?',
 o:['Mentafsir undang-undang','Mengendali pilihan raya','Membubar parlimen','Meminda perlembagaan'],a:0,
 w:'Badan kehakiman berfungsi mentafsir undang-undang yang telah digubal oleh badan perundangan. Kehakiman merupakan cabang ketiga dalam sistem pengasingan kuasa, bertanggungjawab memastikan undang-undang dipatuhi dan keadilan ditegakkan.',
 img:'img/sejarah/6cf29d4008cb.webp'},

{n:27,uid:'kl-sej-26-27',form:'F5',topic:'F5 · Bab 10: Kecemerlangan Malaysia di Persada Dunia',
 q:'Bagaimanakah Kerajaan Persekutuan dan Kerajaan Negeri bekerjasama untuk menjamin kesejahteraan rakyat?<br>I&nbsp;&nbsp;Penyediaan perumahan rakyat<br>II&nbsp;&nbsp;Pembangunan koridor wilayah<br>III&nbsp;&nbsp;Membangunkan taman rekreasi<br>IV&nbsp;&nbsp;Menyediakan pendidikan teknologi',
 o:['I dan II','I dan IV','II dan III','III dan IV'],a:0,
 w:'Kerajaan Persekutuan dan Kerajaan Negeri bekerjasama dalam menjamin kesejahteraan rakyat melalui penyediaan perumahan rakyat yang mampu milik dan pembangunan koridor wilayah untuk memajukan kawasan yang kurang membangun.'},

{n:28,uid:'kl-sej-26-28',form:'F5',topic:'F5 · Bab 10: Kecemerlangan Malaysia di Persada Dunia',
 q:'Apakah peranan Majlis Kewangan Negara dalam menyelaraskan pentadbiran Kerajaan Persekutuan dengan Kerajaan Negeri?',
 o:['Membentuk dasar tanah','Menguruskan bayaran cukai','Membangunkan Kerajaan Tempatan','Menyediakan tanah pada harga rendah'],a:1,
 w:'Majlis Kewangan Negara berperanan menguruskan bayaran cukai dan menyelaraskan hal-hal kewangan antara Kerajaan Persekutuan dan Kerajaan Negeri bagi memastikan pembahagian hasil cukai dilaksanakan secara adil dan sistematik.'},

{n:29,uid:'kl-sej-26-29',form:'F5',topic:'F5 · Bab 10: Kecemerlangan Malaysia di Persada Dunia',
 q:'Apakah langkah yang diambil oleh kerajaan Singapura bagi meninjau pandangan rakyatnya terhadap gagasan Malaysia pada tahun 1962?',
 o:['Melalui usul parlimen','Membuat referendum','Mengadakan lawatan','Melaksana pilihan raya'],a:1,
 w:'Kerajaan Singapura telah mengadakan referendum pada tahun 1962 untuk meninjau pandangan rakyat Singapura tentang penyertaan mereka dalam gagasan Malaysia. Majoriti rakyat Singapura menyokong penggabungan dengan Malaysia.'},

{n:30,uid:'kl-sej-26-30',form:'F5',topic:'F5 · Bab 10: Kecemerlangan Malaysia di Persada Dunia',
 q:'Rajah berikut menunjukkan perubahan tarikh pembentukan Malaysia.<div style="text-align:center;margin:8px 0"><span style="border:1px solid #444;padding:3px 10px">31 Ogos 1963</span> &#8594; <span style="border:1px solid #444;padding:3px 10px">16 September 1963</span></div>Mengapakah berlaku perubahan tarikh tersebut?',
 o:['Bantahan rakyat Brunei','Kelewatan laporan PBB','Serangan dari Indonesia','Ancaman komunis'],a:1,
 w:'Tarikh pembentukan Malaysia ditukar daripada 31 Ogos 1963 kepada 16 September 1963 kerana kelewatan laporan Pertubuhan Bangsa-Bangsa Bersatu (PBB) yang mengkaji sama ada rakyat Sabah dan Sarawak bersetuju dengan pembentukan Malaysia.'},

{n:31,uid:'kl-sej-26-31',form:'F5',topic:'F5 · Bab 10: Kecemerlangan Malaysia di Persada Dunia',
 q:'Apakah isu ekonomi yang menjadi pertikaian antara Malaysia dan Singapura selepas pembentukan Malaysia?',
 o:['Rusuhan kaum','Peranan Singapura terhad','Nilai pertukaran mata wang','Tambahan cukai'],a:3,
 w:'Isu ekonomi utama yang menjadi pertikaian antara Malaysia dan Singapura ialah soal tambahan cukai. Singapura enggan mematuhi dasar cukai yang ditetapkan kerajaan pusat Malaysia, menyebabkan hubungan kedua-dua pihak semakin tegang.'},

{n:32,uid:'kl-sej-26-32',form:'F5',topic:'F5 · Bab 10: Kecemerlangan Malaysia di Persada Dunia',
 q:'Apakah faktor utama tercetusnya rusuhan kaum pada 13 Mei 1969?',
 o:['Propaganda tentera Jepun','Kemelesetan ekonomi dunia','Keputusan Pilihan Raya Umum Ketiga','Provokasi daripada pihak British'],a:2,
 w:'Rusuhan kaum 13 Mei 1969 tercetus berikutan ketegangan yang wujud akibat keputusan Pilihan Raya Umum Ketiga. Perarakan kemenangan oleh beberapa parti pembangkang yang bersifat provokatif telah mencetuskan rusuhan kaum yang serius.'},

{n:33,uid:'kl-sej-26-33',form:'F5',topic:'F5 · Bab 10: Kecemerlangan Malaysia di Persada Dunia',
 q:'Mengapakah kerajaan menubuhkan Universiti Kebangsaan Malaysia (UKM) pada 18 Mei 1970?',
 o:['Memartabatkan Bahasa Melayu','Memperkukuh integrasi nasional','Memupuk jati diri rakyat Malaysia','Mempelbagaikan institusi keilmuan'],a:0,
 w:'UKM ditubuhkan pada 18 Mei 1970 bertujuan memartabatkan Bahasa Melayu sebagai bahasa ilmu dan bahasa pengantar di peringkat pengajian tinggi, sesuai dengan semangat Perlembagaan yang menetapkan Bahasa Melayu sebagai bahasa kebangsaan.'},

{n:34,uid:'kl-sej-26-34',form:'F5',topic:'F5 · Bab 10: Kecemerlangan Malaysia di Persada Dunia',
 q:'Apakah tujuan pengisytiharan Rukun Negara pada 31 Ogos 1970?',
 o:['Membangunkan modal insan','Mengukuhkan perpaduan rakyat','Meningkatkan kemajuan ekonomi','Memupuk semangat juang rakyat'],a:1,
 w:'Rukun Negara diisytiharkan pada 31 Ogos 1970 bertujuan mengukuhkan perpaduan rakyat pelbagai kaum di Malaysia yang telah tergugat akibat rusuhan kaum 13 Mei 1969. Lima prinsip Rukun Negara menjadi asas perpaduan dan integrasi nasional.'},

{n:35,uid:'kl-sej-26-35',form:'F5',topic:'F5 · Bab 10: Kecemerlangan Malaysia di Persada Dunia',
 q:'Bagaimanakah pelaksanaan Dasar Ekonomi Baru (DEB) membantu mengurangkan kemiskinan dalam kalangan rakyat?<br>I&nbsp;&nbsp;Meningkatkan hubungan dagang<br>II&nbsp;&nbsp;Mengurangkan kadar cukai<br>III&nbsp;&nbsp;Menambah pendapatan rakyat<br>IV&nbsp;&nbsp;Memperbanyak peluang pekerjaan',
 o:['I dan II','I dan IV','II dan III','III dan IV'],a:3,
 w:'DEB membantu mengurangkan kemiskinan dengan menambah pendapatan rakyat melalui pelbagai program pembangunan dan memperbanyak peluang pekerjaan dalam pelbagai sektor ekonomi kepada golongan yang kurang bernasib baik.'},

{n:36,uid:'kl-sej-26-36',form:'F5',topic:'F5 · Bab 10: Kecemerlangan Malaysia di Persada Dunia',
 q:'Dasar Ekonomi Baru (DEB) dan Dasar Pembangunan Nasional (DPN) berjaya melahirkan masyarakat Perdagangan dan Perindustrian Bumiputera. Apakah bukti kejayaan tersebut?',
 o:['Pembentukan kelas bumiputera komersial','Pembukaan pemilikan saham amanah','Peningkatan kualiti hidup penduduk','Pengurangan kadar kemiskinan rakyat'],a:0,
 w:'Bukti kejayaan DEB dan DPN ialah pembentukan kelas bumiputera komersial yang aktif dalam sektor perniagaan dan perindustrian, termasuk usahawan dan pengusaha Bumiputera yang berjaya dalam pelbagai bidang ekonomi.'},

{n:37,uid:'kl-sej-26-37',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',
 q:'Dasar luar penting kepada Malaysia kerana mampu mempengaruhi tindakan negara. Pihak manakah yang berperanan menggubal dasar tersebut?',
 o:['Kementerian Dalam Negeri','Kedutaan Malaysia','Parlimen Malaysia','Pejabat Wisma Putra'],a:3,
 w:'Pejabat Wisma Putra (Kementerian Luar Negeri Malaysia) berperanan menggubal dasar luar negara Malaysia. Pejabat ini bertanggungjawab merancang, menyelaras dan melaksanakan dasar luar Malaysia dalam urusan hubungan antarabangsa.'},

{n:38,uid:'kl-sej-26-38',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',
 q:'Sidang kemuncak Ketua-Ketua Negara ASEAN telah diadakan di Bali, Indonesia pada tahun 1976. Mengapakah persidangan tersebut diadakan?',
 o:['Membincangkan pergolakan di Indochina','Mengatasi ancaman komunis di Thailand','Menamatkan konfrontasi Indonesia','Menyelesaikan pencemaran alam sekitar'],a:0,
 w:'Sidang Kemuncak ASEAN pertama di Bali pada tahun 1976 diadakan untuk membincangkan pergolakan di Indochina (Vietnam, Laos, Kemboja) yang membimbangkan negara-negara ASEAN berikutan kejatuhan Vietnam Selatan kepada komunis pada tahun 1975.'},

{n:39,uid:'kl-sej-26-39',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',
 q:'Maklumat berikut berkaitan dengan peranan Malaysia dalam hubungan ekonomi antarabangsa.<table class="q-table"><tr><th>Tahun</th><th>Peristiwa</th></tr><tr><td>1992</td><td>Perjanjian kawasan Perdagangan Bebas ASEAN (AFTA) ditandatangani</td></tr></table>Apakah tujuan perjanjian tersebut ditandatangani?',
 o:['Mengurangkan kebergantungan kepada Barat','Meningkatkan kerjasama ekonomi','Menghapus monopoli kuasa besar','Mengurangkan cukai pelabuhan'],a:1,
 w:'Perjanjian AFTA ditandatangani pada tahun 1992 bertujuan meningkatkan kerjasama ekonomi antara negara-negara ASEAN melalui pengurangan tarif dan halangan perdagangan bagi mewujudkan kawasan perdagangan bebas yang kompetitif.'},

{n:40,uid:'kl-sej-26-40',form:'F5',topic:'F5 · Bab 9: Dasar Luar Malaysia',
 q:'Malaysia telah memperkenalkan Anugerah Langkawi mulai tahun 1991. Mengapakah anugerah tersebut diperkenalkan?',
 o:['Mengiktiraf atlet yang berjaya dalam sukan','Menggalakkan penglibatan dalam bidang teknologi','Menghargai sumbangan dalam bidang alam sekitar','Mengiktiraf penglibatan dalam bidang kemanusiaan'],a:2,
 w:'Anugerah Langkawi diperkenalkan pada tahun 1991 untuk menghargai sumbangan individu atau pertubuhan dalam bidang alam sekitar. Anugerah ini mencerminkan komitmen Malaysia dalam menjaga kelestarian alam sekitar di peringkat antarabangsa.'}

{n:2,uid:'mlk-sej-26-02',form:'F4',topic:'F4 · Bab 1: Warisan Negara Bangsa',

{n:3,uid:'mlk-sej-26-03',form:'F4',topic:'F4 · Bab 2: Kebangkitan Nasionalisme',
 q:'<div class="spm-box">Revolusi Perancis 1789</div><p>Revolusi tersebut telah menyebabkan Perancis</p>',
