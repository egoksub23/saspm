<style>
:root {
  --bg: #F4F7FA; --bg2: #FFFFFF; --bg3: #EEF2F7;
  --fg: #0F1923; --fg2: #546778; --fg3: #8899A6;
  --border: #DDE4EC;
  --accent: #0A7070; --accent-fg: #FFFFFF; --accent-light: #D6F5F5;
  --high: #B45309; --high-light: #FEF3C7; --high-fg: #92400E;
  --pill-bg: #EEF2F7;
  --shadow: 0 1px 3px rgba(15,25,35,.07);
  --r: 10px; --r-sm: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0C1520;--bg2:#152030;--bg3:#1A2B40;
    --fg:#E8EDF5;--fg2:#8AA0B8;--fg3:#566E88;
    --border:#263650;--accent:#2AC5C5;--accent-fg:#0C1520;
    --accent-light:#0A2A30;--high:#FBB040;--high-light:#2D1800;--high-fg:#FDD080;
    --pill-bg:#1A2B40;--shadow:0 1px 4px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"] {
  --bg:#0C1520;--bg2:#152030;--bg3:#1A2B40;
  --fg:#E8EDF5;--fg2:#8AA0B8;--fg3:#566E88;
  --border:#263650;--accent:#2AC5C5;--accent-fg:#0C1520;
  --accent-light:#0A2A30;--high:#FBB040;--high-light:#2D1800;--high-fg:#FDD080;
  --pill-bg:#1A2B40;--shadow:0 1px 4px rgba(0,0,0,.3);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;font-size:14px;line-height:1.6;}
.site-header{background:var(--bg2);border-bottom:1px solid var(--border);
  padding:14px max(16px,env(safe-area-inset-left,0px));
  margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.header-title{font-size:15px;font-weight:700;letter-spacing:-.01em;}
.header-title span{color:var(--accent);}
.header-meta{font-size:11px;color:var(--fg3);letter-spacing:.03em;text-transform:uppercase;}
.tabs-wrap{background:var(--bg2);border-bottom:1px solid var(--border);
  margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:0 max(16px,env(safe-area-inset-left,0px));
  overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:10;}
.tabs-wrap::-webkit-scrollbar{display:none;}
.tabs{display:flex;min-width:max-content;}
.tab{padding:11px 13px;font-size:12px;font-weight:500;color:var(--fg2);
  border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;
  white-space:nowrap;transition:color .15s,border-color .15s;}
.tab:hover{color:var(--fg);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
.tab .mark{display:inline-block;font-size:10px;font-weight:600;padding:1px 5px;border-radius:10px;
  margin-left:4px;background:var(--high-light);color:var(--high);letter-spacing:.02em;}
.filter-bar{padding:10px 0 6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.filter-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg3);}
.chip{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:500;
  background:var(--pill-bg);color:var(--fg2);border:1px solid transparent;
  cursor:pointer;transition:all .15s;}
.chip:hover{border-color:var(--border);color:var(--fg);}
.chip.active{background:var(--accent);color:var(--accent-fg);font-weight:600;}
.card-grid{display:grid;gap:10px;
  grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr));
  padding-block:10px 32px;}
.card{background:var(--bg2);border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden;}
.card-head{padding:10px 12px 8px;display:flex;align-items:center;gap:8px;justify-content:space-between;}
.negeri-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;
  background:var(--accent-light);color:var(--accent);letter-spacing:.04em;white-space:nowrap;}
.card-topik{font-size:13px;font-weight:600;padding:0 12px 6px;color:var(--fg);}
.card-body{padding:0 12px 10px;}
.card-body p{margin:0 0 5px;font-size:13px;color:var(--fg2);}
.bahan-box{background:var(--bg3);border-radius:var(--r-sm);padding:7px 9px;margin-bottom:5px;font-size:12px;}
.bahan-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--fg3);margin-bottom:2px;}
.bahan-title{color:var(--fg);font-weight:500;line-height:1.4;}
.bahan-src{color:var(--fg3);font-size:11px;margin-top:2px;}
.subq-list{list-style:none;padding:0;margin:5px 0 0;display:flex;flex-direction:column;gap:4px;}
.subq-item{background:var(--bg3);border-radius:var(--r-sm);padding:6px 9px;}
.subq-arahan{font-size:12px;color:var(--fg);}
.subq-marks{font-size:10px;font-weight:700;color:var(--accent);letter-spacing:.04em;}
.essay-list{display:flex;flex-direction:column;gap:5px;margin-top:4px;}
.essay-item{border-left:3px solid var(--border);padding:5px 9px;border-radius:0 var(--r-sm) var(--r-sm) 0;}
.essay-item:hover{border-left-color:var(--accent);}
.essay-num{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:1px;}
.essay-topik{font-size:13px;font-weight:600;}
.essay-arahan{font-size:12px;color:var(--fg2);margin-top:2px;}
.reveal-btn{margin-top:8px;width:100%;padding:6px 12px;border-radius:var(--r-sm);
  font-size:12px;font-weight:600;cursor:pointer;background:var(--bg3);color:var(--fg2);
  border:1px solid var(--border);transition:all .15s;
  display:flex;align-items:center;justify-content:center;gap:5px;}
.reveal-btn:hover{background:var(--accent-light);color:var(--accent);border-color:var(--accent);}
.reveal-btn.open{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);}
.jaw-panel{margin-top:7px;padding:9px 11px;background:var(--bg3);border-radius:var(--r-sm);
  font-size:12px;line-height:1.65;border-left:3px solid var(--accent);}
.jaw-panel .j-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:4px;}
.jaw-panel ul{margin:0;padding-left:15px;}
.jaw-panel ul li{margin-bottom:2px;}
.jaw-panel p{margin:0 0 4px;}
.isi-section{margin-bottom:7px;}
.isi-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--high);margin-bottom:3px;}
.peri-item{margin-bottom:5px;}
.peri-kata{font-style:italic;color:var(--fg);font-weight:500;}
.peri-makna{color:var(--fg2);font-size:11px;margin-top:1px;}
.summary-wrap{overflow-x:auto;margin:0;}
.summary-table{width:100%;border-collapse:collapse;font-size:12px;min-width:600px;}
.summary-table th{background:var(--bg3);padding:7px 11px;text-align:left;font-weight:600;
  font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg3);
  border-bottom:2px solid var(--border);}
.summary-table td{padding:8px 11px;border-bottom:1px solid var(--border);vertical-align:top;}
.summary-table tr:last-child td{border-bottom:none;}
.summary-table tr:hover td{background:var(--bg3);}
.negeri-col{font-weight:700;color:var(--accent);white-space:nowrap;}
.high-tag{background:var(--high-light);color:var(--high);font-size:10px;font-weight:700;
  padding:2px 6px;border-radius:4px;letter-spacing:.04em;}
.section-wrap{padding-block:10px 32px;}
.section-wrap h3{font-size:13px;font-weight:700;margin:0 0 10px;}
.soalan-box{background:var(--bg3);border-left:3px solid var(--accent);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:9px 11px;margin-bottom:7px;font-size:13px;color:var(--fg);line-height:1.65;}
.soalan-note{font-size:11px;color:var(--fg3);font-style:italic;margin:0 0 5px;}
.marks-pill{font-size:11px;font-weight:700;color:var(--high);background:var(--high-light);padding:2px 7px;border-radius:10px;margin-bottom:6px;display:inline-block;}
.perc-pill{font-size:9px;font-weight:800;padding:2px 6px;border-radius:3px;background:#DBEAFE;color:#1D4ED8;letter-spacing:.05em;}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .spm-pill{background:#064E3B;color:#6EE7B7;}}

i": {"soalan": "Huraikan satu peristiwa yang dapat memberikan motivasi kepada pembaca dan kemukakan pendapat anda", "markah": 6, "nota": "Markah isi 4m + bahasa 2m; jawapan berdasarkan mana-mana novel yang dipelajari", "novel_cadangan": {"Pantai Kasih karya Azmah Nordin": ["Peristiwa: Dr. Raiha belajar dengan tekun sehingga berjaya menjadi doktor pakar bedah di Pusat Rawatan Pantai Kasih. Pendapat: Peristiwa ini dapat memberi motivasi pembaca agar rajin menuntut ilmu demi mencapai cita-cita.", "Peristiwa: Walaupun sibuk dan menghadapi tekanan kerja, Dr. Raiha tetap mengutamakan keselamatan pesakitnya. Pendapat: Peristiwa ini dapat memberi motivasi kepada pembaca supaya amanah dan berdedikasi dalam menjalankan sesuatu pekerjaan.", "Peristiwa: Walaupun kehilangan anak kesayangannya Rohayu dalam kejadian kebakaran kereta, Dr. Raiha masih mampu meneruskan kehidupannya dan bekerja sebagai doktor. Pendapat: Peristiwa ini memberi motivasi kepada pembaca agar reda dan tabah menghadapi ujian yang berat.", "Peristiwa: Peristiwa Ibu Unong Siron yang sanggup tidur di atas lantai hospital semasa menjaga anaknya yang mendapat rawatan di Pusat Rawatan Pantai Kasih. Pendapat: Peristiwa ini dapat memberi motivasi kepada pembaca agar menjadi seorang ibu yang bertanggungjawab dan penyayang."], "Bimasakti Menari karya Sri Rahayu Mohd Yusop": ["Peristiwa: Muhammad Taufik tetap berani dan tidak mengalah demi mempertahankan khazanah alam walaupun diculik oleh individu tidak bertanggungjawab kerana usahanya untuk menjayakan projek Kawasan Simpan Langit Gelap dianggap mengganggu kepentingan pihak tertentu. Pendapat: Peristiwa ini memberi motivasi kepada pembaca supaya berani mempertahankan perkara yang benar dan tidak mudah berputus asa walaupun berhadapan dengan ancaman serta cabaran yang besar.", "Peristiwa: Nurul Hafsa berusaha bersungguh-sungguh untuk menyedarkan masyarakat tentang kesan pencemaran cahaya terhadap habitat kelip-kelip dan keindahan langit malam walaupun cadangan tersebut pada awalnya dipandang remeh dan kurang mendapat perhatian. Pendapat: Peristiwa ini dapat memberi motivasi kepada pembaca agar sentiasa cekal dan yakin pada kemampuan diri dalam mencapai sesuatu matlamat.", "Peristiwa: Muhammad Taufik yang mempunyai kepakaran dalam bidang astronomi sanggup pulang dari luar negara untuk membantu menjayakan projek Kawasan Simpan Langit Gelap di Kuala Selangor. Pendapat: Peristiwa ini memberi motivasi kepada pembaca supaya memanfaatkan ilmu yang dimiliki demi kesejahteraan masyarakat dan negara.", "Peristiwa: Sebagai abang, Budiman sentiasa mengambil berat tentang keselamatan dan kebajikan adiknya ketika Nurul Hafsa berdepan dengan pelbagai cabaran dalam usaha memelihara alam sekitar. Pendapat: Peristiwa ini memberi motivasi kepada pembaca tentang pentingnya sokongan keluarga dalam membantu seseorang mencapai kejayaan."]}}, "q8_ji": [], "q8_jii": "", "q9_topik": "Pendidikan dan Latihan Teknikal dan Vokasional (TVET)", "q9_arahan": "", "q9_b1": {"judul": "TVET lahirkan Modal Insan Berkemahiran oleh Prof. Madya Ts. Dr Ahmad Mubarak Tajul Arifin", "penulis": "", "sumber": "Bernama.com 14 Mei 2025", "ringkasan": "stigma TVET sebagai kelas kedua, usaha kerajaan, peluang ke IPT seperti UTM, UTEM, UniMAP, UMP Al-Sultan Abdullah; Pelan Pembangunan Pendidikan 2013-2025 mewujudkan kolej vokasional/komuniti dan institut kemahiran", "jenis": "", "excerpt": ""}, "q9_b2": {"judul": "Infografik INFO TVET", "penulis": "", "sumber": "", "ringkasan": "TVET menyediakan latihan teknikal dan vokasional; graduan peluang pekerjaan tinggi", "jenis": "", "excerpt": ""}, "q9_b3": {"judul": "Infografik TVET Pihak Kerajaan", "penulis": "", "sumber": "", "ringkasan": "menggalakkan perkongsian kepakaran dan teknologi antara industri dan penyedia latihan TVET; memperluas insentif khas penglibatan industri", "jenis": "", "excerpt": ""}, "q9_isi_tersurat": [], "q9_isi_tersirat": [], "q9_rumusan_contoh": "", "source_type": "percubaan"}, {"negeri": "Kuala Lumpur", "k1_bah_a_topik": "Stres dalam kalangan masyarakat Malaysia", "k1_bah_a_arahan": "Petikan dan grafik di bawah menunjukkan maklumat tentang stres. Berdasarkan maklumat tersebut, huraikan pendapat anda tentang stres dalam kalangan masyarakat Malaysia. Panjangnya huraian anda hendaklah antara 150 hingga 200 patah perkataan.", "k1_bah_a_grafik": "", "k1_bah_a_isi": [], "k1_bah_b": [{"num": 1, "topik": "Pertanian", "arahan": "Huraikan langkah yang dinyatakan dalam petikan berserta langkah-langkah lain untuk menarik minat generasi muda menceburi sektor ini.", "source": "www.astroawani.com", "isi": []}, {"num": 2, "topik": "Pencemaran plastik / alam sekitar", "arahan": "Sebagai respons terhadap petikan di atas, huraikan usaha-usaha untuk mengatasi masalah tersebut.", "source": "ikim.gov.my", "isi": []}, {"num": 3, "topik": "Industri pelancongan", "arahan": "Huraikan manfaat-manfaat industri tersebut kepada masyarakat dan negara.", "source": "melancong.my", "isi": []}, {"num": 4, "topik": "Karya sastera / tabiat membaca", "arahan": "Bincangkan peranan pelbagai pihak untuk menggalakkan murid-murid membaca karya tersebut.", "source": "\"Karya Sastera Kurang Difahami\", Dewan Budaya", "isi": []}], "q1_jenis": "Kata bantu", "q1_topik": "", "q1_jawapan": [], "q2_jenis": "Sintaksis — Ayat Majmuk kepada Ayat Tunggal", "q2_topik": "", "q2_jawapan": [], "q3_b1": {"judul": "", "penulis": "", "sumber": "", "ringkasan": "", "jenis": "", "excerpt": ""}, "q3_b2": {"judul": "Kasihi Sungai Kita — Punca-punca Pencemaran Sungai", "penulis": "", "sumber": "", "ringkasan": "", "jenis": "Infografik", "excerpt": ""}, "q3_sk": {}, "q4_teks": "Setelah sudah ia fikir, maka Patih Gajah Mada pun ingat akan Petala Bumi itu. Maka Patih Gajah Mada pun segera menyuruh kepada bini Petala Bumi bertanyakan anaknya yang bernama Kertala Sari pergi mencuri ke Daha itu, sudahkah datang dari Daha atau belumkah. Maka orang Patih Gajah Mada pun pergilah kepada bininya Petala Bumi.", "q4_source": "Dipetik daripada 'Kepimpinan Melalui Teladan' dalam antologi Jaket Kulit Kijang Dari Istanbul, Kementerian Pendidikan Malaysia", "q4_jawapan": "", "q5_jenis": "Peribahasa", "q5_peribahasa": [], "q5_konteks": "", "q5_jawapan": [], "q6_topik": "Herba dan perubatan tradisional", "q6_b1": {"judul": "", "penulis": "", "sumber": "", "ringkasan": "", "jenis": "", "excerpt": ""}, "q6_b2": {"judul": "", "penulis": "", "sumber": "", "ringkasan": "", "jenis": "", "excerpt": ""}, "q6_subq": [{"num": "i", "arahan": "Berdasarkan Bahan 1, berikan maksud rangkai kata mengandungi sebatian.", "markah": 2, "jawapan": ["{'jawapan': 'mempunyai campuran', 'markah': 2}", "{'jawapan': 'mempunyai sebatian', 'markah': 1}", "{'jawapan': 'mengandungi campuran', 'markah': 1}"]}, {"num": "ii", "arahan": "Berdasarkan Bahan 1 dan Bahan 2, nyatakan kebaikan yang diperoleh daripada tanaman herba.", "markah": 3, "jawapan": ["[bahan1] P1: membantu untuk meningkatkan daya tahan tubuh dan menyokong fungsi organ", "[bahan1] P2: membantu sistem penghadaman dan pernafasan", "[bahan1] P3: membuka peluang ekonomi melalui produk makanan tambahan dan bahan kosmetik berasaskan bahan semula jadi", "[bahan2] P1: boleh digunakan sebagai bahan penyedap dalam masakan", "[bahan2] P2: untuk tujuan perubatan, terutamanya dalam kaedah perubatan tradisional", "[nota] Jawapan calon mestilah berdasarkan semua bahan. Maksimum 3 markah, isi cukup 2 isi."]}, {"num": "iii", "arahan": "Pengunaan herba untuk tujuan perubatan sudah bermula sejak dahulu. Di seluruh dunia penggunaan tumbuhan herba sebagai ubat-ubatan menjadi subjek penting dalam bidang pengajian etnobotani. Pada pendapat anda, apakah langkah-langkah yang boleh diambil untuk mempopularkan perubatan tradisional dalam kalangan masyarakat?", "markah": 3, "jawapan": ["P1: mengumpulkan dan membukukan ilmu perubatan tradisional/penyelidikan", "P2: membenarkan ubat-ubatan tradisional dijual di klinik atau hospital awam dan swasta", "P3: mengadakan kempen penggunaan ubat-ubatan tradisional", "P4: mempromosikan produk herba yang berkualiti dan berdaftar", "P5: memberikan pendedahan kepada generasi muda/anak-anak tentang khasiat herba"]}, {"num": "iv", "arahan": "Rakan anda kurang yakin untuk mengambil ubat-ubatan tradisional kerana khuatir akan mengalami keracunan atau kesan sampingan yang boleh memudaratkan kesihatan. Sebagai seorang rakan yang prihatin, apakah saranan yang boleh anda sampaikan kepada rakan anda tentang pengambilan ubat-ubatan tradisional?", "markah": 4, "jawapan": ["P1: memastikan produk ubat-ubatan tersebut berdaftar dengan pihak berkuasa berkenaan seperti Pihak Berkuasa Kawalan Dadah (PBKD)/Kementerian Kesihatan Malaysia (KKM)", "P2: menyemak kesahihan nombor pendaftaran pada produk tersebut", "P3: membuat laporan kepada pihak berkuasa jika menjumpai ubat tiruan", "P4: mendapatkan khidmat nasihat pegawai perubatan terlebih dahulu sebelum membeli ubat-ubatan tersebut", "P5: merujuk testimoni pengguna lain"]}], "q7_tema": "Patriotisme dan jati diri bangsa Melayu", "q7_b1": {"judul": "", "penulis": "", "sumber": "", "ringkasan": "", "jenis": "Cerpen", "excerpt": ""}, "q7_b2": {"judul": "", "penulis": "", "sumber": "", "ringkasan": "", "jenis": "Sajak", "excerpt": ""}, "q7_subq": [{"num": "i", "arahan": "Berdasarkan Bahan 1, apakah maksud rangkai kata generasi material?", "markah": 2, "jawapan": ["{'jawapan': 'kumpulan/angkatan kebendaan', 'markah': 2}", "{'jawapan': 'kumpulan/angkatan material', 'markah': 1}", "{'jawapan': 'generasi kebendaan', 'markah': 1}"]}, {"num": "ii", "arahan": "Berdasarkan Bahan 1 dan Bahan 2, nyatakan dua harapan yang ingin diketengahkan oleh penulis.", "markah": 3, "jawapan": ["[bahan1] P1: menghidupkan roh patriotisme dan jati diri dalam diri (saya)", "[bahan1] P2: Menjadi pejuang yang berani mempertahankan nilai dan kepentingan bangsa saya sendiri", "[bahan2] P1: Tetap teguh sepanjang zaman (teguh berdiri menepis zaman)", "[bahan2] P2: Warisan nenek moyang perlu diangkat/dijunjung/mengangkat warisan nenek moyang (Warisan nenek moyang kau junjung)", "[bahan2] P3: Bangsa Melayu akan terus berkembang/maju (Melayu bangsaku akan terus mekar)", "[nota] Jawapan mestilah berdasarkan semua bahan. Maksimum 3 markah, isi cukup 2 isi."]}, {"num": "iii", "arahan": "Remaja sekarang semakin hilang nilai-nilai patriotik dalam diri. Pada pendapat anda, apakah punca-punca berlakunya isu tersebut?", "markah": 4, "jawapan": ["P1: terpengaruh oleh budaya barat/budaya kuning", "P2: kurang penghayatan terhadap sejarah negara", "P3: kurang peranan ibu bapa", "P4: sikap individualistik/materialistik", "P5: kurang pendedahan kepada program kenegaraan", "P6: kurangnya penghayatan nilai agama dan moral"]}, {"num": "iv", "arahan": "Anda merupakan salah seorang pengawas yang terlibat dalam program Sambutan Bulan Kemerdekaan. Anda mendapati beberapa orang murid memasang bendera secara terbalik. Sebagai pengawas yang bertanggungjawab, apakah tindakan yang akan anda ambil untuk menyelesaikan perkara tersebut?", "markah": 4, "jawapan": ["P1: menegur/menasihati murid tersebut", "P2: melaporkan kepada guru", "P3: membantu/mengajar murid tersebut memasang bendera dengan betul", "P4: menanyakan sebab berbuat demikian"]}], "q8_novel": "", "q8_desc": "", "q8_si": {"sub": "i", "arahan": "Baca petikan novel di bawah dengan teliti, kemudian jawab soalan yang berikutnya dengan menggunakan ayat anda sendiri.", "novel": "Silir Daksina", "pengarang": "Nizar Parman", "penerbit": "Kementerian Pendidikan Malaysia", "petikan": "Aku dapat merasakan keanehan dalam diriku pada malam itu. Entah mengapa, kerinduanku terhadap Aiman terlalu memuncak. Kerinduan yang menyebabkan air mataku mengalir menuruni cerun-cerun pipiku tanpa kusedari. Kucuba untuk membayangkan wajahnya. Adakah Aiman masih serupa dahulu? Masihkah Aiman secomel dahulu? Terlalu banyak persoalan tentang Aiman yang kini bergentayangan di benakku.\n\nKuambil potretnya yang kuletakkan di atas sebuah meja kecil di sebelah katilku. Lalu kutatap berulang kali dan kudakapkan ke dada. Saat itu rindu terlalu menyentuh tangkai hati. Andainya aku ini angin, ingin sahaja aku bertiup ke sana, membelai dan menemaninya sepanjang malam.", "soalan": "Apakah yang berlaku kepada 'aku' apabila rindunya terhadap Aiman terlalu memuncak?", "markah": 4, "skema": ["P1: Menyebabkan air mataku mengalir menuruni cerun-cerun pipiku tanpa kusedari", "P2: Kucuba untuk membayangkan wajahnya", "P3: Kuambil potretnya yang kuletakkan di atas sebuah meja kecil di sebelah katilku", "P4: Kutatap berulang kali dan kudakapkan ke dada"], "nota": "Perlu disalin bulat-bulat daripada petikan. Maksimum 4 markah, isi cukup 3 isi."}, "q8_sii": {"sub": "ii", "soalan": "Jawab soalan di bawah berdasarkan novel-novel yang berikut. Berdasarkan dua buah novel yang anda pelajari, huraikan satu peristiwa yang menjadi cabaran dalam masyarakat.", "markah": 6, "novels_senarai": ["(a) Leftenan Adnan Wira Bangsa karya Abdul Latip Talib", "(b) Di Sebalik Dinara karya Dayang Nor", "(c) Jendela Menghadap Jalan karya Ruhaini Matdarin", "(d) Pantai Kasih karya Azmah Nordin", "(e) Songket Berbenang Emas karya Khairuddin Ayip", "(f) Tirani karya Beb Sabariah", "(g) Bimasakti Menari karya Sri Rahayu Mohd Yusop", "(h) Silir Daksina karya Nizar Parman"], "skema": {"panduan": "Jawapan berdasarkan sebuah novel yang dipelajari. Beri 1 markah bagi setiap isi yang betul + 1 markah bagi peristiwa/huraian/contoh yang lengkap/jelas. Markah isi maksimum 4 markah (2 markah bagi setiap isi dan peristiwa/huraian). Markah bahasa maksimum 2 markah.", "novel_leftenan_adnan": {"tajuk": "Leftenan Adnan Wira Bangsa karya Abdul Latip Talib", "peristiwa_cabaran": [{"peristiwa": "Adnan ingin menjadi askar tetapi hasratnya mendapat tentangan daripada ibunya. Ibu Adnan membantah hasrat Adnan yang ingin menjadi askar kerana pekerjaan askar tidak menjamin kehidupan Adnan.", "huraian": "Peristiwa ini membawa cabaran bagi watak utama kerana menjadi askar merupakan hasratnya sejak kecil dan dia tidak ingin melepaskan peluang keemasan ini."}, {"peristiwa": "Pak Saidi telah menghantar anaknya ke sekolah Inggeris untuk perbaiki kehidupan mereka namun telah ditentang dan dicemuh oleh masyarakat dengan menuduhnya menjadi tali barut Inggeris.", "huraian": "Peristiwa ini membawa cabaran kepada seorang ayah yang ingin mengubah nasib hidup anak-anaknya menjadi lebih baik."}, {"peristiwa": "Adnan ingin menjadi askar Melayu tetapi dihina oleh rakannya, Nordin. Nordin beranggap bahawa Adnan merupakan penyokong orang putih sanggup menjadi pengkhianat bangsa.", "huraian": "Peristiwa ini membawa cabaran kepada seorang anak muda yang mementingkan reputasi diri dan pantang dihina serta sanggup mati demi mempertahankan maruahnya."}]}, "novel_tirani": {"tajuk": "Tirani karya Beb Sabariah", "peristiwa_cabaran": [{"peristiwa": "Waheeda membesarkan anaknya, Izzati seorang diri tanpa suami di sisi setelah diceraikan suaminya, Zahid.", "huraian": "Peristiwa ini membawa cabaran kerana seorang ibu terpaksa bersusah payah membesarkan anaknya."}, {"peristiwa": "Zahid menuduh Waheeda curang dan tidak mengaku bahawa anak perempuan yang dilahirkan Waheeda anaknya.", "huraian": "Peristiwa ini menjadi cabaran seorang isteri kerana diragui suaminya."}, {"peristiwa": "Waheeda sering diejek kawan-kawannya di sekolah kerana mempunyai wajah yang tidak cantik.", "huraian": "Peristiwa ini menjadi cabaran kerana semua perempuan mengimpikan wajah yang cantik."}, {"peristiwa": "Waheeda berani mengambil risiko membeli Chalet Iwana Iwani yang sudah muflis.", "huraian": "Peristiwa ini menjadi cabaran kepada seorang pengusaha untuk memajukan syarikat yang telah muflis semula."}]}, "nota": "Peristiwa-peristiwa lain boleh diterima sekiranya sesuai."}}, "q8_ji": [], "q8_jii": "", "q9_topik": "punca-punca mencetuskan perbuatan buli DAN kesan-kesan/akibat perbuatan membuli", "q9_arahan": "Baca petikan dan teliti bahan grafik yang disertakan di bawah, kemudian buat satu rumusan yang panjangnya tidak melebihi 120 patah perkataan. Anda digalakkan supaya menggunakan ayat anda sendiri tanpa mengubah maksud asal petikan.", "q9_b1": {"judul": "", "penulis": "", "sumber": "", "ringkasan": "", "jenis": "Rencana", "excerpt": ""}, "q9_b2": {"judul": "", "penulis": "", "sumber": "", "ringkasan": "", "jenis": "Sajak", "excerpt": ""}, "q9_b3": {"judul": "", "penulis": "", "sumber": "", "ringkasan": "", "jenis": "Sketsa", "excerpt": ""}, "q9_isi_tersurat": [], "q9_isi_tersirat": [], "q9_rumusan_contoh": "", "source_type": "percubaan"}, {"negeri": "Melaka", "k1_bah_a_topik": "Penjagaan alam sekitar / amalan kitar semula", "k1_bah_a_arahan": "Petikan dan grafik di bawah menunjukkan maklumat tentang penjagaan alam sekitar. Berdasarkan maklumat tersebut, huraikan pendapat anda tentang amalan kitar semula dalam kalangan masyarakat. Panjangnya huraian anda hendaklah antara 150 hingga 200 patah perkataan.", "k1_bah_a_grafik": "", "k1_bah_a_isi": [], "k1_bah_b": [{"num": 1, "topik": "Pertanian", "arahan": "Huraikan kelebihan yang dinyatakan dalam petikan berserta kelebihan-kelebihan lain menceburi bidang tersebut.", "source": "https://www.hmetro.com.my/", "isi": []}, {"num": 2, "topik": "Penyakit berjangkit", "arahan": "Berdasarkan petikan, huraikan langkah-langkah mengatasi masalah tersebut.", "source": "Dewan Siswa, Bil. 9/2018", "isi": []}, {"num": 3, "topik": "Patriotisme", "arahan": "Sebagai respons kepada pernyataan di atas, bincangkan peranan pelbagai pihak dalam menyuburkan semangat tersebut.", "source": "Berita Harian, Mac 2021", "isi": []}, {"num": 4, "topik": "Stres / Tekanan", "arahan": "Bincangkan punca-punca berlakunya tekanan kepada individu.", "source": "https://www.bharian.com.my", "isi": []}], "q1_jenis": "Kata bantu", "q1_topik": "", "q1_jawapan": [], "q2_jenis": "Sintaksis — Ayat Majmuk kepada Ayat Tunggal", "q2_topik": "", "q2_jawapan": [], "q3_b1": {"judul": "", "penulis": "", "sumber": "", "ringkasan": "", "jenis": "", "excerpt": ""}, "q3_b2": {"judul": "Jom Berkenalan dengan Harimau Malaya", "penulis": "", "sumber": "", "ringkasan": "", "jenis": "Infografik", "excerpt": ""}, "q3_sk": {}, "q4_teks": "Setelah hari malam maka Kertala Sari pun masuklah ke dalam kota. Maka didengarnya bunyi orang berkawal dan bunyi lembing perisai gemeretak. Maka Kertala Sari pun membaca pustakanya lalu ia berjalan pada tengah orang banyak itu lalu masuk ke rumah Bendahara. Maka dicurinya harta yang kemas-kemas lalu dibawanya kembali.", "q4_source": "Dipetik daripada 'Kepimpinan Melayu Teladan' dalam antologi Jaket Kulit Kijang Dari Istanbul, Kementerian Pendidikan Malaysia", "q4_jawapan": "", "q5_jenis": "Peribahasa (isi tempat kosong dalam dialog)", "q5_peribahasa": [], "q5_konteks": "", "q5_jawapan": [], "q6_topik": "Perpaduan kaum / integrasi nasional", "q6_b1": {"judul": "", "penulis": "", "sumber": "", "ringkasan": "", "jenis": "", "excerpt": ""}, "q6_b2": {"judul": "", "penulis": "", "sumber": "", "ringkasan": "", "jenis": "", "excerpt": ""}, "q6_subq": [{"num": "i", "arahan": "Berdasarkan Bahan 1, berikan maksud rangkai kata mampu menggugat.", "markah": 2, "jawapan": ["{'jawapan': 'boleh/dapat mengganggu/menjejaskan', 'markah': 2}", "{'jawapan': 'mampu mengganggu/menjejaskan', 'markah': 1}", "{'jawapan': 'boleh/dapat menggugat', 'markah': 1}"]}, {"num": "ii", "arahan": "Berdasarkan Bahan 1 dan Bahan 2, nyatakan cabaran-cabaran yang dihadapi dalam mewujudkan perpaduan negara.", "markah": 3, "jawapan": ["[bahan1] P1: penularan sentimen perkauman yang semakin meluas", "[bahan1] P2: provokasi melampau yang disebarkan melalui media sosial", "[bahan1] P3: jurang ekonomi yang semakin ketara", "[bahan1] P4: pengasingan sistem pendidikan", "[bahan2] P5: penyebaran berita palsu yang menyentuh sensitiviti agama dan budaya", "[bahan2] P6: ketidakseimbangan sosioekonomi", "[bahan2] P7: keberasingan sistem pendidikan", "[nota] Jawapan mestilah berdasarkan semua bahan. Maksimum 3 markah, isi cukup 2 isi."]}, {"num": "iii", "arahan": "Berdasarkan Bahan 2, apakah punca-punca yang menyebabkan gotong-royong semakin kurang diamalkan oleh masyarakat pada masa kini?", "markah": 3, "jawapan": ["P1: gaya hidup yang semakin individualistik", "P2: kesibukan dalam mengejar kemewahan/kesibukan bekerja", "P3: perubahan gaya hidup moden", "P4: perbezaan pemikiran/fahaman", "P5: perbezaan budaya/adat resam", "P6: perbezaan taraf hidup"]}, {"num": "iv", "arahan": "Rakan anda sering menggunakan media sosial untuk berkongsi bahan yang boleh menimbulkan perbalahan dalam kalangan masyarakat. Sebagai seorang rakan yang prihatin, apakah langkah yang akan anda lakukan bagi membantu rakan anda menangani masalah tersebut?", "markah": 4, "jawapan": ["P1: menasihatinya supaya tidak menyebarkan bahan tersebut", "P2: memaklumkan ibu bapanya tentang tabiat tersebut", "P3: meminta bantuan kaunselor/guru", "P4: meminta bantuan orang yang disegani oleh rakan tersebut", "P5: mengajak rakan tersebut melibatkan diri dalam aktiviti yang lebih berfaedah/aktiviti agama/sukarelawan", "P6: menggalakkan rakan tersebut melakukan hobi yang bermanfaat"]}], "q7_tema": "Pencemaran sungai / alam sekitar", "q7_b1": {"judul": "", "penulis": "", "sumber": "", "ringkasan": "", "jenis": "Cerpen", "excerpt": ""}, "q7_b2": {"judul": "", "penulis": "", "sumber": "", "ringkasan": "", "jenis": "Gurindam", "excerpt": ""}, "q7_subq": [{"num": "i", "arahan": "Berdasarkan Bahan 1, apakah soalan yang dikemukakan oleh Adnin apabila mendekati bangunan di tepi sungai?", "markah": 2, "jawapan": ["P1: Kenapakah tiada tanda pemprosesan makanan di sini?", "P2: Di manakah unit kawalan kualiti dan sistem rawatan air mereka?"]}, {"num": "ii", "arahan": "Berdasarkan Bahan 1 dan Bahan 2, nyatakan tanda-tanda yang menunjukkan sungai telah tercemar.", "markah": 3, "jawapan": ["[bahan1] P1: air berwarna hitam keperangan", "[bahan1] P2: berbau logam yang kuat", "[bahan1] P3: berbau asid", "[bahan2] P4: warna air berubah", "[bahan2] P5: ikan mati terapung", "[bahan2] P6: bau kimia menusuk hidung", "[bahan2] P7: buih tebal di permukaan air", "[bahan2] P8: air keruh walaupun tiada hujan", "[nota] Jawapan mestilah berdasarkan semua bahan. Maksimum 3 markah, isi cukup 2 isi."]}, {"num": "iii", "arahan": "Berdasarkan Bahan 2, apakah faktor-faktor yang menyebabkan sungai tercemar?", "markah": 4, "jawapan": ["P1: pembuangan sisa domestik/sampah ke dalam sungai", "P2: pelepasan sisa industri/bahan toksik ke dalam sungai", "P3: pembuangan bahan kimia/bahan pertanian", "P4: kegiatan pembangunan/pembalakan berhampiran sungai", "P5: kesedaran masyarakat yang rendah tentang kepentingan menjaga sungai", "P6: penguatkuasaan undang-undang yang lemah/tidak berkesan"]}, {"num": "iv", "arahan": "Anda merupakan Pengerusi Jawatankuasa Rukun Tetangga di kawasan anda. Sungai di kawasan anda semakin tercemar. Sebagai pengerusi, apakah langkah-langkah yang akan anda ambil untuk menangani masalah ini?", "markah": 4, "jawapan": ["P1: menganjurkan gotong-royong secara berkala untuk membersihkan kawasan sungai", "P2: menyediakan kemudahan tong pembuangan sampah yang mencukupi", "P3: melaporkan perkara ini kepada pihak berkuasa seperti Jabatan Alam Sekitar", "P4: menubuhkan pasukan pemantau komuniti", "P5: menggalakkan amalan kitar semula dalam kalangan penduduk", "P6: membuat hebahan/memasang poster/menganjurkan kempen kesedaran"]}], "q8_novel": "", "q8_desc": "", "q8_si": {"sub": "i", "arahan": "Baca petikan novel di bawah dengan teliti, kemudian jawab soalan yang berikutnya dengan menggunakan ayat anda sendiri.", "novel": "Bimasakti Menari", "pengarang": "Sri Rahayu Mohd Yusop", "penerbit": "Kementerian Pendidikan Malaysia", "petikan": "\"Dato' Johann, dalam tempoh setahun lalu, berapa banyak jenayah yang berlaku di kawasan perumahan kita?\" soal Nurul Hafsa tegas. Dato' Johann terdiam sebentar. \"Memanglah ada kes ragut, pecah rumah...\" \"Jadi Dato' bersetuju bahawa kegelapan mendatangkan risiko keselamatan?\" Nurul Hafsa menyambung. \"Kalau pasangkan lampu di lorong-lorong gelap itu nescaya dapat mengurangkan jenayah.\"", "soalan": "Berdasarkan petikan di atas, apakah langkah-langkah yang boleh diambil untuk mengawal jenayah di kawasan perumahan?", "markah": 4, "skema": ["P1: pasangkan gril di pintu dan tingkap rumah", "P2: kunci rumah dengan baik sebelum keluar", "P3: elakkan berjalan di jalan-jalan yang sunyi/gelap", "P4: elakkan keluar pada waktu malam"], "nota": "Langkah lain boleh diterima sekiranya sesuai. Maksimum 4 markah, isi cukup 3 isi."}, "q8_sii": {"sub": "ii", "soalan": "Jawab soalan di bawah berdasarkan novel-novel yang berikut. Berdasarkan dua buah novel yang anda pelajari, huraikan satu peristiwa yang bertujuan mendidik pembaca.", "markah": 6, "novels_senarai": ["(a) Leftenan Adnan Wira Bangsa karya Abdul Latip Talib", "(b) Di Sebalik Dinara karya Dayang Nor", "(c) Jendela Menghadap Jalan karya Ruhaini Matdarin", "(d) Pantai Kasih karya Azmah Nordin", "(e) Songket Berbenang Emas karya Khairuddin Ayip", "(f) Tirani karya Beb Sabariah", "(g) Bimasakti Menari karya Sri Rahayu Mohd Yusop", "(h) Silir Daksina karya Nizar Parman"], "skema": {"panduan": "Jawapan berdasarkan sebuah novel yang dipelajari. Beri 1 markah bagi setiap isi yang betul + 1 markah bagi peristiwa/huraian/contoh yang lengkap/jelas. Markah isi maksimum 4 markah (2 markah bagi setiap isi dan peristiwa/huraian). Markah bahasa maksimum 2 markah.", "novel_pantai_kasih": {"tajuk": "Pantai Kasih karya Azmah Nordin", "peristiwa_mendidik": [{"peristiwa": "Dr Raiha menunjukkan rasa prihatin terhadap Unong Siron yang daif dan diabaikan oleh masyarakat.", "nilai_didikan": "mendidik pembaca tentang nilai keprihatinan/belas kasihan terhadap golongan yang memerlukan"}, {"peristiwa": "Dr Raiha menghadapi banyak pancaroba dan rintangan dalam menjalani kehidupan seharian tetapi tetap tabah.", "nilai_didikan": "mendidik pembaca tentang nilai ketabahan/kecekalan/kesabaran"}, {"peristiwa": "Felicia mengakui kesilapannya dan memohon maaf kepada Dr Raiha atas tuduhan palsu yang dilontarkan.", "nilai_didikan": "mendidik pembaca tentang sikap saling memaafkan antara sesama"}, {"peristiwa": "Ibu Unong Siron tidak menyimpan perasaan dendam walaupun anaknya diperlakukan dengan buruk.", "nilai_didikan": "mendidik pembaca tentang pentingnya tidak menyimpan dendam terhadap orang lain"}]}, "novel_bimasakti_menari": {"tajuk": "Bimasakti Menari karya Sri Rahayu Mohd Yusop", "peristiwa_mendidik": [{"peristiwa": "Taufik dan Budiman sentiasa menunaikan solat berjemaah walaupun kesibukan projek.", "nilai_didikan": "mendidik pembaca tentang pentingnya mentaati ajaran agama"}, {"peristiwa": "Nurul Hafsa berjanji kepada dirinya untuk membangunkan stor simpanan bagi ayahnya apabila berjaya.", "nilai_didikan": "mendidik pembaca tentang pentingnya menyayangi dan menghormati ibu bapa"}, {"peristiwa": "Taufik sanggup membahayakan dirinya untuk menyelamatkan Nurul Hafsa daripada ancaman.", "nilai_didikan": "mendidik pembaca tentang nilai setiakawan/saling membantu antara rakan"}, {"peristiwa": "Nurul Hafsa berani mempertahankan hujahnya di hadapan pegawai daerah tentang lampu kawasan.", "nilai_didikan": "mendidik pembaca tentang keberanian mempertahankan pendirian yang benar"}]}, "nota": "Peristiwa-peristiwa lain boleh diterima sekiranya sesuai."}}, "q8_ji": [], "q8_jii": "", "q9_topik": "kelebihan/kepentingan kemahiran komunikasi DAN usaha/langkah memperkukuh kemahiran komunikasi mahasiswa", "q9_arahan": "Baca petikan dan teliti bahan grafik yang disertakan di bawah, kemudian buat satu rumusan yang panjangnya tidak melebihi 120 patah perkataan. Anda digalakkan supaya menggunakan ayat anda sendiri tanpa mengubah maksud asal petikan.", "q9_b1": {"judul": "", "penulis": "", "sumber": "", "ringkasan": "", "jenis": "Rencana", "excerpt": ""}, "q9_b2": {"judul": "", "penulis": "", "sumber": "", "ringkasan": "", "jenis": "Dialog", "excerpt": ""}, "q9_b3": {"judul": "", "penulis": "", "sumber": "", "ringkasan": "", "jenis": "Infografik", "excerpt": ""}, "q9_isi_tersurat": [], "q9_isi_tersirat": [ iii", "arahan": "Makanan warisan Malaysia merupakan khazanah budaya bangsa yang tidak ternilai dan perlu dipelihara dari semasa ke semasa. Pada pendapat anda, apakah cabaran-cabaran untuk memastikan makanan tersebut diwarisi oleh generasi akan datang?", "markah": 4, "jawapan": []}, {"num": "iv", "arahan": "Rakan anda merupakan seorang pengusaha restoran. Apakah cadangan-cadangan anda untuk membantu rakan anda mempopularkan makanan tradisional?", "markah": 4, "jawapan": []}], "q7_tema": "rawatan / perubatan tradisional", "q7_b1": {"judul": "Saya Seorang Dukun", "penulis": "Hidayyah At Mizi", "sumber": "Dewan Bahasa dan Pustaka", "ringkasan": "", "jenis": "cerpen", "excerpt": ""}, "q7_b2": {"judul": "Anak Kejaman Long Segaham", "penulis": "Dahiri Saini", "sumber": "Dewan Bahasa dan Pustaka", "ringkasan": "", "jenis": "novel", "excerpt": ""}, "q7_subq": [{"num": "i", "arahan": "Nyatakan kegunaan daun senduduk berdasarkan Bahan 3.", "markah": 2, "jawapan": []}, {"num": "ii", "arahan": "Huraikan keadaan Jeneral Kassim dan Tutuh selepas menerima rawatan.", "markah": 3, "jawapan": []}, {"num": "iii", "arahan": "Rawatan alternatif seperti bekam, akupuntur dan Ayurveda semakin mendapat perhatian masyarakat. Huraikan sebab-sebab rawatan alternatif ini mendapat perhatian masyarakat.", "markah": 3, "jawapan": []}, {"num": "iv", "arahan": "Ibu anda enggan ke klinik dan lebih suka membeli produk kesihatan yang tidak berdaftar. Apakah tindakan-tindakan yang akan anda lakukan untuk memastikan ibu anda mendapat rawatan yang betul dan selamat?", "markah": 4, "jawapan": []}], "q8_novel": "", "q8_desc": "", "q8_si": "", "q8_sii": "", "q8_ji": [], "q8_jii": "", "q9_topik": "sisa elektronik (e-waste)", "q9_arahan": "Baca dan teliti setiap bahan yang diberikan. Kemudian buat satu rumusan yang panjangnya tidak melebihi 120 patah perkataan. Anda digalakkan supaya menggunakan ayat anda sendiri tanpa mengubah maksud asal setiap bahan.", "q9_b1": {"judul": "E-Waste Ancam Kesejahteraan Manusia, 4_jawapan": "Kata-kata Tun Perak itu dipersembahkan oleh Seri Amerta kepada bawah Duli Yang Dipertuan. Baginda tersenyum, sambil bertitah, 'Benar seperti kata-kata Tun Perak itu.' Diambil oleh baginda sirih daripada puan baginda, disuruh diberikan kepada Tun Perak. Titah baginda kepada Tun Perak, 'Tun Perak tidak patut tinggal di Kelang lagi; lebih baik Tun Perak tinggal di negeri ini (Melaka).'", "q5_jenis": "Peribahasa", "q5_peribahasa": [], "q5_konteks": "", "q5_jawapan": [{"no": "i", "situasi": "belajar bersungguh-sungguh sehingga mencapai kejayaan", "peribahasa": ["Genggam bara api biar sampai menjadi arang", "Alang-alang mandi biar basah", "Alang-alang berdakwat biar hitam", "Alang-alang menyeluk pekasam biar sampai ke pangkal lengan"], "markah": 2}, {"no": "ii", "situasi": "sentiasa menghormati dan mematuhi adat istiadat serta peraturan di negara tersebut", "peribahasa": ["Di mana bumi dipijak di situ langit dijunjung", "masuk kandang kambing mengembek, masuk kandang kerbau menguak"], "markah": 2}, {"no": "iii", "situasi": "kembali ke tanah air untuk berkhidmat kepada masyarakat", "peribahasa": ["Belut pulang ke lumpur", "gagak pulang ke benua", "Ikan pulang ke lubuk", "sireh pulang ke gagang", "Setinggi-tinggi terbang bangau, akhirnya hinggap di belakang kerbau juga"], "markah": 2}], "q6_topik": "Sistem Tagal di Sabah", "q6_b1": {"judul": "", "penulis": "", "sumber": "Dipetik daripada 'Keunikan Sistem Tagal di Sabah' oleh Faizul Zubairi, Dewan Budaya, jendeladbp.my", "ringkasan": "", "jenis": "", "excerpt": ""}, "q6_b2": {"judul": "", "penulis": "", "sumber": "Dipetik daripada 'Sistem Tagal Dalam Industri Pelancongan: Manfaat Kepada Komuniti' oleh Jurry Foo @ Jurry bt. F. Michael", "ringkasan": "", "jenis": "", "excerpt": ""}, "q6_subq": [{"num": "i", "arahan": "Berdasarkan Bahan 1 dan Bahan 2, apakah spesies ikan air tawar yang diancam kepupusan?", "markah": 2, "jawapan": ["ikan pelian [1 markah]", "ikan kelah merah [1 markah]"]}, {"num": "ii", "arahan": "B bagai kaca terhempas ke batu, tetapi mak percaya suatu hari nanti adik pasti akan berubah."}, {"watak": "Farah", "kata": "Sama-samalah kita berdoa mak."}]}, "q5_jawapan": [], "q6_topik": "masalah persatuan sukan dan usaha memartabatkan sukan negara", "q6_b1": {"judul": "Sukan Bertaraf Dunia", "penulis": "", "sumber": "Dewan Siswa Ogos 2024", "ringkasan": "", "jenis": "artikel", "excerpt": ""}, "q6_b2": {"judul": "Konsisten Lahirkan Atlet Kelas Dunia", "penulis": "", "sumber": "Dewan Masyarakat Julai 2023", "ringkasan": "", "jenis": "artikel", "excerpt": ""}, "q6_subq": [{"num": "i", "arahan": "Berdasarkan Bahan 2, berikan maksud rangkai kata meningkatkan mutu.", "markah": 2, "jawapan": ["meningggikan/menambahkan/menaikkan kualiti/nilai"]}, {"num": "ii", "arahan": "Dengan merujuk semua bahan, nyatakan masalah yang dihadapi oleh persatuan sukan untuk meningkatkan mutu sukan negara.", "markah": 4, "jawapan": ["[bahan_1] kekangan kewangan dan penajaan", "[bahan_1] kekurangan jurulatih tempatan berkelayakan", "[bahan_1] persatuan sukan bergantung pada bantuan kerajaan/swasta", "[bahan_2] masalah ketandusan atlet pelapis", "[bahan_2] kerenah birokrasi", "[bahan_3] kekurangan infrastruktur dan fasiliti sukan"]}, {"num": "iii", "arahan": "Pihak kerajaan telah melaksanakan pelbagai program bagi menarik minat masyarakat untuk bersukan, namun masih belum mendapat sambutan yang memberangsangkan. Pada pendapat anda, apakah punca-punca yang menyebabkan keadaan ini berlaku?", "markah": 3, "jawapan": ["sikap tidak minat/malas", "sibuk dengan urusan masing-masing", "kekurangan kemudahan/gelanggang/padang", "leka dengan teknologi", "kurang kesedaran", "kurang kempen", "kurang galakan", "risau kecederaan"]}, {"num": "iv", "arahan": "Rakan baik anda tidak gemar bersukan dan banyak menghabiskan masa dengan tidur dan menonton televisyen selepas pulang dari sekolah atau pada cuti hujung minggu. Keadaan ini menyebabkan kesihatan rakan ada terjejas. Sebagai seorang yang aktif dalam bidang sukan, berikan tindakan-tindakan anda untuk menarik minat rakan anda bersukan.", "markah": 4, "jawapan": ["menasihati rakan", "membeli/menghadiahkan buku/peralatan sukan", "membawa/menonton perlawanan", "mengajak menyertai sukan", "membawanya berjumpa tokoh sukan/atlet berjaya", "menerangkan kelebihan bersukan", "meminta bantuan ibu bapa/guru/kaunselor"]}], "q7_tema": "Rasuah dan integriti", "q7_b1": {"judul": "Senja di Pangkalan", "penulis": "", "sumber": "www.bharian.com.my", "ringkasan": "", "jenis": "cerpen", "excerpt": ""}, "q7_b2": {"judul": "Sirnanya Integriti", "penulis": "", "sumber": "", "ringkasan": "", "jenis": "puisi", "excerpt": ""}, "q7_subq": [{"num": "i", "arahan": "Berdasarkan Bahan 1, apakah ketakutan yang sentiasa membayangi kehidupan Hadi?", "markah": 2, "jawapan": ["takut ditangkap PGA", "takut diserbu polis", "takut Tauke mungkir janji"]}, {"num": "ii", "arahan": "Berdasarkan Bahan 1 dan Bahan 2, nyatakan akibat yang timbul jika seseorang itu melibatkan diri dalam pekerjaan atau perbuatan yang tidak berintegriti.", "markah": 3, "jawapan": ["[bahan_1] tidak akan membawa keberkatan", "[bahan_1] akan ditarik balik dalam bentuk lain mungkin dari segi kesihatan", "[bahan_1] kehilangan ketenangan jiwa", "[bahan_1] sentiasa dibayangi rasa takut", "[bahan_1] Tuhan telah menutup pintu rezeki haram itu", "[bahan_2] Kekayaan tidak menjamin kebahagiaan/keamanan (Biar kaya tiada aman)", "[bahan_2] Memudaratkan/memusnahkan/merosakkan diri (kelak merana memakan diri)", "[catatan] Jawapan mestilah berdasarkan semua bahan"]}, {"num": "iii", "arahan": "Frasa di atas menyatakan bahawa kita perlu menolak rasuah demi memelihara integriti. Namun begitu, sesetengah individu masih lagi melibatkan diri dalam perbuatan terkeji ini walaupun sedar akan risikonya. Pada pendapat anda, mengapakah perkara ini terjadi?", "markah": 3, "jawapan": ["Tekanan hidup/kewangan/hutang", "Tamak/inginkan kemewahan/cepat kaya", "Terdesak mendapatkan wang dengan cepat", "Kurang pegangan agama/moral", "Penguatkuasaan undang-undang lemah", "Pengaruh persekitaran/ada peluang rasuah/kedudukan/jawatan/pangkat", "Pengaruh pasangan/keluarga"]}, {"num": "iv", "arahan": "Anda mendapati bahawa salah seorang ahli keluarga terdekat terlibat dalam kegiatan rasuah ketika bekerja. Walaupun perbuatannya itu bertujuan untuk menanggung perbelanjaan keluarga, tetapi anda menyedari bahawa tindakan itu menyalahi undang-undang negara. Sebagai ahli keluarga yang bertanggungjawab, nyatakan cadangan-cadangan anda untuk menangani kemelut ini tanpa menjejaskan hubungan kekeluargaan.", "markah": 4, "jawapan": ["bertaubat/insaf/membaiki diri", "tidak terlibat dengan gejala negatif", "mencari pekerjaan halal", "mendapatkan sokongan keluarga/pihak berwajib", "meningkatkan ilmu agama", "menjauhkan diri dari rakan negatif", "berkongsi masalah", "menyerah diri/mengakui kesalahan"]}], "q8_novel": "", "q8_desc": "", "q8_si": "", "q8_sii": "", "q8_ji": [], "q8_jii": "", "q9_topik": "peranan guru dan usaha memartabatkan profesion keguruan", "q9_arahan": "Baca dan teliti setiap bahan yang diberikan, kemudian buat satu rumusan yang panjangnya tidak melebihi 120 patah perkataan. Anda digalakkan supaya menggunakan ayat anda sendiri tanpa mengubah maksud asal petikan dan bahan.", "q9_b1": {"judul": "Guru Pembentuk Daya Saing Negara", "penulis": "", "sumber": "Dewan Ekonomi, Mei 2026", "ringkasan": "", "jenis": "artikel", "excerpt": ""}, "q9_b2": {"judul": "Inisiatif Pemerkasaan Warga Pendidik: Menghargai Jasa Guru", "penulis": "", "sumber": "Kementerian Pendidikan Malaysia", "ringkasan": "", "jenis": "infografik", "excerpt": ""}, "q9_b3": {"judul": "Dialog guru-guru tentang Hari Guru", "penulis": "", "sumber": "", "ringkasan": "", "jenis": "dialog bergambar", "excerpt": ""}, "q9_isi_tersurat": ["pelaksana agenda pendidikan KPM", "memikul tanggungjawab strategik sebagai pembina modal insan", "membentuk cara manusia berfikir", "bertanggungjawab mengasah pemikiran murid membezakan fakta dengan propaganda", "membentuk jati diri murid", "memupuk perpaduan dalam kalangan murid"], "q9_isi_tersirat": ["kerajaan meningkatkan kebajikan guru dengan laluan khas kenaikan pangkat kepada semua guru", "media massa menyiarkan program menonjolkan pengorbanan dan kejayaan guru", "Kursus Google Certified Educator (GCE) secara percuma", "Peruntukan tambahan RM100 juta untuk menaik taraf bilik guru di sekolah", "Program Hadiah Latihan Persekutuan (HLP) khas untuk guru pedalaman bagi menyambung pelajaran", "guru-guru melengkapkan diri dengan pelbagai ilmu baharu"], "q9_rumusan_contoh": "", "source_type": "percubaan"}, {"negeri": "SPM 2023", "tahun": "2023", "source_type": "SPM", "k1_bah_a_topik": "Kemalangan Jalan Raya di Malaysia", "k1_bah_a_arahan": "Petikan dan grafik di bawah menunjukkan maklumat berkaitan dengan kemalangan jalan raya di Malaysia. Berdasarkan maklumat tersebut, huraikan pendapat anda tentang kemalangan jalan raya di Malaysia. Panjang huraian anda hendaklah antara 150 hingga 200 patah perkataan.", "k1_bah_a_grafik": "Artikel: 'Satu kematian akibat kemalangan jalan raya bagi setiap 84 minit' (purata 17 kematian/hari, majoritinya pemandu dan pembonceng motosikal) | Amaran: Bahaya Penggunaan Telefon Bimbit Semasa Memandu | Carta bar: Kematian & Kecederaan Nahas Jalan Raya Akibat Kerosakan Jalan Raya (2014–2018, Jabatan Siasatan dan Penguatkuasaan Trafik Bukit Aman)", "k1_bah_a_isi": [], "k1_bah_b": [{"topik": "Kepentingan Kegiatan Kokurikulum", "arahan": "Kegiatan kokurikulum dikatakan sangat penting kerana dapat memberi peluang kepada pelajar melatih diri untuk berdisiplin, mencungkil bakat dan membina personaliti diri sebagai persediaan pada masa depan. (Sumber: www.bharian.com.my) — Berdasarkan petikan di atas, bincangkan kepentingan kegiatan tersebut."}, {"topik": "Menghargai Jasa Ibu Bapa", "arahan": "Anak-anak perlu sentiasa memberikan sokongan emosi kepada ibu bapa dengan cara selalu menghubungi atau menziarahi mereka. Jika ada kemampuan, bawalah ibu dan bapa pergi melancong. Selain itu, anak-anak hendaklah sentiasa meraikan hari-hari istimewa ibu bapa. (Sumber: Pelita Bahasa, Bil. 6/2020) — Berdasarkan petikan, huraikan cara-cara yang boleh dilakukan untuk menghargai jasa ibu bapa."}, {"topik": "Menjaga Alam Sekitar (Pantun)", "arahan": "Pantun Menjaga Alam Sekitar (Sumber: Dewan Siswa, Bil. 2/2022) — 3 rangkap pantun tentang pelestarian alam: pembuangan sisa bijak, sungai bersih, kesan penebangan hutan. — Pantun di atas menyatakan langkah-langkah penjagaan alam sekitar. Huraikan langkah-langkah tersebut."}, {"topik": "Bantuan kepada Mangsa Bencana Banjir", "arahan": "Penghujung tahun 2021 menyaksikan negara dikejutkan dengan bencana banjir besar yang melanda Selangor, Pahang dan Negeri Sembilan. Ribuan kediaman ditenggelami air dan berbelas-belas ribu penduduk yang menjadi mangsa banjir perlu diberikan bantuan. (Sumber: www.sinarharian.com.my) — Sebagai respons terhadap petikan di atas, huraikan bentuk-bentuk bantuan yang boleh disalurkan kepada mangsa-mangsa bencana tersebut."}], "q1_jenis": "Kata Ganda", "q1_topik": "Dialog Guru-Pelajar tentang Fobia", "q1_jawapan": ["Cari dan tulis 5 kata ganda daripada petikan dialog guru-pelajar berkaitan fobia/phobia, beserta maknanya."], "q2_jenis": "Ayat Pasif → Ayat Aktif", "q2_topik": "Petikan tentang Fobia/Phobia", "q2_jawapan": ["Tukar 5 ayat pasif kepada ayat aktif berdasarkan petikan tentang fobia."], "q3_b1": {"judul": "Kenyataan Tawaran — Tender Kantin Sekolah (dokumen rasmi)", "sumber": "Dokumen Rasmi"}, "q3_b2": null, "q4_teks": "Daripada antologi Sejadah Rindu, KPM — Burung Terbang Dipipiskan Lada (teks bahasa Melayu klasik).", "q4_source": "Sejadah Rindu, KPM (Burung Terbang Dipipiskan Lada)", "q4_jawapan": "Tulis semula teks bahasa Melayu klasik berikut dalam bahasa Melayu standard.", "q5_jenis": "Peribahasa — Kenal pasti & jelaskan makna", "q5_peribahasa": ["Peribahasa dalam petikan tentang Adib yang kehilangan kerja (petikan dari sumber berkaitan)"], "q5_jawapan": [{"peribahasa": "Peribahasa dalam petikan Adib", "makna": "Kenal pasti peribahasa yang digunakan dalam petikan dan jelaskan maknanya berdasarkan konteks."}], "q5_konteks": "Petikan tentang Adib yang kehilangan kerja", "q6_topik": "Teknologi / Telefon Pintar (Nomofobia)", "q6_b1": {"judul": "Nomophobia — Ketagihan Telefon Pintar dalam Kalangan Remaja", "sumber": "Artikel (Bahan 1)"}, "q6_b2": {"judul": "Memo Rasmi Sekolah Melarang Penggunaan Telefon Pintar di dalam Kelas", "sumber": "Memo Rasmi (Bahan 2) + Kartun: Telefon berbunyi semasa kelas (Bahan 3)"}, "q6_subq": [{"num": "i", "arahan": "Jelaskan makna 'cepat berkembang' daripada Bahan 1.", "markah": 2, "jawapan": ["'Cepat berkembang' bermaksud pantas maju atau berkembang dengan pesat.", "Merujuk kepada perkembangan penggunaan telefon pintar yang berlaku dengan sangat cepat dalam kalangan pengguna."]}, {"num": "ii", "arahan": "Nyatakan kesan penggunaan telefon bimbit terhadap pelajar berdasarkan semua bahan.", "markah": 4, "jawapan": ["Bahan 1: Pelajar mengalami ketagihan atau nomophobia, iaitu takut hidup tanpa telefon pintar; sanggup melakukan pembaziran wang ringgit demi keihatan bergaya.", "Bahan 2: Aplikasi seperti permainan dan penstriman video telah meningkatkan salah laku murid.", "Bahan 3: Murid-murid tidak boleh fokus belajar akibat telefon berbunyi di dalam kelas."]}, {"num": "iii", "arahan": "Berikan pendapat anda tentang peranan ibu bapa dalam mengawal penggunaan telefon bimbit anak-anak.", "markah": 3, "jawapan": ["Ibu bapa perlulah mengawal masa anak-anak menggunakan telefon pintar.", "Ibu bapa haruslah mengajar anak-anak tentang kebaikan dan keburukan penggunaan telefon pintar.", "Di samping itu, ibu bapa juga mestilah memberi nasihat jika anak-anaknya mengalami ketagihan penggunaan telefon pintar."]}, {"num": "iv", "arahan": "Nasihatkan rakan anda yang ketagih bermain permainan video.", "markah": 4, "jawapan": ["Termasuklah memberitahu ibu bapa rakan supaya mereka dapat mengawal penggunaan telefon bimbit rakan.", "Akan membawa rakan berjumpa dengan guru kaunseling agar dia mendapat bimbingan dan sokongan untuk menangani masalah ketagihannya.", "Di samping itu, akan membawa rakan untuk melatakan aktiviti bertiadah semasa waktu lapang dengan menjalankan aktiviti sukan seperti berjogging dan bermain badminton."]}], "q7_tema": "Angkasa / Cahaya Bulan", "q7_b1": {"judul": "Gurindam Bulan Menawan oleh Han Noe Rai, 2 Jun 2022, Putrajaya", "sumber": "Gurindam (Bahan 1)"}, "q7_b2": {"judul": "Cerpen: Esoknya, Matahari Muncul Kembali oleh Warisan Puteri (Dewan Siswa Bil. 09/2021) | Puisi: Di Sebalik Bulan oleh Raihan Imani (Bahan 3)", "sumber": "Cerpen & Puisi (Bahan 2 & 3)"}, "q7_subq": [{"num": "i", "arahan": "Apakah makna 'musibah yang sebegini' berdasarkan Bahan 2?", "markah": 2, "jawapan": ["'Musibah yang sebegini' bermaksud kecelakaan atau bencana seperti ini.", "Merujuk kepada peristiwa malang atau malapetaka yang berlaku dalam konteks cerpen tersebut."]}, {"num": "ii", "arahan": "Nyatakan kepentingan cahaya matahari dan bulan berdasarkan semua bahan.", "markah": 3, "jawapan": ["Merujuk Bahan 1: kepentingan cahaya matahari dan bulan ialah apabila bulan ada graviti, pasang dan surut berlaku di bumi.", "Manakala Bahan 2: bulan juga memerlukan cahaya matahari untuk menerangi dirinya pada waktu malam.", "Akhir sekali, merujuk Bahan 3: dengan menghitung peredaran bulan, siang dan malam silih berganti."]}, {"num": "iii", "arahan": "Berikan pendapat anda tentang keburukan penggunaan apps daripada teknologi satelit/komunikasi.", "markah": 3, "jawapan": ["Penipuan wang yang biasa dilakukan melalui aplikasi perbankan.", "Berlaku ketagihan terhadap aplikasi-aplikasi terutamanya dalam kalangan pelajar sehingga prestasi pelajaran merosot.", "Pelbagai jenayah siber juga giat dilakukan. Contohnya buli siber.", "Masalah yang lebih serius seperti pemerdagangan manusia melalui laman gelap juga berlaku."]}, {"num": "iv", "arahan": "Sebagai pegawai Pusat Sains Negara, cadangkan usaha-usaha untuk mencetuskan minat pelajar dalam sains angkasa.", "markah": 4, "jawapan": ["Menganjurkan program lawatan ke Pusat Sains Negara bagi pelajar sekolah untuk mendedahkan mereka kepada teknologi dan penemuan sains angkasa.", "Mengadakan pertandingan reka cipta roket atau simulasi angkasa di peringkat sekolah.", "Menjemput astronaut atau saintis angkasa sebagai penceramah jemputan untuk berkongsi pengalaman dengan pelajar.", "Menerbitkan bahan bacaan dan permainan interaktif berkaitan sains angkasa yang menarik minat pelajar."]}], "q8_novel": "Leftenan Adnan Wira Bangsa (Abdul Latip Talib)", "q8_si": "Dialog antara Adnan dan Pak Saidi tentang keturunan yang disembunyikan (moyang penentang Inggeris) — Nyatakan sebab-sebab ayah Adnan tidak mendedahkan asal-usul keluarga. [4 markah]", "q8_sii": "Pilih 2 daripada 8 novel wajib — Huraikan satu peristiwa yang menimbulkan rasa kagum pembaca dalam novel yang anda pilih. [6 markah]", "q8_ji": ["Bimbang akan keselamatan keluarga di bawah penjajahan Inggeris", "Ingin melindungi keluarga daripada diskriminasi atau tindakan balas penjajah", "Menjaga keharmonian keluarga dan mengelakkan konflik dengan pihak berkuasa"], "q8_jii": "Huraikan peristiwa kagum dalam 2 novel pilihan daripada senarai 8 novel wajib.", "q9_topik": "Wayang Kulit", "q9_b1": {"judul": "Wayang Kulit: Seni Teater yang Perlukan Sentuhan Generasi Muda — A. Ariffin (www.benarnews.org)", "sumber": "Artikel"}, "q9_b2": {"judul": "Wayang Kulit oleh Murali, Bota Kanan, Perak", "sumber": "Puisi"}, "q9_b3": {"judul": "Kartun: Dua patung wayang kulit meratapi kehadiran penonton yang sedikit; belia lebih gemar budaya barat/konsert", "sumber": "Kartun"}, "q9_isi_tersurat": ["Bilangan Tok Dalang kian berkurangan (hanya 5 Tok Dalang aktif berbaki, semua berusia lebih 70 tahun)", "Penubuhan kumpulan wayang kulit memerlukan kos yang tinggi", "Ibu bapa menegah anak-anak mewarisi permainan tradisi ini", "Anak muda lebih tertarik dengan budaya luar seperti suka akan konsert"], "q9_isi_tersirat": ["Pihak kerajaan mewujudkan sebuah panggung wayang kulit tetap untuk penimat serta pengamal wayang kulit", "Tok Dalang Muda yang dilatih mestilah bijak membuat inovasi dalam persembahan mereka mengikut peredaran masa", "Promosi persembahan wayang kulit perlu dibuat secara menyeluruh oleh kerajaan serta mendapat dokongan biaya daripada pihak berkuasa"]}, {"negeri": "SPM 2024", "tahun": "2024", "source_type": "SPM", "k1_bah_a_topik": "Pengangkutan Awam di Malaysia", "k1_bah_a_arahan": "Grafik di bawah menunjukkan maklumat berkaitan dengan pengangkutan awam di Malaysia. Berdasarkan maklumat tersebut, huraikan pendapat anda tentang usaha-usaha untuk menggalakkan masyarakat menggunakan pengangkutan awam. Panjangnya huraian anda hendaklah antara 150 hingga 200 patah perkataan.", "k1_bah_a_grafik": "Grafik/infografik tentang data pengangkutan awam di Malaysia (bas, LRT, MRT, KTM Komuter) — statistik penggunaan, kemudahan, dan penambahbaikan.", "k1_bah_a_isi": [], "k1_bah_b": [{"topik": "Cabaran Pembelajaran Digital", "arahan": "Pembelajaran digital merupakan satu alternatif untuk menyediakan sumber pembelajaran yang mudah dan dapat diakses oleh semua orang. Pembelajaran ini bertumpu pada penggunaan teknologi seperti telefon bimbit dan penyediaan bahan secara digital. Namun begitu, terdapat cabaran untuk melaksanakan pembelajaran digital iaitu capaian Internet yang lemah. (Sumber: Dewan Siswa, Bil. 07/2022) — Huraikan cabaran yang terdapat dalam petikan di atas berserta cabaran-cabaran lain untuk melaksanakan pembelajaran tersebut."}, {"topik": "Melahirkan Atlet Paralimpik", "arahan": "KUALA LUMPUR: Majlis Paralimpik Malaysia (MPM) menyasarkan untuk melahirkan sekurang-kurangnya 1000 atlet paralimpik baharu pada hujung tahun 2021 menerusi Program Pengenalpastian Bakat Sukan OKU. Presidennya berkata MPM giat mencari atlet pelapis berkelas dunia seperti Muhammad Ziyad Zolkefli dan Mohamad Ridzuan. (Sumber: www.astroawani.com) — Selain usaha yang dinyatakan dalam petikan di atas, huraikan usaha-usaha untuk melahirkan lebih ramai atlet dalam sukan tersebut."}, {"topik": "Faktor Penyalahgunaan Dadah dalam Kalangan Murid", "arahan": "Menurut Ketua Polis Pahang, Dato' Sri Rosli Ab Rahman, dalam tempoh enam bulan pertama tahun 2018, seramai 26 orang murid ditahan atas pelbagai kesalahan penyalahgunaan dadah. Antara faktor yang menyebabkan berlakunnya masalah ini ialah pengaruh rakan sebaya, keinginan untuk mencuba dan kurang pengawasan daripada ibu bapa. (Sumber: www.bharian.com.my) — Berdasarkan petikan, huraikan faktor-faktor berlakunya masalah tersebut."}, {"topik": "Kesan Kemasukan Warga Asing Berleluasa", "arahan": "Kemasukan warga asing yang berleluasa dan tidak terkawal akan menyebabkan berlakunya lambakan warga asing dalam negara. Masalah ini dikatakan boleh mendatangkan pelbagai kesan negatif seperti peningkatan kadar jenayah, peningkatan kadar pengangguran dalam kalangan warga tempatan dan penularan penyakit berjangkit. (Sumber: www.academia.edu) — Huraikan kesan-kesan tersebut."}], "q1_jenis": "Kata Adjektif", "q1_topik": "Kota Ilmu, Buku dan Sastera Kita — Anwar Ridhwan (Dewan Sastera Bil. 4/2019)", "q1_jawapan": ["Kenal pasti 4 kata adjektif daripada petikan tentang industri penerbitan, kemudian tulis satu ayat bagi setiap kata adjektif yang menunjukkan kefahaman anda. [8 markah]"], "q2_jenis": "Cakap Ajuk → Cakap Pindah", "q2_topik": "Cerpen Nabatah di Pohon Kasih oleh M. Arif (mendaki Gunung Irau, hutan lumut)", "q2_jawapan": ["Tukar 5 ayat cakap ajuk kepada ayat cakap pindah berdasarkan cerpen Nabatah di Pohon Kasih. [6 markah]"], "q3_b1": {"judul": "Resume Nurain Sofia binti Kamarul Azman (memohon jawatan Guru Tadika)", "sumber": "Bahan 1: Resume + Bahan 2: artikel tentang faktor pemilihan kerjaya (contoh Sudirman)"}, "q3_b2": null, "q4_teks": "Daripada antologi Sejadah Rindu, KPM — Burung Terbang Dipipiskan Lada: Melaka menentang pencerobohan Siam di bawah Sultan Muzaffar Syah dan Awi Cakri.", "q4_source": "Sejadah Rindu, KPM (Burung Terbang Dipipiskan Lada)", "q4_jawapan": "Tulis semula teks bahasa Melayu klasik berikut dalam bahasa Melayu standard. [5 markah]", "q5_jenis": "Peribahasa — Kenal pasti & cari antonim peribahasa", "q5_peribahasa": ["isi dengan kuku", "ringan tulang", "genggam bara api biar sampai jadi arang", "bagai aur dengan tebing"], "q5_jawapan": [{"peribahasa": "isi dengan kuku", "makna": "Melakukan sesuatu dengan bersungguh-sungguh"}, {"peribahasa": "ringan tulang", "makna": "Rajin bekerja, tidak malas"}, {"peribahasa": "genggam bara api biar sampai jadi arang", "makna": "Bersabar dan bertahan sehingga sesuatu perkara berjaya dilaksanakan"}, {"peribahasa": "bagai aur dengan tebing", "makna": "Hubungan yang saling membantu dan bergantung antara satu sama lain"}], "q5_konteks": "Petikan tentang kerjasama ibu bapa dan guru dalam pendidikan anak-anak", "q6_topik": "Songket — Warisan Tekstil Tradisional Melayu", "q6_b1": {"judul": "Songket di Persada Dunia — Amirah Syazwani Baderol Sham (Dewan Budaya Bil. 3/2022)", "sumber": "Artikel (Bahan 1)"}, "q6_b2": {"judul": "Si Jantung Hati — Raja Andak Raja Hussin — koleksi pakaian tradisional Pak Andak (Dewan Budaya Bil. 3/2022) + Infografik: nilai estetika dan identiti budaya songket (Bahan 3)", "sumber": "Artikel + Infografik (Bahan 2 & 3)"}, "q6_subq": [{"num": "i", "arahan": "Nyatakan jenis-jenis bahan yang digunakan untuk menenun songket berdasarkan Bahan 1.", "markah": 2}, {"num": "ii", "arahan": "Nyatakan tujuan-tujuan pemakaian songket berdasarkan semua bahan.", "markah": 4, "jawapan": ["Bahan 1: Songket dipakai untuk menunjukkan kedudukan pangkat dan kebesaran individu yang memakainya.", "Bahan 2: Songket dipakai untuk berurusan dengan pihak istana; juga digunakan untuk menyerikan raja sehari ketika majlis perkahwinan.", "Bahan 3: Songket dipakai untuk melambangkan gaya hidup berbudaya tinggi; pemakaian kain songket dalam budaya Melayu dapat menggambarkan jati diri seseorang yang berbangga dengan warisan budayanya."]}, {"num": "iii", "arahan": "Berikan pendapat anda tentang sebab-sebab sedikit orang memakai songket buatan tangan yang asli pada hari-hari biasa.", "markah": 3, "jawapan": ["Songket tenunan asli sukar didapati kerana bahan yang digunakan untuk menenun songket sukar didapati.", "Individu perlu mengeluarkan duit yang banyak untuk membeli songket tenunan asli kerana kos yang mahal dan stok yang terhad.", "Sebab tidak ramai yang gemar memakai songket tenunan asli sebagai pakaian harian kerana warna songket tenunan asli yang tidak menarik dan kelihatan lapuk.", "Akhir sekali, kain songket tenunan asli yang tebal dan panas tidak sesuai dijadikan pakaian harian."]}, {"num": "iv", "arahan": "Sebagai pengurus sebuah kedai pakaian tradisional yang mengalami kemerosotan jualan, cadangkan langkah-langkah untuk meningkatkan jualan.", "markah": 4, "jawapan": ["Selaku pengurus, mengedarkan brosur kepada pelanggan dan masyarakat yang berada berhampiran kedai agar mereka mengetahui kewujudan kedai dan membeli pakaian tradisional di sana.", "Meminta pekerja-pekerja untuk mempromosikan kedai pakaian tradisional di media sosial seperti di aplikasi TikTok, Instagram dan Facebook kerana majoriti masyarakat menggunakan media sosial pada masa ini.", "Akhir sekali, memohon untuk membuka gerai jualan di Karnival Kebudayaan Kebangsaan yang dianjurkan oleh pihak kerajaan untuk meningkatkan jualan kerana penggemar pakaian tradisional akan berkumpul di karnival tersebut."]}], "q7_tema": "Kepimpinan", "q7_b1": {"judul": "Drama: Dato' Onn oleh Othman Haji Zainuddin (antologi Dirgahayu Bahasaku, DBP) — ONN berhadapan D.J. CAMPBELL yang cuba merampas tanah pusaka di Bukit Senyum", "sumber": "Drama extract (Bahan 1)"}, "q7_b2": {"judul": "Puisi: Apabila Bergelar Yang Berhormat oleh Ara Maisarah, Kuantan — pemimpin mesti berprinsip, berkhidmat untuk semua kaum", "sumber": "Puisi (Bahan 2)"}, "q7_subq": [{"num": "i", "arahan": "Mengapakah British tidak boleh merampas tanah Onn secara sewenang-wenangnya berdasarkan Bahan 1?", "markah": 2, "jawapan": ["Tanah itu adalah tanah pusaka ayahnya, Menteri Besar Negeri Johor.", "Tanah itu juga merupakan tanah anugerah Sultan kepada ayahnya.", "Inggeris tidak boleh merampas tanah anak negeri sesuka hati."]}, {"num": "ii", "arahan": "Nyatakan sikap-sikap yang perlu ada pada seorang pemimpin berdasarkan semua bahan.", "markah": 3, "jawapan": ["Bahan 1: Pemimpin harus berani berhadapan dengan kenyataan; tabah menentang musuh demi menegakkan kebenaran.", "Bahan 2: Pemimpin mestilah membela rakyat jelata agar mereka hidup dalam keadaan sejahtera tanpa mengira agama dan bangsa.", "Seterusnya, seorang pemimpin tidak boleh mempunyai prinsip perjuangan yang goyah."]}, {"num": "iii", "arahan": "Nyatakan kesan-kesan apabila pemimpin bersikap bertanggungjawab terhadap rakyat.", "markah": 3, "jawapan": ["Rakyat akan hidup dalam keadaan sejahtera dan makmur.", "Negara akan berada dalam keadaan aman dan stabil.", "Rakyat akan sentiasa menghormati dan menyokong pemimpin tersebut, sekali gus memperkukuh perpaduan negara."]}, {"num": "iv", "arahan": "Sebagai guru penasihat, cadangkan program-program sekolah untuk melahirkan pemimpin pelajar.", "markah": 4, "jawapan": ["Menganjurkan bengkel kepimpinan dan kursus motivasi untuk pelajar bagi mendedahkan mereka kepada nilai-nilai kepimpinan yang baik.", "Menggalakkan pelajar menyertai jawatan dalam persatuan dan kelab di sekolah supaya mereka dapat mengamalkan kemahiran kepimpinan.", "Menganjurkan pertandingan pidato, perbahasan dan forum untuk melatih kemahiran berkomunikasi dan berhujah pelajar.", "Mewujudkan program mentor-mentee antara pelajar senior dan junior agar pelajar senior dapat berkongsi pengalaman kepimpinan."]}], "q8_novel": "Pantai Kasih (Azmah Nordin)", "q8_si": "Kereta baharu Doktor Sadiz dilanggar oleh trak tangki di lampu isyarat — kereta hancur dan terbakar. Huraikan apa yang berlaku kepada kereta Doktor Sadiz. [4 markah]", "q8_sii": "Pilih 2 daripada 8 novel wajib — Huraikan satu peristiwa yang tidak sepatutnya berlaku dalam kalangan masyarakat dan cadangkan penyelesaian dalam setiap novel yang anda pilih. [6 markah]", "q8_ji": ["Kereta Doktor Sadiz dilanggar trak tangki dari belakang di lampu isyarat", "Kereta hancur dan terbakar akibat perlanggaran tersebut", "Peristiwa tragis yang berlaku secara tiba-tiba tanpa diduga"], "q8_jii": "Huraikan peristiwa yang tidak sepatutnya berlaku dan cadangkan penyelesaian dalam 2 novel pilihan anda.", "q9_topik": "Pempengaruh Media Sosial (PMS)", "q9_b1": {"judul": "Pempengaruh Media Sosial: Dampak Positif atau Sebaliknya — Harlina Halizah Siraj (Dewan Masyarakat Bil. 3/2022)", "sumber": "Artikel"}, "q9_b2": {"judul": "Iklan/Kursus Profesional: Pempengaruh Media Sosial — syarat: penampilan menarik + keyakinan berkomunikasi; sijil disediakan", "sumber": "Iklan Kursus"}, "q9_b3": {"judul": "Dialog: Mak Long Siah dan Mak Ngah Nora berbual tentang Roziah yang menjadi PMS — PMS boleh kayaraya dan advokasi isu awam", "sumber": "Dialog"}, "q9_isi_tersurat": ["PMS hendaklah meningkatkan kepercayaan pengikut agar mereka berpuas hati dan semakin setia kepadanya", "PMS dapat melahirkan generasi berilmu pengetahuan luas melalui maklumat yang disebarkan selagi tidak bertentangan dengan adat dan nilai agama", "PMS menjadi suara pendesak kepada mana-mana pihak", "PMS menyampaikan masalah masyarakat kepada pihak berkuasa"], "q9_isi_tersirat": ["PMS haruslah bersedia untuk menerima teguran daripada pengguna media sosial", "PMS mestilah seorang yang menghargai kesetiaan pengikutnya", "PMS juga perlu mempunyai penampilan diri yang menarik dan keyakinan diri untuk berkomunikasi dengan baik"]}, {"negeri": "SPM 2025", "tahun": "2025", "source_type": "SPM", "k1_bah_a_topik": "Tabiat Merokok dalam Kalangan Murid Sekolah", "k1_bah_a_arahan": "Grafik di bawah menunjukkan maklumat berkaitan dengan tabiat merokok dalam kalangan murid sekolah di negara kita. Berdasarkan maklumat tersebut, huraikan pendapat anda tentang tabiat merokok dalam kalangan murid sekolah di negara kita. Panjangnya huraian anda hendaklah antara 150 hingga 200 patah perkataan.", "k1_bah_a_grafik": "1. Artikel: 'Lebih 43 ribu orang murid sekolah menengah dikesan merokok' — saringan terhadap 2 juta murid sekolah rendah mendapati 341 orang murid terjebak merokok. 2. Kempen anti-merokok Kementerian Kesihatan Malaysia: Poster 'Tak Nak!' (ikon kaki yang menolak rokok). 3. Artikel: 'Kuat Kuasa Larangan Merokok' — pelaksanaan peraturan larangan merokok universal di sekolah.", "k1_bah_a_isi": [], "k1_bah_b": [{"topik": "Faktor Lari dari Rumah dalam Kalangan Remaja", "arahan": "Ketua Penolong Pengarah Bahagian Siasatan Seksual, Wanita dan Kanak-Kanak (D11) Bukit Aman, Asisten Komisioner Siti Kamsiah Hassan, berkata bagi tempoh tiga tahun antara 2019 hingga 2022, sejumlah 1168 orang atau 32.54 peratus daripada 3589 kes remaja dilaporkan lari dari rumah di negara ini disebabkan ingin mencari kebebasan. (Sumber: www.bharian.com.my) — Selain faktor yang dinyatakan dalam petikan di atas, huraikan faktor-faktor berlakunya perkara tersebut."}, {"topik": "Kesan Kebanjiran Barangan Tiruan", "arahan": "Kebanjiran barangan tiruan seperti kosmetik, ubat-ubatan dan barangan elektronik di Malaysia bukanlah suatu isu yang baharu, malah telah berlarutan sejak bertahun-tahun lamanya. Lambakan barangan tiruan di pasaran sudah tentu akan mendatangkan pelbagai kesan negatif kepada pengguna dan negara. (Sumber: www.seribuombak.wordpress.com) — Bincangkan kesan-kesan tersebut."}, {"topik": "Peranan Pelbagai Pihak Mengatasi Kenaikan Harga Barang", "arahan": "Belakangan ini, isu kenaikan harga barang menjadi topik perbualan hangat dalam kalangan rakyat. Sikap peniaga yang sesuka hati menaikkan harga barang menjadi antara faktor utama berlakunya isu tersebut. Walau bagaimanapun, isu kenaikan harga barang mampu diatasi sekiranya semua pihak memainkan peranan masing-masing. (Sumber: www.bharian.com.my) — Huraikan peranan-peranan tersebut."}, {"topik": "Punca Rakyat Malaysia Kurang Membudayakan Amalan Bersukan", "arahan": "Berdasarkan kajian yang dilakukan oleh Kementerian Belia dan Sukan, hanya 40 peratus daripada jumlah penduduk negara ini yang mengamalkan gaya hidup sihat, iaitu membudayakan sukan dalam kehidupan. Peratusan ini masih rendah berbanding dengan pelibatan rakyat di negara maju walhal amalan bersukan ini dapat menghindarkan pelbagai masalah kesihatan. Kesibukan bekerja dikatakan salah satu punca rakyat Malaysia tidak membudayakan amalan bersukan. (Sumber: Dewan Budaya, Bil. 6/2018) — Huraikan punca yang dinyatakan dalam petikan berserta punca-punca lain rakyat Malaysia kurang membudayakan amalan tersebut."}], "q1_jenis": "Kata Pinjaman Bahasa Inggeris", "q1_topik": "Angkasa Lepas Destinasi Pelancongan Baharu — Kassim Bahali (Dewan Kosmik Bil. 01/2022)", "q1_jawapan": ["Kenal pasti 4 kata pinjaman bahasa Inggeris daripada petikan tentang pelancongan angkasa lepas, kemudian tulis satu ayat bagi setiap kata pinjaman yang menunjukkan kefahaman anda. [8 markah]"], "q2_jenis": "Pola Ayat (FN+FN, FN+FK, FN+FA, FN+FS)", "q2_topik": "Karismatik Mulberi — Khairul Nizam Zainal Badri (Dewan Kosmik Bil. 08/2022)", "q2_jawapan": ["Kenal pasti pola ayat (FN+FN, FN+FK, FN+FA, atau FN+FS) bagi setiap ayat bergaris dalam petikan tentang tanaman mulberi. [5 markah]"], "q3_b1": {"judul": "Teks Ucapan di Majlis Anugerah Kecemerlangan Akademik, SMK Seri Paya Keladi, Klang — 10 kesalahan bahasa untuk dikenal pasti dan dibetulkan", "sumber": "Ucapan Rasmi"}, "q3_b2": null, "q4_teks": "Daripada antologi Jaket Kulit Kijang dari Istanbul, KPM — Kepimpinan Melalui Teladan: raja memerintahkan Bentara mengumpulkan semua barang/harta di Bukit Cina.", "q4_source": "Jaket Kulit Kijang dari Istanbul, KPM (Kepimpinan Melalui Teladan)", "q4_jawapan": "Tulis semula teks bahasa Melayu klasik berikut dalam bahasa Melayu standard. [6 markah]", "q5_jenis": "Peribahasa — Isi tempat kosong berdasarkan konteks", "q5_peribahasa": ["3 peribahasa yang sesuai dalam dialog antara Kamil dan Raju tentang Nani yang bising semasa ulang kaji"], "q5_jawapan": [{"peribahasa": "Peribahasa (i)", "makna": "Sesuai untuk menggambarkan sikap Nani yang bercakap tanpa henti"}, {"peribahasa": "Peribahasa (ii)", "makna": "Sesuai untuk situasi yang mengganggu tumpuan"}, {"peribahasa": "Peribahasa (iii)", "makna": "Cadangan untuk menangani situasi tersebut"}], "q5_konteks": "Dialog antara Kamil dan Raju tentang Nani yang bercakap tanpa henti semasa sesi ulang kaji, mengganggu rakan-rakan", "q6_topik": "Keusahawanan / Usahawan dalam Kalangan Graduan", "q6_b1": {"judul": "Graduan Usahawan: Keperluan Terdesak atau Peka Peluang — Norfarah Nordin (Dewan Ekonomi Bil. 10/2017)", "sumber": "Artikel (Bahan 1)"}, "q6_b2": {"judul": "Keusahawanan Siswa — Suliati Asri (Harian Metro, 4 Jan 2021)", "sumber": "Artikel (Bahan 2)"}, "q6_subq": [{"num": "i", "arahan": "Jelaskan makna 'hala tuju program' daripada Bahan 1.", "markah": 2}, {"num": "ii", "arahan": "Nyatakan kelebihan-kelebihan bagi pelajar yang menceburi bidang keusahawanan berdasarkan Bahan 1 dan Bahan 2.", "markah": 3}, {"num": "iii", "arahan": "Berikan pendapat anda tentang usaha-usaha untuk menggalakkan lebih ramai pelajar menceburi bidang keusahawanan.", "markah": 3, "jawapan": ["Pihak kerajaan mestilah mengadakan kempen kesedaran kepada graduan-graduan tentang kelebihan bidang keusahawanan.", "Ibu bapa mestilah menggalakkan anak-anak mereka dan memberi sokongan kepada anak untuk menceburi bidang tersebut.", "Pihak kerajaan boleh memberi subsidi kepada graduan-graduan untuk memulakan bidang keusahawanan ini."]}, {"num": "iv", "arahan": "Cadangkan cara-cara untuk membantu rakan anda yang perniagaannya mengalami kemerosotan.", "markah": 4, "jawapan": ["Mencadangkan rakan untuk mempromosikan produk jualannya menerusi media sosial.", "Mencadangkan rakan untuk mendapatkan pandangan daripada pakar dalam bidang keusahawanan.", "Mencadangkan rakan untuk menjalinkan kerjasama perniagaan dengan syarikat perniagaan lain untuk meningkatkan hasil pulangan.", "Akhir sekali, mencadangkan rakan memilih pembekal alternatif untuk mendapatkan bahan mentah dengan harga yang lebih murah agar keuntungan dapat dimaksimumkan."]}], "q7_tema": "Pendidikan / Semangat Guru", "q7_b1": {"judul": "Puisi: Jiwa Guru oleh smkpp14(1), 10 Jan 2014 (www.zukidin.com) — guru yang ikhlas, suci hati, kata-kata menjadi panduan, tindakan menjadi teladan", "sumber": "Puisi (Bahan 1)"}, "q7_b2": {"judul": "Novel: Melunas Rindu oleh Hartini Hamzah (KPM) — Cikgu Abas memerhatikan kaedah pengajaran Fuad yang unik: pendekatan individu, membetulkan seorang demi seorang; Fuad adalah 'sehelai kain putih'", "sumber": "Novel extract (Bahan 2)"}, "q7_subq": [{"num": "i", "arahan": "Apakah makna 'kelakuan kita jadi ikutan' berdasarkan Bahan 1?", "markah": 2, "jawapan": ["'Kelakuan kita jadi ikutan' bermaksud tingkah laku atau perbuatan guru dijadikan contoh dan teladan oleh pelajar.", "Seseorang guru bertanggungjawab memastikan perilakunya baik dan mulia kerana pelajar akan meniru perbuatan tersebut."]}, {"num": "ii", "arahan": "Nyatakan ciri-ciri seorang guru yang dapat diteladani berdasarkan semua bahan.", "markah": 3, "jawapan": ["Merujuk Bahan 1: guru sentiasa bersifat pemaaf dan berhati mulia.", "Merujuk Bahan 2: guru sentiasa menunjuk ajar dan membaiki kesilapan murid satu persatu."]}, {"num": "iii", "arahan": "Berikan pendapat anda tentang cabaran-cabaran yang dihadapi oleh guru dalam melaksanakan tugas mereka.", "markah": 4, "jawapan": ["Sikap pelajar yang kurang menghormati guru menyukarkan proses pengajaran dan pembelajaran.", "Beban kerja guru yang berat selain mengajar seperti mengisi data dan menyediakan laporan yang banyak.", "Kepelbagaian tahap kemampuan pelajar dalam kelas menyebabkan guru sukar memastikan semua pelajar memahami pelajaran.", "Masalah disiplin pelajar seperti membuat bising dan tidak memberi perhatian turut mengganggu pengajaran guru."]}, {"num": "iv", "arahan": "Sebagai kaunselor sekolah, cadangkan langkah-langkah untuk menangani masalah ponteng sekolah dalam kalangan pelajar Tingkatan 5.", "markah": 4, "jawapan": ["Berbincang secara individu dengan pelajar yang sering ponteng untuk mengetahui sebab-sebab mereka berbuat demikian.", "Mengadakan sesi kaunseling secara berkumpulan dengan pelajar bermasalah untuk memberi motivasi dan bimbingan.", "Memaklumkan ibu bapa tentang masalah ponteng anak mereka agar pihak keluarga turut membantu mengawal kehadiran pelajar.", "Menganjurkan program motivasi dan aktiviti menarik di sekolah untuk membangkitkan semangat belajar pelajar."]}], "q8_novel": "Silir Daksina (Nizar Parman)", "q8_si": "Pentas yang dihias indah untuk Malam Kemerdekaan; penduduk kampung meminjamkan pasu bunga; pencerita terharu dengan semangat komuniti dan persembahan deklamasi yang memenangi hadiah. Nyatakan perkara-perkara yang mengharukan dan melegakan hati 'aku'. [4 markah]", "q8_sii": "Pilih 2 daripada 8 novel wajib — Huraikan satu peristiwa yang dapat memberikan galakan dan dorongan untuk mencapai sesuatu kejayaan dalam setiap novel yang anda pilih. [6 markah]", "q8_ji": ["Semangat kerjasama dan gotong-royong penduduk kampung dalam menyiapkan persembahan Malam Kemerdekaan", "Persembahan deklamasi yang cemerlang dan layak memenangi hadiah", "Pencerita terharu melihat perpaduan komuniti yang terjalin erat"], "q8_jii": "Huraikan peristiwa yang memberikan galakan dan dorongan untuk berjaya dalam 2 novel pilihan anda.", "q9_topik": "Pencemaran Sungai di Malaysia", "q9_b1": {"judul": "Kelestarian Sumber Air di Malaysia — Chan Ngai Weng (Dewan Kosmik Bil. 03/2021)", "sumber": "Artikel"}, "q9_b2": {"judul": "Gurindam Sungai Kita oleh Fira Nora, Pinetree Batu Pahat, 2022 — sungai sebagai kurniaan Allah; penebangan hutan; air keruh; pertanian guna bahan kimia", "sumber": "Gurindam"}, "q9_b3": {"judul": "Komik strip 2 panel: (1) Dua belia di tepi sungai berbincang tentang pembalakan haram sebagai punca pencemaran; (2) Belia dan dewasa membersihkan sungai, mempromosi kesedaran komuniti", "sumber": "Komik Strip"}, "q9_isi_tersurat": ["Pembuangan sisa bahaya (sisa kimia industri) ke dalam sungai", "Sikap masyarakat yang suka membuang sampah ke dalam sungai", "Penggunaan bahan kimia dalam bidang pertanian yang mengalir masuk ke sungai", "Tangan-tangan manusia yang melakukan pembalakan haram menyebabkan pencemaran sungai"], "q9_isi_tersirat": ["Pihak kerajaan meningkatkan denda terhadap pesalah yang mencemarkan sungai", "KPM mewujudkan mata pelajaran berkaitan alam sekitar dalam kurikulum sekolah", "Pihak berkuasa tempatan memastikan setiap bangunan dilengkapi dengan sistem rawatan air buangan pusat", "Memupuk kesedaran masyarakat tentang kepentingan sungai sebagai sumber kehidupan"]}];

}
