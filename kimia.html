        {bm:'Boron oksida',en:'Boron oxide'}, {bm:'Plumbum(II) oksida',en:'Lead(II) oxide'} ],
    a:0,
    w:{ bm:'Semua kaca dibuat daripada <b>pasir silika, SiO₂</b>. Yang lain hanyalah bahan tambah yang menentukan jenis kaca: boron oksida → kaca borosilikat, plumbum oksida → kaca kristal plumbum, aluminium oksida → kaca aluminosilikat.',
        en:'All glass is made from <b>silica sand, SiO₂</b>. The others are only additives that decide the type of glass: boron oxide → borosilicate glass, lead oxide → lead crystal glass, aluminium oxide → aluminosilicate glass.' } },

  { n:6, topic:'REDOX',
    q:{ bm:'Antara berikut yang manakah betul tentang tindak balas penurunan?<br><br><b>I</b> Penerimaan elektron<br><b>II</b> Penambahan nombor pengoksidaan<br><b>III</b> Kehilangan oksigen<br><b>IV</b> Kehilangan hidrogen',
        en:'Which of the following are correct about a reduction reaction?<br><br><b>I</b> Gain of electrons<br><b>II</b> Increase in oxidation number<br><b>III</b> Loss of oxygen<br><b>IV</b> Loss of hydrogen' },
    o:[ {bm:'I dan II',en:'I and II'}, {bm:'I dan III',en:'I and III'},
        {bm:'II dan IV',en:'II and IV'}, {bm:'III dan IV',en:'III and IV'} ],
    a:1,
    w:{ bm:'Penurunan = <b>terima elektron</b>, <b>hilang oksigen</b>, <b>terima hidrogen</b>, dan nombor pengoksidaan <b>menurun</b>. Jadi I dan III betul; II dan IV menerangkan pengoksidaan.',
        en:'Reduction = <b>gain electrons</b>, <b>lose oxygen</b>, <b>gain hydrogen</b>, and the oxidation number <b>decreases</b>. So I and III are right; II and IV describe oxidation.' } },

  { n:7, topic:'CARBON',
    q:{ bm:'Petroleum ialah campuran hidrokarbon sama ada yang ringkas atau yang berantai panjang dan tidak dapat digunakan sebelum diproses. Bagaimanakah hidrokarbon ini diasingkan untuk kegunaan harian?',
        en:'Petroleum is a mixture of simple or long chain hydrocarbons and cannot be used before processing. How are these hydrocarbons separated for daily use?' },
    o:[ {bm:'Melalui proses peretakan', en:'Through the cracking process'},
        {bm:'Melalui proses penyulingan berperingkat', en:'Through the fractional distillation process'},
        {bm:'Melalui proses elektrolisis', en:'Through the electrolysis process'},
        {bm:'Melalui penyulingan dan pendehidratan', en:'Through distillation and dehydration'} ],
    a:1,
    w:{ bm:'Penyulingan berperingkat <b>mengasingkan</b> pecahan mengikut takat didih yang berbeza. Peretakan bukan pengasingan — ia <b>memecahkan</b> molekul panjang kepada molekul yang lebih pendek <i>selepas</i> penyulingan.',
        en:'Fractional distillation <b>separates</b> the fractions by their different boiling points. Cracking is not separation — it <b>breaks</b> long molecules into shorter ones <i>after</i> distillation.' } },

  { n:8, topic:'THERMO',
    q:{ bm:'Antara berikut yang manakah tindak balas endotermik?',
        en:'Which of the following is an endothermic reaction?' },
    o:[ {bm:'Membakar kayu api',en:'Burning of wood'}, {bm:'Memanggang ayam',en:'Roasting chicken'},
        {bm:'Mengimpal landasan kereta api',en:'Welding of railway track'}, {bm:'Tin panas untuk memanaskan makanan',en:'Hot can to heat food'} ],
    a:1,
    w:{ bm:'Endotermik = haba <b>diserap</b>. Ayam yang dipanggang menyerap haba dari ketuhar. Pembakaran kayu, tindak balas termit untuk mengimpal, dan tin panas swa-panas semuanya <b>membebaskan</b> haba — eksotermik.',
        en:'Endothermic = heat is <b>absorbed</b>. Roasting chicken absorbs heat from the oven. Burning wood, the thermite reaction used in welding, and a self-heating can all <b>release</b> heat — exothermic.' } },

  { n:9, topic:'CONSUMER',
    q:{ bm:'Antara kriteria berikut yang manakah perlu diutamakan semasa seseorang memilih detergen yang berkesan?',
        en:'Which of the following criteria should be prioritised when choosing an effective detergent?' },
    o:[ {bm:'Bahan tambah dalam detergen',en:'Additives in the detergent'},
        {bm:'Antioksida dalam detergen',en:'Antioxidant in the detergent'},
        {bm:'Keadaan fizik detergen',en:'Physical state of the detergent'},
        {bm:'Warna detergen',en:'Colour of the detergent'} ],
    a:0,
    w:{ bm:'Bahan tambah — pembina, agen pemutih, enzim, pencerah optik, biological agent — itulah yang sebenarnya menentukan sejauh mana detergen membersih. Warna dan keadaan fizik (serbuk atau cecair) tidak mempengaruhi keberkesanan; antioksida ialah bahan tambah <b>makanan</b>, bukan detergen.',
        en:'The additives — builders, bleaching agents, enzymes, optical whiteners, biological agents — are what actually decide how well a detergent cleans. Colour and physical state (powder or liquid) do not affect performance; antioxidants are a <b>food</b> additive, not a detergent one.' } },

  { n:10, topic:'BOND',
    q:{ bm:'Bahan manakah yang mempunyai takat didih yang paling tinggi?',
        en:'Which substance has the highest boiling point?' },
    o:[ {bm:'Etanol',en:'Ethanol'}, {bm:'Klorin',en:'Chlorine'},
        {bm:'Asid hidroklorik',en:'Hydrochloric acid'}, {bm:'Etana',en:'Ethane'} ],
    a:0,
    w:{ bm:'Etanol mempunyai kumpulan –OH, jadi molekulnya diikat oleh <b>ikatan hidrogen</b> yang jauh lebih kuat daripada daya van der Waals dalam klorin, hidrogen klorida dan etana. Takat didih etanol 78 °C; yang lain semuanya gas pada suhu bilik.',
        en:'Ethanol has an –OH group, so its molecules are held by <b>hydrogen bonds</b>, far stronger than the van der Waals forces in chlorine, hydrogen chloride and ethane. Ethanol boils at 78 °C; the others are all gases at room temperature.' } },

  { n:11, topic:'ACID',
    q:{ bm:'Bes Q dilarutkan dalam air untuk menghasilkan larutan Q. Kemudian larutan Q diuji dengan penunjuk metil jingga. Apakah warna penunjuk dan ion yang bertanggungjawab terhadap perubahan warna tersebut dalam larutan Q?',
        en:'Base Q is dissolved in water to make solution Q. The solution is then tested with methyl orange indicator. What is the colour of the indicator and the ion responsible for that colour change in solution Q?' },
    o:[ {bm:'Jingga &nbsp;·&nbsp; O²⁻',en:'Orange &nbsp;·&nbsp; O²⁻'},
        {bm:'Jingga &nbsp;·&nbsp; OH⁻',en:'Orange &nbsp;·&nbsp; OH⁻'},
        {bm:'Kuning &nbsp;·&nbsp; O²⁻',en:'Yellow &nbsp;·&nbsp; O²⁻'},
        {bm:'Kuning &nbsp;·&nbsp; OH⁻',en:'Yellow &nbsp;·&nbsp; OH⁻'} ],
    a:3,
    w:{ bm:'Bes yang larut dalam air menghasilkan ion <b>OH⁻</b> (bukan O²⁻ — ion oksida tidak wujud bebas dalam air). Metil jingga bertukar <b>kuning</b> dalam alkali, jingga pada neutral, dan merah dalam asid.',
        en:'A base dissolved in water produces <b>OH⁻</b> ions (not O²⁻ — oxide ions do not exist free in water). Methyl orange turns <b>yellow</b> in alkali, orange at neutral, and red in acid.' } },

  { n:12, topic:'INDUSTRY',
    note:'Options B and C are the same answer written two ways (fibre glass / glass fibre); the skema selects C.',
    q:{ bm:'Badan kereta diperbuat daripada bahan komposit W. Apakah bahan matriks dan bahan pengukuhan dalam bahan komposit W?',
        en:'A car body is made of composite material W. What are the matrix substance and the strengthening substance in composite material W?' },
    o:[ {bm:'Matriks: Kaca gentian &nbsp;·&nbsp; Pengukuhan: Plastik', en:'Matrix: Fibre glass &nbsp;·&nbsp; Strengthening: Plastic'},
        {bm:'Matriks: Plastik &nbsp;·&nbsp; Pengukuhan: Kaca gentian', en:'Matrix: Plastic &nbsp;·&nbsp; Strengthening: Fibre glass'},
        {bm:'Matriks: Plastik &nbsp;·&nbsp; Pengukuhan: Gentian kaca', en:'Matrix: Plastic &nbsp;·&nbsp; Strengthening: Glass fibre'},
        {bm:'Matriks: Gentian kaca &nbsp;·&nbsp; Pengukuhan: Plastik', en:'Matrix: Glass fibre &nbsp;·&nbsp; Strengthening: Plastic'} ],
    a:2,
    w:{ bm:'Bahan komposit itu ialah <b>fiberglass</b>: plastik (resin) ialah <b>matriks</b> yang memegang segalanya, dan gentian kaca ialah bahan <b>pengukuhan</b> yang tertanam di dalamnya. Matriks sentiasa bahan yang menyelubungi, bukan gentian.',
        en:'The composite is <b>fibreglass</b>: the plastic (resin) is the <b>matrix</b> that holds everything together, and the glass fibre is the <b>strengthening</b> material embedded in it. The matrix is always the surrounding material, never the fibre.' } },

  { n:13, topic:'INDUSTRY',
    q:{ bm:'Logam manakah yang tidak boleh diekstrak daripada bijihnya melalui tindak balas penurunan karbon?',
        en:'Which metal cannot be extracted from its ore by carbon reduction?' },
    o:[ {bm:'Magnesium',en:'Magnesium'}, {bm:'Kuprum',en:'Copper'},
        {bm:'Argentum',en:'Silver'},   {bm:'Stanum',en:'Tin'} ],
    a:0,
    w:{ bm:'Karbon hanya boleh menurunkan oksida logam yang <b>kurang elektropositif daripada karbon</b>. Magnesium terletak jauh <b>lebih tinggi</b> daripada karbon dalam siri kereaktifan, jadi ia mesti diekstrak melalui <b>elektrolisis</b> leburan magnesium klorida.',
        en:'Carbon can only reduce the oxides of metals <b>less electropositive than carbon</b>. Magnesium sits far <b>above</b> carbon in the reactivity series, so it must be extracted by <b>electrolysis</b> of molten magnesium chloride.' } },

  { n:14, topic:'POLYMER',
    q:{ bm:'Pempolimeran kondensasi merupakan salah satu tindak balas untuk menghasilkan polimer. Antara berikut polimer manakah yang dihasilkan melalui tindak balas ini?<br><br><b>I</b> PVC<br><b>II</b> Nilon<br><b>III</b> Terilena<br><b>IV</b> Polistirena',
        en:'Condensation polymerisation is one of the reactions used to produce polymers. Which of the following polymers are produced through this reaction?<br><br><b>I</b> PVC<br><b>II</b> Nylon<br><b>III</b> Terylene<br><b>IV</b> Polystyrene' },
    o:[ {bm:'I dan II',en:'I and II'}, {bm:'I dan IV',en:'I and IV'},
        {bm:'II dan III',en:'II and III'}, {bm:'III dan IV',en:'III and IV'} ],
    a:2,
    w:{ bm:'Nilon (poliamida) dan terilena (poliester) terbentuk apabila dua monomer berbeza bergabung dan <b>membebaskan molekul kecil</b> seperti air — itulah pempolimeran kondensasi. PVC dan polistirena terbentuk daripada monomer beralkena melalui pempolimeran <b>penambahan</b>, tanpa membebaskan apa-apa.',
        en:'Nylon (a polyamide) and Terylene (a polyester) form when two different monomers join and <b>release a small molecule</b> such as water — that is condensation polymerisation. PVC and polystyrene form from alkene monomers by <b>addition</b> polymerisation, releasing nothing.' } },

  { n:15, topic:'ATOM',
    note:'Source PDF prints only options A, B and C for this question — option D is missing from the paper.',
    q:{ bm:'Bahan manakah terdiri daripada atom?', en:'Which substance consists of atoms?' },
    o:[ {bm:'Gas argon',en:'Argon gas'}, {bm:'Gas hidrogen',en:'Hydrogen gas'},
        {bm:'Gas ammonia',en:'Ammonia gas'} ],
    a:0,
    w:{ bm:'Argon ialah gas adi — petala valensnya sudah penuh, jadi ia wujud sebagai <b>atom tunggal</b> (monoatom). Hidrogen wujud sebagai molekul H₂ dan ammonia sebagai molekul NH₃, jadi kedua-duanya terdiri daripada molekul, bukan atom tunggal.',
        en:'Argon is a noble gas — its valence shell is already full, so it exists as <b>single atoms</b> (monoatomic). Hydrogen exists as H₂ molecules and ammonia as NH₃ molecules, so both consist of molecules, not single atoms.' } },

  { n:16, topic:'BOND', img:'img/kimia/017d5babfe9d.webp',
    alt:{ bm:'Rajah 2: lengkung pemanasan pepejal Y, dengan pendataran pada 80 °C antara t₂ dan t₃.',
          en:'Diagram 2: heating curve of solid Y, with a plateau at 80 °C between t₂ and t₃.' },
    q:{ bm:'Rajah 2 menunjukkan lengkung pemanasan bagi pepejal Y. Pernyataan manakah yang boleh dideduksikan daripada Rajah 2?',
        en:'Diagram 2 shows the heating curve of solid Y. Which statement can be deduced from Diagram 2?' },
    o:[ {bm:'Takat lebur bagi bahan Y ialah 100 °C', en:'The melting point of substance Y is 100 °C'},
        {bm:'Semua bahan Y adalah dalam keadaan cecair pada t₂', en:'All of substance Y is in the liquid state at t₂'},
        {bm:'Haba diserap untuk mengatasi daya antara molekul dari t₂ kepada t₃', en:'Heat is absorbed to overcome the intermolecular forces from t₂ to t₃'},
        {bm:'Tenaga kinetik zarah-zarah dalam bahan Y berkurang dari t₃ kepada t₄', en:'The kinetic energy of the particles in substance Y decreases from t₃ to t₄'} ],
    a:2,
    w:{ bm:'Pendataran pada 80 °C (t₂ ke t₃) ialah <b>peleburan</b>: haba yang diserap digunakan sepenuhnya untuk mengatasi daya tarikan antara zarah, bukan untuk menaikkan suhu. Maka takat lebur ialah 80 °C bukan 100 °C (A salah); pada t₂ peleburan baru <b>bermula</b>, jadi bahan masih pepejal (B salah); dan dari t₃ ke t₄ suhu <b>naik</b>, jadi tenaga kinetik bertambah (D salah).',
        en:'The plateau at 80 °C (t₂ to t₃) is <b>melting</b>: the heat absorbed goes entirely into overcoming the forces between particles, not into raising the temperature. So the melting point is 80 °C, not 100 °C (A wrong); at t₂ melting is only <b>starting</b>, so the substance is still solid (B wrong); and from t₃ to t₄ the temperature <b>rises</b>, so kinetic energy increases (D wrong).' } },

  { n:17, topic:'PTABLE',
    q:{ bm:'Gas adi manakah yang diisi dalam lampu rumah api?',
        en:'Which noble gas is filled in lighthouse lamps?' },
    o:[ {bm:'Xe',en:'Xe'}, {bm:'Kr',en:'Kr'}, {bm:'Ar',en:'Ar'}, {bm:'Ne',en:'Ne'} ],
    a:0,
    w:{ bm:'<b>Xenon</b> menghasilkan cahaya putih yang sangat terang dan berdenyut — itulah sebabnya ia digunakan dalam lampu rumah api, lampu denyar dan lampu kalimantang kuasa tinggi. Argon mengisi mentol filamen biasa, neon memberi cahaya merah-jingga papan tanda, dan kripton digunakan dalam beberapa lampu kilat.',
        en:'<b>Xenon</b> produces a very bright, flashable white light — which is why it is used in lighthouse lamps, flash lamps and high-power arc lamps. Argon fills ordinary filament bulbs, neon gives the red-orange glow of signs, and krypton is used in some photographic flashes.' } },

  { n:18, topic:'PTABLE',
    q:{ bm:'Apakah perubahan bagi unsur magnesium, aluminium dan sulfur apabila merentasi Kala 3 dari kiri ke kanan dalam Jadual Berkala Unsur?',
        en:'What is the change for the elements magnesium, aluminium and sulphur when going across Period 3 from left to right in the Periodic Table?' },
    o:[ {bm:'Bilangan elektron valens semakin berkurang', en:'The number of valence electrons decreases'},
        {bm:'Saiz atom semakin bertambah', en:'The atomic size increases'},
        {bm:'Keelektronegatifan semakin bertambah', en:'The electronegativity increases'},
        {bm:'Ketumpatan atom semakin berkurang', en:'The atomic density decreases'} ],
    a:2,
    w:{ bm:'Merentasi satu kala, cas nukleus bertambah tetapi bilangan petala kekal → tarikan terhadap elektron menjadi lebih kuat. Maka saiz atom <b>mengecil</b> (B salah), keelektronegatifan <b>bertambah</b> ✓, dan bilangan elektron valens juga <b>bertambah</b> (Mg 2 → Al 3 → S 6), jadi A salah.',
        en:'Across a period the nuclear charge rises while the number of shells stays the same → the pull on the electrons gets stronger. So the atomic size <b>decreases</b> (B wrong), electronegativity <b>increases</b> ✓, and the number of valence electrons also <b>increases</b> (Mg 2 → Al 3 → S 6), so A is wrong.' } },

  { n:19, topic:'ACID',
    q:{ bm:'Jadual 1 menunjukkan nilai pH bagi dua asid yang mempunyai kepekatan yang sama. Apakah yang boleh dilakukan untuk mengubah nilai pH asid Y supaya sama dengan nilai pH asid X?'+
           '<table><tr><th>Asid / Acid</th><th>Nilai pH / pH value</th></tr><tr><td>Asid X / X acid</td><td>3</td></tr><tr><td>Asid Y / Y acid</td><td>1</td></tr></table><span class="fig">JADUAL 1 · TABLE 1</span>',
        en:'Table 1 shows the pH values of two acids of the same concentration. What can be done to change the pH value of acid Y to be the same as the pH value of acid X?'+
           '<table><tr><th>Asid / Acid</th><th>Nilai pH / pH value</th></tr><tr><td>Asid X / X acid</td><td>3</td></tr><tr><td>Asid Y / Y acid</td><td>1</td></tr></table><span class="fig">JADUAL 1 · TABLE 1</span>' },
    o:[ {bm:'Panaskan asid Y',en:'Heat acid Y'},
        {bm:'Kurangkan isi padu asid Y',en:'Decrease the volume of acid Y'},
        {bm:'Tambahkan air ke dalam asid Y',en:'Add water into acid Y'},
        {bm:'Campurkan asid Y dengan asid X',en:'Mix acid Y with acid X'} ],
    a:2,
    w:{ bm:'pH 1 → pH 3 bermakna kepekatan ion H⁺ perlu <b>dikurangkan 100 kali</b>. Menambah air (pencairan) melakukan tepat itu. Memanaskan tidak mengubah bilangan ion H⁺; mengurangkan isi padu tidak mengubah <b>kepekatan</b> langsung; mencampurkan dengan asid lain masih menambah lagi ion H⁺.',
        en:'Going from pH 1 to pH 3 means the H⁺ concentration must be reduced <b>100-fold</b>. Adding water (dilution) does exactly that. Heating does not change the number of H⁺ ions; reducing the volume does not change the <b>concentration</b> at all; mixing with another acid still adds more H⁺.' } },

  { n:20, topic:'REDOX', img:'img/kimia/9cdfe29dfac6.webp',
    alt:{ bm:'Rajah 3: kepingan kuprum dicelup ke dalam larutan magnesium sulfat.',
          en:'Diagram 3: a copper strip dipped in magnesium sulphate solution.' },
    q:{ bm:'Rajah 3 menunjukkan susunan radas untuk mengkaji tindak balas penyesaran logam. Apakah pemerhatian yang boleh diperolehi selepas 20 minit?',
        en:'Diagram 3 shows the apparatus set-up to study a metal displacement reaction. What observation can be obtained after 20 minutes?' },
    o:[ {bm:'Kepingan logam menjadi nipis',en:'The metal strip becomes thinner'},
        {bm:'Larutan biru terhasil',en:'A blue solution is produced'},
        {bm:'Pepejal kelabu kelihatan',en:'A grey solid is seen'},
        {bm:'Tiada perubahan',en:'No change'} ],
    a:3,
    w:{ bm:'Penyesaran hanya berlaku jika logam itu <b>lebih</b> elektropositif daripada logam dalam larutan. Kuprum jauh <b>lebih rendah</b> daripada magnesium dalam siri elektrokimia, jadi kuprum tidak dapat menyesarkan magnesium — tiada tindak balas berlaku langsung.',
        en:'Displacement only happens if the metal is <b>more</b> electropositive than the metal in the solution. Copper is far <b>below</b> magnesium in the electrochemical series, so copper cannot displace magnesium — no reaction occurs at all.' } },

  { n:21, topic:'THERMO', img:'img/kimia/ba6c2eb4aa2b.webp',
    alt:{ bm:'Rajah 4: profil tenaga dengan Y dari aras bahan tindak balas ke puncak, Z dari aras bahan tindak balas ke aras hasil, X dari puncak ke aras hasil dan W di bawah aras hasil.',
          en:'Diagram 4: energy profile with Y from the reactant level to the peak, Z from the reactant level down to the product level, X from the peak to the product level and W below the product level.' },
    q:{ bm:'Rajah 4 menunjukkan gambar rajah profil tenaga bagi tindak balas asid hidroklorik dan natrium hidroksida. Antara berikut yang manakah haba tindak balas, ΔH bagi tindak balas itu?',
        en:'Diagram 4 shows the energy profile diagram for the reaction between hydrochloric acid and sodium hydroxide. Which of the following is the heat of reaction, ΔH for the reaction?' },
    o:[ {bm:'W',en:'W'}, {bm:'X',en:'X'}, {bm:'Y',en:'Y'}, {bm:'Z',en:'Z'} ],
    a:3,
    w:{ bm:'ΔH ialah beza tenaga antara aras <b>bahan tindak balas</b> dan aras <b>hasil</b> — itulah anak panah Z. Y ialah tenaga pengaktifan (bahan tindak balas → puncak), dan X ialah jatuhan dari puncak ke hasil, bukan ΔH.',
        en:'ΔH is the energy difference between the <b>reactant</b> level and the <b>product</b> level — that is arrow Z. Y is the activation energy (reactants → peak), and X is the drop from the peak to the products, not ΔH.' } },

  { n:22, topic:'POLYMER', img:'img/kimia/44524a3434fc.webp',
    note:'Source PDF prints only options A, B and C for this question — option D is missing from the paper.',
    alt:{ bm:'Rajah 5: Polimer A (blok mainan) melebur apabila dipanaskan; Polimer B (palam elektrik) terurai apabila dipanaskan.',
          en:'Diagram 5: Polymer A (toy bricks) melts when heated; Polymer B (electrical plugs) decomposes when heated.' },
    q:{ bm:'Rajah 5 menunjukkan contoh dan ciri bagi Polimer A dan Polimer B. Apakah jenis Polimer A dan Polimer B?',
        en:'Diagram 5 shows examples and characteristics of Polymer A and Polymer B. What are the types of Polymer A and Polymer B?' },
    o:[ {bm:'A: Elastomer &nbsp;·&nbsp; B: Termoplastik', en:'A: Elastomer &nbsp;·&nbsp; B: Thermoplastic'},
        {bm:'A: Termoplastik &nbsp;·&nbsp; B: Termoset',  en:'A: Thermoplastic &nbsp;·&nbsp; B: Thermosetting'},
        {bm:'A: Termoset &nbsp;·&nbsp; B: Elastomer',     en:'A: Thermosetting &nbsp;·&nbsp; B: Elastomer'} ],
    a:1,
    w:{ bm:'<b>Termoplastik</b> mempunyai rantai lurus tanpa rangkai silang, jadi ia melembut dan <b>melebur</b> apabila dipanaskan dan boleh dibentuk semula. <b>Termoset</b> mempunyai rangkai silang tiga dimensi yang kekal, jadi ia tidak melebur — ia <b>terurai</b> apabila dipanaskan kuat. Itulah sebabnya palam elektrik diperbuat daripada termoset.',
        en:'A <b>thermoplastic</b> has straight chains with no cross-links, so it softens and <b>melts</b> on heating and can be reshaped. A <b>thermoset</b> has permanent three-dimensional cross-links, so it does not melt — it <b>decomposes</b> when strongly heated. That is why electrical plugs are made of thermosets.' } },

  { n:23, topic:'ATOM',
    q:{ bm:'Rajah 6 menunjukkan perwakilan piawai bagi atom P, Q dan R sebagai <sup>7</sup>P<sub>3</sub>, <sup>16</sup>Q<sub>8</sub> dan <sup>24</sup>R<sub>12</sub>. Apakah susunan elektron bagi ion P, ion Q dan atom R?',
        en:'Diagram 6 shows the standard representation of atoms P, Q and R as <sup>7</sup>P<sub>3</sub>, <sup>16</sup>Q<sub>8</sub> and <sup>24</sup>R<sub>12</sub>. What is the electron arrangement for ion P, ion Q and atom R?' },
    o:[ {bm:'Ion P: 2.1 &nbsp;·&nbsp; Ion Q: 2.6 &nbsp;·&nbsp; Atom R: 2.8',
         en:'Ion P: 2.1 &nbsp;·&nbsp; Ion Q: 2.6 &nbsp;·&nbsp; Atom R: 2.8'},
        {bm:'Ion P: 2 &nbsp;·&nbsp; Ion Q: 2.8 &nbsp;·&nbsp; Atom R: 2.8.2',
         en:'Ion P: 2 &nbsp;·&nbsp; Ion Q: 2.8 &nbsp;·&nbsp; Atom R: 2.8.2'},
        {bm:'Ion P: 2.5 &nbsp;·&nbsp; Ion Q: 2.8.6 &nbsp;·&nbsp; Atom R: 2.8.8.6',
         en:'Ion P: 2.5 &nbsp;·&nbsp; Ion Q: 2.8.6 &nbsp;·&nbsp; Atom R: 2.8.8.6'},
        {bm:'Ion P: 2.8 &nbsp;·&nbsp; Ion Q: 2.8.8 &nbsp;·&nbsp; Atom R: 2.8.2',
         en:'Ion P: 2.8 &nbsp;·&nbsp; Ion Q: 2.8.8 &nbsp;·&nbsp; Atom R: 2.8.2'} ],
    a:1,
    w:{ bm:'Perhatikan bahagian mana yang <b>ion</b> dan mana yang <b>atom</b>. P (proton 3, litium) <b>melepaskan</b> 1 elektron → P⁺ mempunyai 2 elektron = <b>2</b>. Q (proton 8, oksigen) <b>menerima</b> 2 elektron → Q²⁻ mempunyai 10 = <b>2.8</b>. R (proton 12, magnesium) kekal sebagai <b>atom</b> → 12 elektron = <b>2.8.2</b>.',
        en:'Watch which ones are <b>ions</b> and which is an <b>atom</b>. P (proton number 3, lithium) <b>loses</b> 1 electron → P⁺ has 2 electrons = <b>2</b>. Q (proton number 8, oxygen) <b>gains</b> 2 electrons → Q²⁻ has 10 = <b>2.8</b>. R (proton number 12, magnesium) stays an <b>atom</b> → 12 electrons = <b>2.8.2</b>.' } },

  { n:24, topic:'RATE', img:'img/kimia/a777fc0816cc.webp',
    alt:{ bm:'Rajah 7: ketulan marmar di dalam kelalang kon berisi asid hidroklorik.',
          en:'Diagram 7: marble chips in a conical flask of hydrochloric acid.' },
    q:{ bm:'Rajah 7 menunjukkan susunan radas untuk menentukan kadar tindak balas. Apakah perubahan yang paling sesuai untuk menentukan kadar tindak balas tersebut?',
        en:'Diagram 7 shows the apparatus set-up to determine the rate of reaction. What is the most suitable change to determine the rate of reaction?' },
    o:[ {bm:'Jisim mendakan yang terbentuk',en:'Mass of precipitate formed'},
        {bm:'Kepekatan asid hidroklorik',en:'Concentration of hydrochloric acid'},
        {bm:'Isipadu gas yang dibebaskan',en:'Volume of gas produced'},
        {bm:'Saiz ketulan marmar',en:'Size of the marble chips'} ],
    a:2,
    w:{ bm:'CaCO₃ + 2HCl → CaCl₂ + H₂O + <b>CO₂</b>. Gas karbon dioksida yang dibebaskan boleh dikumpul dan diukur isipadunya pada selang masa tetap — itulah cara paling mudah mengukur kadar. Tiada mendakan terbentuk, dan saiz ketulan ialah <b>pemboleh ubah</b> yang mempengaruhi kadar, bukan ukuran kadar.',
        en:'CaCO₃ + 2HCl → CaCl₂ + H₂O + <b>CO₂</b>. The carbon dioxide released can be collected and its volume measured at fixed time intervals — the easiest way to follow the rate. No precipitate forms, and the chip size is a <b>variable</b> that affects the rate, not a measurement of it.' } },

  { n:25, topic:'CARBON', img:'img/kimia/b481f067f1e6.webp',
    alt:{ bm:'Rajah 8: bahan X ditambah ke dalam tabung uji berisi butanol dan C₂H₄O₂, kemudian dipanaskan.',
          en:'Diagram 8: substance X added to a test tube of butanol and C₂H₄O₂, then heated.' },
    q:{ bm:'Rajah 8 menunjukkan susunan radas bagi suatu tindak balas kimia. Antara berikut yang manakah bahan X dan hasil bagi tindak balas tersebut?',
        en:'Diagram 8 shows the set-up of apparatus for a chemical reaction. Which of the following is substance X and the product of the reaction?' },
    o:[ {bm:'Asid sulfurik pekat &nbsp;·&nbsp; C₃H₇COOC₂H₅',   en:'Concentrated sulphuric acid &nbsp;·&nbsp; C₃H₇COOC₂H₅'},
        {bm:'Asid fosforik pekat &nbsp;·&nbsp; C₃H₇COOC₂H₅',   en:'Concentrated phosphoric acid &nbsp;·&nbsp; C₃H₇COOC₂H₅'},
        {bm:'Asid fosforik pekat &nbsp;·&nbsp; CH₃COOC₄H₉',    en:'Concentrated phosphoric acid &nbsp;·&nbsp; CH₃COOC₄H₉'},
        {bm:'Asid sulfurik pekat &nbsp;·&nbsp; CH₃COOC₄H₉',    en:'Concentrated sulphuric acid &nbsp;·&nbsp; CH₃COOC₄H₉'} ],
    a:3,
    w:{ bm:'C₂H₄O₂ ialah asid etanoik, CH₃COOH. Alkohol + asid karboksilik → ester, dengan <b>asid sulfurik pekat</b> sebagai pemangkin (asid fosforik ialah pemangkin bagi penghidratan alkena, bukan pengesteran). Bahagian asil datang daripada asid (CH₃COO–) dan bahagian alkil daripada butanol (–C₄H₉) → <b>CH₃COOC₄H₉</b>, butil etanoat.',
        en:'C₂H₄O₂ is ethanoic acid, CH₃COOH. Alcohol + carboxylic acid → ester, with <b>concentrated sulphuric acid</b> as the catalyst (phosphoric acid catalyses the hydration of alkenes, not esterification). The acyl part comes from the acid (CH₃COO–) and the alkyl part from butanol (–C₄H₉) → <b>CH₃COOC₄H₉</b>, butyl ethanoate.' } },

  { n:26, topic:'THERMO', img:'img/kimia/f6f2451497a7.webp',
    alt:{ bm:'Rajah 9: Tindak balas A dengan hasil di bawah bahan tindak balas (ΔH negatif); Tindak balas B dengan hasil di atas bahan tindak balas (ΔH positif).',
          en:'Diagram 9: Reaction A with products below the reactants (negative ΔH); Reaction B with products above the reactants (positive ΔH).' },
    q:{ bm:'Rajah 9 menunjukkan gambar rajah aras tenaga bagi dua tindak balas yang berbeza. Antara yang berikut, yang manakah betul tentang tindak balas A dan tindak balas B?',
        en:'Diagram 9 shows energy level diagrams for two different reactions. Which of the following is correct about reaction A and reaction B?' },
    o:[ {bm:'A: Endotermik &nbsp;·&nbsp; B: Eksotermik', en:'A: Endothermic &nbsp;·&nbsp; B: Exothermic'},
        {bm:'A: Menyerap haba dari persekitaran &nbsp;·&nbsp; B: Membebaskan haba ke persekitaran',
         en:'A: Absorbs heat from the surroundings &nbsp;·&nbsp; B: Releases heat to the surroundings'},
        {bm:'A: Jumlah tenaga hasil lebih tinggi daripada bahan tindak balas &nbsp;·&nbsp; B: Jumlah tenaga hasil lebih rendah daripada bahan tindak balas',
         en:'A: Total energy of the products is higher than the reactants &nbsp;·&nbsp; B: Total energy of the products is lower than the reactants'},
        {bm:'A: Haba dibebaskan semasa pembentukan ikatan lebih besar daripada haba yang diserap untuk memutuskan ikatan &nbsp;·&nbsp; B: Haba diserap untuk memutuskan ikatan lebih besar daripada haba yang dibebaskan semasa pembentukan ikatan',
         en:'A: Heat released during bond formation is greater than the heat absorbed to break bonds &nbsp;·&nbsp; B: Heat absorbed to break bonds is greater than the heat released during bond formation'} ],
    a:3,
    w:{ bm:'Tindak balas A menunjukkan hasil <b>di bawah</b> bahan tindak balas, ΔH negatif → <b>eksotermik</b>. Tindak balas B sebaliknya → <b>endotermik</b>. Jadi A, B dan C semuanya terbalik. Hanya D betul: dalam A pembentukan ikatan membebaskan lebih banyak haba daripada yang diserap untuk memutuskan ikatan, dan dalam B keadaannya songsang.',
        en:'Reaction A shows the products <b>below</b> the reactants, ΔH negative → <b>exothermic</b>. Reaction B is the opposite → <b>endothermic</b>. So A, B and C all have it backwards. Only D is right: in A bond formation releases more heat than is absorbed breaking bonds, and in B it is the other way round.' } },

  { n:27, topic:'MOLE',
    q:{ bm:'Amani menjalankan eksperimen untuk menentukan formula empirik kuprum(II) oksida di dalam makmal. Semasa eksperimen sedang berjalan, aliran gas hidrogen tiba-tiba terhenti. Ramalkan apa yang akan berlaku.',
        en:'Amani is conducting an experiment to determine the empirical formula of copper(II) oxide in the laboratory. While the experiment is in progress, the flow of hydrogen gas suddenly stops. Predict what would happen.' },
    o:[ {bm:'Kuprum terbakar',en:'The copper burns'},
        {bm:'Air yang terhasil akan menyejat semula',en:'The water produced will evaporate again'},
        {bm:'Jisim kuprum yang terhasil menjadi lebih kecil',en:'The mass of copper produced becomes smaller'},
        {bm:'Kuprum yang terbentuk bertindak balas semula dengan oksigen',en:'The copper formed reacts again with oxygen'} ],
    a:3,
    w:{ bm:'Aliran hidrogen yang berterusan bukan sahaja menurunkan CuO — ia juga <b>menyingkirkan udara</b> daripada tabung. Sebaik sahaja aliran itu berhenti, udara masuk semula dan kuprum panas itu teroksida semula menjadi kuprum(II) oksida, jadi jisimnya <b>bertambah</b> (bukan berkurang seperti C).',
        en:'The steady hydrogen flow does more than reduce the CuO — it also <b>flushes air out</b> of the tube. The moment that flow stops, air gets back in and the hot copper is re-oxidised to copper(II) oxide, so its mass <b>increases</b> (not decreases, as C claims).' } },

  { n:28, topic:'BOND',
    q:{ bm:'Jadual 2 menunjukkan sifat fizik bagi bahan P dan bahan Q. Antara pernyataan berikut, yang manakah benar menerangkan bahan P dan bahan Q?'+
           '<table><tr><th>Bahan</th><th>Takat lebur (°C)</th><th>Takat didih (°C)</th><th>Konduksi: pepejal</th><th>Konduksi: leburan</th></tr>'+
           '<tr><td>P</td><td>714</td><td>1412</td><td>Tidak / No</td><td>Ya / Yes</td></tr>'+
           '<tr><td>Q</td><td>78</td><td>218</td><td>Tidak / No</td><td>Tidak / No</td></tr></table><span class="fig">JADUAL 2 · TABLE 2</span>'+
           '<br><b>I</b> Zarah bahan P ditarik oleh daya van der Waals manakala zarah bahan Q ditarik dengan daya elektrostatik'+
           '<br><b>II</b> Bahan P mengkonduksikan elektrik dalam keadaan leburan kerana mempunyai ion yang bebas bergerak manakala bahan Q tidak kerana tiada ion bebas bergerak'+
           '<br><b>III</b> Pada suhu bilik, bahan P wujud sebagai cecair manakala bahan Q wujud sebagai pepejal'+
           '<br><b>IV</b> Bahan P memerlukan haba yang lebih tinggi berbanding bahan Q untuk mengatasi daya tarikan antara zarah',
        en:'Table 2 shows the physical properties of substances P and Q. Which of the following statements correctly describe substances P and Q?'+
           '<table><tr><th>Substance</th><th>Melting point (°C)</th><th>Boiling point (°C)</th><th>Conducts: solid</th><th>Conducts: molten</th></tr>'+
           '<tr><td>P</td><td>714</td><td>1412</td><td>No</td><td>Yes</td></tr>'+
           '<tr><td>Q</td><td>78</td><td>218</td><td>No</td><td>No</td></tr></table><span class="fig">JADUAL 2 · TABLE 2</span>'+
           '<br><b>I</b> Particles in P are attracted by van der Waals forces while particles in Q are attracted by electrostatic forces'+
           '<br><b>II</b> P conducts electricity when molten because it has free moving ions while Q cannot because it has no free moving ions'+
           '<br><b>III</b> At room temperature P exists as a liquid while Q exists as a solid'+
           '<br><b>IV</b> P needs more heat than Q to overcome the forces of attraction between particles' },
    o:[ {bm:'I dan II',en:'I and II'}, {bm:'I dan III',en:'I and III'},
        {bm:'II dan IV',en:'II and IV'}, {bm:'III dan IV',en:'III and IV'} ],
    a:2,
    w:{ bm:'P mempunyai takat lebur tinggi dan mengkonduksi <b>hanya</b> dalam keadaan leburan → sebatian <b>ion</b>. Q mempunyai takat lebur rendah dan tidak mengkonduksi langsung → sebatian <b>kovalen mudah</b>. Maka I terbalik (P elektrostatik, Q van der Waals), dan III salah kerana takat lebur kedua-duanya melebihi suhu bilik — kedua-duanya pepejal. II dan IV betul.',
        en:'P has a high melting point and conducts <b>only</b> when molten → an <b>ionic</b> compound. Q has a low melting point and never conducts → a <b>simple covalent</b> compound. So I is reversed (P is electrostatic, Q is van der Waals), and III is wrong because both melting points are above room temperature — both are solids. II and IV are correct.' } },

  { n:29, topic:'INDUSTRY', img:'img/kimia/6b73eff698c6.webp',
    alt:{ bm:'Jadual 3: bahan X mendapat lekuk 0.1 cm dalam, bahan Y mendapat lekuk 0.5 cm dalam.',
          en:'Table 3: material X gets a 0.1 cm deep dent, material Y gets a 0.5 cm deep dent.' },
    q:{ bm:'Jadual 3 menunjukkan kedalaman lekuk selepas satu pemberat dijatuhkan ke atas permukaan aloi dan logam tulennya. Apakah X dan Y?',
        en:'Table 3 shows the depth of the dent after a weight is dropped on the surface of an alloy and its pure metal. What are X and Y?' },
    o:[ {bm:'X: Duralumin &nbsp;·&nbsp; Y: Besi', en:'X: Duralumin &nbsp;·&nbsp; Y: Iron'},
        {bm:'X: Besi &nbsp;·&nbsp; Y: Duralumin', en:'X: Iron &nbsp;·&nbsp; Y: Duralumin'},
        {bm:'X: Piuter &nbsp;·&nbsp; Y: Stanum',  en:'X: Pewter &nbsp;·&nbsp; Y: Tin'},
        {bm:'X: Stanum &nbsp;·&nbsp; Y: Piuter',  en:'X: Tin &nbsp;·&nbsp; Y: Pewter'} ],
    a:2,
    w:{ bm:'Lekuk X yang cetek (0.1 cm) bermakna X lebih <b>keras</b> → X ialah aloi; Y yang lembut ialah logam tulennya. Soalan menyebut “aloi <b>dan logam tulennya</b>”, jadi pasangan itu mesti berkaitan: piuter ialah aloi <b>stanum</b> ✓. Duralumin ialah aloi aluminium, bukan besi — jadi A dan B tidak berpasangan, dan D terbalik.',
        en:'X’s shallow dent (0.1 cm) means X is <b>harder</b> → X is the alloy; the softer Y is its pure metal. The question says “an alloy <b>and its pure metal</b>”, so the pair must be related: pewter is an alloy of <b>tin</b> ✓. Duralumin is an aluminium alloy, not an iron one — so A and B are not a matching pair, and D is reversed.' } },

  { n:30, topic:'INTRO', img:'img/kimia/0cbc9c6e6dfd.webp',
    alt:{ bm:'Rajah 10: proses rawatan air sisa dengan lokasi berlabel A, B, C dan D.',
          en:'Diagram 10: the wastewater treatment process with locations labelled A, B, C and D.' },
    q:{ bm:'Rajah 10 menunjukkan proses rawatan air sisa. Antara lokasi A, B, C dan D, di manakah berlakunya proses elektro-penggumpalan?',
        en:'Diagram 10 shows the wastewater treatment process. Among locations A, B, C and D, where does the electrocoagulation process occur?' },
    o:[ {bm:'Lokasi A',en:'Location A'}, {bm:'Lokasi B',en:'Location B'},
        {bm:'Lokasi C',en:'Location C'}, {bm:'Lokasi D',en:'Location D'} ],
    a:1,
    w:{ bm:'Elektro-penggumpalan ialah peringkat <b>rawatan</b> di dalam loji: arus elektrik melalui elektrod logam menyebabkan zarah terampai bergumpal supaya boleh dimendapkan. Ia berlaku di dalam tangki loji (B), bukan di sumber sisa masuk (A), bukan di titik pelepasan efluen (C), dan bukan di pengumpulan enapcemar (D).',
        en:'Electrocoagulation is a <b>treatment</b> stage inside the plant: an electric current through metal electrodes makes suspended particles clump so they can settle out. It happens in the plant’s tanks (B), not at the waste inlet (A), not at the effluent discharge point (C), and not at sludge collection (D).' } },

  { n:31, topic:'CARBON',
    note:'Source PDF prints only options A, B and C for this question — option D is missing from the paper.',
    q:{ bm:'Puan Siti memerlukan bahan api yang tidak menyebabkan permukaan periuk barunya menjadi hitam. Antara bahan berikut, apakah sebatian yang sesuai digunakan sebagai bahan api untuk mengurangkan permukaan periuk menjadi hitam?<br><span class="fig">[Jisim atom relatif: H = 1, C = 12, O = 16]</span>',
        en:'Puan Siti needs a fuel which does not turn the surface of her new pot black. Which compound is suitable to be used as fuel to reduce the blackening of the pot surface?<br><span class="fig">[Relative atomic mass: H = 1, C = 12, O = 16]</span>' },
    o:[ {bm:'Butana',en:'Butane'}, {bm:'Butena',en:'Butene'}, {bm:'Butuna',en:'Butyne'} ],
    a:0,
    w:{ bm:'Jelaga hitam bermakna pembakaran <b>tidak lengkap</b>, dan itu berlaku apabila peratus karbon dalam bahan api lebih tinggi. Butana C₄H₁₀ (82.8% C) ialah alkana <b>tepu</b> dengan kandungan karbon paling rendah antara ketiga-tiganya; butena C₄H₈ (85.7%) dan butuna C₄H₆ (88.9%) lebih tinggi lagi, jadi lebih banyak jelaga.',
        en:'Black soot means <b>incomplete</b> combustion, which happens when the fuel has a higher percentage of carbon. Butane C₄H₁₀ (82.8% C) is the <b>saturated</b> alkane with the lowest carbon content of the three; butene C₄H₈ (85.7%) and butyne C₄H₆ (88.9%) are higher still, so they soot more.' } },

  { n:32, topic:'RATE',
    q:{ bm:'Ali menjalankan dua set eksperimen bagi menentukan kadar tindak balas seperti maklumat dalam Jadual 4. Apakah nilai Y?'+
           '<table><tr><th>Eksperimen</th><th>Bahan tindak balas</th><th>Suhu / °C</th><th>Jumlah isipadu gas hidrogen / cm³</th></tr>'+
           '<tr><td>I</td><td>1.2 g magnesium + 100 cm³ asid sulfurik 0.5 mol dm⁻³</td><td>30.0</td><td>1200</td></tr>'+
           '<tr><td>II</td><td>1.2 g magnesium + 200 cm³ asid sulfurik 0.5 mol dm⁻³</td><td>60.0</td><td>Y</td></tr></table><span class="fig">JADUAL 4 · TABLE 4</span>',
        en:'Ali carried out two sets of experiments to determine the rate of reaction as in Table 4. What is the value of Y?'+
           '<table><tr><th>Experiment</th><th>Reactants</th><th>Temperature / °C</th><th>Total volume of hydrogen gas / cm³</th></tr>'+
           '<tr><td>I</td><td>1.2 g magnesium + 100 cm³ sulphuric acid 0.5 mol dm⁻³</td><td>30.0</td><td>1200</td></tr>'+
           '<tr><td>II</td><td>1.2 g magnesium + 200 cm³ sulphuric acid 0.5 mol dm⁻³</td><td>60.0</td><td>Y</td></tr></table><span class="fig">JADUAL 4 · TABLE 4</span>' },
    o:[ {bm:'450 cm³',en:'450 cm³'}, {bm:'600 cm³',en:'600 cm³'},
        {bm:'1200 cm³',en:'1200 cm³'}, {bm:'2400 cm³',en:'2400 cm³'} ],
    a:2,
    w:{ bm:'Kedua-dua eksperimen menggunakan <b>jisim magnesium yang sama</b> (1.2 g = 0.05 mol), dan dalam Eksperimen II asid berlebihan — jadi magnesium ialah bahan <b>penghad</b> dalam kedua-duanya. Jumlah isipadu gas ditentukan sepenuhnya oleh bahan penghad, jadi Y = 1200 cm³. Suhu yang lebih tinggi hanya menjadikan tindak balas <b>lebih cepat</b>, bukan menghasilkan lebih banyak gas.',
        en:'Both experiments use the <b>same mass of magnesium</b> (1.2 g = 0.05 mol), and in Experiment II the acid is in excess — so magnesium is the <b>limiting</b> reactant in both. The total gas volume is fixed entirely by the limiting reactant, so Y = 1200 cm³. The higher temperature only makes the reaction <b>faster</b>, it does not produce more gas.' } },

  { n:33, topic:'CONSUMER',
    q:{ bm:'Ammar merupakan pengusaha produk kosmetik. Pelembap wajah terbaharu yang dikeluarkan oleh syarikatnya kurang mendapat sambutan kerana teksturnya yang kering. Apakah tindakan yang perlu dilakukan oleh Ammar bagi mengatasi masalah tersebut?',
        en:'Ammar is a cosmetics entrepreneur. The latest facial moisturiser released by his company is not well received because of its dry texture. What action does Ammar need to take to overcome this problem?' },
    o:[ {bm:'Tingkatkan kandungan air',en:'Increase the water content'},
        {bm:'Tambah ferum(III) oksida',en:'Add iron(III) oxide'},
        {bm:'Tambah natrium laktat',en:'Add sodium lactate'},
        {bm:'Tambah minyak pati',en:'Add essential oil'} ],
    a:2,
    w:{ bm:'Natrium laktat ialah <b>humektan</b> — ia menarik dan mengunci lembapan pada kulit, jadi ia menyelesaikan tekstur kering itu. Menambah air sahaja tidak kekal (air menyejat); ferum(III) oksida hanyalah pewarna, dan minyak pati hanyalah pewangi.',
        en:'Sodium lactate is a <b>humectant</b> — it draws in and holds moisture at the skin, which is exactly what a dry texture needs. Simply adding water does not last (it evaporates); iron(III) oxide is only a colourant, and essential oil is only a fragrance.' } },

  { n:34, topic:'RATE',
    q:{ bm:'Persamaan kimia di bawah menunjukkan tindak balas penguraian hidrogen peroksida dalam aktiviti menghasilkan “ubat gigi gajah”.<br><span class="fig">2 H₂O₂ &nbsp;—(PbO₂)→&nbsp; 2 H₂O + O₂</span><br>Antara berikut, manakah benar tentang plumbum(IV) oksida dalam tindak balas ini?',
        en:'The chemical equation below shows the decomposition of hydrogen peroxide in the “elephant toothpaste” activity.<br><span class="fig">2 H₂O₂ &nbsp;—(PbO₂)→&nbsp; 2 H₂O + O₂</span><br>Which of the following statements is correct about lead(IV) oxide in this reaction?' },
    o:[ {bm:'Meningkatkan hasil tindak balas',en:'Increases the yield of the reaction'},
        {bm:'Menghasilkan larutan yang berwarna',en:'Produces a coloured solution'},
        {bm:'Memperlahankan tindak balas penguraian',en:'Slows down the decomposition reaction'},
        {bm:'Meningkatkan kadar tindak balas penguraian',en:'Increases the rate of the decomposition reaction'} ],
    a:3,
    w:{ bm:'PbO₂ ditulis <b>di atas anak panah</b>, bukan sebagai bahan tindak balas — itu tandanya ia ialah <b>pemangkin</b>. Pemangkin menyediakan laluan alternatif dengan tenaga pengaktifan lebih rendah, jadi ia <b>mempercepatkan</b> tindak balas tanpa mengubah kuantiti hasil.',
        en:'PbO₂ is written <b>above the arrow</b>, not as a reactant — that marks it as a <b>catalyst</b>. A catalyst provides an alternative path with a lower activation energy, so it <b>speeds up</b> the reaction without changing how much product forms.' } },

  { n:35, topic:'ACID',
    note:'The paper prints the molar mass unit as "84 mol g⁻¹"; it should read 84 g mol⁻¹.',
    q:{ bm:'Sebuah botol berisi 450 cm³ asid H₂Z 8 mol dm⁻³ telah jatuh dan pecah di atas lantai makmal. Serbuk penaik, NaHCO₃ boleh digunakan untuk meneutralkan asid yang tumpah seperti persamaan di bawah. Hitung jisim minimum serbuk penaik yang diperlukan untuk meneutralkan asid tersebut.<br><span class="fig">H₂Z + 2NaHCO₃ → Na₂Z + 2CO₂ + 2H₂O<br>[Jisim molar serbuk penaik: 84 g mol⁻¹]</span>',
        en:'A bottle containing 450 cm³ of 8 mol dm⁻³ H₂Z acid has fallen and broken on the laboratory floor. Baking powder, NaHCO₃, can be used to neutralise the spilled acid as in the equation below. Calculate the minimum mass of baking powder needed to neutralise the acid.<br><span class="fig">H₂Z + 2NaHCO₃ → Na₂Z + 2CO₂ + 2H₂O<br>[Molar mass of baking powder: 84 g mol⁻¹]</span>' },
    o:[ {bm:'0.1680 kg',en:'0.1680 kg'}, {bm:'0.3024 kg',en:'0.3024 kg'},
        {bm:'0.3600 kg',en:'0.3600 kg'}, {bm:'0.6048 kg',en:'0.6048 kg'} ],
    a:3,
    w:{ bm:'Mol H₂Z = 0.450 dm³ × 8 = <b>3.6 mol</b>. Nisbah dalam persamaan ialah 1 : <b>2</b>, jadi NaHCO₃ = 7.2 mol. Jisim = 7.2 × 84 = 604.8 g = <b>0.6048 kg</b>. Jawapan 0.3024 kg ialah perangkap bagi yang terlupa nisbah 2.',
        en:'Moles of H₂Z = 0.450 dm³ × 8 = <b>3.6 mol</b>. The equation ratio is 1 : <b>2</b>, so NaHCO₃ = 7.2 mol. Mass = 7.2 × 84 = 604.8 g = <b>0.6048 kg</b>. The 0.3024 kg option is the trap for forgetting the factor of 2.' } },

  { n:36, topic:'POLYMER', img:'img/kimia/c2ea0bc5ec67.webp',

    w:{ bm:'Bahagikan setiap peratus dengan jisim atom relatif: C 78.95/12 = 6.58, H 10.53/1 = 10.53, O 10.52/16 = 0.658. Bahagikan dengan yang terkecil (0.658): C 10, H 16, O 1 → formula empirik C₁₀H₁₆O, JMR = 120 + 16 + 16 = <b>152</b>, tepat sama dengan JMR yang diberi — jadi formula molekul juga C₁₀H₁₆O.',
