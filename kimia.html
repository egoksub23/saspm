  { n:22, topic:'PTABLE',
    q:{ bm:'Rajah 7 menunjukkan kedudukan unsur P dan Q di dalam Jadual Berkala Unsur: P berada di Kumpulan 2, Q berada di Kumpulan 17. Manakah antara berikut merupakan formula kimia bagi sebatian yang terbentuk apabila unsur P bertindak balas dengan unsur Q?',
        en:'Diagram 7 shows the position of element P and Q in the Periodic Table of Elements: P is in Group 2, Q is in Group 17. Which of the following is the formula of compound formed when element P reacts with element Q?' },
    img:'img/kimia/eb3bb07aee27.webp',
    alt:{ bm:'Jadual berkala terpotong: P di lajur kedua (Kumpulan 2), Q di lajur kedua terakhir blok kanan (Kumpulan 17)', en:'Truncated periodic table: P in the second column (Group 2), Q in the second-to-last column of the right block (Group 17)' },
    o:[ {bm:'PQ',   en:'PQ'},
        {bm:'P₂Q',  en:'P₂Q'},
        {bm:'PQ₂',  en:'PQ₂'},
        {bm:'P₂Q₃', en:'P₂Q₃'} ],
    a:2,
    w:{ bm:'P (Kumpulan 2) membentuk ion <b>P²⁺</b>; Q (Kumpulan 17) membentuk ion <b>Q⁻</b>. Cas mesti seimbang: perlukan <b>2 ion Q⁻</b> bagi setiap P²⁺ → <b>PQ₂</b> ✓.',
        en:'P (Group 2) forms a <b>P²⁺</b> ion; Q (Group 17) forms a <b>Q⁻</b> ion. Charges must balance: <b>2 Q⁻</b> ions are needed for every P²⁺ → <b>PQ₂</b> ✓.' } },

  { n:23, topic:'ACID',
    q:{ bm:'Pernyataan yang manakah merujuk kepada asid lemah?',
        en:'Which of the following statements refers to weak acid?' },
    o:[ {bm:'Asid yang sangat cair',                             en:'A highly diluted acid'},
        {bm:'Asid yang sangat mengakis',                         en:'A highly corrosive acid'},
        {bm:'Asid mempunyai nilai pH yang paling rendah',        en:'Acid with the lowest pH value'},
        {bm:'Asid yang menghasilkan kepekatan ion hidrogen yang rendah di dalam air', en:'Acid that produces low concentration of hydrogen ion in water'} ],
    a:3,
    w:{ bm:'Asid <b>lemah</b> mengion <b>separa</b> dalam air, menghasilkan <b>kepekatan H⁺ yang rendah</b> berbanding asid kuat pada kepekatan sama ✓. "Cair" (A) merujuk kepada kepekatan, bukan kekuatan — konsep yang berbeza sama sekali.',
        en:'A <b>weak</b> acid ionises only <b>partially</b> in water, producing a <b>low H⁺ concentration</b> compared to a strong acid at the same concentration ✓. "Dilute" (A) refers to concentration, not strength — an entirely different concept.' } },

  { n:24, topic:'POLYMER',
    q:{ bm:'Polipropena ialah satu polimer sintetik. Apakah nama monomer bagi polimer ini?',
        en:'Polypropene is a synthetic polymer. What is the name of the monomer for this polymer?' },
    o:[ {bm:'Etena',      en:'Ethene'},
        {bm:'Propena',    en:'Propene'},
        {bm:'Isoprena',   en:'Isoprene'},
        {bm:'Asid amino', en:'Amino acid'} ],
    a:1,
    w:{ bm:'<b>Polipropena</b> terbentuk daripada monomer <b>propena</b> ✓. Etena memberi polietena; isoprena memberi getah asli; asid amino memberi protein.',
        en:'<b>Polypropene</b> is formed from the monomer <b>propene</b> ✓. Ethene gives polyethene; isoprene gives natural rubber; amino acid gives protein.' } },

  { n:25, topic:'RATE',
    q:{ bm:'Bagaimanakah peningkatan suhu mempengaruhi pergerakan zarah-zarah bahan tindak balas?',
        en:'How does an increase in temperature affect the movement of reactant particles?' },
    o:[ {bm:'Zarah-zarah kehilangan tenaga kinetik',                 en:'The particles lose kinetic energy'},
        {bm:'Zarah-zarah bergerak dengan lebih laju',                en:'The particles move at a higher speed'},
        {bm:'Zarah-zarah menjadi lebih besar dan berat',             en:'The particles become larger and heavier'},
        {bm:'Zarah-zarah berhenti bergerak apabila mencapai suhu optimum', en:'The particles stop moving when they reach the optimum temperature'} ],
    a:1,
    w:{ bm:'Suhu yang lebih tinggi memberi zarah lebih <b>tenaga kinetik</b> — zarah <b>bergerak lebih laju</b> ✓, mengakibatkan perlanggaran lebih kerap dan lebih bertenaga.',
        en:'A higher temperature gives particles more <b>kinetic energy</b> — they <b>move at a higher speed</b> ✓, causing more frequent, more energetic collisions.' } },

  { n:26, topic:'REDOX',
    q:{ bm:'Rajah 8 menunjukkan logam M bertindak balas dengan asid hidroklorik untuk menghasilkan garam dan gas hidrogen. Apakah tindak balas yang berlaku pada logam M?',
        en:'Diagram 8 shows metal M reacts with hydrochloric acid to produce salt and hydrogen gas. What is the reaction that occurs at metal M?' },
    o:[ {bm:'Penurunan',    en:'Reduction'},
        {bm:'Peleburan',    en:'Melting'},
        {bm:'Pemendakan',   en:'Precipitation'},
        {bm:'Pengoksidaan', en:'Oxidation'} ],
    a:3,
    w:{ bm:'M → M²⁺ + 2e⁻ — logam <b>membebaskan elektron</b>, jadi ia <b>dioksidakan</b> ✓. Gas hidrogen terbentuk melalui penurunan ion H⁺ pada permukaan logam, tetapi logam itu sendiri mengalami pengoksidaan.',
        en:'M → M²⁺ + 2e⁻ — the metal <b>loses electrons</b>, so it is <b>oxidised</b> ✓. Hydrogen gas forms via the reduction of H⁺ ions at the metal surface, but the metal itself undergoes oxidation.' } },

  { n:27, topic:'CONSUMER',
    q:{ bm:'Sekumpulan murid pengakap pergi berkhemah di tepi pantai. Mereka perlu menggunakan air laut untuk mencuci pakaian yang terkena minyak. Bahan manakah yang sesuai untuk pencucian yang berkesan?',
        en:'A group of scouts went camping by the seaside. They needed to use seawater to wash clothes that were stained with oil. Which substance is suitable for an effective cleaning?' },
    o:[ {bm:'Sabun',              en:'Soap'},
        {bm:'Antiseptik',         en:'Antiseptic'},
        {bm:'Detergen',           en:'Detergent'},
        {bm:'Natrium perborat',   en:'Sodium perborate'} ],
    a:2,
    w:{ bm:'Air laut mengandungi banyak ion Mg²⁺/Ca²⁺ ("air liat"). <b>Detergen</b> tidak membentuk kekat dengan ion-ion ini, jadi ia tetap berkesan ✓ — berbeza dengan sabun, yang membentuk kekat tak larut dalam air liat/masin dan kehilangan keberkesanannya.',
        en:'Seawater is rich in Mg²⁺/Ca²⁺ ions ("hard water"). <b>Detergent</b> does not form scum with these ions, so it stays effective ✓ — unlike soap, which forms an insoluble scum in hard/salty water and loses its cleaning power.' } },

  { n:28, topic:'ACID',
    q:{ bm:'Jadual 2 menunjukkan maklumat tentang dua jenis larutan, kedua-duanya berkepekatan 1.0 mol dm⁻³: asid hidroklorik dan asid etanoik. Antara berikut, yang manakah benar tentang dua jenis larutan itu?<br>I&nbsp;&nbsp;Nilai pH bagi asid hidroklorik lebih rendah daripada asid etanoik<br>II&nbsp;&nbsp;Darjah penceraian asid etanoik lebih rendah daripada asid hidroklorik<br>III&nbsp;&nbsp;Kepekatan ion hidrogen, H⁺ lebih tinggi dalam asid etanoik<br>IV&nbsp;&nbsp;Asid etanoik adalah asid kuat manakala asid hidroklorik adalah asid lemah',
        en:'Table 2 shows information for two solutions, both at 1.0 mol dm⁻³ concentration: hydrochloric acid and ethanoic acid. Which of the following is correct about the two solutions?<br>I&nbsp;&nbsp;The pH value of hydrochloric acid is lower than ethanoic acid<br>II&nbsp;&nbsp;The degree of dissociation of ethanoic acid is lower than hydrochloric acid<br>III&nbsp;&nbsp;The concentration of hydrogen, H⁺ ion is higher in ethanoic acid<br>IV&nbsp;&nbsp;Ethanoic acid is a strong acid while hydrochloric acid is a weak acid' },
    o:[ {bm:'I dan II',   en:'I and II'},
        {bm:'II dan IV',  en:'II and IV'},
        {bm:'I dan III',  en:'I and III'},
        {bm:'III dan IV', en:'III and IV'} ],
    a:0,
    w:{ bm:'HCl (kuat) mengion <b>sepenuhnya</b>, memberi [H⁺] tinggi dan pH <b>lebih rendah</b> daripada asid etanoik (lemah, mengion separa) — I ✓. Darjah penceraian asid etanoik memang <b>lebih rendah</b> daripada HCl — II ✓. III dan IV bertentangan dengan fakta ini (HCl, bukan etanoik, ada [H⁺] lebih tinggi; etanoik lemah, HCl kuat — terbalik).',
        en:'HCl (strong) ionises <b>completely</b>, giving a high [H⁺] and a <b>lower</b> pH than ethanoic acid (weak, partially ionised) — I ✓. Ethanoic acid’s degree of dissociation is indeed <b>lower</b> than HCl’s — II ✓. III and IV contradict this (HCl, not ethanoic acid, has the higher [H⁺]; ethanoic is weak and HCl is strong — the reverse of what IV claims).' } },

  { n:29, topic:'MOLE',
    q:{ bm:'3.25 g zink bertindak balas dengan 0.025 mol asid nitrik untuk membentuk zink nitrat sebagai salah satu hasil tindak balas. Tentukan jisim zink yang tinggal selepas tindak balas. [Jisim atom relatif: Zn = 65]',
        en:'3.25 g of zinc reacts with 0.025 mol of nitric acid to form zinc nitrate as one of the reaction products. Determine the mass of zinc remaining after the reaction. [Relative atomic mass: Zn = 65]' },
    o:[ {bm:'0.81 g', en:'0.81 g'},
        {bm:'1.63 g', en:'1.63 g'},
        {bm:'2.44 g', en:'2.44 g'},
        {bm:'3.25 g', en:'3.25 g'} ],
    a:2,
    note:'Terjemahan Inggeris di sumber tersalah cetak "mass of zinc nitrate remaining" — versi BM dan pengiraan berdasarkan skema kedua-duanya jelas bermaksud jisim ZINK (logam) yang tinggal.',
    w:{ bm:'Persamaan: Zn + 2HNO₃ → Zn(NO₃)₂ + H₂. Mol Zn mula = 3.25 ÷ 65 = <b>0.05 mol</b>. HNO₃ ialah <b>penghad</b>: mol Zn bertindak balas = 0.025 ÷ 2 = 0.0125 mol. Zn tinggal = 0.05 − 0.0125 = 0.0375 mol → jisim = 0.0375 × 65 = <b>2.44 g</b> ✓.',
        en:'Equation: Zn + 2HNO₃ → Zn(NO₃)₂ + H₂. Initial moles Zn = 3.25 ÷ 65 = <b>0.05 mol</b>. HNO₃ is the <b>limiting</b> reactant: moles Zn reacted = 0.025 ÷ 2 = 0.0125 mol. Zn remaining = 0.05 − 0.0125 = 0.0375 mol → mass = 0.0375 × 65 = <b>2.44 g</b> ✓.' } },

  { n:30, topic:'RATE',
    q:{ bm:'Jadual 3 menunjukkan isi padu gas yang dikumpul pada selang masa tertentu: 0 s → 0.0 cm³, 30 s → 15.0 cm³, 60 s → 25.0 cm³, 90 s → 32.0 cm³, 120 s → 32.0 cm³, 150 s → 32.0 cm³. Hitungkan kadar tindak balas purata dalam minit pertama.',
        en:'Table 3 shows the volume of gas collected at specific time intervals: 0 s → 0.0 cm³, 30 s → 15.0 cm³, 60 s → 25.0 cm³, 90 s → 32.0 cm³, 120 s → 32.0 cm³, 150 s → 32.0 cm³. Calculate the average rate of reaction for the first minute.' },
    o:[ {bm:'0.12 cm³ s⁻¹', en:'0.12 cm³ s⁻¹'},
        {bm:'0.27 cm³ s⁻¹', en:'0.27 cm³ s⁻¹'},
        {bm:'0.36 cm³ s⁻¹', en:'0.36 cm³ s⁻¹'},
        {bm:'0.42 cm³ s⁻¹', en:'0.42 cm³ s⁻¹'} ],
    a:3,
    w:{ bm:'Kadar purata minit pertama = perubahan isi padu ÷ masa = (25.0 − 0.0) ÷ 60 = <b>0.42 cm³ s⁻¹</b> ✓.',
        en:'Average rate for the first minute = change in volume ÷ time = (25.0 − 0.0) ÷ 60 = <b>0.42 cm³ s⁻¹</b> ✓.' } },

  { n:31, topic:'ACID',
    q:{ bm:'Rajah 9 menunjukkan carta alir beberapa tindak balas ke atas garam V: garam V dipanaskan menghasilkan pepejal W + gas perang + gas X tanpa warna; larutan garam V + larutan Na₂SO₄ → mendakan putih Y; larutan garam V + larutan NH₃ berlebihan → mendakan putih tidak larut. Jadual di bawah menunjukkan empat kemungkinan padanan. Berdasarkan keputusan eksperimen, apakah garam V, pepejal W dan mendakan Y?',
        en:'Diagram 9 shows a flow chart for a series of reactions on salt V: salt V is heated to produce solid W + brown gas + colourless gas X; salt V solution + Na₂SO₄ solution → white precipitate Y; salt V solution + excess NH₃ solution → white precipitate that does not dissolve. The table below shows four possible matches. Based on the results of the experiment, what are salt V, solid W and precipitate Y?' },
    img:'img/kimia/2c7a1ef5a3d3.webp',
    alt:{ bm:'Carta alir: Garam V dipanaskan → Pepejal W + gas perang + gas X tanpa warna; Garam V + air → larutan garam V, yang bercabang ke Na₂SO₄ (mendakan putih Y) dan NH₃ berlebihan (mendakan putih tak larut)', en:'Flow chart: Salt V heated → Solid W + brown gas + colourless gas X; Salt V + water → salt solution V, which branches to Na₂SO₄ (white precipitate Y) and excess NH₃ (insoluble white precipitate)' },
    o:[ {bm:'V: PbCO₃ · W: kuning panas/putih sejuk · Y: PbSO₄',      en:'V: PbCO₃ · W: yellow hot/white cool · Y: PbSO₄'},
        {bm:'V: Pb(NO₃)₂ · W: perang panas/kuning sejuk · Y: PbSO₄', en:'V: Pb(NO₃)₂ · W: brown hot/yellow cool · Y: PbSO₄'},
        {bm:'V: ZnCO₃ · W: kuning panas/putih sejuk · Y: ZnSO₄',      en:'V: ZnCO₃ · W: yellow hot/white cool · Y: ZnSO₄'},
        {bm:'V: Zn(NO₃)₂ · W: perang panas/kuning sejuk · Y: ZnSO₄', en:'V: Zn(NO₃)₂ · W: brown hot/yellow cool · Y: ZnSO₄'} ],
    a:1,
    w:{ bm:'Gas perang + gas tanpa warna daripada pemanasan bermakna V ialah <b>nitrat</b> (2M(NO₃)₂ → 2MO + 4NO₂ + O₂) — karbonat hanya membebaskan CO₂, mengesampingkan A dan C. Mendakan putih dengan Na₂SO₄ memerlukan kation yang membentuk <b>sulfat tak terlarutkan</b> — hanya <b>Pb²⁺</b> memberi PbSO₄ tak larut (ZnSO₄ <b>larut</b>, jadi Zn tidak akan memberi mendakan), mengesampingkan D. Jadi V = <b>Pb(NO₃)₂</b> ✓.',
        en:'A brown gas plus a colourless gas from heating means V is a <b>nitrate</b> (2M(NO₃)₂ → 2MO + 4NO₂ + O₂) — carbonates release only CO₂, ruling out A and C. A white precipitate with Na₂SO₄ needs a cation that forms an <b>insoluble sulphate</b> — only <b>Pb²⁺</b> gives insoluble PbSO₄ (ZnSO₄ is <b>soluble</b>, so zinc would give no precipitate at all), ruling out D. So V = <b>Pb(NO₃)₂</b> ✓.' } },

  { n:32, topic:'RATE',
    q:{ bm:'Seorang pelajar ingin mempercepatkan tindak balas antara marmar dan asid. Antara berikut, yang manakah aplikasi yang betul?',
        en:'A student wants to speed up the reaction between marble and acid. Which of the following is the correct application?' },
    o:[ {bm:'Menggunakan ketulan marmar yang besar',              en:'Using large marble lumps'},
        {bm:'Merendam marmar dalam air sebelum tindak balas',     en:'Soaking the marble in water before the reaction'},
        {bm:'Menggunakan asid yang mempunyai kepekatan lebih tinggi', en:'Using an acid that has a higher concentration'},
        {bm:'Menjalankan eksperimen di dalam bekas yang diletakkan di dalam ais', en:'Conducting the experiment in a container placed in ice'} ],
    a:2,
    w:{ bm:'<b>Kepekatan asid lebih tinggi</b> memberi lebih banyak ion H⁺ per unit isi padu — lebih banyak perlanggaran berkesan, kadar bertambah ✓. Ketulan besar (A) mengurangkan luas permukaan; merendam dalam air (B) tidak menjejaskan kadar; ais (D) menurunkan suhu, melambatkan tindak balas.',
        en:'A <b>higher acid concentration</b> means more H⁺ ions per unit volume — more effective collisions, faster rate ✓. Large lumps (A) reduce surface area; soaking in water (B) has no effect on rate; ice (D) lowers temperature, slowing the reaction.' } },

  { n:33, topic:'THERMO',
    q:{ bm:'Persamaan termokimia di bawah menunjukkan tindak balas antara logam zink yang berlebihan dan larutan kuprum(II) sulfat: Zn + CuSO₄ → Cu + ZnSO₄, ΔH = −210.0 kJ mol⁻¹. Jika bacaan awal suhu larutan kuprum(II) sulfat ialah 29°C, berapakah suhu tertinggi bagi tindak balas di atas jika 100 cm³ larutan kuprum(II) sulfat 0.5 mol dm⁻³ digunakan? [Muatan haba tentu larutan = 4.2 J g⁻¹°C⁻¹]',
        en:'The thermochemical equation below shows the reaction between excess zinc metal and copper(II) sulphate solution: Zn + CuSO₄ → Cu + ZnSO₄, ΔH = −210.0 kJ mol⁻¹. If the initial temperature of copper(II) sulphate solution is 29°C, what is the highest temperature for the above experiment reaction if 100 cm³ of 0.5 mol dm⁻³ copper(II) sulphate solution was used? [Specific heat capacity = 4.2 J g⁻¹°C⁻¹]' },
    o:[ {bm:'25.0°C', en:'25.0°C'},
        {bm:'41.0°C', en:'41.0°C'},
        {bm:'54.0°C', en:'54.0°C'},
        {bm:'85.0°C', en:'85.0°C'} ],
    a:2,
    w:{ bm:'Mol CuSO₄ = 0.1 × 0.5 = 0.05 mol. Haba dibebaskan = 0.05 × 210 000 = <b>10 500 J</b>. ΔT = 10 500 ÷ (100 × 4.2) = <b>25°C</b>. Suhu tertinggi = 29 + 25 = <b>54.0°C</b> ✓.',
        en:'Moles CuSO₄ = 0.1 × 0.5 = 0.05 mol. Heat released = 0.05 × 210,000 = <b>10,500 J</b>. ΔT = 10,500 ÷ (100 × 4.2) = <b>25°C</b>. Highest temperature = 29 + 25 = <b>54.0°C</b> ✓.' } },

  { n:34, topic:'CARBON',
    q:{ bm:'Rajah 10 menunjukkan carta alir penukaran sebatian X yang mempunyai 3 atom karbon: sebatian X bertindak balas dengan larutan kalium dikromat(VI) berasid menghasilkan sebatian Y; sebatian Y bertindak balas dengan butanol dengan kehadiran asid sulfurik pekat menghasilkan sebatian Z. Apakah nama bagi sebatian X, Y dan Z?',
        en:'Diagram 10 shows a flow chart for the conversion of compound X, which has 3 carbon atoms: compound X reacts with acidified potassium dichromate(VI) solution to produce compound Y; compound Y reacts with butanol in the presence of concentrated sulphuric acid to produce compound Z. What are the names of compound X, Y and Z?' },
    o:[ {bm:'X: Propanol · Y: Asid propanoik · Z: Butil propanoat', en:'X: Propanol · Y: Propanoic acid · Z: Butyl propanoate'},
        {bm:'X: Propanol · Y: Asid propanoik · Z: Propil butanoat', en:'X: Propanol · Y: Propanoic acid · Z: Propyl butanoate'},
        {bm:'X: Propena · Y: Asid propanoik · Z: Butil propanoat',  en:'X: Propene · Y: Propanoic acid · Z: Butyl propanoate'},
        {bm:'X: Propanol · Y: Propena · Z: Butil propanoat',        en:'X: Propanol · Y: Propene · Z: Butyl propanoate'} ],
    a:0,
    w:{ bm:'Pengoksidaan berasid dikromat(VI) menukar alkohol primer kepada asid karboksilik: X = <b>propanol</b> → Y = <b>asid propanoik</b> ✓. Y (asid, 3 karbon) + butanol (alkohol, 4 karbon) → ester "butil propanoat": Z = <b>butil propanoat</b> ✓ (bahagian alkohol memberi nama "butil", bahagian asid memberi "propanoat").',
        en:'Oxidation with acidified dichromate(VI) turns a primary alcohol into a carboxylic acid: X = <b>propanol</b> → Y = <b>propanoic acid</b> ✓. Y (the acid, 3 carbons) + butanol (the alcohol, 4 carbons) → the ester "butyl propanoate": Z = <b>butyl propanoate</b> ✓ (the alcohol part names "butyl", the acid part names "propanoate").' } },

  { n:35, topic:'THERMO',
    q:{ bm:'Rajah 11 menunjukkan rajah aras tenaga bagi tindak balas antara natrium hidroksida dan asid hidroklorik: NaOH(ak) + HCl(ak) pada aras tenaga lebih tinggi, ΔH = X kJ mol⁻¹, NaCl(ak) + H₂O(ce) pada aras tenaga lebih rendah. Antara yang berikut, pernyataan manakah yang menerangkan rajah aras tenaga tersebut?',
        en:'Diagram 11 shows the energy level diagram for the reaction between sodium hydroxide and hydrochloric acid: NaOH(aq) + HCl(aq) at a higher energy level, ΔH = X kJ mol⁻¹, NaCl(aq) + H₂O(l) at a lower energy level. Which of the following statements explains the energy level diagram?' },
    o:[ {bm:'Haba yang diserap dari persekitaran adalah sebanyak −57.3 kJ mol⁻¹',        en:'The heat absorbed from the environment is −57.3 kJ mol⁻¹'},
        {bm:'Jumlah kandungan tenaga hasil tindak balas lebih tinggi daripada jumlah kandungan tenaga bahan tindak balas', en:'Total energy content of the products is higher than total energy content of the reactants'},
        {bm:'Semasa natrium hidroksida dan asid hidroklorik bertindak balas, suhu campuran akan menurun', en:'As the sodium hydroxide and hydrochloric acid react, the temperature of the mixture will decrease'},
        {bm:'Tenaga yang dibebaskan semasa membentuk ikatan lebih tinggi daripada tenaga yang diserap untuk memutuskan ikatan', en:'The energy released to form bonds is higher than the energy absorbed to break bonds'} ],
    a:3,
    w:{ bm:'Hasil berada pada aras tenaga <b>lebih rendah</b> — <b>eksotermik</b>. Ini berlaku kerana <b>tenaga dibebaskan semasa pembentukan ikatan melebihi</b> tenaga yang diserap untuk memutuskan ikatan ✓. Haba <b>dibebaskan</b>, bukan diserap (A salah); tenaga hasil <b>lebih rendah</b>, bukan lebih tinggi (B salah); suhu campuran <b>meningkat</b> semasa tindak balas eksotermik (C salah).',
        en:'The products sit at a <b>lower</b> energy level — <b>exothermic</b>. This happens because the <b>energy released forming bonds exceeds</b> the energy absorbed breaking them ✓. Heat is <b>released</b>, not absorbed (A wrong); the products hold <b>less</b> energy, not more (B wrong); the mixture’s temperature <b>rises</b> during an exothermic reaction (C wrong).' } },

  { n:36, topic:'REDOX',
    q:{ bm:'Rajah 12 menunjukkan susunan radas bagi elektrolisis leburan plumbum(II) bromida, PbBr₂, menggunakan elektrod karbon. Antara setengah persamaan berikut, yang manakah berlaku di anod dan katod?',
        en:'Diagram 12 shows the arrangement of apparatus for the electrolysis of molten lead(II) bromide, PbBr₂, using carbon electrodes. Which of the following half equations occurs at the anode and cathode?' },
    o:[ {bm:'Anod: Pb²⁺+2e⁻→Pb · Katod: 2Br⁻→Br₂+2e⁻', en:'Anode: Pb²⁺+2e⁻→Pb · Cathode: 2Br⁻→Br₂+2e⁻'},
        {bm:'Anod: 2Br⁻→Br₂+2e⁻ · Katod: 2H⁺+2e⁻→H₂',   en:'Anode: 2Br⁻→Br₂+2e⁻ · Cathode: 2H⁺+2e⁻→H₂'},
        {bm:'Anod: Pb²⁺+2e⁻→Pb · Katod: 2Br⁻→Br₂+2e⁻',  en:'Anode: Pb²⁺+2e⁻→Pb · Cathode: 2Br⁻→Br₂+2e⁻'},
        {bm:'Anod: 2Br⁻→Br₂+2e⁻ · Katod: Pb²⁺+2e⁻→Pb',  en:'Anode: 2Br⁻→Br₂+2e⁻ · Cathode: Pb²⁺+2e⁻→Pb'} ],

   note:'Skema jawapan D (melarutkan garam ammonium) tetapi ini adalah proses endotermik — garam ammonium menyerap haba (digunakan dalam pek sejuk). Tindak balas pemendakan membebaskan haba. Pack menggunakan B.',
   q:{bm:'Antara proses berikut, yang manakah membebaskan haba ke persekitaran?',
      en:'Which of the following processes releases heat to surrounding?'},
   o:[
    {bm:'Peleburan ais',en:'Melting of ice'},
    {bm:'Pemendakan',en:'Precipitation'},
    {bm:'Fotosintesis',en:'Photosynthesis'},
    {bm:'Melarutkan garam ammonium',en:'Dissolving ammonium salts'}
   ],
   a:1,
   w:{bm:'Proses eksotermik membebaskan haba ke persekitaran. Pemendakan (pembentukan garam tak larut) adalah eksotermik — ikatan ion baru terbentuk, tenaga dibebaskan. Peleburan ais dan fotosintesis menyerap haba (endotermik). Garam ammonium larut secara endotermik (digunakan dalam pek sejuk). Nota: skema menjawab D tetapi ini adalah tidak tepat dari segi kimia.',
      en:'Exothermic processes release heat to surroundings. Precipitation (forming an insoluble ionic salt) is exothermic — new ionic bonds form, releasing energy. Melting ice and photosynthesis absorb heat (endothermic). Ammonium salts dissolve endothermically (used in cold packs). Note: the skema answers D, but this is chemically incorrect.'}
  },
  // ── Q17 ──────────────────────────────────────────────────────────────────
  {n:17,uid:'sel2-26-17',form:4,topic:'acid',
   q:{bm:'Antara berikut, yang manakah ciri pepejal asid oksalik yang membolehkan sifat keasidan dapat ditunjukkan?',
      en:'Which of the following is the characteristic of solid oxalic acid that enables its acidic properties to be shown?'},
   o:[
    {bm:'Mengion di dalam air',en:'Ionise in water'},
    {bm:'Melarut di dalam air',en:'Dissolve in water'},
    {bm:'Mengandungi ion hidrogen dalam molekul',en:'Contains hydrogen ion in its molecule'},
    {bm:'Mengion dalam air dan menghasilkan ion hidrogen',en:'Ionise in water and produce hydrogen ion'}
   ],
   a:3,
   w:{bm:'Asid oksalik (C₂H₂O₄) pepejal tidak berasid sehingga dilarutkan dalam air dan mengion menghasilkan ion H⁺. DUA syarat diperlukan: (1) larut, (2) mengion untuk menghasilkan H⁺. Pilihan D merangkumi kedua-dua syarat ini.',
      en:'Solid oxalic acid (C₂H₂O₄) is not acidic until dissolved in water and ionised to produce H⁺ ions. TWO conditions are needed: (1) dissolve, (2) ionise to produce H⁺. Option D captures both requirements.'}
  },
  // ── Q18 ──────────────────────────────────────────────────────────────────
  {n:18,uid:'sel2-26-18',form:5,topic:'polymer',
   q:{bm:'Apakah nama unit kecil yang berulang dalam struktur suatu polimer?',
      en:'What is the name of the small repeating units in the structure of a polymer?'},
   o:[
    {bm:'Ion',en:'Ion'},
    {bm:'Atom',en:'Atom'},
    {bm:'Monomer',en:'Monomer'},
    {bm:'Molekul',en:'Molecule'}
   ],
   a:2,
   w:{bm:'Polimer = rantai panjang unit berulang yang dipanggil monomer. Contoh: polietilena (PE) diperbuat daripada monomer etilena (CH₂=CH₂). Polimerisasi = penggabungan monomer.',
      en:'Polymer = long chain of repeating units called monomers. Example: polyethylene (PE) is made from ethylene (CH₂=CH₂) monomers. Polymerisation = joining of monomers.'}
  },
  // ── Q19 ──────────────────────────────────────────────────────────────────
  {n:19,uid:'sel2-26-19',form:5,topic:'consumer',
   q:{bm:'Rajah 6 menunjukkan contoh kosmetik yang digunakan untuk kecantikan (maskara). Antara berikut, yang manakah menunjukkan jenis kosmetik yang betul?',
      en:'Diagram 6 shows an example of a cosmetic used for beauty (mascara). Which of the following shows the correct type of cosmetic?'},
   o:[

    {bm:'Pewangi',en:'Fragrances'},
    {bm:'Pelembap',en:'Moisturisers'}
   ],
   a:0,
   w:{bm:'Maskara digunakan untuk menghias bulu mata — ini adalah kosmetik rias (makeup). Kosmetik perawatan = krim muka, losyen badan. Pewangi = minyak wangi. Pelembap = losyen pelembap kulit.',
      en:'Mascara is used to decorate eyelashes — this is a makeup cosmetic. Treatment cosmetics = face cream, body lotion. Fragrances = perfume. Moisturisers = skin moisturising lotion.'}
  },
  // ── Q20 ──────────────────────────────────────────────────────────────────
  {n:20,uid:'sel2-26-20',form:4,topic:'bond',
   q:{bm:'Apakah tujuan atom-atom membentuk ikatan kimia?',
      en:'What is the purpose of atoms forming chemical bond?'},
   o:[
    {bm:'Untuk membebaskan elektron',en:'To release electrons'},
    {bm:'Untuk membentuk sebatian yang stabil',en:'To form a stable compound'},
    {bm:'Untuk menambah bilangan proton',en:'To increase the number of protons'},
    {bm:'Untuk mencapai susunan elektron yang stabil',en:'To achieve a stable electron arrangement'}
   ],
   a:3,
   w:{bm:'Atom membentuk ikatan kimia untuk mencapai susunan elektron yang stabil seperti gas nadir (2 atau 8 elektron di petala terluar). Ikatan kovalen: perkongsian elektron. Ikatan ion: pemindahan elektron. Tujuan yang sama — kestabilan.',
      en:'Atoms form chemical bonds to achieve the stable electron arrangement of noble gases (2 or 8 electrons in the outermost shell). Covalent bonds: electron sharing. Ionic bonds: electron transfer. Same goal — stability.'}
  },
  // ── Q21 ──────────────────────────────────────────────────────────────────
  {n:21,uid:'sel2-26-21',form:4,topic:'mole',
   q:{bm:'Persamaan kimia berikut mewakili tindak balas antara ferum dengan oksigen: 4Fe + 3O₂ → 2Fe₂O₃. Antara pernyataan berikut, yang manakah betul?',
      en:'The following chemical equation represents the reaction between iron and oxygen: 4Fe + 3O₂ → 2Fe₂O₃. Which of the following statements is correct?'},
   o:[
    {bm:'4 mol atom ferum bertindak balas dengan 3 mol atom oksigen',
     en:'4 mol of iron atoms react with 3 mol of oxygen atoms'},
    {bm:'4 mol atom ferum bertindak balas dengan 3 mol molekul oksigen',
     en:'4 mol of iron atoms react with 3 mol of oxygen molecules'},
    {bm:'4 mol atom ferum bertindak balas dengan 3 mol molekul oksigen menghasilkan 2 mol unit ferum(III) oksida',
     en:'4 mol of iron atoms react with 3 mol of oxygen molecules producing 2 mol of iron(III) oxide units'},
    {bm:'4 mol atom ferum bertindak balas dengan 6 mol molekul oksigen menghasilkan 2 mol unit ferum(III) oksida',
     en:'4 mol of iron atoms react with 6 mol of chlorine molecules producing 2 mol of iron(III) oxide units'}
   ],
   a:2,
   w:{bm:'4Fe + 3O₂ → 2Fe₂O₃. Nisbah molar: 4 mol Fe : 3 mol O₂ (bukan atom O) : 2 mol Fe₂O₃. Pilihan C betul — 4 mol Fe bertindak balas dengan 3 mol molekul O₂ menghasilkan 2 mol Fe₂O₃.',
      en:'4Fe + 3O₂ → 2Fe₂O₃. Molar ratio: 4 mol Fe : 3 mol O₂ (not O atoms) : 2 mol Fe₂O₃. Option C is correct — 4 mol Fe reacts with 3 mol O₂ molecules to produce 2 mol Fe₂O₃.'}
  },
  // ── Q22 ──────────────────────────────────────────────────────────────────
  {n:22,uid:'sel2-26-22',form:4,topic:'bond',
   img:'img/kimia/a5527e66c968.webp',
   alt:{bm:'Rajah 7: kedudukan unsur P (Kumpulan 14, Kala 2) dan Q (Kumpulan 17, Kala 3) dalam Jadual Berkala',
        en:'Diagram 7: position of element P (Group 14, Period 2) and Q (Group 17, Period 3) in Periodic Table'},
   q:{bm:'Manakah antara berikut merupakan formula kimia bagi sebatian yang terbentuk apabila unsur P bertindak balas dengan unsur Q?',
      en:'Which of the following is the formula of compound formed when element P reacts with element Q?'},
   o:[
    {bm:'PQ₄',en:'PQ₄'},
    {bm:'P₂Q',en:'P₂Q'},
    {bm:'PQ₂',en:'PQ₂'},
    {bm:'P₂Q₃',en:'P₂Q₃'}
   ],
   a:0,
   w:{bm:'P berada di Kumpulan 14 (valensi 4, contoh: C atau Si). Q berada di Kumpulan 17 (valensi 1, contoh: Cl). P memerlukan 4 elektron daripada Q untuk mencapai kestabilan → PQ₄ (seperti CCl₄ atau SiCl₄).',
      en:'P is in Group 14 (valency 4, e.g. C or Si). Q is in Group 17 (valency 1, e.g. Cl). P needs 4 electrons from Q to achieve stability → PQ₄ (like CCl₄ or SiCl₄).'}
  },
  // ── Q23 ──────────────────────────────────────────────────────────────────
  {n:23,uid:'sel2-26-23',form:4,topic:'acid',
   q:{bm:'Pernyataan berikut yang manakah merujuk kepada alkali lemah?',
      en:'Which of the following statements refers to weak alkali?'},
   o:[
    {bm:'Alkali yang sangat cair',en:'A highly diluted alkali'},
    {bm:'Alkali yang sangat mengakis',en:'A highly corrosive alkali'},
    {bm:'Alkali mempunyai nilai pH yang paling tinggi',en:'Alkali which has the highest pH value'},
    {bm:'Alkali yang menghasilkan kepekatan ion hidroksida yang rendah di dalam air',
     en:'Alkali that produces low concentration of hydroxide ion in water'}
   ],
   a:3,
   w:{bm:'Alkali lemah mengion separa dalam air → kepekatan OH⁻ rendah → pH rendah berbanding alkali kuat pada kepekatan yang sama. Contoh: larutan ammonia (NH₃·H₂O ⇌ NH₄⁺ + OH⁻). Bukan berdasarkan kepekatan atau sifat hakis.',
      en:'Weak alkali partially ionises in water → low [OH⁻] → lower pH than strong alkali at same concentration. Example: ammonia solution (NH₃·H₂O ⇌ NH₄⁺ + OH⁻). Not defined by concentration or corrosiveness.'}
  },
  // ── Q24 ──────────────────────────────────────────────────────────────────
  {n:24,uid:'sel2-26-24',form:5,topic:'polymer',
   q:{bm:'Antara berikut, pernyataan manakah yang menerangkan proses pempolimeran dengan betul?',
      en:'Which of the following statements correctly explains the polymerisation process?'},
   o:[
    {bm:'Proses pemecahan polimer kepada monomer',en:'The process of breaking down polymers into monomers'},
    {bm:'Proses pemanasan polimer untuk menjadi cecair',en:'The process of heating a polymer to become a liquid'},
    {bm:'Proses pencantuman monomer untuk membentuk polimer',en:'The process of joining monomers to form a polymer'},
    {bm:'Proses pengasingan polimer mengikut ketumpatan yang berbeza',
     en:'The process of separating polymers according to different densities'}
   ],
   a:2,
   w:{bm:'Pempolimeran = proses pencantuman banyak monomer (unit kecil) untuk membentuk polimer (molekul besar rantai panjang). Contoh: n(CH₂=CH₂) → [–CH₂–CH₂–]ₙ (polietilena). Pilihan A = hidrolisis/depolimerisasi.',
      en:'Polymerisation = the process of joining many monomers (small units) to form a polymer (large long-chain molecule). Example: n(CH₂=CH₂) → [–CH₂–CH₂–]ₙ (polyethylene). Option A = hydrolysis/depolymerisation.'}
  },
  // ── Q25 ──────────────────────────────────────────────────────────────────
  {n:25,uid:'sel2-26-25',form:4,topic:'rate',
   q:{bm:'Mengapakah kadar tindak balas bagi ketulan zink adalah lebih rendah berbanding serbuk zink apabila bertindak balas dengan asid yang sama?',
      en:'Why is the rate of reaction for zinc granules lower than zinc powder when reacting with the same acid?'},
   o:[
    {bm:'Ketulan zink mempunyai jisim yang lebih besar terdedah kepada tindak balas',
     en:'Zinc granules have a larger mass exposed to reaction'},
    {bm:'Ketulan zink mempunyai tenaga pengaktifan yang tinggi',
     en:'Zinc granules have a high activation energy'},
    {bm:'Ketulan zink mempunyai jumlah luas permukaan yang lebih kecil',
     en:'Zinc granules have a smaller total surface area'},
    {bm:'Ketulan zink mempunyai luas permukaan terdedah yang lebih besar',
     en:'Zinc granules have a larger exposed surface area'}
   ],
   a:2,
   w:{bm:'Serbuk zink mempunyai zarah yang lebih kecil → jumlah luas permukaan yang lebih besar → lebih banyak titik sentuhan dengan asid → kadar tindak balas lebih tinggi. Ketulan zink mempunyai luas permukaan lebih kecil → kadar lebih rendah.',
      en:'Zinc powder has smaller particles → greater total surface area → more contact points with acid → higher rate of reaction. Zinc granules have smaller surface area → lower rate.'}
  },
  // ── Q26 ──────────────────────────────────────────────────────────────────
  {n:26,uid:'sel2-26-26',form:4,topic:'redox',
   q:{bm:'Persamaan berikut menunjukkan tindak balas antara kuprum(II) oksida dan gas hidrogen: CuO + H₂ → Cu + H₂O. Apakah jenis tindak balas yang berlaku pada kuprum(II) oksida?',
      en:'The following equation shows the reaction between copper(II) oxide and hydrogen gas: CuO + H₂ → Cu + H₂O. What is the type of reaction that takes place for copper(II) oxide?'},
   o:[
    {bm:'Penurunan',en:'Reduction'},
    {bm:'Peneutralan',en:'Neutralisation'},
    {bm:'Pemendakan',en:'Precipitation'},
    {bm:'Pengoksidaan',en:'Oxidation'}
   ],
   a:0,
   w:{bm:'CuO + H₂ → Cu + H₂O. CuO kehilangan oksigen → CuO mengalami penurunan (Cu²⁺ + 2e⁻ → Cu). H₂ mendapat oksigen → H₂ mengalami pengoksidaan. H₂ ialah bahan penurunan; CuO ialah bahan pengoksidaan.',
      en:'CuO + H₂ → Cu + H₂O. CuO loses oxygen → CuO undergoes reduction (Cu²⁺ + 2e⁻ → Cu). H₂ gains oxygen → H₂ is oxidised. H₂ is the reducing agent; CuO is the oxidising agent.'}
  },
  // ── Q27 ──────────────────────────────────────────────────────────────────
  {n:27,uid:'sel2-26-27',form:5,topic:'consumer',
   q:{bm:'Rajah 8 menunjukkan segelas jus nanas. Bahan yang manakah akan menambahkan rasa dan bau jus nanas tersebut?',
      en:'Diagram 8 shows a glass of pineapple juice. Which substance will enhance the flavour and smell of the pineapple juice?'},
   o:[
    {bm:'Tokoferol',en:'Tocopherol'},
    {bm:'Etil butanoat',en:'Ethyl butanoate'},
    {bm:'Asid askorbik',en:'Ascorbic acid'},
    {bm:'Etil heksanoat',en:'Ethyl hexanoate'}
   ],
   a:1,
   w:{bm:'Etil butanoat (CH₃CH₂CH₂COOC₂H₅) adalah ester yang memberikan bau dan rasa nanas. Ester digunakan sebagai perisa dalam minuman dan makanan. Tokoferol = vitamin E (antioksidan). Asid askorbik = vitamin C. Etil heksanoat memberikan bau strawberi/ceri.',
      en:'Ethyl butanoate (CH₃CH₂CH₂COOC₂H₅) is the ester responsible for pineapple flavour and smell. Esters are used as flavourings in drinks and food. Tocopherol = vitamin E (antioxidant). Ascorbic acid = vitamin C. Ethyl hexanoate gives strawberry/cherry aroma.'}
  },
  // ── Q28 ──────────────────────────────────────────────────────────────────
  {n:28,uid:'sel2-26-28',form:4,topic:'mole',
   q:{bm:'3.25 g zink bertindak balas dengan 0.025 mol asid nitrik untuk membentuk zink nitrat sebagai salah satu hasil tindak balas. Tentukan jisim zink yang tinggal selepas tindak balas. [Jisim atom relatif: Zn = 65]',
      en:'3.25 g of zinc reacts with 0.025 mol of nitric acid to form zinc nitrate as one of the reaction products. Determine the mass of zinc remaining after the reaction. [Relative atomic mass: Zn = 65]'},
   o:[
    {bm:'0.81 g',en:'0.81 g'},
    {bm:'1.63 g',en:'1.63 g'},
    {bm:'2.44 g',en:'2.44 g'},
    {bm:'3.25 g',en:'3.25 g'}
   ],
   a:2,
   w:{bm:'Persamaan: Zn + 2HNO₃ → Zn(NO₃)₂ + H₂. Mol Zn = 3.25/65 = 0.05 mol. Mol HNO₃ = 0.025 mol. Untuk 0.05 mol Zn perlu 0.10 mol HNO₃ — tetapi hanya 0.025 mol ada → HNO₃ adalah bahan pengehad. Mol Zn bertindak balas = 0.025/2 = 0.0125 mol. Jisim Zn bertindak balas = 0.0125 × 65 = 0.8125 g. Zink tinggal = 3.25 – 0.8125 = 2.44 g.',
      en:'Equation: Zn + 2HNO₃ → Zn(NO₃)₂ + H₂. Mol Zn = 3.25/65 = 0.05 mol. Mol HNO₃ = 0.025 mol. For 0.05 mol Zn, need 0.10 mol HNO₃ — but only 0.025 mol available → HNO₃ is limiting. Mol Zn reacted = 0.025/2 = 0.0125 mol. Mass Zn reacted = 0.0125 × 65 = 0.8125 g. Zinc remaining = 3.25 – 0.8125 = 2.44 g.'}
  },
  // ── Q29 ──────────────────────────────────────────────────────────────────
  {n:29,uid:'sel2-26-29',form:4,topic:'acid',
   q:{bm:'Jadual 1 menunjukkan maklumat tentang dua jenis larutan: kalium hidroksida 1.0 mol dm⁻³ dan larutan ammonia 1.0 mol dm⁻³. Antara berikut, yang manakah benar tentang dua jenis larutan itu?\nI Nilai pH bagi kalium hidroksida lebih tinggi daripada larutan ammonia\nII Darjah penceraian larutan ammonia lebih rendah daripada kalium hidroksida\nIII Kepekatan ion hidroksida, OH⁻ lebih tinggi dalam larutan ammonia\nIV Larutan ammonia adalah alkali kuat manakala kalium hidroksida adalah alkali lemah',
      en:'Table 1 shows information on two solutions: 1.0 mol dm⁻³ potassium hydroxide and 1.0 mol dm⁻³ ammonia solution. Which of the following is correct about the two solutions?\nI The pH value of potassium hydroxide is higher than ammonia solution\nII The degree of dissociation of ammonia solution is lower than potassium hydroxide\nIII The concentration of hydroxide ion, OH⁻ is higher in ammonia solution\nIV Ammonia solution is a strong alkali while potassium hydroxide is a weak alkali'},
   o:[
    {bm:'I dan II',en:'I and II'},
    {bm:'II dan IV',en:'II and IV'},
    {bm:'I dan III',en:'I and III'},
    {bm:'III dan IV',en:'III and IV'}
   ],
   a:0,
   w:{bm:'KOH adalah alkali kuat (mengion sepenuhnya): [OH⁻]=1.0 mol dm⁻³, pH tinggi. NH₃ adalah alkali lemah (mengion separa): [OH⁻]<1.0 mol dm⁻³, pH lebih rendah. I ✓ (KOH pH lebih tinggi). II ✓ (NH₃ darjah pengionan lebih rendah). III ✗ ([OH⁻] lebih tinggi dalam KOH). IV ✗ (KOH kuat, NH₃ lemah — bukan sebaliknya).',
      en:'KOH is a strong alkali (fully ionised): [OH⁻]=1.0 mol dm⁻³, higher pH. NH₃ is a weak alkali (partially ionised): [OH⁻]<1.0 mol dm⁻³, lower pH. I ✓ (KOH has higher pH). II ✓ (NH₃ has lower degree of ionisation). III ✗ ([OH⁻] is higher in KOH). IV ✗ (KOH is strong, NH₃ is weak — not the reverse).'}
  },
  // ── Q30 ──────────────────────────────────────────────────────────────────
  {n:30,uid:'sel2-26-30',form:5,topic:'consumer',
   q:{bm:'Rajah 9 menunjukkan udang segar yang baru ditangkap oleh nelayan. Antara kaedah berikut, yang manakah paling berkesan untuk mengekalkan kesegaran udang yang baru ditangkap semasa dibawa ke pasar?',
      en:'Diagram 9 shows freshly caught prawns by a fisherman. Which of the following methods is the most effective to maintain the freshness of newly caught prawns while being transported to the market?'},
   o:[
    {bm:'Membungkus udang dengan kain yang kering',en:'Wrapping the prawns with a dry cloth'},
    {bm:'Meletakkan udang di bawah pancaran cahaya matahari',en:'Placing the prawns under direct sunlight'},
    {bm:'Menyimpan udang di dalam bekas tertutup pada suhu bilik',en:'Storing the prawns in a closed container at room temperature'},
    {bm:'Menyimpan udang di dalam bekas berisi ais hancur yang banyak',en:'Storing the prawns in a container filled with a lot of crushed ice'}
   ],
   a:3,
   w:{bm:'Ais hancur mengekalkan suhu rendah (~0 °C), melambatkan pertumbuhan bakteria dan tindak balas enzim yang menyebabkan pembusukan. Ini adalah kaedah paling berkesan untuk pengangkutan jarak jauh.',
      en:'Crushed ice maintains a low temperature (~0 °C), slowing bacterial growth and enzymatic reactions that cause spoilage. This is the most effective method for long-distance transport.'}
  },
  // ── Q31 ──────────────────────────────────────────────────────────────────
  {n:31,uid:'sel2-26-31',form:4,topic:'rate',
   q:{bm:'Dalam satu eksperimen, 24 g magnesium bertindak balas dengan asid hidroklorik berlebihan. X cm³ gas hidrogen dihasilkan pada suhu bilik dalam masa 20 saat. Berapakah kadar tindak balas purata? [Jisim atom relatif: Mg = 24; Isi padu molar: 24 dm³ mol⁻¹ pada keadaan bilik]',
      en:'In an experiment, 24 g of magnesium reacts with excess hydrochloric acid. X cm³ of hydrogen gas is produced at room temperature in 20 seconds. What is the average rate of reaction? [Relative atomic mass: Mg = 24; Molar volume: 24 dm³ mol⁻¹ at room conditions]'},
   o:[
    {bm:'500.0 cm³ s⁻¹',en:'500.0 cm³ s⁻¹'},
    {bm:'1200.0 cm³ s⁻¹',en:'1200.0 cm³ s⁻¹'},
    {bm:'1.2 cm³ s⁻¹',en:'1.2 cm³ s⁻¹'},
    {bm:'0.5 cm³ s⁻¹',en:'0.5 cm³ s⁻¹'}
   ],
   a:1,
   w:{bm:'Mg + 2HCl → MgCl₂ + H₂. Mol Mg = 24/24 = 1 mol. Mol H₂ = 1 mol. Isi padu H₂ = 1 × 24 000 cm³ = 24 000 cm³. Kadar = 24 000/20 = 1200 cm³ s⁻¹.',
      en:'Mg + 2HCl → MgCl₂ + H₂. Mol Mg = 24/24 = 1 mol. Mol H₂ = 1 mol. Volume H₂ = 1 × 24 000 cm³ = 24 000 cm³. Rate = 24 000/20 = 1200 cm³ s⁻¹.'}
  },
  // ── Q32 ──────────────────────────────────────────────────────────────────
  {n:32,uid:'sel2-26-32',form:4,topic:'salt',
   img:'img/kimia/5d4ab4d2a2c4.webp',
   alt:{bm:'Rajah 10: carta alir tindak balas garam V — pepejal W + gas perang + gas X; larutan + Na₂SO₄ → mendakan putih Y; + NH₃ berlebihan → mendakan tidak larut',
        en:'Diagram 10: flow chart of reactions on salt V — solid W + brown gas + gas X; solution + Na₂SO₄ → white precipitate Y; + excess NH₃ → precipitate does not dissolve'},
   q:{bm:'Apakah garam V, pepejal W dan gas X?',
      en:'What are salt V, solid W and gas X?'},
   o:[
    {bm:'PbCO₃ | kuning panas/putih sejuk | bunyi "pop" dengan kayu bernyala',
     en:'PbCO₃ | yellow hot/white cool | \'pop\' sound with lighted splinter'},
    {bm:'Pb(NO₃)₂ | perang panas/kuning sejuk | menyalakan kayu berbara',
     en:'Pb(NO₃)₂ | brown hot/yellow cool | rekindles glowing splinter'},
    {bm:'Zn(NO₃)₂ | kuning panas/putih sejuk | menyalakan kayu berbara',
     en:'Zn(NO₃)₂ | yellow hot/white cool | rekindles glowing splinter'},
    {bm:'ZnCO₃ | perang panas/kuning sejuk | bunyi "pop" dengan kayu bernyala',
     en:'ZnCO₃ | brown hot/yellow cool | \'pop\' sound with lighted splinter'}
   ],
   a:1,
   w:{bm:'Gas perang = NO₂ → garam mengandungi nitrat. Mendakan putih dengan Na₂SO₄ = PbSO₄ (tak larut) → ion Pb²⁺. Gas X menyalakan kayu berbara = O₂. Mendakan tidak larut dalam NH₃ berlebihan mengesahkan Pb²⁺ (bukan Zn²⁺ yang larut dalam NH₃). Jadi garam V = Pb(NO₃)₂. PbO (pepejal W) berwarna kuning semasa sejuk, perang/oren semasa panas.',

   q:{bm:'Persamaan ion berikut mewakili satu tindak balas redoks: Al + 3Ag⁺ → Al³⁺ + 3Ag. Penyataan manakah yang betul?',
      en:'The following ionic equation represents a redox reaction: Al + 3Ag⁺ → Al³⁺ + 3Ag. Which statement is correct?'},
   o:[
    {bm:'Ion argentum dioksidakan',en:'Silver ion is oxidized'},
    {bm:'Atom aluminium mengalami pengoksidaan',en:'Aluminium atom undergoes oxidation'},
    {bm:'Ion argentum adalah satu agen penurunan',en:'Silver ion is a reducing agent'},
    {bm:'Atom aluminium menerima elektron',en:'Aluminium atom receives electrons'}
   ],
   a:1,
   w:{bm:'Al → Al³⁺ + 3e⁻: aluminium kehilangan elektron → pengoksidaan ✓. 3Ag⁺ + 3e⁻ → 3Ag: Ag⁺ menerima elektron → penurunan. Ag⁺ adalah agen pengoksidaan (bukan penurunan). Al adalah agen penurunan. Pilihan D salah — Al kehilangan elektron, tidak menerimanya.',
      en:'Al → Al³⁺ + 3e⁻: aluminium loses electrons → oxidation ✓. 3Ag⁺ + 3e⁻ → 3Ag: Ag⁺ gains electrons → reduction. Ag⁺ is the oxidising agent (not reducing). Al is the reducing agent. Option D is wrong — Al loses electrons, it does not receive them.'}
  },

   w:{bm:'Ini adalah sel galvani: Fe²⁺ (Y) → Fe³⁺ + e⁻ (pengoksidaan di anod Y). Br₂ + 2e⁻ → 2Br⁻ (penurunan di katod X). Br₂ yang bertanggungjawab atas warna perang diturunkan kepada Br⁻ yang tidak berwarna → warna perang hilang. Elektron mengalir melalui dawai luar (bukan melalui larutan).',

  // ── Q11 ──────────────────────────────────────────────────────────────────
  {n:11,uid:'trg-26-11',form:5,topic:'carbon',
   q:{bm:'Hidrokarbon adalah sebatian kimia yang terdiri daripada',
      en:'A hydrocarbon is a chemical compound consisting of'},
   o:[
    {bm:'karbon, hidrogen, oksigen dan nitrogen sahaja',en:'carbon, hydrogen, oxygen and nitrogen only'},
    {bm:'karbon, hidrogen dan oksigen sahaja',en:'carbon, hydrogen and oxygen only'},
    {bm:'karbon dan hidrogen sahaja',en:'carbon and hydrogen only'},
    {bm:'karbon dan oksigen sahaja',en:'carbon and oxygen only'}
   ],
   a:2,
   w:{bm:'Hidrokarbon mengandungi HANYA unsur karbon (C) dan hidrogen (H). Contoh: metana CH₄, etena C₂H₄, benzena C₆H₆. Sebatian dengan O (seperti alkohol, asid) atau N (amina) BUKAN hidrokarbon tulen.',
      en:'Hydrocarbons contain ONLY carbon (C) and hydrogen (H) elements. Examples: methane CH₄, ethene C₂H₄, benzene C₆H₆. Compounds with O (like alcohols, acids) or N (amines) are NOT pure hydrocarbons.'}
  },
  // ── Q12 ──────────────────────────────────────────────────────────────────
  {n:12,uid:'trg-26-12',form:5,topic:'carbon',
   q:{bm:'Sebatian manakah adalah suatu hidrokarbon tepu?',
      en:'Which compound is a saturated hydrocarbon?'},
   o:[
    {bm:'Propena',en:'Propene'},
    {bm:'Propana',en:'Propane'},
    {bm:'Propanol',en:'Propanol'},
    {bm:'Propil propanoat',en:'Propyl propanoate'}
   ],
   a:1,
   w:{bm:'Propana (C₃H₈) ialah alkana — hidrokarbon tepu (semua ikatan C-C adalah ikatan tunggal, tiada ikatan berganda atau triple). Propena (C₃H₆) = alkena (ikatan C=C, tak tepu). Propanol = alkohol (bukan hidrokarbon tulen). Propil propanoat = ester (mengandungi O).',
      en:'Propane (C₃H₈) is an alkane — a saturated hydrocarbon (all C-C bonds are single bonds, no double or triple bonds). Propene (C₃H₆) = alkene (C=C bond, unsaturated). Propanol = alcohol (not a pure hydrocarbon). Propyl propanoate = ester (contains O).'}
  },
  // ── Q13 ──────────────────────────────────────────────────────────────────
  {n:13,uid:'trg-26-13',form:4,topic:'thermo',
   q:{bm:'Pasangan manakah yang menghasilkan perubahan suhu paling tinggi?',
      en:'Which pair produces the highest temperature change?'},
   o:[
    {bm:'Asid metanoik dan larutan natrium hidroksida',en:'Methanoic acid and sodium hydroxide solution'},
    {bm:'Asid sulfurik dan larutan kalium hidroksida',en:'Sulphuric acid and potassium hydroxide solution'},
    {bm:'Asid hidroklorik dan larutan kalium hidroksida',en:'Hydrochloric acid and potassium hydroxide solution'},
    {bm:'Asid etanoik dan larutan natrium hidroksida',en:'Ethanoic acid and sodium hydroxide solution'}
   ],
   a:1,
   w:{bm:'H₂SO₄ (asid kuat diprotik) + KOH (alkali kuat): H₂SO₄ + 2KOH → K₂SO₄ + 2H₂O. Menghasilkan 2 mol air per mol asid — lebih banyak haba berbanding asid monoprotik. Asid lemah (metanoik, etanoik) melepaskan haba peneutralan yang lebih rendah kerana ada haba pengionan yang diserap.',
      en:'H₂SO₄ (strong diprotic acid) + KOH (strong alkali): H₂SO₄ + 2KOH → K₂SO₄ + 2H₂O. Produces 2 mol of water per mol of acid — more heat than monoprotic acid. Weak acids (methanoic, ethanoic) release lower neutralisation heat because ionisation energy is absorbed.'}
  },
  // ── Q14 ──────────────────────────────────────────────────────────────────
  {n:14,uid:'trg-26-14',form:5,topic:'polymer',
   q:{bm:'Bahan manakah mempercepatkan penggumpalan lateks?',
      en:'Which substance speeds up the coagulation of latex?'},
   o:[
    {bm:'Air',en:'Water'},
    {bm:'Metanol',en:'Methanol'},
    {bm:'Larutan ammonia',en:'Ammonia solution'},
    {bm:'Asid metanoik',en:'Methanoic acid'}
   ],
   a:3,
   w:{bm:'Lateks segar mengandungi zarah-zarah getah yang bercas negatif dan tergantung dalam larutan. Asid metanoik (asid formik) membekalkan ion H⁺ yang meneutralkan cas negatif pada membran zarah getah → zarah bergumpal (koagulasi). Larutan ammonia pula digunakan sebagai PENGAWET untuk MENCEGAH penggumpalan.',
      en:'Fresh latex contains negatively charged rubber particles suspended in solution. Methanoic acid (formic acid) supplies H⁺ ions that neutralise the negative charge on the rubber particle membrane → particles coagulate. Ammonia solution is used as a PRESERVATIVE to PREVENT coagulation.'}
  },
  // ── Q15 ──────────────────────────────────────────────────────────────────
  {n:15,uid:'trg-26-15',form:5,topic:'carbon',
   q:{bm:'Antara yang berikut, yang manakah betul mengenai saponifikasi?',
      en:'Which of the following is correct about saponification?'},
   o:[
    {bm:'Tindak balas antara ester dengan alkali',en:'Reaction of ester with alkali'},
    {bm:'Tindak balas antara alkana dengan klorin',en:'Reaction of alkane with chlorine'},
    {bm:'Tindak balas antara alkena dengan air',en:'Reaction of alkene with water'},
    {bm:'Tindak balas antara alkohol dengan asid karboksilik',en:'Reaction of alcohol with carboxylic acid'}
   ],
   a:0,
   w:{bm:'Saponifikasi = penghidrolisian ester oleh alkali untuk menghasilkan sabun (garam natrium asid lemak) dan gliserol. Contoh: lemak/minyak (trigliserida) + NaOH → sabun + gliserol. Pilihan D = pengesteran (kebalikan saponifikasi).',
      en:'Saponification = hydrolysis of ester by alkali to produce soap (sodium salt of fatty acid) and glycerol. Example: fat/oil (triglyceride) + NaOH → soap + glycerol. Option D = esterification (the reverse of saponification).'}
  },
  // ── Q16 ──────────────────────────────────────────────────────────────────
  {n:16,uid:'trg-26-16',form:4,topic:'atom',
   q:{bm:'Rajah 16 menunjukkan susunan elektron bagi suatu ion bercas +1 yang mempunyai 2 petala elektron (susunan 2,8). Bilangan neutron bagi ion itu ialah 12. Apakah nombor nukleon bagi atom tersebut?',
      en:'Diagram 16 shows the electron arrangement for an ion with charge +1 having 2 electron shells (arrangement 2,8). The number of neutrons of the ion is 12. What is the nucleon number of this atom?'},
   o:[
    {bm:'23',en:'23'},
    {bm:'22',en:'22'},
    {bm:'10',en:'10'},
    {bm:'11',en:'11'}
   ],
   a:0,
   w:{bm:'Ion bercas +1 dengan susunan 2,8 → 10 elektron. Nombor proton = 10+1 = 11 (Natrium, Na). Nombor neutron = 12. Nombor nukleon = nombor proton + nombor neutron = 11+12 = 23.',
      en:'Ion with charge +1 and arrangement 2,8 → 10 electrons. Proton number = 10+1 = 11 (Sodium, Na). Number of neutrons = 12. Nucleon number = proton number + neutron number = 11+12 = 23.'}
  },
  // ── Q17 ──────────────────────────────────────────────────────────────────
  {n:17,uid:'trg-26-17',form:4,topic:'mole',
   q:{bm:'Apakah jisim molar bagi ferum(III) oksida? [Jisim atom relatif: Fe = 56, O = 16]',
      en:'What is the molar mass of iron(III) oxide? [Relative atomic mass: Fe = 56, O = 16]'},
   o:[

    {bm:'144 g mol⁻¹',en:'144 g mol⁻¹'},
    {bm:'160 g mol⁻¹',en:'160 g mol⁻¹'},
    {bm:'184 g mol⁻¹',en:'184 g mol⁻¹'}
   ],
   a:2,
   w:{bm:'Ferum(III) oksida = Fe₂O₃. Jisim molar = 2(56) + 3(16) = 112 + 48 = 160 g mol⁻¹.',
      en:'Iron(III) oxide = Fe₂O₃. Molar mass = 2(56) + 3(16) = 112 + 48 = 160 g mol⁻¹.'}
  },
  // ── Q18 ──────────────────────────────────────────────────────────────────
  {n:18,uid:'trg-26-18',form:4,topic:'mole',
   q:{bm:'Sebuah balang gas berisi 1 mol gas oksigen, O₂. Berapakah bilangan atom oksigen di dalam balang gas tersebut? [Pemalar Avogadro: 6.02 × 10²³]',
      en:'A gas jar contains 1 mole of oxygen gas, O₂. How many oxygen atoms are in the gas jar? [Avogadro constant: 6.02 × 10²³]'},
   o:[
    {bm:'1.204 × 10²⁴',en:'1.204 × 10²⁴'},
    {bm:'2.408 × 10²⁴',en:'2.408 × 10²⁴'},
    {bm:'4.816 × 10²⁴',en:'4.816 × 10²⁴'},
    {bm:'6.186 × 10²⁴',en:'6.186 × 10²⁴'}
   ],
   a:0,
   w:{bm:'O₂ adalah molekul dwiatom. 1 mol O₂ mengandungi 2 mol atom O. Bilangan atom O = 2 × 6.02×10²³ = 1.204×10²⁴.',
      en:'O₂ is a diatomic molecule. 1 mol O₂ contains 2 mol O atoms. Number of O atoms = 2 × 6.02×10²³ = 1.204×10²⁴.'}
  },
  // ── Q19 ──────────────────────────────────────────────────────────────────
  {n:19,uid:'trg-26-19',form:4,topic:'mole',
   q:{bm:'Rajah 19 menunjukkan simbol piawai bagi atom A (²⁷₁₃A) dan atom E (¹⁶₈E). Hitungkan jisim molekul relatif bagi sebatian yang terbentuk antara atom A dan atom E.',
      en:'Diagram 19 shows the standard symbols for atom A (²⁷₁₃A) and atom E (¹⁶₈E). Calculate the relative molecular mass of the compound formed between atom A and atom E.'},
   o:[
    {bm:'21',en:'21'},
    {bm:'43',en:'43'},
    {bm:'55',en:'55'},
    {bm:'102',en:'102'}
   ],
   a:3,
   w:{bm:'A = ²⁷₁₃Al (proton 13, jisim 27) → Kumpulan 13, valensi 3. E = ¹⁶₈O (proton 8, jisim 16) → Kumpulan 16, valensi 2. Sebatian: Al₂O₃. Jisim molekul relatif = 2(27) + 3(16) = 54 + 48 = 102.',
      en:'A = ²⁷₁₃Al (proton 13, mass 27) → Group 13, valency 3. E = ¹⁶₈O (proton 8, mass 16) → Group 16, valency 2. Compound: Al₂O₃. Relative molecular mass = 2(27) + 3(16) = 54 + 48 = 102.'}
  },
  // ── Q20 ──────────────────────────────────────────────────────────────────
  {n:20,uid:'trg-26-20',form:4,topic:'bond',
   q:{bm:'Susunan elektron atom R ialah 2.8.1 dan susunan elektron atom Z ialah 2.6. Unsur R dan unsur Z bertindak balas membentuk satu sebatian. Antara yang berikut, yang manakah benar tentang tindak balas itu?',
      en:'The electron arrangement of R atom is 2.8.1 and the electron arrangement of Z atom is 2.6. Elements R and Z react to form a compound. Which of the following is true about the reaction?'},
   o:[
    {bm:'Sebatian yang terbentuk mempunyai formula kimia RZ₂',en:'The compound formed has chemical formula RZ₂'},
    {bm:'Suatu sebatian ion terhasil',en:'An ionic compound is formed'},
    {bm:'Atom Z menderma 2 elektron',en:'Atom Z donates 2 electrons'},
    {bm:'Atom R menerima 1 elektron',en:'Atom R receives 1 electron'}
   ],
   a:1,
   w:{bm:'R (2,8,1): Kumpulan 1, valensi 1, mendermakan 1 elektron → R⁺. Z (2,6): Kumpulan 16, memerlukan 2 elektron → menerima 2e⁻ → Z²⁻. Formula: 2R⁺ + Z²⁻ → R₂Z (bukan RZ₂). Sebatian terbentuk melalui pemindahan elektron → sebatian ION. Z menerima elektron (bukan mendermakan). R mendermakan (bukan menerima).',
      en:'R (2,8,1): Group 1, valency 1, donates 1 electron → R⁺. Z (2,6): Group 16, needs 2 electrons → receives 2e⁻ → Z²⁻. Formula: 2R⁺ + Z²⁻ → R₂Z (not RZ₂). Compound forms via electron transfer → IONIC compound. Z receives electrons (not donates). R donates (not receives).'}
  },
  // ── Q21 ──────────────────────────────────────────────────────────────────
  {n:21,uid:'trg-26-21',form:4,topic:'acid',
   q:{bm:'Berapakah kepekatan larutan kalium hidroksida, KOH yang mempunyai nilai pH 12.0?',
      en:'What is the concentration of a potassium hydroxide solution, KOH, which has a pH value of 12.0?'},
   o:[
    {bm:'0.01 mol dm⁻³',en:'0.01 mol dm⁻³'},
    {bm:'0.5 mol dm⁻³',en:'0.5 mol dm⁻³'},
    {bm:'1.0 mol dm⁻³',en:'1.0 mol dm⁻³'},
    {bm:'2.0 mol dm⁻³',en:'2.0 mol dm⁻³'}
   ],
   a:0,
   w:{bm:'pH = 12.0. pOH = 14 - 12 = 2. [OH⁻] = 10⁻² = 0.01 mol dm⁻³. KOH ialah alkali kuat, mengion sepenuhnya: KOH → K⁺ + OH⁻. Jadi [KOH] = [OH⁻] = 0.01 mol dm⁻³.',
      en:'pH = 12.0. pOH = 14 - 12 = 2. [OH⁻] = 10⁻² = 0.01 mol dm⁻³. KOH is a strong alkali, fully ionised: KOH → K⁺ + OH⁻. Therefore [KOH] = [OH⁻] = 0.01 mol dm⁻³.'}
  },
  // ── Q22 ──────────────────────────────────────────────────────────────────
  {n:22,uid:'trg-26-22',form:4,topic:'salt',
   q:{bm:'Seorang murid ingin menyediakan garam kuprum(II) nitrat. Beliau telah mencampurkan serbuk kuprum ke dalam larutan asid nitrik dan tiada perubahan berlaku selepas beberapa minit. Apakah yang perlu dilakukan untuk mendapatkan larutan biru kuprum(II) nitrat tanpa mengubah kepekatan asid?',
      en:'A student wants to prepare copper(II) nitrate. He mixed copper powder into nitric acid solution and no change occurred after a few minutes. What should be done to obtain a blue copper(II) nitrate solution without changing the concentration of the acid?'},
   o:[
    {bm:'Menghangatkan larutan asid nitrik terlebih dahulu',en:'Warm the nitric acid solution first'},
    {bm:'Mengacau campuran dengan kuat',en:'Stir the mixture vigorously'},
    {bm:'Menambahkan mangkin ke dalam campuran',en:'Adding a catalyst to the mixture'},
    {bm:'Menggantikan serbuk kuprum dengan serbuk kuprum(II) oksida',en:'Replacing copper powder with copper(II) oxide powder'}
   ],
   a:3,
   w:{bm:'Kuprum tidak bertindak balas dengan asid nitrik cair dalam keadaan biasa. Cuprum(II) oksida (CuO) bertindak balas dengan asid nitrik: CuO + 2HNO₃ → Cu(NO₃)₂ + H₂O, menghasilkan larutan biru tanpa mengubah kepekatan asid (asid digunakan sepenuhnya). Memanaskan tidak membantu kerana Cu masih tidak bertindak balas dengan HNO₃ cair.',
      en:'Copper does not react with dilute nitric acid under normal conditions. Copper(II) oxide (CuO) reacts with nitric acid: CuO + 2HNO₃ → Cu(NO₃)₂ + H₂O, producing a blue solution without changing the acid concentration (acid is fully consumed). Heating does not help because Cu still does not react with dilute HNO₃.'}
  },
  // ── Q23 ──────────────────────────────────────────────────────────────────
  {n:23,uid:'trg-26-23',form:4,topic:'rate',
   q:{bm:'Jadual 23 menunjukkan jumlah isipadu gas hidrogen yang dikumpul pada sela masa yang sekata bagi tindak balas antara zink dan asid hidroklorik cair.\n\nMasa (min) | Isipadu gas H₂ (cm³)\n0.0 | 0.00\n0.5 | 8.00\n1.0 | 14.50\n1.5 | 20.50\n2.0 | 24.00\n2.5 | 26.50\n3.0 | 26.50\n3.5 | 26.50\n\nHitungkan kadar tindak balas purata.',
      en:'Table 23 shows the total volume of hydrogen gas collected at regular intervals for the reaction between zinc and dilute hydrochloric acid.\n\nTime (min) | Total vol H₂ (cm³)\n0.0 | 0.00\n0.5 | 8.00\n1.0 | 14.50\n1.5 | 20.50\n2.0 | 24.00\n2.5 | 26.50\n3.0 | 26.50\n3.5 | 26.50\n\nCalculate the average rate of reaction.'},
   o:[
    {bm:'0.10 cm³ min⁻¹',en:'0.10 cm³ min⁻¹'},
    {bm:'7.60 cm³ min⁻¹',en:'7.60 cm³ min⁻¹'},
    {bm:'10.60 cm³ min⁻¹',en:'10.60 cm³ min⁻¹'},
    {bm:'37.40 cm³ min⁻¹',en:'37.40 cm³ min⁻¹'}
   ],
   a:2,
   w:{bm:'Tindak balas selesai pada t=2.5 min (isipadu tidak berubah selepas itu = 26.50 cm³). Kadar purata = jumlah isipadu / jumlah masa = 26.50 / 2.5 = 10.60 cm³ min⁻¹.',
      en:'Reaction is complete at t=2.5 min (volume does not change after that = 26.50 cm³). Average rate = total volume / total time = 26.50 / 2.5 = 10.60 cm³ min⁻¹.'}
  },
  // ── Q24 ──────────────────────────────────────────────────────────────────
  {n:24,uid:'trg-26-24',form:4,topic:'pt',
   q:{bm:'Tindak balas penyesaran berikut berlaku: X₂ + 2KBr → 2KX + Br₂. Unsur X berada dalam Kumpulan 17 dalam Jadual Berkala Unsur. Apakah yang dapat diperhatikan jika unsur X digantikan dengan iodin?',
      en:'The following displacement reaction occurs: X₂ + 2KBr → 2KX + Br₂. Element X is in Group 17 in the Periodic Table of Elements. What can be observed if element X is replaced with iodine?'},
   o:[
    {bm:'Gas perang terhasil',en:'Brown gas is produced'},
    {bm:'Larutan tidak berwarna terhasil',en:'Colourless solutions are produced'},
    {bm:'Tiada perubahan dapat diperhatikan',en:'No change is observed'},
    {bm:'Warna perang larutan iodin dinyahwarnakan',en:'Brown colour of the iodine is decolourized'}
   ],
   a:2,
   w:{bm:'Dalam Kumpulan 17, kereaktifan menurun ke bawah kumpulan: F₂ > Cl₂ > Br₂ > I₂. Iodin (I₂) kurang reaktif daripada bromin (Br₂). Halogen lebih rendah tidak boleh menyesarkan halida yang lebih tinggi. I₂ tidak boleh menyesarkan Br⁻ daripada KBr → tiada tindak balas → tiada perubahan.',
      en:'In Group 17, reactivity decreases down the group: F₂ > Cl₂ > Br₂ > I₂. Iodine (I₂) is less reactive than bromine (Br₂). A less reactive halogen cannot displace a more reactive halide. I₂ cannot displace Br⁻ from KBr → no reaction → no change observed.'}
  },
  // ── Q25 ──────────────────────────────────────────────────────────────────
  {n:25,uid:'trg-26-25',form:5,topic:'electroch',
   img:'img/kimia/91d578786d59.webp',
   alt:{bm:'Rajah 25: sel kimia — logam L dan logam P dicelup dalam larutan natrium klorida, disambung oleh voltmeter. Logam L lebih elektropositif daripada logam P.',
        en:'Diagram 25: chemical cell — metal L and metal P dipped in sodium chloride solution, connected by voltmeter. Metal L is more electropositive than metal P.'},
   q:{bm:'Antara yang berikut, proses manakah yang betul berlaku di L dan P?',
      en:'Which of the following is the correct process that occurs at L and P?'},
   o:[
    {bm:'L: Kehilangan oksigen | P: Menerima oksigen',en:'L: Loss oxygen | P: Gain oxygen'},
    {bm:'L: Menerima hidrogen | P: Kehilangan hidrogen',en:'L: Gain hydrogen | P: Loss hydrogen'},
    {bm:'L: Menerima elektron | P: Kehilangan elektron',en:'L: Gain electron | P: Loss electron'},
    {bm:'L: Pertambahan nombor pengoksidaan | P: Pengurangan nombor pengoksidaan',en:'L: Increase oxidation number | P: Decrease oxidation number'}
   ],
   a:3,
   w:{bm:'L lebih elektropositif → L lebih mudah mengion → L bertindak sebagai anod (pengoksidaan): L → L^n⁺ + ne⁻. Nombor pengoksidaan L bertambah. P bertindak sebagai katod (penurunan): ion dari larutan menerima elektron di P. Nombor pengoksidaan P berkurang. Elektron tidak mengalir "melalui" larutan — mereka mengalir melalui dawai luar dari L ke P.',
      en:'L is more electropositive → L ionises more easily → L acts as anode (oxidation): L → L^n⁺ + ne⁻. Oxidation number of L increases. P acts as cathode (reduction): ions from solution receive electrons at P. Oxidation number of P decreases. Electrons do not flow "through" the solution — they flow through the external wire from L to P.'}
  },
  // ── Q26 ──────────────────────────────────────────────────────────────────
  {n:26,uid:'trg-26-26',form:5,topic:'carbon',
   q:{bm:'Persamaan berikut mewakili satu proses untuk menghasilkan C₂H₄ dan M: C₇H₁₆ → (Al₂O₃/SiO₂) → C₂H₄ + M. Apakah formula struktur bagi M?',
      en:'The following equation represents a process to produce C₂H₄ and M: C₇H₁₆ → (Al₂O₃/SiO₂) → C₂H₄ + M. What is the structural formula of M?'},
   o:[
    {bm:'2-metilpentana (C₆H₁₄, bercabang)',en:'2-methylpentane (C₆H₁₄, branched)'},
    {bm:'Pentana (C₅H₁₂, rantai lurus)',en:'Pentane (C₅H₁₂, straight chain)'},
    {bm:'But-1-ena (C₄H₈, ikatan ganda dua terminal)',en:'But-1-ene (C₄H₈, terminal double bond)'},
    {bm:'Pent-2-una (C₅H₈, ikatan triple)',en:'Pent-2-yne (C₅H₈, triple bond)'}
   ],
   a:1,
   w:{bm:'C₇H₁₆ (heptana) dipecahkan secara peretakan (cracking). C dalam M = 7-2 = 5. H dalam M = 16-4 = 12. M = C₅H₁₂ = pentana (alkana tepu, rantai lurus). Pilihan B (rantai lurus, 5C, tepu) adalah tepat. Proses ini = peretakan bermangkin (catalytic cracking).',
      en:'C₇H₁₆ (heptane) is broken by cracking. C in M = 7-2 = 5. H in M = 16-4 = 12. M = C₅H₁₂ = pentane (saturated alkane, straight chain). Option B (straight chain, 5C, saturated) is correct. This process = catalytic cracking.'}
  },
  // ── Q27 ──────────────────────────────────────────────────────────────────
  {n:27,uid:'trg-26-27',form:4,topic:'thermo',
   q:{bm:'Persamaan berikut mewakili satu tindak balas penyesaran: R + QSO₄ → RSO₄ + Q, ΔH = -90 kJ mol⁻¹. Penyataan manakah betul tentang tindak balas itu?',
      en:'The following equation represents a displacement reaction: R + QSO₄ → RSO₄ + Q, ΔH = -90 kJ mol⁻¹. Which statement is correct about the reaction?'},
   o:[
    {bm:'Suhu menurun semasa tindak balas',en:'The temperature decreases during the reaction'},
    {bm:'90 kJ haba diperlukan untuk memulakan tindak balas',en:'90 kJ of heat is needed to start the reaction'},
    {bm:'Tindak balas itu membebaskan haba',en:'The reaction releases heat'},
    {bm:'Jumlah kandungan tenaga bahan tindak balas lebih rendah daripada hasil tindak balas',en:'The total energy content of reactants is lower than the products'}
   ],

   w:{bm:'ΔH = -90 kJ mol⁻¹ (nilai negatif) → tindak balas EKSOTERMIK. Haba dibebaskan ke persekitaran → suhu campuran tindak balas MENINGKAT. Kandungan tenaga hasil tindak balas LEBIH RENDAH daripada bahan tindak balas (tenaga dibebaskan).',

  // ── Q28 ──────────────────────────────────────────────────────────────────
  {n:28,uid:'trg-26-28',form:5,topic:'polymer',
   q:{bm:'Rajah 28 menunjukkan formula struktur suatu monomer (CH₂=CHCl). Antara berikut, yang manakah persamaan antara monomer tersebut dengan polimernya (PVC)?',

   o:[
    {bm:'Formula molekul ialah C₂H₃Cl',en:'Molecular formula is C₂H₃Cl'},
    {bm:'Mempunyai ikatan ganda dua antara atom-atom karbon',en:'Have double bond between carbon atoms'},
    {bm:'Mempunyai atom karbon, atom hidrogen dan atom klorin',en:'Contain carbon atoms, hydrogen atoms and chlorine atoms'},
    {bm:'Bilangan atom karbon dalam molekul',en:'Number of carbon atoms in the molecule'}
   ],
   a:2,
   w:{bm:'Monomer CH₂=CHCl (C₂H₃Cl) dan polimernya PVC [–CH₂–CHCl–]ₙ SAMA-SAMA mengandungi atom karbon, hidrogen dan klorin. Ikatan ganda dua (pilihan B) wujud dalam monomer SAHAJA — polimer tidak mempunyai C=C (ikatan ganda dua terputus semasa pempolimeran). Formula molekul: monomer=C₂H₃Cl, polimer=(C₂H₃Cl)ₙ — berbeza.',
      en:'Monomer CH₂=CHCl (C₂H₃Cl) and its polymer PVC [–CH₂–CHCl–]ₙ BOTH contain carbon, hydrogen and chlorine atoms. Double bond (option B) exists in the monomer ONLY — polymer has no C=C (double bond breaks during polymerisation). Molecular formula: monomer=C₂H₃Cl, polymer=(C₂H₃Cl)ₙ — different.'}
  },
  // ── Q29 ──────────────────────────────────────────────────────────────────
  {n:29,uid:'trg-26-29',form:5,topic:'polymer',
   q:{bm:'Seorang penoreh getah menghadapi masalah lateks menggumpal. Untuk menyelesaikan masalah itu, beliau perlu menambahkan suatu bahan ke dalam lateks itu. Pilih bahan dan penerangan yang betul untuk menyelesaikan masalah itu.',
      en:'A rubber tapper faces a problem of coagulated latex. To solve the problem, he must add a substance into the latex. Choose the correct substance and explanation to solve the problem.'},
   o:[
    {bm:'Air — menjadikan lateks lebih cair',en:'Water — to make the latex more dilute'},
    {bm:'Asid etanoik — mengandungi ion H⁺ yang meneutralkan cas negatif pada membran zarah getah',en:'Ethanoic acid — contains H⁺ ion that neutralises the negative charge on the rubber particle membrane'},
    {bm:'Larutan natrium klorida — menjadi pengawet untuk mengekalkan keadaan asal lateks',en:'Sodium chloride solution — as a preservative to maintain the original state of latex'},
    {bm:'Larutan ammonia — mengandungi ion OH⁻ yang meneutralkan ion H⁺ daripada asid laktik',en:'Ammonia solution — contains OH⁻ ion that neutralises H⁺ ion from lactic acid'}
   ],
   a:3,
   w:{bm:'Lateks menggumpal apabila asid laktik (H⁺) dihasilkan oleh bakteria menurunkan pH dan meneutralkan cas negatif pada zarah getah. Larutan ammonia (alkali) mengandungi OH⁻ yang meneutralkan H⁺ daripada asid laktik → pH naik → cas negatif dipulihkan → zarah tidak bergumpal. Ammonia adalah pengawet standard untuk lateks.',
      en:'Latex coagulates when lactic acid (H⁺) produced by bacteria lowers the pH and neutralises the negative charge on rubber particles. Ammonia solution (alkali) contains OH⁻ that neutralises H⁺ from lactic acid → pH rises → negative charge restored → particles do not coagulate. Ammonia is the standard latex preservative.'}
  },
  // ── Q30 ──────────────────────────────────────────────────────────────────
  {n:30,uid:'trg-26-30',form:5,topic:'consumer',
   q:{bm:'Jadual 30 menunjukkan maklumat label tiga jenis makanan. X, Y dan Z ialah bahan tambah makanan. Aiskrim vanila: berperisa dan lembut, mengandungi susu, vanila, gula, pewarna tiruan, bahan tambah X. Nanas dalam sirap: manis dan tradisional, kepingan nanas segar, bahan tambah Y. Sos tomato: sedap dan tahan lama, tomato, garam, gula, pewarna tiruan, pewarna makanan Z.\n\nAntara berikut yang manakah merupakan nama bahan tambah makanan yang betul?',
      en:'Table 30 shows food label information for three types of food. X, Y and Z are food additives. Vanilla ice cream: flavorful and soft, milk, vanilla, sugar, artificial coloring, additive X. Pineapple in syrup: sweet and traditional, fresh pineapple, additive Y. Tomato sauce: delicious and long-lasting, tomatoes, salt, sugar, artificial coloring, food coloring Z.\n\nWhich of the following is the correct name of the food additive?'},
   o:[
    {bm:'X=Gula, Y=Asid benzoik, Z=Pektin',en:'X=Sugar, Y=Benzoic acid, Z=Pectin'},
    {bm:'X=Asid benzoik, Y=Pektin, Z=Gula',en:'X=Benzoic acid, Y=Pectin, Z=Sugar'},
    {bm:'X=Pektin, Y=Gula, Z=Asid benzoik',en:'X=Pectin, Y=Sugar, Z=Benzoic acid'},
    {bm:'X=Gula, Y=Asid benzoik, Z=Pektin',en:'X=Sugar, Y=Benzoic acid, Z=Pectin'}
   ],
   a:2,
   w:{bm:'X=Pektin (penstabil/pengemulsi yang menjadikan aiskrim "lembut"). Y=Gula (pemanis semulajadi daripada sumber asli untuk nanas dalam sirap). Z=Asid benzoik (bahan pengawet yang memanjangkan hayat sos tomato, "tahan lama"). Pektin adalah polisakarida semulajadi dalam buah-buahan.',
      en:'X=Pectin (stabiliser/emulsifier that makes ice cream "soft"). Y=Sugar (natural sweetener from natural sources for pineapple in syrup). Z=Benzoic acid (preservative that extends the shelf life of tomato sauce, "long-lasting"). Pectin is a natural polysaccharide found in fruits.'}
  },
  // ── Q31 ──────────────────────────────────────────────────────────────────
  {n:31,uid:'trg-26-31',form:4,topic:'salt',
   q:{bm:'Satu sebatian baja fosfat membentuk sebatian dengan formula MPO₄. Apakah formula kimia yang terhasil sekiranya M membentuk sebatian baja nitrat?',
      en:'A phosphate fertilizer compound forms a compound with the formula MPO₄. What is the resulting chemical formula if M forms a nitrate fertilizer compound?'},
   o:[
    {bm:'MNO₃',en:'MNO₃'},
    {bm:'M₂NO₃',en:'M₂NO₃'},
    {bm:'M(NO₃)₃',en:'M(NO₃)₃'},
    {bm:'M₂(NO₃)₃',en:'M₂(NO₃)₃'}
   ],
   a:2,
   w:{bm:'Dalam MPO₄: PO₄³⁻ mempunyai cas -3. Untuk mengimbangi: M mesti mempunyai cas +3 (M³⁺). Dengan NO₃⁻ (cas -1): M³⁺ memerlukan 3 ion NO₃⁻ → M(NO₃)₃.',
      en:'In MPO₄: PO₄³⁻ has charge -3. To balance: M must have charge +3 (M³⁺). With NO₃⁻ (charge -1): M³⁺ needs 3 NO₃⁻ ions → M(NO₃)₃.'}
  },
  // ── Q32 ──────────────────────────────────────────────────────────────────
  {n:32,uid:'trg-26-32',form:5,topic:'electroch',
   img:'img/kimia/db9607cefa2a.webp',
   alt:{bm:'Rajah 32: tangki elektrolisis untuk mengekstrak aluminium — anod karbon (atas), katod karbon (dalam), campuran leburan Al₂O₃ (500 kg) dan Na₃AlF₆, leburan aluminium mengalir keluar',
        en:'Diagram 32: electrolytic tank to extract aluminium — carbon anode (top), carbon cathode (inside), mixture of molten Al₂O₃ (500 kg) and Na₃AlF₆, molten aluminium flows out'},
   q:{bm:'Apakah jisim aluminium yang diekstrak? [Jisim atom relatif: O = 16, Al = 27]',
      en:'What is the mass of aluminium extracted? [Relative atomic mass: O = 16, Al = 27]'},
   o:[
    {bm:'4.902 kg',en:'4.902 kg'},
    {bm:'102.00 kg',en:'102.00 kg'},
    {bm:'264.708 kg',en:'264.708 kg'},
    {bm:'529.419 kg',en:'529.419 kg'}
   ],
   a:2,
   w:{bm:'2Al₂O₃ → 4Al + 3O₂. Jisim molar Al₂O₃ = 2(27)+3(16) = 102 g/mol. Mol Al₂O₃ = 500 000/102 = 4901.96 mol. Mol Al = 2 × 4901.96 = 9803.92 mol. Jisim Al = 9803.92 × 27 = 264 706 g = 264.708 kg.',
      en:'2Al₂O₃ → 4Al + 3O₂. Molar mass Al₂O₃ = 2(27)+3(16) = 102 g/mol. Mol Al₂O₃ = 500 000/102 = 4901.96 mol. Mol Al = 2 × 4901.96 = 9803.92 mol. Mass Al = 9803.92 × 27 = 264 706 g = 264.708 kg.'}
  },
  // ── Q33 ──────────────────────────────────────────────────────────────────
  {n:33,uid:'trg-26-33',form:4,topic:'pt',
   q:{bm:'Rajah 33 menunjukkan susunan radas untuk mengkaji tindak balas dua unsur Kumpulan 1 yang berturutan (L dan M) dengan air. Unsur-unsur tersebut dimasukkan ke dalam besen berisi air secara berasingan. Apakah yang dapat diperhatikan?',
      en:'Diagram 33 shows the apparatus to study the reaction of two consecutive Group 1 elements (L and M) with water. The elements are put into basins containing water separately. What can be observed?'},
   o:[
    {bm:'L: menukarkan warna metil jingga menjadi merah | M: menukarkan warna metil jingga menjadi kuning',
     en:'L: turns methyl orange to red | M: turns methyl orange to yellow'},
    {bm:'L: terbakar di atas permukaan air dengan nyalaan ungu | M: terbakar di atas permukaan air dengan nyalaan kuning',
     en:'L: burns on water surface with purple flame | M: burns on water surface with yellow flame'},
    {bm:'L: bergerak perlahan di atas permukaan air | M: bergerak cergas di atas permukaan air',
     en:'L: moves slowly on water surface | M: moves vigorously on water surface'},
    {bm:'L: menghasilkan bunyi "hiss" | M: menghasilkan bunyi "hiss"',
     en:'L: produces \'hiss\' sound | M: produces \'hiss\' sound'}
   ],
   a:1,
   w:{bm:'Dua unsur Kumpulan 1 yang berturutan: K (kalium, Kumpulan 1 Kala 4) dan Na (natrium, Kumpulan 1 Kala 3). L = K: terbakar dengan nyalaan ungu/lilac. M = Na: terbakar dengan nyalaan kuning/oren. Pilihan A salah — kedua-dua logam Kumpulan 1 menghasilkan larutan alkali (OH⁻ dihasilkan), bukan berasid. Metil jingga akan bertukar KUNING (alkali), bukan merah.',
      en:'Two consecutive Group 1 elements: K (potassium, Group 1 Period 4) and Na (sodium, Group 1 Period 3). L = K: burns with purple/lilac flame. M = Na: burns with yellow/orange flame. Option A is wrong — both Group 1 metals produce alkaline solutions (OH⁻ formed), not acidic. Methyl orange would turn YELLOW (alkaline), not red.'}
  },
  // ── Q34 ──────────────────────────────────────────────────────────────────
  {n:34,uid:'trg-26-34',form:4,topic:'salt',
   q:{bm:'Jadual 34 menunjukkan pemerhatian bagi empat ujian ke atas larutan X.\n\nI: + HNO₃ cair + AgNO₃ → mendakan putih\nII: + NaOH berlebihan → mendakan putih larut dalam NaOH berlebihan\nIII: + NH₃ berlebihan → mendakan putih tidak larut dalam NH₃ berlebihan\nIV: + KI → tiada mendakan\n\nApakah X?',
      en:'Table 34 shows observations of four tests on solution X.\n\nI: + dilute HNO₃ + AgNO₃ → white precipitate\nII: + excess NaOH → white precipitate dissolves in excess NaOH\nIII: + excess NH₃ → white precipitate does not dissolve in excess NH₃\nIV: + KI → no precipitate\n\nWhat is X?'},
   o:[
    {bm:'Aluminium sulfat',en:'Aluminium sulphate'},
    {bm:'Aluminium klorida',en:'Aluminium chloride'},
    {bm:'Zink sulfat',en:'Zinc sulphate'},
    {bm:'Zink klorida',en:'Zinc chloride'}
   ],
   a:1,
   w:{bm:'Ujian I: mendakan putih dengan HNO₃+AgNO₃ = AgCl → ion Cl⁻ hadir. Ujian II: mendakan putih larut dalam NaOH berlebihan = Al(OH)₃ larut membentuk [Al(OH)₄]⁻ → ion Al³⁺ hadir. Ujian III: mendakan putih tidak larut dalam NH₃ berlebihan = Al(OH)₃ (berbeza dari Zn(OH)₂ yang larut dalam NH₃). Ujian IV: tiada mendakan dengan KI = bukan Pb²⁺. Jadi X = Al³⁺ + Cl⁻ = AlCl₃ = aluminium klorida.',
      en:'Test I: white precipitate with HNO₃+AgNO₃ = AgCl → Cl⁻ present. Test II: white precipitate dissolves in excess NaOH = Al(OH)₃ dissolves to form [Al(OH)₄]⁻ → Al³⁺ present. Test III: white precipitate insoluble in excess NH₃ = Al(OH)₃ (unlike Zn(OH)₂ which dissolves in NH₃). Test IV: no precipitate with KI = not Pb²⁺. Therefore X = Al³⁺ + Cl⁻ = AlCl₃ = aluminium chloride.'}
  },
  // ── Q35 ──────────────────────────────────────────────────────────────────
  {n:35,uid:'trg-26-35',form:4,topic:'mole',
   q:{bm:'Apabila 0.3 g serbuk magnesium bertindak balas dengan 20 cm³ asid sulfurik 0.5 mol dm⁻³, terdapat sebahagian serbuk magnesium yang tidak bertindak balas. Berapakah isipadu asid sulfurik yang perlu ditambah untuk memastikan semua serbuk magnesium bertindak balas lengkap? [Jisim atom relatif: Mg = 24]',
      en:'When 0.3 g of magnesium powder reacts with 20 cm³ of 0.5 mol dm⁻³ sulphuric acid, some magnesium powder does not react. What volume of sulphuric acid must be added to ensure all magnesium powder reacts completely? [Relative atomic mass: Mg = 24]'},
   o:[
    {bm:'5.0 cm³',en:'5.0 cm³'},
    {bm:'10.0 cm³',en:'10.0 cm³'},
    {bm:'15.0 cm³',en:'15.0 cm³'},
    {bm:'25.0 cm³',en:'25.0 cm³'}
   ],
   a:0,
   w:{bm:'Persamaan: Mg + H₂SO₄ → MgSO₄ + H₂ (nisbah 1:1). Mol Mg = 0.3/24 = 0.0125 mol. Mol H₂SO₄ yang diperlukan = 0.0125 mol. Mol H₂SO₄ yang ada = 0.5×0.020 = 0.010 mol (asid adalah pengehad). Mol H₂SO₄ tambahan = 0.0125-0.010 = 0.0025 mol. Isipadu tambahan = 0.0025/0.5 = 0.005 dm³ = 5.0 cm³.',
      en:'Equation: Mg + H₂SO₄ → MgSO₄ + H₂ (1:1 ratio). Mol Mg = 0.3/24 = 0.0125 mol. Mol H₂SO₄ needed = 0.0125 mol. Mol H₂SO₄ available = 0.5×0.020 = 0.010 mol (acid is limiting). Additional mol H₂SO₄ = 0.0125-0.010 = 0.0025 mol. Additional volume = 0.0025/0.5 = 0.005 dm³ = 5.0 cm³.'}
  },
  // ── Q36 ──────────────────────────────────────────────────────────────────
  {n:36,uid:'trg-26-36',form:5,topic:'electroch',
   q:{bm:'Rajah 36 menunjukkan susunan radas bagi elektrolisis larutan kuprum(II) sulfat menggunakan elektrod karbon. Keamatan warna biru larutan kuprum(II) sulfat didapati berkurang. Antara yang berikut, yang manakah menerangkan pemerhatian itu?',
      en:'Diagram 36 shows the apparatus setup for the electrolysis of copper(II) sulphate solution using carbon electrodes. The intensity of the blue colour of copper(II) sulphate is decreasing. Which of the following explains this observation?'},
   o:[
    {bm:'Ion OH⁻ dinyahcas di anod',en:'OH⁻ ion is discharged at the anode'},
    {bm:'Ion SO₄²⁻ dinyahcas di anod',en:'SO₄²⁻ ion is discharged at the anode'},
    {bm:'Ion H⁺ dinyahcas di katod',en:'H⁺ ion is discharged at the cathode'},
    {bm:'Ion Cu²⁺ dinyahcas di katod',en:'Cu²⁺ ion is discharged at the cathode'}
   ],
   a:3,
   w:{bm:'Warna biru larutan CuSO₄ disebabkan oleh ion Cu²⁺ (aq). Di katod: Cu²⁺ + 2e⁻ → Cu (logam kuprum terenap). Ion Cu²⁺ berkurang dalam larutan → larutan menjadi kurang biru. Di anod (karbon): OH⁻ dinyahcas → O₂ dibebaskan.',
      en:'The blue colour of CuSO₄ solution is due to Cu²⁺ (aq) ions. At cathode: Cu²⁺ + 2e⁻ → Cu (copper metal deposits). Cu²⁺ ions decrease in solution → solution becomes less blue. At anode (carbon): OH⁻ is discharged → O₂ is released.'}
  },

        en:'Diagram 37: four structural formulas — I: n-butane (straight 4C saturated); II: 2-methylpropane (branched 4C saturated); III: but-1-ene (4C, 2 fewer H than I); IV: but-2-ene (4C, internal double bond)'},
