        {bm:'Kaca borosilikat',en:'Borosilicate glass'},
        {bm:'Kaca fotokromik', en:'Photochromic glass'} ],
    a:2,
    w:{ bm:'Periuk memasak perlu tahan <b>kejutan haba</b> — <b>kaca borosilikat</b> (Pyrex) mempunyai pengembangan haba sangat rendah dan tidak meretak apabila dipanaskan ✓. Kaca soda kapur meretak; kaca plumbum untuk kristal hiasan; fotokromik untuk kanta.',
        en:'Cookware must survive <b>thermal shock</b> — <b>borosilicate glass</b> (Pyrex) has a very low thermal expansion and does not crack on heating ✓. Soda lime glass cracks; lead glass is for decorative crystal; photochromic glass is for lenses.' } },

  { n:27, topic:'REDOX',
    q:{ bm:'Antara berikut, langkah yang manakah perlu dilakukan untuk mendapatkan hasil penyaduran yang baik?',
        en:'Which of the following steps should be taken to obtain good electroplating results?' },
    o:[ {bm:'Menggunakan arus voltan tinggi secara berterusan',                       en:'Use high voltage continuously'},
        {bm:'Menggunakan elektrolit dengan kepekatan yang tinggi',                    en:'Use electrolyte with high concentration'},
        {bm:'Putar objek yang ingin disadur sepanjang masa penyaduran dijalankan',    en:'Rotate the object being electroplated throughout the process'},
        {bm:'Menyambungkan objek yang ingin disadur pada terminal positif bateri',    en:'Connect the object to be electroplated to the positive terminal of the battery'} ],
    a:2,
    w:{ bm:'Saduran sekata memerlukan arus <b>rendah</b>, elektrolit <b>cair</b>, dan objek <b>diputar</b> supaya logam terenap rata di semua permukaan ✓. Arus/kepekatan tinggi memberi saduran kasar; objek mesti di terminal <b>negatif</b> (katod), bukan positif (D ✗).',

  { n:28, topic:'POLYMER',
    q:{ bm:'Rajah 6 menunjukkan formula struktur suatu monomer: CH₂=CCl−H (kloroetena — H dan Cl pada satu karbon, H dan H pada karbon lagi satu, dengan ikatan ganda dua C=C). Antara berikut, yang manakah persamaan antara monomer tersebut dengan polimernya?',

        {bm:'Bilangan atom karbon dalam molekul',                        en:'The number of carbon atoms in the molecule'},

    a:3,
    w:{ bm:'Monomer dan polimer (PVC) sama-sama mengandungi <b>atom C, H dan Cl</b> ✓. Formula molekul polimer ialah (C₂H₃Cl)ₙ — berbeza (A ✗); bilangan karbon berganda n kali (B ✗); ikatan C=C <b>terbuka</b> semasa pempolimeran penambahan (C ✗).',
        en:'The monomer and its polymer (PVC) both contain <b>C, H and Cl atoms</b> ✓. The polymer’s molecular formula is (C₂H₃Cl)ₙ — different (A ✗); the carbon count is n-fold (B ✗); the C=C bond <b>opens up</b> during addition polymerisation (C ✗).' } },

  { n:29, topic:'CONSUMER',
    q:{ bm:'Seorang pesakit menunjukkan gejala dapat melihat atau mendengar perkara yang tidak nyata. Antara ubat berikut, yang manakah sesuai diambil oleh pesakit tersebut?',

        {bm:'Prednisolone',  en:'Prednisolone'},
        {bm:'Klorpromazin',  en:'Chlorpromazine'} ],
    a:3,
    w:{ bm:'Halusinasi ialah gejala <b>psikosis</b> — dirawat dengan ubat psikoterapeutik <b>klorpromazin</b> (antipsikotik) ✓. Streptomisin antibiotik, antihistamin untuk alahan, prednisolone kortikosteroid anti-radang.',
        en:'Hallucinations are a symptom of <b>psychosis</b> — treated with the psychotherapeutic drug <b>chlorpromazine</b> (an antipsychotic) ✓. Streptomycin is an antibiotic, antihistamines treat allergies, prednisolone is an anti-inflammatory corticosteroid.' } },

  { n:30, topic:'THERMO',
    q:{ bm:'Jadual 3 menunjukkan haba pembakaran bagi empat jenis alkohol: W (CH₃OH) −710 · X (C₂H₅OH) −1370 · Y (C₃H₇OH) −2020 · Z (C₄H₉OH) −2670 kJ mol⁻¹. Antara berikut, pernyataan manakah yang menerangkan perbezaan nilai haba pembakaran dari alkohol W ke alkohol Z?',
        en:'Table 3 shows the heat of combustion for four alcohols: W (CH₃OH) −710 · X (C₂H₅OH) −1370 · Y (C₃H₇OH) −2020 · Z (C₄H₉OH) −2670 kJ mol⁻¹. Which of the following statements explains the difference in heat of combustion from alcohol W to alcohol Z?' },
    o:[ {bm:'Panjang rantai karbon bertambah',                              en:'The length of the carbon chain increases'},
        {bm:'Bilangan atom karbon per molekul bertambah',                   en:'The number of carbon atoms per molecule increases'},
        {bm:'Bilangan atom hidrogen per molekul bertambah',                 en:'The number of hydrogen atoms per molecule increases'},

    w:{ bm:'Ikatan datif: <b>kedua-dua</b> elektron datang daripada satu penderma. Ion H⁺ tiada elektron langsung — <b>atom oksigen</b> dalam air menderma satu pasangan elektron tersendiri ✓.',
        en:'In a dative bond <b>both</b> electrons come from one donor. The H⁺ ion has no electrons at all — the <b>oxygen atom</b> in water donates one of its lone pairs ✓.' } },

  { n:7, topic:'ACID',
    q:{ bm:'Antara pernyataan berikut, yang manakah paling tepat menjelaskan mengapa pepejal asid oksalik tidak bertindak balas dengan pita magnesium?',
        en:'Which of the following statements best explains why solid oxalic acid does not react with magnesium ribbon?' },
    o:[ {bm:'Asid oksalik adalah asid lemah',                          en:'Oxalic acid is a weak acid'},
        {bm:'Ion hidrogen tidak wujud tanpa kehadiran air',            en:'Hydrogen ions are not present in the absence of water'},
        {bm:'Pita magnesium ditutup dengan lapisan oksida',            en:'The magnesium ribbon is covered with an oxide layer'},
        {bm:'Suhu terlalu rendah untuk memulakan tindak balas',        en:'The temperature is too low to start the reaction'} ],
    a:1,
    w:{ bm:'Sifat keasidan hanya muncul apabila asid <b>larut dalam air</b> dan mengion membebaskan <b>H⁺</b>. Pepejal kering tiada air → tiada ion H⁺ → tiada tindak balas dengan Mg ✓.',
        en:'Acidic properties only appear when the acid is <b>dissolved in water</b> and ionises to release <b>H⁺</b>. A dry solid has no water → no H⁺ ions → no reaction with Mg ✓.' } },

  { n:8, topic:'RATE',
    q:{ bm:'Unit yang manakah biasanya digunakan untuk menyatakan kadar tindak balas bagi proses yang menghasilkan gas?',
        en:'Which unit is commonly used to express the rate of reaction for a process that produces gas?' },
    o:[ {bm:'mol dm⁻³', en:'mol dm⁻³'},
        {bm:'g mol⁻¹',  en:'g mol⁻¹'},
        {bm:'cm³ s⁻¹',  en:'cm³ s⁻¹'},
        {bm:'g s⁻¹',    en:'g s⁻¹'} ],
    a:2,
    w:{ bm:'Bagi gas, kuantiti yang diukur ialah <b>isi padu</b> — kadar = isi padu per masa = <b>cm³ s⁻¹</b> ✓. g s⁻¹ untuk perubahan jisim; mol dm⁻³ kepekatan; g mol⁻¹ jisim molar.',
        en:'For a gas the measured quantity is <b>volume</b> — rate = volume per time = <b>cm³ s⁻¹</b> ✓. g s⁻¹ tracks mass change; mol dm⁻³ is concentration; g mol⁻¹ is molar mass.' } },

  { n:9, topic:'INDUSTRY',
    q:{ bm:'Bahan yang manakah ditambah kepada kaca untuk memberikannya indeks biasan yang tinggi?',
        en:'Which substance is added to glass to give it a high refractive index?' },
    o:[ {bm:'Boron trioksida',    en:'Boron trioxide'},
        {bm:'Kalsium karbonat',   en:'Calcium carbonate'},
        {bm:'Magnesium oksida',   en:'Magnesium oxide'},
        {bm:'Plumbum(II) oksida', en:'Lead(II) oxide'} ],
    a:3,
    w:{ bm:'<b>Plumbum(II) oksida</b> menghasilkan kaca kristal plumbum — indeks biasan tinggi, berkilau seperti kristal ✓. Boron trioksida untuk kaca borosilikat (tahan haba), bukan kilauan.',
        en:'<b>Lead(II) oxide</b> gives lead crystal glass — a high refractive index and brilliant sparkle ✓. Boron trioxide makes borosilicate glass (heat-resistant), not sparkle.' } },

  { n:10, topic:'INDUSTRY',
    q:{ bm:'Seorang jurutera memilih gentian optik berbanding wayar kuprum untuk rangkaian internet berkelajuan tinggi. Apakah sebab utama pemilihan tersebut?',
        en:'An engineer chooses optical fibres over copper wire for a high-speed internet network. What is the main reason for this choice?' },
    o:[ {bm:'Gentian optik menggunakan arus elektrik yang lebih tinggi untuk meningkatkan kelajuan penghantaran', en:'Optical fibres use higher electric current to increase transmission speed'},
        {bm:'Gentian optik boleh menghantar data dalam bentuk cahaya dengan kehilangan tenaga yang minimum',      en:'Optical fibres can transmit data in the form of light with minimal energy loss'},
        {bm:'Gentian optik mempunyai rintangan elektrik yang lebih rendah berbanding kuprum',                      en:'Optical fibres have lower electrical resistance than copper'},
        {bm:'Gentian optik memantulkan cahaya melalui permukaan luar gentian',                                     en:'Optical fibres reflect light along the outer surface of the fibre'} ],
    a:1,
    w:{ bm:'Gentian optik menghantar data sebagai <b>denyutan cahaya</b> melalui pantulan dalam penuh — pantas dan <b>kehilangan tenaga minimum</b> ✓. Ia tidak membawa arus elektrik langsung (A, C ✗); cahaya dipantul <b>di dalam</b> teras, bukan permukaan luar (D ✗).',
        en:'Optical fibres carry data as <b>light pulses</b> via total internal reflection — fast with <b>minimal energy loss</b> ✓. They carry no electric current at all (A, C ✗); light reflects <b>inside</b> the core, not along the outer surface (D ✗).' } },

  { n:11, topic:'REDOX',
    q:{ bm:'Rajah 4 menunjukkan suatu sel kimia: elektrod X dalam larutan zink nitrat dan elektrod Y dalam larutan argentum nitrat, dipisahkan oleh pasu berliang. Pasangan bahan manakah yang sesuai digunakan sebagai elektrod X dan Y?',
        en:'Diagram 4 shows a chemical cell: electrode X in zinc nitrate solution and electrode Y in silver nitrate solution, separated by a porous pot. Which pair of materials are suitable to be used as electrodes X and Y?' },
    o:[ {bm:'X: Zink · Y: Argentum',   en:'X: Zinc · Y: Silver'},
        {bm:'X: Argentum · Y: Zink',   en:'X: Silver · Y: Zinc'},
        {bm:'X: Karbon · Y: Karbon',   en:'X: Carbon · Y: Carbon'} ],
    a:0,
    note:'Kertas asal hanya mencetak tiga pilihan (A–C); tiada pilihan D.',
    w:{ bm:'Dalam sel kimia, setiap elektrod dimasukkan ke dalam larutan <b>ionnya sendiri</b>: zink dalam zink nitrat, argentum dalam argentum nitrat ✓ — barulah keupayaan elektrod piawai terhasil dan voltan maksimum diperoleh.',
        en:'In a chemical cell each electrode sits in a solution of <b>its own ions</b>: zinc in zinc nitrate, silver in silver nitrate ✓ — that is how the standard electrode potentials are set up and the maximum voltage obtained.' } },

  { n:12, topic:'REDOX',
    q:{ bm:'Jadual 1 menunjukkan sebahagian siri keupayaan elektrod piawai: Zn²⁺ + 2e⁻ ⇌ Zn, E° = −0.76 V; Cu²⁺ + 2e⁻ ⇌ Cu, E° = +0.34 V. Antara berikut, yang manakah agen penurunan yang paling kuat?',
        en:'Table 1 shows part of the standard electrode potential series: Zn²⁺ + 2e⁻ ⇌ Zn, E° = −0.76 V; Cu²⁺ + 2e⁻ ⇌ Cu, E° = +0.34 V. Which of the following is the strongest reducing agent?' },
    o:[ {bm:'Zn²⁺', en:'Zn²⁺'},
        {bm:'Cu²⁺', en:'Cu²⁺'},
        {bm:'Zn',   en:'Zn'},
        {bm:'Cu',   en:'Cu'} ],
    a:2,
    w:{ bm:'Agen penurunan <b>membebaskan elektron</b> — mesti bentuk logam, bukan ion. Logam dengan E° paling <b>negatif</b> paling mudah membebaskan elektron: <b>Zn</b> (−0.76 V) ✓. Ion Zn²⁺/Cu²⁺ ialah agen pengoksidaan.',
        en:'A reducing agent <b>gives away electrons</b> — it must be the metal, not the ion. The metal with the most <b>negative</b> E° releases electrons most readily: <b>Zn</b> (−0.76 V) ✓. The Zn²⁺/Cu²⁺ ions are oxidising agents.' } },

  { n:13, topic:'THERMO',
    q:{ bm:'Antara berikut, yang manakah betul mengenai tindak balas eksotermik?',
        en:'Which of the following is correct about an exothermic reaction?' },
    o:[ {bm:'Suhu persekitaran menurun',                     en:'Temperature of surroundings decreases'},
        {bm:'Haba diserap daripada persekitaran',            en:'Heat is absorbed from the surroundings'},
        {bm:'Jumlah kandungan tenaga hasil tindak balas lebih rendah daripada jumlah kandungan tenaga bahan tindak balas', en:'Total energy content of products is lower than the total energy content of reactants'},
        {bm:'Tenaga haba yang diserap untuk memutuskan ikatan dalam bahan tindak balas lebih besar berbanding tenaga haba yang dibebaskan semasa pembentukan ikatan dalam hasil tindak balas', en:'The heat energy absorbed to break the bonds in the reactants is greater than the heat energy released during the formation of the bonds in the products'} ],
    a:2,
    w:{ bm:'Eksotermik: haba <b>dibebaskan</b>, jadi tenaga hasil lebih <b>rendah</b> daripada bahan ✓. Suhu persekitaran <b>naik</b> (A ✗), haba dibebaskan bukan diserap (B ✗), dan D menerangkan tindak balas <b>endotermik</b>.',
        en:'Exothermic: heat is <b>released</b>, so the products hold <b>less</b> energy than the reactants ✓. The surroundings warm up (A ✗), heat is released not absorbed (B ✗), and D describes an <b>endothermic</b> reaction.' } },

  { n:14, topic:'CONSUMER',
    q:{ bm:'Persamaan berikut menunjukkan satu tindak balas kimia: Lemak + Natrium hidroksida → Garam natrium + Gliserol. Apakah jenis tindak balas ini?',
        en:'The following equation shows a chemical reaction: Fat + Sodium hydroxide → Sodium salt + Glycerol. What type of reaction is this?' },
    o:[ {bm:'Peneutralan',   en:'Neutralisation'},
        {bm:'Pengesteran',   en:'Esterification'},
        {bm:'Pensulfonan',   en:'Sulphonation'},
        {bm:'Saponifikasi',  en:'Saponification'} ],
    a:3,
    w:{ bm:'Lemak (ester) dididihkan dengan alkali menghasilkan <b>sabun</b> (garam natrium asid lemak) dan gliserol — <b>saponifikasi</b> (hidrolisis beralkali) ✓. Pengesteran ialah tindak balas <b>membentuk</b> ester, arah sebaliknya.',
        en:'Fat (an ester) boiled with alkali gives <b>soap</b> (the sodium salt of fatty acids) and glycerol — <b>saponification</b> (alkaline hydrolysis) ✓. Esterification is the reverse — <b>making</b> an ester.' } },

  { n:15, topic:'INDUSTRY',
    q:{ bm:'Antara berikut, yang manakah sifat grafen yang menjadikannya sesuai sebagai bahan komposit polimer?',
        en:'Which of the following properties of graphene makes it suitable as a polymer composite material?' },
    o:[ {bm:'Bersifat tidak telap',              en:'Impermeable'},
        {bm:'Luas permukaan yang tinggi',        en:'High surface area'},
        {bm:'Kekuatan mekanikal yang tinggi',    en:'High mechanical strength'},
        {bm:'Pengalir haba dan elektrik yang baik', en:'Good conductor of heat and electricity'} ],
    a:2,
    w:{ bm:'Dalam komposit polimer, grafen berperanan sebagai <b>penguat</b> — <b>kekuatan mekanikalnya yang sangat tinggi</b> menjadikan polimer lebih kuat dan ringan ✓. Kekonduksian penting untuk bateri/elektronik, bukan penguatan komposit.',
        en:'In a polymer composite, graphene acts as the <b>reinforcement</b> — its <b>very high mechanical strength</b> makes the polymer stronger and lighter ✓. Conductivity matters for batteries/electronics, not composite reinforcement.' } },

  { n:16, topic:'MOLE',
    q:{ bm:'Penguraian plumbum(II) nitrat menghasilkan plumbum(II) oksida, nitrogen dioksida dan oksigen. Antara berikut, yang manakah persamaan kimia seimbang bagi tindak balas ini?',
        en:'The decomposition of lead(II) nitrate produces lead(II) oxide, nitrogen dioxide and oxygen. Which of the following is the balanced chemical equation for the reaction?' },
    o:[ {bm:'Pb(NO₃)₂ → PbO₂ + 2NO + O₂',           en:'Pb(NO₃)₂ → PbO₂ + 2NO + O₂'},
        {bm:'Pb(NO₃)₂ → PbO + 2NO + O₃',            en:'Pb(NO₃)₂ → PbO + 2NO + O₃'},
        {bm:'2Pb(NO₃)₂ → 2PbO + 4NO₂ + O₂',         en:'2Pb(NO₃)₂ → 2PbO + 4NO₂ + O₂'},
        {bm:'3Pb(NO₃)₂ → 3PbO₂ + 6NO₂ + O₃',        en:'3Pb(NO₃)₂ → 3PbO₂ + 6NO₂ + O₃'} ],
    a:2,
    w:{ bm:'Hasilnya PbO (bukan PbO₂) dan gas perang <b>NO₂</b> (bukan NO/O₃). Semakan imbangan C: Pb 2=2, N 4=4, O 12 = 2+8+2 = 12 ✓.',
        en:'The products are PbO (not PbO₂) and brown <b>NO₂</b> gas (not NO/O₃). Balance check for C: Pb 2=2, N 4=4, O 12 = 2+8+2 = 12 ✓.' } },

  { n:17, topic:'PTABLE',
    q:{ bm:'Jadual 2 menunjukkan nombor proton bagi unsur W, X, Y dan Z: W = 3, X = 6, Y = 11, Z = 12. Antara berikut, yang manakah susunan saiz atom unsur-unsur dalam tertib <b>menaik</b>?',
        en:'Table 2 shows the proton numbers of elements W, X, Y and Z: W = 3, X = 6, Y = 11, Z = 12. Which of the following shows the arrangement of atomic size of the elements in <b>ascending</b> order?' },
    o:[ {bm:'W, X, Y, Z', en:'W, X, Y, Z'},
        {bm:'X, W, Z, Y', en:'X, W, Z, Y'},
        {bm:'Y, Z, W, X', en:'Y, Z, W, X'},
        {bm:'Z, Y, X, W', en:'Z, Y, X, W'} ],
    a:1,
    w:{ bm:'W=Li, X=C (Kala 2); Y=Na, Z=Mg (Kala 3). Merentasi kala saiz <b>mengecil</b> (C &lt; Li; Mg &lt; Na); menuruni kumpulan saiz <b>membesar</b> (Na &gt; Li). Tertib menaik: <b>X &lt; W &lt; Z &lt; Y</b> ✓.',
        en:'W=Li, X=C (Period 2); Y=Na, Z=Mg (Period 3). Across a period size <b>shrinks</b> (C &lt; Li; Mg &lt; Na); down a group it <b>grows</b> (Na &gt; Li). Ascending: <b>X &lt; W &lt; Z &lt; Y</b> ✓.' } },

  { n:18, topic:'PTABLE',
    q:{ bm:'Rajah 5 menunjukkan kaedah menyimpan satu unsur — di dalam minyak parafin dalam botol gelap. Antara yang berikut, yang manakah menerangkan mengapa kaedah ini digunakan?',
        en:'Diagram 5 shows the method used to store an element — under paraffin oil in a dark bottle. Which of the following explains why this method is used?' },
    o:[ {bm:'Unsur itu adalah toksik dan berbahaya',                            en:'The element is toxic and dangerous'},
        {bm:'Unsur itu adalah reaktif dan mudah meruap',                        en:'The element is reactive and volatile'},
        {bm:'Untuk mengelakkan daripada bertindak balas dengan cahaya matahari', en:'To avoid the reaction with sunlight'},
        {bm:'Untuk mengelakkan daripada bertindak balas dengan oksigen dalam udara', en:'To avoid the reaction with oxygen in the air'} ],
    a:3,
    w:{ bm:'Logam Kumpulan 1 (natrium, kalium) sangat reaktif — minyak parafin <b>menghalang sentuhan dengan oksigen</b> (dan wap air) dalam udara ✓, supaya logam tidak teroksida atau terbakar.',
        en:'Group 1 metals (sodium, potassium) are highly reactive — paraffin oil <b>blocks contact with oxygen</b> (and moisture) in the air ✓, so the metal cannot oxidise or ignite.' } },

  { n:19, topic:'BOND',
    q:{ bm:'Antara berikut, penyataan manakah yang benar tentang tindak balas atom magnesium dengan atom fluorin untuk membentuk magnesium fluorida? [Nombor proton: F = 9, Mg = 12]',
        en:'Which of the following statements is true about the reaction of a magnesium atom with fluorine atoms to form magnesium fluoride? [Proton number: F = 9, Mg = 12]' },
    o:[ {bm:'Satu atom magnesium menderma satu elektron kepada satu atom fluorin',  en:'One magnesium atom donates one electron to one fluorine atom'},
        {bm:'Satu atom magnesium menderma dua elektron kepada dua atom fluorin',    en:'One magnesium atom donates two electrons to two fluorine atoms'},
        {bm:'Satu atom magnesium berkongsi satu elektron dengan satu atom fluorin', en:'One magnesium atom shares one electron with one fluorine atom'},
        {bm:'Satu atom magnesium berkongsi dua elektron dengan dua atom fluorin',   en:'One magnesium atom shares two electrons with two fluorine atoms'} ],
    a:1,
    w:{ bm:'Mg (2.8.2) <b>menderma dua elektron</b> — satu kepada setiap atom F (2.7) — membentuk Mg²⁺ dan 2F⁻: sebatian ion MgF₂ ✓. Logam + bukan logam = pemindahan elektron, bukan perkongsian (C, D ✗).',
        en:'Mg (2.8.2) <b>donates two electrons</b> — one to each F atom (2.7) — forming Mg²⁺ and 2F⁻: the ionic compound MgF₂ ✓. Metal + non-metal = electron transfer, not sharing (C, D ✗).' } },

  { n:20, topic:'BOND',
    q:{ bm:'Rajah 6 menunjukkan ikatan X di antara dua molekul air — garis putus-putus antara atom H satu molekul dengan atom O molekul yang lain. Apakah ikatan X?',
        en:'Diagram 6 shows bond X between two water molecules — a dashed line between the H atom of one molecule and the O atom of the other. What is bond X?' },
    o:[ {bm:'Ikatan ion',      en:'Ionic bond'},
        {bm:'Ikatan datif',    en:'Dative bond'},
        {bm:'Ikatan kovalen',  en:'Covalent bond'},
        {bm:'Ikatan hidrogen', en:'Hydrogen bond'} ],
    a:3,
    w:{ bm:'Tarikan <b>antara molekul</b> — antara H (δ+) satu molekul air dengan O (δ−) molekul lain — ialah <b>ikatan hidrogen</b> ✓. Ikatan kovalen ialah ikatan O–H <b>di dalam</b> setiap molekul.',
        en:'The attraction <b>between molecules</b> — the H (δ+) of one water molecule to the O (δ−) of another — is a <b>hydrogen bond</b> ✓. The covalent bonds are the O–H bonds <b>within</b> each molecule.' } },

  { n:21, topic:'ACID',
    q:{ bm:'Larutan ammonia, NH₃ ialah alkali lemah. Antara pernyataan berikut, yang manakah benar tentang larutan ammonia 1.0 mol dm⁻³?',
        en:'Ammonia solution, NH₃ is a weak alkali. Which of the following statements is true about 1.0 mol dm⁻³ ammonia solution?' },
    o:[ {bm:'Kepekatan ion hidroksida, OH⁻ adalah kurang daripada 1.0 mol dm⁻³', en:'The concentration of hydroxide ions, OH⁻ is less than 1.0 mol dm⁻³'},
        {bm:'Kepekatan ion hidroksida, OH⁻ adalah 1.0 mol dm⁻³',                 en:'The concentration of hydroxide ions, OH⁻ is 1.0 mol dm⁻³'},
        {bm:'Larutan ammonia tidak mengandungi ion hidroksida, OH⁻',             en:'Ammonia solution does not contain hydroxide ions, OH⁻'} ],
    a:0,
    note:'Kertas asal hanya mencetak tiga pilihan (A–C); tiada pilihan D.',
    w:{ bm:'Alkali <b>lemah</b> hanya mengion <b>separa</b> dalam air — kebanyakan NH₃ kekal sebagai molekul, jadi [OH⁻] jauh <b>kurang</b> daripada 1.0 mol dm⁻³ ✓. Pengionan lengkap (B) hanya bagi alkali kuat.',
        en:'A <b>weak</b> alkali ionises only <b>partially</b> in water — most NH₃ stays molecular, so [OH⁻] is well <b>below</b> 1.0 mol dm⁻³ ✓. Complete ionisation (B) is for strong alkalis only.' } },

  { n:22, topic:'ACID',
    q:{ bm:'Antara pasangan bahan berikut, yang manakah paling sesuai digunakan untuk menyediakan garam plumbum(II) sulfat?',
        en:'Which of the following pairs of substances is most suitable for preparing lead(II) sulphate salt?' },
    o:[ {bm:'Logam plumbum dan asid sulfurik',              en:'Lead metal and sulphuric acid'},
        {bm:'Plumbum(II) nitrat dan natrium sulfat',        en:'Lead(II) nitrate and sodium sulphate'},
        {bm:'Plumbum(II) klorida dan asid sulfurik',        en:'Lead(II) chloride and sulphuric acid'},
        {bm:'Plumbum(II) karbonat dan magnesium sulfat',    en:'Lead(II) carbonate and magnesium sulphate'} ],
    a:1,
    w:{ bm:'PbSO₄ <b>tak terlarutkan</b> → kaedah penguraian ganda dua memerlukan <b>dua larutan terlarutkan</b>: plumbum(II) nitrat (satu-satunya garam Pb larut) + natrium sulfat ✓. PbCl₂ dan PbCO₃ tak larut (C, D ✗); Pb + H₂SO₄ terhenti oleh lapisan PbSO₄ (A ✗).',
        en:'PbSO₄ is <b>insoluble</b> → double decomposition needs <b>two soluble solutions</b>: lead(II) nitrate (the only soluble Pb salt) + sodium sulphate ✓. PbCl₂ and PbCO₃ are insoluble (C, D ✗); Pb + H₂SO₄ stalls under a PbSO₄ coating (A ✗).' } },

  { n:23, topic:'MOLE',
    q:{ bm:'Seorang murid menambahkan 50 cm³ air suling ke dalam sebuah bikar yang mengandungi 100 cm³ larutan kuprum(II) sulfat 0.5 mol dm⁻³. Antara berikut, yang manakah kekal sama selepas penambahan air tersebut?',
        en:'A student added 50 cm³ of distilled water into a beaker containing 100 cm³ of 0.5 mol dm⁻³ copper(II) sulphate solution. Which of the following remains unchanged after the addition of water?' },
    o:[ {bm:'Isi padu larutan',          en:'Volume of solution'},
        {bm:'Kemolaran larutan',         en:'Molarity of the solution'},
        {bm:'Bilangan mol zat terlarut', en:'Number of moles of solute'} ],
    a:2,
    note:'Kertas asal hanya mencetak tiga pilihan (A–C); tiada pilihan D.',
    w:{ bm:'Pencairan menambah <b>air sahaja</b> — zarah CuSO₄ tidak bertambah atau berkurang, jadi <b>bilangan mol zat terlarut kekal</b> (0.05 mol) ✓. Isi padu naik ke 150 cm³ dan kemolaran turun ke 0.33 mol dm⁻³.',
        en:'Dilution adds <b>only water</b> — no CuSO₄ particles are added or removed, so the <b>moles of solute stay the same</b> (0.05 mol) ✓. The volume rises to 150 cm³ and the molarity drops to 0.33 mol dm⁻³.' } },

  { n:24, topic:'RATE',
    q:{ bm:'Rajah 7 menunjukkan dua jenis periuk yang digunakan untuk memasak sup kambing — periuk biasa (3 jam) dan periuk tekanan (40 minit); kedua-duanya keluli nirkarat dan saiz daging sama. Antara berikut, pernyataan yang manakah paling tepat menerangkan perbezaan masa memasak bagi kedua-dua periuk?',
        en:'Diagram 7 shows two pots used to cook mutton soup — a conventional pot (3 hours) and a pressure cooker (40 minutes); both are stainless steel with the same size of mutton. Which of the following statements best explains the difference in cooking time for both pots?' },
    o:[ {bm:'Zarah-zarah periuk tekanan bergerak lebih laju',                                  en:'The particles of the pressure cooker move faster'},
        {bm:'Periuk tekanan menyerap haba lebih cepat daripada periuk biasa',                  en:'The pressure cooker absorbs heat faster than the conventional pot'},
        {bm:'Suhu di dalam periuk tekanan lebih tinggi daripada periuk biasa',                 en:'The temperature in the pressure cooker is higher than the conventional pot'},
        {bm:'Penutup periuk tekanan mengandungi kromium yang dapat memendekkan masa memasak',  en:'The pressure cooker lid contains chromium which shortens cooking time'} ],
    a:2,
    w:{ bm:'Tekanan tinggi menaikkan takat didih air melebihi 100 °C — <b>suhu dalam periuk tekanan lebih tinggi</b>, zarah makanan bertindak balas lebih pantas, masa memasak jauh lebih singkat ✓. Kromium pada penutup tiada kaitan (D ✗).',
        en:'High pressure raises water’s boiling point above 100 °C — the <b>temperature inside the pressure cooker is higher</b>, food particles react faster, cooking time is far shorter ✓. Chromium in the lid is irrelevant (D ✗).' } },

  { n:25, topic:'RATE',
    q:{ bm:'Rajah 8 menunjukkan dua unggun api yang disediakan semasa perkhemahan di kawasan yang sama — satu daripada batang kayu (nyalaan kecil), satu daripada ranting kayu (nyalaan besar). Antara berikut, pernyataan yang manakah menerangkan mengapa saiz nyalaan unggun api berbeza?',
        en:'Diagram 8 shows two bonfires prepared during camping at the same area — one from wood logs (small flame), one from wood twigs (large flame). Which of the following statements explains why the size of the bonfires is different?' },
    o:[ {bm:'Ranting kayu mempunyai jumlah luas permukaan yang lebih besar menyebabkan kadar pembakaran meningkat', en:'Wood twigs have a larger total surface area causing the rate of combustion to increase'},

  { n:32, topic:'MOLE',

  { n:33, topic:'ACID',
    q:{ bm:'Seorang murid menyediakan 150 cm³ larutan barium hidroksida yang mengandungi 0.015 mol bahan tersebut. Berapakah nilai pH larutan itu?',
        en:'A pupil prepared 150 cm³ of barium hydroxide solution which contains 0.015 mol of the solute. What is the pH value?' },
    o:[ {bm:'12.30', en:'12.30'},
        {bm:'13.00', en:'13.00'},
        {bm:'13.30', en:'13.30'},
        {bm:'13.70', en:'13.70'} ],
    a:2,
    note:'Skema rasmi menjawab B (13.00) — ia terlupa Ba(OH)₂ membebaskan DUA ion OH⁻. Pek ini menggunakan jawapan yang betul dari segi kimia: C (13.30). Sila semak dengan guru.',
    w:{ bm:'[Ba(OH)₂] = 0.015 ÷ 0.150 = 0.1 mol dm⁻³. Setiap unit membebaskan <b>2 OH⁻</b> → [OH⁻] = 0.2 mol dm⁻³. pOH = −log 0.2 = 0.70 → pH = 14 − 0.70 = <b>13.30</b> ✓. <i>Nota: skema rasmi memberi B (13.00), iaitu terlupa faktor 2 bagi bes dwibes — 13.30 ialah jawapan yang betul dari segi kimia.</i>',
        en:'[Ba(OH)₂] = 0.015 ÷ 0.150 = 0.1 mol dm⁻³. Each unit releases <b>2 OH⁻</b> → [OH⁻] = 0.2 mol dm⁻³. pOH = −log 0.2 = 0.70 → pH = 14 − 0.70 = <b>13.30</b> ✓. <i>Note: the official skema gives B (13.00), which forgets the factor of 2 for this dibasic alkali — 13.30 is the chemically correct answer.</i>' } },

  { n:34, topic:'ACID',
    q:{ bm:'Persamaan: H₂SO₄(ak) + 2NH₃(ak) → (NH₄)₂SO₄(ak). Sebanyak P cm³ larutan asid sulfurik 0.125 mol dm⁻³ digunakan untuk meneutralkan 25 cm³ larutan ammonia 1.0 mol dm⁻³. Apakah jumlah isi padu larutan dalam kelalang kon pada akhir pentitratan?',
        en:'Equation: H₂SO₄(aq) + 2NH₃(aq) → (NH₄)₂SO₄(aq). P cm³ of 0.125 mol dm⁻³ sulphuric acid solution is used to neutralise 25 cm³ of 1.0 mol dm⁻³ ammonia solution. What is the total volume of solution in the conical flask at the end of the titration?' },

    w:{ bm:'Mol NH₃ = 1.0 × 0.025 = 0.025 → mol H₂SO₄ = 0.025 ÷ 2 = 0.0125 → P = 0.0125 ÷ 0.125 = 0.1 dm³ = <b>100 cm³</b>. Jumlah isi padu = 25 + 100 = <b>125 cm³</b> ✓.',

  { n:36, topic:'REDOX',
    q:{ bm:'Satu eksperimen dijalankan untuk mengkaji kesan logam X, Y dan Z terhadap pengaratan paku besi. Campuran agar-agar panas yang mengandungi kalium heksasianoferat(III) dan fenolftalein dituang ke dalam setiap tabung uji. Pemerhatian: paku + X — banyak tompok biru; paku + Y — sedikit tompok biru; paku + Z — banyak tompok merah jambu. Antara berikut, yang manakah susunan logam mengikut tertib keelektropositifan <b>menurun</b>?',
        en:'An experiment was conducted to study the effect of metals X, Y and Z on the rusting of iron nails. A hot agar mixture containing potassium hexacyanoferrate(III) and phenolphthalein was poured into each test tube. Observations: nail + X — many blue spots; nail + Y — a few blue spots; nail + Z — many pink spots. Which of the following is the arrangement of the metals in order of <b>decreasing</b> electropositivity?' },
    o:[ {bm:'Fe, X, Y, Z', en:'Fe, X, Y, Z'},
        {bm:'X, Y, Z, Fe', en:'X, Y, Z, Fe'},
        {bm:'Y, X, Fe, Z', en:'Y, X, Fe, Z'},
        {bm:'Z, Fe, Y, X', en:'Z, Fe, Y, X'} ],
    a:3,
    w:{ bm:'Tompok <b>biru</b> = ion Fe²⁺ (besi berkarat — logam pasangan <b>kurang</b> elektropositif daripada Fe); tompok <b>merah jambu</b> = OH⁻ (besi dilindungi — logam pasangan <b>lebih</b> elektropositif). Banyak biru (X) = paling jauh di bawah Fe; sedikit biru (Y) = sedikit di bawah Fe; Z melindungi = di atas Fe. Menurun: <b>Z, Fe, Y, X</b> ✓.',
        en:'<b>Blue</b> spots = Fe²⁺ ions (the nail rusts — the paired metal is <b>less</b> electropositive than Fe); <b>pink</b> spots = OH⁻ (the nail is protected — the paired metal is <b>more</b> electropositive). Many blue (X) = furthest below Fe; few blue (Y) = slightly below Fe; Z protects = above Fe. Decreasing: <b>Z, Fe, Y, X</b> ✓.' } },

  { n:37, topic:'CARBON',
    q:{ bm:'Rajah 11 menunjukkan formula struktur satu sebatian karbon: CH₃−C(CH₃)=CH−CH₃ (2-metilbut-2-ena). Antara berikut, yang manakah isomer bagi sebatian itu?',

  { n:38, topic:'REDOX',

  { n:39, topic:'ACID',

        en:'A student carries out a cation confirmatory test using sodium hydroxide, NaOH solution and ammonia, NH₃ solution. Which of the following are the cations that can be verified using these two reagents only?<br>I&nbsp;&nbsp;Al³⁺&nbsp;&nbsp;·&nbsp;&nbsp;II&nbsp;&nbsp;Mg²⁺&nbsp;&nbsp;·&nbsp;&nbsp;III&nbsp;&nbsp;Pb²⁺&nbsp;&nbsp;·&nbsp;&nbsp;IV&nbsp;&nbsp;Zn²⁺' },
    o:[ {bm:'I dan II',   en:'I and II'},

        {bm:'II dan IV',  en:'II and IV'},
        {bm:'III dan IV', en:'III and IV'} ],
    a:2,
    w:{ bm:'<b>Mg²⁺</b>: mendakan putih <b>tak larut</b> dalam kedua-dua NaOH dan NH₃ berlebihan — corak unik ✓. <b>Zn²⁺</b>: mendakan putih <b>larut</b> dalam kedua-dua berlebihan — juga unik ✓. Al³⁺ dan Pb²⁺ berkelakuan <b>serupa</b> antara satu sama lain dengan dua reagen ini (larut dalam NaOH berlebihan, tak larut dalam NH₃) — perlu ujian KI tambahan untuk membezakannya (I, III ✗).',

  { n:40, topic:'THERMO',
    q:{ bm:'Pada Mei 2026, harga pasaran bagi diesel ialah RM 5.17 per kg. Seorang pengurus kilang memperuntukkan sebanyak RM 50.00 untuk pembelian diesel pada harga pasaran semasa tersebut. Berapakah jumlah tenaga (dalam unit MJ) yang akan dibebaskan apabila keseluruhan diesel yang dibeli itu dibakar dengan lengkap? [Haba pembakaran diesel = −10.7 MJ mol⁻¹; Jisim molekul relatif diesel = 226 g mol⁻¹]',

        en:'The different-sized zinc atoms <b>disrupt the orderly copper lattice</b> and <b>stop the layers sliding</b> over each other — which is exactly why an alloy is harder than the pure metal ✓.' } },

  { n:21, topic:'ACID',
    q:{ bm:'Rajah 6 menunjukkan tindak balas antara asid sulfurik dan bahan Q. Tindak balas membebaskan gas yang menghasilkan bunyi ‘pop’ apabila diuji dengan kayu uji bernyala. Antara bahan berikut, yang manakah bahan Q?',
        en:'Diagram 6 shows a reaction between sulphuric acid and substance Q. The reaction released a gas that produced a ‘pop’ sound when tested using a lighted wooden splinter. From the following substances, which is substance Q?' },
    o:[ {bm:'Zink',            en:'Zinc'},
        {bm:'Zink oksida',     en:'Zinc oxide'},
        {bm:'Zink karbonat',   en:'Zinc carbonate'},
        {bm:'Zink hidroksida', en:'Zinc hydroxide'} ],
    a:0,
    w:{ bm:'Bunyi ‘pop’ = gas <b>hidrogen</b> — hanya terhasil daripada asid + <b>logam</b>: Zn + H₂SO₄ → ZnSO₄ + H₂ ✓. Oksida/hidroksida memberi air sahaja; karbonat membebaskan CO₂ (memadamkan nyalaan).',
        en:'The ‘pop’ sound = <b>hydrogen</b> gas — produced only by acid + <b>metal</b>: Zn + H₂SO₄ → ZnSO₄ + H₂ ✓. The oxide/hydroxide give only water; the carbonate releases CO₂ (which extinguishes the flame).' } },

  { n:22, topic:'INDUSTRY',
    q:{ bm:'Rajah 7 menunjukkan pembentukan bahan X daripada komponen asalnya: lignin + gentian selulosa → bahan X. Cadangkan bahan yang sama jenis dengan bahan X.',
        en:'Diagram 7 shows the formation of substance X from its original components: lignin + cellulose fibre → substance X. Suggest a material that is the same type as material X.' },
    o:[ {bm:'Loyang',              en:'Brass'},
        {bm:'Kaolin',              en:'Kaolin'},
        {bm:'Konkrit diperkukuh',  en:'Reinforced concrete'},
        {bm:'Kaca borosilikat',    en:'Borosilicate glass'} ],
    a:2,
    w:{ bm:'Lignin (matriks) + gentian selulosa (penguat) = <b>komposit</b> semula jadi (kayu). Bahan sejenis = komposit lain: <b>konkrit diperkukuh</b> (konkrit + bar keluli) ✓. Loyang aloi, kaolin seramik, kaca borosilikat kaca.',
        en:'Lignin (matrix) + cellulose fibre (reinforcement) = a natural <b>composite</b> (wood). The same type = another composite: <b>reinforced concrete</b> (concrete + steel bars) ✓. Brass is an alloy, kaolin a ceramic, borosilicate a glass.' } },

  { n:23, topic:'ATOM',
    q:{ bm:'Atom X dan Y merupakan isotop. Atom X mempunyai nombor nukleon 39 dan nombor proton 19. Berapakah bilangan elektron atom Y?',
        en:'Atoms X and Y are isotopes. Atom X has nucleon number 39 while proton number 19. How many electrons are in atom Y?' },
    o:[ {bm:'18', en:'18'},
        {bm:'19', en:'19'},
        {bm:'20', en:'20'},
        {bm:'21', en:'21'} ],
    a:1,
    w:{ bm:'Isotop mempunyai <b>nombor proton yang sama</b> — Y juga 19 proton, dan atom neutral mempunyai elektron = proton = <b>19</b> ✓. Hanya bilangan neutron yang berbeza.',
        en:'Isotopes share the <b>same proton number</b> — Y also has 19 protons, and a neutral atom has electrons = protons = <b>19</b> ✓. Only the neutron count differs.' } },

  { n:24, topic:'THERMO',
    q:{ bm:'Persamaan termokimia berikut menunjukkan pemendakan plumbum(II) sulfat: Pb(NO₃)₂(ak) + K₂SO₄(ak) → PbSO₄(p) + 2KNO₃(ak), ΔH = −q kJ mol⁻¹. Dalam persamaan di atas, pernyataan manakah yang benar?',
        en:'The following thermochemical equation shows the precipitation of lead(II) sulphate: Pb(NO₃)₂(aq) + K₂SO₄(aq) → PbSO₄(s) + 2KNO₃(aq), ΔH = −q kJ mol⁻¹. In the equation above, which statement is true?' },
    o:[ {bm:'Perubahan suhu bagi tindak balas ialah q',                       en:'The temperature change for the reaction is q'},
        {bm:'q kJ ialah jumlah tenaga yang diperlukan untuk pembentukan PbSO₄', en:'q kJ is the amount of energy needed for the formation of PbSO₄'},
        {bm:'q ialah jumlah tenaga yang ditukarkan kepada tenaga kimia',       en:'q is the amount of energy that is converted to chemical energy'},
        {bm:'Jumlah kandungan tenaga bahan tindak balas adalah lebih tinggi daripada hasil tindak balas', en:'The total energy content of reactants is higher than products'} ],
    a:3,
    w:{ bm:'ΔH <b>negatif</b> = eksotermik → tenaga bahan tindak balas <b>lebih tinggi</b> daripada hasil ✓. q ialah haba <b>dibebaskan</b> (bukan perubahan suhu, bukan tenaga diperlukan).',
        en:'A <b>negative</b> ΔH = exothermic → the reactants’ energy is <b>higher</b> than the products’ ✓. q is heat <b>released</b> (not a temperature change, not energy required).' } },

  { n:25, topic:'POLYMER',
    q:{ bm:'Rajah 8 menunjukkan dua jenis getah: Getah A (rantai dengan ikatan C=C, tiada sambungan antara rantai) dan Getah B (rantai-rantai disambungkan oleh rangkai silang sulfur). Pernyataan manakah paling baik menerangkan mengapa getah B lebih elastik daripada getah A?',
        en:'Diagram 8 shows two types of rubbers: Rubber A (chains with C=C bonds, no links between chains) and Rubber B (chains connected by sulphur cross-links). Which statement best explains why rubber B is more elastic than rubber A?' },
    o:[ {bm:'Getah B lebih besar berbanding getah A',                  en:'Rubber B is bigger than rubber A'},
        {bm:'Getah B lebih senang teroksida berbanding getah A',       en:'Rubber B is more easily oxidised than rubber A'},
        {bm:'Takat lebur dan takat didih getah B lebih tinggi berbanding getah A', en:'The melting point and boiling point of rubber B is higher than rubber A'},
        {bm:'Kehadiran rangkai silang sulfur menarik molekul getah B kembali kepada kedudukan asal', en:'Presence of sulphur cross-links pulls the rubber B molecules back to their original positions'} ],
    a:3,
    w:{ bm:'Getah B ialah getah <b>tervulkan</b>: <b>rangkai silang sulfur</b> menambat rantai polimer dan <b>menariknya kembali ke kedudukan asal</b> selepas diregang — lebih elastik ✓. Vulkanan juga menjadikannya lebih tahan oksidaan, bukan lebih senang (B ✗).',
        en:'Rubber B is <b>vulcanised</b>: the <b>sulphur cross-links</b> anchor the polymer chains and <b>pull them back to their original positions</b> after stretching — more elastic ✓. Vulcanisation also makes it more resistant to oxidation, not less (B ✗).' } },

  { n:26, topic:'CONSUMER',
    q:{ bm:'Ahmad mengalami masalah bersin yang kerap di waktu pagi. Beliau juga akan bersin apabila makan makanan laut. Ibu Ahmad telah membawanya berjumpa doktor. Sebagai seorang doktor, apakah jenis ubat yang perlu diberikan kepada Ahmad?',
        en:'Ahmad has a problem of frequent sneezing in the morning. He also sneezes when he eats seafood. Ahmad’s mother has taken him to see a doctor. As a doctor, what type of medicine needs to be given to Ahmad?' },
    o:[ {bm:'Parasetamol',  en:'Paracetamol'},
        {bm:'Penisilin',    en:'Penicillin'},
        {bm:'Prednisolon',  en:'Prednisolone'},
        {bm:'Antihistamin', en:'Antihistamine'} ],
    a:3,
    w:{ bm:'Bersin kerap + tercetus oleh makanan laut = <b>alahan</b> → <b>antihistamin</b> menyekat histamin yang mencetuskan gejala alahan ✓. Parasetamol analgesik, penisilin antibiotik, prednisolon kortikosteroid.',
        en:'Frequent sneezing triggered by seafood = an <b>allergy</b> → an <b>antihistamine</b> blocks the histamine that causes allergic symptoms ✓. Paracetamol is an analgesic, penicillin an antibiotic, prednisolone a corticosteroid.' } },

  { n:27, topic:'ATOM',
    q:{ bm:'Bahan X mempunyai takat lebur 80 °C manakala takat didih ialah 196 °C. Bahan X dimasukkan ke dalam tabung didih dan dipanaskan menggunakan kaedah pemanasan kukus air seperti Rajah 9. Ramalkan keadaan fizikal bahan X selepas 20 minit.',
        en:'Substance X has melting point 80 °C and boiling point 196 °C. Substance X is placed in a boiling tube and heated using the water bath heating method, as shown in Diagram 9. Predict the physical state of substance X after 20 minutes.' },
    o:[ {bm:'Cecair',            en:'Liquid'},
        {bm:'Pepejal',           en:'Solid'},
        {bm:'Pepejal dan cecair',en:'Solid and liquid'},
        {bm:'Cecair dan gas',    en:'Liquid and gas'} ],
    a:0,
    w:{ bm:'Kukus air maksimum <b>100 °C</b> — melebihi takat lebur X (80 °C) tetapi jauh di bawah takat didihnya (196 °C). Selepas 20 minit X sudah lebur sepenuhnya → <b>cecair</b> ✓.',
        en:'A water bath tops out at <b>100 °C</b> — above X’s melting point (80 °C) but far below its boiling point (196 °C). After 20 minutes X has fully melted → <b>liquid</b> ✓.' } },

  { n:28, topic:'CARBON',
    q:{ bm:'Rajah 10 menunjukkan satu formula struktur C₄H₈: CH₂=C(CH₃)−CH₃ (2-metilprop-1-ena). Yang manakah antara berikut merupakan isomer bagi rajah X?<br>I&nbsp;&nbsp;But-1-ena&nbsp;&nbsp;·&nbsp;&nbsp;II&nbsp;&nbsp;But-2-ena&nbsp;&nbsp;·&nbsp;&nbsp;III&nbsp;&nbsp;2-metilbut-1-ena&nbsp;&nbsp;·&nbsp;&nbsp;IV&nbsp;&nbsp;2-metilprop-1-ena',
        en:'Diagram 10 shows a structural formula of C₄H₈: CH₂=C(CH₃)−CH₃ (2-methylprop-1-ene). Which of the following are isomers of diagram X?<br>I&nbsp;&nbsp;But-1-ene&nbsp;&nbsp;·&nbsp;&nbsp;II&nbsp;&nbsp;But-2-ene&nbsp;&nbsp;·&nbsp;&nbsp;III&nbsp;&nbsp;2-methylbut-1-ene&nbsp;&nbsp;·&nbsp;&nbsp;IV&nbsp;&nbsp;2-methylprop-1-ene' },
    o:[ {bm:'I dan II',   en:'I and II'},
        {bm:'II dan III', en:'II and III'},
        {bm:'III dan IV', en:'III and IV'},
        {bm:'I dan IV',   en:'I and IV'} ],
    a:0,
    w:{ bm:'Isomer = formula molekul <b>sama</b> (C₄H₈), struktur berbeza: <b>but-1-ena</b> ✓ dan <b>but-2-ena</b> ✓. 2-metilbut-1-ena ialah C₅H₁₀ (III ✗); 2-metilprop-1-ena ialah sebatian yang <b>sama</b>, bukan isomernya (IV ✗).',
        en:'Isomers = the <b>same</b> molecular formula (C₄H₈), different structure: <b>but-1-ene</b> ✓ and <b>but-2-ene</b> ✓. 2-methylbut-1-ene is C₅H₁₀ (III ✗); 2-methylprop-1-ene is the <b>same</b> compound, not an isomer (IV ✗).' } },

  { n:29, topic:'CONSUMER',
    q:{ bm:'Antara bahagian struktur molekul agen pencuci berikut, yang manakah bersifat hidrofilik?',
        en:'Which of the following parts of the molecular structure of a detergent agent is hydrophilic?' },
    o:[ {bm:'Bahagian rantai hidrokarbon yang larut dalam gris', en:'The part of the hydrocarbon chain that dissolves in grease'},
        {bm:'Bahagian kepala berion yang larut dalam air',       en:'The water-soluble ionic head part'},
        {bm:'Bahagian yang tidak mempunyai cas elektrik',        en:'Parts that have no electric charge'},
        {bm:'Bahagian yang bertindak balas dengan ion kalsium sahaja', en:'The part that reacts with calcium ions only'} ],
    a:1,
    note:'Skema rasmi menjawab A — salah: rantai hidrokarbon ialah bahagian HIDROFOBIK. Hidrofilik = kepala berion yang larut dalam air. Pek menggunakan B.',
    w:{ bm:'<b>Hidrofilik</b> = "suka air" — <b>kepala berion</b> yang larut dalam air ✓. Rantai hidrokarbon yang larut dalam gris ialah bahagian <b>hidrofobik</b>. <i>Nota: skema rasmi tersilap memberi A, iaitu takrifan hidrofobik.</i>',
        en:'<b>Hydrophilic</b> = "water-loving" — the <b>ionic head</b> that dissolves in water ✓. The grease-dissolving hydrocarbon chain is the <b>hydrophobic</b> part. <i>Note: the official skema wrongly gives A, which describes the hydrophobic tail.</i>' } },

  { n:30, topic:'PTABLE',
    q:{ bm:'Unsur M mempunyai nombor proton 18. Unsur seterusnya dalam Jadual Berkala Unsur ialah unsur N. Pernyataan yang manakah betul?',
        en:'Element M has the proton number 18. The next element in the Periodic Table of Elements is element N. Which statement is correct?' },
    o:[ {bm:'Unsur N berada dalam kala yang sama dengan unsur M',            en:'Element N is in the same period as element M in the Periodic Table'},
        {bm:'Unsur N mempunyai lebih satu petala elektron berbanding unsur M', en:'Element N has one more electron shell compared to element M'},
        {bm:'Unsur N berada dalam kumpulan yang sama dengan unsur M',         en:'Element N is in the same group as element M in the Periodic Table'},
        {bm:'Unsur N mempunyai lebih satu elektron di dalam petala valensnya berbanding unsur M', en:'Element N has one more electron in its valence shell compared to element M'} ],
    a:1,
    w:{ bm:'M (18) = argon, 2.8.8 — penghujung Kala 3. N (19) = kalium, 2.8.8.1 — memulakan Kala 4 dengan <b>satu petala tambahan</b> ✓. Kala berbeza (A ✗), kumpulan berbeza (C ✗), dan petala valens N ada 1 elektron berbanding 8 pada M (D ✗).',
        en:'M (18) = argon, 2.8.8 — the end of Period 3. N (19) = potassium, 2.8.8.1 — starting Period 4 with <b>one extra shell</b> ✓. Different periods (A ✗), different groups (C ✗), and N’s valence shell has 1 electron versus M’s 8 (D ✗).' } },

  { n:31, topic:'ACID',
    q:{ bm:'Rajah 11 menunjukkan prosedur untuk menghasilkan garam terlarutkan P dan garam tak terlarutkan Q: larutan natrium klorida dituang ke dalam larutan plumbum(II) nitrat. Pilih padanan yang betul bagi P dan Q.',
        en:'Diagram 11 shows the procedures to produce soluble salt P and insoluble salt Q: sodium chloride solution is poured into lead(II) nitrate solution. Choose the correct match for P and Q.' },
    o:[ {bm:'P: Natrium nitrat · Q: Plumbum(II) karbonat', en:'P: Sodium nitrate · Q: Lead(II) carbonate'},
        {bm:'P: Natrium nitrat · Q: Plumbum(II) klorida',  en:'P: Sodium nitrate · Q: Lead(II) chloride'},
        {bm:'P: Plumbum(II) karbonat · Q: Natrium nitrat', en:'P: Lead(II) carbonate · Q: Sodium nitrate'},
        {bm:'P: Plumbum(II) klorida · Q: Natrium nitrat',  en:'P: Lead(II) chloride · Q: Sodium nitrate'} ],
    a:1,
    w:{ bm:'NaCl + Pb(NO₃)₂ → <b>PbCl₂</b> (mendakan putih — garam tak terlarutkan Q) + <b>NaNO₃</b> (kekal larut — garam terlarutkan P) ✓. Tiada karbonat terlibat langsung (A, C ✗).',
        en:'NaCl + Pb(NO₃)₂ → <b>PbCl₂</b> (white precipitate — the insoluble salt Q) + <b>NaNO₃</b> (stays dissolved — the soluble salt P) ✓. No carbonate is involved at all (A, C ✗).' } },

  { n:32, topic:'THERMO',
    q:{ bm:'Satu spatula serbuk zink dimasukkan ke dalam cawan polistirena yang mengandungi 50 cm³ larutan kuprum(II) sulfat 0.2 mol dm⁻³. Kenaikan suhu yang dicatatkan ialah sebanyak 8 °C. Hitungkan nilai haba penyesaran kuprum dalam tindak balas tersebut. [Muatan haba tentu larutan: 4.2 J g⁻¹ °C⁻¹]',
        en:'One spatula of zinc powder was poured into a polystyrene cup containing 50 cm³ of 0.2 mol dm⁻³ copper(II) sulphate solution. The temperature increase recorded is 8 °C. Calculate the heat of displacement of copper in the reaction. [Specific heat capacity of solution: 4.2 J g⁻¹ °C⁻¹]' },
    o:[ {bm:'8400 kJ mol⁻¹', en:'8400 kJ mol⁻¹'},
        {bm:'8.4 kJ mol⁻¹',  en:'8.4 kJ mol⁻¹'},
        {bm:'1680 kJ mol⁻¹', en:'1680 kJ mol⁻¹'},
        {bm:'168 kJ mol⁻¹',  en:'168 kJ mol⁻¹'} ],
    a:3,
    w:{ bm:'Haba = mcθ = 50 × 4.2 × 8 = <b>1680 J</b>. Mol Cu²⁺ = 0.05 dm³ × 0.2 = <b>0.01 mol</b> (zink berlebihan). Haba penyesaran = 1680 ÷ 0.01 = 168 000 J mol⁻¹ = <b>168 kJ mol⁻¹</b> ✓.',
        en:'Heat = mcθ = 50 × 4.2 × 8 = <b>1680 J</b>. Moles of Cu²⁺ = 0.05 dm³ × 0.2 = <b>0.01 mol</b> (zinc in excess). Heat of displacement = 1680 ÷ 0.01 = 168,000 J mol⁻¹ = <b>168 kJ mol⁻¹</b> ✓.' } },

  { n:33, topic:'ATOM',
    q:{ bm:'Jisim atom relatif boron = 10.81. Kelimpahan isotop: 80% ¹¹B dan 20% ʸB. Berdasarkan maklumat yang diberikan, kira nombor nukleon isotop ʸB.',
        en:'Relative atomic mass of boron = 10.81. Isotope abundance: 80% ¹¹B and 20% ʸB. Based on the information given, calculate the nucleon number of isotope ʸB.' },
    o:[ {bm:'9',  en:'9'},
        {bm:'10', en:'10'},
        {bm:'11', en:'11'},
        {bm:'12', en:'12'} ],
    a:1,
    w:{ bm:'10.81 = (80 × 11 + 20 × Y) ÷ 100 → 1081 = 880 + 20Y → Y = 10.05 ≈ <b>10</b> ✓ (isotop boron-10).',
        en:'10.81 = (80 × 11 + 20 × Y) ÷ 100 → 1081 = 880 + 20Y → Y = 10.05 ≈ <b>10</b> ✓ (the boron-10 isotope).' } },

  { n:34, topic:'THERMO',
    q:{ bm:'Rajah 12 menunjukkan gambar rajah aras tenaga bagi tindak balas antara 50 cm³ larutan natrium hidroksida 1 mol dm⁻³ dengan 50 cm³ asid etanoik 1 mol dm⁻³, dengan ΔH = −55 kJ mol⁻¹. Apakah perubahan suhu bagi tindak balas tersebut? [Muatan haba tentu air: 4.2 J g⁻¹ °C⁻¹]',
        en:'Diagram 12 shows the energy level diagram for the reaction between 50 cm³ of 1 mol dm⁻³ sodium hydroxide solution and 50 cm³ of 1 mol dm⁻³ ethanoic acid, with ΔH = −55 kJ mol⁻¹. What is the temperature change in the reaction? [Specific heat capacity of water: 4.2 J g⁻¹ °C⁻¹]' },
    o:[ {bm:'1.3 °C',   en:'1.3 °C'},
        {bm:'6.5 °C',   en:'6.5 °C'},
        {bm:'13.1 °C',  en:'13.1 °C'},
        {bm:'119.0 °C', en:'119.0 °C'} ],
    a:1,
    w:{ bm:'Mol air terbentuk = 0.05 dm³ × 1 = <b>0.05 mol</b>. Haba = 0.05 × 55 000 = <b>2750 J</b>. Jisim campuran = 100 g. θ = 2750 ÷ (100 × 4.2) = <b>6.5 °C</b> ✓.',
        en:'Moles of water formed = 0.05 dm³ × 1 = <b>0.05 mol</b>. Heat = 0.05 × 55,000 = <b>2750 J</b>. Mass of mixture = 100 g. θ = 2750 ÷ (100 × 4.2) = <b>6.5 °C</b> ✓.' } },

  { n:35, topic:'REDOX',
    q:{ bm:'Satu notasi sel bagi sel kimia ditunjukkan: Mg(p) | Mg²⁺(ak) ‖ Cu²⁺(ak) | Cu(p). [Diberi E° Magnesium = −2.38 V dan E° Kuprum = +0.34 V]. Hitungkan E° sel berdasarkan notasi sel di atas.',
        en:'The cell notation for a voltaic cell is shown: Mg(s) | Mg²⁺(aq) ‖ Cu²⁺(aq) | Cu(s). [Given E° Magnesium = −2.38 V and E° Copper = +0.34 V]. Calculate E° cell based on the cell notation above.' },
    o:[ {bm:'+2.72 V', en:'+2.72 V'},
        {bm:'−2.72 V', en:'−2.72 V'},
        {bm:'+2.04 V', en:'+2.04 V'},
        {bm:'−2.04 V', en:'−2.04 V'} ],
    a:0,
    w:{ bm:'E°sel = E°katod − E°anod = (+0.34) − (−2.38) = <b>+2.72 V</b> ✓. Dalam notasi sel, anod (Mg) di kiri dan katod (Cu) di kanan.',
        en:'E°cell = E°cathode − E°anode = (+0.34) − (−2.38) = <b>+2.72 V</b> ✓. In cell notation the anode (Mg) sits on the left, the cathode (Cu) on the right.' } },

  { n:36, topic:'POLYMER',
    q:{ bm:'Rajah 13 menunjukkan satu polimer yang digunakan untuk membuat kuali tahan lekat — unit ulangan [−CF₂−CF₂−]ₙ. Berapakah peratus atom karbon per molekul bagi monomer polimer itu? [Jisim atom relatif: C = 12, F = 19]',
        en:'Diagram 13 shows a polymer that is used to make a non-stick pan — repeat unit [−CF₂−CF₂−]ₙ. What is the percentage of carbon atom per molecule for the monomer of the polymer? [Relative atomic mass: C = 12, F = 19]' },
    o:[ {bm:'24.00 %', en:'24.00 %'},
        {bm:'76.00 %', en:'76.00 %'},
        {bm:'42.00 %', en:'42.00 %'},
        {bm:'12.00 %', en:'12.00 %'} ],
    a:0,
    note:'Skema rasmi menjawab D (12.00%) — salah: monomer C₂F₄ mempunyai jisim 100, karbon 24 → 24.00%. Pek menggunakan A.',
    w:{ bm:'Polimer itu PTFE (Teflon); monomernya <b>tetrafluoroetena C₂F₄</b>. Jisim molekul = 2(12) + 4(19) = <b>100</b>; jisim karbon = 24 → peratus C = 24 ÷ 100 × 100 = <b>24.00%</b> ✓. <i>Nota: skema rasmi memberi D (12.00%) — itu peratus untuk satu karbon sahaja, tersilap kira.</i>',
        en:'The polymer is PTFE (Teflon); its monomer is <b>tetrafluoroethene C₂F₄</b>. Molecular mass = 2(12) + 4(19) = <b>100</b>; carbon mass = 24 → %C = 24 ÷ 100 × 100 = <b>24.00%</b> ✓. <i>Note: the official skema gives D (12.00%) — the percentage for only one carbon, a miscalculation.</i>' } },

  { n:37, topic:'RATE',
    q:{ bm:'Jadual 2 menunjukkan eksperimen kadar tindak balas antara zink dan asid: Set I — ketulan zink berlebihan + 50 cm³ asid sulfurik 1.0 mol dm⁻³, 30 °C; Set II — serbuk zink berlebihan + 50 cm³ asid sulfurik 1.0 mol dm⁻³, 30 °C. Seorang pelajar menambah set III, dan graf menunjukkan lengkung III paling curam <b>dan</b> mendatar pada isi padu lebih tinggi daripada set I dan II. Cadangkan satu pengubahsuaian pada set II yang telah dilakukan untuk memperoleh lengkung III.',
        en:'Table 2 shows a rate experiment between zinc and acid: Set I — excess zinc granules + 50 cm³ of 1.0 mol dm⁻³ sulphuric acid, 30 °C; Set II — excess zinc powder + 50 cm³ of 1.0 mol dm⁻³ sulphuric acid, 30 °C. A student added set III, and the graph shows curve III is the steepest <b>and</b> levels off at a higher volume than sets I and II. Suggest a modification to set II that the student made to obtain curve III.' },
    o:[ {bm:'Mengubah suhu asid sulfurik kepada 60 °C',                     en:'Change the temperature of sulphuric acid to 60 °C'},
        {bm:'Meningkatkan kepekatan asid sulfurik yang digunakan',           en:'Increasing the concentration of sulphuric acid used'},
        {bm:'Menggantikan asid sulfurik dengan asid hidroklorik yang mempunyai isipadu dan kepekatan yang sama', en:'Replacing sulphuric acid with hydrochloric acid of the same volume and concentration'},

        {bm:'Daya tarikan antara molekul asetamida semasa P ke Q adalah lebih lemah daripada R ke S', en:'The attractive force between acetamide molecules during P to Q is weaker than during R to S'} ],
    a:0,
    w:{ bm:'R menandakan <b>penghujung plato lakuran</b> (80°C) — pada titik ini semua pepejal telah <b>lebur sepenuhnya menjadi cecair</b> ✓. P ke Q ialah pemanasan pepejal — tenaga kinetik <b>bertambah</b> (B salah); haba diteruskan selepas S akan terus <b>menaikkan suhu</b> cecair (C salah); daya tarikan pepejal (P-Q) lebih <b>kuat</b> daripada cecair (R-S), bukan lebih lemah (D salah).',
        en:'R marks the <b>end of the melting plateau</b> (80°C) — at this point all the solid has <b>fully melted into liquid</b> ✓. P to Q is heating the solid — kinetic energy <b>increases</b> (B wrong); continued heating after S would keep <b>raising</b> the liquid’s temperature (C wrong); the attractive forces in the solid (P–Q) are <b>stronger</b> than in the liquid (R–S), not weaker (D wrong).' } },

  { n:15, topic:'MOLE',
    q:{ bm:'Rajah 10 menunjukkan formula struktur asid askorbik, C₆H₈O₆. Apakah formula empirikal asid askorbik?',
        en:'Diagram 10 shows the structural formula of ascorbic acid, C₆H₈O₆. What is the empirical formula of ascorbic acid?' },

        {bm:'C₄H₈O₄', en:'C₄H₈O₄'},
        {bm:'C₂H₄O₂', en:'C₂H₄O₂'} ],
    a:1,
    w:{ bm:'Formula molekul C₆H₈O₆ dipermudahkan kepada nisbah terkecil dengan membahagi setiap subskrip dengan 2: <b>C₃H₄O₃</b> ✓.',
        en:'The molecular formula C₆H₈O₆ simplifies to its smallest ratio by dividing every subscript by 2: <b>C₃H₄O₃</b> ✓.' } },

  { n:16, topic:'PTABLE',
    q:{ bm:'Rajah 11 menunjukkan unsur merentasi Kala 3: Na, Mg, Al, Si, P, S, Cl, Ar. Antara berikut, pernyataan manakah yang betul tentang unsur merentasi Kala 3?',
        en:'Diagram 11 shows the elements across Period 3: Na, Mg, Al, Si, P, S, Cl, Ar. Which of the following statements is correct about elements across Period 3?' },
    o:[ {bm:'Jejari atom semakin bertambah',                                            en:'The atomic radius increases'},
        {bm:'Keelektronegatifan semakin berkurang',                                     en:'The electronegativity decreases'},
        {bm:'Perubahan daripada unsur logam kepada separa logam dan akhirnya bukan logam', en:'Change from metal elements to semi-metal elements and non-metal elements'},
        {bm:'Sifat oksida unsur berubah daripada oksida asid kepada oksida amfoterik dan kemudian kepada oksida bes', en:'The oxide properties of elements change from acidic oxide to amphoteric oxide and then to basic oxide'} ],
    a:2,
    w:{ bm:'Merentasi Kala 3, unsur berubah daripada <b>logam</b> (Na, Mg, Al) kepada <b>separa logam</b> (Si) kepada <b>bukan logam</b> (P, S, Cl, Ar) ✓. Jejari atom sebenarnya <b>mengecil</b> (A salah); keelektronegatifan <b>bertambah</b> (B salah); sifat oksida berubah dalam arah <b>bes → amfoterik → asid</b>, bukan sebaliknya (D terbalik).',
        en:'Across Period 3, the elements change from <b>metal</b> (Na, Mg, Al) to <b>semi-metal</b> (Si) to <b>non-metal</b> (P, S, Cl, Ar) ✓. Atomic radius actually <b>decreases</b> (A wrong); electronegativity <b>increases</b> (B wrong); oxide character shifts <b>basic → amphoteric → acidic</b>, not the reverse (D is backwards).' } },

  { n:17, topic:'BOND',
    q:{ bm:'Rajah 12 menunjukkan susunan elektron bagi sebatian yang terbentuk antara atom X dengan atom Y: X kehilangan elektron membentuk ion X²⁺, dan dua atom Y masing-masing menerima satu elektron membentuk ion Y⁻. Antara berikut, pernyataan manakah betul tentang sebatian itu?',
        en:'Diagram 12 shows the electron arrangement of a compound formed between atom X and atom Y: X loses electrons to form ion X²⁺, and two Y atoms each gain one electron to form Y⁻ ions. Which of the following statements is correct about the compound?' },
    img:'img/kimia/600179fbb884.webp',
    alt:{ bm:'Tiga ion berasingan dalam kurungan: Y⁻ (3 petala penuh), X²⁺ (2 petala, di tengah), Y⁻ (3 petala penuh)', en:'Three separate bracketed ions: Y⁻ (3 full shells), X²⁺ (2 shells, centre), Y⁻ (3 full shells)' },
    o:[ {bm:'Sebatian kovalen terhasil',                                    en:'Covalent compound is formed'},
        {bm:'Sebatian itu larut dalam air',                                 en:'The compound is soluble in water'},
        {bm:'Sebatian itu wujud dalam keadaan gas pada suhu bilik',        en:'The compound exists as gas at room temperature'},
        {bm:'Sebatian itu terbentuk melalui perkongsian elektron antara atom X dan atom Y', en:'The compound is formed by sharing of electrons between atom X and atom Y'} ],
    a:1,
    w:{ bm:'Ion berasingan dalam kurungan berbeza (bukan berkongsi elektron) menunjukkan <b>sebatian ion</b> XY₂ — sebatian ion tipikal <b>larut dalam air</b> ✓. Bukan kovalen dan tidak terbentuk melalui perkongsian (A, D salah — elektron <b>dipindahkan</b>, bukan dikongsi); sebatian ion ialah pepejal pada suhu bilik, bukan gas (C salah).',
        en:'Separate ions in different brackets (not shared electrons) show an <b>ionic compound</b> XY₂ — typical ionic compounds are <b>soluble in water</b> ✓. It is not covalent and not formed by sharing (A, D wrong — electrons are <b>transferred</b>, not shared); ionic compounds are solids at room temperature, not gases (C wrong).' } },

  { n:18, topic:'ACID',
    q:{ bm:'Seorang murid melarutkan gas hidrogen klorida ke dalam air. Antara pernyataan berikut, yang manakah benar tentang larutan yang terhasil?',
        en:'A student dissolved hydrogen chloride gas into water. Which of the following statements is true of the solution obtained?' },
    o:[ {bm:'Tidak mengkonduksikan elektrik',                                  en:'Does not conduct electricity'},
        {bm:'Menukarkan kertas litmus merah kering kepada biru',              en:'Turns dry red litmus paper to blue'},
        {bm:'Hidrogen klorida kekal sebagai molekul bebas di dalam air',      en:'Hydrogen chloride remains as molecules in water'},
        {bm:'Hidrogen klorida mengion dalam air untuk menghasilkan ion hidrogen, H⁺', en:'Hydrogen chloride ionises in water to produce hydrogen ions, H⁺'} ],
    a:3,
    w:{ bm:'HCl <b>mengion sepenuhnya</b> dalam air: HCl → H⁺ + Cl⁻, menghasilkan larutan berasid ✓. Ion H⁺ yang terhasil membolehkan larutan <b>mengkonduksikan elektrik</b> (A salah); ia mengubah litmus <b>biru kepada merah</b>, bukan sebaliknya, dan mesti kering — asid tidak mengubah litmus kering (B salah); HCl tidak kekal sebagai molekul (C salah).',
        en:'HCl <b>fully ionises</b> in water: HCl → H⁺ + Cl⁻, producing an acidic solution ✓. The resulting H⁺ ions let the solution <b>conduct electricity</b> (A wrong); it turns litmus <b>blue to red</b>, the reverse of stated, and only wet litmus changes colour (B wrong); HCl does not stay as molecules (C wrong).' } },

  { n:19, topic:'ACID',
    q:{ bm:'Bagaimanakah nilai pH asid hidroklorik berubah apabila larutan kalium hidroksida ditambahkan secara perlahan-lahan sehingga berlebihan?',
        en:'How does the pH value of hydrochloric acid change when potassium hydroxide solution is added slowly until excess?' },
    o:[ {bm:'Nilai pH berkurang daripada 14 kepada 7', en:'The pH value decreases from 14 to 7'},
        {bm:'Nilai pH berkurang daripada 14 kepada 1', en:'The pH value decreases from 14 to 1'},
        {bm:'Nilai pH meningkat daripada 1 kepada 7',  en:'The pH value increases from 1 to 7'},
        {bm:'Nilai pH meningkat daripada 1 kepada 14', en:'The pH value increases from 1 to 14'} ],
    a:3,
    w:{ bm:'HCl bermula berasid kuat (pH rendah, ≈1). Menambah KOH secara beransur <b>meneutralkan</b> asid (pH naik ke 7) dan seterusnya <b>berlebihan alkali</b> menaikkan pH lagi hingga hampir <b>14</b> ✓ — bukan berhenti pada 7.',
        en:'HCl starts as a strong acid (low pH, ≈1). Gradually adding KOH first <b>neutralises</b> the acid (pH rises to 7), then <b>excess alkali</b> pushes it further up to nearly <b>14</b> ✓ — it does not stop at 7.' } },

  { n:20, topic:'REDOX',
    q:{ bm:'Persamaan kimia berikut mewakili satu tindak balas redoks: Zn + CuSO₄ → ZnSO₄ + Cu. Bahan manakah yang dioksidakan?',
        en:'The following chemical equation represents a redox reaction: Zn + CuSO₄ → ZnSO₄ + Cu. Which substance is oxidised?' },
    o:[ {bm:'Cu',    en:'Cu'},
        {bm:'Zn',    en:'Zn'},
        {bm:'CuSO₄', en:'CuSO₄'},
        {bm:'ZnSO₄', en:'ZnSO₄'} ],
    a:1,
    w:{ bm:'<b>Zn → Zn²⁺ + 2e⁻</b> — zink membebaskan elektron, jadi ia <b>dioksidakan</b> ✓. Cu²⁺ dalam CuSO₄ menerima elektron (diturunkan) menjadi Cu.',
        en:'<b>Zn → Zn²⁺ + 2e⁻</b> — zinc releases electrons, so it is <b>oxidised</b> ✓. The Cu²⁺ in CuSO₄ gains electrons (is reduced) to become Cu.' } },

  { n:21, topic:'REDOX',
    q:{ bm:'Rajah 13 menunjukkan susunan alat radas untuk penulenan nikel: elektrod P dan Q dicelup dalam larutan X, disambungkan kepada bekalan kuasa. Apakah P, Q dan X?',
        en:'Diagram 13 shows the apparatus set-up for purification of nickel: electrodes P and Q are dipped into solution X, connected to a power supply. What is P, Q and X?' },
    img:'img/kimia/a1295abae0c0.webp',
    alt:{ bm:'Sel elektrolisis dengan elektrod P dan Q dalam larutan X, disambung kepada bekalan kuasa', en:'Electrolytic cell with electrodes P and Q in solution X, connected to a power supply' },
    o:[ {bm:'P: Nikel tak tulen · Q: Nikel tulen · X: Nikel(II) nitrat',   en:'P: Impure nickel · Q: Pure nickel · X: Nickel(II) nitrate'},
        {bm:'P: Nikel tulen · Q: Nikel tak tulen · X: Nikel(II) nitrat',   en:'P: Pure nickel · Q: Impure nickel · X: Nickel(II) nitrate'},
        {bm:'P: Nikel tak tulen · Q: Nikel tulen · X: Nikel(II) karbonat', en:'P: Impure nickel · Q: Pure nickel · X: Nickel(II) carbonate'},
        {bm:'P: Nikel tulen · Q: Nikel tak tulen · X: Nikel(II) karbonat', en:'P: Pure nickel · Q: Impure nickel · X: Nickel(II) carbonate'} ],
    a:1,
    w:{ bm:'Dalam penulenan elektrolitik, logam <b>tulen</b> ialah katod (mendapat logam bersih terenap) dan logam <b>tak tulen</b> ialah anod (melarut, membebaskan pengotor); elektrolit mesti larutan <b>garam larut</b> bagi logam itu — <b>nikel(II) nitrat</b>, bukan karbonat (yang tak terlarutkan dan tidak akan mengion untuk membawa arus) ✓.',
        en:'In electrolytic refining, the <b>pure</b> metal is the cathode (clean metal is deposited there) and the <b>impure</b> metal is the anode (it dissolves, releasing the impurities); the electrolyte must be a <b>soluble salt</b> of that metal — <b>nickel(II) nitrate</b>, not the carbonate (which is insoluble and could not ionise to carry current) ✓.' } },

  { n:22, topic:'REDOX',
    q:{ bm:'Rajah 14 menunjukkan mekanisme pengaratan besi: oksigen dan titisan air bertindak di permukaan, dengan kawasan katod di kedua-dua hujung dan anod di tengah. Setengah persamaan manakah yang mewakili tindak balas yang berlaku di anod?',
        en:'Diagram 14 shows the mechanism of rusting of iron: oxygen and water droplets act on the surface, with cathode regions at both ends and the anode in the middle. Which of the following half equations represents the reaction that occurs at the anode?' },
    img:'img/kimia/193af0a22041.webp',
    alt:{ bm:'Titisan air di permukaan besi, oksigen memasuki dari kedua-dua sisi ke kawasan katod, anod di tengah bawah titisan', en:'Water droplet on an iron surface, oxygen entering from both sides into cathode regions, anode in the middle beneath the droplet' },
    o:[ {bm:'Fe²⁺ + 2e⁻ → Fe',           en:'Fe²⁺ + 2e⁻ → Fe'},
        {bm:'Fe → Fe²⁺ + 2e⁻',           en:'Fe → Fe²⁺ + 2e⁻'},
        {bm:'4OH⁻ → O₂ + 2H₂O + 4e⁻',    en:'4OH⁻ → O₂ + 2H₂O + 4e⁻'},
        {bm:'O₂ + 2H₂O + 4e⁻ → 4OH⁻',    en:'O₂ + 2H₂O + 4e⁻ → 4OH⁻'} ],
    a:1,
    w:{ bm:'Di <b>anod</b> (di bawah titisan air, oksigen terhad), besi <b>dioksidakan</b>: <b>Fe → Fe²⁺ + 2e⁻</b> ✓. Persamaan D berlaku di <b>katod</b> (di tepi, oksigen mencukupi) — elektron mengalir dari anod ke katod untuk menurunkan oksigen.',
        en:'At the <b>anode</b> (under the water droplet, where oxygen is limited), iron is <b>oxidised</b>: <b>Fe → Fe²⁺ + 2e⁻</b> ✓. Equation D happens at the <b>cathode</b> (at the edges, where oxygen is plentiful) — electrons flow from the anode to the cathode to reduce oxygen there.' } },

  { n:23, topic:'THERMO',
    q:{ bm:'Rajah 15 menunjukkan susunan radas untuk menentukan haba tindak balas: larutan magnesium nitrat (29.0°C) dicampur dengan larutan natrium karbonat (29.0°C), menghasilkan mendakan putih dan suhu campuran menurun kepada 26.0°C. Antara berikut, pernyataan manakah yang betul?',
        en:'Diagram 15 shows the apparatus set-up to determine the heat of reaction: magnesium nitrate solution (29.0°C) is mixed with sodium carbonate solution (29.0°C), producing a white precipitate and the mixture temperature drops to 26.0°C. Which of the following statements is correct?' },
    o:[ {bm:'Tindak balas eksotermik',                                            en:'Exothermic reaction'},
        {bm:'Nilai ΔH dalam tindak balas ini adalah negatif',                     en:'The value of ΔH for the reaction is negative'},
        {bm:'Tenaga haba diserap semasa tindak balas berlaku',                    en:'Heat energy is absorbed during the reaction'},
        {bm:'Jumlah kandungan tenaga hasil tindak balas lebih rendah daripada jumlah kandungan tenaga bahan tindak balas', en:'The total energy content of the products is lower than the total energy content of the reactants'} ],
    a:2,
    w:{ bm:'Suhu <b>menurun</b> (29.0 → 26.0°C) — tindak balas <b>menyerap haba daripada persekitaran</b>, iaitu <b>endotermik</b> ✓. Endotermik bukan eksotermik (A salah); ΔH endotermik ialah <b>positif</b>, bukan negatif (B salah); tenaga hasil sebenarnya <b>lebih tinggi</b> daripada bahan tindak balas (D salah, itu perihal eksotermik).',
        en:'Temperature <b>drops</b> (29.0 → 26.0°C) — the reaction <b>absorbs heat from the surroundings</b>, i.e. it is <b>endothermic</b> ✓. It is endothermic, not exothermic (A wrong); an endothermic ΔH is <b>positive</b>, not negative (B wrong); the products actually hold <b>more</b> energy than the reactants (D wrong — that describes exothermic reactions).' } },

  { n:24, topic:'THERMO',
    q:{ bm:'Pasangan manakah yang menghasilkan haba peneutralan paling rendah?',
        en:'Which pair produces the lowest heat of neutralisation?' },
    o:[ {bm:'Asid hidroklorik dan larutan ammonia',      en:'Hydrochloric acid and ammonia solution'},
        {bm:'Asid hidroklorik dan larutan natrium hidroksida', en:'Hydrochloric acid and sodium hydroxide solution'},
        {bm:'Asid etanoik dan larutan ammonia',          en:'Ethanoic acid and ammonia solution'},
        {bm:'Asid etanoik dan larutan natrium hidroksida', en:'Ethanoic acid and sodium hydroxide solution'} ],
    a:2,
    w:{ bm:'Asid dan alkali <b>lemah</b> (asid etanoik + ammonia) menggunakan sebahagian tenaga tindak balas untuk mengion sepenuhnya dahulu — jadi haba <b>bersih yang dibebaskan paling rendah</b> ✓. Pasangan kuat-kuat (HCl+NaOH) memberi haba peneutralan piawai penuh (≈57 kJ mol⁻¹); pasangan bercampur (kuat+lemah) berada di antara.',
        en:'A <b>weak</b> acid with a <b>weak</b> alkali (ethanoic acid + ammonia) spends part of the reaction’s energy fully ionising them first — so the <b>net heat released is lowest</b> ✓. The strong–strong pair (HCl + NaOH) gives the full standard heat of neutralisation (≈57 kJ mol⁻¹); mixed strong/weak pairs fall in between.' } },

  { n:25, topic:'POLYMER',
    q:{ bm:'Rajah 16 menunjukkan struktur bagi sebahagian suatu polimer: unit ulangan −CH(CH₃)−CH(CH₃)− berulang. Apakah monomer bagi polimer tersebut?',
        en:'Diagram 16 shows part of the structure of a polymer: the repeat unit −CH(CH₃)−CH(CH₃)− repeating. What is the monomer of the polymer?' },
    img:'img/kimia/db72a08d0196.webp',
    alt:{ bm:'Rantai polimer berulang dengan CH3 dan H tergantung pada setiap karbon utama; empat struktur pilihan A-D di bawah', en:'Repeating polymer chain with CH3 and H hanging off every backbone carbon; four candidate structures A-D below' },
    o:[ {bm:'A: CH₃−CH₂−CH₂−CH₃ (butana, ikatan tunggal sahaja)',    en:'A: CH₃−CH₂−CH₂−CH₃ (butane, single bonds only)'},
        {bm:'B: CH₃−CH₂−CH₃ (propana, ikatan tunggal sahaja)',       en:'B: CH₃−CH₂−CH₃ (propane, single bonds only)'},
        {bm:'C: CH₃−CH=CH−CH₃ (but-2-ena, simetri)',                en:'C: CH₃−CH=CH−CH₃ (but-2-ene, symmetric)'},
        {bm:'D: CH₃−CH=CH₂ (propena, tidak simetri)',               en:'D: CH₃−CH=CH₂ (propene, not symmetric)'} ],
    a:2,
    w:{ bm:'Unit ulangan menunjukkan <b>setiap</b> karbon rangka membawa satu CH₃ dan satu H — corak simetri ini hanya terhasil daripada monomer <b>but-2-ena</b> (CH₃−CH=CH−CH₃) apabila ikatan ganda duanya terbuka semasa pempolimeran penambahan ✓. A dan B tepu (tiada ikatan ganda dua, tidak boleh berpolimer secara penambahan); D (propena) hanya memberi satu CH₃ setiap dua karbon, tidak sepadan dengan corak ulangan.',
        en:'The repeat unit shows <b>every</b> backbone carbon carrying one CH₃ and one H — this symmetric pattern can only come from the monomer <b>but-2-ene</b> (CH₃−CH=CH−CH₃) once its double bond opens during addition polymerisation ✓. A and B are saturated (no double bond, cannot addition-polymerise); D (propene) gives only one CH₃ per two carbons, which does not match the repeating pattern.' } },

  { n:26, topic:'RATE',
    q:{ bm:'Rajah 17 menunjukkan susunan radas untuk menentukan kadar tindak balas antara pita magnesium dan asid hidroklorik. Jadual menunjukkan empat set eksperimen berbeza kepekatan (0.5/1.0 mol dm⁻³) dan suhu (25°C/40°C). Antara set eksperimen berikut, yang manakah mengambil masa paling panjang untuk pembuakan berhenti?',
        en:'Diagram 17 shows the apparatus set-up to determine the rate of reaction between magnesium ribbon and hydrochloric acid. The table shows four experiment sets varying concentration (0.5/1.0 mol dm⁻³) and temperature (25°C/40°C). Which of the following experiments takes the longest time for the effervescence to stop?' },
    o:[ {bm:'0.5 mol dm⁻³ asid hidroklorik, 25.0°C', en:'0.5 mol dm⁻³ hydrochloric acid, 25.0°C'},
        {bm:'0.5 mol dm⁻³ asid hidroklorik, 40.0°C', en:'0.5 mol dm⁻³ hydrochloric acid, 40.0°C'},
        {bm:'1.0 mol dm⁻³ asid hidroklorik, 25.0°C', en:'1.0 mol dm⁻³ hydrochloric acid, 25.0°C'},
        {bm:'1.0 mol dm⁻³ asid hidroklorik, 40.0°C', en:'1.0 mol dm⁻³ hydrochloric acid, 40.0°C'} ],
    a:0,
    w:{ bm:'Kepekatan <b>paling rendah</b> (0.5 mol dm⁻³) dan suhu <b>paling rendah</b> (25.0°C) bersama-sama memberi <b>kadar paling perlahan</b> — jadi masa untuk pembuakan berhenti paling <b>panjang</b> ✓.',
        en:'The <b>lowest</b> concentration (0.5 mol dm⁻³) combined with the <b>lowest</b> temperature (25.0°C) gives the <b>slowest</b> rate — so the time for effervescence to stop is the <b>longest</b> ✓.' } },

  { n:27, topic:'CARBON',
    q:{ bm:'Rajah 18 menunjukkan formula struktur ester yang terkandung dalam jem epal: CH₃CH₂CH₂CO-O-CH₃. Antara berikut, sebatian manakah yang boleh menghasilkan ester tersebut?',
        en:'Diagram 18 shows the structural formula of ester contained in apple jam: CH₃CH₂CH₂CO-O-CH₃. Which of the following substances can produce the ester?' },
    img:'img/kimia/495b8a38cd41.webp',
    alt:{ bm:'Formula penuh ester: H-C-C-C-C(=O)-O-C-H dengan H pada setiap karbon, gugusan asil 4-karbon dan gugusan metil', en:'Full ester formula: H-C-C-C-C(=O)-O-C-H with H on each carbon, a 4-carbon acyl group and a methyl group' },
    o:[ {bm:'CH₃OH dan C₃H₇COOH', en:'CH₃OH and C₃H₇COOH'},
        {bm:'C₄H₉OH dan HCOOCH₃', en:'C₄H₉OH and HCOOCH₃'},
        {bm:'C₃H₇OH dan HCOOCH₃', en:'C₃H₇OH and HCOOCH₃'},
        {bm:'C₂H₅OH dan C₃H₇COOH',en:'C₂H₅OH and C₃H₇COOH'} ],
    a:0,
    w:{ bm:'Bahagian asil (CH₃CH₂CH₂CO−, 4 karbon) datang daripada <b>asid butanoik, C₃H₇COOH</b>; bahagian alkoksi (−O−CH₃, 1 karbon) datang daripada <b>metanol, CH₃OH</b> ✓ — ester ini ialah metil butanoat. Kira bilangan karbon pada setiap belah kumpulan −COO− untuk mengesahkan pilihan lain salah.',
        en:'The acyl part (CH₃CH₂CH₂CO−, 4 carbons) comes from <b>butanoic acid, C₃H₇COOH</b>; the alkoxy part (−O−CH₃, 1 carbon) comes from <b>methanol, CH₃OH</b> ✓ — this ester is methyl butanoate. Count the carbons on each side of the −COO− group to confirm the other options are wrong.' } },

  { n:28, topic:'CARBON',
    q:{ bm:'Rajah 19 menunjukkan formula struktur satu sebatian: CH₂=CH−CH(CH₂CH₃)−CH₃ dengan rantai etil bercabang. Apakah nama IUPAC sebatian tersebut?',

  { n:4, topic:'REDOX',

    w:{ bm:'Pengoksidaan = <b>kehilangan elektron</b> (atau terima oksigen, kehilangan hidrogen, nombor pengoksidaan bertambah) ✓. Kehilangan oksigen, penambahan hidrogen dan pengurangan nombor pengoksidaan semuanya menggambarkan <b>penurunan</b>.',
        en:'Oxidation = <b>loss of electrons</b> (or gaining oxygen, losing hydrogen, an increasing oxidation number) ✓. Losing oxygen, gaining hydrogen and a decreasing oxidation number all describe <b>reduction</b>.' } },

  { n:5, topic:'PTABLE',
    q:{ bm:'Pernyataan berikut merujuk kepada sumbangan seorang ahli sains dalam membangunkan Jadual Berkala Unsur: mengkaji frekuensi sinar-X yang dibebaskan oleh pelbagai unsur dan menemui hubungan spektrum sinar-X dengan nombor proton; menyusun unsur mengikut tertib nombor proton menaik. Siapakah ahli saintis tersebut?',
        en:'The following statement refers to the contribution of a scientist in the development of the Periodic Table of Elements: studied the frequency of X-rays released by various elements and found a relationship between the X-ray spectrum and proton numbers; arranged the elements according to increasing proton numbers. Who was the scientist?' },
    o:[ {bm:'Lothar Meyer',    en:'Lothar Meyer'},
        {bm:'Henry Moseley',   en:'Henry Moseley'},
        {bm:'John Newlands',   en:'John Newlands'},
        {bm:'Dmitri Mendeleev',en:'Dmitri Mendeleev'} ],
    a:1,
    w:{ bm:'<b>Henry Moseley</b> menggunakan spektroskopi sinar-X untuk menentukan nombor proton sebenar dan menyusun semula unsur mengikutnya ✓. Mendeleev menyusun mengikut jisim atom; Newlands mencadangkan "Hukum Oktaf"; Meyer menyusun berdasarkan isipadu atom.',
        en:'<b>Henry Moseley</b> used X-ray spectroscopy to determine true proton numbers and re-ordered the elements by them ✓. Mendeleev arranged by atomic mass; Newlands proposed the "Law of Octaves"; Meyer arranged elements by atomic volume.' } },

  { n:6, topic:'INTRO',

    alt:{ bm:'Tabung didih berisi naftalena pepejal dengan termometer, dipanaskan dalam kukus air di dalam kelalang kon', en:'A boiling tube of solid naphthalene with a thermometer, heated in a water bath inside a conical flask' },

        en:'This set-up — naphthalene warmed in a water bath then left to cool while temperature is recorded — is the standard method for plotting a cooling curve and finding the <b>freezing point</b> ✓ (the plateau as naphthalene resolidifies).' } },

  { n:8, topic:'INDUSTRY',

  { n:10, topic:'CARBON',

  { n:14, topic:'PTABLE',
    q:{ bm:'Jadual 1 menunjukkan susunan elektron bagi atom W, X, Y dan Z: W = 2.8.2, X = 2.8.3, Y = 2.8.4, Z = 2.8.5. Susun unsur W, X, Y dan Z mengikut pengurangan saiz atom.',
        en:'Table 1 shows the electron arrangement of elements W, X, Y and Z: W = 2.8.2, X = 2.8.3, Y = 2.8.4, Z = 2.8.5. Arrange elements W, X, Y and Z according to decreasing order of atomic size.' },

  { n:15, topic:'INTRO',
    q:{ bm:'Langkah-langkah berikut terlibat dalam kaedah saintifik: P — Mengumpul data, Q — Membina hipotesis, R — Membuat kesimpulan, S — Menganalisis data. Yang manakah antara berikut menunjukkan urutan langkah yang betul?',

    note:'Kertas asal hanya mencetak tiga pilihan (A–C); tiada pilihan D.',
    w:{ bm:'Kaedah saintifik: bentuk <b>hipotesis</b> (Q) → <b>kumpul data</b> melalui eksperimen (P) → <b>analisis data</b> (S) → <b>buat kesimpulan</b> (R). Urutan: <b>Q, P, S, R</b> ✓.',

        en:'<b>Photosynthesis</b> absorbs light energy and converts it into chemical energy — <b>endothermic</b> ✓. Combustion, precipitation and neutralisation all release heat (exothermic).' } },

  { n:21, topic:'MOLE',

        {bm:'2 mol atom ferum bertindak balas dengan 3 mol molekul klorin',                               en:'2 mol of iron atoms react with 3 mol of chlorine molecules'},
        {bm:'2 mol atom ferum bertindak balas dengan 3 mol molekul klorin menghasilkan 2 mol unit ferum(III) klorida', en:'2 mol of iron atoms react with 3 mol of chlorine molecules producing 2 mol of iron(III) chloride units'},
        {bm:'2 mol atom ferum bertindak balas dengan 6 mol molekul klorin menghasilkan 2 mol unit ferum(III) klorida', en:'2 mol of iron atoms react with 6 mol of chlorine molecules producing 2 mol of iron(III) chloride units'} ],
    a:2,
    w:{ bm:'Klorin ialah gas <b>dwiatom (Cl₂)</b>, jadi "3Cl₂" bermaksud <b>3 mol molekul</b> klorin, bukan atom (A salah). Persamaan memberi nisbah tepat 2 Fe : 3 Cl₂ : 2 FeCl₃ — pernyataan C menyatakan ketiga-tiganya dengan betul ✓; D tersalah nisbah klorin (6, bukan 3).',
