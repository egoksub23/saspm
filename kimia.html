    a:3,
    w:{ bm:'Dalam mana-mana larutan akueus, [H⁺] × [OH⁻] adalah malar, jadi larutan dengan <b>paling banyak</b> ion H⁺ mempunyai <b>paling sedikit</b> ion OH⁻. Susunan [OH⁻] dari tinggi ke rendah: KOH (alkali kuat) → ammonia (alkali lemah) → asid nitrik (monobes) → <b>asid sulfurik</b> (dwibes, jadi 2 kali ganda H⁺ pada kepekatan yang sama). Maka asid sulfurik mempunyai paling sedikit ion hidroksida. <b>Perhatian:</b> skema rasmi menyatakan B — lihat nota soalan ini.',
        en:'In any aqueous solution [H⁺] × [OH⁻] is constant, so the solution with the <b>most</b> H⁺ ions has the <b>fewest</b> OH⁻ ions. Ranking [OH⁻] from high to low: KOH (strong alkali) → ammonia (weak alkali) → nitric acid (monoprotic) → <b>sulphuric acid</b> (diprotic, so twice the H⁺ at the same concentration). Sulphuric acid therefore has the fewest hydroxide ions. <b>Note:</b> the official skema states B — see this question’s note.' } },

  { n:17, topic:'BOND',
    q:{ bm:'Jadual 2 menunjukkan maklumat berkaitan bahan P, Q dan R. Antara berikut, yang manakah kemungkinan sebatian kovalen ringkas?'+
           '<table><tr><th>Bahan</th><th>Takat lebur (°C)</th><th>Kekonduksian elektrik</th><th>Keadaan fizik</th></tr>'+
           '<tr><td>P</td><td>−101</td><td>Tidak mengkonduksi / Does not conduct</td><td>Gas</td></tr>'+
           '<tr><td>Q</td><td>801</td><td>Mengkonduksi dalam leburan / Conducts when molten</td><td>Pepejal / Solid</td></tr>'+
           '<tr><td>R</td><td>80</td><td>Tidak mengkonduksi / Does not conduct</td><td>Pepejal / Solid</td></tr></table><span class="fig">JADUAL 2 · TABLE 2</span>',
        en:'Table 2 shows information related to substances P, Q and R. Which of the following is most likely a simple covalent compound?'+
           '<table><tr><th>Substance</th><th>Melting point (°C)</th><th>Electrical conductivity</th><th>Physical state</th></tr>'+
           '<tr><td>P</td><td>−101</td><td>Does not conduct</td><td>Gas</td></tr>'+
           '<tr><td>Q</td><td>801</td><td>Conducts when molten</td><td>Solid</td></tr>'+
           '<tr><td>R</td><td>80</td><td>Does not conduct</td><td>Solid</td></tr></table><span class="fig">JADUAL 2 · TABLE 2</span>' },
    o:[ {bm:'P sahaja',en:'P only'}, {bm:'Q sahaja',en:'Q only'},
        {bm:'P dan R',en:'P and R'}, {bm:'Q dan R',en:'Q and R'} ],
    a:2,
    w:{ bm:'Sebatian kovalen ringkas dikenali daripada dua petunjuk bersama: takat lebur <b>rendah</b> (daya antara molekul lemah) dan <b>tidak</b> mengkonduksi elektrik dalam apa jua keadaan. P (−101 °C) dan R (80 °C) memenuhi kedua-duanya. Q mempunyai takat lebur tinggi dan mengkonduksi apabila lebur — itu sebatian <b>ion</b>.',
        en:'A simple covalent compound is spotted by two clues together: a <b>low</b> melting point (weak intermolecular forces) and <b>no</b> electrical conductivity in any state. P (−101 °C) and R (80 °C) satisfy both. Q has a high melting point and conducts when molten — that is an <b>ionic</b> compound.' } },

  { n:18, topic:'ATOM', img:'img/kimia/0d14f25075a1.webp',
    alt:{ bm:'Rajah 9: kelimpahan semulajadi 75.0% pada jisim 35 dan 25.0% pada jisim 37.',
          en:'Diagram 9: natural abundance 75.0% at mass 35 and 25.0% at mass 37.' },
    q:{ bm:'Klorin wujud secara semulajadi dalam dua isotop. Rajah 9 menunjukkan kelimpahan semulajadi melawan jisim isotop bagi klorin. Apakah jisim atom relatif bagi klorin?',
        en:'Chlorine exists naturally as two isotopes. Diagram 9 shows the natural abundance against the mass of the chlorine isotopes. What is the relative atomic mass of chlorine?' },
    o:[ {bm:'35.50',en:'35.50'}, {bm:'36.00',en:'36.00'},
        {bm:'37.50',en:'37.50'}, {bm:'72.00',en:'72.00'} ],
    a:0,
    w:{ bm:'Gunakan purata <b>berwajaran</b>, bukan purata biasa: (75 × 35 + 25 × 37) ÷ 100 = (2625 + 925) ÷ 100 = <b>35.50</b>. Jawapan 36.00 ialah purata mudah (35 + 37) ÷ 2, yang mengabaikan fakta bahawa Cl-35 tiga kali lebih banyak.',
        en:'Use a <b>weighted</b> average, not a plain one: (75 × 35 + 25 × 37) ÷ 100 = (2625 + 925) ÷ 100 = <b>35.50</b>. The 36.00 option is the simple average (35 + 37) ÷ 2, which ignores that Cl-35 is three times as abundant.' } },

  { n:19, topic:'POLYMER', img:'img/kimia/f02dc4df6aef.webp',
    alt:{ bm:'Rajah 10: unit berulang –CH₂–CH₂– dengan subskrip n.',
          en:'Diagram 10: the repeating unit –CH₂–CH₂– with subscript n.' },
    q:{ bm:'Rajah 10 menunjukkan formula struktur bagi satu polimer. Antara yang berikut, yang manakah merupakan kegunaan polimer tersebut?',
        en:'Diagram 10 shows the structural formula of a polymer. Which of the following is a use of the polymer?' },
    o:[ {bm:'Tayar',en:'Tyre'}, {bm:'Paip air',en:'Water pipe'},
        {bm:'Botol plastik',en:'Plastic bottle'}, {bm:'Kereta mainan',en:'Toy car'} ],
    a:2,
    w:{ bm:'Unit berulang –CH₂–CH₂– ialah <b>polietena</b>, dibuat daripada etena. Ia ringan, lentur dan lengai secara kimia → botol dan beg plastik. Tayar ialah getah, paip air ialah PVC (yang mempunyai atom klorin), dan kereta mainan biasanya polistirena atau ABS.',
        en:'The repeating unit –CH₂–CH₂– is <b>polyethene</b>, made from ethene. It is light, flexible and chemically inert → plastic bottles and bags. Tyres are rubber, water pipes are PVC (which has chlorine atoms), and toy cars are usually polystyrene or ABS.' } },

  { n:20, topic:'BOND',
    q:{ bm:'Rajah 11 menunjukkan setengah persamaan bagi pembentukan ion:<br><span class="fig">M → M<sup>2+</sup> + 2e⁻<br>F₂ + 2e⁻ → 2F⁻</span><br>Apakah formula sebatian yang terbentuk?',
        en:'Diagram 11 shows the half-equations for the formation of ions:<br><span class="fig">M → M<sup>2+</sup> + 2e⁻<br>F₂ + 2e⁻ → 2F⁻</span><br>What is the formula of the compound formed?' },
    o:[ {bm:'MF',en:'MF'}, {bm:'MF₂',en:'MF₂'}, {bm:'M₂F',en:'M₂F'}, {bm:'M₂F₂',en:'M₂F₂'} ],
    a:1,
    w:{ bm:'M kehilangan 2 elektron → <b>M²⁺</b>; setiap F menerima 1 elektron → <b>F⁻</b>. Untuk mengimbangi +2, diperlukan <b>dua</b> ion F⁻ → <b>MF₂</b>. Formula mesti sentiasa dalam nisbah paling ringkas, jadi M₂F₂ tidak sah walaupun casnya seimbang.',
        en:'M loses 2 electrons → <b>M²⁺</b>; each F gains 1 electron → <b>F⁻</b>. To balance the +2 you need <b>two</b> F⁻ ions → <b>MF₂</b>. A formula must always be in its simplest ratio, so M₂F₂ is invalid even though its charges balance.' } },

  { n:21, topic:'PTABLE',
    q:{ bm:'Rajah 12 menunjukkan unsur Kumpulan 17 dalam Jadual Berkala Unsur: <sup>19</sup>F<sub>9</sub>, <sup>35</sup>Cl<sub>17</sub>, <sup>80</sup>Br<sub>35</sub>, <sup>127</sup>I<sub>53</sub>. Antara yang berikut, yang manakah betul tentang perubahan sifat unsur apabila menuruni kumpulan?',
        en:'Diagram 12 shows the Group 17 elements in the Periodic Table: <sup>19</sup>F<sub>9</sub>, <sup>35</sup>Cl<sub>17</sub>, <sup>80</sup>Br<sub>35</sub>, <sup>127</sup>I<sub>53</sub>. Which of the following is correct about the change in the properties of the elements when going down the group?' },
    o:[ {bm:'Takat didih berkurang',en:'Boiling point decreases'},
        {bm:'Ketumpatan berkurang',en:'Density decreases'},
        {bm:'Saiz atom berkurang',en:'Atomic size decreases'},
        {bm:'Kereaktifan berkurang',en:'Reactivity decreases'} ],
    a:3,
    w:{ bm:'Menuruni Kumpulan 17, saiz atom <b>bertambah</b> (petala bertambah), jadi elektron yang masuk berada lebih jauh daripada nukleus dan lebih terlindung → lebih <b>sukar</b> menerima elektron → kereaktifan <b>berkurang</b> ✓. Takat didih dan ketumpatan kedua-duanya <b>bertambah</b> menuruni kumpulan, jadi A, B dan C semuanya terbalik.',
        en:'Down Group 17 the atomic size <b>increases</b> (more shells), so an incoming electron is further from the nucleus and better shielded → it is <b>harder</b> to gain an electron → reactivity <b>decreases</b> ✓. Boiling point and density both <b>increase</b> down the group, so A, B and C are all reversed.' } },

  { n:22, topic:'BOND', img:'img/kimia/3707a49d38e5.webp',
    alt:{ bm:'Rajah 13: berus cat dalam air (cat tidak larut) dan dalam propanon (cat larut).',
          en:'Diagram 13: a paint brush in water (paint does not dissolve) and in propanone (paint dissolves).' },
    q:{ bm:'Rajah 13 menunjukkan berus cat yang dibersihkan menggunakan dua pelarut yang berbeza. Antara pernyataan berikut, yang manakah benar menerangkan pemerhatian dalam Rajah 13?',
        en:'Diagram 13 shows a paint brush being cleaned using two different solvents. Which of the following statements correctly explains the observation in Diagram 13?' },
    o:[ {bm:'Propanon ialah pelarut yang boleh memutuskan ikatan kovalen dalam cat',
         en:'Propanone is a solvent that can break the covalent bonds in the paint'},
        {bm:'Cat larut dalam propanon kerana propanon merupakan pelarut organik yang boleh mengatasi daya tarikan antara molekul cat',
         en:'The paint dissolves in propanone because propanone is an organic solvent that can overcome the intermolecular forces between the paint molecules'},
        {bm:'Cat larut dalam air kerana air membentuk ikatan hidrogen dengan molekul cat',
         en:'The paint dissolves in water because water forms hydrogen bonds with the paint molecules'},
        {bm:'Air tidak dapat membersihkan cat kerana air mempunyai takat didih yang lebih tinggi daripada propanon',
         en:'Water cannot clean the paint because water has a higher boiling point than propanone'} ],
    a:1,
    w:{ bm:'Prinsipnya “<b>serupa melarutkan serupa</b>”: cat terdiri daripada molekul organik bukan polar, dan propanon ialah pelarut organik, jadi ia boleh mengatasi daya antara molekul cat. Melarut <b>tidak</b> memutuskan ikatan kovalen di dalam molekul (A salah), rajah menunjukkan cat <b>tidak</b> larut dalam air (C salah), dan takat didih tiada kaitan dengan keterlarutan (D salah).',
        en:'The principle is “<b>like dissolves like</b>”: paint is made of non-polar organic molecules and propanone is an organic solvent, so it can overcome the forces between the paint molecules. Dissolving does <b>not</b> break the covalent bonds inside molecules (A wrong), the diagram shows the paint does <b>not</b> dissolve in water (C wrong), and boiling point has nothing to do with solubility (D wrong).' } },

  { n:23, topic:'RATE', img:'img/kimia/7599840836b8.webp',
    alt:{ bm:'Rajah 14: kepekatan asid laktik melawan hari; lengkung suhu bilik naik jauh lebih curam daripada lengkung peti sejuk.',
          en:'Diagram 14: lactic acid concentration against days; the room-temperature curve rises far more steeply than the refrigerated one.' },
    q:{ bm:'Rajah 14 menunjukkan graf kepekatan asid laktik melawan bilangan hari bagi dua sampel susu yang sama jenis. Antara yang berikut, pernyataan yang manakah betul menerangkan kadar penghasilan asid laktik?',
        en:'Diagram 14 shows a graph of concentration of lactic acid against number of days for two milk samples of the same type. Which of the following statements correctly explains the rate of production of lactic acid?' },
    o:[ {bm:'Suhu rendah meningkatkan tenaga pengaktifan tindak balas', en:'Low temperature increases the activation energy of the reaction'},
        {bm:'Suhu tinggi menyebabkan frekuensi perlanggaran berkesan berkurang', en:'High temperature causes the frequency of effective collisions to decrease'},
        {bm:'Suhu rendah menyebabkan penghasilan asid laktik yang rendah', en:'Low temperature causes a low production of lactic acid'},
        {bm:'Suhu tinggi menghalang aktiviti bakteria yang menghasilkan asid laktik', en:'High temperature inhibits the activity of bacteria that produce lactic acid'} ],
    a:2,
    w:{ bm:'Susu dalam peti sejuk menunjukkan lengkung yang jauh lebih landai → <b>suhu rendah = penghasilan asid laktik yang rendah</b> ✓, sebab itulah penyejukan mengawet susu. Suhu tidak pernah mengubah tenaga pengaktifan (A salah); suhu tinggi <b>menambah</b> perlanggaran berkesan (B terbalik); dan suhu tinggi <b>menggalakkan</b> pertumbuhan bakteria, bukan menghalangnya (D terbalik).',
        en:'The refrigerated milk shows a much shallower curve → <b>low temperature = low lactic acid production</b> ✓, which is exactly why chilling preserves milk. Temperature never changes the activation energy (A wrong); high temperature <b>increases</b> effective collisions (B reversed); and high temperature <b>encourages</b> bacterial growth rather than inhibiting it (D reversed).' } },

  { n:24, topic:'REDOX',
    q:{ bm:'Rajah 15 menunjukkan satu sel kimia dengan logam X dalam larutan XSO₄ dan logam Y dalam larutan YSO₄. Jadual 3 menunjukkan keupayaan elektrod piawai bagi beberapa logam. Pasangan logam X dan logam Y menghasilkan bacaan voltan yang paling tinggi. Apakah logam X dan logam Y?'+
           '<table><tr><th>Tindak balas sel setengah / Half-cell equation</th><th>E° / V (298 K)</th></tr>'+
           '<tr><td>Sn²⁺ + 2e ⇌ Sn</td><td>−0.14</td></tr><tr><td>Fe²⁺ + 2e ⇌ Fe</td><td>−0.44</td></tr>'+
           '<tr><td>Zn²⁺ + 2e ⇌ Zn</td><td>−0.76</td></tr><tr><td>Cu²⁺ + 2e ⇌ Cu</td><td>+0.34</td></tr></table><span class="fig">JADUAL 3 · TABLE 3</span>',
        en:'Diagram 15 shows a chemical cell with metal X in XSO₄ solution and metal Y in YSO₄ solution. Table 3 shows the standard electrode potentials of some metals. The pair of metals X and Y produced the highest voltage reading. What are metals X and Y?'+
           '<table><tr><th>Tindak balas sel setengah / Half-cell equation</th><th>E° / V (298 K)</th></tr>'+
           '<tr><td>Sn²⁺ + 2e ⇌ Sn</td><td>−0.14</td></tr><tr><td>Fe²⁺ + 2e ⇌ Fe</td><td>−0.44</td></tr>'+
           '<tr><td>Zn²⁺ + 2e ⇌ Zn</td><td>−0.76</td></tr><tr><td>Cu²⁺ + 2e ⇌ Cu</td><td>+0.34</td></tr></table><span class="fig">JADUAL 3 · TABLE 3</span>' },
    o:[ {bm:'X: Zink &nbsp;·&nbsp; Y: Kuprum', en:'X: Zinc &nbsp;·&nbsp; Y: Copper'},
        {bm:'X: Stanum &nbsp;·&nbsp; Y: Ferum',en:'X: Tin &nbsp;·&nbsp; Y: Iron'},
        {bm:'X: Zink &nbsp;·&nbsp; Y: Ferum',  en:'X: Zinc &nbsp;·&nbsp; Y: Iron'},
        {bm:'X: Stanum &nbsp;·&nbsp; Y: Kuprum',en:'X: Tin &nbsp;·&nbsp; Y: Copper'} ],
    a:0,
    w:{ bm:'Voltan sel = <b>beza</b> antara dua nilai E°, jadi pilih yang paling jauh terpisah dalam jadual: Zn (−0.76) dan Cu (+0.34) → 0.34 − (−0.76) = <b>1.10 V</b>. Bandingkan: Zn/Fe hanya 0.32 V, Sn/Cu 0.48 V, Sn/Fe 0.30 V.',
        en:'Cell voltage = the <b>difference</b> between two E° values, so pick the pair furthest apart in the table: Zn (−0.76) and Cu (+0.34) → 0.34 − (−0.76) = <b>1.10 V</b>. Compare: Zn/Fe is only 0.32 V, Sn/Cu 0.48 V, Sn/Fe 0.30 V.' } },

  { n:25, topic:'CARBON', img:'img/kimia/764a541b066a.webp',
    alt:{ bm:'Rajah 16: struktur I but-2-ena (C=C), II butana, III 2-metilbut-1-ena (C=C), IV metilpropana.',
          en:'Diagram 16: structure I but-2-ene (C=C), II butane, III 2-methylbut-1-ene (C=C), IV methylpropane.' },
    q:{ bm:'Rajah 16 menunjukkan formula struktur bagi empat hidrokarbon. Antara berikut yang manakah menyahwarnakan warna perang air bromin?',
        en:'Diagram 16 shows the structural formulae of four hydrocarbons. Which of the following decolourise the brown colour of bromine water?' },
    o:[ {bm:'I dan II',en:'I and II'}, {bm:'I dan III',en:'I and III'},
        {bm:'II dan IV',en:'II and IV'}, {bm:'III dan IV',en:'III and IV'} ],
    a:1,
    w:{ bm:'Air bromin dinyahwarnakan hanya oleh hidrokarbon <b>tak tepu</b> — bromin menambah merentasi ikatan ganda dua C=C. Imbas keempat-empat struktur untuk C=C: I dan III mempunyainya ✓; II dan IV hanya ikatan tunggal (alkana tepu), jadi tiada perubahan warna.',
        en:'Bromine water is decolourised only by <b>unsaturated</b> hydrocarbons — the bromine adds across the C=C double bond. Scan all four structures for a C=C: I and III have one ✓; II and IV have only single bonds (saturated alkanes), so no colour change.' } },

  { n:26, topic:'MOLE',
    q:{ bm:'Rajah 17 menunjukkan 1 mol gas oksigen dan 1 mol air. Antara yang berikut, pernyataan manakah yang betul menerangkan bilangan zarah setiap bahan?<br><span class="fig">[Pemalar Avogadro: 6.02 × 10²³ mol⁻¹]</span>',
        en:'Diagram 17 shows 1 mol of oxygen gas and 1 mol of water. Which of the following statements correctly describes the number of particles of each substance?<br><span class="fig">[Avogadro constant: 6.02 × 10²³ mol⁻¹]</span>' },
    o:[ {bm:'Satu mol oksigen mengandungi 6.02 × 10²³ atom',    en:'One mole of oxygen contains 6.02 × 10²³ atoms'},
        {bm:'Satu mol oksigen mengandungi 6.02 × 10²³ molekul', en:'One mole of oxygen contains 6.02 × 10²³ molecules'},
        {bm:'Satu mol air mengandungi 6.02 × 10²³ ion',         en:'One mole of water contains 6.02 × 10²³ ions'},
        {bm:'Satu mol air mengandungi 6.02 × 10²³ atom',        en:'One mole of water contains 6.02 × 10²³ atoms'} ],
    a:1,
    w:{ bm:'Satu mol mana-mana bahan mengandungi 6.02 × 10²³ <b>unit formulanya</b> — kuncinya ialah memadankan jenis zarah dengan betul. Gas oksigen wujud sebagai <b>molekul</b> O₂ ✓, jadi 1 mol = 6.02 × 10²³ molekul (dan 2 × itu untuk atom, jadi A salah). Air ialah kovalen, jadi tiada ion (C salah), dan 1 mol H₂O mengandungi <b>3</b> × 6.02 × 10²³ atom (D salah).',
        en:'One mole of any substance contains 6.02 × 10²³ of <b>its formula units</b> — the trick is matching the particle type correctly. Oxygen gas exists as O₂ <b>molecules</b> ✓, so 1 mol = 6.02 × 10²³ molecules (and twice that in atoms, so A is wrong). Water is covalent, so there are no ions (C wrong), and 1 mol of H₂O contains <b>3</b> × 6.02 × 10²³ atoms (D wrong).' } },

  { n:27, topic:'THERMO', img:'img/kimia/8dcb3500b802.webp',
    alt:{ bm:'Rajah 18: aras tenaga H₂SO₄ + 2KOH di atas, K₂SO₄ + 2H₂O di bawah, ΔH = −57 kJ mol⁻¹.',
          en:'Diagram 18: energy level of H₂SO₄ + 2KOH above, K₂SO₄ + 2H₂O below, ΔH = −57 kJ mol⁻¹.' },
    q:{ bm:'Rajah 18 menunjukkan gambar rajah aras tenaga bagi tindak balas peneutralan antara 50 cm³ asid sulfurik 1.0 mol dm⁻³ dan 50 cm³ larutan kalium hidroksida 1.0 mol dm⁻³. Suhu awal asid ialah 28.0 °C dan suhu awal alkali ialah 27.5 °C. Berapakah suhu tertinggi campuran itu?<br><span class="fig">[Muatan haba tentu larutan = 4.2 J g⁻¹ °C⁻¹; ketumpatan larutan = 1.0 g cm⁻³]</span>',
        en:'Diagram 18 shows the energy level diagram for the neutralisation between 50 cm³ of 1.0 mol dm⁻³ sulphuric acid and 50 cm³ of 1.0 mol dm⁻³ potassium hydroxide solution. The initial temperature of the acid is 28.0 °C and of the alkali 27.5 °C. What is the highest temperature of the mixture?<br><span class="fig">[Specific heat capacity of solution = 4.2 J g⁻¹ °C⁻¹; density of solution = 1.0 g cm⁻³]</span>' },
    o:[ {bm:'34.54 °C',en:'34.54 °C'}, {bm:'34.79 °C',en:'34.79 °C'},
        {bm:'41.33 °C',en:'41.33 °C'}, {bm:'41.54 °C',en:'41.54 °C'} ],
    a:0,
    w:{ bm:'Cari bahan <b>penghad</b> dahulu: H₂SO₄ = 0.05 mol tetapi memerlukan 0.1 mol KOH, sedangkan hanya 0.05 mol KOH ada → KOH menghadkan → <b>0.05 mol air</b> terbentuk. Haba = 0.05 × 57 = 2.85 kJ = 2850 J. Δθ = 2850 ÷ (100 × 4.2) = <b>6.79 °C</b>. Suhu awal ialah <b>purata</b> kedua-dua larutan = (28.0 + 27.5)/2 = 27.75 °C. Suhu akhir = 27.75 + 6.79 = <b>34.54 °C</b>.',
        en:'Find the <b>limiting</b> reactant first: H₂SO₄ is 0.05 mol but needs 0.1 mol of KOH, and only 0.05 mol KOH is present → KOH limits → <b>0.05 mol of water</b> forms. Heat = 0.05 × 57 = 2.85 kJ = 2850 J. Δθ = 2850 ÷ (100 × 4.2) = <b>6.79 °C</b>. The starting temperature is the <b>average</b> of the two solutions = (28.0 + 27.5)/2 = 27.75 °C. Final = 27.75 + 6.79 = <b>34.54 °C</b>.' } },

  { n:28, topic:'THERMO', img:'img/kimia/6b1681f0d1ee.webp',
    alt:{ bm:'Rajah 19: profil tenaga, 200 kJ dari P+Q ke puncak, 70 kJ dari puncak turun ke R+S.',
          en:'Diagram 19: energy profile, 200 kJ from P+Q up to the peak, 70 kJ from the peak down to R+S.' },
    q:{ bm:'Rajah 19 menunjukkan gambar rajah aras tenaga untuk tindak balas antara P dan Q, di mana P + Q → R + S dengan ΔH = X kJ mol⁻¹. Apakah nilai X?',
        en:'Diagram 19 shows the energy level diagram for the reaction between P and Q, where P + Q → R + S with ΔH = X kJ mol⁻¹. What is the value of X?' },
    o:[ {bm:'−130',en:'−130'}, {bm:'+130',en:'+130'},
        {bm:'−270',en:'−270'}, {bm:'+270',en:'+270'} ],
    a:1,
    w:{ bm:'Naik 200 kJ dari P + Q ke puncak, kemudian turun 70 kJ ke R + S. Kedudukan bersih R + S = 200 − 70 = <b>130 kJ di atas</b> P + Q. Hasil lebih tinggi daripada bahan tindak balas → tindak balas <b>endotermik</b> → ΔH <b>positif</b> = +130. Menambah kedua-dua nilai (270) ialah perangkapnya.',
        en:'Go up 200 kJ from P + Q to the peak, then down 70 kJ to R + S. The net position of R + S = 200 − 70 = <b>130 kJ above</b> P + Q. The products are higher than the reactants → the reaction is <b>endothermic</b> → ΔH is <b>positive</b> = +130. Adding the two values (270) is the trap.' } },

  { n:29, topic:'PTABLE',
    q:{ bm:'Jadual 4 menunjukkan pemerhatian bagi tindak balas antara unsur Kumpulan 1 dengan oksigen: natrium terbakar dengan nyalaan kuning menghasilkan pepejal putih, manakala kalium terbakar dengan nyalaan ungu menghasilkan pepejal putih. Antara pernyataan yang berikut, yang manakah menerangkan pemerhatian tindak balas?',
        en:'Table 4 shows the observations for the reaction between Group 1 elements and oxygen: sodium burns with a yellow flame producing a white solid, while potassium burns with a purple flame producing a white solid. Which of the following statements describes the observation of the reactions?' },
    o:[ {bm:'Saiz atom natrium lebih besar berbanding atom kalium',
         en:'The atomic size of sodium is larger compared to a potassium atom'},
        {bm:'Daya tarikan nukleus terhadap elektron valens atom kalium lebih lemah berbanding atom natrium',
         en:'The nuclear attraction towards the valence electron of a potassium atom is weaker compared to a sodium atom'},
        {bm:'Atom natrium lebih mudah menderma elektron untuk mencapai susunan elektron oktet stabil',
         en:'A sodium atom more easily donates an electron to achieve a stable octet electron arrangement'},
        {bm:'Atom kalium lebih mudah menerima elektron untuk mencapai susunan elektron oktet stabil',
         en:'A potassium atom more easily accepts an electron to achieve a stable octet electron arrangement'} ],
    a:1,
    w:{ bm:'Kalium berada <b>di bawah</b> natrium, jadi atomnya lebih <b>besar</b> dengan lebih banyak petala (A terbalik). Elektron valensnya lebih jauh dari nukleus dan lebih terlindung → tarikan lebih <b>lemah</b> ✓ → lebih mudah dilepaskan → kalium lebih reaktif, yang menerangkan nyalaannya yang lebih rancak. Logam Kumpulan 1 <b>menderma</b> elektron, tidak pernah menerima (D salah), dan C menamakan logam yang salah.',
        en:'Potassium is <b>below</b> sodium, so its atom is <b>larger</b> with more shells (A is reversed). Its valence electron is further from the nucleus and better shielded → the attraction is <b>weaker</b> ✓ → it is released more easily → potassium is more reactive, which explains its more vigorous flame. Group 1 metals <b>donate</b> electrons, never accept them (D wrong), and C names the wrong metal.' } },

  { n:30, topic:'ATOM',
    q:{ bm:'Jadual 5 menunjukkan nombor proton bagi atom unsur U, V, W dan Z: U = 8, V = 9, W = 10, Z = 11. Pasangan zarah manakah yang mempunyai bilangan elektron yang sama?',
        en:'Table 5 shows the proton numbers of atoms U, V, W and Z: U = 8, V = 9, W = 10, Z = 11. Which pair of particles have the same number of electrons?' },
    o:[ {bm:'U dan V',en:'U and V'}, {bm:'W dan Z',en:'W and Z'},
        {bm:'W dan V⁻',en:'W and V⁻'}, {bm:'Z dan U²⁻',en:'Z and U²⁻'} ],
    a:2,
    w:{ bm:'Kira elektron dengan teliti, dan ingat bahawa ion <b>negatif</b> mempunyai elektron <b>tambahan</b>. W ialah atom neutral dengan <b>10</b> elektron; V⁻ ialah 9 + 1 = <b>10</b> ✓. Untuk D: Z ada 11 tetapi U²⁻ ada 8 + 2 = 10 — tidak sama. A dan B membandingkan atom neutral yang nombor protonnya memang berbeza.',
        en:'Count the electrons carefully, remembering that a <b>negative</b> ion has <b>extra</b> electrons. W is a neutral atom with <b>10</b> electrons; V⁻ is 9 + 1 = <b>10</b> ✓. For D: Z has 11 but U²⁻ has 8 + 2 = 10 — not equal. A and B compare neutral atoms whose proton numbers already differ.' } },

  { n:31, topic:'ACID', img:'img/kimia/1afcaf816030.webp',
    alt:{ bm:'Rajah 20: serbuk J berlebihan ditambah kepada asid sulfurik, dituras, dipanaskan, dihablurkan dan dikeringkan.',
          en:'Diagram 20: excess J powder added to sulphuric acid, filtered, heated, crystallised and dried.' },
    q:{ bm:'Rajah 20 menunjukkan susunan radas penyediaan garam Y: serbuk J ditambah <b>berlebihan</b> kepada asid sulfurik, campuran dituras, hasil turasan dipanaskan sehingga tepu, kemudian dihablurkan dan dikeringkan. Apakah J?',
        en:'Diagram 20 shows the apparatus set-up for the preparation of salt Y: powder J is added in <b>excess</b> to sulphuric acid, the mixture is filtered, the filtrate is heated until saturated, then crystallised and dried. What is J?' },
    o:[ {bm:'Na₂O',en:'Na₂O'}, {bm:'PbO',en:'PbO'}, {bm:'MgO',en:'MgO'}, {bm:'CaO',en:'CaO'} ],
    a:2,
    w:{ bm:'Kaedah “tambah berlebihan lalu turas” memerlukan dua syarat. Pertama, J mesti <b>tidak larut</b> supaya lebihannya boleh dituras — itu menyingkirkan Na₂O yang larut. Kedua, garam yang terhasil mesti <b>larut</b> supaya ia kekal dalam turasan dan boleh dihablurkan — PbSO₄ dan CaSO₄ kedua-duanya tidak larut, jadi keduanya gagal. Tinggal <b>MgO</b>, yang memberi MgSO₄ yang larut.',
        en:'The “add in excess then filter” method needs two conditions. First, J must be <b>insoluble</b> so the excess can be filtered off — that rules out the soluble Na₂O. Second, the salt formed must be <b>soluble</b> so it stays in the filtrate and can be crystallised — PbSO₄ and CaSO₄ are both insoluble, so those fail. That leaves <b>MgO</b>, which gives soluble MgSO₄.' } },

  { n:32, topic:'REDOX', img:'img/kimia/80d11b5be5de.webp',
    alt:{ bm:'Rajah 21: elektrolisis kuprum(II) sulfat dengan elektrod karbon 4.0 g (katod) dan 4.5 g (anod).',
          en:'Diagram 21: electrolysis of copper(II) sulphate with carbon electrodes of 4.0 g (cathode) and 4.5 g (anode).' },
    q:{ bm:'Rajah 21 menunjukkan susunan radas bagi elektrolisis 25 cm³ larutan kuprum(II) sulfat 1.0 mol dm⁻³ menggunakan elektrod karbon. Selepas tindak balas selesai, larutan biru bertukar menjadi tanpa warna. Apakah jisim akhir katod?<br><span class="fig">[Jisim atom relatif: Cu = 64]</span>',
        en:'Diagram 21 shows the apparatus for the electrolysis of 25 cm³ of 1.0 mol dm⁻³ copper(II) sulphate solution using carbon electrodes. After the reaction is completed, the blue solution turns colourless. What is the final mass of the cathode?<br><span class="fig">[Relative atomic mass: Cu = 64]</span>' },
    o:[ {bm:'1.6 g',en:'1.6 g'}, {bm:'4.0 g',en:'4.0 g'},
        {bm:'5.6 g',en:'5.6 g'}, {bm:'6.1 g',en:'6.1 g'} ],
    a:2,
    w:{ bm:'Larutan menjadi tanpa warna → <b>semua</b> ion Cu²⁺ telah dinyahcas. Mol Cu²⁺ = 0.025 × 1.0 = 0.025 mol → jisim kuprum yang termendap = 0.025 × 64 = <b>1.6 g</b>. Kuprum termendap pada <b>katod</b>, iaitu elektrod 4.0 g, jadi jisim akhirnya = 4.0 + 1.6 = <b>5.6 g</b>. Jawapan 1.6 g terlupa menambah jisim elektrod, dan 6.1 g menggunakan anod.',
        en:'The solution turns colourless → <b>all</b> the Cu²⁺ ions have been discharged. Moles of Cu²⁺ = 0.025 × 1.0 = 0.025 mol → mass of copper deposited = 0.025 × 64 = <b>1.6 g</b>. Copper deposits at the <b>cathode</b>, the 4.0 g electrode, so its final mass = 4.0 + 1.6 = <b>5.6 g</b>. The 1.6 g option forgets to add the electrode’s mass, and 6.1 g uses the anode.' } },

  { n:33, topic:'CARBON',
    q:{ bm:'Jadual 6 menunjukkan pemerhatian bagi sebatian Y dan Z. Y menghasilkan sebatian berbau buah nanas, C₃H₇COOC₂H₅, apabila bertindak balas dengan Z. Z bertindak balas dengan logam zink dan membebaskan gas yang menghasilkan bunyi ‘pop’ apabila diuji dengan kayu uji bernyala. Apakah Y dan Z?',
        en:'Table 6 shows the observations for compounds Y and Z. Y produces a compound with a pineapple-like smell, C₃H₇COOC₂H₅, when reacted with Z. Z reacts with zinc metal and releases a gas that produces a ‘pop’ sound when tested with a lighted wooden splinter. What are Y and Z?' },
    o:[ {bm:'Y: Etil butanoat &nbsp;·&nbsp; Z: Asid butanoik', en:'Y: Ethyl butanoate &nbsp;·&nbsp; Z: Butanoic acid'},
        {bm:'Y: Butil etanoat &nbsp;·&nbsp; Z: Asid etanoik',  en:'Y: Butyl ethanoate &nbsp;·&nbsp; Z: Ethanoic acid'},
        {bm:'Y: Etanol &nbsp;·&nbsp; Z: Asid butanoik',        en:'Y: Ethanol &nbsp;·&nbsp; Z: Butanoic acid'},
        {bm:'Y: Butanol &nbsp;·&nbsp; Z: Asid etanoik',        en:'Y: Butanol &nbsp;·&nbsp; Z: Ethanoic acid'} ],
    a:2,
    w:{ bm:'Bunyi ‘pop’ = gas hidrogen, dan hanya <b>asid</b> membebaskan hidrogen dengan zink → Z ialah asid itu. Pecahkan ester C₃H₇COO|C₂H₅: bahagian asil (dengan C=O) ada <b>4</b> karbon → asid butanoik = Z ✓; bahagian alkil ada <b>2</b> karbon → etanol = Y ✓. A tersilap menamakan ester itu sendiri sebagai bahan tindak balas.',
        en:'The ‘pop’ sound = hydrogen gas, and only an <b>acid</b> releases hydrogen with zinc → Z is the acid. Split the ester C₃H₇COO|C₂H₅: the acyl side (with the C=O) has <b>4</b> carbons → butanoic acid = Z ✓; the alkyl side has <b>2</b> carbons → ethanol = Y ✓. A wrongly names the ester itself as a reactant.' } },

  { n:34, topic:'CONSUMER',
    q:{ bm:'Jadual 7 menunjukkan formula kimia bagi dua bahan pencuci: bahan pencuci A ialah CH₃(CH₂)₁₀COONa dan bahan pencuci B ialah CH₃(CH₂)₁₁OSO₃Na. Antara berikut, pernyataan manakah yang menerangkan tentang keberkesanan kedua-dua bahan pencuci dalam air liat?',
        en:'Table 7 shows the chemical formulas of two cleaning agents: cleaning agent A is CH₃(CH₂)₁₀COONa and cleaning agent B is CH₃(CH₂)₁₁OSO₃Na. Which of the following statements describes the effectiveness of both cleaning agents in hard water?' },
    o:[ {bm:'Bahan pencuci A membentuk garam tak terlarutkan dengan ion logam dalam air liat',
         en:'Cleaning agent A forms insoluble salts with metal ions in hard water'},
        {bm:'Bahan pencuci B mempunyai bahagian hidrofobik yang tidak larut dalam air liat',
         en:'Cleaning agent B has a hydrophobic part that does not dissolve in hard water'},
        {bm:'Bahan pencuci A mempunyai bahagian hidrofilik yang kurang larut dalam air liat berbanding bahan pencuci B',
         en:'Cleaning agent A has a hydrophilic part that is less soluble in hard water compared to cleaning agent B'},
        {bm:'Bahan pencuci A tidak membentuk kekat dalam air liat tetapi bahan pencuci B membentuk kekat dalam air liat',
         en:'Cleaning agent A does not form scum in hard water, but cleaning agent B forms scum in hard water'} ],
    a:0,
    w:{ bm:'Kenal pasti kumpulan berfungsi dahulu. A berakhir dengan <b>–COONa</b> → itu <b>sabun</b> (garam natrium asid lemak). B berakhir dengan <b>–OSO₃Na</b> → itu <b>detergen</b>. Dalam air liat, ion Ca²⁺/Mg²⁺ memendakkan sabun sebagai <b>kekat</b> yang tidak larut ✓, manakala garam detergen kekal larut. Jadi D ialah kebalikan yang tepat.',
        en:'Identify the functional group first. A ends in <b>–COONa</b> → that is a <b>soap</b> (the sodium salt of a fatty acid). B ends in <b>–OSO₃Na</b> → that is a <b>detergent</b>. In hard water, Ca²⁺/Mg²⁺ ions precipitate the soap as insoluble <b>scum</b> ✓, while the detergent’s salts stay soluble. So D is the exact reverse.' } },

  { n:35, topic:'RATE',
    note:'The reactant volume is printed as 20 cm³ in the BM text and 50 cm³ in the EN text of the source table; either way both experiments use the same volume, so it does not affect the answer.',
    q:{ bm:'Jadual 8 menunjukkan pemerhatian bagi dua eksperimen untuk menentukan kadar tindak balas. Antara yang berikut, pernyataan manakah yang benar?'+
           '<table><tr><th>Eksperimen</th><th>Bahan tindak balas</th><th>Masa untuk mengumpul 50 cm³ CO₂ (s)</th></tr>'+
           '<tr><td>I</td><td>Ketulan marmar CaCO₃ berlebihan + asid hidroklorik 1.0 mol dm⁻³</td><td>25.0</td></tr>'+
           '<tr><td>II</td><td>Ketulan marmar CaCO₃ berlebihan + asid hidroklorik 0.5 mol dm⁻³</td><td>50.0</td></tr></table><span class="fig">JADUAL 8 · TABLE 8</span>',
        en:'Table 8 shows the observations of two experiments to determine the rate of reaction. Which of the following statements is correct?'+
           '<table><tr><th>Experiment</th><th>Reactants</th><th>Time to collect 50 cm³ CO₂ (s)</th></tr>'+
           '<tr><td>I</td><td>Excess marble chips CaCO₃ + hydrochloric acid 1.0 mol dm⁻³</td><td>25.0</td></tr>'+
           '<tr><td>II</td><td>Excess marble chips CaCO₃ + hydrochloric acid 0.5 mol dm⁻³</td><td>50.0</td></tr></table><span class="fig">JADUAL 8 · TABLE 8</span>' },
    o:[ {bm:'Bilangan ion hidrogen, H⁺ per unit isipadu Eksperimen I lebih tinggi', en:'The number of hydrogen ions, H⁺ per unit volume in Experiment I is higher'},
        {bm:'Jumlah luas permukaan ketulan marmar Eksperimen I lebih besar', en:'The total surface area of marble chips in Experiment I is larger'},
        {bm:'Ion H⁺ dan CaCO₃ mencapai tenaga pengaktifan yang rendah dalam Eksperimen II', en:'Hydrogen ions and CaCO₃ achieve a lower activation energy in Experiment II'},
        {bm:'Tenaga kinetik ion hidrogen, H⁺ dalam Eksperimen II lebih tinggi', en:'The kinetic energy of hydrogen ions in Experiment II is higher'} ],
    a:0,
    w:{ bm:'Satu-satunya perbezaan antara kedua-dua eksperimen ialah <b>kepekatan asid</b> (1.0 lawan 0.5 mol dm⁻³), jadi jawapannya mesti berkaitan kepekatan. Asid yang lebih pekat = lebih banyak ion H⁺ per unit isipadu ✓ = lebih banyak perlanggaran = separuh masa. Saiz ketulan sama (B salah), suhu sama jadi tenaga kinetik sama (D salah), dan tenaga pengaktifan tidak pernah berubah dengan kepekatan (C salah).',
        en:'The only difference between the two experiments is the <b>acid concentration</b> (1.0 vs 0.5 mol dm⁻³), so the answer must be about concentration. More concentrated acid = more H⁺ ions per unit volume ✓ = more collisions = half the time. The chip size is the same (B wrong), the temperature is the same so the kinetic energy is the same (D wrong), and activation energy never changes with concentration (C wrong).' } },

  { n:36, topic:'ACID',
    q:{ bm:'Jadual 9 menunjukkan pemerhatian bagi garam P, Q dan R apabila dipanaskan. Antara berikut, padanan yang manakah betul bagi garam P, Q dan R?'+
           '<table><tr><th>Garam / Salt</th><th>Sebelum pemanasan / Before heating</th><th>Selepas pemanasan / After heating</th></tr>'+
           '<tr><td>P</td><td>Hijau / Green</td><td>Hitam / Black</td></tr>'+
           '<tr><td>Q</td><td>Putih / White</td><td>Kuning apabila panas, putih apabila sejuk / Yellow when hot, white when cold</td></tr>'+
           '<tr><td>R</td><td>Putih / White</td><td>Perang apabila panas, kuning apabila sejuk, menghasilkan gas perang / Brown when hot, yellow when cold, produces a brown gas</td></tr></table><span class="fig">JADUAL 9 · TABLE 9</span>',
        en:'Table 9 shows the observations for salts P, Q and R when heated. Which of the following is the correct match for salts P, Q and R?'+
           '<table><tr><th>Garam / Salt</th><th>Sebelum pemanasan / Before heating</th><th>Selepas pemanasan / After heating</th></tr>'+
           '<tr><td>P</td><td>Hijau / Green</td><td>Hitam / Black</td></tr>'+
           '<tr><td>Q</td><td>Putih / White</td><td>Kuning apabila panas, putih apabila sejuk / Yellow when hot, white when cold</td></tr>'+
           '<tr><td>R</td><td>Putih / White</td><td>Perang apabila panas, kuning apabila sejuk, menghasilkan gas perang / Brown when hot, yellow when cold, produces a brown gas</td></tr></table><span class="fig">JADUAL 9 · TABLE 9</span>' },
    o:[ {bm:'P: Kuprum(II) karbonat · Q: Zink oksida · R: Plumbum(II) nitrat',
         en:'P: Copper(II) carbonate · Q: Zinc oxide · R: Lead(II) nitrate'},
        {bm:'P: Kuprum(II) sulfat · Q: Zink oksida · R: Plumbum(II) karbonat',
         en:'P: Copper(II) sulphate · Q: Zinc oxide · R: Lead(II) carbonate'},
        {bm:'P: Kuprum(II) karbonat · Q: Zink karbonat · R: Plumbum(II) nitrat',
         en:'P: Copper(II) carbonate · Q: Zinc carbonate · R: Lead(II) nitrate'},
        {bm:'P: Kuprum(II) sulfat · Q: Zink oksida · R: Plumbum(II) nitrat',
         en:'P: Copper(II) sulphate · Q: Zinc oxide · R: Lead(II) nitrate'} ],
    a:2,
    w:{ bm:'Ambil satu baris pada satu masa. <b>P</b> hijau → hitam = kuprum(II) karbonat → CuO hitam (kuprum(II) sulfat berwarna biru, bukan hijau). <b>R</b> memberi gas <b>perang</b> — itu NO₂, jadi R mesti <b>nitrat</b>, dan residu perang-panas/kuning-sejuk ialah PbO. <b>Q</b> putih → kuning panas/putih sejuk ialah ZnO; kerana jadual menyenaraikan <b>garam</b> dan ZnO ialah oksida, Q ialah zink karbonat yang terurai menjadi ZnO.',
        en:'Take one row at a time. <b>P</b> green → black is copper(II) carbonate → black CuO (copper(II) sulphate is blue, not green). <b>R</b> gives off a <b>brown</b> gas — that is NO₂, so R must be a <b>nitrate</b>, and the brown-hot/yellow-cold residue is PbO. <b>Q</b> white → yellow-hot/white-cold is ZnO; since the table lists <b>salts</b> and ZnO is an oxide, Q is zinc carbonate decomposing to ZnO.' } },

  { n:37, topic:'CARBON',
    q:{ bm:'Rajah 22 menunjukkan label bahan dan maklumat pemprosesan bagi marjerin: bahan-bahan minyak kelapa sawit, air, garam; proses penghidrogenan separa minyak sayuran pada suhu 180 °C. Antara yang berikut, logam manakah yang digunakan sebagai mangkin dalam tindak balas penghasilan produk tersebut?',
        en:'Diagram 22 shows the ingredients label and processing information for margarine: ingredients palm oil, water, salt; process partial hydrogenation of vegetable oil at 180 °C. Which of the following metals is used as a catalyst in the reaction to produce this product?' },
    o:[ {bm:'Nikel',en:'Nickel'}, {bm:'Kobalt',en:'Cobalt'},
        {bm:'Ferum',en:'Iron'},   {bm:'Kuprum',en:'Copper'} ],
    a:0,
    w:{ bm:'Kata kunci pada label ialah <b>penghidrogenan</b>, dan mangkinnya ialah <b>nikel</b>. Hafal tiga mangkin industri utama itu: Ni = penghidrogenan minyak, Fe = proses Haber (ammonia), V₂O₅ = proses Sentuh (asid sulfurik).',
        en:'The key word on the label is <b>hydrogenation</b>, and its catalyst is <b>nickel</b>. Memorise the three big industrial catalysts: Ni = hydrogenation of oils, Fe = the Haber process (ammonia), V₂O₅ = the Contact process (sulphuric acid).' } },

  { n:38, topic:'MOLE', img:'img/kimia/85ac17363909.webp',
    alt:{ bm:'Rajah 23: natrium + oksigen → 6.2 g pepejal Z (Tindak balas I); natrium + klorin → pepejal Y (Tindak balas II).',
          en:'Diagram 23: sodium + oxygen → 6.2 g of solid Z (Reaction I); sodium + chlorine → solid Y (Reaction II).' },
    q:{ bm:'Rajah 23 menunjukkan dua tindak balas berbeza bagi natrium. Berapakah jisim pepejal Y yang terbentuk apabila jisim natrium yang sama digunakan?<br><span class="fig">[Jisim atom relatif: Na = 23, O = 16, Cl = 35.5]</span>',
        en:'Diagram 23 shows two different reactions of sodium. What is the mass of solid Y formed when the same mass of sodium is used?<br><span class="fig">[Relative atomic mass: Na = 23, O = 16, Cl = 35.5]</span>' },
    o:[ {bm:'2.93 g',en:'2.93 g'}, {bm:'5.85 g',en:'5.85 g'},
        {bm:'11.7 g',en:'11.7 g'}, {bm:'23.4 g',en:'23.4 g'} ],
    a:2,
    w:{ bm:'Gunakan natrium sebagai jambatan antara kedua-dua tindak balas. Z ialah Na₂O, JFR = 2(23) + 16 = <b>62</b>, jadi 6.2 g = <b>0.1 mol</b> Na₂O, yang mengandungi <b>0.2 mol</b> Na. Jisim natrium yang sama memberi <b>0.2 mol</b> NaCl (nisbah 1 : 1 bagi Na). JFR NaCl = 58.5 → jisim = 0.2 × 58.5 = <b>11.7 g</b>. Jawapan 5.85 g terlupa bahawa Na₂O mengandungi <b>dua</b> atom natrium.',
        en:'Use sodium as the bridge between the two reactions. Z is Na₂O, RFM = 2(23) + 16 = <b>62</b>, so 6.2 g = <b>0.1 mol</b> of Na₂O, which contains <b>0.2 mol</b> of Na. That same sodium gives <b>0.2 mol</b> of NaCl (1 : 1 in Na). RFM of NaCl = 58.5 → mass = 0.2 × 58.5 = <b>11.7 g</b>. The 5.85 g option forgets that Na₂O contains <b>two</b> sodium atoms.' } },

  { n:39, topic:'PTABLE', img:'img/kimia/2387aafdebe4.webp',
    alt:{ bm:'Rajah 24: bahan X larut dalam asid nitrik memberi larutan tidak berwarna, dan juga larut dalam larutan natrium hidroksida memberi larutan tidak berwarna.',
          en:'Diagram 24: substance X dissolves in nitric acid giving a colourless solution, and also dissolves in sodium hydroxide solution giving a colourless solution.' },
    q:{ bm:'Rajah 24 menunjukkan pemerhatian bagi suatu eksperimen apabila bahan X ditambahkan ke dalam dua larutan. Apakah bahan X?',
        en:'Diagram 24 shows the observations of an experiment when substance X is added into two solutions. What is substance X?' },
    o:[ {bm:'MgO',en:'MgO'}, {bm:'P₄O₁₀',en:'P₄O₁₀'},
        {bm:'Cl₂O₇',en:'Cl₂O₇'}, {bm:'Al₂O₃',en:'Al₂O₃'} ],
    a:3,
    w:{ bm:'X bertindak balas dengan <b>kedua-dua</b> asid dan alkali → ia oksida <b>amfoterik</b>. Di Kala 3 hanya <b>Al₂O₃</b> yang amfoterik. MgO ialah oksida bes (asid sahaja), manakala P₄O₁₀ dan Cl₂O₇ ialah oksida berasid (alkali sahaja).',
        en:'X reacts with <b>both</b> acid and alkali → it is an <b>amphoteric</b> oxide. In Period 3 only <b>Al₂O₃</b> is amphoteric. MgO is a basic oxide (acid only), while P₄O₁₀ and Cl₂O₇ are acidic oxides (alkali only).' } },

  { n:40, topic:'ACID', img:'img/kimia/c9825ebffdb2.webp',
    alt:{ bm:'Rajah 25: larutan R + HNO₃ + BaCl₂ → mendakan putih; R + sedikit NaOH → mendakan putih; + NaOH berlebihan → larut menjadi tidak berwarna.',
          en:'Diagram 25: solution R + HNO₃ + BaCl₂ → white precipitate; R + a few drops of NaOH → white precipitate; + excess NaOH → dissolves to a colourless solution.' },
    q:{ bm:'Rajah 25 menunjukkan pemerhatian yang diperoleh apabila larutan akueus R bertindak balas dengan beberapa reagen untuk mengesahkan kehadiran kation dan anion dalam larutan akueus R. Apakah garam R?',
        en:'Diagram 25 shows the observations obtained when aqueous solution R reacts with several reagents to confirm the presence of the cation and anion in aqueous solution R. What is salt R?' },
    o:[ {bm:'Zink karbonat',en:'Zinc carbonate'},     {bm:'Aluminium sulfat',en:'Aluminium sulphate'},

    q:{ bm:'Antara yang berikut, yang manakah mempunyai nilai pH kurang daripada 7?',
        en:'Which of the following substances has a pH value less than 7?' },
    o:[ {bm:'Kopi',         en:'Coffee'},
        {bm:'Darah',        en:'Blood'},
        {bm:'Peluntur',     en:'Bleach'},
        {bm:'Serbuk penaik',en:'Baking soda'} ],
    a:0,
    w:{ bm:'<b>Kopi</b> berasid (pH ≈ 5) ✓. Darah sedikit beralkali (pH ≈ 7.4), peluntur beralkali (pH ≈ 12–13), dan serbuk penaik (natrium bikarbonat) juga beralkali (pH ≈ 8–9).',
        en:'<b>Coffee</b> is acidic (pH ≈ 5) ✓. Blood is slightly alkaline (pH ≈ 7.4), bleach is alkaline (pH ≈ 12–13), and baking soda (sodium bicarbonate) is alkaline too (pH ≈ 8–9).' } },

  { n:19, topic:'RATE',
    q:{ bm:'Rajah 3 menunjukkan gambar rajah profil tenaga bagi satu tindak balas. Antara yang berikut, faktor manakah dapat menghasilkan lengkung II?',
        en:'Diagram 3 shows the energy level diagram of a reaction. Which of the following factors can produce curve II?' },
    img:'img/kimia/ecccf304c935.webp',
    alt:{ bm:'Dua lengkung profil tenaga: I lebih tinggi, II lebih rendah, tenaga reaktan dan hasil sama', en:'Two energy profile curves: I higher, II lower, with identical reactant and product energies' },
    o:[ {bm:'Suhu',                    en:'Temperature'},
        {bm:'Kepekatan',               en:'Concentration'},
        {bm:'Kehadiran mangkin',       en:'Presence of catalyst'},
        {bm:'Saiz bahan tindak balas', en:'Size of reactant'} ],
    a:2,
    w:{ bm:'Lengkung II mempunyai <b>tenaga pengaktifan lebih rendah</b> dengan tenaga reaktan dan hasil yang <b>tidak berubah</b> — kesan tandatangan <b>mangkin</b>, yang menyediakan laluan alternatif ✓. Suhu, kepekatan dan saiz zarah mengubah kekerapan perlanggaran, bukan bentuk profil tenaga.',
        en:'Curve II has a <b>lower activation energy</b> while reactant and product energies are <b>unchanged</b> — the signature effect of a <b>catalyst</b>, which provides an alternative pathway ✓. Temperature, concentration and particle size change collision frequency, not the energy profile.' } },

  { n:20, topic:'CARBON',
    q:{ bm:'Apakah formula molekul bagi hasil yang terbentuk apabila gas propena bertindak balas dengan stim?',
        en:'What is the molecular formula of the product formed when propene gas reacts with steam?' },
    o:[ {bm:'C₃H₈',          en:'C₃H₈'},
        {bm:'C₃H₇OH',        en:'C₃H₇OH'},
        {bm:'C₂H₅COOH',      en:'C₂H₅COOH'},
        {bm:'C₂H₅COOC₃H₇',   en:'C₂H₅COOC₃H₇'} ],
    a:1,
    w:{ bm:'Propena + stim (mangkin asid fosforik) ialah <b>penghidratan</b>: C₃H₆ + H₂O → <b>C₃H₇OH</b> (propanol) ✓. C₃H₈ ialah propana (perlukan H₂), C₂H₅COOH asid propanoik, dan C₂H₅COOC₃H₇ ester.',
        en:'Propene + steam (phosphoric acid catalyst) is <b>hydration</b>: C₃H₆ + H₂O → <b>C₃H₇OH</b> (propanol) ✓. C₃H₈ is propane (would need H₂), C₂H₅COOH is propanoic acid, and C₂H₅COOC₃H₇ is an ester.' } },

  { n:21, topic:'REDOX',
    q:{ bm:'Antara yang berikut, yang manakah boleh menyahwarnakan warna ungu larutan kalium manganat(VII) berasid?<br>I&nbsp;&nbsp;Ferum(III) sulfat<br>II&nbsp;&nbsp;Sulfur dioksida<br>III&nbsp;&nbsp;Kalium iodida<br>IV&nbsp;&nbsp;Bromin',
        en:'Which of the following substances can decolourise the purple colour of acidified potassium manganate(VII) solution?<br>I&nbsp;&nbsp;Iron(III) sulphate<br>II&nbsp;&nbsp;Sulphur dioxide<br>III&nbsp;&nbsp;Potassium iodide<br>IV&nbsp;&nbsp;Bromine' },
    o:[ {bm:'I dan II',   en:'I and II'},
        {bm:'I dan IV',   en:'I and IV'},
        {bm:'II dan III', en:'II and III'},
        {bm:'III dan IV', en:'III and IV'} ],
    a:2,
    w:{ bm:'KMnO₄ berasid ialah agen pengoksidaan — ia dinyahwarnakan oleh <b>agen penurunan</b>: <b>SO₂</b> (II ✓) dan <b>ion iodida</b> (III ✓). Fe³⁺ sudah teroksida penuh dan Br₂ sendiri agen pengoksidaan — kedua-duanya tidak menurunkan MnO₄⁻.',
        en:'Acidified KMnO₄ is an oxidising agent — it is decolourised by <b>reducing agents</b>: <b>SO₂</b> (II ✓) and <b>iodide ions</b> (III ✓). Fe³⁺ is already fully oxidised and Br₂ is itself an oxidising agent — neither can reduce MnO₄⁻.' } },

  { n:22, topic:'INDUSTRY',
    q:{ bm:'Antara yang berikut, yang manakah merupakan bahan komposit?',
        en:'Which of the following is a composite material?' },
    o:[ {bm:'Duralumin',      en:'Duralumin'},
        {bm:'Kaca plumbum',   en:'Lead crystal glass'},
        {bm:'Silikon karbida',en:'Silicon carbide'},
        {bm:'Gentian optik',  en:'Optical fibre'} ],
    a:3,
    w:{ bm:'<b>Gentian optik</b> ialah komposit — teras kaca berindeks biasan tinggi disaluti pelapisan berindeks rendah, dua bahan digabung untuk sifat baharu ✓. Duralumin ialah <b>aloi</b>, kaca plumbum sejenis <b>kaca</b>, silikon karbida sejenis <b>seramik</b>.',
        en:'<b>Optical fibre</b> is a composite — a high-refractive-index glass core clad in a lower-index layer, two materials combined for new properties ✓. Duralumin is an <b>alloy</b>, lead crystal is a <b>glass</b>, silicon carbide is a <b>ceramic</b>.' } },

  { n:23, topic:'THERMO',
    q:{ bm:'Rajah 4 menunjukkan gambar rajah aras tenaga haba penyesaran logam kuprum. Jika logam N digunakan untuk menyesarkan kuprum didapati nilai ΔH adalah −310 kJ mol⁻¹. Antara pernyataan berikut yang manakah benar?',
        en:'Diagram 4 shows the energy level diagram for the heat of displacement of copper metal. If metal N is used to displace copper, the value of ΔH is −310 kJ mol⁻¹. Which of the following statements is true?' },
    img:'img/kimia/b15d51439e6e.webp',
    alt:{ bm:'Rajah aras tenaga: M + Cu²⁺ di atas, M²⁺ + Cu di bawah, ΔH = −210 kJ mol⁻¹', en:'Energy level diagram: M + Cu²⁺ above, M²⁺ + Cu below, ΔH = −210 kJ mol⁻¹' },
    o:[ {bm:'Nilai E⁰ M lebih negatif berbanding N',                        en:'The E⁰ value of M is more negative than N'},
        {bm:'Logam N lebih elektropositif daripada logam M',                en:'Metal N is more electropositive than metal M'},
        {bm:'N dapat menyesarkan ion M²⁺ daripada larutan garamnya',        en:'N is able to displace M²⁺ ions from its salt solution'},
        {bm:'M dapat menyesarkan ion Cu²⁺ daripada larutan garamnya',       en:'M is able to displace Cu²⁺ ions from its salt solution'} ],
    a:1,
    note:'Skema: B. C ("N dapat menyesarkan M²⁺") juga benar dari segi kimia — B dipilih kerana ia kesimpulan terus daripada perbandingan ΔH.',
    w:{ bm:'Haba penyesaran N (−310 kJ mol⁻¹) lebih <b>eksotermik</b> daripada M (−210) — jurang E⁰ N dengan kuprum lebih besar, jadi <b>N lebih elektropositif daripada M</b> ✓. (Perhatikan C juga konsisten — logam lebih elektropositif memang boleh menyesarkan M²⁺ — tetapi B ialah kesimpulan langsung yang dikehendaki skema.)',
        en:'N’s heat of displacement (−310 kJ mol⁻¹) is more <b>exothermic</b> than M’s (−210) — N sits further from copper in E⁰, so <b>N is more electropositive than M</b> ✓. (Note C is also chemically consistent — the more electropositive metal could displace M²⁺ — but B is the direct conclusion the skema wants.)' } },

  { n:24, topic:'POLYMER',
    q:{ bm:'Rajah 5 menunjukkan formula struktur bagi satu polimer. Antara yang berikut, yang manakah merupakan monomer bagi polimer itu?',
        en:'Diagram 5 shows the structural formula of a polymer. Which of the following is the monomer for the polymer?' },
    img:'img/kimia/a6ced7501372.webp',
    alt:{ bm:'Unit ulangan polimer: –CH₂–CH(CH₃)– dalam kurungan dengan n', en:'Polymer repeat unit: –CH₂–CH(CH₃)– in brackets with n' },
    o:[ {bm:'Etana',   en:'Ethane'},
        {bm:'Etena',   en:'Ethene'},
        {bm:'Propana', en:'Propane'},
        {bm:'Propena', en:'Propene'} ],
    a:3,
    w:{ bm:'Unit ulangan −CH₂−CH(CH₃)− mempunyai <b>3 karbon</b> dengan kumpulan metil tergantung — monomernya ialah <b>propena</b> (CH₂=CH−CH₃), dan polimernya polipropena ✓. Etena memberi polietena tanpa kumpulan CH₃; alkana (etana, propana) tiada C=C untuk berpolimer.',
        en:'The repeat unit −CH₂−CH(CH₃)− has <b>3 carbons</b> with a pendant methyl group — the monomer is <b>propene</b> (CH₂=CH−CH₃), giving polypropene ✓. Ethene would give polyethene with no CH₃ group; alkanes (ethane, propane) have no C=C to polymerise.' } },

  { n:25, topic:'INDUSTRY',
    q:{ bm:'Grafen merupakan alotrop bagi karbon yang digunakan secara meluas dalam pembangunan "bateri masa depan". Antara berikut, sifat grafen yang manakah merupakan sebab utama ia dapat mengurangkan masa pengecasan bateri secara signifikan?',
        en:'Graphene is an allotrope of carbon that is widely used in the development of "future batteries". Which of the following properties of graphene is the main reason it can significantly reduce the charging time of a battery?' },
    o:[ {bm:'Bersifat tidak telap',             en:'Impermeable'},
        {bm:'Luas permukaan tinggi',            en:'High surface area'},
        {bm:'Kekuatan regangan tinggi',         en:'High tensile strength'},
        {bm:'Kekonduksian elektrik yang tinggi',en:'High electrical conductivity'} ],
    a:3,
    w:{ bm:'Masa pengecasan bergantung pada kepantasan <b>cas mengalir</b> — <b>kekonduksian elektrik</b> grafen yang sangat tinggi membenarkan arus besar, jadi bateri mengecas jauh lebih pantas ✓. Kekuatan regangan dan ketidaktelapan tidak berkaitan kelajuan cas.',
        en:'Charging time depends on how fast <b>charge can flow</b> — graphene’s exceptional <b>electrical conductivity</b> allows large currents, so the battery charges far faster ✓. Tensile strength and impermeability have nothing to do with charging speed.' } },

  { n:26, topic:'ATOM',
    q:{ bm:'Rajah 6 menunjukkan perwakilan piawai bagi unsur X: <sup>39</sup><sub>19</sub>X. Antara yang berikut, yang manakah benar tentang ion bagi unsur X?',
        en:'Diagram 6 shows the standard representation of element X: <sup>39</sup><sub>19</sub>X. Which of the following is true about the ion of element X?' },
    o:[ {bm:'Bilangan neutron: 20 · Susunan elektron: 2.8.8.1', en:'Number of neutrons: 20 · Electron arrangement: 2.8.8.1'},
        {bm:'Bilangan neutron: 19 · Susunan elektron: 2.8.8.1', en:'Number of neutrons: 19 · Electron arrangement: 2.8.8.1'},
        {bm:'Bilangan neutron: 20 · Susunan elektron: 2.8.8',   en:'Number of neutrons: 20 · Electron arrangement: 2.8.8'},
        {bm:'Bilangan neutron: 19 · Susunan elektron: 2.8.8',   en:'Number of neutrons: 19 · Electron arrangement: 2.8.8'} ],
    a:2,
    w:{ bm:'X ialah kalium: neutron = 39 − 19 = <b>20</b>. Atomnya 2.8.8.1, tetapi soalan tanya <b>ion</b> — K membebaskan 1 elektron menjadi K⁺ dengan susunan <b>2.8.8</b> ✓. Pilihan A memberi susunan <b>atom</b>, bukan ion.',
        en:'X is potassium: neutrons = 39 − 19 = <b>20</b>. The atom is 2.8.8.1, but the question asks about the <b>ion</b> — K loses 1 electron to form K⁺ with arrangement <b>2.8.8</b> ✓. Option A gives the <b>atom’s</b> arrangement, not the ion’s.' } },

  { n:27, topic:'ATOM',
    q:{ bm:'P dan Q merupakan dua unsur berbeza. Antara berikut, pernyataan yang manakah betul tentang atom-atom unsur tersebut?',
        en:'P and Q are two different elements. Which of the following statements is correct about the atoms of the elements?' },
    o:[ {bm:'Nombor nukleon bagi atom P dan atom Q adalah jumlah bilangan proton dan elektron', en:'The nucleon number for atoms P and Q is the total number of protons and electrons'},
        {bm:'Bilangan proton untuk atom P dan atom Q berubah semasa pembentukan ion',           en:'The number of protons for atoms P and Q changes during the formation of ions'},
        {bm:'Atom P dan atom Q mempunyai bilangan proton yang sama',                            en:'Atom P and atom Q have the same number of protons'},
        {bm:'Atom P dan atom Q mempunyai bilangan elektron yang berbeza',                       en:'Atom P and atom Q have different numbers of electrons'} ],
    a:3,
    w:{ bm:'Unsur <b>berbeza</b> mempunyai nombor proton berbeza, maka atom neutralnya juga mempunyai <b>bilangan elektron berbeza</b> ✓. Nombor nukleon = proton + <b>neutron</b> (A ✗); pembentukan ion mengubah <b>elektron</b>, bukan proton (B ✗); proton sama bermakna unsur sama (C ✗).',
        en:'<b>Different</b> elements have different proton numbers, so their neutral atoms also have <b>different numbers of electrons</b> ✓. Nucleon number = protons + <b>neutrons</b> (A ✗); forming an ion changes <b>electrons</b>, not protons (B ✗); equal protons would mean the same element (C ✗).' } },

  { n:28, topic:'PTABLE',
    q:{ bm:'Unsur X dan unsur Y terletak dalam kala yang sama dalam Jadual Berkala Unsur. Bilangan proton bagi atom X dan atom Y ialah 4 dan 10 masing-masing. Antara yang berikut, pernyataan manakah yang betul?',
        en:'Elements X and Y are located in the same period of the Periodic Table. The number of protons for atom X and atom Y is 4 and 10 respectively. Which of the following statements is true?' },
    o:[ {bm:'Saiz atom X lebih besar daripada atom Y', en:'The atomic size of X is bigger than Y'},
        {bm:'Atom X boleh menderma elektron manakala atom Y boleh menerima elektron', en:'Atom X can donate electrons while atom Y can receive electrons'},
        {bm:'X wujud sebagai unsur dwiatom manakala Y wujud sebagai unsur monoatom', en:'X exists as a diatomic element while Y exists as a monoatomic element'},
        {bm:'X boleh menghasilkan sebatian ion dengan Y', en:'X can produce an ionic compound with Y'} ],
    a:0,
    w:{ bm:'X (4 proton, berilium) dan Y (10, neon) berada dalam Kala 2. Merentasi kala, cas nukleus bertambah dan menarik petala yang sama lebih kuat — jadi <b>saiz atom mengecil</b>: X lebih besar daripada Y ✓. Neon gas adi — tidak menerima elektron (B ✗) dan tidak membentuk sebatian (D ✗); berilium ialah logam, bukan dwiatom (C ✗).',
        en:'X (4 protons, beryllium) and Y (10, neon) are in Period 2. Across a period, nuclear charge increases and pulls the same shells in tighter — so <b>atomic size decreases</b>: X is bigger than Y ✓. Neon is a noble gas — it accepts no electrons (B ✗) and forms no compounds (D ✗); beryllium is a metal, not diatomic (C ✗).' } },

  { n:29, topic:'INDUSTRY',
    q:{ bm:'Jadual 1 menunjukkan diameter lekuk yang terhasil dalam satu eksperimen untuk membandingkan kekerasan tiga bahan R, T dan U. Susun bahan-bahan itu berdasarkan kekerasan dalam tertib menaik.',
        en:'Table 1 shows the diameter of dents produced in an experiment to compare the hardness of three substances R, T and U. Arrange the substances according to their hardness in ascending order.' },
    img:'img/kimia/da0308d18e21.webp',
    alt:{ bm:'Jadual: lekuk R bersaiz sederhana, T paling kecil, U paling besar', en:'Table: dent for R is medium, T smallest, U largest' },
    o:[ {bm:'U, R, T', en:'U, R, T'},
        {bm:'U, T, R', en:'U, T, R'},
        {bm:'T, R, U', en:'T, R, U'},
        {bm:'T, U, R', en:'T, U, R'} ],
    a:0,
    w:{ bm:'Lekuk lebih <b>besar</b> = bahan lebih <b>lembut</b>. Diameter: U terbesar (paling lembut), R sederhana, T terkecil (paling keras). Tertib <b>menaik</b> kekerasan: <b>U, R, T</b> ✓.',
        en:'A <b>bigger</b> dent = a <b>softer</b> substance. Diameters: U largest (softest), R middle, T smallest (hardest). <b>Ascending</b> hardness: <b>U, R, T</b> ✓.' } },

  { n:30, topic:'POLYMER',
    q:{ bm:'Seorang jurutera ingin memilih jenis getah yang paling sesuai untuk membuat hos bahan api petrol berdasarkan sifat-sifatnya. Antara yang berikut, getah manakah paling sesuai digunakan?',
        en:'An engineer wants to choose the most suitable type of rubber to make petrol fuel hoses based on their properties. Which of the following rubbers is the most suitable to be used?' },
    o:[ {bm:'Neoprena — Tahan terhadap pengoksidaan dan tidak mudah terbakar', en:'Neoprene — Resistant to oxidation and flame resistant'},
        {bm:'Getah silikon — Kekal kenyal pada julat suhu yang sangat luas',   en:'Silicone rubber — Remains elastic over a very wide temperature range'},
        {bm:'Getah stirena-butadiena (SBR) — Tahan terhadap lelasan dan haus', en:'Styrene-butadiene rubber (SBR) — Resistant to abrasion and wear'},
        {bm:'Thiokol — Mempunyai ketahanan yang sangat tinggi terhadap minyak dan pelarut', en:'Thiokol — Has very high resistance to oils and solvents'} ],
    a:0,
    note:'Skema: A. Thiokol (D) juga terkenal tahan minyak — tetapi buku teks KSSM menyenaraikan neoprena sebagai getah untuk hos bahan api.',
    w:{ bm:'Mengikut buku teks KSSM, <b>neoprena</b> ialah getah sintetik yang digunakan untuk <b>hos bahan api</b> — tahan minyak, pengoksidaan dan nyalaan; sifat kalis api penting untuk kegunaan petrol ✓. D nampak menarik (thiokol memang tahan pelarut, digunakan sebagai pengedap), tetapi jawapan yang dikehendaki mengikut skema dan buku teks ialah neoprena.',
        en:'Per the KSSM textbook, <b>neoprene</b> is the synthetic rubber used for <b>fuel hoses</b> — resistant to oil, oxidation and flame; flame resistance matters around petrol ✓. D looks tempting (thiokol is indeed solvent-resistant, used as a sealant), but the intended answer per the skema and textbook is neoprene.' } },

  { n:31, topic:'THERMO',
    q:{ bm:'Tindak balas antara asid hidroklorik dan natrium hidroksida adalah tindak balas eksotermik. Antara yang berikut, pernyataan yang manakah benar mengenai tindak balas tersebut?',
        en:'The reaction between hydrochloric acid and sodium hydroxide is an exothermic reaction. Which of the following statements is true about the reaction?' },
    o:[ {bm:'Suhu persekitaran menurun', en:'The surrounding temperature decreases'},
        {bm:'Jumlah kandungan tenaga hasil tindak balas lebih tinggi daripada bahan tindak balas', en:'The total energy content of the products is higher than the reactants'},
        {bm:'Tindak balas antara asid etanoik dengan serbuk penaik adalah tindak balas yang sama jenis dari segi perubahan haba', en:'The reaction of ethanoic acid with baking soda is the same type of reaction in terms of heat change'},
        {bm:'Haba yang diserap semasa pemecahan ikatan adalah lebih rendah daripada haba yang dibebaskan semasa pembentukan ikatan', en:'The heat absorbed during bond breaking is lower than the heat released during bond formation'} ],
    a:3,
    w:{ bm:'Dalam tindak balas <b>eksotermik</b>, haba pembentukan ikatan <b>melebihi</b> haba pemecahan ikatan — lebihan itulah yang dibebaskan ✓. Suhu persekitaran <b>naik</b> (A ✗); tenaga hasil lebih <b>rendah</b> (B ✗); asid etanoik + serbuk penaik ialah tindak balas <b>endotermik</b> (C ✗).',
        en:'In an <b>exothermic</b> reaction, heat released by bond formation <b>exceeds</b> heat absorbed in bond breaking — the excess is given out ✓. The surroundings get <b>warmer</b> (A ✗); products have <b>lower</b> energy (B ✗); ethanoic acid + baking soda is an <b>endothermic</b> reaction (C ✗).' } },

  { n:32, topic:'MOLE',
    q:{ bm:'x g serbuk natrium nitrat dilarutkan dalam 500 cm³ air suling untuk menghasilkan larutan dengan kepekatan 0.03 mol dm⁻³. Berapakah nilai x? [Jisim molar natrium nitrat: 84.99 g mol⁻¹]',
        en:'x g of sodium nitrate is dissolved in 500 cm³ of distilled water to produce a solution with concentration of 0.03 mol dm⁻³. What is the value of x? [Molar mass of sodium nitrate: 84.99 g mol⁻¹]' },
    o:[ {bm:'0.018', en:'0.018'},
        {bm:'1.275', en:'1.275'},
        {bm:'2.550', en:'2.550'},
        {bm:'5.882', en:'5.882'} ],
    a:1,
    w:{ bm:'Mol = kepekatan × isi padu = 0.03 × 0.5 dm³ = <b>0.015 mol</b>. Jisim = 0.015 × 84.99 = <b>1.275 g</b> ✓. Perangkap: 2.550 datang daripada tersilap guna 1 dm³.',
        en:'Moles = concentration × volume = 0.03 × 0.5 dm³ = <b>0.015 mol</b>. Mass = 0.015 × 84.99 = <b>1.275 g</b> ✓. Trap: 2.550 comes from mistakenly using 1 dm³.' } },

  { n:33, topic:'THERMO',
    q:{ bm:'Rajah 7 menunjukkan satu tindak balas peneutralan: 50 cm³ asid nitrik 1.0 mol dm⁻³ (29.0 °C) dicampurkan dengan 50 cm³ larutan kalium hidroksida 0.5 mol dm⁻³ (30.0 °C) dalam cawan polistirena. Haba peneutralan bagi tindak balas ini adalah −57 kJ mol⁻¹. Apakah suhu tertinggi bagi tindak balas tersebut? [Muatan haba tentu larutan = 4.2 J g⁻¹ °C⁻¹]',
        en:'Diagram 7 shows a neutralisation reaction: 50 cm³ of 1.0 mol dm⁻³ nitric acid (29.0 °C) is mixed with 50 cm³ of 0.5 mol dm⁻³ potassium hydroxide solution (30.0 °C) in a polystyrene cup. The heat of neutralisation for this reaction is −57 kJ mol⁻¹. What is the highest temperature in the reaction? [Specific heat capacity of solution = 4.2 J g⁻¹ °C⁻¹]' },
    img:'img/kimia/01bafa4d745a.webp',
    alt:{ bm:'Dua cawan polistirena dengan termometer 29.0 °C dan 30.0 °C, kemudian dikacau menjadi campuran', en:'Two polystyrene cups with thermometers at 29.0 °C and 30.0 °C, then stirred into a mixture' },
    o:[ {bm:'32.39 °C', en:'32.39 °C'},
        {bm:'32.89 °C', en:'32.89 °C'},
        {bm:'36.29 °C', en:'36.29 °C'},
        {bm:'36.79 °C', en:'36.79 °C'} ],
    a:1,
    w:{ bm:'Mol HNO₃ = 0.05 mol; mol KOH = 0.025 mol → KOH <b>penghad</b>, air terbentuk = 0.025 mol. Haba = 0.025 × 57 000 = <b>1425 J</b>. ΔT = 1425 ÷ (100 g × 4.2) = <b>3.39 °C</b>. Suhu awal campuran = purata (29.0 + 30.0)/2 = 29.5 °C → suhu tertinggi = 29.5 + 3.39 = <b>32.89 °C</b> ✓.',

        {bm:'I dan III',  en:'I and III'},
        {bm:'III dan IV', en:'III and IV'} ],
    a:2,
    w:{ bm:'Pembakaran <b>lengkap</b> dalam oksigen berlebihan menghasilkan <b>CO₂ dan H₂O</b> sahaja (I, III ✓): C₃H₈ + 5O₂ → 3CO₂ + 4H₂O. Karbon dan CO hanya terbentuk apabila oksigen <b>terhad</b>.',
        en:'<b>Complete</b> combustion in excess oxygen gives only <b>CO₂ and H₂O</b> (I, III ✓): C₃H₈ + 5O₂ → 3CO₂ + 4H₂O. Soot and CO form only when oxygen is <b>limited</b>.' } },

  { n:11, topic:'THERMO',
    q:{ bm:'Rajah 1 menunjukkan aras tenaga bagi satu tindak balas: H⁺ + OH⁻ berada di aras tenaga lebih tinggi, H₂O di aras lebih rendah, dengan ΔH = −57.3 kJ mol⁻¹. Apakah jenis tindak balas itu?',
        en:'Diagram 1 shows the energy level of a reaction: H⁺ + OH⁻ sits at a higher energy level, H₂O at a lower level, with ΔH = −57.3 kJ mol⁻¹. What is the type of the reaction?' },
    o:[ {bm:'Endotermik',   en:'Endothermic'},
        {bm:'Eksotermik',   en:'Exothermic'},
        {bm:'Pengoksidaan', en:'Oxidation'},
        {bm:'Penurunan',    en:'Reduction'} ],
    a:1,
    w:{ bm:'Tenaga hasil lebih <b>rendah</b> daripada bahan dan ΔH <b>negatif</b> — haba dibebaskan → <b>eksotermik</b> ✓. (Ini peneutralan; tiada perubahan nombor pengoksidaan, jadi C dan D tidak berkenaan.)',
        en:'The product’s energy is <b>lower</b> than the reactants’ and ΔH is <b>negative</b> — heat is released → <b>exothermic</b> ✓. (This is neutralisation; no oxidation numbers change, so C and D are irrelevant.)' } },

  { n:12, topic:'POLYMER',
    q:{ bm:'Isoprena merupakan unit asas bagi polimer X. Apakah polimer X?',
        en:'Isoprene is the basic unit of polymer X. What is polymer X?' },
    o:[ {bm:'Kanji',             en:'Starch'},
        {bm:'Protein',           en:'Protein'},
        {bm:'Getah asli',        en:'Natural rubber'},
        {bm:'Polivinil klorida', en:'Polyvinyl chloride'} ],
    a:2,
    w:{ bm:'<b>Getah asli</b> ialah poliisoprena — monomernya <b>isoprena</b> (2-metilbuta-1,3-diena) ✓. Kanji daripada glukosa, protein daripada asid amino, PVC daripada kloroetena.',
        en:'<b>Natural rubber</b> is polyisoprene — its monomer is <b>isoprene</b> (2-methylbuta-1,3-diene) ✓. Starch is built from glucose, proteins from amino acids, PVC from chloroethene.' } },

  { n:13, topic:'CONSUMER',
    q:{ bm:'Antara bahan tambah dalam detergen berikut, yang manakah digunakan untuk menukar kotoran kepada bahan tanpa warna pada pakaian?',
        en:'Which additive in detergent is used to change dirt into a colourless substance on clothes?' },
    o:[ {bm:'Pemutih optik',    en:'Optical whitener'},
        {bm:'Agen pemutih',     en:'Whitening agent'},
        {bm:'Enzim biologi',    en:'Biological enzyme'},
        {bm:'Agen antienapan',  en:'Anti-redeposition agent'} ],
    a:1,
    w:{ bm:'<b>Agen pemutih</b> mengoksidakan kotoran berwarna kepada sebatian <b>tanpa warna</b> ✓. Pemutih optik hanya memantulkan cahaya biru supaya kain <i>nampak</i> putih; enzim mencerna kotoran protein; agen antienapan menghalang kotoran melekat semula.',
        en:'A <b>whitening (bleaching) agent</b> oxidises coloured stains into <b>colourless</b> compounds ✓. Optical whiteners only reflect blue light so fabric <i>looks</i> whiter; enzymes digest protein stains; anti-redeposition agents stop dirt re-settling.' } },

  { n:14, topic:'INDUSTRY',
    q:{ bm:'Rajah 2 menunjukkan sebuah jambatan yang rosak selepas enam bulan beroperasi. Antara bahan-bahan berikut, yang manakah paling sesuai untuk membina semula struktur jambatan itu?',
        en:'Diagram 2 shows a damaged bridge after six months of operation. Which of these materials is the most suitable to rebuild the bridge structure?' },
    o:[ {bm:'Besi',   en:'Iron'},
        {bm:'Zink',   en:'Zinc'},
        {bm:'Keluli', en:'Steel'},
        {bm:'Loyang', en:'Brass'} ],
    a:2,
    w:{ bm:'<b>Keluli</b> ialah aloi besi — jauh lebih <b>keras dan kuat</b> daripada besi tulen serta lebih tahan kakisan, bahan piawai struktur jambatan ✓. Besi tulen lembut dan mudah berkarat; zink dan loyang tidak cukup kuat untuk struktur.',
        en:'<b>Steel</b> is an alloy of iron — far <b>harder and stronger</b> than pure iron and more corrosion-resistant, the standard bridge structural material ✓. Pure iron is soft and rusts readily; zinc and brass lack structural strength.' } },

  { n:15, topic:'CARBON',
    q:{ bm:'Apakah nama proses untuk menghasilkan alkohol daripada jus buah-buahan?',
        en:'What is the name of the process to produce alcohol from fruit juice?' },
    o:[ {bm:'Penapaian',     en:'Fermentation'},
        {bm:'Pengesteran',   en:'Esterification'},
        {bm:'Pengoksidaan',  en:'Oxidation'},
        {bm:'Pendehidratan', en:'Dehydration'} ],
    a:0,
    w:{ bm:'<b>Penapaian</b>: yis menukarkan glukosa dalam jus buah kepada <b>etanol</b> dan CO₂ ✓. Pengesteran menghasilkan ester; pengoksidaan etanol memberi asid etanoik; pendehidratan membuang air.',
        en:'<b>Fermentation</b>: yeast converts the glucose in fruit juice into <b>ethanol</b> and CO₂ ✓. Esterification makes esters; oxidising ethanol gives ethanoic acid; dehydration removes water.' } },

  { n:16, topic:'ATOM',
    q:{ bm:'Unsur R mempunyai takat didih 45 °C. Apakah keadaan fizik bagi unsur R pada suhu bilik?',
        en:'Element R has a boiling point of 45 °C. What is the physical state of element R at room temperature?' },
    o:[ {bm:'Gas',     en:'Gas'},
        {bm:'Cecair',  en:'Liquid'},
        {bm:'Pepejal', en:'Solid'} ],
    a:1,
    note:'Kertas asal hanya mencetak tiga pilihan (A–C); tiada pilihan D.',
    w:{ bm:'Suhu bilik (≈25 °C) berada <b>di bawah takat didih</b> (45 °C), jadi R belum mendidih — ia <b>cecair</b> ✓ (dengan andaian takat leburnya di bawah suhu bilik, seperti bromin yang serupa sifatnya).',
        en:'Room temperature (≈25 °C) is <b>below the boiling point</b> (45 °C), so R has not boiled — it is a <b>liquid</b> ✓ (assuming its melting point is below room temperature, like the similarly behaved bromine).' } },

  { n:17, topic:'MOLE',
    q:{ bm:'Jisim formula relatif bagi Y₃(PO₄)₂ ialah 310. Tentukan jisim atom relatif bagi unsur Y. [Jisim atom relatif: O = 16, P = 31]',
        en:'The relative formula mass of Y₃(PO₄)₂ is 310. Find the relative atomic mass of element Y. [Relative atomic mass: O = 16, P = 31]' },
    o:[ {bm:'12', en:'12'},
        {bm:'23', en:'23'},
        {bm:'40', en:'40'},
        {bm:'65', en:'65'} ],
    a:2,
    w:{ bm:'3Y + 2(31 + 4×16) = 310 → 3Y + 2(95) = 310 → 3Y = 120 → Y = <b>40</b> ✓ (kalsium — Ca₃(PO₄)₂).',
        en:'3Y + 2(31 + 4×16) = 310 → 3Y + 2(95) = 310 → 3Y = 120 → Y = <b>40</b> ✓ (calcium — Ca₃(PO₄)₂).' } },

  { n:18, topic:'MOLE',
    q:{ bm:'Berapakah bilangan mol kuprum(II) nitrat dalam 56.4 g kuprum(II) nitrat, Cu(NO₃)₂? [Jisim atom relatif: Cu = 64, N = 14, O = 16]',
        en:'What is the number of moles of copper(II) nitrate in 56.4 g of copper(II) nitrate, Cu(NO₃)₂? [Relative atomic mass: Cu = 64, N = 14, O = 16]' },
    o:[ {bm:'0.30 mol', en:'0.30 mol'},
        {bm:'0.32 mol', en:'0.32 mol'},
        {bm:'0.40 mol', en:'0.40 mol'},
        {bm:'0.45 mol', en:'0.45 mol'} ],
    a:0,
    w:{ bm:'Jisim molar Cu(NO₃)₂ = 64 + 2(14 + 48) = <b>188 g mol⁻¹</b>. Mol = 56.4 ÷ 188 = <b>0.30 mol</b> ✓.',
        en:'Molar mass of Cu(NO₃)₂ = 64 + 2(14 + 48) = <b>188 g mol⁻¹</b>. Moles = 56.4 ÷ 188 = <b>0.30 mol</b> ✓.' } },

  { n:19, topic:'PTABLE',
    q:{ bm:'Rajah 3 menunjukkan beberapa unsur yang diwakili oleh I, II, III dan IV dalam Jadual Berkala. Antara berikut, yang manakah tidak menderma, menerima atau berkongsi elektron dengan atom yang lain?',
        en:'Diagram 3 shows several elements represented by I, II, III and IV in the Periodic Table. Which of the following does not donate, receive or share electrons with other atoms?' },
    img:'img/kimia/0233b8446339.webp',
    alt:{ bm:'Lakaran Jadual Berkala: III di Kumpulan 1, II di tengah blok kanan, I di baris atas blok kanan, IV di penjuru kanan (Kumpulan 18)', en:'Periodic Table sketch: III in Group 1, II mid right-block, I upper right-block, IV at the far right corner (Group 18)' },
    o:[ {bm:'I',   en:'I'},
        {bm:'II',  en:'II'},
        {bm:'III', en:'III'},
        {bm:'IV',  en:'IV'} ],
    a:3,
    w:{ bm:'<b>IV</b> berada di Kumpulan 18 — <b>gas adi</b> dengan petala valens penuh, sudah stabil, tidak menderma/menerima/berkongsi elektron ✓. III (Kumpulan 1) menderma; unsur bukan logam blok kanan menerima atau berkongsi.',
        en:'<b>IV</b> sits in Group 18 — a <b>noble gas</b> with a full valence shell, already stable, so it neither donates, receives nor shares electrons ✓. III (Group 1) donates; right-block non-metals receive or share.' } },

  { n:20, topic:'ACID',
    q:{ bm:'Antara garam berikut, yang manakah boleh disediakan melalui kaedah penguraian ganda dua?',
        en:'Which of the following salts can be prepared by the double decomposition method?' },
    o:[ {bm:'Magnesium sulfat',   en:'Magnesium sulphate'},
        {bm:'Ammonium klorida',   en:'Ammonium chloride'},
        {bm:'Kuprum(II) nitrat',  en:'Copper(II) nitrate'},
        {bm:'Plumbum(II) iodida', en:'Lead(II) iodide'} ],
    a:3,
    w:{ bm:'Penguraian ganda dua (pemendakan) hanya untuk garam <b>tak terlarutkan</b> — <b>PbI₂</b> ✓, mendakan kuning daripada Pb(NO₃)₂ + KI. Tiga garam lain larut, disediakan melalui peneutralan/tindak balas asid.',
        en:'Double decomposition (precipitation) is only for <b>insoluble</b> salts — <b>PbI₂</b> ✓, the yellow precipitate from Pb(NO₃)₂ + KI. The other three are soluble, prepared via acid reactions/neutralisation.' } },

  { n:21, topic:'RATE',
    q:{ bm:'Antara berikut, tindak balas yang manakah kadar tindak balasnya dapat ditentukan dengan mengukur perubahan isi padu gas per unit masa?',

    o:[ {bm:'Kalsium karbonat dengan asid hidroklorik',                 en:'Calcium carbonate with hydrochloric acid'},
        {bm:'Larutan natrium hidroksida dengan asid sulfurik pekat',    en:'Sodium hydroxide solution with concentrated sulphuric acid'},
        {bm:'Larutan kalium manganat(VII) berasid dengan butena',       en:'Acidified potassium manganate(VII) solution with butene'},

        en:'CaCO₃ + HCl releases <b>CO₂ gas</b> — its volume can be collected and measured against time ✓. Neutralisation (B), decolourisation (C) and precipitation (D) produce no gas.' } },

  { n:22, topic:'REDOX',
    q:{ bm:'Antara berikut, yang manakah berlaku pada atom ferum apabila mengalami pengaratan?',
        en:'Which of the following occurs to an iron atom when it undergoes rusting?' },
    o:[ {bm:'Kehilangan elektron',              en:'Loss of electrons'},
        {bm:'Menerima hidrogen',                en:'Gain of hydrogen'},
        {bm:'Kehilangan oksigen',               en:'Loss of oxygen'},
        {bm:'Pengurangan nombor pengoksidaan',  en:'Decrease in oxidation number'} ],
    a:0,
    w:{ bm:'Semasa pengaratan, ferum <b>dioksidakan</b>: Fe → Fe²⁺ + 2e⁻ — atom ferum <b>kehilangan elektron</b> ✓. Pilihan B, C dan D semuanya menggambarkan <b>penurunan</b>, bukan pengoksidaan.',
        en:'During rusting, iron is <b>oxidised</b>: Fe → Fe²⁺ + 2e⁻ — the iron atom <b>loses electrons</b> ✓. Options B, C and D all describe <b>reduction</b>, not oxidation.' } },

  { n:23, topic:'BOND',
    q:{ bm:'Rajah 4 menunjukkan susunan elektron bagi sebatian yang terbentuk antara atom P dan atom Q. Antara pernyataan berikut, yang manakah benar mengenai sebatian tersebut?',
        en:'Diagram 4 shows the electron arrangement of a compound formed between atom P and atom Q. Which of the following statements is true about the compound?' },
    img:'img/kimia/059d78ddf5e1.webp',
    alt:{ bm:'Atom P di tengah berkongsi pasangan elektron (bertanda X) dengan beberapa atom Q di sekelilingnya', en:'A central P atom sharing electron pairs (marked X) with several surrounding Q atoms' },
    o:[ {bm:'Sebatian tersebut tidak stabil',                        en:'The compound is not stable'},
        {bm:'Semua atom telah mencapai susunan elektron oktet',      en:'All atoms have achieved the octet electron arrangement'},
        {bm:'Atom Q berkongsi elektron valens dengan atom P',        en:'Q atoms share their valence electrons with the P atom'},
        {bm:'Sebatian terbentuk melalui pemindahan elektron',        en:'The compound is formed by the transfer of electrons'} ],
    a:2,
    w:{ bm:'Rajah menunjukkan pasangan elektron <b>dikongsi</b> antara P dan setiap Q — ikatan <b>kovalen</b>: atom Q berkongsi elektron valens dengan atom P ✓. Bukan pemindahan elektron (D ✗ — itu ikatan ion); atom Q kecil (seperti hidrogen) mencapai duplet, bukan oktet (B ✗); sebatian kovalen yang terbentuk adalah stabil (A ✗).',
        en:'The diagram shows electron pairs <b>shared</b> between P and each Q — a <b>covalent</b> bond: the Q atoms share valence electrons with P ✓. No electron transfer (D ✗ — that is ionic); the small Q atoms (hydrogen-like) reach a duplet, not an octet (B ✗); the covalent compound formed is stable (A ✗).' } },

  { n:24, topic:'ACID',
    q:{ bm:'Apakah nilai pH bagi larutan kalium hidroksida dengan kepekatan 0.1 mol dm⁻³?',
        en:'What is the pH value for potassium hydroxide solution with a concentration of 0.1 mol dm⁻³?' },
    o:[ {bm:'1',  en:'1'},
        {bm:'10', en:'10'},
        {bm:'13', en:'13'},
        {bm:'14', en:'14'} ],
    a:2,
    w:{ bm:'KOH alkali kuat: [OH⁻] = 0.1 mol dm⁻³ → pOH = 1 → pH = 14 − 1 = <b>13</b> ✓. pH 14 memerlukan [OH⁻] = 1.0 mol dm⁻³.',
        en:'KOH is a strong alkali: [OH⁻] = 0.1 mol dm⁻³ → pOH = 1 → pH = 14 − 1 = <b>13</b> ✓. pH 14 would need [OH⁻] = 1.0 mol dm⁻³.' } },

  { n:25, topic:'REDOX',
    q:{ bm:'Jadual 2 menunjukkan nilai keupayaan elektrod piawai bagi beberapa bahan yang digunakan untuk membina suatu sel kimia: Z²⁺+2e⁻→Z, E° = −0.14 V · Y²⁺+2e⁻→Y, E° = −0.44 V · X²⁺+2e⁻→X, E° = −0.76 V · W²⁺+2e⁻→W, E° = −2.38 V. Antara berikut, pasangan logam dan terminal manakah yang dipadankan dengan betul?',
        en:'Table 2 shows the standard electrode potential values of substances used to build a chemical cell: Z²⁺+2e⁻→Z, E° = −0.14 V · Y²⁺+2e⁻→Y, E° = −0.44 V · X²⁺+2e⁻→X, E° = −0.76 V · W²⁺+2e⁻→W, E° = −2.38 V. Which of the following pairs of metals and terminals are matched correctly?' },
    o:[ {bm:'W dan X — terminal positif: W, terminal negatif: X', en:'W and X — positive terminal: W, negative terminal: X'},
        {bm:'X dan Y — terminal positif: X, terminal negatif: Y', en:'X and Y — positive terminal: X, negative terminal: Y'},
        {bm:'Y dan Z — terminal positif: Y, terminal negatif: Z', en:'Y and Z — positive terminal: Y, negative terminal: Z'},
        {bm:'W dan Z — terminal positif: Z, terminal negatif: W', en:'W and Z — positive terminal: Z, negative terminal: W'} ],
    a:3,
    w:{ bm:'Dalam sel kimia, logam dengan E° lebih <b>negatif</b> menjadi terminal <b>negatif</b> (anod). Bagi W (−2.38) dan Z (−0.14): negatif = <b>W</b>, positif = <b>Z</b> ✓. Pasangan A, B dan C semuanya menterbalikkan terminal.',
        en:'In a chemical cell the metal with the more <b>negative</b> E° is the <b>negative</b> terminal (anode). For W (−2.38) and Z (−0.14): negative = <b>W</b>, positive = <b>Z</b> ✓. Pairs A, B and C all have the terminals reversed.' } },

  { n:26, topic:'INDUSTRY',
    q:{ bm:'Rajah 5 menunjukkan sebuah periuk dengan bahagian S (badan periuk kaca). Apakah bahan S?',
        en:'Diagram 5 shows a pot with part S (the glass pot body). What is substance S?' },
    o:[ {bm:'Kaca plumbum',    en:'Lead glass'},
