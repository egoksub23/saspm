<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPM 2026 · Kimia</title>

<style>
html{font-size:17px}
:root{
  --ink:#0B0E13; --panel:#141A25; --panel2:#182030; --line:#242E3E;
  --txt:#E9E7DC; --mut:#96A0AC; --dim:#6B7684;
  --fl:#C6F24E; --am:#FFB454; --vi:#9D8CFF; --okG:#57C76A; --badR:#FF6B6B;
  --onFl:#111; --dot:rgba(233,231,220,.03);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --disp:Georgia,'Times New Roman',serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
[data-theme="light"]{
  --ink:#F4F1E8; --panel:#FFFFFF; --panel2:#F7F5EE; --line:#E2DDCE;
  --txt:#171A21; --mut:#5C6674; --dim:#8A93A0;
  --fl:#5C7A00; --am:#A85F00; --vi:#5B44C7; --okG:#237A33; --badR:#C0292F;
  --onFl:#fff; --dot:rgba(0,0,0,.04);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--ink);color:var(--txt);font-family:var(--body);line-height:1.6;min-height:100vh;
  background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:32px 32px;
  -webkit-font-smoothing:antialiased}
::selection{background:var(--fl);color:var(--onFl)}
button,input,select{font-family:inherit;cursor:pointer;color:inherit}
a{color:var(--fl)}
.wrap{max-width:900px;margin:0 auto;padding:26px 20px 70px}

/* ---- top bar ---- */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:26px;flex-wrap:wrap}
.brand{font-family:var(--disp);font-weight:900;font-size:1.05rem;letter-spacing:-.01em;margin-right:auto;
  display:flex;align-items:center;gap:9px;background:transparent;border:0;padding:0;color:var(--txt);cursor:pointer}
.brand:hover b{filter:brightness(1.15)}
.brand:hover small{border-color:var(--fl);color:var(--fl)}
.brand b{color:var(--fl)}
.brand small{font-family:var(--mono);font-size:.56rem;letter-spacing:.18em;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:3px 7px;font-weight:400}
.home-crumb{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;color:var(--dim);text-decoration:none;white-space:nowrap}
.home-crumb:hover{color:var(--fl)}
.crumb-sep{color:var(--dim);font-size:.7rem;letter-spacing:.05em;user-select:none;padding:0 2px}
#breadSubj{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;color:var(--mut);white-space:nowrap;text-decoration:none}
#breadSubj:hover{color:var(--fl)}
.crumb-cur{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;color:var(--fl);white-space:nowrap}
.ghost{background:transparent;border:1px solid var(--line);color:var(--mut);font-family:var(--mono);
  font-size:.6rem;letter-spacing:.14em;padding:8px 13px;border-radius:100px;transition:.18s}
.ghost:hover{border-color:var(--fl);color:var(--fl)}
.ghost.on{border-color:var(--fl);color:var(--fl);background:color-mix(in srgb,var(--fl) 10%,transparent)}

/* ---- hero ---- */
.kick{font-family:var(--disp);font-size:clamp(1.8rem,5vw,3rem);font-weight:900;letter-spacing:.04em;color:var(--fl);text-align:center;margin-bottom:18px;line-height:1.08}
.sub{text-align:center;color:var(--mut);margin-top:0;font-size:.95rem;max-width:58ch;margin-inline:auto;line-height:1.65}
.sub em{font-style:normal;color:var(--txt);font-weight:600}

/* ---- panels ---- */
.card{border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden}
.sec{padding:18px 20px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.lab{font-family:var(--mono);font-size:.68rem;letter-spacing:.18em;color:var(--dim);margin-bottom:11px;display:flex;gap:10px;align-items:center}
.lab i{font-style:normal;color:var(--fl);cursor:pointer;border-bottom:1px dotted var(--fl)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{background:var(--panel2);border:1px solid var(--line);color:var(--mut);font-family:var(--mono);
  font-size:.73rem;letter-spacing:.08em;padding:8px 14px;border-radius:100px;transition:.16s;white-space:nowrap}
.chip:hover{border-color:var(--fl);color:var(--txt)}
.chip.on{border-color:var(--fl);color:var(--fl);background:color-mix(in srgb,var(--fl) 12%,transparent)}
.chip .n{color:var(--dim);margin-left:6px;font-size:.9em}
.chip.on .n{color:var(--fl);opacity:.75}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}

/* ---- start row ---- */
.startrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:18px 20px;background:var(--panel2)}
.cta{background:var(--fl);border:1px solid var(--fl);color:var(--onFl);font-family:var(--mono);font-weight:700;
  font-size:.72rem;letter-spacing:.16em;padding:14px 26px;border-radius:8px;transition:.18s}
.cta:hover{filter:brightness(1.08);transform:translateY(-1px)}
.cta:disabled{opacity:.35;cursor:not-allowed;transform:none}
.count{font-family:var(--mono);font-size:.68rem;color:var(--mut);margin-right:auto}
.count b{color:var(--fl);font-size:1.4rem;font-family:var(--disp);vertical-align:-2px;margin-right:4px}

/* ---- quiz ---- */
.top{padding:14px 20px;border-bottom:1px solid var(--line)}
.ctr-row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--mono);
  font-size:.66rem;letter-spacing:.14em;color:var(--fl);margin-bottom:10px;flex-wrap:wrap}
.ctr-row .r{display:flex;gap:14px;align-items:center;color:var(--mut)}
.ctr-row .r b{color:var(--fl)}
.ctr-row .r .warn{color:var(--badR)}
.pbar{height:5px;background:var(--line);border-radius:5px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--fl),var(--am));width:0;transition:width .3s}
.qbody{padding:24px 22px 26px}
.meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.tag{display:inline-block;font-family:var(--mono);font-size:.55rem;letter-spacing:.13em;border:1px solid var(--line);
  color:var(--mut);border-radius:5px;padding:4px 8px}
.tag.am{border-color:var(--am);color:var(--am)}
.tag.vi{border-color:var(--vi);color:var(--vi)}
.qq{font-family:var(--disp);font-size:1.16rem;font-weight:700;line-height:1.5;margin-bottom:8px}
.qq sub,.qq sup{font-size:.72em}
.qq table,.opt table{border-collapse:collapse;margin:12px 0;font-family:var(--body);font-size:.85rem;font-weight:400}
.qq th,.qq td,.opt th,.opt td{border:1px solid var(--line);padding:6px 11px;text-align:left}
.qq th{background:var(--panel2);font-family:var(--mono);font-size:.62rem;letter-spacing:.08em}
.qq .fig{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;color:var(--dim);font-weight:400}
.qlist{margin:8px 0 8px 20px;font-family:var(--body);font-size:.9rem;font-weight:400;line-height:1.65}
.stmt{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:14px}
.stmt-lbl{font-family:var(--mono);font-size:.58rem;font-weight:700;letter-spacing:.14em;color:var(--dim);margin-bottom:7px}
.stmt-item{font-family:var(--body);font-size:.93rem;font-weight:400;line-height:1.62;color:var(--body)}
.stmt-item+.stmt-item{margin-top:5px}
img{height:auto}.qq img,.qimg{max-width:100%;border:1px solid var(--line);border-radius:10px;margin:6px 0 16px;background:#fff}
.alt{font-size:.84rem;color:var(--dim);font-style:italic;margin:-2px 0 16px;font-family:var(--body);font-weight:400}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.opt{display:flex;gap:13px;align-items:flex-start;text-align:left;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;padding:12px 15px;color:var(--txt);font-size:.92rem;line-height:1.5;transition:border-color .16s,background .16s;width:100%}
.opt:not(:disabled):hover{border-color:var(--fl)}
.opt .k{font-family:var(--mono);font-size:.64rem;color:var(--dim);border:1px solid var(--line);border-radius:5px;
  padding:3px 8px;flex-shrink:0;margin-top:2px}
.opt.pick{border-color:var(--vi);background:color-mix(in srgb,var(--vi) 12%,transparent)}
.opt.pick .k{color:var(--vi);border-color:var(--vi)}
.opt.right{border-color:var(--okG);background:color-mix(in srgb,var(--okG) 14%,transparent)}
.opt.right .k{color:var(--okG);border-color:var(--okG)}
.opt.wrong{border-color:var(--badR);background:color-mix(in srgb,var(--badR) 12%,transparent);animation:shake .4s}
.opt.dim{opacity:.42}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.why{margin-top:18px;padding:14px 16px;border-left:3px solid var(--fl);
  background:color-mix(in srgb,var(--fl) 7%,transparent);font-size:.87rem;color:var(--mut);border-radius:0 8px 8px 0}
.why b{color:var(--fl);font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;display:block;margin-bottom:5px}
.why.none{border-left-color:var(--dim);background:transparent;color:var(--dim);font-style:italic}
.nav{margin-top:22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nav .sp{margin-left:auto}
.btn{background:transparent;border:1px solid var(--fl);color:var(--fl);font-family:var(--mono);font-size:.68rem;
  letter-spacing:.14em;padding:11px 19px;border-radius:7px;transition:.18s}
.btn:hover{background:var(--fl);color:var(--onFl)}
.btn.mutebtn{border-color:var(--line);color:var(--mut)}
.btn.mutebtn:hover{background:transparent;border-color:var(--mut);color:var(--txt)}
.btn.flag.on{border-color:var(--am);color:var(--am)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.hint{font-family:var(--mono);font-size:.56rem;letter-spacing:.12em;color:var(--dim);margin-top:14px}

/* ---- navigator ---- */
.navg{display:none;padding:16px 20px;border-top:1px solid var(--line);background:var(--panel2)}
.navg.show{display:block}
.navg .cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.cell{aspect-ratio:1;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--dim);
  font-family:var(--mono);font-size:.62rem;display:flex;align-items:center;justify-content:center;transition:.14s;position:relative}
.cell:hover{border-color:var(--fl);color:var(--fl)}
.cell.done{color:var(--txt);border-color:var(--mut)}
.cell.ok{border-color:var(--okG);color:var(--okG)}
.cell.no{border-color:var(--badR);color:var(--badR)}
.cell.cur{outline:2px solid var(--fl);outline-offset:1px}
.cell.flag::after{content:'';position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--am)}

/* ---- report ---- */
.res{text-align:center;padding:26px 20px 8px}
.res .score{font-family:var(--disp);font-weight:900;font-size:4rem;line-height:1}
.res .score span{font-size:1.5rem;color:var(--dim)}
.res .pc{font-family:var(--mono);font-size:.7rem;letter-spacing:.2em;color:var(--fl);margin-top:6px}
.res .msg{font-family:var(--disp);font-style:italic;font-size:1.15rem;margin-top:12px;color:var(--am);max-width:46ch;margin-inline:auto}
.brow{display:grid;grid-template-columns:minmax(96px,1.1fr) 2fr 88px;gap:11px;align-items:center;margin-bottom:9px;
  font-family:var(--mono);font-size:.62rem;color:var(--mut)}
.brow .tr{height:7px;background:var(--line);border-radius:5px;overflow:hidden}
.brow .fl{height:100%;background:var(--fl);border-radius:5px;transition:width .5s}
.brow .fl.mid{background:var(--am)} .brow .fl.low{background:var(--badR)}
.brow .v{text-align:right}
.rev{border-top:1px solid var(--line);padding:16px 20px}
.rq{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:9px;background:var(--panel2)}
.rq .h{font-family:var(--mono);font-size:.58rem;letter-spacing:.12em;color:var(--dim);margin-bottom:7px;display:flex;gap:9px;flex-wrap:wrap}
.rq .h b{color:var(--badR)} .rq .h b.ok{color:var(--okG)}
.rq .t{font-size:.9rem;margin-bottom:8px}
.rq .ans{font-family:var(--mono);font-size:.66rem;color:var(--mut);line-height:1.9}
.rq .ans em{font-style:normal;color:var(--okG)} .rq .ans s{color:var(--badR)}
.rq .w{margin-top:8px;font-size:.82rem;color:var(--mut);padding-left:11px;border-left:2px solid var(--line)}

/* ---- misc ---- */
.empty{text-align:center;padding:44px 24px;color:var(--mut);font-size:.9rem}
.empty code{font-family:var(--mono);font-size:.8rem;color:var(--fl);background:var(--panel2);padding:2px 7px;border-radius:5px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,80px);background:var(--panel);border:1px solid var(--fl);
  color:var(--fl);font-family:var(--mono);font-size:.64rem;letter-spacing:.12em;padding:11px 20px;border-radius:100px;
  transition:transform .3s;z-index:99;box-shadow:0 14px 34px rgba(0,0,0,.45)}
.toast.show{transform:translate(-50%,0)}
footer{text-align:center;padding:32px 20px;font-family:var(--mono);font-size:.58rem;letter-spacing:.18em;color:var(--dim)}
footer span{color:var(--fl)}
@media (max-width:560px){
  .wrap{padding:18px 14px 60px}
  .qbody{padding:20px 16px 22px}
  .brow{grid-template-columns:minmax(76px,1fr) 1.3fr 74px;font-size:.55rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.bar,.nav,.navg,footer,.startrow{display:none}}

/* ============================================================
   PAPER 2 — STRUCTURED QUESTIONS
   ============================================================ */
.p2parts{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.p2part{border:1px solid var(--line);border-radius:10px;background:var(--panel2);overflow:hidden}
.p2part-head{display:flex;gap:10px;align-items:baseline;padding:12px 15px}
.p2part-label{font-family:var(--mono);font-size:.7rem;font-weight:700;color:var(--fl);
  background:color-mix(in srgb,var(--fl) 12%,transparent);border-radius:5px;padding:3px 9px;
  flex-shrink:0;align-self:flex-start;margin-top:2px}
.p2part-q{font-size:.93rem;line-height:1.6;flex:1}
.p2part-m{font-family:var(--mono);font-size:.57rem;color:var(--dim);flex-shrink:0;
  border:1px solid var(--line);border-radius:4px;padding:2px 7px;margin-left:8px;align-self:flex-start;margin-top:4px}
.p2reveal-btn{width:100%;background:transparent;border:0;border-top:1px solid var(--line);
  color:var(--mut);font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;
  padding:9px 15px;text-align:left;display:flex;gap:8px;align-items:center;transition:.15s;cursor:pointer}
.p2reveal-btn:hover{background:color-mix(in srgb,var(--fl) 6%,transparent);color:var(--fl)}
.p2reveal-btn.open{color:var(--okG);border-top-color:color-mix(in srgb,var(--okG) 30%,var(--line))}
.p2reveal-btn .arr{transition:transform .2s}
.p2reveal-btn.open .arr{transform:rotate(180deg)}
.p2ans{padding:13px 15px;border-top:1px solid color-mix(in srgb,var(--okG) 30%,var(--line));
  background:color-mix(in srgb,var(--okG) 6%,transparent)}
.p2ans-lbl{font-family:var(--mono);font-size:.56rem;letter-spacing:.14em;color:var(--okG);margin-bottom:6px}
.p2ans-txt{font-size:.92rem;color:var(--txt);line-height:1.65}
.p2ans-note{font-family:var(--mono);font-size:.58rem;color:var(--am);margin-top:6px;
  padding:5px 10px;border:1px solid color-mix(in srgb,var(--am) 30%,transparent);border-radius:5px;display:inline-block}
.p2ans-img{max-width:100%;border:1px solid var(--line);border-radius:8px;margin-top:10px;background:#fff}
/* Reveal-all button */
.p2revall{background:transparent;border:1px solid var(--line);color:var(--mut);font-family:var(--mono);
  font-size:.6rem;letter-spacing:.12em;padding:8px 15px;border-radius:7px;margin-top:16px;transition:.15s;cursor:pointer}
.p2revall:hover{border-color:var(--fl);color:var(--fl)}
/* Self-mark panel */
.p2score{margin-top:24px;padding:16px 18px;border:1px solid color-mix(in srgb,var(--am) 40%,var(--line));
  border-radius:10px;background:color-mix(in srgb,var(--am) 5%,transparent)}
.p2score-lbl{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;color:var(--am);margin-bottom:10px}
.p2score-btns{display:flex;gap:8px;flex-wrap:wrap}
.p2sb{background:var(--panel2);border:1px solid var(--line);color:var(--mut);font-family:var(--mono);
  font-size:.62rem;letter-spacing:.1em;padding:9px 16px;border-radius:7px;transition:.15s;cursor:pointer}
.p2sb:hover{border-color:var(--fl);color:var(--txt)}
.p2sb.got{border-color:var(--okG)!important;color:var(--okG)!important;background:color-mix(in srgb,var(--okG) 10%,transparent)!important}
.p2sb.partly{border-color:var(--am)!important;color:var(--am)!important;background:color-mix(in srgb,var(--am) 10%,transparent)!important}
.p2sb.missed{border-color:var(--badR)!important;color:var(--badR)!important;background:color-mix(in srgb,var(--badR) 10%,transparent)!important}
/* P2 summary report */
.p2summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:18px 20px}
.p2stat{text-align:center;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.p2stat b{font-family:var(--disp);font-size:2.2rem;font-weight:900;display:block;line-height:1}
.p2stat.ok b{color:var(--okG)} .p2stat.ok{border-color:color-mix(in srgb,var(--okG) 30%,var(--line))}
.p2stat.mid b{color:var(--am)} .p2stat.mid{border-color:color-mix(in srgb,var(--am) 30%,var(--line))}
.p2stat.bad b{color:var(--badR)} .p2stat.bad{border-color:color-mix(in srgb,var(--badR) 30%,var(--line))}
.p2stat small{font-family:var(--mono);font-size:.56rem;letter-spacing:.14em;color:var(--dim);margin-top:4px;display:block}
/* Sejarah-compatible P2 classes */
.stim{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px 15px;font-size:.88rem;color:var(--mut);margin:4px 0 18px;line-height:1.65}
.stim table{border-collapse:collapse;width:100%;margin:8px 0;font-size:.82rem}
.stim th,.stim td{border:1px solid var(--line);padding:4px 8px;text-align:center}
.stim th{background:color-mix(in srgb,var(--line) 50%,var(--panel2));font-weight:600;text-align:center}
.stim svg{display:block;margin:6px auto;max-width:100%}
.kotak-grid{display:grid;gap:3px;margin:10px 0}
.kotak-cell{border:1px solid var(--line);padding:8px 12px;text-align:center;background:var(--panel);font-size:.86rem;font-weight:500;border-radius:4px}
.stim-block{background:color-mix(in srgb,var(--fl) 8%,transparent);border-left:3px solid var(--fl);border-radius:0 6px 6px 0;padding:7px 11px;margin:7px 0;font-size:.83rem;line-height:1.55}
.stim-lbl{font-family:var(--mono);font-size:.58rem;letter-spacing:.14em;color:var(--fl);margin-right:6px;display:inline-block}
.stim-ph{color:var(--dim);font-style:italic;font-size:.82rem;padding:4px 0}
.part{border:1px solid var(--line);border-radius:11px;padding:14px 15px;margin-bottom:11px;background:var(--panel)}
.part.ok{border-color:var(--okG)} .part.no{border-color:var(--badR)}
.pq{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;line-height:1.5}
.pq .pl{font-family:var(--mono);font-size:.7rem;color:var(--fl);flex-shrink:0;margin-top:2px}
.pq .pm{margin-left:auto;flex-shrink:0;font-family:var(--mono);font-size:.56rem;letter-spacing:.1em;color:var(--am);border:1px solid var(--am);border-radius:5px;padding:2px 7px;margin-top:2px;white-space:nowrap}
.reveal{margin-top:11px;padding:8px 14px;font-size:.6rem}
.pa{margin-top:11px;padding:11px 14px;border-left:3px solid var(--fl);background:color-mix(in srgb,var(--fl) 7%,transparent);border-radius:0 8px 8px 0}
.pts{margin:0;padding-left:18px;font-size:.88rem;line-height:1.6}
.pts li{margin:3px 0}
.pts-sub{margin:3px 0 6px;padding-left:16px;list-style:disc;color:var(--mut)}
.selfm{display:flex;gap:8px;align-items:center;margin-top:11px;flex-wrap:wrap;font-family:var(--mono);font-size:.56rem;letter-spacing:.12em;color:var(--dim)}
.selfm span{margin-right:auto}
.btn.sm{padding:7px 13px;font-size:.6rem;border-color:var(--okG);color:var(--okG)}
.btn.sm:hover,.btn.sm.on{background:var(--okG);color:var(--onFl)}
.btn.sm.bad{border-color:var(--badR);color:var(--badR)}
.btn.sm.bad:hover,.btn.sm.bad.on{background:var(--badR);color:#fff}
</style>
</head>

           '<table><tr><th>Larutan / Solution</th><th>pH</th></tr><tr><td>W</td><td>8.0</td></tr><tr><td>X</td><td>12.0</td></tr><tr><td>Y</td><td>11.0</td></tr><tr><td>Z</td><td>13.0</td></tr></table><span class="fig">JADUAL 1 · TABLE 1</span>',
        en:'Table 1 shows the pH values of four alkaline solutions. Which solution has the highest concentration of hydroxide ions?'+
           '<table><tr><th>Larutan / Solution</th><th>pH</th></tr><tr><td>W</td><td>8.0</td></tr><tr><td>X</td><td>12.0</td></tr><tr><td>Y</td><td>11.0</td></tr><tr><td>Z</td><td>13.0</td></tr></table><span class="fig">JADUAL 1 · TABLE 1</span>' },
    o:[ {bm:'W',en:'W'}, {bm:'Y',en:'Y'}, {bm:'X',en:'X'}, {bm:'Z',en:'Z'} ],
    a:3,
    w:{ bm:'Semakin tinggi pH, semakin tinggi kepekatan ion OH⁻. pH tertinggi ialah Z (13.0). Perhatikan susunan pilihan bukan W-X-Y-Z — jawapannya D, bukan C.',
        en:'The higher the pH, the higher the OH⁻ concentration. The highest pH is Z (13.0). Note the options are not in W-X-Y-Z order — the answer is D, not C.' } },

  { n:14, topic:'MOLE',
    q:{ bm:'Sebuah silinder gas memasak mengandungi 1 mol gas butana, C₄H₁₀. Berapakah bilangan atom hidrogen di dalam silinder itu?<br><span class="fig">[Pemalar Avogadro, N<sub>A</sub> = 6.02 × 10<sup>23</sup> mol<sup>-1</sup>]</span>',
        en:'A cooking gas cylinder contains 1 mol of butane gas, C₄H₁₀. How many hydrogen atoms are there in the cylinder?<br><span class="fig">[Avogadro constant, N<sub>A</sub> = 6.02 × 10<sup>23</sup> mol<sup>-1</sup>]</span>' },
    o:[ {bm:'1 × 6.02 × 10<sup>23</sup>',  en:'1 × 6.02 × 10<sup>23</sup>'},
        {bm:'2 × 6.02 × 10<sup>23</sup>',  en:'2 × 6.02 × 10<sup>23</sup>'},
        {bm:'8 × 6.02 × 10<sup>23</sup>',  en:'8 × 6.02 × 10<sup>23</sup>'},
        {bm:'10 × 6.02 × 10<sup>23</sup>', en:'10 × 6.02 × 10<sup>23</sup>'} ],
    a:3,
    w:{ bm:'Satu molekul C₄H₁₀ mengandungi <b>10</b> atom hidrogen. Maka 1 mol molekul mengandungi 10 mol atom H = 10 × 6.02 × 10²³ atom. Jangan tersilap ambil bilangan atom karbon (4) atau bilangan molekul (1).',
        en:'One C₄H₁₀ molecule contains <b>10</b> hydrogen atoms. So 1 mol of molecules contains 10 mol of H atoms = 10 × 6.02 × 10²³ atoms. Do not grab the carbon count (4) or the molecule count (1).' } },

  { n:15, topic:'RATE',
    q:{ bm:'Seorang suri rumah mendapati kacang merah menjadi lebih cepat lembut apabila dimasak menggunakan periuk tekanan. Apakah penjelasan yang paling tepat?',
        en:'A housewife found that red beans became softer faster when cooked using a pressure cooker. What is the best explanation?' },
    o:[ {bm:'Tekanan yang lebih tinggi meningkatkan takat didih air.',
         en:'Higher pressure increases the boiling point of water.'},
        {bm:'Tekanan yang lebih tinggi menurunkan suhu air.',
         en:'Higher pressure decreases the temperature of water.'},
        {bm:'Tekanan yang lebih tinggi mengurangkan jisim kacang merah.',
         en:'Higher pressure reduces the mass of the red beans.'},
        {bm:'Tekanan yang lebih tinggi mempercepatkan kadar penyejatan air.',
         en:'Higher pressure increases the rate of water evaporation.'} ],
    a:0,
    w:{ bm:'Tekanan tinggi menaikkan takat didih air melebihi 100 °C. Suhu memasak yang lebih tinggi → zarah bertenaga kinetik lebih tinggi → lebih banyak perlanggaran berkesan → kacang lembut lebih cepat. Tekanan itu sendiri tidak melembutkan kacang; <b>suhu</b> yang lebih tinggi yang melakukannya.',
        en:'High pressure raises the boiling point of water above 100 °C. A higher cooking temperature → particles with more kinetic energy → more effective collisions → the beans soften faster. The pressure itself does not soften the beans; the higher <b>temperature</b> does.' } },

  { n:16, topic:'BOND',
    q:{ bm:'Formula ion bagi unsur X dan Y adalah X<sup>2+</sup> dan Y<sup>–</sup>. Sebatian yang terbentuk daripada tindak balas antara ion unsur X dengan ion unsur Y mempunyai formula XY₂. Antara persamaan ion berikut, yang manakah mewakili tindak balas itu?',
        en:'The ionic formulae of elements X and Y are X<sup>2+</sup> and Y<sup>–</sup>. The compound formed from the reaction of ions of X and Y has the formula XY₂. Which of the following ionic equations represents the reaction?' },
    o:[ {bm:'X<sup>2+</sup> + Y<sup>–</sup> → XY₂',   en:'X<sup>2+</sup> + Y<sup>–</sup> → XY₂'},
        {bm:'X<sup>2+</sup> + 2Y<sup>–</sup> → XY₂',  en:'X<sup>2+</sup> + 2Y<sup>–</sup> → XY₂'},
        {bm:'2X<sup>2+</sup> + Y<sup>–</sup> → XY₂',  en:'2X<sup>2+</sup> + Y<sup>–</sup> → XY₂'},
        {bm:'X<sup>2+</sup> + 2Y<sup>–</sup> → 2XY₂', en:'X<sup>2+</sup> + 2Y<sup>–</sup> → 2XY₂'} ],
    a:1,
    w:{ bm:'Satu ion X²⁺ memerlukan <b>dua</b> ion Y⁻ untuk meneutralkan cas (+2 dan 2 × −1 = 0), menghasilkan <b>satu</b> unit XY₂. Semak kedua-dua belah: cas seimbang dan bilangan atom seimbang. D gagal kerana hanya cukup ion untuk satu XY₂, bukan dua.',
        en:'One X²⁺ ion needs <b>two</b> Y⁻ ions to balance the charge (+2 and 2 × −1 = 0), giving <b>one</b> XY₂ unit. Check both sides: charges balance and atoms balance. D fails because there are only enough ions for one XY₂, not two.' } },

  { n:17, topic:'INTRO',
    q:{ bm:'Baja yang digunakan dalam pertanian boleh terhasil daripada proses rawatan air sisa. Antara peringkat pengurusan sisa berikut, yang manakah adalah peringkat penghasilan bahan tersebut?',
        en:'Fertiliser used in agriculture can be produced from the wastewater treatment process. Which of the following levels of waste management is the level at which the substance is produced?' },
    o:[ {bm:'Pelepasan efluen',        en:'Effluent release'},
        {bm:'Pengumpulan enapcemar',   en:'Sludge collection'},
        {bm:'Proses elektro-pengumpulan', en:'Electro-collection process'},
        {bm:'Rawatan lanjut sisa air', en:'Further treatment of wastewater'} ],
    a:1,
    w:{ bm:'Enapcemar (sludge) ialah pepejal organik yang dimendapkan semasa rawatan. Enapcemar yang dihadam dan dikeringkan inilah yang dikitar semula menjadi baja. Efluen ialah air terawat yang dilepaskan — bukan pepejal.',
        en:'Sludge is the organic solid settled out during treatment. It is this digested, dried sludge that is recycled into fertiliser. Effluent is the treated water that is released — not a solid.' } },

  { n:18, topic:'ATOM', img:'img/kimia/1b0e2b50f425.webp',
    alt:{ bm:'Pilihan A hingga D: empat rajah struktur atom.', en:'Options A to D: four atomic structure diagrams.' },
    q:{ bm:'Rajah 10 menunjukkan perwakilan piawai bagi atom Z sebagai <sup>11</sup>Z<sub>5</sub> (nombor nukleon 11, nombor proton 5). Antara rajah berikut, yang manakah menunjukkan struktur atom Z?',
        en:'Diagram 10 shows the standard representation of atom Z as <sup>11</sup>Z<sub>5</sub> (nucleon number 11, proton number 5). Which of the following diagrams shows the atomic structure of atom Z?' },
    o:[ {bm:'Rajah A', en:'Diagram A'}, {bm:'Rajah B', en:'Diagram B'},
        {bm:'Rajah C', en:'Diagram C'}, {bm:'Rajah D', en:'Diagram D'} ],
    a:2,
    w:{ bm:'Nombor proton 5 → 5 proton, dan neutron = 11 − 5 = <b>6 neutron</b>, jadi nukleus mesti berlabel “5p 6n”. Atom neutral ada 5 elektron → susunan elektron <b>2.3</b>. Hanya C menunjukkan kedua-duanya; A dan B tidak menunjukkan kandungan nukleus, dan D mempunyai terlalu banyak elektron di petala luar.',
        en:'Proton number 5 → 5 protons, and neutrons = 11 − 5 = <b>6 neutrons</b>, so the nucleus must be labelled “5p 6n”. A neutral atom has 5 electrons → electron arrangement <b>2.3</b>. Only C shows both; A and B do not show the nucleus contents, and D has too many electrons in the outer shell.' } },

  { n:19, topic:'CARBON', img:'img/kimia/6c787800ec61.webp',
    alt:{ bm:'Rajah 11: gas but-2-ena dialirkan ke dalam larutan kalium manganat(VII) berasid.',
          en:'Diagram 11: but-2-ene gas bubbled into acidified potassium manganate(VII) solution.' },
    q:{ bm:'Rajah 11 menunjukkan susunan radas bagi satu tindak balas kimia. Antara berikut, yang manakah hasil bagi tindak balas ini?',
        en:'Diagram 11 shows an apparatus set-up for a chemical reaction. Which of the following is the product of this reaction?' },
    o:[ {bm:'Butan-1-ol',    en:'Butan-1-ol'},
        {bm:'Butan-2-ol',    en:'Butan-2-ol'},
        {bm:'Butan-1,2-diol',en:'Butan-1,2-diol'},
        {bm:'Butan-2,3-diol',en:'Butan-2,3-diol'} ],
    a:3,
    w:{ bm:'Kalium manganat(VII) berasid mengoksidakan alkena dengan menambah satu kumpulan –OH pada <b>setiap</b> karbon ikatan ganda dua. Dalam but-2-ena ikatan ganda dua terletak antara C2 dan C3, maka hasilnya butan-<b>2,3</b>-diol. (Warna ungu akan luntur.)',
        en:'Acidified potassium manganate(VII) oxidises an alkene by adding an –OH group to <b>each</b> carbon of the double bond. In but-2-ene the double bond is between C2 and C3, so the product is butan-<b>2,3</b>-diol. (The purple colour decolourises.)' } },

  { n:20, topic:'THERMO',
    note:'Source PDF prints only options A, B and C for this question — option D is missing from the paper.',
    q:{ bm:'Jadual 2 menunjukkan haba pembakaran bagi metanol, propanol dan pentanol. Antara yang berikut, yang manakah mungkin mempunyai haba pembakaran −1376 kJ mol⁻¹?'+
           '<table><tr><th>Alkohol / Alcohol</th><th>Haba pembakaran / Heat of combustion (kJ mol<sup>-1</sup>)</th></tr>'+
           '<tr><td>Metanol / Methanol</td><td>−736</td></tr><tr><td>Propanol / Propanol</td><td>−2026</td></tr><tr><td>Pentanol / Pentanol</td><td>−3332</td></tr></table><span class="fig">JADUAL 2 · TABLE 2</span>',
        en:'Table 2 shows the heat of combustion for methanol, propanol and pentanol. Which of the following is most likely to have a heat of combustion of −1376 kJ mol⁻¹?'+
           '<table><tr><th>Alkohol / Alcohol</th><th>Haba pembakaran / Heat of combustion (kJ mol<sup>-1</sup>)</th></tr>'+
           '<tr><td>Metanol / Methanol</td><td>−736</td></tr><tr><td>Propanol / Propanol</td><td>−2026</td></tr><tr><td>Pentanol / Pentanol</td><td>−3332</td></tr></table><span class="fig">JADUAL 2 · TABLE 2</span>' },
    o:[ {bm:'Etanol',  en:'Ethanol'},
        {bm:'Butanol', en:'Butanol'},
        {bm:'Heksanol',en:'Hexanol'} ],
    a:0,
    w:{ bm:'Haba pembakaran menjadi lebih negatif apabila bilangan atom karbon bertambah: C1 = −736, C3 = −2026, C5 = −3332. Nilai −1376 terletak <b>antara</b> C1 dan C3, jadi alkohol itu mesti mempunyai <b>2</b> karbon = etanol. Butanol (C4) akan menghampiri −2700.',
        en:'Heat of combustion becomes more negative as the carbon count rises: C1 = −736, C3 = −2026, C5 = −3332. The value −1376 sits <b>between</b> C1 and C3, so the alcohol must have <b>2</b> carbons = ethanol. Butanol (C4) would be around −2700.' } },

  { n:21, topic:'MOLE',
    q:{ bm:'Rajah 12 menunjukkan perwakilan piawai bagi atom X sebagai <sup>1</sup>X<sub>1</sub> dan atom Y sebagai <sup>14</sup>Y<sub>7</sub>. Apakah jisim molekul relatif bagi sebatian yang terbentuk antara atom X dan atom Y?',
        en:'Diagram 12 shows the standard representation of atom X as <sup>1</sup>X<sub>1</sub> and atom Y as <sup>14</sup>Y<sub>7</sub>. What is the relative molecular mass of the compound formed between atom X and atom Y?' },
    o:[ {bm:'17',en:'17'}, {bm:'15',en:'15'}, {bm:'10',en:'10'}, {bm:'8',en:'8'} ],
    a:0,
    w:{ bm:'X ialah hidrogen (proton 1) dan Y ialah nitrogen (proton 7). Nitrogen memerlukan 3 elektron → sebatiannya <b>NH₃</b>. JMR = 14 + 3(1) = <b>17</b>. Menjawab 15 bermakna anda menggunakan NH₁; 8 bermakna anda menambah 7 + 1.',
        en:'X is hydrogen (proton number 1) and Y is nitrogen (proton number 7). Nitrogen needs 3 electrons → the compound is <b>NH₃</b>. RMM = 14 + 3(1) = <b>17</b>. Answering 15 means you used NH₁; 8 means you added 7 + 1.' } },

  { n:22, topic:'THERMO', img:'img/kimia/f681b258335c.webp',
    alt:{ bm:'Rajah 13: gambar rajah aras tenaga, bahan tindak balas Q + R pada E₂, puncak pada E₁, hasil U + V pada E₃.',
          en:'Diagram 13: energy level diagram, reactants Q + R at E₂, peak at E₁, products U + V at E₃.' },
    q:{ bm:'Rajah 13 menunjukkan gambar rajah aras tenaga yang mewakili tindak balas antara Q dan R. Apakah nilai tenaga pengaktifan bagi tindak balas tersebut?',
        en:'Diagram 13 shows the energy level diagram that represents the reaction between Q and R. What is the value of the activation energy of the reaction?' },
    o:[ {bm:'E₁ kJ',en:'E₁ kJ'}, {bm:'(E₁ − E₂) kJ',en:'(E₁ − E₂) kJ'},
        {bm:'(E₁ − E₃) kJ',en:'(E₁ − E₃) kJ'}, {bm:'(E₂ − E₃) kJ',en:'(E₂ − E₃) kJ'} ],
    a:1,
    w:{ bm:'Tenaga pengaktifan diukur dari aras <b>bahan tindak balas</b> (Q + R pada E₂) ke <b>puncak</b> (E₁), jadi Eₐ = E₁ − E₂. (E₂ − E₃) ialah ΔH bagi tindak balas eksotermik ini, bukan Eₐ.',
        en:'Activation energy is measured from the <b>reactant</b> level (Q + R at E₂) up to the <b>peak</b> (E₁), so Eₐ = E₁ − E₂. (E₂ − E₃) is the ΔH of this exothermic reaction, not Eₐ.' } },

  { n:23, topic:'INDUSTRY',
    q:{ bm:'Antara berikut, yang manakah <b>bukan</b> komponen dalam kaca soda kapur?',
        en:'Which of the following is <b>not</b> a component of soda lime glass?' },
    o:[ {bm:'Pasir',           en:'Sand'},
        {bm:'Boron oksida',    en:'Boron oxide'},
        {bm:'Kalsium karbonat',en:'Calcium carbonate'},
        {bm:'Natrium karbonat',en:'Sodium carbonate'} ],
    a:1,
    w:{ bm:'Kaca soda kapur = pasir (SiO₂) + natrium karbonat (soda) + kalsium karbonat (kapur). <b>Boron oksida</b> ialah bahan tambah bagi kaca <b>borosilikat</b>, yang memberikan rintangan haba (Pyrex).',
        en:'Soda lime glass = sand (SiO₂) + sodium carbonate (soda) + calcium carbonate (lime). <b>Boron oxide</b> is the additive for <b>borosilicate</b> glass, which gives heat resistance (Pyrex).' } },

  { n:24, topic:'PTABLE',
    q:{ bm:'Antara unsur Kumpulan 18 berikut, yang manakah digunakan di dalam mentol elektrik untuk menyediakan atmosfera lengai bagi menghalang filamen tungsten daripada terbakar?',
        en:'Which of the following Group 18 elements is used in electric bulbs to provide an inert atmosphere to prevent the tungsten filament from burning?' },
    o:[ {bm:'Helium',en:'Helium'}, {bm:'Neon',en:'Neon'},
        {bm:'Argon', en:'Argon'},  {bm:'Radon',en:'Radon'} ],
    a:2,
    w:{ bm:'<b>Argon</b> lengai, murah dan banyak (≈1% udara) → gas pengisi standard bagi mentol filamen. Helium digunakan dalam belon dan penyejukan; neon dalam lampu neon; radon radioaktif.',
        en:'<b>Argon</b> is inert, cheap and abundant (≈1% of air) → the standard fill gas for filament bulbs. Helium is used in balloons and cooling; neon in neon lights; radon is radioactive.' } },

  { n:25, topic:'INDUSTRY',
    q:{ bm:'Cakera brek diperbuat daripada seramik termaju. Antara berikut, sifat yang manakah paling sesuai dengan kegunaan cakera brek tersebut?<br><br><b>I</b> Mudah pecah<br><b>II</b> Penebat elektrik<br><b>III</b> Tahan kejutan terma<br><b>IV</b> Rintangan tinggi terhadap haba',
        en:'A brake disc is made from advanced ceramic. Which of the following properties are most suitable for the use of the brake disc?<br><br><b>I</b> Fragile<br><b>II</b> Electrical insulator<br><b>III</b> Withstands thermal shock<br><b>IV</b> High resistance to heat' },
    o:[ {bm:'I dan II',en:'I and II'}, {bm:'I dan III',en:'I and III'},
        {bm:'II dan IV',en:'II and IV'}, {bm:'III dan IV',en:'III and IV'} ],
    a:3,
    w:{ bm:'Brek menghasilkan haba geseran yang sangat tinggi dan berulang, jadi sifat yang relevan ialah rintangan haba dan ketahanan terhadap kejutan terma. “Mudah pecah” ialah <i>kelemahan</i>, dan sifat penebat elektrik tiada kaitan dengan mengehentikan kereta.',
        en:'Brakes generate very high, repeated frictional heat, so the relevant properties are heat resistance and resistance to thermal shock. “Fragile” is a <i>drawback</i>, and being an electrical insulator is irrelevant to stopping a car.' } },

  { n:26, topic:'CARBON', img:'img/kimia/c4410d0cb314.webp',
    alt:{ bm:'Rajah 15: formula struktur suatu alkana bercabang.', en:'Diagram 15: structural formula of a branched alkane.' },
    q:{ bm:'Rajah 15 menunjukkan formula struktur suatu sebatian karbon. Nyatakan nama sebatian tersebut berdasarkan sistem penamaan IUPAC.',
        en:'Diagram 15 shows the structural formula of a carbon compound. State the name of the compound based on IUPAC nomenclature.' },
    o:[ {bm:'4,5-dimetil-3-propilheksana', en:'4,5-dimethyl-3-propylhexane'},
        {bm:'3-propil-4,5-dimetilheksana', en:'3-propyl-4,5-dimethylhexane'},
        {bm:'2,3-metil-4-etilheptana',     en:'2,3-methyl-4-ethylheptane'},
        {bm:'4-etil-2,3-dimetilheptana',   en:'4-ethyl-2,3-dimethylheptane'} ],
    a:3,
    w:{ bm:'Rantai terpanjang ialah <b>7</b> karbon → heptana. Cabang: metil pada C2, metil pada C3, etil pada C4 → 4-etil-2,3-dimetilheptana. Nama disusun mengikut abjad (etil sebelum dimetil), dan A/B tersilap memilih rantai 6 karbon.',
        en:'The longest chain is <b>7</b> carbons → heptane. Branches: methyl on C2, methyl on C3, ethyl on C4 → 4-ethyl-2,3-dimethylheptane. Substituents are listed alphabetically (ethyl before dimethyl), and A/B wrongly pick a 6-carbon chain.' } },

  { n:27, topic:'POLYMER',
    q:{ bm:'Seorang pengilang perlu menghasilkan paip air yang tahan lama dan tidak mudah karat. Antara bahan berikut yang manakah paling sesuai untuk menghasilkan paip air tersebut?',
        en:'A manufacturer needs to produce water pipes which are durable and do not rust easily. Which is the most suitable substance to produce the water pipes?' },
    o:[ {bm:'Perspek',        en:'Perspex'},
        {bm:'Terilena',       en:'Terylene'},
        {bm:'Politena',       en:'Polythene'},
        {bm:'Polivinil klorida',en:'Polyvinyl chloride'} ],
    a:3,
    w:{ bm:'PVC keras, kuat, tahan bahan kimia dan tidak berkarat → paip air standard. Politena terlalu lembut untuk paip bertekanan, perspek rapuh dan digunakan sebagai pengganti kaca, terilena ialah gentian tekstil.',
        en:'PVC is rigid, strong, chemically resistant and cannot rust → the standard water pipe material. Polythene is too soft for pressurised pipes, Perspex is brittle and used as a glass substitute, Terylene is a textile fibre.' } },

  { n:28, topic:'INDUSTRY', img:'img/kimia/138c4ad0dd17.webp',
    alt:{ bm:'Rajah 16: susunan atom dalam aloi A — atom stanum yang lebih besar di antara atom kuprum.',
          en:'Diagram 16: arrangement of atoms in alloy A — larger tin atoms among copper atoms.' },
    q:{ bm:'Rajah 16 menunjukkan susunan atom di dalam aloi A (kuprum dengan stanum). Apakah kegunaan aloi A?',
        en:'Diagram 16 shows the arrangement of atoms in alloy A (copper with tin). What is the use of alloy A?' },
    o:[ {bm:'Membuat badan kapal terbang', en:'Making bodies of aeroplanes'},
        {bm:'Membuat alatan pembedahan',   en:'Making surgical instruments'},
        {bm:'Membuat alatan muzik',        en:'Making musical instruments'},
        {bm:'Membina tugu',                en:'Building monuments'} ],
    a:3,
    w:{ bm:'Kuprum + stanum = <b>gangsa</b>, yang keras dan tahan kakisan → patung dan tugu, loceng dan pingat. Jangan keliru dengan <b>loyang</b> (kuprum + zink) yang digunakan untuk alatan muzik.',
        en:'Copper + tin = <b>bronze</b>, which is hard and corrosion-resistant → statues and monuments, bells and medals. Do not confuse it with <b>brass</b> (copper + zinc), which is used for musical instruments.' } },

  { n:29, topic:'BOND', img:'img/kimia/6f4a0aa82892.webp',
    alt:{ bm:'Rajah 17: susunan elektron bagi atom S, T, U dan V.', en:'Diagram 17: electron arrangements of atoms S, T, U and V.' },
    q:{ bm:'Rajah 17 menunjukkan susunan elektron bagi atom-atom S, T, U dan V (bukan simbol sebenar). Pasangan unsur manakah yang membentuk suatu sebatian yang boleh menyalakan mentol dalam keadaan leburan?',
        en:'Diagram 17 shows the electron arrangements of atoms S, T, U and V (not the actual symbols). Which pair of elements forms a compound that lights up a bulb in the molten state?' },
    o:[ {bm:'S dan T',en:'S and T'}, {bm:'S dan U',en:'S and U'},
        {bm:'V dan S',en:'V and S'}, {bm:'U dan V',en:'U and V'} ],
    a:3,
    w:{ bm:'Mentol menyala dalam keadaan leburan → sebatian itu mesti <b>ionik</b> (logam + bukan logam). Susunan elektron: S = 2.4, T = 2.6, U = 2.8.1, V = 2.8.7. Hanya U (logam Kumpulan 1) dan V (bukan logam Kumpulan 17) memindahkan elektron untuk membentuk sebatian ionik seperti NaCl. S + T memberi sebatian kovalen — tidak mengkonduksi walaupun lebur.',
        en:'The bulb lights in the molten state → the compound must be <b>ionic</b> (metal + non-metal). Electron arrangements: S = 2.4, T = 2.6, U = 2.8.1, V = 2.8.7. Only U (a Group 1 metal) and V (a Group 17 non-metal) transfer electrons to form an ionic compound like NaCl. S + T gives a covalent compound — it does not conduct even when molten.' } },

  { n:30, topic:'MOLE', img:'img/kimia/f763c46aa101.webp',
    alt:{ bm:'Rajah 18: pita magnesium dalam mangkuk pijar bertutup, dipanaskan.',
          en:'Diagram 18: magnesium ribbon in a covered crucible, being heated.' },
    q:{ bm:'Rajah 18 menunjukkan susunan radas untuk menentukan formula empirik bagi magnesium oksida. Antara yang berikut, langkah manakah yang perlu diambil untuk memastikan semua magnesium bertindak balas lengkap dengan oksigen dan terbakar sepenuhnya?<br><br><b>I</b> Buka dan tutup penutup dengan cepat sekali sekala semasa pemanasan.<br><b>II</b> Panaskan pita magnesium dengan kuat di dalam mangkuk pijar tanpa penutupnya.<br><b>III</b> Perhatikan pepejal putih yang terhasil.<br><b>IV</b> Ulang pemanasan, penyejukan dan penimbangan sehingga jisim tetap diperolehi.',
        en:'Diagram 18 shows the apparatus set-up to determine the empirical formula of magnesium oxide. Which of the following steps should be taken to ensure that all the magnesium reacts with oxygen and burns completely?<br><br><b>I</b> Open and close the lid quickly occasionally during heating.<br><b>II</b> Heat the magnesium ribbon strongly in the crucible without its lid.<br><b>III</b> Observe the white solid produced.<br><b>IV</b> Repeat heating, cooling and weighing until a constant mass is obtained.' },

        {bm:'I dan IV', en:'I and IV'}, {bm:'III dan IV',en:'III and IV'} ],
    a:2,
    w:{ bm:'I membenarkan oksigen masuk tetapi menghalang wasap putih magnesium oksida daripada terlepas. IV mengesahkan tindak balas telah lengkap — jisim tetap bermakna tiada lagi oksigen diserap. II salah kerana tanpa penutup hasil akan hilang sebagai wasap; III hanya pemerhatian, bukan langkah yang memastikan pembakaran lengkap.',
        en:'I lets oxygen in while stopping the white magnesium oxide fumes from escaping. IV confirms the reaction is complete — a constant mass means no more oxygen is being absorbed. II is wrong because without the lid the product escapes as fumes; III is only an observation, not a step that ensures complete burning.' } },

  { n:31, topic:'ACID',

    a:3,
    w:{ bm:'Mol H₂SO₄ = MV/1000 = (2.0 × 250)/1000 = 0.5 mol. H₂SO₄ ialah asid <b>dwibes</b> — setiap molekul mengion memberi <b>2</b> ion H⁺ → 0.5 × 2 = <b>1.00 mol</b>. Jawapan 0.50 ialah perangkap bagi yang terlupa faktor 2.',

  { n:32, topic:'MOLE', img:'img/kimia/ad514fff0256.webp',

        en:'2Na + Cl₂ → 2NaCl. The mole ratio Cl₂ : NaCl is <b>1 : 2</b>, so 0.1 mol NaCl needs 0.05 mol Cl₂. Volume = 0.05 × 24 = <b>1.2 dm³</b>. The 2.4 dm³ option is the trap for forgetting the 1:2 ratio.' } },

  { n:33, topic:'RATE',
    q:{ bm:'Antara berikut, yang manakah merupakan tindak balas perlahan?<br><br><b>I</b> Tindak balas pereputan<br><b>II</b> Tindak balas penapaian<br><b>III</b> Tindak balas pemendakan<br><b>IV</b> Tindak balas pembakaran',
        en:'Which of the following are slow reactions?<br><br><b>I</b> Decay reactions<br><b>II</b> Fermentation reactions<br><b>III</b> Precipitation reactions<br><b>IV</b> Combustion reactions' },

    w:{ bm:'Pereputan mengambil masa berhari-hari hingga bertahun, dan penapaian mengambil masa berhari-hari — kedua-duanya perlahan. Pemendakan berlaku hampir serta-merta apabila dua larutan dicampurkan, dan pembakaran berlaku dalam beberapa saat — kedua-duanya cepat.',
        en:'Decay takes days to years and fermentation takes days — both are slow. Precipitation happens almost instantly when two solutions are mixed, and combustion happens in seconds — both are fast.' } },

    w:{ bm:'Fe²⁺ → Fe³⁺ + e⁻: ferum(II) kehilangan elektron, jadi ia <b>teroksida</b> dan bertindak sebagai agen penurunan. Dikromat(VI) ialah agen <b>pengoksidaan</b> (D salah). Elektron mengalir dari terminal penurunan (Y, ferum(II)) ke X melalui wayar (A salah), dan dalam larutan arus dibawa oleh <b>ion</b>, bukan elektron (C salah).',

  { n:36, topic:'THERMO',
    q:{ bm:'Persamaan termokimia berikut mewakili tindak balas peneutralan antara 25 cm³ asid nitrik dan 25 cm³ larutan kalium hidroksida yang sama kemolaran. Suhu campuran meningkat sebanyak 7.0 °C. Apakah kemolaran bagi kedua-dua larutan?<br><span class="fig">HNO₃(ak) + KOH(ak) → KNO₃(ak) + H₂O(ce) &nbsp; ΔH = −57.3 kJ mol⁻¹<br>[Muatan haba tentu larutan = 4.2 J g⁻¹ °C⁻¹, Ketumpatan larutan = 1 g cm⁻³]</span>',
        en:'The following thermochemical equation represents the neutralisation between 25 cm³ nitric acid and 25 cm³ potassium hydroxide solution of the same molarity. The temperature of the mixture increased by 7.0 °C. What is the molarity of both solutions?<br><span class="fig">HNO₃(aq) + KOH(aq) → KNO₃(aq) + H₂O(l) &nbsp; ΔH = −57.3 kJ mol⁻¹<br>[Specific heat capacity of solution = 4.2 J g⁻¹ °C⁻¹, Density of solution = 1 g cm⁻³]</span>' },
    o:[ {bm:'2.24 mol dm⁻³',en:'2.24 mol dm⁻³'}, {bm:'2.10 mol dm⁻³',en:'2.10 mol dm⁻³'},
        {bm:'1.03 mol dm⁻³',en:'1.03 mol dm⁻³'}, {bm:'0.52 mol dm⁻³',en:'0.52 mol dm⁻³'} ],
    a:2,
    w:{ bm:'Jisim campuran = 25 + 25 = <b>50 g</b>. Haba dibebaskan, Q = mcΔθ = 50 × 4.2 × 7.0 = 1470 J = 1.47 kJ. Mol air terbentuk = 1.47 / 57.3 = 0.0257 mol = mol asid. Kemolaran = 0.0257 / 0.025 dm³ = <b>1.03 mol dm⁻³</b>. Perangkap utama: menggunakan 25 g dan bukan 50 g.',
        en:'Mass of the mixture = 25 + 25 = <b>50 g</b>. Heat released, Q = mcΔθ = 50 × 4.2 × 7.0 = 1470 J = 1.47 kJ. Moles of water formed = 1.47 / 57.3 = 0.0257 mol = moles of acid. Molarity = 0.0257 / 0.025 dm³ = <b>1.03 mol dm⁻³</b>. The main trap is using 25 g instead of 50 g.' } },
