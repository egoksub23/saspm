        en:'All glass is built from silica sand, <b>SiO₂</b>. Boron oxide is only an additive for heat-resistant borosilicate glass, iron oxide adds colour, and sulphur dioxide is a gas — not a glass component at all.' } },

  { n:12, topic:'CARBON', img:'img/kimia/d10f0a73c8e6.webp',
    alt:{ bm:'Rajah 3: wul kaca direndam dengan sebatian X dipanaskan di atas serpihan porselin; gas Y dikumpul di atas air.',
          en:'Diagram 3: glass wool soaked in compound X heated over porcelain chips; gas Y collected over water.' },
    q:{ bm:'Rajah 3 menunjukkan proses pendehidratan sebatian X untuk menghasilkan gas Y, dan gas Y terdiri daripada 3 atom karbon. Kenal pasti sebatian X dan gas Y.',
        en:'Diagram 3 shows the dehydration of compound X to produce gas Y, and gas Y consists of 3 carbon atoms. Identify compound X and gas Y.' },
    o:[ {bm:'X: C₃H₇O &nbsp;·&nbsp; Y: C₃H₆',   en:'X: C₃H₇O &nbsp;·&nbsp; Y: C₃H₆'},
        {bm:'X: C₃H₈O &nbsp;·&nbsp; Y: C₃H₆',   en:'X: C₃H₈O &nbsp;·&nbsp; Y: C₃H₆'},
        {bm:'X: C₃H₈O₂ &nbsp;·&nbsp; Y: C₃H₆',  en:'X: C₃H₈O₂ &nbsp;·&nbsp; Y: C₃H₆'},
        {bm:'X: C₃H₆ &nbsp;·&nbsp; Y: C₃H₈O',   en:'X: C₃H₆ &nbsp;·&nbsp; Y: C₃H₈O'} ],
    a:1,
    w:{ bm:'Pendehidratan membuang <b>H₂O</b> daripada suatu alkohol untuk memberi alkena: C₃H₈O → C₃H₆ + H₂O. Jadi X ialah propanol (C₃H₈O) dan Y ialah propena (C₃H₆). C₃H₇O bukan formula sah, C₃H₈O₂ mempunyai dua oksigen, dan D menterbalikkan bahan tindak balas dengan hasil.',
        en:'Dehydration removes <b>H₂O</b> from an alcohol to give an alkene: C₃H₈O → C₃H₆ + H₂O. So X is propanol (C₃H₈O) and Y is propene (C₃H₆). C₃H₇O is not a valid formula, C₃H₈O₂ has two oxygens, and D swaps the reactant and product.' } },

  { n:13, topic:'ACID', img:'img/kimia/064887d02398.webp',
    alt:{ bm:'Rajah 4: kebun sayur Aiman bersebelahan kilang yang mengeluarkan asap dari cerobong.',
          en:'Diagram 4: Aiman’s vegetable garden next to a factory releasing smoke from its chimneys.' },
    q:{ bm:'Rajah 4 menunjukkan permandangan sekitar kebun Aiman dan situasi yang dihadapinya dalam tempoh masa yang lama. Berdasarkan situasi itu, apakah yang perlu dilakukan oleh Aiman untuk mengatasi masalah kesuburan tanah?',
        en:'Diagram 4 shows the view around Aiman’s garden and the situation he has faced over a long period of time. Based on that situation, what should Aiman do to overcome the soil fertility problem?' },
    o:[ {bm:'Menyiram tanah dengan air kolam',en:'Watering the soil with pond water'},
        {bm:'Menabur kapur tohor pada tanah',en:'Sprinkling quicklime on the soil'},
        {bm:'Menabur garam biasa pada tanah',en:'Sprinkling common salt on the soil'},
        {bm:'Menambahkan ammonium nitrat pada tanah',en:'Adding ammonium nitrate to the soil'} ],
    a:1,
    w:{ bm:'Asap kilang mengandungi SO₂ dan NO₂ yang menghasilkan <b>hujan asid</b>, jadi tanah menjadi terlalu berasid selepas sekian lama. Kapur tohor (CaO) ialah bes — ia <b>meneutralkan</b> keasidan itu. Ammonium nitrat ialah baja tetapi ia menjadikan tanah lebih <b>berasid</b>, dan garam biasa merosakkan tanaman.',
        en:'Factory smoke carries SO₂ and NO₂ which make <b>acid rain</b>, so over time the soil turns too acidic. Quicklime (CaO) is a base — it <b>neutralises</b> that acidity. Ammonium nitrate is a fertiliser but it makes soil <b>more</b> acidic, and common salt damages crops.' } },

  { n:14, topic:'CONSUMER', img:'img/kimia/c7aa8749df98.webp',
    alt:{ bm:'Rajah 5: lemak + 3NaOH → gliserol + tiga garam natrium asid lemak (Bahan X).',
          en:'Diagram 5: fat + 3NaOH → glycerol + three sodium salts of fatty acids (Substance X).' },
    q:{ bm:'Rajah 5 menunjukkan satu tindak balas untuk menghasilkan Bahan X. Namakan tindak balas untuk penghasilan Bahan X.',
        en:'Diagram 5 shows a reaction to produce Substance X. Name the reaction for the production of Substance X.' },
    o:[ {bm:'Saponifikasi',en:'Saponification'}, {bm:'Pempolimeran',en:'Polymerisation'},
        {bm:'Peneutralan',en:'Neutralisation'},  {bm:'Pensulfonan',en:'Sulphonation'} ],
    a:0,
    w:{ bm:'Lemak + alkali → gliserol + garam natrium asid lemak (<b>sabun</b>). Tindak balas ini dipanggil <b>saponifikasi</b> — secara harfiah “pembuatan sabun”. Pensulfonan pula digunakan untuk menghasilkan <b>detergen</b>, bukan sabun.',
        en:'Fat + alkali → glycerol + the sodium salts of fatty acids (<b>soap</b>). This reaction is called <b>saponification</b> — literally “soap making”. Sulphonation is the route to <b>detergents</b>, not soap.' } },

  { n:15, topic:'BOND',
    note:'The source prints option A as "Larut dalam water / Soluble in air" — the two languages are swapped. Rendered here as the clearly intended "Soluble in water".',
    q:{ bm:'Antara yang berikut, ciri manakah yang berbeza antara sebatian garam biasa dan glukosa?',
        en:'Which of the following characteristics differs between table salt and glucose?' },
    o:[ {bm:'Garam biasa: Larut dalam propanon &nbsp;·&nbsp; Glukosa: Larut dalam air',
         en:'Table salt: Soluble in propanone &nbsp;·&nbsp; Glucose: Soluble in water'},
        {bm:'Garam biasa: Takat lebur dan takat didih yang rendah &nbsp;·&nbsp; Glukosa: Takat lebur dan takat didih yang tinggi',
         en:'Table salt: Low melting and boiling point &nbsp;·&nbsp; Glucose: High melting and boiling point'},
        {bm:'Garam biasa: Mentol akan menyala apabila dilarutkan dalam air &nbsp;·&nbsp; Glukosa: Mentol tidak menyala apabila dilarutkan dalam air',
         en:'Table salt: The bulb lights up when dissolved in water &nbsp;·&nbsp; Glucose: The bulb does not light up when dissolved in water'},
        {bm:'Garam biasa: Boleh mengkonduksikan elektrik dalam semua keadaan &nbsp;·&nbsp; Glukosa: Boleh mengkonduksikan elektrik dalam keadaan akueus',
         en:'Table salt: Can conduct electricity in all states &nbsp;·&nbsp; Glucose: Can conduct electricity in the aqueous state'} ],
    a:2,
    w:{ bm:'Garam biasa ialah sebatian <b>ion</b> — larutan akueusnya mengandungi ion bebas bergerak, jadi mentol menyala. Glukosa ialah sebatian <b>kovalen</b> — ia larut sebagai molekul neutral, jadi mentol tidak menyala. B terbalik (ion mempunyai takat lebur <i>tinggi</i>), dan D salah dua kali: garam biasa tidak mengkonduksi sebagai pepejal, dan glukosa tidak mengkonduksi langsung.',
        en:'Table salt is <b>ionic</b> — its aqueous solution has free-moving ions, so the bulb lights. Glucose is <b>covalent</b> — it dissolves as neutral molecules, so the bulb stays off. B is reversed (ionic compounds have <i>high</i> melting points), and D is wrong twice: table salt does not conduct as a solid, and glucose does not conduct at all.' } },

  { n:16, topic:'CARBON',
    q:{ bm:'Antara yang berikut, pernyataan manakah yang menunjukkan ciri yang sama bagi alkena dan alkuna?',
        en:'Which of the following statements shows a characteristic shared by alkenes and alkynes?' },
    o:[ {bm:'Mempunyai ikatan ganda dua antara atom karbon',en:'Has a double bond between carbon atoms'},
        {bm:'Mempunyai ikatan tunggal antara atom karbon',en:'Has a single bond between carbon atoms'},
        {bm:'Hidrokarbon tak tepu',en:'Unsaturated hydrocarbon'},
        {bm:'Hidrokarbon tepu',en:'Saturated hydrocarbon'} ],
    a:2,
    w:{ bm:'Alkena mempunyai ikatan <b>ganda dua</b> dan alkuna mempunyai ikatan <b>ganda tiga</b> — jadi A hanya benar bagi alkena. Namun kedua-duanya mempunyai ikatan berganda, maka kedua-duanya <b>tak tepu</b>. Hanya alkana yang tepu.',
        en:'Alkenes have a <b>double</b> bond and alkynes have a <b>triple</b> bond — so A is true only for alkenes. But both have multiple bonds, so both are <b>unsaturated</b>. Only alkanes are saturated.' } },

  { n:17, topic:'MOLE', img:'img/kimia/78ce109d816a.webp',
    alt:{ bm:'Rajah 5: gas hidrogen daripada zink dan asid hidroklorik dialirkan ke atas serbuk kuprum(II) oksida yang dipanaskan.',
          en:'Diagram 5: hydrogen gas from zinc and hydrochloric acid passed over heated copper(II) oxide powder.' },
    q:{ bm:'Rajah 5 menunjukkan susunan radas bagi menentukan formula empirik kuprum(II) oksida. Apakah yang perlu dilakukan untuk memastikan gas hidrogen dihasilkan secara berterusan?',
        en:'Diagram 5 shows the apparatus to determine the empirical formula of copper(II) oxide. What should be done to ensure hydrogen gas is produced continuously?' },
    o:[ {bm:'Menambahkan serbuk zink secara berlebihan',en:'Add zinc in excess'},
        {bm:'Menukarkan asid 1.0 mol dm⁻³ kepada 0.5 mol dm⁻³',en:'Change the acid from 1.0 mol dm⁻³ to 0.5 mol dm⁻³'},
        {bm:'Menukarkan ketulan zink kepada serbuk zink',en:'Change zinc granules to zinc powder'},
        {bm:'Panaskan campuran zink dan asid',en:'Heat the mixture of zinc and acid'} ],
    a:0,
    w:{ bm:'Kata kunci ialah <b>berterusan</b>, bukan lebih cepat. Zink berlebihan memastikan bekalan gas tidak terhenti sebelum semua kuprum(II) oksida diturunkan. C dan D hanya <b>mempercepatkan</b> tindak balas (yang menghabiskan bahan lebih awal), dan B melambatkannya.',
        en:'The key word is <b>continuously</b>, not faster. Excess zinc guarantees the gas supply does not stop before all the copper(II) oxide is reduced. C and D only make the reaction <b>faster</b> (using the reactants up sooner), and B slows it down.' } },

  { n:18, topic:'REDOX', img:'img/kimia/3dbb6e770caf.webp',
    alt:{ bm:'Rajah 6: paku besi dibalut logam Q di dalam agar-agar panas dengan fenolftalein dan kalium heksasianoferat(III).',
          en:'Diagram 6: an iron nail wrapped with metal Q in hot agar containing phenolphthalein and potassium hexacyanoferrate(III).' },
    q:{ bm:'Rajah 6 menunjukkan susunan radas bagi mengkaji kesan logam yang bersentuh dengan besi ke atas pengaratan besi. Selepas tiga hari didapati tompok merah jambu terbentuk manakala tiada tompok biru terbentuk. Apakah logam Q?',
        en:'Diagram 6 shows the apparatus to study the effect of a metal in contact with iron on the rusting of iron. After three days, pink spots were formed while no blue spots were formed. What is metal Q?' },
    o:[ {bm:'Zink',en:'Zinc'}, {bm:'Ferum',en:'Iron'},
        {bm:'Argentum',en:'Silver'}, {bm:'Plumbum',en:'Lead'} ],
    a:0,
    w:{ bm:'Tompok <b>biru</b> menandakan ion Fe²⁺ (besi berkarat) — kerana ia <b>tidak</b> terbentuk, besi itu terlindung sepenuhnya. Perlindungan sedemikian hanya berlaku jika logam Q <b>lebih elektropositif</b> daripada besi, dan hanya zink memenuhi syarat itu. Tompok merah jambu ialah ion OH⁻ daripada penurunan oksigen.',
        en:'<b>Blue</b> spots mark Fe²⁺ ions (iron rusting) — because none formed, the iron was fully protected. That only happens if metal Q is <b>more electropositive</b> than iron, and only zinc qualifies. The pink spots are OH⁻ ions from the reduction of oxygen.' } },

  { n:19, topic:'INTRO',
    q:{ bm:'Bagaimana teknologi hijau boleh membantu dalam kehidupan?<br><br><b>I</b> Peralihan daripada tenaga semula jadi kepada tenaga nuklear<br><b>II</b> Peningkatan penggunaan teknologi kecerdasan buatan<br><b>III</b> Sumber tenaga yang lebih bersih<br><b>IV</b> Peningkatan kualiti hidup',
        en:'How can green technology help in life?<br><br><b>I</b> Transition from natural energy to nuclear energy<br><b>II</b> Increasing use of artificial intelligence technology<br><b>III</b> Cleaner energy sources<br><b>IV</b> Improved quality of life' },
    o:[ {bm:'I dan II',en:'I and II'}, {bm:'I dan III',en:'I and III'},
        {bm:'II dan IV',en:'II and IV'}, {bm:'III dan IV',en:'III and IV'} ],
    a:3,
    w:{ bm:'Teknologi hijau bertujuan mengurangkan pencemaran dan memelihara alam sekitar → sumber tenaga yang lebih bersih (III) dan kualiti hidup yang lebih baik (IV). I songsang — teknologi hijau bergerak <b>ke arah</b> tenaga boleh diperbaharui, bukan menjauhinya, dan sisa nuklear bukan “hijau”. Kecerdasan buatan (II) tiada kaitan langsung.',
        en:'Green technology aims to cut pollution and protect the environment → cleaner energy sources (III) and a better quality of life (IV). I is backwards — green technology moves <b>towards</b> renewable energy, not away from it, and nuclear waste is not “green”. Artificial intelligence (II) is unrelated.' } },

  { n:20, topic:'POLYMER',
    q:{ bm:'Apakah yang akan berlaku apabila getah asli dipanaskan bersama sulfur?',
        en:'What will happen when natural rubber is heated with sulphur?' },
    o:[ {bm:'Takat lebur getah berkurang',en:'The melting point of the rubber decreases'},
        {bm:'Kekenyalan getah meningkat',en:'The elasticity of the rubber increases'},
        {bm:'Kereaktifan terhadap oksigen meningkat',en:'Reactivity towards oxygen increases'},
        {bm:'Getah tervulkan kurang rintangan terhadap haba',en:'The vulcanised rubber is less resistant to heat'} ],
    a:1,
    w:{ bm:'Memanaskan getah dengan sulfur ialah <b>vulkanisasi</b>: rangkai silang sulfur terbentuk antara rantai poliisoprena. Hasilnya getah menjadi lebih kenyal, lebih kuat, <b>lebih</b> tahan haba dan <b>kurang</b> reaktif terhadap oksigen — jadi C dan D terbalik, dan takat leburnya <i>naik</i>.',
        en:'Heating rubber with sulphur is <b>vulcanisation</b>: sulphur cross-links form between the polyisoprene chains. The rubber becomes more elastic, stronger, <b>more</b> heat resistant and <b>less</b> reactive towards oxygen — so C and D are reversed, and the melting point <i>rises</i>.' } },

  { n:21, topic:'ATOM',
    q:{ bm:'Atom X mempunyai 10 neutron dan nombor nukleon ialah 19. Unsur manakah yang mempunyai sifat kimia yang sama dengan unsur X?<br><span class="fig">[Nombor proton: O = 8, Na = 11, Cl = 17, Ar = 18]</span>',
        en:'Atom X has 10 neutrons and a nucleon number of 19. Which element has the same chemical properties as element X?<br><span class="fig">[Proton number: O = 8, Na = 11, Cl = 17, Ar = 18]</span>' },
    o:[ {bm:'Klorin',en:'Chlorine'}, {bm:'Argon',en:'Argon'},
        {bm:'Oksigen',en:'Oxygen'}, {bm:'Natrium',en:'Sodium'} ],
    a:0,
    w:{ bm:'Nombor proton X = 19 − 10 = <b>9</b> → fluorin, susunan elektron 2.7, iaitu <b>Kumpulan 17</b>. Sifat kimia ditentukan oleh bilangan elektron valens, jadi unsur yang serupa mesti juga dalam Kumpulan 17 → klorin (2.8.7).',
        en:'Proton number of X = 19 − 10 = <b>9</b> → fluorine, electron arrangement 2.7, i.e. <b>Group 17</b>. Chemical properties are set by the number of valence electrons, so the matching element must also be in Group 17 → chlorine (2.8.7).' } },

  { n:22, topic:'MOLE',
    q:{ bm:'Fatimah tertumpah 20 cm³ cuka 0.5 mol dm⁻³ ke dalam bekas yang berisi 10 g soda bikarbonat, NaHCO₃. Berapakah isi padu gelembung gas dibebaskan pada keadaan bilik?<br><span class="fig">CH₃COOH + NaHCO₃ → CH₃COONa + H₂O + CO₂<br>[Jisim molar NaHCO₃: 84 g mol⁻¹; isi padu molar gas: 24 dm³ mol⁻¹]</span>',
        en:'Fatimah accidentally spilled 20 cm³ of 0.5 mol dm⁻³ vinegar into a container holding 10 g of soda bicarbonate, NaHCO₃. What is the volume of gas bubbles released at room conditions?<br><span class="fig">CH₃COOH + NaHCO₃ → CH₃COONa + H₂O + CO₂<br>[Molar mass of NaHCO₃: 84 g mol⁻¹; molar volume of gas: 24 dm³ mol⁻¹]</span>' },
    o:[ {bm:'0.240 dm³',en:'0.240 dm³'}, {bm:'0.224 dm³',en:'0.224 dm³'},
        {bm:'2.667 dm³',en:'2.667 dm³'}, {bm:'2.860 dm³',en:'2.860 dm³'} ],
    a:0,
    w:{ bm:'Mula-mula cari bahan <b>penghad</b>. Asid: 0.020 dm³ × 0.5 = <b>0.01 mol</b>. NaHCO₃: 10/84 = 0.119 mol — jauh lebih banyak, jadi asid yang menghadkan. Nisbah 1 : 1 → 0.01 mol CO₂ → 0.01 × 24 = <b>0.24 dm³</b>. Menggunakan 0.119 mol memberi 2.86 dm³ — itulah perangkapnya.',
        en:'First find the <b>limiting</b> reactant. Acid: 0.020 dm³ × 0.5 = <b>0.01 mol</b>. NaHCO₃: 10/84 = 0.119 mol — far more, so the acid limits. The ratio is 1 : 1 → 0.01 mol CO₂ → 0.01 × 24 = <b>0.24 dm³</b>. Using 0.119 mol gives 2.86 dm³ — that is the trap.' } },

  { n:23, topic:'RATE',
    q:{ bm:'Huda ingin menyediakan gas hidrogen di dalam makmal menggunakan tindak balas antara pita magnesium dengan larutan asid hidroklorik. Langkah manakah yang perlu diambil untuk memendekkan masa pengumpulan gas tersebut?<br><br><b>I</b> Menambahkan isi padu larutan asid hidroklorik<br><b>II</b> Menambahkan air suling kepada asid hidroklorik<br><b>III</b> Menggantikan pita magnesium dengan serbuk magnesium<br><b>IV</b> Menambahkan beberapa titis larutan kuprum(II) sulfat kepada campuran',
        en:'Huda wants to prepare hydrogen gas in the laboratory using the reaction between magnesium ribbon and hydrochloric acid. Which steps should be taken to shorten the time needed to collect the gas?<br><br><b>I</b> Increasing the volume of hydrochloric acid<br><b>II</b> Adding distilled water to the hydrochloric acid<br><b>III</b> Replacing the magnesium ribbon with magnesium powder<br><b>IV</b> Adding a few drops of copper(II) sulphate solution to the mixture' },
    o:[ {bm:'I dan II',en:'I and II'}, {bm:'I dan III',en:'I and III'},
        {bm:'II dan IV',en:'II and IV'}, {bm:'III dan IV',en:'III and IV'} ],
    a:3,
    w:{ bm:'Serbuk mempunyai <b>luas permukaan</b> yang jauh lebih besar (III) dan kuprum(II) sulfat bertindak sebagai <b>pemangkin</b> bagi tindak balas Mg + HCl (IV) — kedua-duanya mempercepatkan tindak balas. Menambah isi padu (I) tidak mengubah <b>kepekatan</b>, dan menambah air (II) justeru <b>mencairkan</b> asid dan melambatkannya.',
        en:'Powder has a far larger <b>surface area</b> (III) and copper(II) sulphate acts as a <b>catalyst</b> for the Mg + HCl reaction (IV) — both speed things up. Adding more volume (I) does not change the <b>concentration</b>, and adding water (II) actually <b>dilutes</b> the acid and slows it down.' } },

  { n:24, topic:'MOLE',
    q:{ bm:'Persamaan kimia yang manakah mewakili tindak balas antara logam kalium dengan gas oksigen?',
        en:'Which chemical equation represents the reaction between potassium metal and oxygen gas?' },
    o:[ {bm:'Ca + O₂ → CaO',en:'Ca + O₂ → CaO'},
        {bm:'2Ca + O₂ → 2CaO',en:'2Ca + O₂ → 2CaO'},
        {bm:'4K + O₂ → 2K₂O',en:'4K + O₂ → 2K₂O'},
        {bm:'2K + O₂ → K₂O',en:'2K + O₂ → K₂O'} ],
    a:2,
    w:{ bm:'Pertama, soalan meminta <b>kalium</b> (K), jadi A dan B (kalsium) tersingkir terus. Kalium ialah Kumpulan 1 → oksidanya K₂O. Semak imbangan: 4K + O₂ → 2K₂O memberi 4 K dan 2 O di kedua-dua belah ✓. Pilihan D hanya mempunyai 2 O di sebelah kiri tetapi 1 di sebelah kanan.',
        en:'First, the question asks about <b>potassium</b> (K), so A and B (calcium) are out immediately. Potassium is Group 1 → its oxide is K₂O. Check the balance: 4K + O₂ → 2K₂O gives 4 K and 2 O on both sides ✓. Option D has 2 O on the left but only 1 on the right.' } },

  { n:25, topic:'REDOX',
    q:{ bm:'Proses Sentuh merupakan proses penghasilan asid sulfurik melalui peringkat berikut:<br><span class="fig">S → SO₂ → SO₃ → H₂SO₄</span><br>Antara berikut, yang manakah urutan yang betul bagi menunjukkan perubahan nombor pengoksidaan bagi sulfur?',
        en:'The Contact Process produces sulphuric acid through the following stages:<br><span class="fig">S → SO₂ → SO₃ → H₂SO₄</span><br>Which of the following is the correct sequence showing the change in the oxidation number of sulphur?' },
    o:[ {bm:'0 → +2 → +3 → +4',en:'0 → +2 → +3 → +4'},
        {bm:'0 → +2 → +4 → +4',en:'0 → +2 → +4 → +4'},
        {bm:'0 → +4 → +6 → +6',en:'0 → +4 → +6 → +6'},
        {bm:'0 → +4 → +6 → +8',en:'0 → +4 → +6 → +8'} ],
    a:2,
    w:{ bm:'Sulfur unsur = <b>0</b>. Dalam SO₂: S + 2(−2) = 0 → <b>+4</b>. Dalam SO₃: S + 3(−2) = 0 → <b>+6</b>. Dalam H₂SO₄: 2(+1) + S + 4(−2) = 0 → <b>+6</b> lagi. Perhatikan peringkat akhir hanyalah penambahan air, jadi nombor pengoksidaan <b>tidak berubah</b> — itulah sebabnya D salah.',
        en:'Elemental sulphur = <b>0</b>. In SO₂: S + 2(−2) = 0 → <b>+4</b>. In SO₃: S + 3(−2) = 0 → <b>+6</b>. In H₂SO₄: 2(+1) + S + 4(−2) = 0 → <b>+6</b> again. Note the last stage is only the addition of water, so the oxidation number does <b>not</b> change — which is why D is wrong.' } },

  { n:26, topic:'POLYMER',
    q:{ bm:'Getah sintetik mengambil masa yang sangat lama untuk terurai dan menyukarkan proses pelupusan. Antara langkah berikut, yang manakah paling berkesan dalam menangani masalah pelupusan getah sintetik?',
        en:'Synthetic rubber takes a very long time to decompose, making disposal difficult. Which of the following measures is most effective in addressing the problem of synthetic rubber disposal?' },
    o:[ {bm:'Bakar secara terbuka',en:'Burn openly'},
        {bm:'Buang di tempat pelupusan sampah',en:'Dispose of it in a landfill'},
        {bm:'Tanam di tempat yang dikhususkan',en:'Bury it in a specific area'},
        {bm:'Guna sebagai bahan api untuk menjana elektrik',en:'Use it as fuel to generate electricity'} ],
    a:3,
    w:{ bm:'B dan C hanya <b>memindahkan</b> masalah — getah itu tetap tidak terurai. Pembakaran terbuka (A) membebaskan gas beracun tanpa sebarang faedah. Menggunakannya sebagai bahan api dalam loji terkawal <b>menghapuskan</b> sisa itu sambil memulihkan tenaga daripadanya, dengan penapis mengawal pelepasan.',
        en:'B and C merely <b>relocate</b> the problem — the rubber still does not decompose. Open burning (A) releases toxic gases for no benefit. Using it as fuel in a controlled plant <b>eliminates</b> the waste while recovering energy from it, with scrubbers controlling the emissions.' } },

  { n:27, topic:'THERMO',
    q:{ bm:'Pek sejuk mengandungi bahan kimia yang bertindak balas untuk menyerap haba. Bahan manakah yang digunakan dalam pek sejuk?',
        en:'Cold packs contain chemicals that react to absorb heat. Which material is used in cold packs?' },
    o:[ {bm:'Ammonium nitrat',en:'Ammonium nitrate'}, {bm:'Magnesium sulfat',en:'Magnesium sulphate'},
        {bm:'Natrium karbonat',en:'Sodium carbonate'}, {bm:'Kalsium klorida',en:'Calcium chloride'} ],
    a:0,
    w:{ bm:'Pek sejuk memerlukan proses <b>endotermik</b>. Pelarutan ammonium nitrat dalam air menyerap haba dengan ketara, jadi beg itu menjadi sejuk. Kalsium klorida sebaliknya — pelarutannya <b>eksotermik</b>, dan itulah yang digunakan dalam pek <i>panas</i>.',
        en:'A cold pack needs an <b>endothermic</b> process. Dissolving ammonium nitrate in water absorbs a lot of heat, so the bag turns cold. Calcium chloride does the opposite — its dissolution is <b>exothermic</b>, which is what <i>hot</i> packs use.' } },

  { n:28, topic:'CONSUMER',
    q:{ bm:'Antara berikut, yang manakah penggunaan yang betul ginseng (Panax ginseng) dalam perubatan tradisional?<br><br><b>I</b> Mencegah selesema<br><b>II</b> Membantu memanaskan badan<br><b>III</b> Membina pertahanan badan terhadap jangkitan<br><b>IV</b> Merendahkan tekanan darah dan paras kolesterol',
        en:'Which of the following are correct uses of ginseng (Panax ginseng) in traditional medicine?<br><br><b>I</b> Prevents flu<br><b>II</b> Helps keep the body warm<br><b>III</b> Builds immunity against infections<br><b>IV</b> Lowers blood pressure and cholesterol levels' },
    o:[ {bm:'I dan III',en:'I and III'}, {bm:'I dan IV',en:'I and IV'},
        {bm:'II dan III',en:'II and III'}, {bm:'III dan IV',en:'III and IV'} ],
    a:3,
    w:{ bm:'Ginseng secara tradisinya digunakan untuk <b>meningkatkan sistem imun</b> (III) serta <b>merendahkan tekanan darah dan kolesterol</b> (IV). Ia tidak <i>mencegah</i> selesema (I) — paling banyak ia menyokong daya tahan badan — dan memanaskan badan (II) ialah sifat halia, bukan ginseng.',
        en:'Ginseng is traditionally used to <b>boost the immune system</b> (III) and to <b>lower blood pressure and cholesterol</b> (IV). It does not <i>prevent</i> flu (I) — at most it supports resistance — and warming the body (II) is a property of ginger, not ginseng.' } },

  { n:29, topic:'BOND',
    q:{ bm:'Antara pasangan yang berikut, zarah manakah yang terbentuk daripada ikatan datif?',
        en:'Among the following pairs, which particles are formed from a dative bond?' },
    o:[ {bm:'Set I: H₃O⁺ &nbsp;·&nbsp; Set II: NO₃⁻',      en:'Set I: H₃O⁺ &nbsp;·&nbsp; Set II: NO₃⁻'},
        {bm:'Set I: NH₄⁺ &nbsp;·&nbsp; Set II: H₃O⁺',      en:'Set I: NH₄⁺ &nbsp;·&nbsp; Set II: H₃O⁺'},
        {bm:'Set I: NO₃⁻ &nbsp;·&nbsp; Set II: CH₃COO⁻',   en:'Set I: NO₃⁻ &nbsp;·&nbsp; Set II: CH₃COO⁻'},
        {bm:'Set I: CH₃COO⁻ &nbsp;·&nbsp; Set II: NH₄⁺',   en:'Set I: CH₃COO⁻ &nbsp;·&nbsp; Set II: NH₄⁺'} ],
    a:1,
    w:{ bm:'Ikatan datif terbentuk apabila satu atom menderma <b>kedua-dua</b> elektron dalam pasangan yang dikongsi. NH₃ menderma pasangan elektron tunggalnya kepada H⁺ → <b>NH₄⁺</b>, dan H₂O berbuat sama → <b>H₃O⁺</b>. Kedua-dua ini mesti wujud bersama dalam jawapan, dan hanya B mempunyai kedua-duanya.',
        en:'A dative bond forms when one atom donates <b>both</b> electrons of the shared pair. NH₃ donates its lone pair to H⁺ → <b>NH₄⁺</b>, and H₂O does the same → <b>H₃O⁺</b>. Both must appear together in the answer, and only B has both.' } },

  { n:30, topic:'ACID',
    q:{ bm:'Antara pasangan yang berikut, yang manakah merupakan bahan tindak balas dalam tindak balas peneutralan?<br><br><b>I</b> Asid nitrik dan larutan kalium hidroksida<br><b>II</b> Asid sulfurik dan pepejal kalsium karbonat<br><b>III</b> Asid sulfurik dan pepejal kuprum(II) oksida<br><b>IV</b> Asid hidroklorik dan larutan natrium karbonat',
        en:'Which of the following pairs are reactants in a neutralisation reaction?<br><br><b>I</b> Nitric acid and potassium hydroxide solution<br><b>II</b> Sulphuric acid and solid calcium carbonate<br><b>III</b> Sulphuric acid and solid copper(II) oxide<br><b>IV</b> Hydrochloric acid and sodium carbonate solution' },
    o:[ {bm:'I dan II',en:'I and II'}, {bm:'I dan III',en:'I and III'},
        {bm:'II dan IV',en:'II and IV'}, {bm:'III dan IV',en:'III and IV'} ],
    a:1,
    w:{ bm:'Peneutralan bermaksud asid + <b>bes atau alkali</b> → garam + air <b>sahaja</b>. I ialah asid + alkali ✓ dan III ialah asid + oksida logam (satu bes) ✓. II dan IV melibatkan <b>karbonat</b>, yang juga menghasilkan karbon dioksida — itu tindak balas asid-karbonat, bukan peneutralan.',
        en:'Neutralisation means acid + <b>base or alkali</b> → salt + water <b>only</b>. I is acid + alkali ✓ and III is acid + a metal oxide (a base) ✓. II and IV involve <b>carbonates</b>, which also give off carbon dioxide — that is an acid-carbonate reaction, not neutralisation.' } },

  { n:31, topic:'THERMO', img:'img/kimia/25059063325c.webp',
    alt:{ bm:'Rajah 7: aras tenaga W + X di bawah, Y + Z di atas, ΔH = +Q kJ mol⁻¹.',
          en:'Diagram 7: energy level of W + X below, Y + Z above, ΔH = +Q kJ mol⁻¹.' },
    q:{ bm:'Rajah 7 menunjukkan satu rajah aras tenaga. Apakah maklumat yang dapat diperolehi daripada Rajah 7?',
        en:'Diagram 7 shows an energy level diagram. What information can be obtained from Diagram 7?' },
    o:[ {bm:'Pemutusan ikatan antara zarah-zarah W dan X membebaskan haba yang tinggi',
         en:'The breaking of the bond between particles W and X releases a lot of heat'},
        {bm:'Pelanggaran antara zarah-zarah W dan X membebaskan haba menyebabkan suhu persekitaran meningkat',
         en:'The collision between particles W and X releases heat, causing the temperature of the surroundings to increase'},
        {bm:'Jumlah kandungan tenaga dalam W dan X lebih tinggi daripada kandungan tenaga dalam Y dan Z',
         en:'The total energy content in W and X is higher than in Y and Z'},
        {bm:'Haba yang diserap semasa pemutusan ikatan dalam W dan X lebih tinggi berbanding haba yang dibebaskan dalam Y dan Z semasa pembentukan ikatan',
         en:'The heat absorbed breaking bonds in W and X is higher than the heat released forming bonds in Y and Z'} ],
    a:3,
    w:{ bm:'ΔH ialah <b>positif</b> (+Q) dan hasil Y + Z berada <b>di atas</b> bahan tindak balas → tindak balas <b>endotermik</b>. Maka haba diserap, bukan dibebaskan (A dan B salah), dan kandungan tenaga hasil lebih <b>tinggi</b>, bukan lebih rendah (C terbalik). Hanya D menerangkan imbangan tenaga endotermik dengan betul.',
        en:'ΔH is <b>positive</b> (+Q) and the products Y + Z sit <b>above</b> the reactants → the reaction is <b>endothermic</b>. So heat is absorbed, not released (A and B wrong), and the products’ energy content is <b>higher</b>, not lower (C reversed). Only D states the endothermic energy balance correctly.' } },

  { n:32, topic:'INDUSTRY',
    q:{ bm:'Antara yang berikut, bahan manakah yang digunakan dalam implan gigi?',
        en:'Which of the following substances is used in tooth implants?' },
    o:[ {bm:'Seramik zirkonia',en:'Zirconia ceramic'}, {bm:'Seramik alumina',en:'Alumina ceramic'},
        {bm:'Silikon karbida',en:'Silicon carbide'},   {bm:'Silikon nitrida',en:'Silicon nitride'} ],
    a:0,
    w:{ bm:'<b>Seramik zirkonia</b> bersifat bioserasi (tidak ditolak oleh tisu badan), sangat kuat dan berwarna putih seperti gigi asli — jadi ia menjadi bahan pilihan untuk implan gigi. Silikon karbida dan silikon nitrida ialah seramik <b>industri</b> untuk alat pemotong dan galas.',
        en:'<b>Zirconia ceramic</b> is biocompatible (the body’s tissue does not reject it), very strong, and tooth-white in colour — which makes it the material of choice for dental implants. Silicon carbide and silicon nitride are <b>industrial</b> ceramics for cutting tools and bearings.' } },

  { n:33, topic:'CARBON', img:'img/kimia/d2939b959a40.webp',
    alt:{ bm:'Rajah 11: formula struktur ester dengan tiga karbon pada setiap bahagian.',
          en:'Diagram 11: structural formula of an ester with three carbons on each side.' },
    q:{ bm:'Rajah 11 menunjukkan formula struktur bagi sebatian Y. Pasangan manakah yang bertindak balas menghasilkan sebatian Y?',
        en:'Diagram 11 shows the structural formula of compound Y. Which pair reacts to produce compound Y?' },
    o:[ {bm:'Etanol dan asid butanoik',  en:'Ethanol and butanoic acid'},
        {bm:'Propanol dan asid propanoik',en:'Propanol and propanoic acid'},
        {bm:'Propanol dan asid etanoik',  en:'Propanol and ethanoic acid'},
        {bm:'Etanol dan asid propanoik',  en:'Ethanol and propanoic acid'} ],
    a:1,
    w:{ bm:'Pecahkan ester pada ikatan C(=O)–O. Bahagian <b>asil</b> (yang membawa C=O) mempunyai <b>3</b> karbon → asid propanoik. Bahagian <b>alkil</b> selepas oksigen juga mempunyai <b>3</b> karbon → propanol. Kuncinya ialah sentiasa mengira C=O sebagai sebahagian daripada asid.',
        en:'Split the ester at the C(=O)–O bond. The <b>acyl</b> side (the one carrying the C=O) has <b>3</b> carbons → propanoic acid. The <b>alkyl</b> side after the oxygen also has <b>3</b> carbons → propanol. The key is always to count the C=O as part of the acid.' } },

  { n:34, topic:'RATE', img:'img/kimia/b86b34d99fa3.webp',
    alt:{ bm:'Rajah 8: dua lengkung isi padu oksigen melawan masa; Eksperimen II lebih curam tetapi kedua-duanya mendatar pada isi padu akhir yang sama.',
          en:'Diagram 8: two curves of oxygen volume against time; Experiment II is steeper but both level off at the same final volume.' },
    q:{ bm:'Rajah 8 menunjukkan keputusan Eksperimen I dan Eksperimen II bagi penguraian hidrogen peroksida dengan kehadiran satu mangkin. Eksperimen I menggunakan 100 cm³ larutan hidrogen peroksida 1.0 mol dm⁻³ pada suhu 30 °C. Apakah keadaan yang digunakan dalam Eksperimen II untuk memperolehi lengkung seperti dalam Rajah 8?',
        en:'Diagram 8 shows the results of Experiment I and Experiment II for the decomposition of hydrogen peroxide in the presence of a catalyst. Experiment I used 100 cm³ of 1.0 mol dm⁻³ hydrogen peroxide at 30 °C. What conditions were used in Experiment II to obtain the curve in Diagram 8?' },
    o:[ {bm:'50 cm³ &nbsp;·&nbsp; 0.5 mol dm⁻³ &nbsp;·&nbsp; 25 °C',  en:'50 cm³ &nbsp;·&nbsp; 0.5 mol dm⁻³ &nbsp;·&nbsp; 25 °C'},
        {bm:'50 cm³ &nbsp;·&nbsp; 1.0 mol dm⁻³ &nbsp;·&nbsp; 35 °C',  en:'50 cm³ &nbsp;·&nbsp; 1.0 mol dm⁻³ &nbsp;·&nbsp; 35 °C'},
        {bm:'100 cm³ &nbsp;·&nbsp; 0.5 mol dm⁻³ &nbsp;·&nbsp; 25 °C', en:'100 cm³ &nbsp;·&nbsp; 0.5 mol dm⁻³ &nbsp;·&nbsp; 25 °C'},
        {bm:'100 cm³ &nbsp;·&nbsp; 1.0 mol dm⁻³ &nbsp;·&nbsp; 35 °C', en:'100 cm³ &nbsp;·&nbsp; 1.0 mol dm⁻³ &nbsp;·&nbsp; 35 °C'} ],
    a:3,
    w:{ bm:'Baca graf itu dua kali. Lengkung II lebih <b>curam</b> → kadar lebih tinggi → suhu mesti lebih tinggi (35 °C). Tetapi kedua-dua lengkung mendatar pada <b>isi padu akhir yang sama</b> → bilangan mol H₂O₂ mesti <b>sama</b> → isi padu dan kemolaran kekal 100 cm³ dan 1.0 mol dm⁻³. Hanya D memenuhi kedua-dua syarat.',
        en:'Read the graph twice. Curve II is <b>steeper</b> → a higher rate → the temperature must be higher (35 °C). But both curves level off at the <b>same final volume</b> → the moles of H₂O₂ must be <b>identical</b> → the volume and molarity stay at 100 cm³ and 1.0 mol dm⁻³. Only D satisfies both.' } },

  { n:35, topic:'CARBON', img:'img/kimia/fa1c920c5377.webp',
    alt:{ bm:'Pilihan A hingga D: empat formula struktur berlainan.',
          en:'Options A to D: four different structural formulae.' },
    q:{ bm:'Antara yang berikut, formula struktur manakah yang menunjukkan 3-metilbut-1-ena?',
        en:'Which of the following structural formulae shows 3-methylbut-1-ene?' },
    o:[ {bm:'Rajah A',en:'Structure A'}, {bm:'Rajah B',en:'Structure B'},
        {bm:'Rajah C',en:'Structure C'}, {bm:'Rajah D',en:'Structure D'} ],
    a:1,
    w:{ bm:'Pecahkan namanya: “but” = rantai <b>4</b> karbon, “-1-ena” = ikatan ganda dua bermula pada karbon <b>1</b>, “3-metil” = cabang CH₃ pada karbon <b>3</b>. Maka strukturnya ialah CH₂=CH–CH(CH₃)–CH₃, iaitu struktur B. Struktur lain meletakkan ikatan ganda dua atau cabang metil pada kedudukan yang salah.',
        en:'Unpack the name: “but” = a <b>4</b>-carbon chain, “-1-ene” = the double bond starts at carbon <b>1</b>, “3-methyl” = a CH₃ branch on carbon <b>3</b>. So the structure is CH₂=CH–CH(CH₃)–CH₃, which is structure B. The others put the double bond or the methyl branch in the wrong position.' } },

  { n:36, topic:'PTABLE',
    q:{ bm:'Jadual 2 menunjukkan sifat oksida bagi unsur R, S dan T yang terletak dalam Kala 3. Apakah susunan unsur R, S dan T dari kiri ke kanan Kala 3 dalam Jadual Berkala Unsur?'+
           '<table><tr><th>Unsur / Element</th><th>Sifat oksida / Property of the oxide</th></tr>'+
           '<tr><td>R</td><td>Bertindak balas dengan asid nitrik; tidak bertindak balas dengan larutan natrium hidroksida<br><i>Reacts with nitric acid; does not react with sodium hydroxide solution</i></td></tr>'+
           '<tr><td>S</td><td>Bertindak balas dengan larutan natrium hidroksida; tidak bertindak balas dengan asid nitrik<br><i>Reacts with sodium hydroxide solution; does not react with nitric acid</i></td></tr>'+
           '<tr><td>T</td><td>Bertindak balas dengan larutan natrium hidroksida <b>dan</b> asid nitrik<br><i>Reacts with sodium hydroxide solution <b>and</b> nitric acid</i></td></tr></table><span class="fig">JADUAL 2 · TABLE 2</span>',
        en:'Table 2 shows the properties of the oxides of elements R, S and T located in Period 3. What is the arrangement of elements R, S and T from left to right in Period 3 of the Periodic Table?'+
           '<table><tr><th>Unsur / Element</th><th>Sifat oksida / Property of the oxide</th></tr>'+
           '<tr><td>R</td><td>Bertindak balas dengan asid nitrik; tidak bertindak balas dengan larutan natrium hidroksida<br><i>Reacts with nitric acid; does not react with sodium hydroxide solution</i></td></tr>'+
           '<tr><td>S</td><td>Bertindak balas dengan larutan natrium hidroksida; tidak bertindak balas dengan asid nitrik<br><i>Reacts with sodium hydroxide solution; does not react with nitric acid</i></td></tr>'+
           '<tr><td>T</td><td>Bertindak balas dengan larutan natrium hidroksida <b>dan</b> asid nitrik<br><i>Reacts with sodium hydroxide solution <b>and</b> nitric acid</i></td></tr></table><span class="fig">JADUAL 2 · TABLE 2</span>' },
    o:[ {bm:'T, R, S',en:'T, R, S'}, {bm:'S, T, R',en:'S, T, R'},
        {bm:'R, S, T',en:'R, S, T'}, {bm:'R, T, S',en:'R, T, S'} ],
    a:3,
    w:{ bm:'Kelaskan setiap oksida dahulu. R bertindak balas dengan asid sahaja → oksida <b>bes</b> → logam, di sebelah <b>kiri</b>. S bertindak balas dengan alkali sahaja → oksida <b>berasid</b> → bukan logam, di sebelah <b>kanan</b>. T bertindak balas dengan kedua-duanya → oksida <b>amfoterik</b> (Al₂O₃) → di <b>tengah</b>. Susunan kiri ke kanan: R, T, S.',
        en:'Classify each oxide first. R reacts with acid only → a <b>basic</b> oxide → a metal, on the <b>left</b>. S reacts with alkali only → an <b>acidic</b> oxide → a non-metal, on the <b>right</b>. T reacts with both → an <b>amphoteric</b> oxide (Al₂O₃) → in the <b>middle</b>. Left to right: R, T, S.' } },

  { n:37, topic:'REDOX', img:'img/kimia/9c7d262c4adf.webp',
    alt:{ bm:'Rajah 9: tabung U dengan elektrod karbon X dalam larutan P dan elektrod karbon Y dalam larutan Q, disambung kepada galvanometer yang jarumnya terpesong.',
          en:'Diagram 9: a U-tube with carbon electrode X in solution P and carbon electrode Y in solution Q, connected to a galvanometer whose needle deflects.' },
    q:{ bm:'Rajah 9 menunjukkan susunan radas eksperimen bagi mengkaji pemindahan elektron bagi satu jarak. Antara pasangan berikut, yang manakah akan menghasilkan keputusan seperti Rajah 9?',
        en:'Diagram 9 shows the apparatus to study the transfer of electrons at a distance. Which of the following pairs will produce results as in Diagram 9?' },
    o:[ {bm:'P: Kalium manganat(VII) berasid &nbsp;·&nbsp; Q: Kalium iodida',
         en:'P: Acidified potassium manganate(VII) &nbsp;·&nbsp; Q: Potassium iodide'},
        {bm:'P: Kalium bromida &nbsp;·&nbsp; Q: Ferum(II) sulfat',
         en:'P: Potassium bromide &nbsp;·&nbsp; Q: Iron(II) sulphate'},
        {bm:'P: Ferum(II) sulfat &nbsp;·&nbsp; Q: Air bromin',
         en:'P: Iron(II) sulphate &nbsp;·&nbsp; Q: Bromine water'},
        {bm:'P: Air klorin &nbsp;·&nbsp; Q: Kalium dikromat(VI) berasid',
         en:'P: Chlorine water &nbsp;·&nbsp; Q: Acidified potassium dichromate(VI)'} ],
    a:2,
    w:{ bm:'Untuk memesongkan jarum galvanometer, satu larutan mesti mengandungi <b>agen penurunan</b> dan satu lagi <b>agen pengoksidaan</b>, supaya elektron mengalir melalui wayar. Hanya C mempunyai pasangan itu: Fe²⁺ (agen penurunan, teroksida kepada Fe³⁺) dengan air bromin (agen pengoksidaan). B mempunyai dua agen penurunan, dan D mempunyai dua agen pengoksidaan — tiada pemindahan elektron berlaku.',
        en:'To deflect the galvanometer needle, one solution must hold a <b>reducing agent</b> and the other an <b>oxidising agent</b>, so electrons flow through the wire. Only C is such a pair: Fe²⁺ (a reducing agent, oxidised to Fe³⁺) with bromine water (an oxidising agent). B has two reducing agents and D has two oxidising agents — no electron transfer happens.' } },

  { n:38, topic:'ACID', img:'img/kimia/01a65c9caa9d.webp',
    note:'The stem asks for "X" while the diagram labels the metal "Q" — a labelling inconsistency in the source paper. They refer to the same metal.',
    alt:{ bm:'Rajah 10: Tindak balas I — larutan QNO₃ + garam biasa → mendakan putih. Tindak balas II — 5.0 g serbuk Q + asid etanoik → 5.0 g serbuk Q kekal.',
          en:'Diagram 10: Reaction I — QNO₃ solution + table salt → white precipitate. Reaction II — 5.0 g of Q powder + ethanoic acid → 5.0 g of Q powder remains.' },
    q:{ bm:'Rajah 10 menunjukkan dua tindak balas kimia yang melibatkan logam Q. Apakah Q?',
        en:'Diagram 10 shows two chemical reactions involving metal Q. What is Q?' },
    o:[ {bm:'Argentum',en:'Silver'}, {bm:'Kalsium',en:'Calcium'},
        {bm:'Kuprum',en:'Copper'},   {bm:'Plumbum',en:'Lead'} ],
    a:0,
    w:{ bm:'Gunakan kedua-dua petunjuk. Tindak balas I: formula <b>QNO₃</b> menunjukkan Q membentuk ion <b>monovalen</b> (Q⁺), dan dengan ion klorida ia memberi <b>mendakan putih</b> → AgCl. Itu menyingkirkan kuprum dan plumbum (kedua-duanya membentuk ion 2+). Tindak balas II: jisim serbuk kekal 5.0 g → Q <b>tidak bertindak balas</b> dengan asid, jadi ia di bawah hidrogen dalam siri kereaktifan — menyingkirkan kalsium yang sangat reaktif. Tinggal argentum.',
        en:'Use both clues. Reaction I: the formula <b>QNO₃</b> shows Q forms a <b>monovalent</b> ion (Q⁺), and with chloride ions it gives a <b>white precipitate</b> → AgCl. That rules out copper and lead (both form 2+ ions). Reaction II: the powder’s mass stays at 5.0 g → Q does <b>not react</b> with acid, so it sits below hydrogen in the reactivity series — ruling out the very reactive calcium. Silver is what remains.' } },

  { n:39, topic:'RATE',
    q:{ bm:'Pernyataan di bawah berkaitan dengan teori perlanggaran bagi satu tindak balas. Kombinasi yang manakah menerangkan kesan apabila suhu bahan tindak balas ditingkatkan?<br><br><b>I</b> Lebih banyak zarah hasil tindak balas yang berlanggar mencapai tenaga pengaktifan<br><b>II</b> Frekuensi perlanggaran berkesan antara zarah bahan tindak balas meningkat<br><b>III</b> Bilangan zarah bahan tindak balas per unit isi padu bertambah<br><b>IV</b> Tenaga kinetik zarah bahan tindak balas bertambah',
        en:'The statements below relate to the collision theory of a reaction. Which combination explains the effect when the temperature of the reactants is increased?<br><br><b>I</b> More colliding product particles reach the activation energy<br><b>II</b> The effective collision frequency between reactant particles increases<br><b>III</b> The number of reactant particles per unit volume increases<br><b>IV</b> The kinetic energy of the reactant particles increases' },
    o:[ {bm:'I dan II',en:'I and II'}, {bm:'I dan III',en:'I and III'},
        {bm:'II dan IV',en:'II and IV'}, {bm:'III dan IV',en:'III and IV'} ],
    a:2,
    w:{ bm:'Suhu yang lebih tinggi memberi zarah lebih banyak <b>tenaga kinetik</b> (IV), maka lebih banyak perlanggaran mencapai tenaga pengaktifan dan <b>frekuensi perlanggaran berkesan meningkat</b> (II). Pernyataan I menyebut zarah <b>hasil</b> — sepatutnya zarah bahan tindak balas. Pernyataan III (bilangan zarah per unit isi padu) ialah kesan <b>kepekatan</b>, bukan suhu.',
        en:'A higher temperature gives the particles more <b>kinetic energy</b> (IV), so more collisions reach the activation energy and the <b>effective collision frequency rises</b> (II). Statement I says <b>product</b> particles — it should be reactant particles. Statement III (particles per unit volume) is a <b>concentration</b> effect, not a temperature one.' } },

  { n:40, topic:'THERMO',
    q:{ bm:'Apabila serbuk zink berlebihan ditambah kepada 25 cm³ larutan kuprum(II) sulfat 0.2 mol dm⁻³, suhu meningkat daripada 30 °C kepada 40 °C. Berapakah haba penyesaran bagi kuprum?<br><span class="fig">[Muatan haba tentu larutan: 4.2 J g⁻¹ °C⁻¹; ketumpatan larutan = 1 g cm⁻³]</span>',
        en:'When excess zinc powder is added to 25 cm³ of 0.2 mol dm⁻³ copper(II) sulphate solution, the temperature increases from 30 °C to 40 °C. What is the heat of displacement of copper?<br><span class="fig">[Specific heat capacity of the solution: 4.2 J g⁻¹ °C⁻¹; density of the solution = 1 g cm⁻³]</span>' },
    o:[ {bm:'−21 kJ mol⁻¹',en:'−21 kJ mol⁻¹'},   {bm:'−42 kJ mol⁻¹',en:'−42 kJ mol⁻¹'},
